        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\"><B><A NAME=\"toc374207_7\"></A>DESCRIPTION OF
        SECURITIES SELLING STOCKHOLDER MAY OFFER </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">This
        prospectus relates to the resale of up to an aggregate of 500,000 shares of
        our common stock, par value $0.0001 per share, by the Selling\nStockholder
        identified in this prospectus. The following information describes our common
        stock and preferred stock, as well as certain provisions of our amended and
        restated certificate of incorporation and amended and restated bylaws. This\ndescription
        is only a summary. You should also refer to our amended and restated certificate
        of incorporation, as amended, and our amended and restated bylaws, as amended,
        which have been filed with the SEC as exhibits to our registration statement,\nof
        which this prospectus forms a part. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B>General </B></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        authorized capital stock consists of 100,000,000&nbsp;shares of common stock,
        with a $0.0001&nbsp;par value per share, and\n10,000,000&nbsp;shares of preferred
        stock, with a $0.0001&nbsp;par value per share, all of which shares of preferred
        stock are undesignated. Our board of directors may establish the rights and
        preferences of the preferred stock from time to time. As\nof June&nbsp;15,
        2022, there were 18,945,840 shares of common stock issued and outstanding,
        held of record by approximately 113 stockholders, including shares of our
        common stock purchased by the Selling Stockholder in connection with the Private\nPlacement,
        although we believe that there may be a significantly larger number of beneficial
        owners of our common stock. We derived the number of stockholders by reviewing
        the listing of outstanding common stock recorded by our transfer agent as
        of\nJune&nbsp;15, 2022. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B>Common Stock </B></P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The holders of common stock are entitled to
        one vote per share on all matters to be voted upon by the stockholders. The
        holders of common stock\nare entitled to receive ratably such dividends, if
        any, as may be declared from time to time by the board of directors out of
        funds legally available, subject to preferences that may be applicable to
        preferred stock, if any, then outstanding. In the\nevent of a liquidation,
        dissolution or winding up of our Company, the holders of common stock are
        entitled to share ratably in all assets remaining after payment of liabilities,
        subject to prior distribution rights of preferred stock, if any, then\noutstanding.
        The common stock has no preemptive or conversion rights or other subscription
        rights. There are no redemption or sinking fund provisions applicable to the
        common stock. All outstanding shares of common stock are fully paid and <FONT\nSTYLE=\"white-space:nowrap\">non-assessable.</FONT>
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The rights, preferences and privileges of the
        holders of our common stock are subject\nto, and may be adversely affected
        by, the rights of the holders of shares of any series of preferred stock that
        we may designate and issue in the future. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        common stock is listed on the Nasdaq Capital Market under the symbol &#147;ATEX.&#148;
        The transfer agent and registrar for our common\nstock is Continental Stock
        Transfer&nbsp;&amp; Trust Company. Its address is 1 State Street 30th Floor,
        New York, NY 10004-1561, and its telephone number is (212) <FONT STYLE=\"white-space:nowrap\">509-4000.</FONT>
        </P>\n<P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>Preferred Stock </B></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">Under the terms
        of our\namended and restated certificate of incorporation, as amended, our
        board of directors is authorized to issue shares of preferred stock in one
        or more series without stockholder approval. Our board of directors has the
        discretion to determine the\nrights, preferences, privileges and restrictions,
        including voting rights, dividend rights, conversion rights, redemption privileges
        and liquidation preferences, of each series of preferred stock. There are
        no restrictions presently on the\nrepurchase or redemption of any shares of
        our preferred stock. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">The issuance of preferred stock
        will affect, and may adversely affect, the\nrights of holders of common stock.
        It is not possible to state the actual effect of the issuance of any shares
        of preferred stock on the rights of holders </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
