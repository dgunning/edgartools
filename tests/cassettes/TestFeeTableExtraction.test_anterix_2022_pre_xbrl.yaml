        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">on any stock
        exchange or automated interdealer quotation system on which the securities
        are traded, in <FONT\nSTYLE=\"white-space:nowrap\"><FONT STYLE=\"white-space:nowrap\">the&nbsp;over-the-counter&nbsp;market,</FONT></FONT>
        or otherwise; </P></TD></TR></TABLE> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
