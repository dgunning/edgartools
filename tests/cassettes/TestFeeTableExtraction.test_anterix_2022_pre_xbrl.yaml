        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\">\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"><a
        href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\"
        align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Broker-dealers may agree with
        the Selling Stockholder to sell a specified number of the\nsecurities at a
        stipulated price per security. If the broker-dealer is unable to sell securities
        acting as agent for the Selling Stockholder, it may purchase as principal
        any unsold securities at the stipulated price. Broker-dealers who acquire\nsecurities
        as principals may thereafter resell the securities from time to time in transactions
        in any stock exchange or automated interdealer quotation system on which the
        securities are then listed or in the <FONT STYLE=\"white-space:nowrap\"><FONT\nSTYLE=\"white-space:nowrap\">over-the-counter</FONT></FONT>
        market, at prices and on terms then prevailing at the time of sale, at prices
        related to the then-current market price, or in negotiated transactions. Broker-dealers
        may use block\ntransactions and sales to and through broker-dealers, including
        transactions of the nature described above. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">From
        time to time, the\nSelling Stockholder may pledge, hypothecate or grant a
        security interest in some or all of the securities owned by it. The pledgees,
        secured parties, or persons to whom the securities have been so pledged or
        hypothecated (or otherwise subject to a\nsecurity interest) will, upon foreclosure
        in the event of default, be deemed to be a selling stockholder for purposes
        of this prospectus. The plan of distribution for that selling stockholder&#146;s
        securities will otherwise remain unchanged. The\nSelling Stockholder (or its
        pledgees, distributees or <FONT STYLE=\"white-space:nowrap\">other&nbsp;non-sale&nbsp;related</FONT>
        transferees, or other successors in interest) also may transfer and donate
        the securities in other circumstances in which\ncase the successive pledgees,
        distributees or <FONT STYLE=\"white-space:nowrap\">other&nbsp;non-sale&nbsp;related</FONT>
        transferees or other successors in interest thereof will be the Selling Stockholder
        for purposes of this prospectus and, if\nrequired under the Securities Act,
        will be identified in a prospectus supplement. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">In
        addition, the Selling Stockholder may, from time to\ntime, sell the securities
        short, and, in those instances, this prospectus may be delivered in connection
        with the short sales and the securities offered under this prospectus may
        be used to cover short sales. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">To the extent
        required under the Securities Act, the aggregate amount of Selling Stockholder&#146;s
        securities being offered and the terms of\nthe offering, the names of any
        agents, brokers, dealers or underwriters and any applicable commission with
        respect to a particular offer will be set forth in an accompanying prospectus
        supplement. Any underwriters, dealers, brokers or agents\nparticipating in
        the distribution of the securities may receive compensation in the form of
        underwriting discounts, concessions, commissions or fees from the Selling
        Stockholder and/or purchasers of Selling Stockholder&#146;s securities, for
        whom\nthey may act (which compensation as to a particular broker-dealer might
        be in excess of customary commissions). </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The Selling
        Stockholder\nand any underwriters, brokers, dealers or agents that participate
        in the distribution of the securities may be deemed to be &#147;underwriters&#148;
        within the meaning of the Securities Act, and any discounts, concessions,
        commissions or fees\nreceived by them and any profit on the resale of the
        securities sold by them may be deemed to be underwriting discounts and commissions.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The Selling Stockholder may enter into hedging
        transactions with broker-dealers and the broker-dealers may engage in short
        sales of the\nsecurities in the course of hedging the positions they assume
        with that Selling Stockholder, including, without limitation, in connection
        with distributions of the securities by those broker-dealers. The Selling
        Stockholder may enter into options or\nother transactions with broker-dealers
        that involve the delivery of the securities offered hereby to the broker-dealers,
        who may then resell or otherwise transfer those securities. The Selling Stockholder
        may also loan or pledge the securities\noffered hereby to a broker-dealer
        and the broker-dealer may sell the securities offered hereby so loaned or
        upon a default may sell or otherwise transfer the pledged securities offered
        hereby. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">The Selling Stockholder may
        also sell the securities in accordance with Rule 144 under the Securities
        Act, or in accordance with\nSection&nbsp;4(a)(1) of the Securities Act, rather
        than pursuant to this prospectus, regardless of whether the securities are
        covered by this prospectus. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">To comply with
        the securities laws of some states, if applicable, the securities may be sold
        in these jurisdictions only through registered or\nlicensed brokers or dealers.
        In addition, in some states the securities may not be sold unless they have
        been registered or qualified for sale or an exemption from registration or
        qualification requirements is available and is complied with. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">14 </P>\n\n</DIV></Center>\n\n\n<p
