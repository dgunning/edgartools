        align=\"left\">\n\n<div style =\"BORDER-BOTTOM:1.00pt solid #000000;BORDER-LEFT:1.00pt
        solid #000000;BORDER-RIGHT:1.00pt solid #000000;BORDER-TOP:1.00pt solid #000000;MARGIN-LEFT:0px;
        MARGIN-RIGHT:0px;max-width:100%\"><div style=\"width:97%; margin-top:1.5%;
        margin-bottom:1.5%; margin-left:1.5%; margin-right:-1.25%\">\n\n <P STYLE=\"margin-top:0pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B><A
        NAME=\"toc374207_2\"></A>PROSPECTUS SUMMARY </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\"><I>This
        summary description about us and our business highlights selected information
        contained elsewhere in this prospectus or incorporated\nin this prospectus
        by reference. This summary does not contain all of the information you should
        consider before buying securities in this offering. You should carefully read
        this entire prospectus and any applicable prospectus supplement, including\neach
        of the documents incorporated herein or therein by reference, before making
        an investment decision. As used in this prospectus, &#147;we,&#148; &#147;us,&#148;
        &#147;Anterix,&#148; &#147;our,&#148; and &#147;the Company&#148; refer to
        Anterix\nInc., a Delaware corporation. </I></P> <P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Overview
        </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">We are a wireless communications company focused
        on commercializing our spectrum assets to enable our targeted utility and
        critical\ninfrastructure customers to deploy private broadband networks, technologies
        and solutions. We are the largest holder of licensed spectrum in the 900 MHz
        band\n<FONT STYLE=\"white-space:nowrap\"><FONT STYLE=\"white-space:nowrap\">(896-901/935-940</FONT></FONT>
        MHz) with nationwide coverage throughout the contiguous United States, Hawaii,
        Alaska and Puerto Rico.&nbsp;On May&nbsp;13, 2020, the Federal\nCommunications
        Commission (&#147;FCC&#148;) made a historic approval of&nbsp;the Report and
        Order to modernize and realign the 900 MHz band to increase its usability
        and capacity by allowing it to be utilized for the deployment of broadband\nnetworks,
        technologies and solutions (the &#147;Report and Order&#148;). The Report
        and Order was published in the Federal Register on July&nbsp;16, 2020 and
        became effective on August&nbsp;17, 2020. We are now engaged in qualifying
        for and securing\nbroadband licenses from the FCC. At the same time, we are&nbsp;actively
        pursuing opportunities to lease the broadband spectrum we secure to our targeted
        utility and critical infrastructure customers. </P>\n<P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Private
        Placement and Related Transactions </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">On September&nbsp;8,
        2014, in connection with a Spectrum Rights Agreement we entered into with
        Motorola Solutions, Inc. (&#147;Motorola&#148;),\nwe entered into a Membership
        Interest Purchase Agreement (the &#147;Purchase Agreement&#148;) with Motorola,
        pursuant to which Motorola invested $10.0&nbsp;million in our Company to purchase
        500,000 Class&nbsp;B Units of our Subsidiary at a price\nequal to $20.00 per
        Class&nbsp;B Unit.&nbsp;Pursuant to the terms of the Purchase Agreement, Motorola
        had the right to convert its 500,000 Class&nbsp;B Units into 500,000 shares
        of our common stock at any time. Motorola&#146;s conversion ratio from\nClass&nbsp;B
        Units to shares of our common stock was fixed on a <FONT STYLE=\"white-space:nowrap\"><FONT
        STYLE=\"white-space:nowrap\">one-for-one</FONT></FONT> basis.</P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">On
        May&nbsp;18, 2022, Motorola exercised its right to convert its 500,000 Class&nbsp;B
        Units into 500,000 shares of our common stock. The\nshares of our common stock
        were issued without registration under the Securities Act in reliance on the
        exemptions provided by Section&nbsp;4(a)(2) of the Securities Act as transactions
        not involving a public offering and Rule 506 promulgated under\nthe Securities
        Act as sales to accredited investors, and in reliance on similar exemptions
        under applicable state laws. The Purchase Agreement provides that, upon conversion
        of the Class&nbsp;B Units into shares of our common stock, we were\nobligated
        to provide the same registration rights under the terms and conditions set
        forth under the Registration Rights Agreement we entered into on June&nbsp;10,
        2014 (the &#147;Registration Rights Agreement&#148;) with certain other investors.\n</P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">For more information regarding the number of
        shares of our common stock issued (or issuable) to the Selling Stockholder
        pursuant to the\nPrivate Placement, see the section entitled &#147;<I>Selling
        Stockholder</I>&#148; beginning on page 8 of this prospectus. </P>\n</div></div>\n\n
