        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">We have no present plans to issue any shares
        of preferred stock nor are any shares of our preferred stock presently outstanding.
        Preferred\nstock will be fully paid and nonassessable upon issuance. </P>
        <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>Possible Anti-Takeover Effects of Delaware Law and our Amended
        and Restated Certificate of\nIncorporation, as Amended, and Amended and Restated
        Bylaws, as Amended </B></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">Provisions of
        the Delaware General Corporation Law (the\n&#147;DGCL&#148;) and our amended
        and restated certificate of incorporation and amended and restated bylaws
        could make it more difficult to acquire the Company by means of a tender offer,
        a proxy contest or otherwise, or to remove incumbent officers\nand directors.
        These provisions, summarized below, are expected to discourage certain types
        of coercive takeover practices and takeover bids that our board of directors
        may consider inadequate and to encourage persons seeking to acquire control
        of\nthe company to first negotiate with our board of directors. We believe
        that the benefits of increased protection of our ability to negotiate with
        the proponent of an unfriendly or unsolicited proposal to acquire or restructure
        the company outweigh\nthe disadvantages of discouraging takeover or acquisition
        proposals because, among other things, negotiation of these proposals could
        result in an improvement of their terms. </P>\n<P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><I>Amendment
        </I></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Our amended and restated\ncertificate of incorporation
        and our amended and restated bylaws provide that the affirmative vote of the
        holders of at least 66 2/3% of our voting stock then outstanding is required
        to amend certain provisions relating to the&nbsp;required vote at\nstockholder
        meetings,&nbsp;action by&nbsp;written consent of&nbsp;stockholders,&nbsp;stockholder
        notice procedures, required vote for directors, qualification,&nbsp;number,&nbsp;term,
        election,&nbsp;removal&nbsp;and remuneration&nbsp;of our\ndirectors, the calling
        of special meetings of stockholders and the indemnification of directors.</P>
        <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><I>Size of Board and Vacancies </I></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        amended and restated bylaws provide that the number of directors on our&nbsp;board
        of&nbsp;directors is fixed exclusively by our&nbsp;board\nof&nbsp;directors.
        Newly created directorships resulting from any increase in our authorized
        number of directors and any vacancies in our&nbsp;board of&nbsp;directors
        resulting from death, resignation, retirement, disqualification, removal from\noffice
        or other cause will be filled generally by&nbsp;either (i)&nbsp;the majority
        vote of our remaining directors in office, even if less than a quorum is present,
        or (ii)&nbsp;the stockholders holding a majority of the voting power of all
        of the\nthen outstanding shares of capital stock of the Company authorized
        to vote on such action at a duly called annual meeting or special meeting
        of stockholders. </P>\n<P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><I>Special Stockholder Meetings </I></P> <P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Our amended\nand restated certificate of incorporation
        provides that only the Chairman of our&nbsp;board of&nbsp;directors,&nbsp;a
        presiding director,&nbsp;our Chief Executive Officer or&nbsp;by a majority
        of&nbsp;our board of&nbsp;directors&nbsp;then in\noffice&nbsp;may call special
        meetings of our stockholders. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><I>Stockholder Action by Unanimous
        Written Consent </I></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Our amended and restated certificate
        of incorporation expressly eliminates the right of our stockholders to act
        by written consent other than\nby unanimous written consent. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">10 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\">\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"><a
        href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\"
        align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><I>Requirements for Advance Notification of
        Stockholder Nominations and Proposals </I></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        amended and restated bylaws provide advance notice procedures with respect
        to stockholder proposals and nomination of candidates for\nelection as directors
        other than nominations made by or at the direction of our&nbsp;board of&nbsp;directors
        or a committee of our&nbsp;board of&nbsp;directors. </P>\n<P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><I>No Cumulative
        Voting </I></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">The DGCL provides\nthat stockholders
        are denied the right to cumulate votes in the election of directors unless
        our&nbsp;amended and restated&nbsp;certificate of incorporation provides otherwise.
        Our amended and restated certificate of incorporation does not provide\nfor
        cumulative voting. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><I>Undesignated Preferred Stock </I></P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The authority that is possessed by our board
        of&nbsp;directors to issue preferred stock could potentially be used to discourage
        attempts by\nthird parties to obtain control of the company through a merger,
        tender offer, proxy contest, or otherwise by making it more difficult or more
        costly to obtain control of the company. Our&nbsp;board of&nbsp;directors
        may issue preferred stock with\nvoting rights or conversion rights that, if
        exercised, could adversely affect the voting power of the holders of common
        stock. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><I>Authorized but Unissued\nShares </I></P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Our authorized but unissued shares of common
        stock and preferred stock will be available for future issuance without\nstockholder
        approval. We may use additional shares for a variety of purposes, including
        future public offerings to raise additional capital, to fund acquisitions
        and as employee compensation. The existence of authorized but unissued shares
        of common\nstock and preferred stock could render more difficult or discourage
        an attempt to obtain control of the Company by means of a proxy contest, tender
        offer, merger or otherwise. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The above provisions
        may deter a hostile takeover or delay a change in control or management of
        the Company. </P>\n<P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><I>Indemnification. </I></P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        amended and\nrestated certificate of incorporation and our amended and restated
        bylaws provide that we will indemnify our officers and directors against losses
        as they incur in investigations and legal proceedings resulting from their
        services to us, which may\ninclude service in connection with takeover defense
        measures. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><I>Delaware Anti-Takeover Statute </I></P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">We are subject to the provisions of Section&nbsp;203
        of the DGCL regulating corporate takeovers. In general, Section&nbsp;203 generally\nprohibits
        a publicly-held Delaware corporation from engaging in a business combination
        with an interested stockholder for a period of three years following the date
        on which the person became an interested stockholder unless: </P>\n<P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">prior to
        the date of the transaction, the board of directors of the corporation approved
        either the business\ncombination or the transaction which resulted in the
        stockholder becoming an interested stockholder; </P></TD></TR></TABLE> <P
        STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">upon completion
        of the transaction that resulted in the stockholder becoming an interested
        stockholder, the\ninterested stockholder owned at least 85% of the voting
        stock of the corporation outstanding at the time the transaction commenced,
        excluding for purposes of determining the voting stock outstanding, but not
        the outstanding voting stock owned by the\ninterested stockholder, (1)&nbsp;shares
        owned by persons who are directors and also officers and (2)&nbsp;shares owned
        by employee stock plans in which employee participants do not have the right
        to determine confidentially whether shares held\nsubject to the plan will
        be tendered in a tender or exchange offer; or </P></TD></TR></TABLE>\n <p
        STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">11
        </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em; margin-bottom:0em;
        page-break-before:always\">\n<HR SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\"
        ALIGN=\"CENTER\">\n<h5 align=\"left\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n\n<TABLE STYLE=\"BORDER-COLLAPSE:COLLAPSE;
        font-family:Times New Roman; font-size:10pt\" BORDER=\"0\" CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style = \"page-break-inside:avoid\">\n<TD
        WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\" VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD
        WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD ALIGN=\"left\" VALIGN=\"top\">
        <P ALIGN=\"left\" STYLE=\" margin-top:0pt ; margin-bottom:0pt; font-family:Times
        New Roman; font-size:10pt\">at or subsequent to the date of the transaction,
        the business combination is approved by the board of directors\nof the corporation
        and authorized at an annual or special meeting of stockholders, and not by
        written consent, by the affirmative vote of at least 66 2/3% of the outstanding
        voting stock that is not owned by the interested stockholder.\n</P></TD></TR></TABLE>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\">In general, Section&nbsp;203 defines business combination to include
        the following: </P>\n<P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">any merger
        or consolidation involving the corporation and the interested stockholder;
        </P></TD></TR></TABLE>\n<P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">any sale,
        lease, exchange, mortgage, transfer, pledge or other disposition of 10% or
        more of either the assets or\noutstanding stock of the corporation involving
        the interested stockholder; </P></TD></TR></TABLE> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">subject to
        certain exceptions, any transaction that results in the issuance or transfer
        by the corporation of any\nstock of the corporation to the interested stockholder;
        </P></TD></TR></TABLE> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">any transaction
        involving the corporation that has the effect of increasing the proportionate
        share of the stock\nof any class or series of the corporation beneficially
        owned by the interested stockholder; or </P></TD></TR></TABLE> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">the receipt
        by the interested stockholder of the benefit of any loans, advances, guarantees,
        pledges or other\nfinancial benefits by or through the corporation. </P></TD></TR></TABLE>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">In general, Section&nbsp;203 defines interested
        stockholder as an\nentity or person who, together with affiliates and associates,
        beneficially owns, or within three years prior to the determination of interested
        stockholder status did own, 15% or more of the outstanding voting stock of
        the corporation. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Insofar as the above described
        indemnification provisions permit indemnification of directors, officers or
        persons controlling us for\nliability arising under the Securities Act, we
        understand that in the opinion of the SEC, this indemnification is against
        public policy as expressed in the Securities Act and is therefore unenforceable.
        </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">12 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\">\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"><a href=\"#toc\">Table
        of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\"><B><A NAME=\"toc374207_8\"></A>PLAN OF DISTRIBUTION
        </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The Selling Stockholder, or its pledgees, distributees,
        transferees, or any of its successors in interest selling the securities received
        from\nthe Selling Stockholder as a partnership distribution, or other <FONT
        STYLE=\"white-space:nowrap\">non-sale-related</FONT> transfer (and any successive
        pledgees, distributees <FONT STYLE=\"white-space:nowrap\">or&nbsp;non-sale&nbsp;related</FONT>\ntransferees)
        after the date of this prospectus (all of whom may be a selling stockholder),
        may sell the securities, at fixed prices that may be changed, at market prices
        prevailing at the time of sale, at prices related to prevailing market prices,\nor
        at prices otherwise negotiated, by one or more of the following methods, without
        limitation: </P> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
