        <P STYLE=\"font-size:0pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P> <P
        STYLE=\"margin-top:0pt;margin-bottom:0pt\" ALIGN=\"center\">\n\n\n<IMG SRC=\"g374207g68g24.jpg\"
        ALT=\"LOGO\">\n </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>500,000 Shares of Common
        Stock to be Offered by the Selling Stockholder </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">This
        prospectus relates to the resale or other disposition from time to time of
        up to an aggregate of 500,000&nbsp;shares of common stock, par\nvalue of $0.0001
        per share of Anterix Inc. by the selling stockholder identified in this prospectus
        (the &#147;Selling Stockholder&#148;). The Selling Stockholder acquired the
        shares of common stock offered by this prospectus in a private placement\ntransaction
        in reliance on exemptions from registration under the Securities Act of 1933,
        as amended (the &#147;Securities Act&#148;). We are registering the resale
        of all shares of common stock by the Selling Stockholder in connection with
        the\nterms of the Membership Interest Purchase Agreement entered into with
        the Selling Stockholder on September&nbsp;8, 2014 (the &#147;Purchase Agreement&#148;),
        pursuant to which the Selling Stockholder was issued 500,000 Class&nbsp;B
        Units (the\n&#147;Class&nbsp;B Units&#148;) of our subsidiary, PDV Spectrum
        Holding Company, LLC (the &#147;Subsidiary&#148;) and converted such Class&nbsp;B
        Units into shares of our common stock on May&nbsp;18, 2022 (such transaction
        the &#147;Private\nPlacement&#148;). </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The Selling
        Stockholder may offer shares of our common stock from time to time in a number
        of different ways and at\nvarying prices. For more information on possible
        methods of offer and sale by the Selling Stockholder, refer to the section
        of this prospectus entitled &#147;Plan of Distribution.&#148; </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">The
        Selling Stockholder will receive all proceeds from the sale of shares of our
        common stock hereunder, and therefore we will not receive any\nof the proceeds
        from its sale of shares of our common stock hereunder. The shares, which may
