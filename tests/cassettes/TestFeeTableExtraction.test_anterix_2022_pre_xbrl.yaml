        align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">The Selling Stockholder and
        other persons participating in the sale or distribution of the\nsecurities
        will be subject to applicable provisions of the Exchange Act, and the rules
        and regulations thereunder, including Regulation M. This regulation may limit
