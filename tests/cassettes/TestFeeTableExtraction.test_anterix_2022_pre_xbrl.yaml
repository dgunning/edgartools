        <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>Item&nbsp;15. Indemnification of Directors and Officers </B></P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Section&nbsp;102(b)(7) of the Delaware General
        Corporation Law allows a corporation to provide in its certificate of incorporation
        that a\ndirector of the corporation will not be personally liable to the corporation
        or its stockholders for monetary damages for breach of fiduciary duty as a
        director, except where the director breached the duty of loyalty, failed to
        act in good faith,\nengaged in intentional misconduct or knowingly violated
        a law, authorized the payment of a dividend or approved a stock repurchase
        in violation of Delaware corporate law or obtained an improper personal benefit.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Section&nbsp;145(a) of the Delaware General
        Corporation Law provides that a Delaware corporation may indemnify any person
        who was or is a\nparty or is threatened to be made a party to any threatened,
        pending or completed action, suit or proceeding, whether civil, criminal,
        administrative or investigative (other than an action by or in the right of
        the corporation) by reason of the fact\nthat such person is or was a director,
        officer, employee or agent of the corporation, or is or was serving at the
        request of the corporation as a director, officer, employee or agent of another
        corporation or enterprise, against expenses (including\nattorneys&#146; fees),
        judgments, fines and amounts paid in settlement actually and reasonably incurred
        by such person in connection with such action, suit or proceeding if he or
        she acted in good faith and in a manner he or she reasonably believed\nto
        be in or not opposed to the best interests of the corporation, and, with respect
        to any criminal action or proceeding, had no cause to believe his or her conduct
        was unlawful. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Section&nbsp;145(b) of the Delaware
        General Corporation Law provides that a Delaware corporation may indemnify
        any person who was or is a\nparty or is threatened to be made a party to any
        threatened, pending or completed action or suit by or in the right of the
        corporation to procure a judgment in its favor by reason of the fact that
        such person acted in any of the capacities set forth\nabove, against expenses
        (including attorneys&#146; fees) actually and reasonably incurred by such
        person in connection with the defense or settlement of such action or suit
        if he or she acted under similar standards, except that no indemnification\nmay
        be made in respect of any claim, issue or matter as to which such person shall
        have been adjudged to be liable to the corporation unless and only to the
        extent that the court in which such action or suit was brought shall determine
        that, despite\nthe adjudication of liability but in view of all the circumstances
        of the case, such person is fairly and reasonably entitled to be indemnified
        for such expenses which the court shall deem proper. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Section&nbsp;145
        of the Delaware General Corporation Law further provides that: (i)&nbsp;to
        the extent that a former or present director or\nofficer of a corporation
        has been successful in the defense of any action, suit or proceeding referred
        to in subsections&nbsp;(a) and (b)&nbsp;or in the defense of any claim, issue
        or matter therein, such person shall be indemnified against expenses\n(including
        attorneys&#146; fees) actually and reasonably incurred by him or her in </P>\n
        <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P
        STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">II-1 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\">\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"><a href=\"#toc\">Table
        of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\">\nconnection therewith; (ii)&nbsp;indemnification provided for
        by Section&nbsp;145 shall not be deemed exclusive of any other rights to which
        the indemnified party may be entitled; and\n(iii)&nbsp;the corporation may
        purchase and maintain insurance on behalf of any present or former director,
        officer, employee or agent of the corporation or any person who at the request
        of the corporation was serving in such capacity for another\nentity against
        any liability asserted against such person and incurred by him or her in any
        such capacity or arising out of his or her status as such, whether or not
        the corporation would have the power to indemnify him or her against such\nliabilities
        under Section&nbsp;145. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">Article XI of
        the Company&#146;s amended and restated certificate of incorporation specifies
        that a\ndirector of the Company shall not be personally liable to the Company
        or to any of its stockholders for monetary damages for breach of fiduciary
        duty as a director, except to the extent such exemption from liability or
        limitation thereof is not\npermitted under the DGCL. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Article
        XII of the Company&#146;s amended and restated certificate of incorporation
        and Article XIII of the\nCompany&#146;s amended and restated bylaws state
        that the Company shall indemnify, to the fullest extent permitted by applicable
        law, any person who was or is a party or is threatened to be made a party
        to any threatened, pending or completed\naction, suit or proceeding by reason
        of the fact that such person is or was a director or officer of the Company
        or is or was serving at the request of the Company. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Article
        XIII of the Company&#146;s amended and restated certificate of incorporation
        permits the Company to purchase and maintain director or\nofficer liability
        insurance. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">The Company has entered into
        indemnification agreements with its directors and officers. Subject to certain\nlimited
        exceptions, under these agreements, the Company will be obligated, to the
        fullest extent not prohibited by the DGCL, to indemnify such directors and
        officers against all expenses, judgments, fines and penalties incurred in
        connection with\nthe defense or settlement of any actions brought against
        them by reason of the fact that they were directors or officers of the Company.
        The registrant also maintains liability insurance for its directors and officers
        in order to limit its exposure\nto liability for indemnification of such persons.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">See also the undertakings set out in response
        to Item&nbsp;17 herein. </P>\n<P STYLE=\"margin-top:18pt; margin-bottom:0pt;
