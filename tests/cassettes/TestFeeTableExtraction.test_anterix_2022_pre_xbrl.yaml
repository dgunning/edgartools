        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\">Ladies and
        Gentlemen: </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">This\nopinion is furnished to
        Anterix Inc., a Delaware corporation (the &#147;<B>Company</B>&#148;), in
        connection with the filing with the Securities and Exchange Commission on
        June&nbsp;30, 2022 of a registration statement on Form <FONT\nSTYLE=\"white-space:nowrap\">S-3</FONT>
        (the &#147;<B>Registration Statement</B>&#148;) under the Securities Act of
        1933, as amended (the &#147;<B>Act</B>&#148;). The Registration Statement
        relates to the registration of up to an aggregate of 500,000\nshares of common
        stock, par value $0.0001 per share (the &#147;<B>Shares</B>&#148;). The Shares
        are to be sold by a selling stockholder of the Company in the manner contemplated
        by the prospectus contained in the Registration Statement. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">In
        connection with this opinion, we have examined and relied upon the Registration
        Statement and the originals or copies certified to our\nsatisfaction of such
        other documents, records, certificates, memoranda and other instruments as
        in our judgment are necessary or appropriate to enable us to render the opinions
        expressed below. With your consent, we have relied upon certificates and\nother
        assurances of officers of the Company as to factual matters without having
        independently verified such factual matters. We have assumed the genuineness
        and authenticity of all documents submitted to us as originals, and the conformity
        to\noriginals of all documents submitted to us as copies thereof. We also
        have assumed that the Company will not in the future issue or otherwise make
        unavailable so many shares of common stock that there are insufficient authorized
        and unissued shares\nof common stock remaining and available for issuance
        of the Shares. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">This opinion is being furnished
        in connection with the requirements\nof Item 601(b)(5)&nbsp;of <FONT STYLE=\"white-space:nowrap\">Regulation&nbsp;S-K&nbsp;under</FONT>
        the Act, and no opinion is expressed herein as to any matter pertaining to
        the contents of the Registration Statement, other than as expressly stated\nherein
        with respect to the issue of the Shares. Our opinion is limited to the matters
        stated herein and no opinion is implied or may be inferred beyond the matters
        expressly stated. Our opinion herein is expressed solely with respect to the
        federal\nlaws of the United States and the General Corporation Law of the
        State of Delaware. Our opinion is based on these laws as in effect on the
        date hereof, and we disclaim any obligation to advise you of facts, circumstances,
        events or developments\nwhich hereafter may be brought to our attention and
        which may alter, affect or modify the opinion expressed herein. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Subject
        to the\nforegoing and the other matters set forth herein, we are of the opinion
        that the Shares have been duly authorized for issuance and are validly issued,
        fully paid, <FONT STYLE=\"white-space:nowrap\">and&nbsp;non-assessable.</FONT>
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">We consent to the use of this opinion as Exhibit&nbsp;5.1
        to the Registration Statement, and further consent to the use of our name
        under the\ncaption &#147;Legal Matters&#148; in the prospectus included in
        the Registration Statement, and in any amendment or supplement thereto. </P>
