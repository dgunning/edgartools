        of any person engaged in the distribution of the securities to engage in market-making
        activities with respect to the particular securities being distributed for
        a period of up to five business days before the distribution. These\nrestrictions
        may affect the marketability of the securities and the ability of any person
        or entity to engage in market-making activities with respect to the securities.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
