        Governance and Management</B><BR>\n<B>Item&nbsp;5.02. Departure of Directors
        or Principal Officers; Election of Directors; Appointment of\nPrincipal Officers.</B>\n\n\n<P
        align=\"left\" style=\"font-size: 10pt\">On April&nbsp;26, 2005, the board
        of directors of Exelon Corporation elected Thomas J. Ridge to serve as\na
        Class&nbsp;I director, effective May&nbsp;2, 2005. Mr.&nbsp;Ridge, age 59,
        served as Secretary of the United\nStates Department of Homeland Security
        from January&nbsp;2003 through January&nbsp;2005, and served from\nOctober&nbsp;2001
        through December&nbsp;2002 as Special Assistant to the President for Homeland
        Security, an\nExecutive Office created by President Bush in October&nbsp;2001.
        Mr.&nbsp;Ridge served as Governor of the\nCommonwealth of Pennsylvania from
        1994 through October&nbsp;2001. Mr.&nbsp;Ridge is also a director of Home\nDepot
        Corporation and Savi Technology.\n\n\n\n<P align=\"center\" style=\"font-size:
