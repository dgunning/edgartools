        \   <footnotes>\n        <footnote id=\"F1\">Each restricted stock unit (&quot;RSU&quot;)
        represents the right to receive, at settlement, one share of common stock.
        This transaction represents the settlement of RSUs in shares of common stock
        on their scheduled vesting date.</footnote>\n        <footnote id=\"F2\">These
        shares are held through Mr. Cook's trust.</footnote>\n        <footnote id=\"F3\">Shares
        withheld by Apple to satisfy tax withholding requirements on vesting of RSUs.</footnote>\n
        \       <footnote id=\"F4\">This transaction was made pursuant to a Rule 10b5-1
        trading plan adopted by the reporting person on May 28, 2026.</footnote>\n
        \       <footnote id=\"F5\">This transaction was executed in multiple trades
        at prices ranging from $330.66 to $331.655; the price reported above reflects
        the weighted average sale price. The reporting person hereby undertakes to
        provide full information regarding the number of shares and prices at which
        the transactions were effected upon request to the SEC staff, Apple, or a
        security holder of Apple.</footnote>\n        <footnote id=\"F6\">This transaction
        was executed in multiple trades at prices ranging from $331.66 to $332.65;
        the price reported above reflects the weighted average sale price. The reporting
        person hereby undertakes to provide full information regarding the number
        of shares and prices at which the transactions were effected upon request
        to the SEC staff, Apple, or a security holder of Apple.</footnote>\n        <footnote
        id=\"F7\">This transaction was executed in multiple trades at prices ranging
        from $332.66 to $333.655; the price reported above reflects the weighted average
        sale price. The reporting person hereby undertakes to provide full information
        regarding the number of shares and prices at which the transactions were effected
        upon request to the SEC staff, Apple, or a security holder of Apple.</footnote>\n
        \       <footnote id=\"F8\">This transaction was executed in multiple trades
        at prices ranging from $333.66 to $334.50; the price reported above reflects
        the weighted average sale price. The reporting person hereby undertakes to
        provide full information regarding the number of shares and prices at which
        the transactions were effected upon request to the SEC staff, Apple, or a
        security holder of Apple.</footnote>\n        <footnote id=\"F9\">This award
        was granted on October 1, 2023, for a target number of 219,030 RSUs. The award
        settled on October 1, 2026, applying a percentage of the target number of
        RSUs that was determined based on Apple's total shareholder return (&quot;TSR&quot;)
        relative to the other companies in the S&amp;P 500 from the first day of Apple's
        fiscal year 2024 and ending with the last day of Apple's fiscal year 2026.</footnote>\n
        \       <footnote id=\"F10\">TSR is calculated based on the change in a company's
        stock price during the performance period, taking into account any dividends
        paid during that period, which are assumed to be reinvested in the stock.
        In accordance with the terms of the award, the beginning value used for calculating
        TSR is the average closing stock price for the first 20 trading days of the
        performance period. Apple's beginning value was calculated to be $175.08.
        Similarly, the ending value used for calculating TSR is the average closing
        price for the final 20 trading days of the performance period. Apple's ending
        value was calculated to be $333.82.</footnote>\n        <footnote id=\"F11\">This
        award provided that if Apple's relative TSR performance was ranked at or above
        the 85th percentile for companies in the S&amp;P 500 for the performance period,
        200% of the target number of RSUs vest. If Apple's performance was ranked
        at or above the 55th percentile, 100% of the target number of RSUs vest. If
        Apple's performance was ranked at or above the 25th percentile, 25% of the
        target number of RSUs vest, and if Apple's performance was ranked below the
        25th percentile, 0% of the target number of RSUs vest. If Apple's performance
        was between these levels, the portion of the restricted stock units that vest
        would be determined on a straight-line basis (i.e., linearly interpolated)
        between the two nearest vesting percentages.</footnote>\n        <footnote
        id=\"F12\">Apple's TSR for the three-year performance period was 90.67%, which
        ranked 115 of the 480 companies that were included in the S&amp;P 500 for
        the performance period and placed Apple in the 76.20th percentile. Therefore,
        374,541 RSUs subject to performance requirements vested.</footnote>\n    </footnotes>\n\n
