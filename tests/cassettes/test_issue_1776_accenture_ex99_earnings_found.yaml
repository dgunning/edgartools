        style=\"margin-bottom:9pt;margin-top:5pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">NEW
        YORK&#59; December&#160;18, 2025 &#8212; Accenture (NYSE&#58; ACN) reported
        financial results for the first quarter of fiscal 2026 ended November&#160;30,
        2025. </font></div><div style=\"margin-bottom:9pt;margin-top:5pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">All
