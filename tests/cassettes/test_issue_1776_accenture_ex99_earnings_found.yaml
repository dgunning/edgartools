        Chair and CEO Julie Sweet</font></td></tr><tr><td colspan=\"3\" style=\"background-color:#dcafff;padding:2px
        1pt;text-align:left;vertical-align:middle\"><div style=\"padding-left:4.5pt;padding-right:4.5pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:11pt;font-weight:400;line-height:130%\">&#8220;I
        am very pleased with our $21 billion in new bookings, including 33 clients
        with quarterly bookings greater than $100 million. We delivered revenue growth
        of 5% in local currency, at the top of our guided range, while continuing
        to gain market share. We also strengthened our leadership in advanced AI and
        deepened our ecosystem partnerships to help clients realize value. These results
        reflect our strategy to be the reinvention partner of choice for our clients.
