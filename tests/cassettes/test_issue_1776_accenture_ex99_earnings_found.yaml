        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:9pt;font-weight:400;line-height:120%;padding-left:14.85pt\">Percentage
        changes in revenues and bookings on a local currency basis. Financial results
        in local currency are calculated by restating current period activity into
        U.S. dollars using the comparable prior year period&#8217;s foreign currency
        exchange rates. This approach is used for all results where the functional
        currency is not the U.S. dollar. Accenture&#8217;s management believes that
        information regarding changes in its revenues and bookings that excludes the
        effect of fluctuations in foreign currency exchange rates facilitates meaningful
        comparison of its revenues.</span></div><div style=\"margin-bottom:9pt;margin-top:5pt;padding-left:18pt;text-indent:-18pt\"><span
