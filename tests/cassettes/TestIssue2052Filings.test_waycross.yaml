        \ </TABLE>\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\"><B>Portfolio\nTurnover</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\">The\nFund
        pays transaction costs, such as commissions, when it buys and sells securities
        (or &#147;turns over&#148; its portfolio). A higher\nportfolio turnover rate
        may indicate higher transaction costs and may result in higher taxes when
        Fund shares are held in a taxable account.\nThese costs, which are not reflected
        in Annual Fund Operating Expenses or in the Example, affect the Fund&#146;s
        performance. During\nthe most recent fiscal year, the Fund&#146;s portfolio
        turnover rate was 36% of the average value of its portfolio.</FONT></P>\n\n\n</div>\n<br
        CLEAR=ALL><BR>\n\n<!-- Field: Page; Sequence: 1; Options: NewSection; Value:
        1 -->\n    <DIV STYLE=\"margin-top: 12pt; margin-bottom: 6pt; border-bottom:
        Black 2pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\"><!-- Field: Sequence; Type:
        Arabic; Name: PageNo -->1<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<DIV STYLE=\"float:LEFT; width:48%\">\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 12pt\"><B>PRINCIPAL\nINVESTMENT STRATEGIES</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\">The\nFund
        is a non-diversified portfolio and pursues its investment objective by investing,
        under normal circumstances, 80% of its net assets\n(plus the amount of any
        borrowings for investment purposes) in equity securities traded in the U.S.
        This investment policy may be changed\nwithout shareholder approval upon at
        least 60 days&#146; prior written notice to shareholders.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\">The\nFund
        holds a portfolio of common stocks of mid-capitalization and large-capitalization
        companies with attractive valuations based on\nthe Adviser&#146;s proprietary
        analysis. The Adviser defines mid-capitalization companies as companies with
        a total market capitalization\nof between $1 billion and $10 billion at the
        time of purchase and large capitalization companies as companies with a total
        market capitalization\nof $10 billion or more at the time of purchase. The
        Fund may also invest in securities of foreign companies that are publicly
        traded\nin the U.S., including in American Depositary Receipts (&#147;ADRs&#148;).
        The Fund expects to hold 25-35 holdings, under normal market\ncircumstances.
        The number of securities held by the Fund may exceed this range occasionally,
        such as when the adviser is accumulating\nnew positions, phasing out or replacing
        existing positions, or responding to unusual market conditions. The Fund may
        invest a significant\nportion of its assets in securities of companies conducting
        business within a single sector, as defined by third-party sources, including\nthe
        technology sector.</FONT></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size:
        10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt; text-align: justify\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif; font-size: 10pt\">The\nAdviser seeks to emphasize companies that
        have proven their ability to sustainably grow earnings, sometimes through
        innovation, above\nmarket expectations. The Adviser generates a focus universe
        of investment candidates of approximately 300 companies traded in the United\nStates.
        The Adviser rigorously analyzes each investment candidate, evaluating company-specific
        metrics (&#147;key factors&#148;) it\ndeems most likely to affect annual earnings,
        and then ranks the companies based on the Adviser&#146;s assessment of these
        key factors.\nThe Adviser defines key factors as the most critical drivers
        of a company&#146;s annual earnings estimates; for example, foot traffic\nat
        a restaurant, units sold for a tech product company, or operating costs for
        an industrial company. Following further analysis, the\nAdviser buys stocks
        for the Fund&#146;s portfolio that it determines to have improving key factors
        and are available at reasonable valuations.</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\">The\nAdviser
        will sell a stock when there is a material adverse change in the issuer&#146;s
        key factors. A security position may also be\nsold when the Adviser believes
        other investment opportunities are more attractive or that the security is
        unlikely to benefit from current\nbusiness, market, or economic conditions.</FONT></P>\n\n\n</DIV>\n\n<DIV
        STYLE=\"float:right; width:48%\">\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif;
        font-size: 12pt\"><B>PRINCIPAL\nRISKS</B></FONT></P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family: Arial,
        Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\">As\nwith
        any mutual fund investment, there is a risk that you could lose money by investing
        in the Fund. The success of the Fund&#146;s\ninvestment strategy depends upon
        the Adviser&#146;s skill in selecting securities for purchase and sale by
        the Fund and there is no\nassurance that the Fund will achieve its investment
        objective. Because of the types of securities in which the Fund invests and
        the investment\ntechniques the Adviser uses, the Fund is designed for investors
        who are investing for the long term. The Fund may not be appropriate\nfor
        use as a complete investment program. The principal risks of an investment
        in the Fund are described below.</FONT></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\"><B><I>Non-Diversification\nRisk.</I></B>
        The Fund is non-diversified under the Investment Company Act and employs a
        concentrated investment strategy. Accordingly,\nthe Fund typically invests
        a greater portion of its assets in, and its performance may be affected by,
        a smaller number of issuers than\nif it were a diversified, less concentrated
        fund. Further, the Fund may experience greater losses because of a single
        issuer&#146;s\nunfavorable market or economic conditions or other adverse
        developments impacting the market value of the issuer&#146;s securities.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\"><B><I>Equity\nSecurities
        Risk.</I></B> As with any fund that invests in stocks, your investment will
        fluctuate in value, and the loss of your investment\nis a risk of investing.
        The Fund&#146;s price per share will fluctuate due to changes in the market
        prices of its investments. Also,\nthe Fund&#146;s investments may not grow
        as fast as the rate of inflation and stocks tend to be more volatile than
        some other investments\nyou could make, such as bonds.</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0pt 0pt 0.3in; text-align:
        justify\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size:
        10pt\"><B><I>Large-Capitalization\nCompany Risk.</I></B> Large-capitalization
        companies are more mature and may be unable to respond as quickly as smaller
        companies to\nnew competitive challenges, such as changes in technology and
        consumer tastes, and may not be able to attain the high growth rate of\nsuccessful
        smaller companies, especially during extended periods of economic expansion.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0pt 0pt 0.3in; text-align:
        justify\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size:
        10pt\"><B><I>Mid-Capitalization\nCompany Risk.</I></B> Investments in mid-capitalization
        companies often involve higher risks than large-capitalization companies because\nthese
        companies may lack the management experience, financial resources, product
        diversification and competitive strengths of larger\ncompanies. Therefore,
        the securities of mid-capitalization companies may be more susceptible to
        market downturns and other events, and\ntheir prices may be subject to greater
        price fluctuations. In addition, in many instances, the securities of mid
        -capitalization companies\nare traded only over-the-counter or on a regional
        securities exchange, and the frequency and volume of their trading is less
        than is\ntypical of larger companies. Because mid-capitalization companies
        normally have fewer shares outstanding than larger companies, it may\nbe more
        difficult to buy or sell significant amounts of such shares without an unfavorable
        impact on prevailing prices. Mid capitalization\ncompanies are typically subject
        to greater changes in earnings and business prospects than larger, more established
        companies and may\nnot be widely followed by investors, which can lower the
        demand for their stock.</FONT></P>\n\n\n</div>\n<br CLEAR=ALL><BR>\n\n<!--
        Field: Page; Sequence: 2; Value: 1 -->\n    <DIV STYLE=\"margin-top: 12pt;
        margin-bottom: 6pt; border-bottom: Black 2pt solid\"><P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom:
        0pt\"><!-- Field: Sequence; Type: Arabic; Name: PageNo -->2<!-- Field: /Sequence
        --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom:
        12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<DIV
        STYLE=\"float:LEFT; width:48%\">\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt; text-align: justify\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\"><B><I>Sector\nRisk.</I></B>
        The Fund may have significant exposure to one or more sectors that the Adviser
        believes offer more growth potential in\ncurrent market conditions. The Fund
        may face various risks associated with investing substantially in certain
        sectors, such as that an\nindividual sector may be more volatile than the
        broader market, or could perform differently, and that the stocks of multiple
        companies\nwithin a sector could simultaneously decline in price because of
        an event that affects the entire sector.</FONT></P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family: Arial,
        Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0pt 0pt 0.3in; text-align:
        justify\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size:
        10pt\"><B><I>Technology\nSector Risk.</I></B> At times, the Fund&#146;s assets
        are focused on the Technology sector, which means it will be affected by performance\nof
        and developments in that sector, as compared to a more diversified fund. The
        value of stocks of technology companies is particularly\nvulnerable to rapid
        changes in technology product cycles, product obsolescence, government regulation,
        and competition, both domestically\nand internationally.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\"><B><I>Market\nRisk.</I></B>
        Market risk is the risk that the value of the securities in the Fund&#146;s
        portfolio may decline due to daily fluctuations\nin the securities markets
        that are beyond the Adviser&#146;s control, including fluctuations in interest
        rates, the quality of the Fund&#146;s\ninvestments, economic conditions, and
        general equity market conditions. Certain market events could increase volatility
        and exacerbate\nmarket risk, such as changes in governments&#146; economic
        policies, political turmoil, environmental events, trade disputes, and epidemics,\npandemics,
        or other public health issues. Turbulence in financial markets, and reduced
        liquidity in equity, credit and fixed income markets\nmay negatively affect
        many issuers domestically and around the world, and can result in trading
        halts, any of which could have an adverse\nimpact on the Fund. During periods
        of market volatility, security prices (including securities held by the Fund)
        could fall drastically\nand rapidly, and therefore adversely affect the Fund.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\"><B><I>Foreign\nSecurities
        Risk.</I></B> Since the Fund&#146;s investments may include ADRs, which represent
        interests in foreign securities, the Fund\nis subject to risks beyond those
        associated with investing in domestic securities. The value of foreign securities
        is subject is subject\nto currency fluctuations. Foreign companies are generally
        not subject to the same regulatory requirements of U.S. companies thereby
        resulting\nin less publicly available information about these companies. In
        addition, foreign accounting, auditing, and financial reporting standards\ndiffer
        from those applicable to U.S. companies.</FONT></P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family: Arial,
        Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\"><B><I>Management\nStyle
        Risk.</I></B> The Adviser&#146;s method of security selection may not be successful,
        and the Fund may underperform relative to\nits benchmark index or to other
        mutual funds that employ similar investment strategies. In addition, the Adviser
        may select investments\nthat fail to perform as anticipated. The ability of
        the Fund to meet its investment objective is directly related to the success
        of the\nAdviser&#146;s investment process and there is no guarantee that the
        Adviser&#146;s judgments about the attractiveness, value and potential\nappreciation
        of a particular investment for the Fund will be correct or produce the desired
        results.</FONT></P>\n\n</DIV>\n\n<DIV STYLE=\"float:right; width:48%\">\n\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 12pt\"><B>PERFORMANCE\nSUMMARY</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family:
