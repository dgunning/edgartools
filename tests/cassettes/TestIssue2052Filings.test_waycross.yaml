        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: justify\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif; font-size: 10pt\">The\nbar
        chart and table that follow provide some indication of the risks of investing
        in the Fund by showing changes in the Fund&#146;s performance\nfrom year to
        year and by showing how the Fund&#146;s average annual total returns for one
        year and since inception compare with those\nof a broad-based securities market
        index. How the Fund has performed in the past (before and after taxes) is
        not necessarily an indication\nof how the Fund will perform in the future.
        Updated performance information, current through the most recent month end,
        is available\nby calling 1-866-267-4304 or by visiting the Fund&#146;s website
        at <U>http://www.waycrossfunds.com</U>.</FONT></P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt\"><FONT STYLE=\"font-family: Arial,
        Helvetica, Sans-Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align:
