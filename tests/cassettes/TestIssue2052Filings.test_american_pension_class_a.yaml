        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">Under normal circumstances, the Short Term Bond Fund
        invests at least 80% of its assets in fixed income securities that, in the
        Adviser&#146;s opinion, offer the opportunity for income consistent with preservation
        of capital. The Fund&#146;s portfolio will have an average aggregate maturity
        of not more than three years.</FONT></P>\n\n<P STYLE=\"text-align: justify;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">The Adviser exercises a flexible strategy in the selection
        of various types of debt (or fixed income) investments and is not limited
        by investment style, sector or asset class. The fund seeks to provide diversification
        by allocating the Fund&#146;s investments among various areas of the fixed
        income markets.</FONT></P>\n\n<P STYLE=\"text-align: justify; font: 10pt Times
        New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family: Times New
