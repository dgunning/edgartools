        New Roman, Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\"><B>Purchase and Sale of Fund Shares</B></FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align: justify;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">You may purchase,
        redeem or exchange shares of the Fund on any business day, which is any day
        the New York Stock Exchange is open for business. You may purchase, redeem
        or exchange shares of the Fund either through a financial advisor or directly
        from the Fund. The minimum initial investment in the Fund&#146;s Class A and
        Class L Shares is $1,000, and the minimum for additional investments is $100.
        Investment minimums for the Institutional Share Class purchased in a Fee Based
        Account, through an advisor, are $1,000 minimum initial investment or $100
        minimum investment on a monthly basis. The minimum initial investment in the
        Fund&#146;s Institutional Class Shares is $1,000,000, and the minimum for
        additional investments is $100,000. There are no minimums for purchases or
        exchanges through employer-sponsored retirement plans. The Fund shares are
        redeemable on any business day by contacting your financial adviser, or by
        written request to the Fund, by telephone, or by wire transfer.</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align: justify;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\"><B>Tax Information</B></FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align: justify;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">The Fund
        intends to make distributions that may be taxed as ordinary income or capital
        gains.</FONT></P>\n\n<P STYLE=\"text-align: justify; font: 10pt Times New
        Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family: Times New Roman,
        Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align:
        justify; font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\"><B>Payments
        to Broker-Dealers and Other Financial Intermediaries</B></FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align: justify;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">If you purchase
        shares of the Fund through a broker-dealer or other financial intermediary
        (such as a bank), the Fund and its related companies may pay the intermediary
        for the sale of Fund shares and related services. These payments may create
        a conflict of interest by influencing the broker-dealer or other financial
        intermediary and your sales person to recommend the Fund over another investment.
        Ask your sales person or visit your financial intermediary&#146;s website
        for more information.</FONT></P>\n\n<P STYLE=\"text-align: justify; font:
        10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">Institutional Class Shares are sold without an initial
        front-end sales charge so that the full amount of your purchase is invested
        in the Fund.</FONT></P>\n\n<P STYLE=\"text-align: justify; font: 10pt Times
        New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family: Times New
