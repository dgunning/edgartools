        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\"><B>General Risks.</B> There is a risk that you could
        lose all or a portion of your investment in the Fund. The value of your investment
        in the Fund will go up and down with the prices of the securities in which
        the Fund invests.</FONT></P>\n\n<P STYLE=\"text-align: justify; font: 10pt
        Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family: Times
        New Roman, Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\"><B>Debt Security Risk.</B> The values of debt securities
        held by the Fund are affected by rising and declining interest rates. In general,
        debt securities with longer term maturities tend to fall more in value when
        interest rates rise than debt securities with shorter terms. A debt security
        is also subject to credit risk, which is the possibility that the credit strength
        of an issuer will weaken and/or an issuer of a debt security will fail to
        make timely payments of principal or interest and the security will go into
        default, and therefore it may lose value if the issuer is unable to pay interest
        or repay principal when it is due.</FONT></P>\n\n<P STYLE=\"text-align: justify;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\"><B>Junk Bonds or High Yield, High Risk Securities Risk.</B>
        Bonds rated below investment grade (i.e., BB or lower by S&amp;P or Ba or
        lower by Moody&#146;s) are speculative in nature, involve greater risk of
        default by the issuing entity and may be subject to greater market fluctuations
        than higher rated fixed income securities.</FONT></P>\n\n<P STYLE=\"text-align:
        justify; font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\"><B>Foreign Securities Risk.</B> The Fund&#146;s direct
        or indirect investments in foreign securities, including depositary receipts,
        involve risks not associated with investing in U.S. securities that can adversely
        affect the Fund&#146;s performance. Foreign markets, particularly emerging
        markets, may be less liquid, more volatile and subject to less government
        supervision than domestic markets. The value of the Fund&#146;s investment
        may be negatively affected by changes in the exchange rates between the U.S.
        dollar and foreign currencies. There may be difficulties enforcing contractual
        obligations, and it may take more time for trades to clear and settle.</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align: justify;
