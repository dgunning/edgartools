        justify; font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">Although
        the Short Term Bond Fund invests primarily in investment-grade debt securities
        (as designated by S&amp;P, Moody&#146;s or Fitch) it may invest a portion
        of its net assets in securities rated below investment grade. Normally we
        would expect the majority of these investments to be rated in the top tier
        of below investment grade (i.e. BB designations by S&amp;P). Additionally,
        the Fund may invest a portion of its net assets in any one or a combination
        of the following types of fixed income securities including (but not limited
        to):</FONT></P>\n\n<P STYLE=\"text-align: justify; font: 10pt Times New Roman,
        Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family: Times New Roman, Times,
        Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<TABLE CELLPADDING=\"0\"
