        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">The Fund attempts to manage interest rate risk through
        its management of dollar-weighted average modified duration of the securities
        it holds in its portfolio. Under normal conditions, the Fund&#146;s portfolio
        will have an average aggregate maturity of not more than three years. The
        Fund also attempts to manage risk through credit analysis with a focus on
        company assets, free cash flow, capital stock, earnings, economic prospects
        and debt structure. While not limited by these factors the goal of all investments
        is to provide a reasonable amount of income with the barbell of capital preservation
        and how they interact within the portfolio. To this end, the Fund does not
        attempt to purchase securities with a plan to quickly turnover those assets.</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align: justify;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">The Adviser
        may sell a security given a variety of circumstances, such as: when an investment
        no longer appears to the Adviser to offer the potential to achieve the Fund&#146;s
        investment objective; when an investment&#146;s performance does not meet
        the Adviser&#146;s expectations; when an investment opportunity arises that
        the Adviser believes is more compelling; to realize gains or limit losses;
        or to raise cash to meet shareholder redemptions or to pay expenses.</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P STYLE=\"text-align: justify;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">The Fund
        may, from time to time, take temporary defensive positions that are inconsistent
        with the Fund&#146;s principal investment strategies in attempting to respond
        to adverse market, economic, political, or other conditions. When the Fund
        takes a defensive position, the Fund&#146;s assets may be held in up to 100%
        cash and/or invested in money market mutual funds, money market instruments,
        including repurchase agreements or other short-term securities considered
        by the Adviser to be of a defensive nature. When the Fund is invested in this
        manner, it may not achieve its investment objective.&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family:
