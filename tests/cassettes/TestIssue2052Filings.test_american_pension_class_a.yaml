        Times New Roman, Times, Serif; font-size: 10pt; color: #00014C\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"text-align: justify; font: 10pt Times New Roman, Times, Serif; margin:
        0pt\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\"><B>The Fund pays transaction costs, such as commissions,
        when it buys and sells securities (or &#147;turns over&#148; its portfolio).
        A higher portfolio turnover rate may indicate higher transaction costs and
        may result in higher taxes when Fund shares are held in a taxable account.
        These costs, which are not reflected in annual fund operating expenses or
        in the example, affect the Fund&#146;s performance. During the most recent
        fiscal year, the Fund&#146;s portfolio turnover rate was 35% of the average
        value of its portfolio.</B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt\"><FONT STYLE=\"font-family: Times New Roman,
