        Times, Serif; font-size: 10pt; color: #00014C\">(3)</FONT></TD>\n    <TD STYLE=\"text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt; color: #00014C\">In the interest of limiting expenses of the Fund, the
        Adviser has entered into a contractual expense limitation agreement with the
        Trust, effective May 31, 2025, so that the Fund&#146;s ratio of total annual
        operating expenses is limited to 0.79% for Class A Shares, 1.44% for Class
        L Shares, and 0.79% for Institutional Class Shares until at least May 31,
        2026. Pursuant to each of these expense limitation agreements, the Adviser
        has agreed to waive or limit its fees and assume other expenses of the Fund
        (excluding interest, taxes, brokerage commissions and other expenditures capitalized
        in accordance with generally accepted accounting principles or other extraordinary
        expenses not incurred in the ordinary course of business) so that the Fund&#146;s
        ratio of total annual operating expenses is limited to the limits listed above.
        The Adviser is entitled to the reimbursement of fees waived or reimbursed
        by the Adviser to the Fund subject to the limitations that the reimbursement
        is made only for fees and expenses incurred not more than three years prior
        to the date of reimbursement, and the reimbursement may not be made if it
        would cause the Fund&#146;s annual expense limitations to be exceeded. The
        reimbursement amount may not include any additional charges or fees, such
        as interest accruable on the reimbursement account. Further, any recoupments
        will be subject to any lower expenses limitations that have been later implemented
        by the Board. The expense limitation agreement may be terminated only by the
        Board of Trustees of the Trust (the &#147;Board&#148;) by providing 60 days&#146;
        notice, or if the Adviser ceases to serve as adviser to the Fund.</FONT></TD>
        </TR>\n  </TABLE>\n\n<P STYLE=\"text-align: justify; font: 10pt Times New
