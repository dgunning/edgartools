        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">ADC Therapeutics SA &ndash; Registration Statement\non Form S-3
        &ndash; Exhibit 5.1</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">Ladies and Gentlemen</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">We have acted as special Swiss counsel to ADC Therapeutics
        SA, a stock\ncorporation incorporated under the laws of Switzerland (the <B>Company</B>),
        in connection with the filing of the registration statement\non Form S-3 (the
        <B>Registration Statement</B>) filed with the United States Securities and
        Exchange Commission (the <B>SEC</B>) on the\ndate hereof for the purpose of
        registering under the Securities Act of 1933, as amended (the <B>Securities
        Act</B>), the offer and sale\nby the selling shareholders named in the Registration
        Statement of up to 27,726,052 common shares of the Company consisting of (i)
        11,991,785\ncommon shares of the Company, each with a nominal value of CHF
        0.08 (the <B>Common Shares</B>), and (ii) 15,734,267 common shares with\na
        nominal value of CHF 0.08 (the <B>Warrant Shares</B>) issuable upon exercise
        of pre-funded warrants issued by the Company to purchase\nthe Warrant Shares
        (the <B>Pre-Funded Warrants</B>). As such counsel, we have been requested
        to give our opinion as to certain legal matters\nof Swiss law.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">Capitalized
        terms used but not defined herein have\nthe meanings assigned to such terms
        in the Documents (as defined below).</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n\n<!-- Field:
        Page; Sequence: 1 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt;
        border-bottom: Black 1pt solid\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align: right; margin:
        0pt\"><IMG SRC=\"image_006.jpg\" ALT=\"\">&nbsp;</P></DIV>\n    <!-- Field:
        /Page -->\n\n<P STYLE=\"margin-top: 0; margin-bottom: 0\"></P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color: #46B4D7; font: 12pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">I.</TD><TD
        STYLE=\"text-align: justify\">Basis of Opinion</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 12pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">This opinion is confined to and given on the basis\nof the laws
        of Switzerland in force at the date hereof. Such laws and the interpretation
        thereof are subject to change. This opinion is\nalso confined to the matters
        stated herein and the Documents (as defined below), and is not to be read
        as extending, by implication or\notherwise, to any agreement or other document
        referred to in any of the Documents or any other matter.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify; text-indent: 0in\">For purposes of this opinion,\nwe have not conducted
        any due diligence or similar investigation as to factual circumstances that
        are or may be referred to in the Documents,\nand we express no opinion as
        to the accuracy of representations and warranties of facts set out in the
        Documents or the factual background\nassumed therein.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify; text-indent:
        0in\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0; text-align: justify\">For purposes of this opinion, we have only reviewed\nthe
        following documents (collectively, the <B>Documents</B>):</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(a)</TD><TD
        STYLE=\"text-align: justify\">an electronic copy of the Registration Statement;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
