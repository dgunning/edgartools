        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(q)</TD><TD STYLE=\"text-align:
        justify\">all authorizations, approvals, consents, licenses, exemptions, other
        than as required by mandatory Swiss\nlaw applicable to the Company or the
        Articles, and other requirements for the filing of the Registration Statement
        or for any other activities\ncarried on in view of, or in connection with,
        the performance of the obligations expressed to be undertaken by the Company
        in the Registration\nStatement have been duly obtained or fulfilled in due
        time and are and will remain in full force and effect, and any related conditions\nto
        which the parties thereto are subject have been satisfied.</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"color: #46B4D7; font: 12pt Arial, Helvetica, Sans-Serif; margin-top:
        0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width:
        0\"></TD><TD STYLE=\"width: 21.25pt\">III.</TD><TD STYLE=\"text-align: justify\">Opinion</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 12pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Based on the foregoing and subject to the qualifications set
        out below,\nwe are of the opinion that:</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 28.35pt\">1.</TD><TD STYLE=\"text-align:
        justify\">The Common Shares <FONT STYLE=\"background-color: white\">are </FONT>validly
        issued in the form of uncertificated\nsecurities (<I>droits-valeurs</I>),
        fully paid-in as to their nominal value and non-assessable.</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 28.35pt\">2.</TD><TD STYLE=\"text-align: justify\">The Warrant
        Shares to be issued upon exercise of the Pre-Funded Warrants, if and when
        issued and paid\nfor pursuant to the Articles, the Pre-Funded Warrants and
        Swiss law&mdash;in particular after the exercise notice has been given (if
        applicable)\nand the issue price for such Warrant Shares has been paid-in
        in accordance with the Articles, the Pre-Funded Warrants and Swiss law <FONT
        STYLE=\"background-color: white\">and\n</FONT>upon registration of the corresponding
        share capital increase in the Commercial Register of the Canton of Vaud (if
        applicable)&mdash;and\nif and when such Warrant Shares have been entered into
        the Company's book of uncertificated securities, will be validly issued in
        the\nform of uncertificated securities (<I>droits-valeurs</I>), fully paid-in
        as to their nominal value and non-assessable.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 4; Value: 2 -->\n    <DIV STYLE=\"margin-top: 6pt;
        margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: right\"><!-- Field:
        Sequence; Type: Arabic; Name: PageNo -->4<!-- Field: /Sequence -->/8</P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"text-align: right; font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt\"><IMG SRC=\"image_006.jpg\" ALT=\"\">&nbsp;</P></DIV>\n    <!-- Field:
        /Page -->\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color:
        #46B4D7; font: 12pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">IV.</TD><TD STYLE=\"text-align: justify\">Qualifications</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 12pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0; text-align: justify\">The above opinions are subject to the
        following\nqualifications:</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(a)</TD><TD STYLE=\"text-align:
        justify\">The lawyers of our firm are members of the Zurich bar and do not
        hold themselves out to be experts in\nany laws other than the laws of Switzerland.
        Accordingly, we are opining herein as to Swiss law only, based on our independent
        professional\njudgment, and we express no opinion with respect to the applicability
        or the effect of the laws of any other jurisdiction to or on the\nmatters
        covered herein.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(b)</TD><TD STYLE=\"text-align:
        justify\">As used in this opinion, the terms &quot;enforceable&quot; and &quot;enforceability&quot;
        mean that the\nrelevant obligation or provision is of a type enforced by the
        Swiss courts in accordance with, and subject to, the rules of procedure\napplicable
        in Switzerland. It is not certain, however, that the Pre-Funded Warrants will
        be enforced in accordance with its terms in every\ncircumstance. In particular,
        enforceability of the Pre-Funded Warrants may be limited by applicable bankruptcy,
        insolvency, reorganization\nor similar laws affecting the rights of creditors
        in general (including, without limitation, the provisions relating to voidable
        preferences\nas set forth in articles 285 et seq. of the Swiss Federal Debt
        Enforcement and Bankruptcy Act of April 11, 1889, as amended), laws or\nprinciples
        of general application (including, but not limited to, the abuse of rights
        (<I>abus de droit</I>) and the principle of good\nfaith (<I>principe de la
        bonne foi</I>), and public policy, as defined in articles 17-19 of the Swiss
        Private International Law Act of\nDecember 18, 1987, as amended (the <B>Private
        International Law Act</B>).</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 21.25pt;
        text-align: justify; text-indent: 0in\">Enforcement before\nthe courts of
        Switzerland will in any event be subject to:</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 21.25pt; text-align: justify;
        text-indent: 0in\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top:
        0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width:
        21.3pt\"></TD><TD STYLE=\"width: 28.35pt\">(i)</TD><TD STYLE=\"text-align:
        justify\">the nature of the remedies available in the Swiss courts (and nothing
        in this opinion should be taken\nas indicating that specific performance (other
        than for the payment of a sum of money) or injunctive relief would be available
        as remedies\nfor the enforcement of such obligations); and</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 21.3pt\"></TD><TD
        STYLE=\"width: 28.35pt\">(ii)</TD><TD STYLE=\"text-align: justify\">the acceptance
        of such courts of jurisdiction and the power of such courts to stay proceedings
        if concurrent\nproceedings are being brought elsewhere.</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(c)</TD><TD STYLE=\"text-align: justify\">Under Swiss
        law, jurisdiction clauses may have no effect with regard to actions relating
        to, or deemed\nto be brought in connection with, insolvency procedures, which,
        as a rule, must be brought before the court at the place of the relevant\ninsolvency
        procedure.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(d)</TD><TD STYLE=\"text-align:
        justify\">Rights and claims may become barred under statutes of limitation
        or prescription, or may be or become\nsubject to available defenses such as
        set-off, counterclaim, misrepresentation, material error, frustration, overreaching,
        duress or fraud.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(e)</TD><TD STYLE=\"text-align:
        justify\">Swiss courts do not consider themselves bound by contractual severability
        provisions or provisions stating\nthat an agreement may only be amended in
        writing.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom: 0pt;
        font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(f)</TD><TD STYLE=\"text-align:
        justify\">Under Swiss law, a notice sent but not actually received may be
        considered not to have been properly given,\nand a document required to be
        signed or to be made in writing may not constitute a valid document if only
        transmitted by fax, e-mail or\nsimilar telecommunication.</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 5; Value: 2 -->\n
        \   <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom: Black
        1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt;
        text-align: right\"><!-- Field: Sequence; Type: Arabic; Name: PageNo -->5<!--
        Field: /Sequence -->/8</P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 6pt\"><P STYLE=\"text-align: right; font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt\"><IMG SRC=\"image_006.jpg\" ALT=\"\">&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(g)</TD><TD STYLE=\"text-align: justify\">Swiss courts
        interpret and construe an agreement in accordance with the principle of good
        faith (<I>interpr&eacute;tation\ndes contrats d'apr&egrave;s les r&egrave;gles
        de la bonne foi</I>) and, in doing so, may consider elements in addition to
        the wording\nof the relevant provisions of such agreement, including, without
        limitation, the circumstances under which such agreement was entered\ninto
        and the real intention of the parties thereto as mutually understood or as
        to be understood in good faith.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(h)</TD><TD
        STYLE=\"text-align: justify\">In making references to the terms of the Pre-Funded
        Warrants, no opinion is expressed as to whether and\nto what extent these
        are sufficiently specified or leave room for interpretation which may, as
        the case may be, become a matter of the\ndiscretion of the courts.</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(i)</TD><TD STYLE=\"text-align: justify\">Where a
        party to the Pre-Funded Warrants are vested with discretion, Swiss law may
        require that such discretion\nis exercised on reasonable grounds. Moreover,
        a determination, calculation, statement or certification as to any matter
        may be held by\na Swiss court not to be final, conclusive or binding if such
        determination, calculation, statement or certification were shown to have\nan
        unreasonable, incorrect or arbitrary basis or not to have been given or made
        in good faith.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(j)</TD><TD STYLE=\"text-align:
        justify\">While Swiss courts have generally the power to grant judgments ordering
        specific performance of an agreement,\nsuch remedy may not always be available
        for the enforcement of an obligation other than for the payment of a sum of
        money.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom: 0pt;
        font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(k)</TD><TD STYLE=\"text-align:
        justify\">The enforceability in Switzerland of a foreign judgment rendered
        against the Company is subject to the\nlimitations set forth in (x) bilateral
        and international treaties by which Switzerland is bound (including, but not
        limited to, the Convention\non Jurisdiction and Enforcement of Judgments in
        Civil and Commercial Matters of October 30, 2007 (the <B>Lugano Convention</B>)),
        and\n(y) the Private International Law Act. In particular, and without limitation
        to the foregoing, a judgment rendered by a foreign court\nmay only be enforced
        in Switzerland if:</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 28.35pt\"></TD><TD STYLE=\"width: 28.35pt\">(i)</TD><TD STYLE=\"text-align:
        justify\">in the case of sub-clause&nbsp;(y) above and, in certain exceptional
        cases, sub-clause&nbsp;(x) above,\nsuch foreign court had jurisdiction;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 28.35pt\"></TD><TD
        STYLE=\"width: 28.35pt\">(ii)</TD><TD STYLE=\"text-align: justify\">such judgment
        has become final and non-appealable, or, in the case of sub-clause&nbsp;(x)
        above, has become\nenforceable at an earlier stage;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 28.35pt\"></TD><TD
        STYLE=\"width: 28.35pt\">(iii)</TD><TD STYLE=\"text-align: justify\">the court
        procedures leading to such judgment followed the principles of due process
        of law, including\nproper service of process, subject to special provisions
        provided for by bilateral and international treaties by which Switzerland
        is\nbound (including, but not limited to, the Lugano Convention);</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 28.35pt\"></TD><TD
        STYLE=\"width: 28.35pt\">(iv)</TD><TD STYLE=\"text-align: justify\">such judgment
        on its merits does not violate Swiss law principles of public policy; and</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 28.35pt\"></TD><TD
        STYLE=\"width: 28.35pt\">(v)</TD><TD STYLE=\"text-align: justify\">from a
        Swiss law perspective, such foreign procedure does not formally or functionally
        qualify as an insolvency-related,\nadministrative or criminal procedure.</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(l)</TD><TD STYLE=\"text-align: justify\">A judgment
        given by a Swiss court in respect of proceedings instituted before it based
        on a claim for\ncurrencies other than Swiss francs may be expressed in such
        currency, if so requested. Enforcement of a claim or court judgment under\nSwiss
        debt collection or bankruptcy proceedings may only be made in Swiss francs
        and any foreign currency amount must accordingly be converted\ninto Swiss
        francs in accordance with the applicable rules.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 6; Value: 2 -->\n    <DIV STYLE=\"margin-top: 6pt;
        margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: right\"><!-- Field:
        Sequence; Type: Arabic; Name: PageNo -->6<!-- Field: /Sequence -->/8</P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"text-align: right; font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt\"><IMG SRC=\"image_006.jpg\" ALT=\"\">&nbsp;</P></DIV>\n    <!-- Field:
        /Page -->\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR
        STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width:
        21.25pt\">(m)</TD><TD STYLE=\"text-align: justify\">When used in this opinion,
        the term &quot;non-assessable&quot; means that no further contributions have\nto
        be made by the relevant holder of the shares.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(n)</TD><TD
        STYLE=\"text-align: justify\">The exercise of voting rights and rights related
        thereto with respect to any Common Shares or Warrant\nShares is only permissible
        after registration in the Company's share register as a shareholder with voting
        rights in accordance with the\nprovisions of, and subject to the limitations
        provided in, the Articles.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(o)</TD><TD
        STYLE=\"text-align: justify\">We express no opinion as to whether the Registration
        Statement is accurate, true, correct, complete or\nnot misleading. In particular,
        and without limitation to the foregoing, we express no opinion on whether
        the Registration Statement provides\nsufficient information for investors
        to reach an informed assessment of the Company, any companies within the Company's
        consolidation\nperimeter, and/or the Common Shares, Pre-Funded Warrants or
        Warrant Shares.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(p)</TD><TD STYLE=\"text-align:
        justify\">We express no opinion as to tax, banking, insurance or regulatory
        matters or as to any commercial, accounting,\ncalculating, auditing or other
        non-legal matter.</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 21.25pt; text-align:
        center; text-indent: -21.25pt\">* * *</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0 0pt 21.25pt; text-align: center; text-indent:
        -21.25pt\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0; text-align: justify\">We have issued this opinion as of the
        date hereof\nand we assume no obligation to advise you of any changes in fact
        or in law that are made or brought to our attention hereafter.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">We hereby consent to the filing of this opinion\nas an exhibit to
        the Registration Statement and further consent to the reference to our name
        under the caption &quot;Legal Matters&quot;\nin the Prospectus. In giving
        such consent, we do not thereby admit that we are in the category of persons
        whose consent is required under\nSection 7 of the Securities Act.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">This opinion is governed by and shall be construed in accordance
        with\nthe laws of Switzerland.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: center\">[<I>signature page follows</I>]</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        center\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 7; Value: 2 -->\n    <DIV
        STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align:
        right\"><!-- Field: Sequence; Type: Arabic; Name: PageNo -->7<!-- Field: /Sequence
        -->/8</P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom:
        6pt\"><P STYLE=\"text-align: right; font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><IMG SRC=\"image_006.jpg\" ALT=\"\">&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0; text-align: justify\">Sincerely yours,</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">/s/ Homburger AG</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">Homburger
        AG</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt
        0; text-align: justify\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 8; Options:
        Last -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n    <!-- Field:
        /Page -->\n\n</BODY>\n</HTML>\n</TEXT>\n</DOCUMENT>\n<DOCUMENT>\n<TYPE>EX-23.1\n<SEQUENCE>3\n<FILENAME>dp230854_ex2301.htm\n<DESCRIPTION>EXHIBIT
        23.1\n<TEXT>\n<HTML>\n<HEAD>\n     <TITLE></TITLE>\n</HEAD>\n<BODY STYLE=\"font:
        10pt Times New Roman, Times, Serif\">\n\n<P STYLE=\"margin: 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        right\"><B>Exhibit 23.1</B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: right\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: right\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt; color: rgb(26,26,26)\">&nbsp;<IMG
        SRC=\"image_008.jpg\" ALT=\"\"></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt; text-align: center\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt; text-align: center\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt; text-align:
        center\"><FONT STYLE=\"color: #1A1A1A\">CONSENT\nOF INDEPENDENT REGISTERED
        PUBLIC </FONT><FONT STYLE=\"color: #2F2F2F\">ACCOUNTING </FONT><FONT STYLE=\"color:
        #1A1A1A\">FIRM</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 63.25pt 0pt 68.65pt; text-align: center\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt; text-indent:
        0pt\"><FONT STYLE=\"color: #1A1A1A\">We hereby\nconsent to the incorporation
        by reference in this Registration Statement on Form S-3 of ADC Therapeutics
        </FONT><FONT STYLE=\"color: #2F2F2F\">SA\n</FONT><FONT STYLE=\"color: #1A1A1A\">of
        our report dated March 27</FONT><FONT STYLE=\"color: #424242\">, </FONT><FONT
        STYLE=\"color: #2F2F2F\">2025\n</FONT><FONT STYLE=\"color: #1A1A1A\">relating
        to the financial </FONT><FONT STYLE=\"color: #2F2F2F\">statements, which appears
        </FONT><FONT STYLE=\"color: #1A1A1A\">in\nADC Therapeutics SA&lsquo;s Annual
        Report on Form 10-K for the </FONT><FONT STYLE=\"color: #2F2F2F\">year ended
        </FONT><FONT STYLE=\"color: #1A1A1A\">December\n</FONT><FONT STYLE=\"color:
        #2F2F2F\">31, </FONT><FONT STYLE=\"color: #1A1A1A\">2024. </FONT><FONT STYLE=\"color:
        #2F2F2F\">We also </FONT><FONT STYLE=\"color: #1A1A1A\">consent\nto the reference
        to us under the heading </FONT><FONT STYLE=\"color: #424242\">&quot;</FONT><FONT
        STYLE=\"color: #1A1A1A\">Experts </FONT><FONT STYLE=\"color: #424242\">&quot;</FONT><FONT
        STYLE=\"color: #1A1A1A\">in\n</FONT><FONT STYLE=\"color: #2F2F2F\">such </FONT><FONT
        STYLE=\"color: #1A1A1A\">Registration Statement.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0 0pt 5.9pt; text-indent:
        0.4pt\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"></P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" STYLE=\"font:
        10pt Times New Roman, Times, Serif; border-collapse: collapse; width: 100%\">\n<TR
        STYLE=\"vertical-align: top; text-align: left\">\n  <TD STYLE=\"width: 50%\">/s/
        Alex Fuhrer</TD>\n  <TD STYLE=\"width: 50%\">/s/ Demyan Vlaev</TD></TR>\n<TR
        STYLE=\"vertical-align: top; text-align: left\">\n  <TD>Alex Fuhrer</P>\n\n<P
