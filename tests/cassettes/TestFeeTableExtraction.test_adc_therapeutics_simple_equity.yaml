        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(p)</TD><TD STYLE=\"text-align:
        justify\">the Company has not entered and will not enter into any transaction
        which could be construed as repayment\nof share capital (<I>restitution des
        versements</I>); and</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
