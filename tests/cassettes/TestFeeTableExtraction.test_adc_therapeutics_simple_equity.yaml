        duly executed and certified, as applicable, by the individuals purported to
        have executed or certified, as the case may be, such\ndocuments, and any electronic
        signatures on any such document have been affixed thereto by the individual
        to whom such electronic signature\nbelongs and such individual has saved and
        submitted such document as so electronically signed in such a manner so as
        to prevent removal\nor other alteration of such signature;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(c)</TD><TD STYLE=\"text-align: justify\">all signatures
        appearing on all original documents or copies thereof which we have examined
        are genuine\nand authentic;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(d)</TD><TD
        STYLE=\"text-align: justify\">the Registration Statement has been duly filed
        by the Company;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(e)</TD><TD STYLE=\"text-align:
        justify\">the parties to the Pre-Funded Warrants (other than the Company)
        are duly incorporated or formed, as applicable,\nand organized and validly
        existing under the laws of their respective jurisdiction of incorporation
        or formation, as applicable, and have\nthe requisite capacity, power and authority
        to execute, deliver, where applicable, and perform their obligations as provided
        in the Pre-Funded\nWarrants;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(f)</TD><TD
        STYLE=\"text-align: justify\">the Pre-Funded Warrants are within the capacity
        and power of, have been duly authorized, executed and\ndelivered by, and are
        binding on, all parties thereto other than the Company (with respect to Swiss
        law);</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom: 0pt;
        font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(g)</TD><TD STYLE=\"text-align:
        justify\">to the extent relevant for purposes of this opinion, all parties
        to the Pre-Funded Warrants have performed\nand will perform all obligations
        by which they are respectively bound under the Pre-Funded Warrants, and all
        parties to the Pre-Funded\nWarrants are in compliance with all matters of
        validity and enforceability under any law other than, in the case of the Company
        and with\nrespect to the Company, the laws of Switzerland;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(h)</TD><TD STYLE=\"text-align: justify\">as far
        as any obligation under the Pre-Funded Warrants are required to be performed
        in, or by a party\norganized under the laws of, any jurisdiction outside of
        Switzerland, its performance will not be illegal or unenforceable by virtue
        of\nthe laws of such jurisdiction;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(i)</TD><TD
        STYLE=\"text-align: justify\">the parties to the Pre-Funded Warrants entered
        into the Pre-Funded Warrants for <I>bona fide</I> commercial\nreasons and
        on arm's length terms, and none of the directors, officers or agents of any
        such party has or had a conflict of interest with\nsuch party in respect of
        the Documents that would preclude such director, officer or agent from validly
        representing (or granting a power\nof attorney in respect of the Documents
        for) such party;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(j)</TD><TD STYLE=\"text-align:
        justify\">the Excerpt and the Articles are correct, complete and up-to-date
        as of the date hereof and no changes\nhave been made that should have been
        or should be reflected in the Excerpt or the Articles as of the date hereof;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(k)</TD><TD STYLE=\"text-align: justify\">the Board
        Resolutions (i) have been duly adopted in meetings duly convened and otherwise
        in the manner\nset forth therein, (ii) have not been amended, and (iii) are
        in full force and effect;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 3; Value: 2 -->\n    <DIV STYLE=\"margin-top: 6pt;
        margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt
