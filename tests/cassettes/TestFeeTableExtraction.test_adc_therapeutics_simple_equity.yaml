        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">All amounts in the table
        are estimates except the SEC registration fee.\nWe will pay fees and expenses
        incurred by us incident to the registration of the securities. If any shares
        are sold, the selling shareholders\nwill pay any brokerage commissions and/or
        similar charges incurred for the sale of such shares.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B>Item 15. Indemnification
        of Directors and Officers</B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Under Swiss law, a corporation may indemnify its
        directors or officers\nagainst losses and expenses (except for such losses
        and expenses arising from willful misconduct or negligence, although legal
        scholars\nadvocate that at least gross negligence be required), including
        attorney&rsquo;s fees, judgments, fines and settlement amounts actually\nand
        reasonably incurred in a civil or criminal action, suit or proceeding by reason
        of having been the representative of, or serving at\nthe request of, the corporation.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Subject to
        Swiss law, our articles of association provide for indemnification\nof the
        existing and former members of our board of directors and our executive committee
        as well as their heirs, executors and administrators,\nagainst liabilities
        arising in connection with the performance of their duties in such capacity,
        and our articles of association require\nus to advance the expenses of defending
        any action, suit or proceeding to existing and former members of our board
        of directors and our\nexecutive committee to the extent not included in insurance
        coverage or advanced by third parties.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">In addition, under general principles
        of Swiss employment law, an employer\nmay be required to indemnify an employee
        against losses and expenses incurred by such employee in the proper execution
        of their duties\nunder the employment agreement with the company.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">We have entered
        into indemnification agreements with each of the members\nof our board of
        directors and executive officers.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Insofar as indemnification for liabilities arising
        under the Securities\nAct of 1933, as amended (the &ldquo;Securities Act&rdquo;)
        may be permitted to directors, officers and controlling persons of the Company,\nthe
        Company has been advised that, in the opinion of the U.S. Securities and Exchange
        Commission (the &ldquo;SEC&rdquo;), such indemnification\nis against public
        policy as expressed in the Securities Act and is, therefore, unenforceable.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
