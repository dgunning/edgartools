        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: center\"><A NAME=\"a_001\"></A>ABOUT
        THIS PROSPECTUS</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0; text-align: center\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">Before buying any of the common shares
        that the selling shareholders\nare offering, you should carefully read both
        this prospectus and any prospectus supplement with all of the information
        incorporated by\nreference in this prospectus, as well as the additional information
        described under the heading &ldquo;Where You Can Find More Information&rdquo;\nand
        &ldquo;Information Incorporated by Reference.&rdquo; These documents contain
        important information that you should consider when making\nyour investment
        decision. We have filed or incorporated by reference exhibits to the registration
        statement of which this prospectus forms\na part. You should read the exhibits
        carefully for provisions that may be important to you.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">To the extent there is
        a conflict between the information contained\nin this prospectus, on the one
        hand, and the information contained in any prospectus supplement or in any
        document incorporated by reference\nin this prospectus, on the other hand,
        you should rely on the information in this prospectus, provided that if any
        statement in one of\nthese documents is inconsistent with a statement in another
        document having a later date&mdash;for example, a prospectus supplement or\na
        document incorporated by reference in this prospectus&mdash;the statement
        in the document having the later date modifies or supersedes\nthe earlier
        statement.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The information contained in this prospectus, any applicable
        prospectus\nsupplement or any document incorporated by reference in this prospectus
        is accurate only as of their respective dates, regardless of the\ntime of
        delivery of this prospectus, any applicable prospectus supplement or the documents
        incorporated by reference in this prospectus\nor the sale of any common shares.
        Our business, financial condition, results of operations and prospects may
        have changed materially since\nthose dates.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">We and the selling shareholders
        have not authorized anyone to provide\nany information or to make any representations
        other than as contained in this prospectus, any amendment or supplement to
        this prospectus,\nor any free writing prospectus prepared by or on behalf
        of us or to which we may have referred you. We and the selling shareholders
        take\nno responsibility for, and can provide no assurance as to the reliability
        of, any other information that others may give you. This prospectus\ndoes
        not constitute an offer to sell or the solicitation of an offer to buy any
        securities other than the common shares described in this\nprospectus or an
        offer to sell or the solicitation of an offer to buy such common shares in
        any circumstances in which such offer or solicitation\nis unlawful.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">For investors
        outside the United States: Neither we nor any selling\nshareholder have taken
        any action that would permit this offering or the possession or distribution
        of this prospectus in any jurisdiction\nwhere action for those purposes is
        required, other than in the United States. Persons outside the United States
        who come into possession\nof this prospectus must inform themselves about,
        and observe any restrictions relating to, this offering of common shares and
        the distribution\nof this prospectus outside the United States.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Unless otherwise
        indicated or the context otherwise requires, all references\nin this prospectus
        to &ldquo;ADC Therapeutics,&rdquo; &ldquo;ADCT,&rdquo; the &ldquo;Company,&rdquo;
        &ldquo;we,&rdquo; &ldquo;our,&rdquo;\n&ldquo;ours,&rdquo; &ldquo;us&rdquo;
        or similar terms refer to ADC Therapeutics SA and its consolidated subsidiaries.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Trademarks</P>\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">We own various
        trademark registrations and applications, and unregistered\ntrademarks, including
        ADC Therapeutics, ADCT, ZYNLONTA and our corporate logo. All other trade names,
        trademarks and service marks of\nother companies appearing in this prospectus
        are the property of their respective owners. Solely for convenience, the trademarks
        and trade\nnames in this prospectus may be referred to without the <SUP>&reg;</SUP>
        and &trade; symbols, but such references should not be construed\nas any indicator
        that their respective owners will not assert, to the fullest extent under
        applicable law, their rights thereto. We do\nnot intend to use or display
        other companies&rsquo; trademarks and trade names to imply a relationship
        with, or endorsement or sponsorship\nof us by, any other companies.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 4 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->1<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<DIV STYLE=\"padding: 4pt; border: Black 1pt solid\">\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        center\"><A NAME=\"a_002\"></A>PROSPECTUS SUMMARY</P>\n\n<P STYLE=\"font:
        bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: center\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><I>This summary
        highlights information contained elsewhere in this prospectus\nor incorporated
        by reference in this prospectus. This summary may not contain all the information
        that may be important to you, and we\nurge you to read this entire prospectus
        and the documents incorporated by reference in this prospectus carefully before
        deciding to invest\nin our common shares.</I></P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Overview</P>\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">ADC Therapeutics
        is a commercial-stage global leader and pioneer in\nthe field of antibody
        drug conjugates (&ldquo;ADCs&rdquo;). The Company is advancing its proprietary
        ADC technology to transform the treatment\nparadigm for patients with hematologic
        malignancies and solid tumors. The Company&rsquo;s CD19-directed ADC ZYNLONTA
        (<I>loncastuximab\ntesirine-lpyl</I>) received accelerated approval by the
        Food and Drug Administration (&ldquo;FDA&rdquo;) and conditional approval
        from\nthe European Commission for the treatment of relapsed or refractory
        diffuse large B-cell lymphoma after two or more lines of systemic\ntherapy.
        ZYNLONTA is also in development in combination with other agents and in earlier
        lines of therapy.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Recent Developments</P>\n\n<P STYLE=\"font: bold
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>Private Placement</I></B></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">On June 11,
        2025, we entered into securities purchase agreements for\nthe sale of our
        equity securities to certain institutional investors in a $100 million private
        placement. In the private placement, we\nsold 13,031,161 common shares at
        $3.53 per share, which is the last reported sale price of the common shares
        on the New York Stock Exchange\non June 11, 2025, and pre-funded warrants
        to purchase 15,734,267 common shares at $3.432 per pre-funded warrant, which
        is the price per\ncommon share in the private placement minus the exercise
        price per pre-funded warrant. The private placement closed on June 16, 2025.\nFor
        additional information, see our Current Report on Form 8-K filed with the
        SEC on June 12, 2025 and incorporated by reference in this\nprospectus. We
        are filing the registration statement of which this prospectus forms a part
        to permit the resale of the common shares sold\nin the private placement and
        the common shares issuable upon exercise of the pre-funded warrants sold in
        the private placement.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B><I>LOTIS-7 Data</I></B></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">On June 12, 2025, we announced
        updated data from the LOTIS-7 Phase 1b\nopen-label clinical trial evaluating
        the safety and efficacy of ZYNLONTA in combination with the bispecific antibody
        glofitamab in patients\nwith relapsed or refractory diffuse large B-cell lymphoma.
        The updated data is as of April 14, 2025. Relapsed or refractory LBCL patients\nreceived
        dose levels of 120 &micro;g/kg or 150 &micro;g/kg of ZYNLONTA plus the bispecific
        antibody glofitamab, with 41 patients evaluable\nfor safety and 30 patients
        evaluable for efficacy. The following are highlights of the updated data:</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">Best overall response data among the 30 efficacy
        evaluable patients shows\noverall response rate (&ldquo;ORR&rdquo;) of 93.3%
        (28/30 patients) as assessed by Lugano Criteria</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">Complete response (&ldquo;CR&rdquo;)
        rate of 86.7% (26/30 patients). Of these,\n25/26 patients achieving CR remain
        in CR as of the data cut-off</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.75in\"></TD><TD STYLE=\"width: 0.25in\">o</TD><TD>Median
        time to CR in 120 &micro;g/kg = 80 days</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.75in\"></TD><TD STYLE=\"width: 0.25in\">o</TD><TD>Median
        time to CR in 150 &micro;g/kg = 42 days</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">12 patients converted from stable disease (&ldquo;SD&rdquo;)
        or partial response\n(&ldquo;PR&rdquo;) to CR over time (1 and 11 patients,
        respectively)</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">Of the 6 patients previously treated with CAR-T and undergoing
        response assessment,\n5 achieved a CR</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\"></P>\n\n</DIV>\n\n\n<!--
        Field: Page; Sequence: 5 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->2<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<DIV STYLE=\"padding: 4pt; border: Black 1pt solid\">\n\n<P
        STYLE=\"margin-top: 0; margin-bottom: 0\"></P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">Among the 41 safety evaluable patients, the combination was generally
        well\ntolerated with a manageable safety profile and no DLTs across dose levels</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.75in\"></TD><TD
        STYLE=\"width: 0.25in\">o</TD><TD>Grade 3 or higher treatment emergent adverse
        events (&ldquo;TEAEs&rdquo;) observed in &gt; 5% of patients included neutropenia
        (24.4%),\nanemia (9.8%), AST increased (7.3%), GGT increased (7.3%), and thrombocytopenia
        (7.3%)</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom: 0pt;
        font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.75in\"></TD><TD STYLE=\"width: 0.25in\">o</TD><TD>In the
        150 &micro;g/kg dose, cytokine release syndrome (&ldquo;CRS&rdquo;) (23.8%),
        all of which were Grade 1, and immune effector\ncell-associated neurotoxicity
        syndrome (&ldquo;ICANS&rdquo;) (4.8%), with one case of Grade 2, were observed</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.75in\"></TD><TD
        STYLE=\"width: 0.25in\">o</TD><TD>In the 120 &micro;g/kg dose, CRS all grades
        (55%), all of which were Grade 1/2 except one case of Grade 3, and ICANS (10%),
        with one\ncase of Grade 1 and one case of Grade 2, were observed</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.75in\"></TD><TD
        STYLE=\"width: 0.25in\">o</TD><TD>TEAEs leading to discontinuation included
        3 each for ZYNLONTA and glofitamab</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.75in\"></TD><TD STYLE=\"width: 0.25in\">o</TD><TD>There
        were no Grade 5 TEAEs observed</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>MZL
        Data</I></B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">On June 16, 2025, we announced updated data from a Phase 2
        multicenter\ninvestigator-initiated trial (&ldquo;IIT&rdquo;) of ZYNLONTA
        to treat relapsed/refractory marginal zone lymphoma (&ldquo;r/r MZL&rdquo;),\nbeing
        conducted at the Sylvester Comprehensive Cancer Center at the University of
        Miami and at City of Hope. As of February 10, 2025,\na total of 27 adult patients
        with r/r MZL and previously treated with &ge;1 line of systemic therapy were
        enrolled with 26 patients evaluable\nfor response. Highlights of the data
        include:</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">ORR of 84.6% (22/26);
        CR rate of 69.2% (18/26)</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">Among POD24 patients assessed for response,
        a CR rate of 61.5% (8/13) was\nobserved </FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">CR was maintained in 17 of 18 CR patients who
        achieved CR, with longest duration\nof CR of 27 months from start of treatment</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">Progression-free survival
        (&ldquo;PFS&rdquo;) was 92.9% at 12 months </FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">27 enrolled patients experienced
        adverse events (&ldquo;AE&rdquo;), consistent\nwith the known safety profile
        of ZYNLONTA and most commonly grade 1 or 2. Grade 3 and 4 AEs were observed
        in 16 and 2 patients, respectively,\nand included neutropenia, RSV lung infection
        and hyponatremia (with 2 AEs occurring in the same patient). Three patients
        needed dose reduction\nand one patient discontinued treatment after cycle
        4 due to cholestatic hepatitis that fully recovered.</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Company and Corporate Information</P>\n\n<P STYLE=\"font:
