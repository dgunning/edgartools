        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">Any broker-dealers or agents that are involved in selling the securities\nmay
        be deemed to be &ldquo;underwriters&rdquo; within the meaning of the Securities
        Act in connection with such sales. In such event,\nany commissions received
        by such broker-dealers or agents and any profit on the resale of the securities
        purchased by them may be deemed\nto be underwriting commissions or discounts
        under the Securities Act. Each selling shareholder has informed us that, at
        the time of its\nacquisition of the common shares or the warrants, as applicable,
        it did not have any written or oral agreement or understanding, directly\nor
        indirectly, with any person to distribute the securities.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">We are required to pay
        certain fees and expenses incurred by us incident\nto the registration of
        the securities. We have agreed to indemnify the selling shareholders against
        certain losses, claims, damages and\nliabilities, including civil liabilities
        under the Securities Act.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Any securities covered by this prospectus which qualify for
        sale pursuant\nto Rule 144 under the Securities Act may be sold under Rule
        144 rather than under this prospectus or any other exemptions from registration\nunder
        the Securities Act.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">We agreed to keep the registration statement of which this
        prospectus\nis a part effective until such time as all securities included
        in the registration statement have been sold pursuant to the registration\nstatement,
        have been sold pursuant to Rule 144, are eligible for resale without volume
        or manner-of-sale restrictions and without current\npublic information requirements
        pursuant to Rule 144 or are no longer outstanding or June 16, 2028.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under applicable
        rules and regulations under the Exchange Act, any person\nengaged in the distribution
        of the resale securities may not simultaneously engage in market making activities
        with respect to the common\nshares for the applicable restricted period, as
        defined in Regulation M, prior to the commencement of the distribution. In
        addition, the\nselling shareholders will be subject to applicable provisions
        of the Exchange Act and the rules and regulations thereunder, including\nRegulation
        M.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt
