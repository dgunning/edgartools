        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: center\"><A NAME=\"a_006\"></A>DIVIDEND
        POLICY</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0; text-align: center\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">We have never declared or paid cash dividends
        on our share capital.\nWe intend to retain all available funds and any future
        earnings, if any, to fund the development and expansion of our business and
        we\ndo not anticipate paying any cash dividends in the foreseeable future.
        In addition, agreements governing our indebtedness, including the\nLoan Agreement,
        limit our ability to pay dividends. Any future determination related to dividend
        policy will be made at the discretion\nof our board of directors and will
        depend upon, among other factors, our results of operations, financial condition,
        capital requirements,\ncontractual restrictions, business prospects and other
        factors our board of directors may deem relevant.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under Swiss law, any dividend
        must be approved by our shareholders.\nIn addition, our auditors must confirm
        that the dividend proposal of our board of directors to the shareholders conforms
        to Swiss statutory\nlaw and our articles of association. A Swiss corporation
        may pay dividends only if it has sufficient distributable profits from the
        previous\nor current business year (<I>b&eacute;n&eacute;fice r&eacute;sultant
        du bilan</I>) or brought forward from previous business years (<I>report\ndes
        b&eacute;n&eacute;fices</I>) or if it has distributable reserves (<I>r&eacute;serves
        &agrave; libre disposition</I>), each as evidenced\nby its audited stand-alone
        statutory balance sheet prepared pursuant to Swiss law and after allocations
        to reserves required by Swiss\nlaw and its articles of association have been
        deducted. Distributable reserves are generally booked either as free reserves
        (<I>r&eacute;serves\nlibres</I>) or as reserves from capital contributions
        (<I>apports de capital</I>). Distributions out of share capital, which is
        the aggregate\npar value of a corporation&rsquo;s issued shares, may be made
        only by way of a share capital reduction. See &ldquo;Description of Share\nCapital
        and Articles of Association.&rdquo;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 12
        -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->9<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        center\"><A NAME=\"a_007\"></A>DESCRIPTION OF SHARE CAPITAL AND ARTICLES OF\nASSOCIATION</P>\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        center\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B>The Company</B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">We are a Swiss stock corporation (<I>soci&eacute;t&eacute;
        anonyme</I>)\norganized under the laws of Switzerland. We were incorporated
        &lrm;as a Swiss limited liability company (<I>soci&eacute;t&eacute; &agrave;\nresponsabilit&eacute;
        limit&eacute;e</I>) on June 6, 2011 with our registered office and &lrm;domicile
        in Epalinges, Canton of Vaud, Switzerland.\nWe converted to a Swiss stock
        corporation under the laws of &lrm;Switzerland on October 13, 2015. Our domicile
        is in Epalinges, Canton\nof Vaud, Switzerland. Our registered office &lrm;and
        head office is currently located at Biop&ocirc;le, Route de la Corniche 3B,
        1066\nEpalinges, Switzerland.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><B>Articles of Association</B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>Ordinary Capital
        Increase, Capital Range and Conditional Share\nCapital</I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under Swiss law, we may
        increase our share capital (<I>capital-actions</I>)\nwith a resolution of
        the general meeting of &lrm;shareholders (ordinary capital increase) that
        must be carried out by the board of directors\nwithin six months of &lrm;the
        respective general meeting in order to become effective. Under our articles
        of association and Swiss law,\nin the &lrm;case of subscription and increase
        against payment of contributions in cash, a resolution passed by a &lrm;majority
        of the\nshares represented at the general meeting of shareholders is required.
        In the case of subscription and &lrm;increase against contributions\nin kind
        or to fund acquisitions in kind, when shareholders&rsquo; statutory pre-emptive
        &lrm;subscription rights or advance subscription\nrights are limited or withdrawn
        or where transformation of freely &lrm;disposable equity into share capital
        is involved, a resolution\npassed by two-thirds of the shares represented
        at a &lrm;general meeting of shareholders and the majority of the par value
        of the shares\nrepresented is required.&lrm;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under the Swiss Code of
        Obligations (<I>Code des obligations</I>) (the\n&ldquo;CO&rdquo;), our shareholders,
        by a &lrm;resolution passed by two-thirds of the shares represented at a general
        meeting of shareholders\nand the &lrm;majority of the par value of the shares
        represented, can:</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">adopt conditional share
        capital (<I>capital-actions conditionnel</I>) in the\naggregate amount of
        up to 50% of the share capital for the purpose of issuing shares in connection
        &lrm;with, among other things, option\nand conversion rights granted to shareholders,
        the creditors of bonds and similar debt instruments, employees, members &lrm;of
        the board\nof directors of the Company or of any group company, or to any
        third parties; and</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">in the form of capital range (<I>marge de fluctuation
        du capital</I>), empower\nour board of directors to increase and/or decrease
        our share capital by up to 50% of the share capital, by issuing or canceling
        shares,\nor by increasing or decreasing the par value of shares, including
        through the creation of conditional share capital; such capital range\nis
        to be utilized by the board of directors within a period &lrm;determined by
        the shareholders but not exceeding five years from the\ndate of the shareholder
        approval.&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>Pre-Emptive and Advance
        Subscription Rights</I></B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Pursuant to the CO, shareholders have pre-emptive
        subscription rights\n(<I>droits de souscription pr&eacute;f&eacute;rentiels</I>)
        to &lrm;subscribe for new issuances of shares. With respect to conditional\ncapital,
        shareholders have (i) pre-emptive subscription rights for the subscription
        of option rights and (ii) advance subscription rights\n&lrm;&lrm;(<I>droit
        de souscription pr&eacute;alable</I>) for the subscription of bonds and similar
        debt &lrm;instruments to which option\nor conversion rights are attached.&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">A resolution
        passed at a general meeting of shareholders by two-thirds\nof the shares represented
        and the &lrm;majority of the par value of the shares represented may authorize
        our board of directors to withdraw\nor limit pre-&lrm;emptive subscription
        rights or advance subscription rights in certain circumstances.&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">If pre-emptive
        subscription rights are granted, but not exercised, the\nboard of directors
        may allocate the unexercised &lrm;pre-emptive subscription rights at its discretion.&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 13 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->10<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\"><B><I>Our Capital Range </I></B></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under our articles of association,
        we have a capital range ranging from\nCHF 8,144,884.08 (lower limit) to CHF
        12,123,038.40 (upper limit). Our board of directors is authorized within the
        capital range to increase\nor decrease our share capital once or several times
        and in any amounts and to acquire or dispose of shares, directly or indirectly,
        until\nNovember 11, 2029, or until an earlier expiry of the capital range.
        The capital increase or reduction may be effected by issuing fully\npaid-in
        registered shares with a par value of CHF 0.08 each and cancelling registered
        shares with a par value of CHF 0.08 each, as applicable,\nor by increasing
        or reducing the par value of the existing shares within the limits of the
        capital range or by simultaneous reduction\nand re-increase of the share capital.&nbsp;&nbsp;If
        our share capital increases as a result of a share issue from conditional
        capital\n(see next subsection), the upper and lower limits of the capital
        range will increase in an amount corresponding to such increase.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">In the event
        of a capital increase within the capital range, the board\nof directors has
        to determine the type of &lrm;contributions, the issue price and the date
        on which the dividend entitlement starts.&lrm;\nIn the event of a capital
        reduction within the capital range, the board of directors has to determine
        the use of the reduction amount,\nto the extent necessary.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">In a capital increase within
        the capital range, the board of directors\nis authorized by our articles of
        association to &lrm;withdraw or to limit the pre-emptive subscription rights
        of shareholders, and to\nallocate them to third parties or to us, &lrm;in
        the event that the newly issued shares are issued under the following circumstances:</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">if the issue price of the new registered shares
        is determined by reference\nto the market price;&lrm;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">for raising of equity
        capital (including private placements) in a fast and\nflexible manner, which
        would not be &lrm;possible, or might only be possible with great difficulty
        or delays or at significantly less\nfavorable &lrm;conditions, without the
        exclusion of the statutory pre-emptive subscription rights of the existing
        &lrm;shareholders;&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">for the acquisition of an enterprise, parts
        of an enterprise or participations,\nfor the acquisition of products, &lrm;intellectual
        property or licenses by or for investment projects of the Company or any of
        its group\n&lrm;companies, or for the financing or refinancing of any of such
        transactions through a placement of shares;&lrm;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">for purposes of broadening
        the shareholder constituency of the Company in\ncertain geographic, financial
        &lrm;or investor markets, for purposes of the participation of strategic partners,
        including financial investors,\nor in connection with the listing &lrm;of
        new shares on domestic or foreign stock exchanges;&lrm;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">for purposes of granting
        an over-allotment option or an option to purchase\nadditional shares in a
        &lrm;placement or sale of shares to the respective initial purchaser(s) or
        underwriter(s);&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">for the participation of members of the board
        of directors, members of the\nexecutive committee, &lrm;employees, contractors,
        consultants or other persons performing services for the benefit of the Company
        &lrm;or\nany of its group companies;&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">following a shareholder or a group of shareholders
        acting in concert having\naccumulated shareholdings in &lrm;excess of 20%
        of our share capital registered in the Commercial Register without having
        submitted to\nall &lrm;other shareholders a takeover offer recommended by
        the board of directors;<B><I>&lrm;</I></B></FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">for the defense of an
        actual, threatened or potential takeover bid, that the\nboard of directors,
        upon &lrm;consultation with an independent financial adviser retained by it,
        has not recommended to the &lrm;shareholders\nacceptance on the basis that
        the board of directors has not found the takeover bid to be &lrm;financially
        fair to the shareholders or\nnot to be in the Company&rsquo;s interest; or</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 14 -->\n    <DIV
        STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top:
        0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name:
        PageNo -->11<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial,
        Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">for other valid grounds in the sense of Article
        652b para. 2 of the CO.&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">This authorization
        to withdraw or to limit the pre-emptive subscription\nof shareholders is exclusively
        linked to our capital range. If the capital range lapses for any reasons,
        such as if an ordinary capital\nincrease is completed, the authorization to
        withdraw or to limit the pre-emptive subscription rights lapses &lrm;simultaneously
        with the\ncapital range.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">We have agreed not to use the foregoing authorization
        to &lrm;withdraw\nor to limit the pre-emptive subscription rights of shareholders,
        and to allocate them to third parties or to us, in certain circumstances.\nSpecifically,
        we will not restrict the preemptive rights of Redmile Group, LLC (&ldquo;Redmile&rdquo;)
        or its affiliates based on Article\n4a(4)(g) of the articles of association
        or restrict the advance subscription rights of Redmile or its affiliates based
        on Article 4c(3)\nof the articles of association as long as (i) Redmile (including
        its affiliates and any other person or entity forming a &ldquo;group&rdquo;\n(as
        defined in Rule 13d-5 under the Exchange Act)) does not directly or indirectly
        control, own or have the right to control or own, collectively,\nshares representing
        more than 20% of the Company&rsquo;s share capital or (ii) Redmile (including
        its affiliates and any other person\nor entity forming a &ldquo;group&rdquo;
        (as defined in Rule 13d-5 under the Exchange Act)) directly or indirectly
        controls, owns or has\nthe right to control or own, collectively, shares representing
        more than 20% of the Company&rsquo;s share capital but the board of directors\ndetermines
        that Redmile does not have an intent to effect a change of control of the
        Company.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B><I>Our Conditional Share Capital</I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><I>Conditional Share Capital
        for Warrants and Convertible Bonds</I></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our nominal share capital may
        be increased, including to prevent takeovers\nand changes in control, by a
        maximum &lrm;aggregate amount of CHF 3,042,154.32 through the issuance of
        not more than 38,026,929 common\nshares, which &lrm;would have to be fully
        paid-in, each with a par value of CHF 0.08 per share, by the exercise of option
        and &lrm;conversion\nrights granted in connection with warrants, convertible
        bonds or similar instruments of the Company or &lrm;one of our subsidiaries.
        Shareholders\nwill not have pre-emptive subscription rights in such circumstances,
        but will &lrm;have advance subscription rights to subscribe for such\nwarrants,
        convertible bonds or similar instruments. The &lrm;holders of warrants, convertible
        bonds or similar instruments are entitled\nto the new shares upon the occurrence
        of &lrm;the applicable conversion feature.&lrm;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">When issuing convertible
        bonds, warrants or similar instruments, the\nboard of directors is authorized
        to withdraw or &lrm;to limit the advance subscription right of shareholders:&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">for the purpose of financing or refinancing,
        or the payment for, the acquisition\nof enterprises, parts of &lrm;enterprises,
        participations, intellectual property rights, licenses or investments;&lrm;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">if the issuance occurs
        in domestic or international capital markets, including\nprivate placements;&lrm;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">following a shareholder
        or a group of shareholders acting in concert having\naccumulated shareholdings
        in &lrm;excess of 20% of the share capital registered in the Commercial Register
        without having submitted to\nall &lrm;other shareholders a takeover offer
        recommended by the board of directors; </FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">for the defense of an actual, threatened or
        potential takeover bid that the\nboard of directors, upon &lrm;consultation
        with an independent financial adviser retained by it, has not recommended
        to the &lrm;shareholders\nto accept on the basis that the board of directors
        has not found the takeover bid to be &lrm;financially fair to the shareholders
        or not\nto be in the Company&rsquo;s interest; or</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">if the convertible bonds,
        warrants or similar instruments are issued on appropriate\nterms.&lrm;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">To the extent that the advance subscription rights are withdrawn
        or\nlimited, (i) the term to exercise the convertible bonds, warrants or &lrm;similar
        instruments may not exceed fifteen years from the date\nof issue of the respective
        instrument and (ii) the conversion, exchange or exercise price of &lrm;the
        convertible bonds, warrants or similar\ninstruments has to be set with reference
        to or be subject to change based &lrm;upon the valuation of the Company&rsquo;s
        equity or market\nconditions.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 15
        -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->12<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><I>Conditional
        Share Capital for Equity Incentive Plans</I></P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our nominal share capital
        may, to the exclusion of the pre-emptive subscription\nrights and advance
        subscription &lrm;rights of shareholders, be increased by a maximum aggregate
        amount of CHF 1,022,100.72 through the\n(direct or &lrm;indirect) issuance
        of not more than 12,776,259 common shares, which would have to be fully paid-in,
        each with a &lrm;par\nvalue of CHF 0.08 per share, by the exercise or mandatory
        exercise of options, other rights to receive or acquire shares or conversion\nrights
        that &lrm;have been granted to or imposed on employees, members of the board
        of directors, contractors or consultants of the Company\nor &lrm;of one of
        our subsidiaries or other persons providing services to the Company or to
        a subsidiary through one or &lrm;more equity\nincentive plans created by the
        board of directors.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B><I>Uncertificated Securities</I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our shares are in the form
        of uncertificated securities (<I>droits-valeurs</I>,\nwithin the meaning of
        Article 973c of the CO). &lrm;In accordance with Article 973c of the CO, we
        maintain a non-public register of uncertificated\nsecurities &lrm;&lrm;(<I>registre
        des droits-valeurs</I>). We may at any time convert uncertificated securities
        into share certificates\n(including &lrm;global certificates), one kind of
        certificate into another, or share certificates (including global certificates)
        into\n&lrm;uncertificated securities. Following entry in the share register,
        a shareholder may at any time request from us a &lrm;written confirmation\nin
        respect of his or her shares. Shareholders are not entitled, however, to request
        the conversion &lrm;and/or printing and delivery of\nshare certificates. We
        may print and deliver certificates for shares at any time.&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>General
        Meeting of Shareholders</I></B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><I>Ordinary/Extraordinary Meetings, Powers</I></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The general
        meeting of shareholders is our supreme corporate body. Under\nSwiss law, an
        annual general meeting of &lrm;shareholders must be held annually within six
        months after the end of a corporation&rsquo;s\nfinancial year. In our case,
        &lrm;this generally means on or before June 30. In addition, extraordinary
        general meetings of shareholders\nmay be held.&lrm;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">A general meeting of shareholders
        may take place in or outside Switzerland\nand at different places simultaneously
        if the votes of the participants are immediately transmitted to all meeting
        venues (multilocal\nshareholders&rsquo; meeting). The board of directors may
        allow shareholders that are not present at the meeting venue of the general
        meeting\nof shareholders to participate and exercise their rights electronically
        (&ldquo;hybrid shareholder meeting&rdquo;). Our articles of association\nalso
        allow for general meetings of shareholders without a physical meeting venue
        but that takes place using electronic means (&ldquo;virtual\nshareholder meeting&rdquo;).</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">According
        to our articles of association, the following powers are vested\nexclusively
        in the general meeting of shareholders:</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">adopting and amending the articles of association, including
        the change of\na company&rsquo;s purpose or domicile;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">electing the members of
        the board of directors, the chairperson of the board\nof directors, the members
        of the compensation committee, the auditors and the independent proxy;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">approving the business
        report, the annual statutory and consolidated financial\nstatements, and deciding
        on the allocation of profits as shown on the balance sheet, in particular
        with regard to dividends;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">determining the interim dividend and approving
        the requisite interim financial\nstatements;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 16 -->\n    <DIV
        STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top:
        0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name:
        PageNo -->13<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial,
        Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">resolving on the repayment of the statutory
        capital reserve (<I>r&eacute;serve\nl&eacute;gale issue du capital</I>);</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">approving the aggregate
        amount of compensation of members of the board of\ndirectors and the executive
        committee;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">discharging the members of the board of directors and the executive
        committee\nfrom liability with respect to their conduct of business;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">resolving on the delisting
        of the company's equity securities; </FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">approving the report on non-financial matters
        (if applicable);</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">dissolving a company with or without liquidation; and</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">deciding matters reserved
        to the general meeting of shareholders by law or\nthe articles of association
        or submitted to it by the board of directors.</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">An extraordinary general meeting of shareholders may be called
        by a\nresolution of the board of directors or the &lrm;general meeting of
        shareholders or, under certain circumstances, by a company&rsquo;s\nauditors,
        liquidator or the &lrm;representatives of bondholders, if any. In addition,
        our articles of association require the board of\ndirectors to convene an
        extraordinary &lrm;general meeting of shareholders if shareholders representing
        at least 5% of our share capital\nor voting rights request such general &lrm;meeting
        of shareholders in writing. A request for an extraordinary general meeting
        of shareholders\nmust set forth the items to be discussed and the proposals
        to be &lrm;acted upon. Further, the board of directors must convene an extraordinary\ngeneral
        meeting of shareholders and propose &lrm;financial restructuring measures
        if, based on our stand-alone annual statutory balance\nsheet, half of our
        share &lrm;capital and statutory reserves are not covered by our assets and
        a contemplated restructuring measure falls\nwithin the competence of the general
        meeting of shareholders.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><I>Voting and Quorum Requirements</I></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Shareholder
        resolutions and elections (including elections of members\nof the board of
        directors) require the &lrm;affirmative vote of the majority of shares represented
        at the general meeting of shareholders,\nunless &lrm;otherwise stipulated
        by law or our articles of association.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under our articles of association,
        a resolution of the general meeting\nof shareholders passed by &lrm;two-thirds
        of the votes and the majority of the par value of the shares, each as &lrm;represented
        at the\nmeeting, is required for:&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">amending the Company&rsquo;s corporate purpose;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">creating shares with preference
        rights;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">cancelling or amending the transfer restrictions of shares;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">creating conditional share
        capital or a capital range;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">increasing share capital out of equity, against
