        of all Warrant Shares\nnot yet issued, will be presented or order made by
        a court for the winding-up, dissolution, bankruptcy or administration of any
        party\n(other than the Company); and no receiver, trustee in bankruptcy, administrator
        or similar officer has been or, until the issuance of\nall Warrant Shares
        not yet issued, will have been appointed in relation to any of the parties
        (other than the Company) or any of their\nassets or revenues;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(m)</TD><TD STYLE=\"text-align: justify\">except
        as expressly opined upon herein, and to the extent relevant for purposes of
        this opinion, all information\nand confirmations contained in the Documents,
        and all material statements made to us in connection with the Documents, are
