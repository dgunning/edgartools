        entitled &ldquo;Plan\nof Distribution&rdquo; at prevailing market prices,
        at prices different than prevailing market prices or at privately negotiated
        prices.\nIf any common shares are sold, the selling shareholders will pay
        any brokerage commissions and/or similar charges incurred for the sale\nof
        such shares.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">As required by the securities purchase agreements, dated June
        11, 2025,\nwith the selling shareholders, we are filing the registration statement
        of which this prospectus forms a part to permit the resale of\n11,991,785
        common shares and 15,734,267 common shares issuable upon exercise of the pre-funded
        warrants, in each case, issued and sold\nto the selling shareholders pursuant
        to such securities purchase agreements. We do not know whether, when or the
        extent to which the selling\nshareholders will sell the common shares.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">We are not
        selling any common shares included in this prospectus and\nwill not receive
        any of the proceeds from the sale of any common shares by the selling shareholders
        pursuant to this prospectus. However,\nif the pre-funded warrants are exercised
        in cash, we may receive up to an aggregate of CHF 1,258,741.36 from such exercise,
        which will\nbe used for working capital and general corporate purposes.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our common
        shares are listed on the New York Stock Exchange (&ldquo;NYSE&rdquo;)\nunder
        the symbol &ldquo;ADCT.&rdquo;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><B>Investing in our common shares involves a high
        degree of risk. See\nthe &ldquo;Risk Factors&rdquo; section beginning on page&nbsp;5
        of this prospectus and in our Securities and Exchange Commission (&ldquo;SEC&rdquo;)\nfilings
        that are incorporated by reference in this prospectus.</B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B>Neither the Securities
        and Exchange Commission nor any state securities\ncommission has approved
