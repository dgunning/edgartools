        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">no proceeding involving
        the same position and the same subject matter was\nfirst brought in Switzerland,
        or adjudicated in Switzerland, or was earlier adjudicated in a third state
        and this decision is recognizable\nin Switzerland.</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
