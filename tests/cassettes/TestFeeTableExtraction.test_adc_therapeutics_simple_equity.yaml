        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">dissolving or liquidating
        the Company.</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The same voting requirements
        apply to resolutions regarding transactions\namong corporations based on Switzerland&rsquo;s
        Federal Act on Mergers, Demergers, Transformations and the Transfer of Assets
        of 2003,\nas amended (the &ldquo;Swiss Merger Act&rdquo;). See &ldquo;&mdash;Articles
        of Association&mdash;Compulsory Acquisitions; Appraisal Rights.&rdquo;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">In accordance
        with Swiss law and generally accepted business practices,\nour articles of
        association do not provide for quorum requirements generally applicable to
        general meetings of shareholders. To this extent,\nour practice varies from
        NYSE listing standards, which require an issuer to provide in its bylaws for
        a generally applicable quorum and\nthat such quorum may not be less than one-third
        of the outstanding voting shares.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><I>Notice</I></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">General meetings of shareholders
        must be convened by the board of directors\nat least 20 days before the date
        of &lrm;the meeting. The general meeting of shareholders is convened by way
        of a notice appearing in\nour official &lrm;publication medium, currently
        the Swiss Official Gazette of Commerce, or by including the notice in the
        proxy statement.\nRegistered shareholders may also be &lrm;informed in a form
        that allows proof by text. The notice of a general meeting of shareholders\nmust
        state the date, the starting and end time, the form and location of the meeting,
        the items on the &lrm;agenda, the motions of the\nboard of directors or of
        any shareholders including a short explanation, as well as the name and address
        of the independent representative.\nA &lrm;resolution on a matter which is
        not on the agenda may not be passed at a general meeting of shareholders,
        except &lrm;for motions\nto convene an extraordinary general meeting of shareholders
        or to initiate a special investigation, on &lrm;which the general meeting\nof
        shareholders may vote at any time. No previous notification is required for
        motions &lrm;concerning items included in the agenda or\nfor debates that
        do not result in a vote.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">All owners or representatives of our shares may,
        if no objection is\nraised, hold a general meeting of shareholders without
        complying with the formal requirements for convening general meetings of shareholders\n(a&nbsp;universal
        meeting). This universal meeting of shareholders may discuss and pass binding
        resolutions on all matters within the\npurview of the general meeting of shareholders,
        provided that the owners or representatives of all the shares are present
        at the meeting.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><I>Agenda Requests</I></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Pursuant to our articles of
        association, one or more shareholders whose\ncombined shareholdings &lrm;represent
        at least 0.5% of the share capital or the voting rights &lrm;may request that
        an item be included\nin the agenda for a general meeting of shareholders or
        that a proposal relating to an agenda item be included in the notice convening\nthe
        general meeting of shareholders.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 18
        -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->15<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">To be timely,
        the &lrm;shareholder&rsquo;s request must be received\nby us generally at
        least 90 calendar days in advance of the meeting. The &lrm;request must be
        made in writing and contain, for each of\nthe agenda items, the following
        information:&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">a brief description of
        the business desired to be brought before the general\nmeeting of shareholders
        and the reasons for conducting such business at the general meeting of shareholders;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">the motions regarding
        the agenda item; </FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">the name and address, as they appear in the
        share register, of the shareholder\nproposing such business;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">the number of shares which
        are beneficially owned by such shareholder (including\ndocumentary support
        of such beneficial ownership);</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">the dates upon which the shareholder acquired
        such shares;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">any material interest of the proposing shareholder in the proposed
        business;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">a statement in support of the matter; and </FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">all other information
        required under the applicable laws and stock exchange\nrules.</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">In addition, if the shareholder intends to solicit proxies
        from the\nshareholders of a company, such shareholder shall notify the company
        of this intent in accordance with applicable SEC rules.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our business report, the
        compensation report and the auditor&rsquo;s\nreport must be published or otherwise
        made accessible to our &lrm;shareholders no later than 20 days prior to the
        general meeting of shareholders.\nShareholders &lrm;of record may be notified
        of this in writing.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><I>Minutes</I></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">We are required to make available the resolutions
        and election results\nof our general meeting of shareholders electronically
        within 15 calendar days after the meeting. In addition, each shareholder may
        request\nthat the minutes be made available to him/her within 30 calendar
        days after the meeting.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B><I>Voting Rights</I></B></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Each of our common shares entitles
        a holder to one vote. The common\nshares are not divisible. The right to vote
        and the other rights of share ownership may only be exercised by shareholders
        (including any\nnominees) or usufructuaries who are entered in the share register
        at a cut-off date determined by the board of directors. Those entitled\nto
        vote in the general meeting of shareholders may be represented by the independent
        proxy holder (annually elected by the general meeting\nof shareholders), by
        its legal representative or by any other person with written authorization
        to act as proxy. The chairperson has the\npower to decide whether to recognize
        a power of attorney.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Our articles of association contain provisions that prevent
        investors\nfrom acquiring voting rights exceeding 15% of our issued share
        capital. Specifically, if an individual or legal entity acquires common\nshares
        and, as a result, directly or indirectly, has voting rights with respect to
        more than 15% of the registered share capital recorded\nin the Commercial
        Register, the registered shares exceeding the limit of 15% shall be entered
        in the share register as shares without\nvoting rights (<I>limitation &agrave;
        l&rsquo;inscription</I>). This restriction applies equally to parties acting
        in concert and to shares\nheld or acquired via a nominee, including via Cede
        &amp; Co., New York (or any successor), as the nominee of The Depository Trust
        Company\n(&ldquo;DTC&rdquo;), New York, acting in its capacity as clearing
        nominee. Specifically, if shares are being held by a nominee for third-party\nbeneficiaries,
        which control (alone or together with third parties) voting rights with respect
        to more than 15% of the share capital recorded\nin the Commercial Register,
        our articles of association provide that the board of directors may cancel
        the registration of the shares\nwith voting rights held by such nominee in
        excess of the limit of 15%. Furthermore, our articles of association contain
        provisions that\nallow the board of directors to make the registration with
        voting rights of shares held by a nominee subject to conditions, limitations\nand
        reporting requirements or to impose or adjust such conditions, limitations
        and requirements once registered. However, any shareholders\nwho held more
        than 15% prior to our initial public offering remain registered with voting
        rights for such shares. Furthermore, the board\nof directors may in special
        cases approve exceptions to these restrictions.</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field:
        Page; Sequence: 19 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt;
        border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field:
        Sequence; Type: Arabic; Name: PageNo -->16<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\"><B><I>Dividends and Other Distributions</I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our board of directors
        may propose to shareholders that a dividend or\ninterim dividend or other
        distribution be paid but cannot itself &lrm;authorize the distribution. Dividend
        and interim dividend payments\nrequire a resolution passed by a majority of
        the shares &lrm;represented at a general meeting of shareholders. In addition,
        our auditors\nmust confirm that the dividend proposal &lrm;of our board of
        directors conforms to Swiss statutory law and our articles of association.&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under Swiss
        law, we may pay dividends only if we have sufficient distributable\nprofits
        from the previous or current business &lrm;year (<I>b&eacute;n&eacute;fice
        r&eacute;sultant du bilan</I>) or brought forward from\nthe previous business
        years (<I>report des b&eacute;n&eacute;fices</I>), or if we &lrm;have distributable
        capital reserves (<I>r&eacute;serve\nl&eacute;gale issue du capital</I>),
        each as evidenced by audited stand-alone &lrm;statutory annual or interim
        financial statements prepared\npursuant to Swiss law, and after allocations
        to reserves required by Swiss law and &lrm;by the articles of association
        have been deducted.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Under the CO, at least 5% of our annual profit must be retained
        as statutory\nprofit reserve (<I>r&eacute;serve l&eacute;gale</I>). If there
        is a loss carried forward, such loss must be eliminated before allocation\nto
        the statutory profit reserve. The statutory profit reserve shall be accumulated
        until it reaches, together with the statutory capital\nreserve, 50% of our
        share capital recorded in the Commercial Register. In addition, we have to
        allocate, among other things, the net proceeds\nof share issuances to the
        statutory capital reserve. The CO permits us to accrue &lrm;additional reserves.
        Further, a purchase of our\nown shares (whether by us or a subsidiary) reduces
        the distributable reserves in an amount corresponding to the purchase price
        of such\nown shares. Finally, the CO under &lrm;certain circumstances requires
        the creation of revaluation reserves which are not distributable.&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Distributions
        out of issued share capital (i.e., the aggregate par value\nof our issued
        shares) are not allowed and may &lrm;be made only by way of an ordinary capital
        reduction or within a capital range that\n(also) allows for a capital reduction
        (see &ldquo;Description of Share Capital and Articles of Association&mdash;Articles
        of Association&mdash;Ordinary\nCapital Increase, Capital Range and Conditional
        Share Capital&rdquo;). An ordinary capital reduction requires a resolution
        passed by a&lrm;\nmajority of the shares represented at a general meeting
        of shareholders. The board of directors must publish a call to creditors in
        the\nSwiss Official Gazette of Commerce in which creditors are advised that
        they may request, subject to certain conditions, security for their\nclaims
        within &lrm;30 days of the publication of the creditor call. A licensed audit
        expert must then confirm, based on the results of\nthe call to creditors,
        that the claims of the creditors remain fully &lrm;covered despite the reduction
        in our share capital recorded\nin the Commercial Register. If all requirements
        for an ordinary capital reduction have been met, the board of directors has
        to amend the\narticles of association in a public deed. Our share capital
        may be &lrm;reduced to a level below CHF 100,000 only if and to the extent\nthat
        at the same time the statutory minimum share capital of &lrm;CHF 100,000 is
        reestablished by sufficient new fully paid-up capital.\nAn ordinary capital
        reduction must be completed within six months after the resolution of the
        general meeting of shareholders.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our board of directors determines
        the date on which the dividend entitlement\nstarts. Dividends are usually
        due and &lrm;payable shortly after the shareholders have passed the resolution
        approving the payment, but\nshareholders may &lrm;also resolve at the annual
        general meeting of shareholders to pay dividends in quarterly or other installments.&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 20 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->17<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\"><B><I>Transfer of Shares</I></B></P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Shares in uncertificated form
        (<I>droits-valeurs</I>) may only be transferred\nby way of assignment. Shares
        or the beneficial interest in shares, as applicable, credited in a securities
        account may only be transferred\nwhen a credit of the relevant intermediated
        securities to the acquirer&rsquo;s securities account is made in accordance
        with applicable\nrules. Our articles of association provide that in the case
        of securities held with an intermediary such as a registrar, transfer agent,\ntrust
        corporation, bank or similar entity, any transfer, grant of a security interest
        or usufructuary right in such intermediated securities\nand the appurtenant
        rights associated therewith requires the cooperation of the intermediary in
        order for such transfer, grant of a security\ninterest or usufructuary right
        to be valid against us.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Voting rights may be exercised only after a shareholder has
        been entered\nin the share register (<I>registre des actions</I>) with his
        or her name and address (in the case of legal entities, the registered office)\nas
        a shareholder with voting rights. For a discussion of the restrictions applicable
        to the control and exercise of voting rights, see\n&ldquo;Description of Share
        Capital and Articles of Association&mdash;Articles of Association&mdash;Voting
        Rights.&rdquo;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B><I>Inspection of Books and Records </I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under the CO, a shareholder
        has a right to inspect the share register\nwith respect to his or her own
        shares and &lrm;otherwise to the extent necessary to exercise his or her shareholder
        rights. No other person\nhas a right to inspect the &lrm;share register. Shareholders
        holding in the aggregate at least 5% of our nominal share capital or of our\nvoting
        rights have the right to inspect our books and correspondence, subject to
        the safeguarding of our business secrets and other legitimate\ninterests.
        Our board of directors is required to decide on an inspection request within
        four months after receipt of such request. Denial\nof the request will need
        to be justified in writing. If an inspection request is denied by the board
        of directors, shareholders may request\nthe order of an inspection by the
        court within 30 days. See &ldquo;Comparison of Swiss Law and Delaware Law&mdash;Inspection
        of books\nand &lrm;records.&rdquo;&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>Special Investigation</I></B></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">If a shareholder
        has exercised its information or inspection rights,\n&lrm;such shareholder
        may propose to the general meeting of shareholders that specific facts be
        examined by a special &lrm;examiner in\na special investigation. If the general
        meeting of shareholders approves the proposal, we or any &lrm;shareholder
        may, within 30 calendar\ndays after the general meeting of shareholders, request
        a court at our registered &lrm;office (currently Epalinges, Canton of Vaud,
        Switzerland)\nto appoint a special examiner. If the general meeting of &lrm;shareholders
        rejects the request, one or more shareholders representing\nat least 5% of
        our share capital or voting rights may request that the court appoint a special
        &lrm;examiner. The court will issue such\nan order if the petitioners can
        demonstrate that &lrm;members of the board of directors or our executive committee
        infringed the law or\nour articles of association and that such violation
        is suitable to cause a damage to the Company or the shareholders. The costs
        of the\ninvestigation would generally be &lrm;allocated to us and only in
        exceptional cases to the petitioners.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>Compulsory Acquisitions;
        Appraisal Rights</I></B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Business combinations and other transactions that are governed
        by the\nSwiss Merger Act (i.e., mergers, demergers, &lrm;transformations and
        certain asset transfers) are binding on all shareholders. A statutory\nmerger
        or demerger requires &lrm;approval of two-thirds of the shares represented
        at a general meeting of shareholders and the majority\nof &lrm;the par value
        of the shares represented.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">If a transaction under the Swiss Merger Act receives
        all of the necessary\nconsents, all shareholders are compelled to participate
        in such transaction.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Swiss corporations may be acquired by an acquirer through
        the direct\nacquisition of the shares of the Swiss corporation. The Swiss
        Merger Act provides for the possibility of a so-called &ldquo;cash-out&rdquo;\nor
        &ldquo;squeeze-out&rdquo; merger with the approval of holders of 90% of the
        issued shares. In these limited circumstances, minority\nshareholders of the
        corporation being acquired may be compensated in a form other than through
        shares of the acquiring corporation (for\ninstance, through cash or securities
        of a parent corporation of the acquiring corporation or of another corporation).
        For business combinations\neffected in the form of a statutory merger or demerger
        and subject to Swiss law, the Swiss Merger Act provides that if equity rights
        have\nnot been adequately preserved or compensation payments in the transaction
        are unreasonable, a shareholder may request the competent court\nto determine
        a reasonable amount of compensation.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 21
        -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->18<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">In addition,
        under Swiss law, the sale of &ldquo;all or substantially\nall of our assets&rdquo;
        by us may require the approval of &lrm;two-thirds of the number of shares
        represented at a general meeting of\nshareholders and the majority of &lrm;the
        par value of the shares represented. Whether a shareholder resolution is required
        depends on\nthe particular &lrm;transaction, including whether the following
        test is satisfied:&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">a core part of our business
        is sold without which it is economically impracticable\nor unreasonable to
        continue to operate the remaining business;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">our assets, after the
        divestment, are not invested in accordance with our\ncorporate purpose as
        set forth in the articles of association; and</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">the proceeds of the divestment
        are not earmarked for reinvestment in accordance\nwith our corporate purpose
        but, instead, are intended for distribution to our shareholders or for financial
        investments unrelated to our\ncorporate purpose.</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">A shareholder of a Swiss corporation participating in certain
        major\ncorporate transactions may, under certain circumstances, be entitled
        to appraisal rights. As a result, such shareholder may, in addition\nto the
        consideration (be it in shares or in cash) receive an additional amount to
        ensure that the shareholder receives the fair value\nof the shares held by
        the shareholder. Following a statutory merger or demerger, pursuant to the
        Swiss Merger Act, shareholders can file\nan appraisal action against the surviving
        company. If the consideration is deemed inadequate, the court will determine
        an adequate compensation\npayment.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><B><I>Board of Directors</I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our articles of association
        provide that the board of directors shall\nconsist of at least three and not
        more than nine &lrm;members.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">The members of the board of directors and the
        chairperson are elected\nannually by the general meeting of shareholders for
        a period until the completion of the subsequent annual general meeting of
        shareholders\nand are eligible for re-election. Each member of the board of
        directors must be elected individually.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><I>Powers</I></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">According to our articles
        of association, the board of directors has\nthe following non-delegable and
        inalienable powers and duties:&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top:
        0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width:
        0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">the ultimate direction
        of the business of the Company and issuing of the relevant\ndirectives;&lrm;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">laying down the organization
        of the Company;&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">formulating accounting procedures, financial
        controls and financial planning;&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">nominating and removing persons entrusted with
        the management and representation\nof the Company &lrm;and regulating the
        power to sign for the Company;&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">the ultimate supervision of those persons entrusted
        with management of the\nCompany, with particular &lrm;regard to adherence
        to law, our articles of association, and regulations and directives of the
        Company;&lrm;</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n\n<!-- Field:
        Page; Sequence: 22 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt;
        border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field:
        Sequence; Type: Arabic; Name: PageNo -->19<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">preparing the annual report,
        the compensation report and, if applicable, the\nreport on non-financial matters
        and other reports as required by law; </FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">preparing for the general meeting of &lrm;shareholders
        and carrying out its\nresolutions; and</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">submitting a petition for debt-restructuring
        moratorium and informing the\ncourt in case of over-indebtedness.&lrm;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The board of directors may, while retaining such non-delegable
        and inalienable\npowers and duties, delegate some of &lrm;its powers, in particular
        direct management, to a single or to several of its members, committees\nor
        to third parties &lrm;&lrm;(such as executive officers) who need be neither
        members of the board of directors nor shareholders. Pursuant\nto &lrm;Swiss
        law and our articles of association, details of the delegation and other procedural
        rules such as quorum &lrm;requirements\nhave been set in the organizational
        rules established by the board of directors.&lrm;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><I>Indemnification of Executive
        Officers and Directors</I></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Subject to Swiss law, our articles of association
        provide for indemnification\nof the existing and former members of the board
        of directors and the executive committee and their heirs, executors and administrators,\nagainst
        liabilities arising in connection with the performance of their duties in
        such capacity, and permits us to advance the expenses\nof defending any act,
        suit or proceeding to our directors and executive officers to the extent not
        included in insurance coverage or advanced\nby third parties.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">In addition, under general
        principles of Swiss employment law, an employer\nmay be required to indemnify
        an employee against losses and expenses incurred by such employee in the proper
        execution of his or her duties\nunder the employment agreement with the employer.
        See &ldquo;Comparison of Swiss Law and Delaware Law&mdash;Indemnification
        of directors\nand executive officers and limitation of liability.&rdquo;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">We have entered
        into indemnification agreements with each of the members\nof our board of
        directors and executive officers.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><I>Conflicts of Interest, Management Transactions
        </I></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt
        0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">The members of the board of directors and the executive committee
        are\nrequired to immediately and fully inform the board of directors about
        conflicts of interests concerning them. The board of directors is\nfurthermore
        required to take measures in order to protect the interests of the company.
        More generally, the CO requires our directors\nand executive officers to safeguard
        the Company&rsquo;s interests and imposes a duty of &lrm;loyalty and duty
        of care on our directors\nand executive officers. This rule is generally understood
        to disqualify &lrm;directors and executive officers from participation in
        decisions\nthat directly affect them. Our directors and &lrm;executive officers
        are personally liable to us for breaches of these obligations. In\naddition,
        Swiss law contains &lrm;provisions under which directors and all persons engaged
        in the Company&rsquo;s management are liable\nto the &lrm;Company, each shareholder
        and the Company&rsquo;s creditors for damages caused by an intentional or
        negligent &lrm;violation\nof their duties. Furthermore, Swiss law contains
        a provision under which payments made to any of the &lrm;Company&rsquo;s shareholders\nor
        directors or any person related to any such shareholder or director, other
        than payments &lrm;made at arm&rsquo;s length, must be repaid\nto the Company
        if such shareholder or director acted in bad faith.&lrm;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our board of directors
        has adopted a Code of Business Conduct and Ethics\nand other policies that
        cover a broad &lrm;range of matters, including the handling of conflicts of
        interest.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><I>Principles of the Compensation of the Board of Directors
        and the\nExecutive Committee</I></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Pursuant to Swiss law, the aggregate amount of
        compensation of the &lrm;board\nof directors and the persons whom the board
        of directors has, fully or partially, entrusted with the &lrm;management (which
        we refer to\nas our &ldquo;executive committee&rdquo;) of the Company has
        to be submitted to our shareholders for approval each year. Our executive\ncommittee
        currently comprises the Chief Executive Officer, the Chief Financial Officer,
        the Chief Scientific Officer and the Swiss Managing\nDirector.&lrm;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 23 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->20<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">The board of directors must issue, on an annual basis, a written compensation\nreport
        that must be reviewed by our &lrm;auditors. The compensation report must disclose,
        among other things, all compensation granted\nby the Company, directly or
        indirectly, &lrm;to current members of the board of directors and the executive
        committee and, to the extent\nrelated to their former &lrm;role within the
        Company or not on customary market terms, to former members of the board of
        directors and\n&lrm;former executive officers.&lrm; The disclosure concerning
        compensation, loans and other forms of indebtedness must include the aggregate\namount
        for the board of directors and the executive committee, respectively, as well
        as the particular amount for each member of the board\nof directors and for
        the highest-paid executive officer, specifying the name and function of each
        of these persons. If variable compensation\nis approved prospectively, as
        is currently the case with the Company, our board of directors must submit
        the compensation report to a\nnon-binding vote of the general meeting of shareholders.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">We are prohibited
        from granting certain forms of compensation to members\nof our board of directors
        and executive committee, such as:</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top:
        0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width:
        0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">severance payments (compensation
        due until the termination of a contractual\nrelationship does not qualify
        as severance payment);</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">advance compensation;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">incentive fees for the
        acquisition or transfer of companies, or parts thereof,\nby the Company or
        by companies being, directly or indirectly, controlled by us;</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">loans, other forms of
        indebtedness, pension benefits not based on occupational\npension schemes
        and performance-based compensation not provided for in the articles of association;
        and</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">equity-based compensation not provided for in the articles of
        association.</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Compensation to members
        of the board of directors and the executive\ncommittee for activities in entities
        that are, directly or indirectly, controlled by the Company is prohibited
        if (i)&nbsp;the compensation\nwould be prohibited if it were paid directly
        by the Company, (ii)&nbsp;the articles of association do not provide for it,
        or (iii)&nbsp;the\ncompensation has not been approved by the general meeting
        of shareholders.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Every year, the general meeting of shareholders has to vote
        on the proposals\nof the board of directors with respect to:</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">the maximum aggregate amount of compensation of the board of
        directors for\nthe term of office until the next annual general meeting of
        shareholders; and</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt;
        margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">the maximum aggregate amount of fixed compensation
        of the executive committee\nfor the following financial year; and</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">the maximum aggregate
        amount of variable compensation of the executive committee\nfor the current
        financial year.</FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The board of directors
        may submit for approval at the general meeting\nof shareholders deviating
        or additional proposals relating to the same or different periods.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">If, at the
        general meeting of shareholders, the shareholders do not\napprove a compensation
        proposal of the board of directors, the board of directors must prepare a
        new proposal, taking into account all\nrelevant factors, and submit the new
        proposal for approval by the same general meeting of shareholders, at a subsequent
        extraordinary\ngeneral meeting of shareholders or the next annual general
        meeting of shareholders.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 24 -->\n    <DIV
        STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top:
        0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name:
        PageNo -->21<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial,
        Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">If we appoint
        new members of the executive committee after the general\nmeeting of shareholders
        has approved the compensation of the executive committee for the relevant
        period and such compensation is insufficient\nto also cover the new members'
        compensation, our articles of association allow us to pay each new member
        an amount not exceeding the aggregate\namount of (maximum) compensation of
        the executive committee last approved.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">In addition to fixed compensation,
        members of the board of directors\nand the executive committee may be paid
        variable compensation, depending on the achievement of certain performance
        criteria. The performance\ncriteria may include individual targets, targets
        of the Company or parts thereof and targets in relation to the market, other
        companies\nor comparable benchmarks, taking into account the position and
        level of responsibility of the recipient of the variable compensation.\nThe
        board of directors or, where delegated to it, the compensation committee shall
        determine the relative weight of the performance criteria\nand the respective
        target values as well as their achievement.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Compensation may be paid or
        granted in the form of cash, shares, financial\ninstruments, in kind, or in
        the form of other types of benefits. The board of directors or, where delegated
        to it, the compensation committee\nshall determine grant, vesting, exercise
        and forfeiture conditions.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><B><I>Borrowing Powers</I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Neither Swiss law nor our
        articles of association restricts our power\nto borrow and raise funds. The
        decision to borrow funds is made by or under the direction of our board of
        directors, and no approval by\nthe shareholders is required in relation to
        any such borrowing.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B><I>Repurchases of Shares and Purchases of Own Shares</I></B></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The CO limits
        our ability to repurchase and hold our own shares. We\nand our subsidiaries
        may repurchase shares only to the extent that (i)&nbsp;we have freely distributable
        reserves in the amount of the\npurchase price; and (ii)&nbsp;the aggregate
        par value of all shares held by us does not exceed 10% of our share capital.
        Pursuant to Swiss\nlaw, where shares are acquired in connection with a transfer
        restriction set out in the articles of association, the foregoing upper limit\nis
        20%. If we own shares that exceed the threshold of 10% of our share capital,
        the excess must be sold or cancelled by means of a capital\nreduction within
        two years.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Shares held by us or our subsidiaries are not entitled to
        vote at the\ngeneral meeting of shareholders but are entitled to the economic
        benefits applicable to the shares generally, including dividends and\npre-emptive
        subscription rights in the case of share capital increases.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">In addition, selective
        share repurchases are only permitted under certain\ncircumstances. Within
        these limitations, as is customary for Swiss corporations, we may, subject
        to applicable law, purchase and sell\nour own shares from time to time in
        order to meet imbalances of supply and demand, to provide liquidity and to
        even out variances in the\nmarket price of shares.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>Notification and
        Disclosure of Substantial Share Interests </I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The disclosure obligations
        generally applicable to shareholders of Swiss\ncorporations under the Federal
        Act on Financial Market Infrastructures and Market Conduct in Securities and
        Derivatives Trading, or the\nFinancial Market Infrastructure Act (the &ldquo;FMIA&rdquo;),
        do not apply to us since our shares are not listed on a Swiss exchange.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>Mandatory
        Bid Rules</I></B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The obligation of any person or group of persons that acquires
        more\nthan one-third of a company&rsquo;s voting rights to submit a cash offer
        for all the outstanding listed equity securities of the relevant\ncompany
        at a minimum price pursuant to the FMIA does not apply to us since our shares
        are not listed on a Swiss exchange.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 25
        -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->22<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B>Nonresident
        or Foreign Owners</B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Other than limitations that apply to all holders of our common
        shares,\nthere are no limitations on the right of nonresident or foreign owners
        of our common shares from holdings or voting such common shares\nimposed by
        Swiss law or our articles of association.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B>Exchange Controls</B></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Other than
        sanctions against specific countries, individuals, and organizations,\nthere
        are no governmental laws, decrees, regulations or other legislation in Switzerland
        affecting the remittance of dividends, interest\nand other payments to nonresident
        holders of our common shares.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"><B>Stock Exchange Listing</B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Our common shares are listed
        on the NYSE under the symbol &ldquo;ADCT.&rdquo;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B>The Depository Trust
        Company</B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Each person owning a beneficial interest in common shares
        held through\nDTC must rely on the procedures thereof and on institutions
        that have accounts therewith to exercise any rights of a holder of the shares.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B>Transfer
        Agent and Registrar of Shares</B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Our share register is kept by Computershare Trust
        Company, N.A., which\nacts as transfer agent and registrar. The share register
        reflects only record owners of our shares. Swiss law does not recognize fractional\nshare
        interests.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B>Comparison of Swiss Law and Delaware Law</B></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The Swiss
        laws applicable to Swiss corporations and their shareholders\ndiffer from
        laws applicable to &lrm;U.S. corporations and their shareholders. The following
        table summarizes significant differences in\nshareholder &lrm;rights pursuant
        to the provisions of the CO, by which our Company is governed, and the Delaware
        General Corporation Law\napplicable to companies &lrm;incorporated in Delaware
        and their shareholders. Please note that this is only a general summary of
        certain\n&lrm;provisions applicable to companies in Delaware. Certain Delaware
        companies may be permitted to exclude certain &lrm;of the provisions\nsummarized
        below in their charter documents.&lrm;</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLSPACING=\"0\"
        CELLPADDING=\"0\" STYLE=\"width: 100%; font: 10pt Arial, Helvetica, Sans-Serif;
        border-collapse: collapse\">\n  <TR STYLE=\"vertical-align: top\">\n    <TD
        STYLE=\"padding: 6pt; width: 50%; text-align: center\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\"><B>DELAWARE CORPORATE LAW</B></FONT></TD>\n
        \   <TD STYLE=\"padding: 6pt; width: 50%; text-align: center\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\"><B>&lrm; &lrm;SWISS CORPORATE LAW</B></FONT></TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding:
        6pt; text-align: center\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Mergers
        and similar arrangements</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">Under the Delaware General Corporation Law, with &lrm;certain
        exceptions, a merger, consolidation, sale, lease or &lrm;transfer of all or
        substantially all of the assets of a &lrm;corporation must be approved by
        the board of directors &lrm;and a majority of the outstanding shares entitled
        to vote &lrm;thereon. A shareholder of a Delaware corporation &lrm;participating
        in certain major corporate transactions may, &lrm;under certain circumstances,
        be entitled to appraisal rights &lrm;pursuant to which such shareholder may
        receive cash in &lrm;the amount of the fair value of the shares held by such
        &lrm;shareholder (as determined by a court) in lieu of the &lrm;consideration
        such shareholder would otherwise receive in &lrm;the transaction. The Delaware
        General Corporation Law &lrm;also provides that a parent corporation, by resolution
        of &lrm;its board of directors, may merge with any subsidiary, of &lrm;which
        it owns at least 90.0% of each class of capital &lrm;stock without a vote
        by the shareholders of such &lrm;subsidiary. Upon any such merger, dissenting
        &lrm;shareholders of the subsidiary would have appraisal &lrm;rights.&lrm;</FONT></TD>\n
        \   <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">&lrm;Under Swiss law, with certain exceptions, a merger or a
        &lrm;demerger of the corporation or a sale of all or &lrm;substantially all
        of the assets of a corporation must be &lrm;approved by two-thirds of the
        voting rights represented &lrm;at the respective general meeting of shareholders
        as &lrm;well as the majority of the par value of shares &lrm;represented at
        such general meeting of shareholders. &lrm;A shareholder of a Swiss corporation
        participating in a &lrm;statutory merger or demerger pursuant to the Swiss
        &lrm;Merger Act <I>(Loi sur la fusion</I>) can file a lawsuit against &lrm;the
        surviving company. If the consideration is deemed &lrm;&lrm;&ldquo;inadequate,&rdquo;
        such shareholder may, in addition to the &lrm;consideration (be it in shares
        or in cash) receive an &lrm;additional amount to ensure that such shareholder
        &lrm;receives the fair value of the shares held by such &lrm;shareholder.
        Swiss law also provides that if the merger &lrm;agreement provides only for
        a compensation payment, &lrm;at least 90% of all members in the transferring
        legal &lrm;entity who are entitled to vote shall approve the &lrm;merger agreement.&lrm;</FONT></TD></TR>\n
        \ </TABLE>\n\n<!-- Field: Page; Sequence: 26 -->\n    <DIV STYLE=\"margin-top:
        6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom:
        0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name: PageNo -->23<!-- Field:
        /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 10pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding:
        6pt; text-align: center\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Shareholders&rsquo;
        suits</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n    <TD
        STYLE=\"padding: 6pt; width: 50%\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">Class actions and derivative actions generally are &lrm;available
        to shareholders of a Delaware corporation for, &lrm;among other things, breach
        of fiduciary duty, corporate &lrm;waste and actions not taken in accordance
        with &lrm;applicable law. In such actions, the court has discretion to &lrm;permit
        the winning party to recover attorneys&rsquo; fees &lrm;incurred in connection
        with such action.&lrm;</FONT></TD>\n    <TD STYLE=\"padding: 6pt; width: 50%\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">&lrm;Class actions and
        derivative actions as such are not &lrm;available under Swiss law. Nevertheless,
        certain actions &lrm;may have a similar effect. A shareholder is entitled
        to &lrm;bring suit against directors, officers or liquidators for &lrm;breach
        of their duties and claim the payment of the &lrm;company&rsquo;s losses or
        damages to the corporation and, &lrm;in some cases, to the individual shareholder.
        Likewise, &lrm;an appraisal lawsuit won by a shareholder may &lrm;indirectly
        compensate all shareholders. In addition, to &lrm;the extent that U.S. laws
        and regulations provide a &lrm;basis for liability and U.S. courts have jurisdiction,
        a &lrm;class action may be available.&lrm;</FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD STYLE=\"padding: 6pt\">&nbsp;</TD>\n    <TD STYLE=\"padding:
        6pt\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">Under Swiss
        law, the winning party is generally entitled &lrm;to recover a limited amount
        of attorneys&rsquo; fees incurred &lrm;in connection with such action. The
        court has discretion &lrm;to permit the shareholder who lost the lawsuit to
        &lrm;recover attorneys&rsquo; fees incurred to the extent that he or &lrm;she
        acted in good faith.&lrm;</FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Shareholder vote
        on board and management compensation</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">Under the Delaware General Corporation Law, the board &lrm;of
        directors has the authority to fix the compensation of &lrm;directors, unless
        otherwise restricted by the certificate of &lrm;incorporation or bylaws.&lrm;</FONT></TD>\n
        \   <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">Pursuant to Swiss law, the general meeting of &lrm;shareholders
        has the non-transferable right, amongst &lrm;others, to vote separately and
        bindingly on the &lrm;aggregate amount of compensation of the members of &lrm;the
        board of directors, of the executive committee and &lrm;of the advisory boards.&lrm;
        If variable compensation is approved for a future period rather than for a
        past period, the compensation report is subject to a non-binding vote of the
        general meeting of shareholders.</FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Annual vote on board
        renewal</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n    <TD
        STYLE=\"padding: 6pt\">\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Unless directors are elected by written consent in lieu of
        &lrm;an annual\n    meeting, directors are elected in an annual &lrm;meeting
        of shareholders on a date and at a time &lrm;designated by or in the manner
        provided\n    in the bylaws. &lrm;Re-election is possible.&lrm; &lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Classified
        boards are permitted.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"></P></TD>\n    <TD STYLE=\"padding: 6pt\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">The general meeting of
        shareholders elects the &lrm;members of the board of directors, the chairperson
        of &lrm;the board of directors and the members of the &lrm;compensation committee
        individually and annually for &lrm;a term of office until the end of the following
        general &lrm;meeting of shareholders. Re-election is possible.&lrm;</FONT></TD></TR>\n
        \ </TABLE>\n\n<!-- Field: Page; Sequence: 27 -->\n    <DIV STYLE=\"margin-top:
        6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom:
        0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name: PageNo -->24<!-- Field:
        /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 10pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding:
        6pt; text-align: center\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Indemnification
        of directors and executive officers and limitation of liability</I></B></FONT></TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD STYLE=\"padding: 6pt; width:
        50%\">\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt
        0\">The Delaware General Corporation Law provides that a &lrm;certificate\n
        \   of incorporation may contain a provision &lrm;eliminating or limiting
        the personal liability of directors and officers &lrm;&lrm;(but\n    not other
        controlling persons) of the corporation for &lrm;monetary damages for breach
        of a fiduciary duty as a &lrm;director, except\n    no provision in the certificate
        of &lrm;incorporation may eliminate or limit liability of:&lrm;</P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">&lrm;a director or officer for any breach of the duty of loyalty\n
        \   to the &lrm;corporation or its shareholders;&lrm;</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">a director or officer for acts or omissions\n    not in good faith
        or which involve &lrm;intentional misconduct or a knowing violation of &lrm;law;&lrm;
        &lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0 0pt 0.5in; text-indent: -0.25in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt
        Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P
        STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">a director for statutory liability for\n    unlawful payment of
        dividends &lrm;or unlawful share purchase or redemption;</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">a director or officer for any transaction\n    from which the
        director or officer derived an &lrm;&lrm;improper personal benefit; or</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt
        0.5in; text-indent: -0.25in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol;
        margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font:
        10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">an
        officer in any action by or in right\n    of the corporation.&lrm;</P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in;
        text-indent: -0.25in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">A Delaware corporation may indemnify any person
        who &lrm;was or is a\n    party or is threatened to be made a party to &lrm;any
        proceeding, other than an action by or on behalf of &lrm;the corporation,
        because\n    the person is or was a director or &lrm;officer, against liability
        incurred in connection with the &lrm;proceeding if the director or\n    officer
        acted in good faith &lrm;and in a manner reasonably believed to be in, or
        not &lrm;opposed to, the best interests of the corporation,\n    and the &lrm;director
        or officer, with respect to any criminal action or &lrm;proceeding, had no
        reasonable cause to believe his or her\n    &lrm;conduct was unlawful.&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P></TD>\n
        \   <TD STYLE=\"padding: 6pt; width: 50%\">\n    <P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&lrm;Under Swiss corporate law, an
        indemnification by the &lrm;corporation\n    of a director or member of the
        executive &lrm;committee in relation to potential personal liability is &lrm;not
        effective to the extent\n    the director or member of &lrm;the executive
        committee intentionally or negligently &lrm;violated his or her corporate
        duties towards\n    the &lrm;corporation (certain views advocate that at least
        a &lrm;grossly negligent violation is required to exclude the &lrm;indemnification).\n
        \   Furthermore, the general meeting of &lrm;shareholders may discharge (release)
        the directors and &lrm;members of the executive committee\n    from liability
        for &lrm;their conduct to the extent the respective facts are &lrm;known to
        shareholders. Such discharge is effective only\n    &lrm;with respect to claims
        of the company and of those &lrm;shareholders who approved the discharge or
        who have &lrm;since acquired their\n    shares in full knowledge of the &lrm;discharge.
        Most violations of corporate law are &lrm;regarded as violations of duties
        towards the\n    corporation &lrm;rather than towards the shareholders. In
        addition, &lrm;indemnification of other controlling persons is not &lrm;permitted\n
        \   under Swiss corporate law, including &lrm;shareholders of the corporation.</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The
        articles of association of a Swiss corporation may &lrm;also set\n    forth
        that the corporation shall indemnify and &lrm;hold harmless, to the extent
        permitted by the law, the &lrm;directors and executive\n    managers out of
        assets of the &lrm;corporation against threatened, pending or completed &lrm;actions.&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Also,
        a corporation may enter into and pay for &lrm;directors&rsquo;\n    and officers&rsquo;
        liability insurance, which may &lrm;cover negligent acts as well.&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P></TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD STYLE=\"padding: 6pt\">\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Unless ordered
        by a court, any foregoing indemnification &lrm;is subject\n    to a determination
        that the director or officer &lrm;has met the applicable standard of conduct:&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">by a majority vote of the directors\n    who are not &lrm;parties
        to the proceeding, even though less than a &lrm;quorum;&lrm;</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">by a committee of directors designated\n    by a majority &lrm;vote
        of the eligible directors, even though less than a &lrm;quorum;&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt
        0.5in; text-indent: -0.25in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol;
        margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font:
        10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">by
        independent legal counsel in a written\n    opinion if &lrm;there are no eligible
        directors, or if the eligible &lrm;directors so direct; or &lrm;</P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in;
        text-indent: -0.25in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol; margin:
        0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font:
        10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">by
        the shareholders.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&nbsp;</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Moreover, a Delaware corporation
        may not indemnify a &lrm;director or\n    officer in connection with any proceeding
        in &lrm;which the director or officer has been adjudged to be &lrm;liable
        to the corporation\n    unless and only to the extent that &lrm;the court
        determines that, despite the adjudication of &lrm;liability but in view of
        all the circumstances\n    of the case, &lrm;the director or officer is fairly
        and reasonably entitled to &lrm;indemnity for those expenses which the court
        deems\n    &lrm;proper.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\"></P></TD>\n    <TD STYLE=\"padding: 6pt\">&nbsp;</TD></TR>\n
        \ </TABLE>\n\n<!-- Field: Page; Sequence: 28 -->\n    <DIV STYLE=\"margin-top:
        6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom:
        0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name: PageNo -->25<!-- Field:
        /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 10pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding:
        6pt; text-align: center\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Directors&rsquo;
        fiduciary duties</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n
        \   <TD STYLE=\"padding: 6pt; width: 50%\">\n    <P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">A director of a Delaware corporation
        has a fiduciary duty &lrm;to the\n    corporation and its shareholders. This
        duty has two &lrm;components:&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol;
        margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font:
        10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">the
        duty of care; and</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol; margin:
        0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font:
        10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">the
        duty of loyalty.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">The duty of care requires that a director act
        in good faith, &lrm;with\n    the care that an ordinarily prudent person would
        &lrm;exercise under similar circumstances. Under this duty, a &lrm;director
        must inform\n    himself or herself of, and disclose to &lrm;shareholders,
        all material information reasonably &lrm;available regarding a significant
        transaction.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The duty of loyalty requires that a director act in a &lrm;manner
        he\n    or she reasonably believes to be in the best &lrm;interests of the
        corporation. He or she must not use his or &lrm;her corporate position\n    for
        personal gain or advantage. &lrm;This duty prohibits self-dealing by a director
        and &lrm;mandates that the best interest of the corporation\n    and its &lrm;shareholders
        take precedence over any interest possessed &lrm;by a director, officer or
        controlling shareholder and not &lrm;shared\n    by the shareholders generally.
        In general, actions &lrm;of a director are presumed to have been made on an
        &lrm;informed basis, in good\n    faith and in the honest belief that &lrm;the
        action taken was in the best interests of the &lrm;corporation. However, this
        presumption\n    may be rebutted &lrm;by evidence of a breach of one of the
        fiduciary duties.</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Should such evidence be presented concerning a &lrm;transaction
        by a\n    director, a director must prove the &lrm;procedural fairness of
        the transaction, and that the &lrm;transaction was of fair value to the\n
        \   corporation.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P></TD>\n    <TD STYLE=\"padding: 6pt; width: 50%\">\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The
        board of directors of a Swiss corporation manages &lrm;the business\n    of
        the corporation, unless responsibility for &lrm;such management has been duly
        delegated to the &lrm;executive committee based on organizational\n    rules.
        &lrm;However, there are several non-transferable duties of &lrm;the board
        of directors:&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol; margin: 0pt
        0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font: 10pt
        Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">&lrm;the
        overall management of the corporation and &lrm;the\n    issuing of all necessary
        directives;&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol; margin:
        0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font:
        10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">determination
        of the corporation&rsquo;s organization;&lrm;</P>\n    <P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n    <P
        STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">the organization of the accounting, &lrm;financial&thinsp;control\n
        \   and financial planning systems as &lrm;required for management of &lrm;the
        corporation;&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol; margin:
        0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font:
        10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">the
        appointment and dismissal of persons &lrm;entrusted with\n    managing and
        representing the &lrm;corporation;&lrm;</P>\n    <P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n    <P STYLE=\"font:
        10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">the overall supervision of the persons entrusted with &lrm;managing\n
        \   the corporation, in particular with regard &lrm;to compliance &lrm;with
        the law, articles of association, &lrm;operational regulations\n    and directives;&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt
        0.5in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in;
        text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font: 10pt Symbol; margin:
        0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">the compilation of the
        annual report, the &lrm;compensation\n    report, the report on non-financial
        matters and any other reports required by law, the preparation for &lrm;the
        general meeting of the\n    shareholders &lrm;and implementation of its &lrm;resolutions;
        and</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt
        0 0pt 0.5in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol; margin: 0pt 0
        0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font: 10pt
        Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">the filing
        of an application for a debt restructuring moratorium\n    and notification
        of the court in the event that the &lrm;company is over-indebted.&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt
        0.5in\"></P></TD></TR>\n  </TABLE>\n\n<!-- Field: Page; Sequence: 29 -->\n
        \   <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom: Black
        1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->26<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<TABLE
        CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width: 100%; font: 10pt Arial,
        Helvetica, Sans-Serif; border-collapse: collapse\">\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD STYLE=\"padding: 6pt; width: 50%\">&nbsp;</TD>\n    <TD STYLE=\"padding:
        6pt; width: 50%\">\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The members of the board of directors must perform &lrm;their
        duties\n    with all due diligence and safeguard the &lrm;interests of the
        corporation in good faith. They must &lrm;afford the shareholders equal\n
        \   treatment in equal &lrm;circumstances.</P>\n    <P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&lrm;The duty of care requires
        that a director act in good &lrm;faith,\n    with the care that an ordinarily
        prudent director &lrm;would exercise under like circumstances.</P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The
        members of the board of directors and the executive committee are\n    required
        to immediately and fully inform the board of directors about conflicts of
        interests concerning them. The board of directors is\n    furthermore required
        to take measures in order to protect the interests of the company.</P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The
        duty of loyalty requires that a director safeguard &lrm;the interests\n    of
        the corporation and requires that &lrm;directors act in the interest of the
        corporation and, if &lrm;necessary, put aside their own\n    interests. If
        there is a risk &lrm;of a conflict of interest, the board of directors must
        &lrm;take appropriate measures to ensure that\n    the interests &lrm;of the
        company are duly taken into account.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The burden of proof for a violation
        of these duties is &lrm;with the\n    corporation or with the shareholder
        bringing a &lrm;suit against the director.&lrm;</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The Swiss Federal Supreme
        Court has established a doctrine that restricts\n    its review of a business
        decision if the decision has been taken following proper preparation, on an
        informed basis and without conflicts\n    of interest.</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"></P></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Shareholder action
        by written consent</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">A Delaware corporation may, in its certificate of &lrm;incorporation,
        eliminate the right of shareholders to act &lrm;by written consent.</FONT></TD>\n
        \   <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">Shareholders of a Swiss corporation may exercise &lrm;their voting
        rights in a general meeting of shareholders. &lrm; Shareholders can only act
        by written consents if no shareholder requests a general meeting of shareholders.
        The articles of &lrm;association must allow for (independent) proxies to be
        &lrm;present at a general meeting of shareholders. The &lrm;instruction of
        such (independent) proxies may occur in &lrm;writing or electronically.&lrm;</FONT></TD></TR>\n
        \ </TABLE>\n\n<!-- Field: Page; Sequence: 30 -->\n    <DIV STYLE=\"margin-top:
        6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom:
        0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name: PageNo -->27<!-- Field:
        /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 10pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding:
        6pt; text-align: center\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Shareholder
        proposals</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n
        \   <TD STYLE=\"padding: 6pt; width: 50%\"><FONT STYLE=\"font-family: Arial,
        Helvetica, Sans-Serif\">A shareholder of a Delaware corporation has the right
        to &lrm;put any proposal before the annual meeting of &lrm;shareholders, provided
        it complies with the notice &lrm;provisions in the governing documents. A
        special meeting &lrm;may be called by the board of directors or any other
        &lrm;person authorized to do so in the governing documents, &lrm;but shareholders
        may be precluded from calling special &lrm;meetings.&lrm;</FONT></TD>\n    <TD
        STYLE=\"padding: 6pt; width: 50%\">\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">At any general meeting of shareholders, any &lrm;shareholder
        may put\n    proposals to the meeting if the &lrm;proposal is part of an agenda
        item. No resolution may &lrm;be taken on proposals relating to the\n    agenda
        items that &lrm;were not duly notified. Unless the articles of association
        &lrm;provide for a lower threshold or for additional\n    &lrm;shareholders&rsquo;
        rights:</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in;
        text-indent: -0.25in\">&middot;</P>\n    <P STYLE=\"font: 10pt Symbol; margin:
        0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n    <P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">&lrm;&lrm;shareholders
        together representing at least 5% of\n    &lrm;the share capital or voting
        rights may demand that a general &lrm;meeting of shareholders be called for
        specific &lrm;agenda items\n    and specific proposals; and</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">shareholders together representing shares with a &lrm;par\n    value
        of at least 0.5% of the &lrm;share capital or the voting rights may demand
        &lrm;that an agenda item including a specific proposal,\n    or a proposal
        with respect to an existing agenda item, &lrm;be put on the agenda for a scheduled
        general &lrm;meeting of shareholders,\n    provided such request is &lrm;made
        with appropriate lead time.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Any shareholder can propose
        candidates for election as &lrm;directors\n    or make other proposals within
        the scope of &lrm;an agenda item without prior written notice.&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"></P></TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD STYLE=\"padding: 6pt\">&nbsp;</TD>\n
        \   <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">In addition, any shareholder is entitled, at a general &lrm;meeting
        of shareholders and without advance notice, to &lrm;&lrm;(i) request information
        from the board of directors on &lrm;the affairs of the company (note, however,
        that the &lrm;right to obtain such information is limited), (ii) request &lrm;information
        from the auditors on the methods and &lrm;results of their audit, (iii) request
        that the general &lrm;meeting of shareholders resolve to convene an &lrm;extraordinary
        general meeting, or (iv) request that the &lrm;general meeting of shareholders
        resolve to appoint an &lrm;examiner to carry out a special examination (&ldquo;<I>examen</I>
        &lrm;<I>sp&eacute;cial</I>&rdquo;).&lrm;</FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Cumulative voting</I></B></FONT></TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD STYLE=\"padding: 6pt\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">&lrm;Under the Delaware
        General Corporation Law, &lrm;cumulative voting for elections of directors
        is not &lrm;permitted unless the corporation&rsquo;s certificate of &lrm;incorporation
        provides for it.&lrm;</FONT></TD>\n    <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">Cumulative voting is not permitted under Swiss
        &lrm;corporate law. Pursuant to Swiss law, shareholders can &lrm;vote for
        each proposed candidate, but they are not &lrm;allowed to cumulate their votes
        for single candidates. &lrm;An annual individual election of (i) all members
        of the &lrm;board of directors, (ii) the chairperson of the board of &lrm;directors,
        (iii) the members of the compensation &lrm;committee, (iv) the election of
        the independent proxy &lrm;for a term of office of one year (i.e., until the
        following &lrm;annual general meeting of shareholders), as well as the &lrm;vote
        on the aggregate amount of compensation of the &lrm;members of the board of
        directors, of the executive &lrm;committee and of the members of any advisory
        board, &lrm;is mandatory for listed companies. Re-election is &lrm;permitted.&lrm;</FONT></TD></TR>\n
        \ </TABLE>\n\n<!-- Field: Page; Sequence: 31 -->\n    <DIV STYLE=\"margin-top:
        6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom:
        0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name: PageNo -->28<!-- Field:
        /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 10pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding:
        6pt; text-align: center\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Removal
        of directors</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n
        \   <TD STYLE=\"padding: 6pt; width: 50%\"><FONT STYLE=\"font-family: Arial,
        Helvetica, Sans-Serif\">A Delaware corporation with a classified board may
        be &lrm;removed only for cause with the approval of a majority &lrm;of the
        outstanding shares entitled to vote, unless the &lrm;certificate of incorporation
        provides otherwise.&lrm;</FONT></TD>\n    <TD STYLE=\"padding: 6pt; width:
        50%\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">A Swiss corporation
        may remove, with or without &lrm;cause, any director at any time with a resolution
        passed &lrm;by a majority of the shares represented at a general &lrm;meeting
        of shareholders. The articles of association &lrm;may require the approval
        by a supermajority of the &lrm;shares represented at a meeting for the removal
        of a &lrm;director.&lrm;</FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n
        \   <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\"><B><I>Transactions with interested shareholders</I></B></FONT></TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD STYLE=\"padding: 6pt\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">The Delaware General Corporation
        Law generally &lrm;prohibits a Delaware corporation from engaging in certain
        &lrm;business combinations with an &ldquo;interested shareholder&rdquo; &lrm;for
        three years following the date that such person &lrm;becomes an interested
        shareholder. An interested &lrm;shareholder generally is a person or group
        who or which &lrm;owns or owned 15.0% or more of the corporation&rsquo;s &lrm;outstanding
        voting shares within the past three years.&lrm;</FONT></TD>\n    <TD STYLE=\"padding:
        6pt\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">No such rule
        applies to a Swiss corporation.&lrm;</FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Dissolution; winding
        up</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n    <TD
        STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">Unless
        the board of directors of a Delaware corporation &lrm;approves the proposal
        to dissolve, dissolution must be &lrm;approved by shareholders holding 100.0%
        of the total &lrm;voting power of the corporation. Only if the dissolution
        is &lrm;initiated by the board of directors may it be approved by &lrm;a simple
        majority of the corporation&rsquo;s outstanding shares. &lrm;Delaware law
        allows a Delaware corporation to include in &lrm;its certificate of incorporation
        a supermajority voting &lrm;requirement in connection with dissolutions initiated
        by &lrm;the board.</FONT></TD>\n    <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">A dissolution of a Swiss corporation requires
        the &lrm;approval by two-thirds of the voting rights represented &lrm;at the
        respective general meeting of shareholders as &lrm;well as the majority of
        the par value of shares &lrm;represented at such general meeting of shareholders.
        &lrm;The articles of association may increase the voting &lrm;thresholds required
        for such a resolution.&lrm;</FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Variation of rights
        of shares</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n
        \   <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">A Delaware corporation may vary the rights of a class of &lrm;shares
        with the approval of a majority of the outstanding &lrm;shares of such class,
        unless the certificate of &lrm;incorporation provides otherwise.&lrm;</FONT></TD>\n
        \   <TD STYLE=\"padding: 6pt\">\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">The general meeting of shareholders of a Swiss
        &lrm;corporation may\n    resolve that preference shares be &lrm;issued or
        that existing shares be converted into &lrm;preference shares with a resolution
        passed\n    by a &lrm;majority of the shares represented at the general &lrm;meeting
        of shareholders. Where a company has issued &lrm;preference shares,\n    further
        preference shares conferring &lrm;preferential rights over the existing preference
        shares &lrm;may be issued only with the consent\n    of both a special &lrm;meeting
        of the adversely affected holders of the &lrm;existing preference shares and
        of a general meeting of &lrm;all\n    shareholders, unless otherwise provided
        in the &lrm;articles of association.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Shares with preferential voting
        rights are not regarded &lrm;as preference\n    shares for these purposes.&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"></P></TD></TR>\n
        \ </TABLE>\n\n<!-- Field: Page; Sequence: 32 -->\n    <DIV STYLE=\"margin-top:
        6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom:
        0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name: PageNo -->29<!-- Field:
        /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 10pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding:
        6pt; text-align: center\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Amendment
        of governing documents</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD STYLE=\"padding: 6pt; width: 50%\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\">A Delaware corporation&rsquo;s governing documents
        may be &lrm;amended with the approval of a majority of the &lrm;outstanding
        shares entitled to vote, unless the certificate &lrm;of incorporation provides
        otherwise.</FONT></TD>\n    <TD STYLE=\"padding: 6pt; width: 50%\">\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The articles
        of association of a Swiss corporation may &lrm;be amended\n    with a resolution
        passed by a majority of &lrm;the shares represented at a general meeting of
        &lrm;shareholders, unless otherwise provided\n    in the articles &lrm;of
        association.&lrm;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">There are a number of resolutions, such as an &lrm;amendment
        of the\n    stated purpose of the corporation, &lrm;the introduction of a
        capital range and conditional capital &lrm;and the introduction of shares\n
        \   with preferential voting &lrm;rights that require the approval by two-thirds
        of the &lrm;votes and a majority of the par value of the\n    &lrm;shares
        represented at such general meeting of &lrm;shareholders. The articles of
        association may increase &lrm;these voting thresholds.&lrm;</P>\n    <P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"></P></TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Inspection of books
        and records</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n
        \   <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">Shareholders of a Delaware corporation, upon written &lrm;demand
        under oath stating the purpose thereof, have the &lrm;right during the usual
        hours for business to inspect for any &lrm;proper purpose, and to obtain copies
        of list(s) of &lrm;shareholders and other books and records of the &lrm;corporation
        and its subsidiaries, if any, to the extent the &lrm;books and records of
        such subsidiaries are available to &lrm;the corporation.</FONT></TD>\n    <TD
        STYLE=\"padding: 6pt\">\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Shareholders of a Swiss corporation holding in the aggregate
        at least\n    5% of the nominal share capital or voting rights have the right
        to inspect &lrm;books and records, subject to the safeguarding of the\n    company&rsquo;s
        business secrets and other interests warranting protection. A &lrm;shareholder
        is only entitled to receive information\n    to &lrm;the extent required to
        exercise his or her rights as a &lrm;shareholder. The board of directors has
        to decide on an inspection\n    request within four months after receipt of
        such request. Denial of the request will need to be justified in writing.
        If the board of\n    directors denies an inspection request, shareholders
        may request the order of an inspection by the court within 30 days.&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">A
        shareholder&rsquo;s right to inspect the share register is &lrm;limited\n
        \   to the right to inspect his or her own entry in the &lrm;share register.</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"></P></TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD COLSPAN=\"2\" STYLE=\"padding:
        6pt; text-align: center\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\"><B><I>Payment
        of dividends</I></B></FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n
        \   <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">The board of directors may approve a dividend without &lrm;shareholder
        approval. Subject to any restrictions &lrm;contained in its certificate of
        incorporation, the board &lrm;may declare and pay dividends upon the shares
        of its &lrm;capital stock either:&lrm;&#9;&lrm;</FONT></TD>\n    <TD STYLE=\"padding:
        6pt\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">Dividend (including
        interim dividend) payments are subject to the approval of the &lrm;general
        meeting of shareholders. The board of directors &lrm;may propose to shareholders
        that a dividend shall be &lrm;paid but cannot itself authorize the distribution.&lrm;</FONT></TD></TR>\n
        \ </TABLE>\n\n<!-- Field: Page; Sequence: 33 -->\n    <DIV STYLE=\"margin-top:
        6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom:
        0pt\">&nbsp;<!-- Field: Sequence; Type: Arabic; Name: PageNo -->30<!-- Field:
        /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 6pt\"><P STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif;
        margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 10pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD STYLE=\"padding: 6pt; width:
        50%\">\n    <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent:
        -0.25in\">&middot;</P>\n    <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt
        0.5in; text-indent: -0.25in\"></P>\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: -11pt 0pt 0pt 0.5in\">out of its surplus, or</P>\n    <P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\">&middot;</P>\n
        \   <P STYLE=\"font: 10pt Symbol; margin: 0pt 0 0pt 0.5in; text-indent: -0.25in\"></P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: -11pt 0pt
        0pt 0.5in\">in case there is no such surplus, out of its net profits for\n
        \   &lrm;the fiscal year in which the dividend is declared &lrm;and/or the
        preceding fiscal year.</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0 0pt 0.5in\">&nbsp;</P>\n    <P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&lrm;Shareholder approval is required to authorize
        capital &lrm;stock\n    in excess of that provided in the charter. Directors
        &lrm;may issue authorized shares without shareholder &lrm;approval.&lrm;</P>\n
        \   <P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P></TD>\n
        \   <TD STYLE=\"padding: 6pt; width: 50%\"><FONT STYLE=\"font-family: Arial,
        Helvetica, Sans-Serif\">Payments out of a corporation&rsquo;s share capital
        (in other &lrm;words, the aggregate par value of the corporation&rsquo;s &lrm;
        shares) in the form of dividends are &lrm;not allowed and may be made only
        by way of a share &lrm;capital reduction. Dividends may be paid only from
        the &lrm;profits of the previous or current business year or brought forward
        &lrm;from previous business years or if the corporation has &lrm;distributable
        reserves, each as evidenced by the &lrm;corporation&rsquo;s audited stand-alone
        statutory balance &lrm;sheet prepared pursuant to Swiss law and after &lrm;allocations
        to reserves required by Swiss law and the &lrm;articles of association have
        been deducted.&lrm;</FONT></TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n
        \   <TD COLSPAN=\"2\" STYLE=\"padding: 6pt; text-align: center\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif\"><B><I>Creation and issuance of new shares</I></B></FONT></TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD STYLE=\"padding: 6pt\"><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">All creation of shares
        require the board of directors to &lrm;adopt a resolution or resolutions,
        pursuant to authority &lrm;expressly vested in the board of directors by the
        &lrm;provisions of the company&rsquo;s certificate of incorporation.&lrm;</FONT></TD>\n
        \   <TD STYLE=\"padding: 6pt\"><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">All creation of shares require a shareholders&rsquo; resolution.
        &lrm;The creation of a capital range or conditional share capital &lrm;requires
        at least two-thirds of the voting rights &lrm;represented at the general meeting
        of shareholders and &lrm;a majority of the par value of shares &lrm;represented
        at such meeting. The board of directors &lrm;may issue or cancel shares out
        of the capital range &lrm;during a period of up to five years by a maximum
        amount of 50% of the current share capital. Shares are created &lrm;and issued
        out of conditional share capital through the &lrm;exercise of options or of
        conversion rights that the &lrm;board of directors may grant to shareholders,
        creditors of bonds or similar debt &lrm;instruments, employees, contractors
        or consultants, directors of the company or another group company or third
        parties.&lrm;</FONT></TD></TR>\n  </TABLE>\n<P STYLE=\"font: bold 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0; text-align: center\"><FONT STYLE=\"font-weight:
        normal; color: windowtext\">&lrm;</FONT></P>\n\n<P STYLE=\"font: bold 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: center\"></P>\n\n<!--
        Field: Page; Sequence: 34 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->31<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0; text-align: center\"><A NAME=\"a_008\"></A><FONT STYLE=\"font-weight:
        normal\"><BR STYLE=\"clear: both\">\n</FONT>TAXATION</P>\n\n<P STYLE=\"font:
        bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: center\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The following
        discussion is based on the tax laws, regulations and regulatory\npractices
        of Switzerland and the United States as in effect on the date hereof, which
        are subject to change (or subject to changes in\ninterpretation), possibly
        with retroactive effect.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Current and prospective shareholders are advised to consult
        their own\ntax advisers in light of their particular circumstances as to the
        Swiss or U.S. tax laws, regulations and regulatory practices that could\nbe
        relevant for them in connection with owning and selling or otherwise disposing
        of our common shares and receiving dividends and similar\ncash or in-kind
        distributions on our common shares (including dividends on liquidation proceeds
        and share dividends) or distributions\non our common shares based upon a capital
        reduction or reserves paid out of capital contributions and the consequences
        thereof under the\ntax laws, regulations and regulatory practices of Switzerland
        or the United States.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Swiss Tax Considerations</P>\n\n<P STYLE=\"font:
        bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        italic bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Withholding
        Tax</P>\n\n<P STYLE=\"font: italic bold 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Under present Swiss tax law, dividends due and similar cash
        or in-kind\ndistributions made by the Company to a shareholder of common shares
        (including liquidation proceeds and bonus shares) are subject to Swiss\nfederal
        withholding tax (&ldquo;Withholding Tax&rdquo;), currently at a rate of 35%
        (applicable to the gross amount of taxable distribution).\nHowever, the repayment
        of the par value of the common shares and any repayment of qualifying additional
        paid-in capital (capital contribution\nreserves), within the limitations accepted
        by the legislation in force when such Dividend becomes due and the respective
        administrative\npractice, are not subject to the Withholding Tax. The Company
        is obliged to deduct any applicable Withholding Tax from the gross amount\nof
        any taxable distribution and to pay the tax to the Swiss Federal Tax Administration
        within 30 days of the due date of such distribution.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Swiss resident individuals
        who hold their common shares as private assets\n(&ldquo;Resident Private Shareholders&rdquo;)
        are in principle eligible for a full refund or credit against income tax of
        the Withholding\nTax if they duly report the underlying income in their income
        tax return. In addition, (i)&nbsp;corporate and individual shareholders\nwho
        are resident in Switzerland for tax purposes, (ii)&nbsp;corporate and individual
        shareholders who are not resident in Switzerland,\nand who, in each case,
        hold their common shares as part of a trade or business carried on in Switzerland
        through a permanent establishment\nwith fixed place of business situated in
        Switzerland for tax purposes and (iii)&nbsp;Swiss resident private individuals
        who, for income\ntax purposes, are classified as &ldquo;professional securities
        dealers&rdquo; for reasons of, inter alia, frequent dealing, or leveraged\ninvestments,
        in shares and other securities (collectively, &ldquo;Domestic Commercial Shareholders&rdquo;)
        are in principle eligible for\na full refund or credit against income tax
        of the Withholding Tax if they duly report the underlying income in their
        statements of operations\nor income tax return, as the case may be.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Shareholders
        who are not resident in Switzerland for tax purposes, and\nwho, in each case
        and during the respective taxation year, do not hold their common shares as
        part of a trade or business carried on through\na permanent establishment
        with fixed place of business situated in Switzerland for tax purposes, and
        who are not subject to corporate\nor individual income taxation in Switzerland
        for any other reason (collectively, &ldquo;Non-Resident Shareholders&rdquo;)
        may be entitled\nto a total or partial refund of the Withholding Tax if the
        country in which such recipient resides for tax purposes maintains a bilateral\ntreaty
        for the avoidance of double taxation with Switzerland and further conditions
        of such treaty are met. Non-Resident Shareholders\nshould be aware that the
        procedures for claiming treaty benefits (and the time required for obtaining
        a refund) may differ from country\nto country. Non-Resident Shareholders should
        consult their own legal, financial or tax advisors regarding receipt, ownership,
        purchases,\nsale or other dispositions of common shares and the procedures
        for claiming a refund of the Withholding Tax.</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        italic bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Securities
        Transfer Stamp Duty</P>\n\n<P STYLE=\"font: italic bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Any transactions in common shares in the secondary
        markets are subject\nto Swiss securities transfer stamp duty at an aggregate
        rate of 0.15% of the consideration paid for such common shares, however, only\nif
        a bank or other securities dealer in Switzerland, as defined in the Swiss
        Federal Stamp Tax Act (<I>loi f&eacute;d&eacute;rale sur\nles droits de timbre</I>),
        is a party or an intermediary to the transaction and no exemption applies.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 35 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->32<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: italic bold 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Swiss Federal, Cantonal and Communal Individual Income Tax\nand
        Corporate Income Tax</P>\n\n<P STYLE=\"font: italic bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: italic 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">Non-Resident Shareholders</P>\n\n<P
        STYLE=\"font: italic 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Non-Resident
        Shareholders are not subject to any Swiss federal, cantonal\nor communal income
        tax on dividend payments and similar distributions because of the mere holding
        of common shares. The same applies for\ncapital gains on the sale of common
        shares subject to certain exceptions. For Withholding Tax consequences, see
        &ldquo;&mdash;Swiss Tax\nConsiderations&mdash;Withholding Tax.&rdquo;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: italic 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Resident
        Private Shareholders and Domestic Commercial Shareholders</P>\n\n<P STYLE=\"font:
        italic 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Resident
        Private Shareholders who receive dividends and similar cash\nor in-kind distributions
        (including liquidation proceeds as well as bonus shares or taxable repurchases
        of common shares as described\nabove), which are not repayments of the par
        value of common shares or, within the limitations accepted by the legislation
        in force and\nthe respective administrative practice, qualifying additional
        paid-in capital (capital contribution reserves), are required to report\nsuch
        receipts in their individual income tax returns and are subject to Swiss federal,
        cantonal and communal income tax on any net taxable\nincome for the relevant
        tax period. A gain or a loss by Resident Private Shareholders realized upon
        the sale or other disposition of common\nshares to a third party will generally
        be a tax-free private capital gain or not a tax-deductible capital loss, as
        the case may be. Under\nexceptional circumstances the capital gain may be
        re-characterized into a taxable dividend, in particular upon taxable repurchase
        of common\nshares as described above. When a capital gain is re-characterized
        as a dividend, the relevant income for tax purposes corresponds to\nthe difference
        between the repurchase price and the sum of the par value of common shares
        and, within the limitations accepted by the\nlegislation in force and the
        respective administrative practice, qualifying additional paid-in capital
        (capital contribution reserves).</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Domestic Commercial Shareholders who receive dividends
        and similar cash\nor in-kind distributions (including liquidation proceeds
        as well as bonus shares) are required to recognize such payments in their
        statements\nof operations for the relevant tax period and are subject to Swiss
        federal, cantonal and communal individual or corporate income tax,\nas the
        case may be, on any net taxable earnings accumulated (including the dividends)
        for such period. On cantonal and communal level,\nsimilar provisions were
        introduced, but the regulations may vary depending on the canton of residency.
        Domestic Commercial Shareholders\nwho are corporate taxpayers may qualify
        for participation relief on dividend distributions (<I>r&eacute;duction pour
        participations</I>),\nif common shares held have an aggregate market value
        of at least CHF 1&nbsp;million. For cantonal and communal income tax purposes,
        the\nregulations on participation relief are broadly similar, depending on
        the canton of residency.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Domestic Commercial Shareholders are required to recognize
        a gain or\nloss realized upon the disposal of common shares in their statement
        of operations for the respective taxation period and are subject to\nSwiss
        federal, cantonal and communal individual or corporate income tax, as the
        case may be, on any net taxable earnings (including the\ngain or loss realized
        on the sale or other disposition of common shares) for such taxation period.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: italic bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Swiss
        Wealth Tax and Capital Tax</P>\n\n<P STYLE=\"font: italic bold 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: italic
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Non-Resident Shareholders</P>\n\n<P
        STYLE=\"font: italic 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Non-Resident
        Shareholders holding common shares are not subject to cantonal\nand communal
        wealth or annual capital tax because of the mere holding of common shares.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: italic 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Resident
        Private Shareholders</P>\n\n<P STYLE=\"font: italic 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Resident Private Shareholders are required to
        report their common shares\nas part of their private wealth and are subject
        to cantonal and communal wealth tax.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 36
        -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->33<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: italic 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Domestic
        Commercial Shareholders</P>\n\n<P STYLE=\"font: italic 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Domestic Commercial Shareholders are required
        to report their common\nshares as part of their business wealth or taxable
        capital, as defined in the Swiss Direct Taxation Harmonization Act (<I>loi
        f&eacute;d&eacute;rale\nsur l'harmonisation des imp&ocirc;ts directs des cantons
        et des communes</I>) and the applicable cantonal law, and are subject to cantonal\nand
        communal wealth or annual capital tax.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: italic
        bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Automatic Exchange
        of Information in Tax Matters</P>\n\n<P STYLE=\"font: italic bold 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">On November&nbsp;19, 2014, Switzerland
        signed the Multilateral Competent\nAuthority Agreement. The Multilateral Competent
        Authority Agreement is based on Article 6 of the OECD/Council of Europe administrative\nassistance
        convention and is intended to ensure the uniform implementation of Automatic
        Exchange of Information (the &ldquo;AEOI&rdquo;).\nThe Federal Act on the
        International Automatic Exchange of Information in Tax Matters (the &ldquo;AEOI
        Act&rdquo;) entered into force\non January&nbsp;1, 2017. The AEOI Act is the
        legal basis for the implementation of the AEOI standard in Switzerland.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The AEOI
        is being introduced in Switzerland through bilateral agreements\nor multilateral
        agreements. The agreements have been, and will be, concluded on the basis
        of guaranteed reciprocity, compliance with the\nprinciple of speciality (i.e.,
        the information exchanged may only be used to assess and levy taxes (and for
        criminal tax proceedings))\nand adequate data protection.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Based on such multilateral
        or bilateral agreements and the implementation\nof Swiss law, Switzerland
        collects and exchanges data in respect of financial assets, including common
        shares, held in, and income derived\nthereon and credited to, accounts or
        deposits with a paying agent in Switzerland for the benefit of individuals
        resident in a European\nUnion member state or in a treaty state.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: italic bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Swiss
        Facilitation of the Implementation of the U.S. Foreign\nAccount Tax Compliance
        Act</P>\n\n<P STYLE=\"font: italic bold 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Switzerland has concluded an intergovernmental agreement with
        the United\nStates to facilitate the implementation of U.S. Foreign Account
        Tax Compliance Act. The agreement ensures that the accounts held by U.S.\npersons
        with Swiss financial institutions are disclosed to the U.S. tax authorities
        either with the consent of the account holder or by\nmeans of group requests
        within the scope of administrative assistance. Information will not be transferred
        automatically in the absence\nof consent, and instead will be exchanged only
        within the scope of administrative assistance on the basis of the double taxation
        agreement\nbetween the United States and Switzerland. On June 27, 2024, Switzerland
        and the Untied States signed a new FATCA agreement. The new agreement\nprovides
        for a different model for the exchange of financial account data. If the agreement
        is implemented, the current direct-notification-based\nregime will be replaced
        by a regime where the relevant information is sent to the Swiss Federal Tax
        Administration, which in turn provides\nthe information to the U.S. tax authorities.
        The exchange of information will also be mutual and automatic. Implementation
        of the new\nFATCA agreement requires national law to be amended. According
        to the current schedule, Switzerland&rsquo;s change of model should come\ninto
        force on January 1, 2027.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">Material U.S. Federal Income Tax Consequences
        for U.S. Holders</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The following is a description of the material U.S. federal
        income tax\nconsequences to the U.S. Holders, as defined below, of owning
        and disposing of our common shares. It does not describe all tax considerations\nthat
        may be relevant to a particular person&rsquo;s decision to acquire common
        shares.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">This discussion applies only to a U.S. Holder that holds common
        shares\nas capital assets for U.S. federal income tax purposes (generally,
        property held for investment). In addition, it does not describe any\ntax
        consequences other than U.S. federal income tax consequences, including state
        and local tax consequences and estate tax consequences,\nand does not describe
        all of the U.S. federal income tax consequences that may be relevant in light
        of the U.S. Holder&rsquo;s particular\ncircumstances, including alternative
        minimum tax consequences, the potential application of the provisions of the
        Internal Revenue Code\nof 1986, as amended (the &ldquo;Code&rdquo;) known
        as the Medicare contribution tax and tax consequences applicable to U.S. Holders
        subject\nto special rules, such as:</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 37
        -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->34<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>certain banks, insurance companies
        and other financial institutions;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>brokers, dealers or traders
        in securities who use a mark-to-market method of tax accounting;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>persons
        holding common shares as part of a straddle, wash sale, conversion transaction
        or other integrated transaction or persons\nentering into a constructive sale
        with respect to the common shares;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>persons whose functional currency
        for U.S. federal income tax purposes is not the U.S. dollar;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>entities
        or arrangements classified as partnerships or S corporations for U.S. federal
        income tax purposes;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-size:
        12pt\">&bull;</FONT></TD><TD>tax-exempt entities, including an &ldquo;individual
        retirement account&rdquo; or &ldquo;Roth IRAs&rdquo; and governmental entities;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>real
        estate investment trusts or regulated investment companies;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>former
        U.S. citizens or long-term residents of the United States;</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>persons
        subject to Section 451(b) of the Code;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>persons that own or are deemed
        to own 10% or more of the voting power or value of our shares; or</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>persons
        holding common shares in connection with a trade or business conducted outside
        of the United States or in connection with\na permanent establishment or other
        fixed place of business outside of the United States.</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">If an entity or arrangement that is classified as a partnership
        for\nU.S. federal income tax purposes holds common shares, the U.S. federal
        income tax treatment of a partner will generally depend on the\nstatus of
        the partner and the activities of the partnership. Partnerships holding common
        shares and partners in such partnerships should\nconsult their tax advisers
        as to the particular U.S. federal income tax consequences of owning and disposing
        of the common shares.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">This discussion is based on the Code, administrative pronouncements,\njudicial
        decisions, final, temporary and proposed Treasury regulations, and the income
        tax treaty between Switzerland and the United States\n(the &ldquo;Treaty&rdquo;),
        all as of the date hereof, any of which is subject to change or differing
        interpretations, possibly with retroactive\neffect.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">A &ldquo;U.S. Holder&rdquo;
        is a beneficial owner of our common shares\nwho, for U.S. federal income tax
        purposes, is eligible for the benefits of the Treaty and who is:</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>a citizen or individual resident
        of the United States;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top: 0pt; margin-bottom:
        0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-size:
        12pt\">&bull;</FONT></TD><TD>a corporation, or other entity taxable as a corporation,
        created or organized in or under the laws of the United States, any state\ntherein
        or the District of Columbia; or</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT
        STYLE=\"font-size: 12pt\">&bull;</FONT></TD><TD>an estate or trust the income
        of which is subject to U.S. federal income taxation regardless of its source.</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">U.S. Holders should consult their tax advisers concerning
        the U.S. federal,\nstate, local and non-U.S. tax consequences of owning and
        disposing of common shares in their particular circumstances.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field:
        Page; Sequence: 38 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt;
        border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field:
        Sequence; Type: Arabic; Name: PageNo -->35<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\"><B><I>Passive Foreign Investment Company Rules</I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Under the Code, we will
        be a PFIC for any taxable year in which, after\nthe application of certain
        look-through rules with respect to subsidiaries, either (i) 75% or more of
        our gross income consists of &ldquo;passive\nincome&rdquo; or (ii) 50% or
        more of the average quarterly value of our assets consists of assets that
        produce, or are held for the production\nof, &ldquo;passive income.&rdquo;
        For purposes of the above calculations, we will be treated as if we hold our
        proportionate share of\nthe assets of, and receive directly our proportionate
        share of the income of, any other corporation in which we directly or indirectly\nown
        at least 25%, by value, of the shares of such corporation. Passive income
        generally includes interest, dividends, certain non-active\nrents and royalties,
        and capital gains.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Cash is generally characterized as a passive asset for these
        purposes.\nGoodwill is generally characterized as a non-passive or passive
        asset based on the nature of the income produced in the activity to which\nthe
        goodwill is attributable. The extent to which our goodwill should be characterized
        as a non-passive asset is not entirely clear. We\nhold a substantial amount
        of cash, and while this continues to be the case our PFIC status for any taxable
        year depends largely on the\nvalue of our goodwill and the characterization
        of our goodwill as passive or non-passive. The value of our goodwill for any
        taxable year\nmay be determined in large part by reference to the average
        of our market capitalization for that year. Because our market capitalization\ndeclined
        substantially during 2023, we believe we were a PFIC for our 2023 taxable
        year. There is also a risk that we will be a PFIC for\n2024 and possibly future
        taxable years. We have not obtained any valuation of our assets (including
        goodwill). U.S. Holders of our common\nshares should consult their tax advisers
        regarding the value and characterization of our assets for purposes of the
        PFIC rules, as they\nare subject to some uncertainties. In addition, our PFIC
        status is a factual annual determination that can be made only after the end\nof
        the relevant taxable year and will depend on the composition of our income
        and assets and the value of our assets from time to time.\nAccordingly, our
        PFIC status for 2024 and any future taxable year is uncertain.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">If we are a PFIC for any
        year during which a U.S. Holder holds common\nshares, we will continue to
        be treated as a PFIC with respect to that U.S. Holder for all succeeding years
        during which the U.S. Holder\nholds common shares, even if we cease to meet
        the threshold requirements for PFIC status, unless the U.S. Holder elects
        to recognize gain,\nif any, as if it sold its common shares as of the last
        day of the last tax year in which we are a PFIC (such election, a &ldquo;Purging\nElection&rdquo;).
        In addition, the Company may, directly or indirectly, have held or hold equity
        interests in other PFICs (collectively,\n&ldquo;Lower-tier PFICs&rdquo;).
        Under attribution rules, if the Company is a PFIC, U.S. Holders will be deemed
        to own their proportionate\nshares of the stock of Lower-tier PFICs and will
        be subject to U.S. federal income tax according to the rules described in
        the following\nparagraphs on (i) certain distributions by a Lower-tier PFIC
        and (ii) a disposition of shares of a Lower-tier PFIC, in each case as if\nthe
        U.S. Holder held such shares directly, even though holders have not received
        the proceeds of those distributions or dispositions directly.\nU.S. Holders
        should consult their tax advisers about the consequences to them if we own
        one or more Lower-tier PFICs.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">If we are a PFIC for any taxable year during which
        a U.S. Holder holds\ncommon shares, such holder will generally be subject
        to adverse tax consequences. Unless a U.S. Holder makes a timely &ldquo;mark-to-market&rdquo;\nelection
        or &ldquo;qualified electing fund&rdquo; (&ldquo;QEF&rdquo;) election (each
        discussed below), gain recognized by the U.S. Holder\non sale or other disposition
        (including certain pledges) of common shares (including any gain recognized
        as a consequence of a Purging\nElection) will be allocated ratably over the
        U.S. Holder&rsquo;s holding period for the common shares. The amounts allocated
        to the taxable\nyear of the sale or other disposition and to any year before
        we became a PFIC will be taxed as ordinary income. The amount allocated to\neach
        other taxable year will be subject to tax at the highest rate in effect for
        individuals or corporations, as appropriate, for that\ntaxable year, and an
        interest charge will be imposed on the resulting tax liability. Further, to
        the extent that any distribution received\nby a U.S. Holder on its common
        shares exceeds 125% of the average of the annual distributions on the common
        shares received during the\npreceding three years or the U.S. Holder&rsquo;s
        holding period, whichever is shorter, that distribution will be subject to
        taxation in\nthe same manner as gain, described immediately above.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">If we are
        a PFIC and if our common shares are &ldquo;regularly traded&rdquo;\non a &ldquo;qualified
        exchange,&rdquo; a U.S. Holder will be eligible to make a mark-to-market election
        that will result in tax treatment\ndifferent from the general tax treatment
        for PFICs described above. Our common shares will be treated as &ldquo;regularly
        traded&rdquo;\nif more than a de minimis amount of our common shares are traded
        on a qualified exchange on at least 15 days during each calendar quarter.\nThe
        NYSE, on which our common shares are listed, is a qualified exchange for this
        purpose. Once made, the election cannot be revoked without\nthe consent of
        the Internal Revenue Service (the &ldquo;IRS&rdquo;) unless the shares cease
        to be traded on an established market.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence:
        39 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->36<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">If a U.S.
        Holder makes the mark-to-market election, such holder will\ngenerally recognize
        as ordinary income any excess of the fair market value of such holder&rsquo;s
        common shares at the end of each taxable\nyear over their adjusted tax basis,
        and will recognize an ordinary loss in respect of any excess of the adjusted
        tax basis of the common\nshares over their fair market value at the end of
        the taxable year (but only to the extent of the net amount of income previously
        included\nas a result of the mark-to-market election). If a U.S. Holder makes
        the election, such holder&rsquo;s tax basis in their common shares\nwill be
        adjusted to reflect these income or loss amounts. Any gain recognized on the
        sale or other disposition of common shares in a year\nwhen we are a PFIC will
        be treated as ordinary income and any loss will be treated as an ordinary
        loss (but only to the extent of the\nnet amount of income previously included
        as a result of the mark-to-market election). This election will not apply
        to any of our non-U.S.\nsubsidiaries. Accordingly, a U.S. Holder may continue
        to be subject to tax under the PFIC excess distribution regime with respect
        to any\nLower-tier PFICs notwithstanding a mark-to-market election for the
        common shares.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">If a company that is a PFIC provides certain information to
        U.S. Holders,\na U.S. Holder can then avoid certain adverse tax consequences
        described above by making a QEF election to be taxed currently on its proportionate\nshare
        of the PFIC&rsquo;s ordinary income and net capital gains.</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The QEF election is made
        on a shareholder-by-shareholder basis and,\nonce made, can be revoked only
        with the consent of the IRS. A U.S. Holder generally makes a QEF election
        by attaching a completed IRS\nForm 8621, including the information provided
        in a PFIC Annual Information Statement, to a timely filed U.S. federal income
        tax return\nfor the taxable year to which the election relates. U.S. Holders
        should consult their tax advisers regarding the availability and tax\nconsequences
        of a retroactive QEF election under their particular circumstances. In order
        to comply with the requirements to make a QEF\nelection, a U.S. Holder must
        receive a PFIC Annual Information Statement from us. Because we believe we
        were a PFIC for the 2023 taxable\nyear, we have provided information necessary
        for our U.S. investors to make a QEF election with respect to us for the 2023
        taxable year\non our website. If, following the end of our current or future
        taxable years, we believe that we were a PFIC for that taxable year, we\nintend
        to provide on our website information necessary for our U.S. investors to
        make a QEF election with respect to such taxable year,\nbut there can be no
        complete assurance in this regard.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">In addition, if we are a PFIC (or, with respect
        to a particular U.S.\nHolder, are treated as a PFIC) for a taxable year in
        which we pay a dividend or for the prior taxable year, the preferential dividend\nrates
        discussed below with respect to dividends paid to certain non-corporate U.S.
        Holders will not apply.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The rules dealing with PFICs and with the mark-to-market and
        QEF elections\nare complex and are affected by various factors in addition
        to those described above. Accordingly, U.S. Holders should consult their tax\nadvisers
        concerning the application of the PFIC rules to our common shares under their
        particular circumstances.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B><I>Information Returns</I></B></P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">If we are a PFIC for any
        taxable year during which a U.S. Holder holds\ncommon shares, the U.S. Holder
        will generally be required to file an annual report on IRS Form 8621, containing
        such information as the\nU.S. Treasury may require, with their annual U.S.
        federal income tax returns. A U.S. Holder&rsquo;s failure to file the annual
        report\nwill cause the statute of limitations for such U.S. Holder&rsquo;s
        U.S. federal income tax return to remain open with respect to the items\nrequired
        to be included in such report until three years after the U.S. Holder files
        the annual report and, unless such failure is due\nto reasonable cause and
        not willful neglect, the statute of limitations for the U.S. Holder&rsquo;s
        entire U.S. federal income tax return\nwill remain open during such period.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Prospective
        U.S. holders should consult their tax advisers regarding\nthe potential PFIC
        rules to an investment in common shares.</P>\n\n<P STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence:
        40 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->37<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\"><B><I>Taxation
        of Distributions</I></B></P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The following is subject to the discussion regarding the PFIC
        rules\ndescribed above.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Distributions paid on common shares, other than certain <I>pro
        rata</I>\ndistributions of common shares, will generally be treated as dividends
        to the extent paid out of our current or accumulated earnings and\nprofits
        (as determined under U.S. federal income tax principles). Dividends paid to
        certain non-corporate U.S. Holders may be eligible\nfor taxation as &ldquo;qualified
        dividend income&rdquo; and therefore, subject to applicable limitations, may
        be taxable at rates not\nin excess of the long-term capital gain rate applicable
        to such U.S. Holder. However, the qualified dividend income treatment will
        not\napply if we are treated as a PFIC with respect to the U.S. Holder or
        if we are a PFIC for the taxable year in which the dividend is paid\nor the
        preceding taxable year.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The amount of a dividend will include any amounts withheld
        by us in\nrespect of Swiss income taxes. The amount of the dividend will be
        treated as foreign-source dividend income to U.S. Holders and will not\nbe
        eligible for the dividends-received deduction generally available to U.S.
        corporations under the Code. Dividends will be included in\na U.S. Holder&rsquo;s
        income on the date of the U.S. Holder&rsquo;s receipt of the dividend. The
        amount of any dividend income paid in\nSwiss francs will be the U.S. dollar
        amount calculated by reference to the exchange rate in effect on the date
        of actual or constructive\nreceipt, regardless of whether the payment is in
        fact converted into U.S. dollars at that time. If the dividend is converted
        into U.S.\ndollars on the date of receipt, a U.S. Holder should not be required
        to recognize foreign currency gain or loss in respect of the dividend\nincome.
        A U.S. Holder may have foreign currency gain or loss if the dividend is converted
        into U.S. dollars after the date of receipt.</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Subject to generally applicable
        limitations and conditions, some of\nwhich vary depending upon the U.S. Holder&rsquo;s
        particular circumstances, Swiss income taxes withheld from dividends on common
        shares\n(at a rate not exceeding the rate provided by the Treaty, in the case
        of a U.S. Holder eligible for a reduced rate under the Treaty) will\nbe creditable
        against the U.S. Holder&rsquo;s U.S. federal income tax liability. These generally
        applicable limitations and conditions\ninclude new requirements adopted by
        the IRS in regulations promulgated in December 2021 (the &ldquo;Foreign Tax
        Credit Regulations&rdquo;)\nand any Swiss tax will need to satisfy these requirements
        in order to be eligible to be a creditable tax to a U.S. Holder. However,
        the\nIRS released guidance in the form of a notice which provides temporary
        relief from the requirements of these new regulations for taxable\nyears ending
        before the date that a notice or other guidance withdrawing or modifying the
        temporary relief is issued (or any later date\nspecified in such notice or
        other guidance). In the case of a U.S. Holder that either (i) is eligible
        for, and properly elects, the benefits\nof the Treaty, or (ii) consistently
        elects to apply a modified version of these rules under the recently issued
        temporary guidance and\ncomplies with specific requirements set forth in such
        guidance, the Swiss tax on interest generally will be treated as a creditable
        tax\n(for taxable years for which such temporary relief applies, in the case
        of U.S. Holders relying on the temporary relief). In the case\nof all other
        U.S. Holders, the application of these requirements to the Swiss tax is uncertain
        and we have not determined whether these\nrequirements have been met. If the
        Swiss tax is not a creditable tax for a U.S. Holder or such holder does not
        elect to claim a foreign\ntax credit for any foreign income taxes paid or
        accrued in the same taxable year, such U.S. Holder may be eligible to deduct
        the Swiss\ntax in computing its taxable income for U.S. federal income tax
        purposes, subject to generally applicable limitations under U.S. law.\nAn
        election to deduct foreign taxes instead of claiming foreign tax credits applies
        to all foreign taxes paid or accrued in the taxable\nyear. Dividend distributions
        will constitute income from sources without the United States and, for U.S.
        Holders that elect to claim foreign\ntax credits, generally will constitute
        &ldquo;passive category income&rdquo; for foreign tax credit purposes.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The availability
        and calculation of foreign tax credits and deductions\nfor foreign taxes depend
        on a U.S. Holder&rsquo;s particular circumstances and involve the application
        of complex rules to those circumstances.\nThe temporary guidance discussed
        above also indicates that the U.S. Treasury and the IRS are considering proposing
        amendments to the December\n2021 regulations and that the temporary guidance
        can be relied upon until additional guidance is issued that withdraws or modifies
        the\ntemporary guidance. U.S. Holders should consult their tax advisers regarding
        the application of these rules to their particular circumstances.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 41 -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; text-align: center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!--
        Field: Sequence; Type: Arabic; Name: PageNo -->38<!-- Field: /Sequence --></P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"font: bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\"
        STYLE=\"font-weight: bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\"><B><I>Sale or Other Disposition of Common Shares</I></B></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The following
        is subject to the discussion regarding the PFIC rules\ndescribed above.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Gain or loss
        realized by a U.S. Holder on the sale or other disposition\nof common shares
        will be capital gain or loss, and will be long-term capital gain or loss if
        the U.S. Holder&rsquo;s holding period for\nsuch common shares was more than
        one year as of the date of the sale or other disposition. The amount of the
        gain or loss will equal the\ndifference between the U.S. Holder&rsquo;s tax
        basis in the common shares disposed of and the amount realized on the disposition,
        in each\ncase as determined in U.S. dollars. Long-term capital gain recognized
        by a non-corporate U.S. Holder is subject to U.S. federal income\ntax at rates
        lower than the rates applicable to ordinary income and short-term capital
        gains, while short-term capital gains are subject\nto U.S. federal income
        tax at the rates applicable to ordinary income. This gain or loss will generally
        be U.S.-source gain or loss for\nforeign tax credit purposes. However, U.S.
        Holders that are eligible for benefits under the Treaty may be able to elect
        to treat the gain\nas foreign-source income under the Treaty and claim a foreign
        tax credit in respect of Swiss taxes on disposition gains. The Foreign Tax\nCredit
        Regulations generally preclude a U.S. Holder from claiming a foreign tax credit
        with respect to Swiss income taxes on gains from\ndispositions of common shares
        if the U.S. Holder does not elect to apply the benefits of the Treaty. However,
        in that case it is possible\nthat any Swiss taxes on disposition gains may
        either be deductible or reduce the amount realized on the disposition. The
        rules governing\nforeign tax credits and deductibility of foreign taxes are
        complex. U.S. Holders should consult their tax advisers regarding their eligibility\nfor
        benefits under the Treaty and the consequences of the imposition of any Swiss
        tax on disposition gains. The deductibility of capital\nlosses is subject
        to various limitations.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\"><B><I>Information Reporting and Backup Withholding</I></B></P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">Payments
        of dividends and sales proceeds that are made within the United\nStates or
        through certain U.S.-related financial intermediaries generally are subject
        to information reporting, and may be subject to\nbackup withholding, unless
        (i) the U.S. Holder is a corporation or other exempt recipient or (ii) in
        the case of backup withholding, the\nU.S. Holder provides a correct taxpayer
        identification number and certifies that it is not subject to backup withholding.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">The amount
        of any backup withholding from a payment to a U.S. Holder\nwill be allowed
        as a credit against the U.S. Holder&rsquo;s U.S. federal income tax liability
        and may entitle it to a refund, provided\nthat the required information is
        timely furnished to the IRS.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n\n<!-- Field: Page; Sequence: 42
        -->\n    <DIV STYLE=\"margin-top: 6pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\">&nbsp;<!-- Field: Sequence;
        Type: Arabic; Name: PageNo -->39<!-- Field: /Sequence --></P></DIV>\n    <DIV
        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P STYLE=\"font:
        bold 8pt Arial, Helvetica, Sans-Serif; margin: 0pt\"><A HREF=\"#toc\" STYLE=\"font-weight:
        bold\">Table of Contents</A>&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        center\"><A NAME=\"a_009\"></A>SELLING SHAREHOLDERS</P>\n\n<P STYLE=\"font:
        bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: center\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">This prospectus
        relates to the resale of up to an aggregate of 27,726,052\ncommon shares by
        the selling shareholders.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">We do not know whether, when or the extent to which the holders
        of common\nshares will sell such common shares or the holders of the pre-funded
        warrants will opt to exercise their pre-funded warrants. We are registering\nthe
        common shares in order to permit the selling shareholders to offer the shares
        for resale from time to time. Except for ownership of\nthe common shares and
        pre-funded warrants and as described in the documents incorporated by reference
        in this prospectus, the selling\nshareholders have not had any material relationship
        with us within the past three years.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">The table below lists the selling shareholders
        and other information\nregarding the beneficial ownership of common shares
        by each of the selling shareholders. The second column lists the number of
        common\nshares owned by each selling shareholder. The third column lists the
        number of common shares offered by this prospectus by each selling\nshareholder.
        The fourth column lists the number of common shares beneficially owned by
        each selling shareholder after the offering contemplated\nby this prospectus,
        assuming the sale of all common shares being offered by this prospectus by
        each selling shareholder.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The selling shareholders may sell some, all or none of their
        common\nshares. We do not know how long the selling shareholders will hold
        the common shares before selling them, and we currently have no agreements,\narrangements
        or understandings with any selling shareholder regarding its resale of any
        of the common shares. See &ldquo;Plan of Distribution.&rdquo;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLSPACING=\"0\"
        CELLPADDING=\"0\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; width:
