        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: center\"><A NAME=\"a_011\"></A>LEGAL
        MATTERS</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0; text-align: center\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0\">The validity of the common shares and certain
        other matters with respect\nto Swiss law will be passed upon for us by Homburger
        AG, Zurich, Switzerland. Certain matters with respect to U.S. federal and
        New York\nState law will be passed upon for us by Davis Polk &amp; Wardwell
        LLP, New York, New York.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: bold 10pt Arial, Helvetica,
        Sans-Serif; margin: 0pt 0; text-align: center\"><A NAME=\"a_012\"></A>EXPERTS</P>\n\n<P
        STYLE=\"font: bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        center\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">The financial statements incorporated in this prospectus by
        reference\nto the Annual Report on Form 10-K for the year ended December 31,
        2024 have been so incorporated in reliance on the report of PricewaterhouseCoopers\nSA,
        an independent registered &lrm;public accounting firm, given on the authority
        of said firm as experts in auditing and accounting.\n&lrm;</P>\n\n<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        bold 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: center\"><A
        NAME=\"a_013\"></A>ENFORCEMENT OF JUDGMENTS</P>\n\n<P STYLE=\"font: bold 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: center\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0\">We are organized
        under the laws of Switzerland and our registered office\nand domicile is located
        in Epalinges, Switzerland. Moreover, a number of our directors and executive
        officers are not residents of the\nUnited States, and all or a substantial
        portion of the assets of such persons are located outside the United States.
        As a result, it may\nnot be possible for investors to effect service of process
        within the United States upon us or upon such persons or to enforce against\nthem
        judgments obtained in U.S. courts, including judgments in actions predicated
        upon the civil liability provisions of the federal securities\nlaws of the
        United States. We have been advised by our Swiss counsel that there is doubt
        as to the enforceability in Switzerland of original\nactions, or in actions
        for enforcement of judgments of U.S. courts, of civil liabilities to the extent
        solely predicated upon the federal\nand state securities laws of the United
        States. Original actions against persons in Switzerland based solely upon
        the U.S. federal or\nstate securities laws are governed, among other things,
        by the principles set forth in the Swiss Federal Act on Private International\nLaw
        (the &ldquo;PILA&rdquo;). The PILA provides that the application of provisions
        of non-Swiss law by the courts in Switzerland shall\nbe precluded if the result
        would be incompatible with Swiss public policy. Also, mandatory provisions
        of Swiss law may be applicable regardless\nof any other law that would otherwise
        apply.</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0\">Switzerland and the United States do not have a treaty providing
        for\nreciprocal recognition of and enforcement of judgments in civil and commercial
        matters. The recognition and enforcement of a judgment\nof the courts of the
        United States in Switzerland is governed by the principles set forth in the
        PILA. The PILA provides in principle\nthat a judgment rendered by a non-Swiss
        court may be enforced in Switzerland only if:</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0.25in\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Symbol\">&middot;</FONT></TD><TD><FONT STYLE=\"font-family: Arial, Helvetica,
        Sans-Serif\">the non-Swiss court had jurisdiction pursuant to the PILA; </FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">the judgment of such non-Swiss
        court has become final and non-appealable;\n</FONT></TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0.25in\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT></TD><TD><FONT
        STYLE=\"font-family: Arial, Helvetica, Sans-Serif\">the judgment does not
        contravene Swiss public policy; </FONT></TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
