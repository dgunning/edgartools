        0pt\"><IMG SRC=\"image_006.jpg\" ALT=\"\">&nbsp;</P></DIV>\n    <!-- Field:
        /Page -->\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR
        STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width:
        21.25pt\">(l)</TD><TD STYLE=\"text-align: justify\">each party to the Documents
        (other than the Company) is a corporation or other legal entity duly organized\nand
        validly existing and in good standing (if applicable) under the laws of the
        jurisdiction of its incorporation and/or establishment\nand none of the parties
        to the Documents (other than the Company) has passed or, until the issuance
