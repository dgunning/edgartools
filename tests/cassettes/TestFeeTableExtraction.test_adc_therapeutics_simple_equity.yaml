        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(b)</TD><TD STYLE=\"text-align: justify\">electronic
        copies of the Pre-Funded Warrants;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(c)</TD><TD>an
        electronic copy of the resolutions of the board of directors of the Company
        dated May 29, 2025 (the <B>Private Placement Board\nResolution</B>), regarding,
        <I>inter alia</I>, (i)&nbsp;the approval of the offering and sale of the Common
        Shares and the Pre-Funded\nWarrants;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align:
        top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(d)</TD><TD>an
        electronic copy of the resolutions of the Pricing Committee dated June 11,
        2025, determining the number and offer price of the\nCommon Shares and the
        Pre-Funded Warrants (the <B>Pricing Committee Resolution,</B> and together
        with the Private Placement Board Resolution,\nthe <B>Board Resolutions</B>);</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(e)</TD><TD STYLE=\"text-align: justify\">an electronic
        copy of a certified excerpt from the Commercial Register of the Canton of
        Vaud dated June\n13, 2025, relating to the Company (the <B>Excerpt</B>); and</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom:
        0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 21.25pt\">(f)</TD><TD STYLE=\"text-align: justify\">an electronic
        copy of the articles of association (<I>statuts</I>) of the Company dated
        June 12, 2025\n(the <B>Articles</B>).</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">No documents have been reviewed by us in connection\nwith this opinion
        other than the Documents. Accordingly, we shall limit our opinion to the Documents
        and their legal implications under\nSwiss law.</P>\n\n<P STYLE=\"font: 10pt
        Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">In this opinion, Swiss legal concepts are expressed\nin English
        terms and not in their original language. These concepts may not be identical
        to the concepts described by the same English\nterms as they exist under the
        laws of other jurisdictions. With respect to Documents governed by laws other
        than the laws of Switzerland,\nfor purposes of this opinion we have relied
        on the plain meaning of the words and expressions contained therein without
        regard to any\nimport they may have under the relevant governing law.</P>\n\n<P
        STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif; margin: 0pt 0; text-align:
        justify\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\"
        STYLE=\"color: #46B4D7; font: 12pt Arial, Helvetica, Sans-Serif; margin-top:
        0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD STYLE=\"width:
        0\"></TD><TD STYLE=\"width: 21.25pt\">II.</TD><TD STYLE=\"text-align: justify\">Assumptions</TD></TR></TABLE>\n\n<P
        STYLE=\"margin-top: 0pt; margin-bottom: 0pt; font: 12pt Arial, Helvetica,
        Sans-Serif\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0; text-align: justify\">In rendering the opinions below, we have
        assumed\nthe following:</P>\n\n<P STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin: 0pt 0; text-align: justify\">&nbsp;</P>\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font: 10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0pt; margin-bottom: 0pt\"><TR STYLE=\"vertical-align: top\">\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 21.25pt\">(a)</TD><TD STYLE=\"text-align:
        justify\">all documents produced to us as originals are authentic and complete,
        and all documents produced to us\nas copies (including, without limitation,
        electronic copies) conform to the original;</TD></TR></TABLE>\n\n<P STYLE=\"margin-top:
        0pt; margin-bottom: 0pt; font: 10pt Arial, Helvetica, Sans-Serif\">&nbsp;</P>\n\n\n<!--
        Field: Page; Sequence: 2; Options: NewSection; Value: 2 -->\n    <DIV STYLE=\"margin-top:
        6pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0pt; text-align: right\"><!-- Field:
        Sequence; Type: Arabic; Name: PageNo -->2<!-- Field: /Sequence -->/8</P></DIV>\n
        \   <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 6pt\"><P
        STYLE=\"text-align: right; font: 10pt Arial, Helvetica, Sans-Serif; margin:
        0pt\"><IMG SRC=\"image_006.jpg\" ALT=\"\">&nbsp;</P></DIV>\n    <!-- Field:
        /Page -->\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin-top: 0pt; margin-bottom: 0pt\"><TR
        STYLE=\"vertical-align: top\">\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width:
        21.25pt\">(b)</TD><TD STYLE=\"text-align: justify\">all documents produced
