        Sans',sans-serif;font-size:10pt;font-weight:700;line-height:112%\">Item 5.02.
        Departure of Directors or Certain Officers; Election of Directors; Appointment
        of Certain Officers; Compensatory Arrangements of Certain Officers.</span></div><div><span><br/></span></div><div><span
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:112%\">Adoption
        of Fiscal Year 2027 Variable Compensation Plan</span></div><div><span><br/></span></div><div><span
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">On
        March 2, 2026, the Compensation Committee of the Board of Directors, or the
        Board, of NVIDIA Corporation, or the Company, adopted the Variable Compensation
        Plan for Fiscal Year 2027, or the 2027 Plan, which provides eligible executive
        officers the opportunity to earn a variable cash payment based on the level
        of achievement by the Company of certain corporate performance goals, or the
        Performance Goals, during fiscal year 2027. The Company operates on a fiscal
        year ending on the last Sunday in January and designates its fiscal year by
        the year in which that fiscal year ends. Fiscal year 2027 refers to the Company&#8217;s
        fiscal year ending January 31, 2027.</span></div><div><span><br/></span></div><div><span
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">The
        Compensation Committee has set the Performance Goals for fiscal year 2027
        based upon the achievement of specified fiscal year 2027 revenue and has established
        threshold compensation plan, base compensation plan, and stretch compensation
        plan levels.</span></div><div><span><br/></span></div><div><span style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">Unless
        otherwise determined by the Compensation Committee, a participant must remain
        an employee through the payment date under the 2027 Plan to be eligible to
        earn an award.</span></div><div><span><br/></span></div><div><span style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">The following
        table sets forth the respective target award opportunities for base compensation
        plan achievement for the Company&#8217;s named executive officers under the
        2027 Plan:</span></div><div><span><br/></span></div><div><table style=\"border-collapse:collapse;display:inline-table;margin-bottom:5pt;vertical-align:text-bottom;width:100.000%\"><tr><td
        style=\"width:1.0%\"/><td style=\"width:44.501%\"/><td style=\"width:0.1%\"/><td
