        Document created using Wdesk -->\n<!-- Copyright 2026 Workiva -->\n<title>Document</title></head><body><div
        id=\"i84c6233cb01d4521acfd8593baba6a6e_1\"></div><div style=\"min-height:56.88pt;width:100%\"><div><font><br></font></div></div><div
        style=\"margin-bottom:12pt;padding-right:-18pt;text-align:right\"><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Exhibit
        10.1</font></div><div style=\"margin-bottom:12pt;padding-right:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">VARIABLE
        COMPENSATION PLAN &#8211; FISCAL YEAR 2027</font></div><div style=\"margin-bottom:12pt;padding-right:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Overview</font></div><div
        style=\"margin-bottom:12pt;padding-right:-18pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">The
        compensation philosophy of NVIDIA Corporation (the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Company</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;)
        is to attract, motivate, retain and reward its management through a combination
        of base salary and performance based compensation.  Certain Senior Officers,
        as defined below (collectively, the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Participants</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;),
        who are employed at the Company during fiscal year 2027 and, unless otherwise
        determined by the Compensation Committee (the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Committee</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;)
        of the Company&#8217;s Board of Directors (the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Board</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;),
        are employees of the Company through the date that any amounts earned hereunder
        are paid, will be eligible to earn compensation under this Fiscal Year 2027
        Variable Compensation Plan (the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Plan</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;).
        \ The Plan is designed to award compensation for performance in fiscal year
        2027 to a Participant if the Company achieves certain corporate performance
        goals (the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Performance
        Goals</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;).</font></div><div
        style=\"margin-bottom:12pt;padding-right:-18pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">For
        purposes of the Plan, only the Company&#8217;s chief executive officer, chief
        financial officer and other named executive officers shall be considered &#8220;Senior
        Officers.&#8221;  The Committee shall determine the persons to be specified
        as Senior Officers for purposes of this Plan and the Senior Officers who may
        be Participants hereunder.</font></div><div style=\"margin-bottom:12pt;padding-right:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Determination
        of Fiscal Year 2027 Payments</font></div><div style=\"margin-bottom:12pt;padding-right:-18pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Each
        Participant is eligible to earn compensation under the Plan at a specified
        base amount (the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Base
        Payment Amount</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;)
        if the Company achieves its Performance Goals at a specified base level. A
        Participant&#8217;s Base Payment Amount is based on the difficulty and responsibility
        of each position.  Each Participant&#8217;s Base Payment Amount will be entirely
        allocated to the achievement of the Performance Goals.  The actual amount
        of compensation that may be earned by and paid to each Participant under this
        Plan (the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Actual
        Payment Amount</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;)
        may be more or less than his or her Base Payment Amount as described more
        fully below.</font></div><div style=\"margin-bottom:12pt;padding-right:-18pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">The
        Committee has set the Performance Goals for the Participants based on achievement
        of fiscal year 2027 revenue at specified threshold, base and stretch levels
        (the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Threshold
        Compensation Plan</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">,&#8221;
        &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Base
        Compensation Plan</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;
        and &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Stretch
        Compensation Plan</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">,&#8221;
        respectively).  For purposes of the Plan, the &#8220;</font><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">Actual
        Result</font><font style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8221;
        is defined as revenue, as reported on the Company&#8217;s income statement
        for fiscal year 2027, subject to adjustments if and to the extent determined
        appropriate by the Committee to reflect the exclusion of revenue from mergers
        with or acquisitions by the Company completed during fiscal year 2027.</font></div><div
        style=\"margin-bottom:12pt;padding-right:-18pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">The
        Actual Payment Amount for each Participant shall be determined pursuant to
        the following&#58;</font></div><div style=\"margin-bottom:12pt;padding-left:22.5pt;padding-right:-18pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.26pt\">If
        the Actual Result is less than the Threshold Compensation Plan, a Participant
        will not earn any Actual Payment Amount.</font></div><div style=\"margin-bottom:12pt;padding-left:22.5pt;padding-right:-18pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.26pt\">If
        the Actual Result equals the Threshold Compensation Plan, each Participant
        may earn an Actual Payment Amount equal to 50% of his or her Base Payment
        Amount.</font></div><div style=\"margin-bottom:12pt;padding-left:22.5pt;padding-right:-18pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.26pt\">If
        the Actual Result exceeds the Threshold Compensation Plan but is less than
        the Base Compensation Plan, each Participant may earn an Actual Payment Amount
        pursuant to the formula set forth below&#58;</font></div><div style=\"margin-bottom:12pt;padding-left:22.5pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:100%\">Actual
        Payment Amount &#61; &#91;((Actual Result &#8211; Threshold Compensation Plan)
        &#47; (Base Compensation Plan &#8211; Threshold Compensation Plan)) * 50%)
        + 50%&#93; * Base Payment Amount</font></div><div style=\"height:72pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:56.88pt;width:100%\"><div><font><br></font></div></div><div
        style=\"margin-bottom:12pt;padding-left:22.5pt;padding-right:-18pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.26pt\">If
        the Actual Result equals the Base Compensation Plan, each Participant may
        earn an Actual Payment Amount equal to 100% of his or her Base Payment Amount.</font></div><div
        style=\"margin-bottom:12pt;padding-left:22.5pt;padding-right:-18pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.26pt\">If
        the Actual Result exceeds the Base Compensation Plan but is less than the
        Stretch Compensation Plan, each Participant may earn an Actual Payment Amount
        pursuant to the formula set forth below&#58;</font></div><div style=\"margin-bottom:12pt;padding-left:22.5pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:100%\">Actual
        Payment Amount &#61; &#91;((Actual Result &#8211; Base Compensation Plan)
        &#47; (Stretch Compensation Plan &#8211; Base Compensation Plan)) + 1&#93;
        * Base Payment Amount</font></div><div style=\"margin-bottom:12pt;padding-left:22.5pt;padding-right:-18pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.26pt\">If
        the Actual Result equals or exceeds the Stretch Compensation Plan, each Participant
        may earn an Actual Payment Amount equal to two (2) times his or her Base Payment
        Amount.  In no event may any Participant earn an Actual Payment Amount in
        excess of two (2) times his or her Base Payment Amount.</font></div><div style=\"margin-bottom:12pt\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:700;line-height:100%\">Miscellaneous
        Provisions</font></div><div style=\"margin-bottom:12pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:100%\">Any
        payments under this Plan shall be made in the form of cash following the end
        of fiscal year 2027, on such schedule as may be approved by the Committee
        in its discretion, but in all cases in compliance with the short-term deferral
        exemption from Section 409A of the Internal Revenue Code of 1986, as amended.
        \ Any payments under this Plan shall be subject to any required payroll deductions
        and tax withholdings.</font></div><div style=\"margin-bottom:12pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:100%\">Participation
        in the Plan shall not alter in any way the at will nature of the Company&#8217;s
        employment of a Participant, and such employment may be terminated at any
        time for any reason, with or without cause and with or without prior notice.</font></div><div
        style=\"margin-bottom:12pt;text-align:justify\"><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-weight:400;line-height:100%\">Notwithstanding
        whether this Plan is referenced in another agreement, policy, arrangement
        or other document, only the Board or the Committee may amend or terminate
        this Plan at any time.</font></div><div style=\"margin-bottom:12pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'NVIDIA Sans',sans-serif;font-size:10pt;font-weight:400;line-height:100%\">Any
        payments or other benefits under this Plan shall be subject to recoupment
        in accordance with (i) the Company&#8217;s Compensation Recovery Policy, as
        amended from time to time, and (ii) any clawback policy that the Company is
        required to adopt pursuant to applicable law or listing standards or otherwise
        adopts, to the extent applicable and permissible under applicable law.</font></div><div
        style=\"margin-bottom:12pt;text-align:justify\"><font style=\"color:#000000;font-family:'NVIDIA
        Sans',sans-serif;font-size:10pt;font-weight:400;line-height:100%\">This Plan
        shall be governed by and construed in accordance with the laws of the State
        of California, without regard to its principles of conflicts of laws.</font></div><div
        style=\"height:72pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div><font><br></font></div></div></div></body></html>\n</TEXT>\n</DOCUMENT>\n<DOCUMENT>\n<TYPE>EX-101.SCH\n<SEQUENCE>3\n<FILENAME>nvda-20260302.xsd\n<DESCRIPTION>XBRL
