        Black 1pt solid; margin-bottom: 0;\n              color: rgb(147,149,152);
        margin-top: 9pt\">\n              Auto-Callable Notes Linked to the S&amp;P
        500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">This historical
        data on the SPX is not necessarily indicative\n\nof the future performance
        of the SPX or what the value of the Notes may be. Any historical upward or
        downward trend in the closing level\n\nof the SPX during any period set forth
