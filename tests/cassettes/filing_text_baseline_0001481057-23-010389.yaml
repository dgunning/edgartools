        \             <P STYLE=\"font: 8pt Arial, Helvetica, Sans-Serif; border-bottom:
        Black 1pt solid; margin-bottom: 0;\n              color: rgb(147,149,152);
        margin-top: 9pt\">\n              Auto-Callable Notes Linked to the S&amp;P
        500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n\n\n<P STYLE=\"font:
        17pt/21pt Arial, Helvetica, Sans-Serif; margin: 0 0 4pt\">Supplement to the
        Plan of Distribution; Role of BofAS and Conflicts\n\nof Interest</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">BofAS, a broker-dealer affiliate of ours, is a member\n\nof the Financial
        Industry Regulatory Authority, Inc. (&#8220;FINRA&#8221;) and will participate
        as selling agent in the distribution of\n\nthe Notes. Accordingly, the offering
        of the Notes will conform to the requirements of FINRA Rule 5121. BofAS may
        not make sales in this\n\noffering to any of its discretionary accounts without
        the prior written approval of the account holder.</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">We expect to deliver the Notes against payment therefor\n\nin New York,
        New York on a date that is greater than two business days following the pricing
        date. Under Rule 15c6-1 of the Securities\n\nExchange Act of 1934, trades
        in the secondary market generally are required to settle in two business days,
        unless the parties to any\n\nsuch trade expressly agree otherwise. Accordingly,
        if the initial settlement of the Notes occurs more than two business days
        from the\n\npricing date, purchasers who wish to trade the Notes more than
        two business days prior to the original issue date will be required to\n\nspecify
        alternative settlement arrangements to prevent a failed settlement.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">Under our distribution agreement with BofAS, BofAS
        will\n\npurchase the Notes from us as principal at the public offering price
        indicated on the cover of this pricing supplement, less the indicated\n\nunderwriting
        discount. BofAS will sell the Notes to other broker-dealers that will participate
        in the offering and that are not affiliated\n\nwith us, at an agreed discount
        to the principal amount. Each of those broker-dealers may sell the Notes to
        one or more additional broker-dealers.\n\n\nBofAS has informed us that these
        discounts may vary from dealer to dealer and that not all dealers will purchase
        or repurchase the Notes\n\nat the same discount. Certain dealers who purchase
        the Notes for sale to certain fee-based advisory accounts may forgo some or
        all of\n\ntheir selling concessions, fees or commissions. The public offering
        price for investors purchasing the Notes in these fee-based advisory\n\naccounts
        may be as low as $980.00 per $1,000 in principal amount of Notes. In addition
        to the underwriting discount, if any, an affiliate\n\nof BofA Finance will
        pay a referral fee of up to $12.00 per $1,000 in principal amount of Notes
        in connection with the distribution of\n\nthe Notes to other registered broker-dealers.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">BofAS and any of our other broker-dealer affiliates\n\nmay
        use this pricing supplement and the accompanying product supplement, prospectus
        supplement and prospectus for offers and sales in\n\nsecondary market transactions
        and market-making transactions in the Notes. However, they are not obligated
        to engage in such secondary\n\nmarket transactions and/or market-making transactions.
        These broker-dealer affiliates may act as principal or agent in these transactions,\n\nand
        any such sales will be made at prices related to prevailing market conditions
        at the time of the sale.</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt
        Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">At BofAS&#8217;s
        discretion, for a short, undetermined\n\ninitial period after the issuance
        of the Notes, BofAS may offer to buy the Notes in the secondary market at
        a price that may exceed the\n\ninitial estimated value of the Notes. Any price
        offered by BofAS for the Notes will be based on then-prevailing market conditions
        and\n\nother considerations, including the performance of the Underlying and
        the remaining term of the Notes. However, none of us, the Guarantor,\n\nBofAS
        or any of our other affiliates is obligated to purchase your Notes at any
        price or at any time, and we cannot assure you that any\n\nparty will purchase
        your Notes at a price that equals or exceeds the initial estimated value of
        the Notes.</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">Any price that BofAS may
        pay to repurchase the Notes\n\nwill depend upon then prevailing market conditions,
        the creditworthiness of us and the Guarantor, and transaction costs. At certain
        times,\n\nthis price may be higher than or lower than the initial estimated
        value of the Notes.</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial,
        Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B;
        font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\"><B>European Economic
        Area and United Kingdom</B></P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt
        Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">None of
        this pricing supplement, the accompanying product\n\nsupplement, the accompanying
        prospectus or the accompanying prospectus supplement is a prospectus for the
        purposes of the Prospectus Regulation\n\n(as defined below). This pricing
        supplement, the accompanying product supplement, the accompanying prospectus
        and the accompanying prospectus\n\nsupplement have been prepared on the basis
        that any offer of Notes in any Member State of the European Economic Area
        (the &#8220;EEA&#8221;)\n\nor in the United Kingdom (each, a &#8220;Relevant
        State&#8221;) will only be made to a legal entity which is a qualified investor
        under\n\nthe Prospectus Regulation (&#8220;Qualified Investors&#8221;). Accordingly
        any person making or intending to make an offer in that Relevant\n\nState
        of Notes which are the subject of the offering contemplated in this pricing
        supplement, the accompanying product supplement, the\n\naccompanying prospectus
        and the accompanying prospectus supplement may only do so with respect to
        Qualified Investors. Neither BofA Finance\n\nnor BAC has authorized, nor does
        it authorize, the making of any offer of Notes other than to Qualified Investors.
        The expression &#8220;Prospectus\n\nRegulation&#8221; means Regulation (EU)
        2017/1129.</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\"><B>PROHIBITION OF SALES
        TO EEA AND UNITED KINGDOM RETAIL\n\nINVESTORS</B> &#8211; The Notes are not
        intended to be offered, sold or otherwise made available to and should not
        be offered, sold or\n\notherwise made available to any retail investor in
        the EEA or in the United Kingdom. For these purposes: (a) a retail investor
        means a\n\nperson who is one (or more) of: (i) a retail client as defined
        in point (11) of Article 4(1) of Directive 2014/65/EU, as amended (&#8220;MiFID\n\nII&#8221;);
        or (ii) a customer within the meaning of Directive (EU) 2016/97 (the Insurance
        Distribution Directive) where that customer\n\nwould not qualify as a professional
        client as defined in point (10) of Article 4(1) of MiFID II; or (iii) not
        a qualified investor as\n\ndefined in the Prospectus Regulation; and (b) the
        expression &#8220;offer&#8221; includes the communication in any form and
        by any means\n\nof sufficient information on the terms of the offer and the
        Notes to be offered so as to enable an investor to decide to purchase or subscribe\n\nfor
        the Notes. Consequently no key information document required by Regulation
        (EU) No 1286/2014, as amended (the &#8220;PRIIPs Regulation&#8221;)\n\nfor
        offering or selling the Notes or otherwise making them available to retail
        investors in the EEA or in the United Kingdom has been\n\nprepared and therefore
        offering or selling the Notes or otherwise making them available to any retail
        investor in the EEA or in the United\n\nKingdom may be unlawful under the
        PRIIPs Regulation.</P>\n\n\n\n\n\n\n<!-- Field: Page; Sequence: 14 --><div
        style=\"text-align:left;padding-left:15px; margin-top:15px;\"></div>\n          <TABLE
        align=\"center\" CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width: 100%;
        font: 8pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n              <TR
