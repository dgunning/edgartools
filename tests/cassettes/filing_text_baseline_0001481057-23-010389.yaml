        STYLE=\"font: 8pt/10pt Arial, Helvetica, Sans-Serif; margin: 0 0 6pt 0pt;
        color: red\">This pricing supplement, which is not complete and may be changed,
        relates to an effective Registration Statement under the Securities Act of
        1933.  This pricing supplement and the accompanying product supplement, prospectus
        supplement and prospectus are not an offer to sell these notes in any country
        or jurisdiction where such an offer would not be permitted. </P>\n\n\t<P STYLE=\"font:
        10pt Arial, Helvetica, Sans-Serif; margin: 0 0 0 0pt;\"><IMG SRC=\"image_cover.jpg\"
        ALT=\"\" STYLE=\"width: 750px; height: 230px;\">  </P>\n\n\n\n\n\n<P STYLE=\"font:
        13pt/20pt Arial, Helvetica, Sans-Serif; margin: 0 0 5pt\">Linked to the S&amp;P
        500<SUP>&reg;</SUP>\n\nIndex</P>\n\n\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        WIDTH=\"100%\" STYLE=\"color: #58595B; font: 8pt/10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0; margin-bottom: 3pt\"><TR STYLE=\"vertical-align: top\">\n\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 5pt; color: #0080FF\">&#9679;</FONT></TD><TD
        STYLE=\"text-align: justify\"><FONT STYLE=\"color: #59595B\">Approximate </FONT>3
        year <FONT STYLE=\"color: #59595B\">term if not called\n\nprior to maturity.</FONT></TD></TR></TABLE>\n\n\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color: #58595B;
        font: 8pt/10pt Arial, Helvetica, Sans-Serif; margin-top: 0; margin-bottom:
        3pt\"><TR STYLE=\"vertical-align: top\">\n\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif;
        font-size: 5pt; color: #0080FF\">&#9679;</FONT></TD><TD STYLE=\"text-align:
        justify\"><FONT STYLE=\"color: #59595B\">Payment on the Notes will depend
        on the individual performance of the </FONT>S&amp;P\n\n500<FONT STYLE=\"color:
        black\"><SUP>&reg;</SUP></FONT> Index <FONT STYLE=\"color: #59595B\">(</FONT>the
        <FONT STYLE=\"color: #59595B\">&#8220;Underlying&#8221;).</FONT></TD></TR></TABLE>\n\n\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color: #58595B;
        font: 8pt/10pt Arial, Helvetica, Sans-Serif; margin-top: 0; margin-bottom:
        3pt\"><TR STYLE=\"vertical-align: top\">\n\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif;
        font-size: 5pt; color: #0080FF\">&#9679;</FONT></TD><TD STYLE=\"text-align:
        justify\"><FONT STYLE=\"color: #59595B\">The Notes will be automatically called
        at an amount equal to the applicable\n\nCall Amount if, on any Observation
        Date, the Observation Value of the Underlying is equal to or greater than
        </FONT>100% <FONT STYLE=\"color: #59595B\">of\n\nits Starting Value. The Observation
        Dates and Call Amounts are indicated on page </FONT>PS-4.</TD></TR></TABLE>\n\n\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color: #58595B;
        font: 8pt/10pt Arial, Helvetica, Sans-Serif; margin-top: 0; margin-bottom:
        3pt\"><TR STYLE=\"vertical-align: top\">\n\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif;
        font-size: 5pt; color: #0080FF\">&#9679;</FONT></TD><TD STYLE=\"text-align:
        justify\"><FONT STYLE=\"color: #59595B\">Assuming the Notes are not called
        prior to maturity, if the Ending Value\n\nof the Underlying is greater than
        or equal to 100% of its Starting Value, at maturity, you will receive $1,246.00
        per $1,000 in principal\n\namount of your Notes.</FONT></TD></TR></TABLE>\n\n\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color: #58595B;
        font: 8pt/10pt Arial, Helvetica, Sans-Serif; margin-top: 0; margin-bottom:
        3pt\"><TR STYLE=\"vertical-align: top\">\n\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif;
        font-size: 5pt; color: #0080FF\">&#9679;</FONT></TD><TD STYLE=\"text-align:
        justify\"><FONT STYLE=\"color: #59595B\">However, if the Notes are not called
        prior to maturity and the Ending Value\n\nof the Underlying is less than 90%
        of its Starting Value, at maturity your investment will be subject to 1:1
        downside exposure to decreases\n\nin the value of the Underlying</FONT>, <FONT
        STYLE=\"color: #59595B\">with up to </FONT>100<FONT STYLE=\"color: #59595B\">%
        of the principal\n\nat risk; otherwise, at maturity you will receive the principal
        amount. </FONT></TD></TR></TABLE>\n\n\n\n<TABLE CELLPADDING=\"0\" CELLSPACING=\"0\"
        WIDTH=\"100%\" STYLE=\"color: #58595B; font: 8pt/10pt Arial, Helvetica, Sans-Serif;
        margin-top: 0; margin-bottom: 3pt\"><TR STYLE=\"vertical-align: top\">\n\n<TD
        STYLE=\"width: 0\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 5pt; color: #0080FF\">&#9679;</FONT></TD><TD
        STYLE=\"text-align: justify\"><FONT STYLE=\"color: #59595B\">Any payment on
        the Notes is subject to the credit risk of BofA Finance LLC\n\n(&#8220;BofA
        Finance&#8221;), as issuer of the Notes, and Bank of America Corporation (&#8220;BAC&#8221;
        or the &#8220;Guarantor&#8221;),\n\nas guarantor of the Notes.</FONT></TD></TR></TABLE>\n\n\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color: #58595B;
        font: 8pt/10pt Arial, Helvetica, Sans-Serif; margin-top: 0; margin-bottom:
        3pt\"><TR STYLE=\"vertical-align: top\">\n\n<TD STYLE=\"width: 0\"></TD><TD
