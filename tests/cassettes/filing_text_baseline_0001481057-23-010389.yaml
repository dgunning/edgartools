        Black 1pt solid; margin-bottom: 0;\n              color: rgb(147,149,152);
        margin-top: 9pt\">\n              Auto-Callable Notes Linked to the S&amp;P
        500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\"><B>United
        Kingdom</B></P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">The communication of this
        pricing supplement, the accompanying\n\nproduct supplement, the accompanying
        prospectus supplement, the accompanying prospectus and any other document
        or materials relating to\n\nthe issue of the Notes offered hereby is not being
        made, and such documents and/or materials have not been approved, by an authorized\n\nperson
        for the purposes of section 21 of the United Kingdom&#8217;s Financial Services
        and Markets Act 2000, as amended (the &#8220;FSMA&#8221;).\n\nAccordingly,
        such documents and/or materials are not being distributed to, and must not
        be passed on to, the general public in the United\n\nKingdom. The communication
        of such documents and/or materials as a financial promotion is only being
        made to those persons in the United\n\nKingdom who have professional experience
        in matters relating to investments and who fall within the definition of investment
        professionals\n\n(as defined in Article 19(5) of the Financial Services and
        Markets Act 2000 (Financial Promotion) Order 2005, as amended (the &#8220;Financial\n\nPromotion
        Order&#8221;)), or who fall within Article 49(2)(a) to (d) of the Financial
        Promotion Order, or who are any other persons to\n\nwhom it may otherwise
        lawfully be made under the Financial Promotion Order (all such persons together
        being referred to as &#8220;relevant\n\npersons&#8221;). In the United Kingdom,
        the Notes offered hereby are only available to, and any investment or investment
        activity to which\n\nthis pricing supplement, the accompanying product supplement,
        the accompanying prospectus supplement and the accompanying prospectus relates\n\nwill
        be engaged in only with, relevant persons. Any person in the United Kingdom
        that is not a relevant person should not act or rely\n\non this pricing supplement,
        the accompanying product supplement, the accompanying prospectus supplement
        or the accompanying prospectus\n\nor any of their contents.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">Any invitation or inducement to engage in investment\n\nactivity
        (within the meaning of Section 21 of the FSMA) in connection with the issue
        or sale of the Notes may only be communicated or\n\ncaused to be communicated
        in circumstances in which Section 21(1) of the FSMA does not apply to BofA
        Finance, as issuer, or BAC, as guarantor.</P>\n\n\n\n<P STYLE=\"color: #59595B;
        font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">All applicable provisions of the FSMA must be complied\n\nwith in respect
        to anything done by any person in relation to the Notes in, from or otherwise
        involving the United Kingdom.</P>\n\n\n\n\n\n\n<!-- Field: Page; Sequence:
        15 --><div style=\"text-align:left;padding-left:15px; margin-top:15px;\"></div>\n
        \         <TABLE align=\"center\" CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 8pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \             <TR STYLE=\"vertical-align: top\"><TD STYLE=\"width: 50%; text-align:
        left; vertical-align: middle\">\n                  <IMG SRC=\"image_footer.gif\"
        ALT=\"\" STYLE=\"width: 50px\">&nbsp;</TD><TD STYLE=\"width: 50%; text-align:
        right; vertical-align: middle\">\n                      AUTO-CALLABLE NOTES&nbsp;&nbsp;|&nbsp;&nbsp;PS-15</TD></TR>\n</TABLE><hr
        size='5' noshade width='100%' style='color:#000000;page-break-before: always;'>\n
        \         <DIV STYLE=\"page-break-before: always; margin-top: 6pt; margin-bottom:
        6pt\">\n              <P STYLE=\"font: 8pt Arial, Helvetica, Sans-Serif; border-bottom:
        Black 1pt solid; margin-bottom: 0;\n              color: rgb(147,149,152);
        margin-top: 9pt\">\n              Auto-Callable Notes Linked to the S&amp;P
        500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n<P STYLE=\"font:
        17pt/21pt Arial, Helvetica, Sans-Serif; margin: 0 0 4pt\">Structuring the
        Notes</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">The Notes are our debt securities, the return on which\n\nis
        linked to the performance of the Underlying. The related guarantee is BAC&#8217;s
        obligation. As is the case for all of our and BAC&#8217;s\n\nrespective debt
        securities, including our market-linked notes, the economic terms of the Notes
        reflect our and BAC&#8217;s actual or perceived\n\ncreditworthiness at the
        time of pricing. In addition, because market-linked notes result in increased
        operational, funding and liability\n\nmanagement costs to us and BAC, BAC
        typically borrows the funds under these types of notes at a rate, which we
        refer to in this pricing\n\nsupplement as BAC&#8217;s internal funding rate,
        that is more favorable to BAC than the rate that it might pay for a conventional
        fixed\n\nor floating rate debt security. This generally relatively lower internal
        funding rate, which is reflected in the economic terms of the\n\nNotes, along
        with the fees and charges associated with market-linked notes, typically results
        in the initial estimated value of the Notes\n\non the pricing date being less
        than their public offering price.</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">In order
        to meet our payment obligations on the Notes,\n\nat the time we issue the
        Notes, we may choose to enter into certain hedging arrangements (which may
        include call options, put options\n\nor other derivatives) with BofAS or one
        of our other affiliates. The terms of these hedging arrangements are determined
        based upon terms\n\nprovided by BofAS and its affiliates, and take into account
        a number of factors, including our and BAC&#8217;s creditworthiness, interest\n\nrate
        movements, the volatility of the Underlying, the tenor of the Notes and the
        hedging arrangements. The economic terms of the Notes\n\nand their initial
        estimated value depend in part on the terms of these hedging arrangements.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">BofAS has advised us that the hedging arrangements
        will\n\ninclude hedging related charges, reflecting the costs associated with,
        and our affiliates&#8217; profit earned from, these hedging arrangements.\n\nSince
        hedging entails risk and may be influenced by unpredictable market forces,
        actual profits or losses from these hedging transactions\n\nmay be more or
        less than any expected amounts.</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">For further
        information, see &#8220;Risk Factors&#8221;\n\nbeginning on page PS-8 above
        and &#8220;Supplemental Use of Proceeds&#8221; on page PS-20 of the accompanying
        product supplement.</P>\n\n\n\n\n\n\n<!-- Field: Page; Sequence: 16 --><div
        style=\"text-align:left;padding-left:15px; margin-top:15px;\"></div>\n          <TABLE
        align=\"center\" CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width: 100%;
        font: 8pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n              <TR
        STYLE=\"vertical-align: top\"><TD STYLE=\"width: 50%; text-align: left; vertical-align:
        middle\">\n                  <IMG SRC=\"image_footer.gif\" ALT=\"\" STYLE=\"width:
        50px\">&nbsp;</TD><TD STYLE=\"width: 50%; text-align: right; vertical-align:
        middle\">\n                      AUTO-CALLABLE NOTES&nbsp;&nbsp;|&nbsp;&nbsp;PS-16</TD></TR>\n</TABLE><hr
        size='5' noshade width='100%' style='color:#000000;page-break-before: always;'>\n
        \         <DIV STYLE=\"page-break-before: always; margin-top: 6pt; margin-bottom:
        6pt\">\n              <P STYLE=\"font: 8pt Arial, Helvetica, Sans-Serif; border-bottom:
        Black 1pt solid; margin-bottom: 0;\n              color: rgb(147,149,152);
        margin-top: 9pt\">\n              Auto-Callable Notes Linked to the S&amp;P
        500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n<P STYLE=\"font:
        17pt/21pt Arial, Helvetica, Sans-Serif; margin: 0 0 4pt\">U.S. Federal Income
        Tax Summary</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">The following summary of the material U.S. federal
        income\n\nand estate tax considerations of the acquisition, ownership, and
        disposition of the Notes supplements, and to the extent inconsistent\n\nsupersedes,
        the discussion under &#8220;U.S. Federal Income Tax Considerations&#8221;
        in the accompanying prospectus and is not exhaustive\n\nof all possible tax
        considerations. This summary is based upon the Internal Revenue Code of 1986,
        as amended (the &#8220;Code&#8221;),\n\nregulations promulgated under the
        Code by the U.S. Treasury Department (&#8220;Treasury&#8221;) (including proposed
        and temporary regulations),\n\nrulings, current administrative interpretations
        and official pronouncements of the IRS, and judicial decisions, all as currently
        in effect\n\nand all of which are subject to differing interpretations or
        to change, possibly with retroactive effect. No assurance can be given that\n\nthe
        IRS would not assert, or that a court would not sustain, a position contrary
        to any of the tax consequences described below. This\n\nsummary does not include
        any description of the tax laws of any state or local governments, or of any
        foreign government, that may be\n\napplicable to a particular holder.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">Although the Notes are issued by us, they will be
        treated\n\nas if they were issued by BAC for U.S. federal income tax purposes.
        Accordingly throughout this tax discussion, references to &#8220;we,&#8221;\n\n&#8220;our&#8221;
        or &#8220;us&#8221; are generally to BAC unless the context requires otherwise.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">This summary is directed solely to U.S. Holders and\n\nNon-U.S.
        Holders that, except as otherwise specifically noted, will purchase the Notes
        upon original issuance and will hold the Notes\n\nas capital assets within
        the meaning of Section 1221 of the Code, which generally means property held
        for investment, and that are not\n\nexcluded from the discussion under &#8220;U.S.
        Federal Income Tax Considerations&#8221; in the accompanying prospectus.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">You should consult your own tax advisor concerning
        the\n\nU.S. federal income tax consequences to you of acquiring, owning, and
        disposing of the Notes, as well as any tax consequences arising\n\nunder the
        laws of any state, local, foreign, or other tax jurisdiction and the possible
        effects of changes in U.S. federal or other tax\n\nlaws.</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\"><B>General</B></P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial,
        Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B;
        font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">Although there is
        no statutory, judicial, or administrative\n\nauthority directly addressing
        the characterization of the Notes, in the opinion of our counsel, Sidley Austin
        LLP, and based on certain\n\nfactual representations received from us, the
        Notes should be treated as single financial contracts with respect to the
        Underlying and\n\nunder the terms of the Notes, we and every investor in the
        Notes agree, in the absence of an administrative determination or judicial\n\nruling
        to the contrary, to treat the Notes in accordance with such characterization.
        This discussion assumes that the Notes constitute\n\nsingle financial contracts
        with respect to the Underlying for U.S. federal income tax purposes. If the
        Notes did not constitute single\n\nfinancial contracts, the tax consequences
        described below would be materially different.</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\"><I>This characterization of the Notes is not binding\n\non the IRS or
        the courts. No statutory, judicial, or administrative authority directly addresses
        the characterization of the Notes or\n\nany similar instruments for U.S. federal
        income tax purposes, and no ruling is being requested from the IRS with respect
        to their proper\n\ncharacterization and treatment. Due to the absence of authorities
        on point, significant aspects of the U.S. federal income tax consequences\n\nof
        an investment in the Notes are not certain, and no assurance can be given
        that the IRS or any court will agree with the characterization\n\nand tax
        treatment described in this pricing supplement. Accordingly, you are urged
        to consult your tax advisor regarding all aspects of\n\nthe U.S. federal income
        tax consequences of an investment in the Notes, including possible alternative
        characterizations.</I></P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt
        Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">Unless otherwise
        stated, the following discussion is\n\nbased on the characterization described
        above. The discussion in this section assumes that there is a significant
        possibility of a significant\n\nloss of principal on an investment in the
        Notes.</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">We will not attempt to
        ascertain whether any issuer\n\nof a component stock included in the Underlying
        would be treated as a &#8220;passive foreign investment company&#8221; (&#8220;PFIC&#8221;),\n\nwithin
        the meaning of Section 1297 of the Code, or a United States real property
        holding corporation, within the meaning of Section 897(c)\n\nof the Code.
        If the issuer of one or more stocks included in the Underlying were so treated,
        certain adverse U.S. federal income tax consequences\n\ncould possibly apply
        to a holder of the Notes. You should refer to information filed with the SEC
        by the issuers of the component stocks\n\nincluded in the Underlying and consult
        your tax advisor regarding the possible consequences to you, if any, if any
        issuer of a component\n\nstock included in the Underlying is or becomes a
        PFIC or is or becomes a United States real property holding corporation.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0; text-align: justify\"><B>U.S. Holders</B></P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">Upon receipt of a cash payment at maturity or upon
        a\n\nsale, exchange, or redemption of the Notes prior to maturity, a U.S.
        Holder generally will recognize capital gain or loss equal to the\n\ndifference
        between the amount realized and the U.S. Holder&#8217;s tax basis in the Notes.
        A U.S. Holder&#8217;s tax basis in the Notes\n\nwill equal the amount paid
        by that holder to acquire them. This capital gain or loss generally will be
        long-term capital gain or loss\n\nif the U.S. Holder held the Notes for more
        than one year. The deductibility of capital losses is subject to limitations.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0; text-align: justify\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\"><I>Alternative Tax Treatments.</I>
        Due to the absence\n\nof authorities that directly address the proper tax
        treatment of the Notes, prospective investors are urged to consult their tax
        advisors\n\nregarding all possible alternative tax treatments of an investment
        in the Notes. In particular, the IRS could seek to subject the Notes\n\nto
        the Treasury regulations governing contingent payment debt instruments. If
        the IRS were successful in that regard, the timing and character\n\nof income
        on the Notes would be affected significantly. Among other things, a U.S. Holder
        would be required to accrue original issue discount\n\nevery year at a &#8220;comparable
        yield&#8221; determined at the time of issuance. In addition, any gain realized
        by a U.S. Holder at\n\nmaturity or upon a</P>\n\n\n\n\n<!-- Field: Page; Sequence:
        17 --><div style=\"text-align:left;padding-left:15px; margin-top:15px;\"></div>\n
        \         <TABLE align=\"center\" CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"width:
        100%; font: 8pt Arial, Helvetica, Sans-Serif; border-collapse: collapse\">\n
        \             <TR STYLE=\"vertical-align: top\"><TD STYLE=\"width: 50%; text-align:
        left; vertical-align: middle\">\n                  <IMG SRC=\"image_footer.gif\"
        ALT=\"\" STYLE=\"width: 50px\">&nbsp;</TD><TD STYLE=\"width: 50%; text-align:
        right; vertical-align: middle\">\n                      AUTO-CALLABLE NOTES&nbsp;&nbsp;|&nbsp;&nbsp;PS-17</TD></TR>\n</TABLE><hr
        size='5' noshade width='100%' style='color:#000000;page-break-before: always;'>\n
        \         <DIV STYLE=\"page-break-before: always; margin-top: 6pt; margin-bottom:
        6pt\">\n              <P STYLE=\"font: 8pt Arial, Helvetica, Sans-Serif; border-bottom:
        Black 1pt solid; margin-bottom: 0;\n              color: rgb(147,149,152);
        margin-top: 9pt\">\n              Auto-Callable Notes Linked to the S&amp;P
        500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">sale, exchange,
        or redemption of the Notes generally\n\nwould be treated as ordinary income,
        and any loss realized at maturity or upon a sale, exchange, or redemption
        of the Notes generally\n\nwould be treated as ordinary loss to the extent
        of the U.S. Holder&#8217;s prior accruals of original issue discount, and
        as capital loss\n\nthereafter.</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">The IRS
        released Notice 2008-2 (the &#8220;Notice&#8221;),\n\nwhich sought comments
        from the public on the taxation of financial instruments currently taxed as
        &#8220;prepaid forward contracts.&#8221;\n\nThis Notice addresses instruments
        such as the Notes. According to the Notice, the IRS and Treasury are considering
        whether a holder of\n\nan instrument such as the Notes should be required
        to accrue ordinary income on a current basis, regardless of whether any payments
        are\n\nmade prior to maturity. It is not possible to determine what guidance
        the IRS and Treasury will ultimately issue, if any. Any such future\n\nguidance
        may affect the amount, timing and character of income, gain, or loss in respect
        of the Notes, possibly with retroactive effect.</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">The IRS and Treasury are also considering additional\n\nissues, including
        whether additional gain or loss from such instruments should be treated as
        ordinary or capital, whether foreign holders\n\nof such instruments should
        be subject to withholding tax on any deemed income accruals, whether Section
        1260 of the Code, concerning certain\n\n&#8220;constructive ownership transactions,&#8221;
        generally applies or should generally apply to such instruments, and whether
        any of\n\nthese determinations depend on the nature of the underlying asset.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">In addition, proposed Treasury regulations require
        the\n\naccrual of income on a current basis for contingent payments made under
        certain notional principal contracts. The preamble to the regulations\n\nstates
        that the &#8220;wait and see&#8221; method of accounting does not properly
        reflect the economic accrual of income on those contracts,\n\nand requires
        current accrual of income for some contracts already in existence. While the
        proposed regulations do not apply to prepaid\n\nforward contracts, the preamble
        to the proposed regulations expresses the view that similar timing issues
        exist in the case of prepaid\n\nforward contracts. If the IRS or Treasury
        publishes future guidance requiring current economic accrual for contingent
        payments on prepaid\n\nforward contracts, it is possible that you could be
        required to accrue income over the term of the Notes.</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0; text-align:
        justify\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial,
        Helvetica, Sans-Serif; margin: 0\">Because of the absence of authority regarding
        the appropriate\n\ntax characterization of the Notes, it is also possible
        that the IRS could seek to characterize the Notes in a manner that results
        in tax\n\nconsequences that are different from those described above. For
        example, the IRS could possibly assert that any gain or loss that a holder\n\nmay
        recognize at maturity or upon the sale, exchange, or redemption of the Notes
        should be treated as ordinary gain or loss.</P>\n\n\n\n<P STYLE=\"color: #59595B;
        font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0; text-align: justify\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">Because the Underlying is an index that periodically\n\nrebalances, it
        is possible that the Notes could be treated as a series of single financial
        contracts, each of which matures on the next\n\nrebalancing date. If the Notes
        were properly characterized in such a manner, a U.S. Holder would be treated
        as disposing of the Notes\n\non each rebalancing date in return for new Notes
        that mature on the next rebalancing date, and a U.S. Holder would accordingly
        likely\n\nrecognize capital gain or loss on each rebalancing date equal to
        the difference between the holder&#8217;s tax basis in the Notes (which\n\nwould
        be adjusted to take into account any prior recognition of gain or loss) and
        the fair market value of the Notes on such date.</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0; text-align:
        justify\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial,
        Helvetica, Sans-Serif; margin: 0\"><B>Non-U.S. Holders</B></P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">Except as discussed below, a Non-U.S. Holder generally\n\nwill not be
        subject to U.S. federal income or withholding tax for amounts paid in respect
        of the Notes provided that the Non-U.S. Holder\n\ncomplies with applicable
        certification requirements and that the payment is not effectively connected
        with the conduct by the Non-U.S.\n\nHolder of a U.S. trade or business. Notwithstanding
        the foregoing, gain from the sale, exchange, or redemption of the Notes or
        their settlement\n\nat maturity may be subject to U.S. federal income tax
        if that Non-U.S. Holder is a non-resident alien individual and is present
        in the\n\nU.S. for 183 days or more during the taxable year of the sale, exchange,
        redemption, or settlement and certain other conditions are satisfied.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">If a Non-U.S. Holder of the Notes is engaged in the\n\nconduct
        of a trade or business within the U.S. and if any gain realized on the settlement
        at maturity, or upon sale, exchange, or redemption\n\nof the Notes, is effectively
        connected with the conduct of such trade or business (and, if certain tax
        treaties apply, is attributable\n\nto a permanent establishment maintained
        by the Non-U.S. Holder in the U.S.), the Non-U.S. Holder, although exempt
        from U.S. federal withholding\n\ntax, generally will be subject to U.S. federal
        income tax on such gain on a net income basis in the same manner as if it
        were a U.S. Holder.\n\nSuch Non-U.S. Holders should read the material under
        the heading &#8220;&#8212;U.S. Holders,&#8221; for a description of the U.S.
        federal\n\nincome tax consequences of acquiring, owning, and disposing of
        the Notes. In addition, if such Non-U.S. Holder is a foreign corporation,\n\nit
        may also be subject to a branch profits tax equal to 30% (or such lower rate
        provided by any applicable tax treaty) of a portion of\n\nits earnings and
        profits for the taxable year that are effectively connected with its conduct
        of a trade or business in the U.S., subject\n\nto certain adjustments.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">A &#8220;dividend equivalent&#8221; payment is treated\n\nas
        a dividend from sources within the United States and such payments generally
        would be subject to a 30% U.S. withholding tax if paid\n\nto a Non-U.S. Holder.
        Under Treasury regulations, payments (including deemed payments) with respect
        to equity-linked instruments (&#8220;ELIs&#8221;)\n\nthat are &#8220;specified
        ELIs&#8221; may be treated as dividend equivalents if such specified ELIs
        reference an interest in an &#8220;underlying\n\nsecurity,&#8221; which is
        generally any interest in an entity taxable as a corporation for U.S. federal
        income tax purposes if a payment\n\nwith respect to such interest could give
        rise to a U.S. source dividend. However, IRS guidance provides that withholding
        on dividend equivalent\n\npayments will not apply to specified ELIs that are
        not delta-one instruments and that are issued before January 1, 2025. Based
        on our\n\ndetermination that the Notes are not delta-one instruments, Non-U.S.
        Holders should not be subject to withholding on dividend equivalent\n\npayments,
        if any, under the Notes. However, it is possible that the Notes could be treated
        as deemed reissued for U.S. federal income\n\ntax purposes upon the occurrence
        of certain events affecting the Underlying or the Notes, and following such
        occurrence the Notes could\n\nbe treated as subject to withholding on dividend
        equivalent payments. Non-U.S. Holders that enter, or have entered, into other
        transactions\n\nin respect of the Underlying or the Notes should consult their
        tax advisors as to the application of the dividend equivalent withholding\n\ntax
        in the context of the Notes and their other transactions. If any</P>\n\n\n\n\n<!--
        Field: Page; Sequence: 18 --><div style=\"text-align:left;padding-left:15px;
        margin-top:15px;\"></div>\n          <TABLE align=\"center\" CELLSPACING=\"0\"
        CELLPADDING=\"0\" STYLE=\"width: 100%; font: 8pt Arial, Helvetica, Sans-Serif;
        border-collapse: collapse\">\n              <TR STYLE=\"vertical-align: top\"><TD
        STYLE=\"width: 50%; text-align: left; vertical-align: middle\">\n                  <IMG
        SRC=\"image_footer.gif\" ALT=\"\" STYLE=\"width: 50px\">&nbsp;</TD><TD STYLE=\"width:
        50%; text-align: right; vertical-align: middle\">\n                      AUTO-CALLABLE
        NOTES&nbsp;&nbsp;|&nbsp;&nbsp;PS-18</TD></TR>\n</TABLE><hr size='5' noshade
        width='100%' style='color:#000000;page-break-before: always;'>\n          <DIV
        STYLE=\"page-break-before: always; margin-top: 6pt; margin-bottom: 6pt\">\n
        \             <P STYLE=\"font: 8pt Arial, Helvetica, Sans-Serif; border-bottom:
        Black 1pt solid; margin-bottom: 0;\n              color: rgb(147,149,152);
        margin-top: 9pt\">\n              Auto-Callable Notes Linked to the S&amp;P
        500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">payments
        are treated as dividend equivalents subject\n\nto withholding, we (or the
        applicable paying agent) would be entitled to withhold taxes without being
        required to pay any additional amounts\n\nwith respect to amounts so withheld.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">As discussed above, alternative characterizations
        of\n\nthe Notes for U.S. federal income tax purposes are possible. Should
        an alternative characterization, by reason of change or clarification\n\nof
        the law, by regulation or otherwise, cause payments as to the Notes to become
        subject to withholding tax, tax will be withheld at the\n\napplicable statutory
        rate. As discussed above, the IRS has indicated in the Notice that it is considering
        whether income in respect of\n\ninstruments such as the Notes should be subject
        to withholding tax. Prospective Non-U.S. Holders should consult their own
        tax advisors\n\nregarding the tax consequences of such alternative characterizations.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\"><I>U.S. Federal Estate Tax.</I> Under current law,
        while\n\nthe matter is not entirely clear, individual Non-U.S. Holders, and
        entities whose property is potentially includible in those individuals&#8217;\n\ngross
        estates for U.S. federal estate tax purposes (for example, a trust funded
        by such an individual and with respect to which the individual\n\nhas retained
        certain interests or powers), should note that, absent an applicable treaty
        benefit, a Note is likely to be treated as U.S.\n\nsitus property, subject
        to U.S. federal estate tax. These individuals and entities should consult
        their own tax advisors regarding the\n\nU.S. federal estate tax consequences
        of investing in a Note.</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt
        Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\"><B>Backup
        Withholding and Information Reporting</B></P>\n\n\n\n<P STYLE=\"color: #59595B;
        font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">Please see the discussion under &#8220;U.S. Federal\n\nIncome Tax Considerations
        &#8212; General &#8212; Backup Withholding and Information Reporting&#8221;
        in the accompanying prospectus for\n\na description of the applicability of
        the backup withholding and information reporting rules to payments made on
        the Notes.</P>\n\n\n\n\n\n\n<!-- Field: Page; Sequence: 19 --><div style=\"text-align:left;padding-left:15px;
        margin-top:15px;\"></div>\n          <TABLE align=\"center\" CELLSPACING=\"0\"
        CELLPADDING=\"0\" STYLE=\"width: 100%; font: 8pt Arial, Helvetica, Sans-Serif;
        border-collapse: collapse\">\n              <TR STYLE=\"vertical-align: top\"><TD
        STYLE=\"width: 50%; text-align: left; vertical-align: middle\">\n                  <IMG
        SRC=\"image_footer.gif\" ALT=\"\" STYLE=\"width: 50px\">&nbsp;</TD><TD STYLE=\"width:
        50%; text-align: right; vertical-align: middle\">\n                      AUTO-CALLABLE
        NOTES&nbsp;&nbsp;|&nbsp;&nbsp;PS-19</TD></TR>\n</TABLE><hr size='5' noshade
        width='100%' style='color:#000000;page-break-before: always;'>\n          <DIV
        STYLE=\"page-break-before: always; margin-top: 6pt; margin-bottom: 6pt\">\n
        \             <P STYLE=\"font: 8pt Arial, Helvetica, Sans-Serif; border-bottom:
        Black 1pt solid; margin-bottom: 0;\n              color: rgb(147,149,152);
        margin-top: 9pt\">\n              Auto-Callable Notes Linked to the S&amp;P
        500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n<P STYLE=\"font:
        17pt/21pt Arial, Helvetica, Sans-Serif; margin: 0 0 4pt\">Where You Can Find
        More Information</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial,
        Helvetica, Sans-Serif; margin: 0\">The terms and risks of the Notes are contained
        in this\n\npricing supplement and in the following related product supplement,
        prospectus supplement and prospectus, which can be accessed at the\n\nfollowing
        links:</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0; text-align: justify\">&nbsp;</P>\n\n\n\n\n<TABLE CELLPADDING=\"0\"
        CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color: #58595B; font: 8pt/10pt Arial,
        Helvetica, Sans-Serif; margin-top: 0; margin-bottom: 3pt\"><TR STYLE=\"vertical-align:
        top\">\n\n<TD STYLE=\"width: 0\"></TD><TD STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family:
        Arial, Helvetica, Sans-Serif; font-size: 5pt; color: #0080FF\">&#9679;</FONT></TD><TD><FONT
        STYLE=\"color: #59595B\">Product Supplement EQUITY-1 dated December 30, 2022:
        </FONT><br> <a href=\"http://www.sec.gov/Archives/edgar/data/1682472/000119312522315473/d429684d424b2.htm\">https://www.sec.gov/Archives/edgar/data/1682472/000119312522315473/d429684d424b2.htm</a></TD></TR></TABLE>\n\n\n\n<P
        STYLE=\"font: 10pt/10pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\" STYLE=\"color: #58595B;
        font: 8pt/10pt Arial, Helvetica, Sans-Serif; margin-top: 0; margin-bottom:
        3pt\"><TR STYLE=\"vertical-align: top\">\n\n<TD STYLE=\"width: 0\"></TD><TD
        STYLE=\"width: 0.25in\"><FONT STYLE=\"font-family: Arial, Helvetica, Sans-Serif;
        font-size: 5pt; color: #0080FF\">&#9679;</FONT></TD><TD><FONT STYLE=\"color:
        #59595B\">Series A MTN prospectus supplement dated December 30, 2022 and prospectus
        dated December 30, 2022: </FONT><br> <a href=\"http://www.sec.gov/Archives/edgar/data/1682472/000119312522315195/d409418d424b3.htm\">https://www.sec.gov/Archives/edgar/data/1682472/000119312522315195/d409418d424b3.htm</a></TD></TR></TABLE>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">This pricing supplement and the accompanying product\n\nsupplement,
        prospectus supplement and prospectus have been filed as part of a registration
        statement with the SEC, which may, without\n\ncost, be accessed on the SEC
        website at www.sec.gov or obtained from BofAS by calling 1-800-294-1322. Before
        you invest, you should read\n\nthis pricing supplement and the accompanying
        product supplement, prospectus supplement and prospectus for information about
        us, BAC and\n\nthis offering. Any prior or contemporaneous oral statements
        and any other written materials you may have received are superseded by this\n\npricing
        supplement and the accompanying product supplement, prospectus supplement
        and prospectus. Certain terms used but not defined in\n\nthis pricing supplement
        have the meanings set forth in the accompanying product supplement or prospectus
        supplement. Unless otherwise\n\nindicated or unless the context requires otherwise,
        all references in this document to &#8220;we,&#8221; &#8220;us,&#8221; &#8220;our,&#8221;\n\nor
        similar references are to BofA Finance, and not to BAC.</P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0; text-align:
        justify\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial,
        Helvetica, Sans-Serif; margin: 0\">The Notes are our senior debt securities.
        Any payments\n\non the Notes are fully and unconditionally guaranteed by BAC.
        The Notes and the related guarantee are not insured by the Federal Deposit\n\nInsurance
        Corporation or secured by collateral. The Notes will rank equally in right
        of payment with all of our other unsecured and unsubordinated\n\nobligations,
        except obligations that are subject to any priorities or preferences by law.
        The related guarantee will rank equally in right\n\nof payment with all of
        BAC&#8217;s other unsecured and unsubordinated obligations, except obligations
        that are subject to any priorities\n\nor preferences by law, and senior to
        its subordinated obligations. Any payments due on the Notes, including any
        repayment of the principal\n\namount, will be subject to the credit risk of
        BofA Finance, as issuer, and BAC, as guarantor.</P>\n\n\n\n\n\n\n\n\n<!--
        Field: Page; Sequence: 20 --><div style=\"text-align:left;padding-left:15px;
