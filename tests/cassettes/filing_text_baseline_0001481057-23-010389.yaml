        to the S&amp;P 500<sup>&reg;</sup> Index </P></DIV><!-- Field: /Page -->\n\n\n\n\n<P
        STYLE=\"font: 17pt/21pt Arial, Helvetica, Sans-Serif; margin: 0 0 4pt\">Terms
        of the Notes</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0; text-align: justify\">The Notes will be automatically\n\ncalled
        at an amount equal to the applicable Call Amount if the Observation Value
        of the Underlying on any Observation Date is greater\n\nthan or equal to its
        Call Value. No further amounts will be payable following an Automatic Call.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0; text-align: justify\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0; text-align: justify\">If
        your Notes are not automatically\n\ncalled prior to maturity and the Ending
        Value of the Underlying is greater than or equal to its Redemption Barrier,
        at maturity, you will\n\nreceive $1,246.00 per <FONT STYLE=\"color: #59595B\">$1,000
        </FONT>in principal amount of your Notes. However, if the Notes are not automatically\n\ncalled
        prior to maturity and the Ending Value of the Underlying is less than its
        Threshold Value, there is full exposure to declines in\n\nthe Underlying,
        and you will lose a significant portion or all of your investment in the Notes.
        Otherwise, at maturity you will receive\n\nthe principal amount. It is possible
        that the Notes will not be called, and you may lose a significant portion
        or all of your investment\n\nin the Notes at maturity. Any payments on the
        Notes will be calculated based on <FONT STYLE=\"color: #59595B\">$1,000 i</FONT>n
        principal\n\namount of Notes and will depend on the performance of the Underlying,
        subject to our and BAC&#8217;s credit risk.</P>\n\n\n\n<P STYLE=\"color: #59595B;
