        17pt/21pt Arial, Helvetica, Sans-Serif; margin: 0 0 4pt\">Hypothetical Payout
        Profile and Examples of Payments on the Notes</P>\n\n\n\n<P STYLE=\"color:
        red; font: 11pt/11pt Arial, Helvetica, Sans-Serif; margin: 0 0 4pt\"><B>Examples
        and Auto-Callable Notes Table</B></P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">The following examples
        and table are for purposes of\n\nillustration only. They are based on hypothetical
        values and show hypothetical returns on the Notes. The examples and table
        illustrate\n\npayments on the Notes based on a hypothetical Starting Value
        of 100, a hypothetical Call Value of 100, a hypothetical Redemption Barrier\n\nof
        100, a hypothetical Threshold Value of 90, Call Amounts as indicated on page
        PS-4, the Redemption Amount of $1,246.00 per $1,000 in\n\nprincipal amount
        of Notes if the Ending Value of the Underlying is greater than or equal to
        the Redemption Barrier and a range of hypothetical\n\nObservation Values and
        Ending Values of the Underlying. <B>The actual amount you receive and the
        resulting return will depend on the actual\n\nStarting Value, Call Value,
        Redemption Barrier, Threshold Value, Observation Value and Ending Value of
        the Underlying, whether the Notes\n\nare automatically called prior to maturity,
        and whether you hold the Notes to maturity. </B>The following examples do
        not take into account\n\nany tax consequences from investing in the Notes.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0; text-align: justify\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font:
        8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">For recent actual values
        of the Underlying, see &#8220;The\n\nUnderlying&#8221; section below. The
        Ending Value of the Underlying will not include any income generated by dividends
        or other distributions\n\npaid with respect to shares or units of the Underlying
        or on the securities included in the Underlying, as applicable. In addition,
        all\n\npayments on the Notes are subject to Issuer and Guarantor credit risk.</P>\n\n\n\n<P
        STYLE=\"font: 10pt/10pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\"><U>If the Notes Are Called on an Observation Date</U></P>\n\n\n\n<P STYLE=\"color:
        #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">The Notes will be called at an amount equal to the applicable\n\nCall
        Amount if on any Observation Date the Observation Value of the Underlying
        is greater than or equal to its Call Value. After the Notes\n\nare called,
        they will no longer remain outstanding and there will not be any further payments
        on the Notes.</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial,
        Helvetica, Sans-Serif; margin: 0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B;
        font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin: 0\">Example 1 - The Observation
        Value of the Underlying\n\non the first Observation Date is 112.00. Therefore,
        the Notes will be called at $1,082.00 per $1,000 in principal amount of Notes.</P>\n\n\n\n<P
        STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica, Sans-Serif; margin:
        0\">&nbsp;</P>\n\n\n\n<P STYLE=\"color: #59595B; font: 8pt/11pt Arial, Helvetica,
        Sans-Serif; margin: 0\">Example 2 - The Observation Value of the Underlying\n\non
