        arrangements BAC&#8217;s affiliates enter into. BAC&#8217;s internal funding
        rate is typically\n\nlower than the rate it would pay when it issues conventional
        fixed or floating rate debt securities. This difference in funding rate,\n\nas
        well as the underwriting discount, if any, the referral fee and the hedging
        related charges described below (see &#8220;Risk Factors&#8221;\n\nbeginning
