        style=\"margin-bottom:4pt;text-align:justify\"><span style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">ITEM 2.02.
        RESULTS OF OPERATIONS AND FINANCIAL CONDITION.</span></div><div style=\"text-align:justify\"><span
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">On
        August&#160;5, 2025, Gartner, Inc. (the &#8220;Company&#8221; or &#8220;Gartner&#8221;)
        announced financial results for the three months ended June&#160;30, 2025.
        A copy of the Company&#8217;s Press Release is furnished herein as Exhibit
        99.1.</span></div><div style=\"text-align:justify\"><span><br/></span></div><div
        style=\"text-align:justify\"><span style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">In accordance
        with General Instruction B.2 of Form 8-K, the information in this Item 2.02
        and in Exhibit 99.1 of this Current Report on Form 8-K shall not be deemed
        &#8220;filed&#8221; for purposes of Section 18 of the Securities Exchange
        Act of 1934, as amended (the &#8220;Exchange Act&#8221;), or otherwise subject
        to the liability of that section, and shall not be incorporated by reference
        into any registration statement or other document filed under the Securities
        Act of 1933, as amended (the &#8220;Securities Act&#8221;), or the Exchange
        Act, except as shall be expressly set forth by specific reference in such
        filing.</span></div><div><span><br/></span></div><div style=\"text-align:justify\"><span
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">ITEM
        7.01. REGULATION FD DISCLOSURES.</span></div><div style=\"text-align:justify\"><span><br/></span></div><div
        style=\"text-align:justify\"><span style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:700;line-height:120%;text-decoration:underline\">Financial
        Results</span></div><div style=\"text-align:justify\"><span><br/></span></div><div
        style=\"text-align:justify\"><span style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">Gartner
        has scheduled a webcast call at 8:00 a.m. Eastern time on Tuesday, August&#160;5,
        2025 to discuss the Company&#8217;s financial results for the second quarter
        of 2025. An earnings supplement will also be available via the Internet by
        accessing the Company&#8217;s website at https://investor.gartner.com. An
        audio replay of the webcast will also be available on the Company's website.</span></div><div
        style=\"text-align:justify\"><span><br/></span></div><div style=\"text-align:justify\"><span
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:700;line-height:120%;text-decoration:underline\">Share
        Repurchase Authorization</span></div><div><span><br/></span></div><div style=\"text-align:justify\"><span
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">On
        July 31, 2025, the Company&#8217;s Board of Directors authorized incremental
        share repurchases of up to an additional $700.0&#160;million of Gartner&#8217;s
        common stock. This authorization is in addition to the previously authorized
        repurchases of up to $5.3 billion, which, as of the end of July 2024, had
        approximately $350.0&#160;million remaining.</span></div><div><span><br/></span></div><div
        style=\"text-align:justify\"><span style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">Repurchases
        of common stock by the Company may be effected from time to time through open
        market purchases, trading plans established in accordance with the U.S. Securities
        and Exchange Commission&#8217;s rules, accelerated stock repurchases, private
        transactions or other means, depending on satisfactory market conditions,
        applicable legal requirements and other factors. The Company is not obligated
        to repurchase any particular amount of common stock, and share repurchases
        may be suspended at any time at the Company&#8217;s discretion.</span></div><div
        style=\"text-align:justify\"><span><br/></span></div><div style=\"text-align:justify\"><span
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">In
        accordance with General Instruction B.2 of Form 8-K, the information in this
        Item 7.01 of this Current Report on Form 8-K shall not be deemed &#8220;filed&#8221;
        for purposes of Section 18 of the Exchange Act, or otherwise subject to the
        liability of that section, and shall not be incorporated by reference into
        any registration statement or other document filed under the Securities Act
        or the Exchange Act, except as shall be expressly set forth by specific reference
        in such filing.</span></div><div style=\"text-align:justify\"><span><br/></span></div><div><span
