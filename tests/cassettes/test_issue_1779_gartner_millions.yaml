        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Statements
        contained in this press release regarding the Company&#8217;s growth and prospects,
        projected financial results, long-term objectives, and all other statements
        in this release other than recitation of historical facts are forward-looking
        statements within the meaning of Section 27A of the Securities Exchange Act
        of 1933, as amended, and Section 21E of the Securities Exchange Act of 1934,
        as amended. Such forward-looking statements involve known and unknown risks,
        estimates, uncertainties and other factors that may cause actual results to
        be materially different. Such factors include, but are not limited to, the
        following&#58; our ability to maintain and expand our products and services&#59;
        our ability to keep pace with technological developments in artificial intelligence
        (&#8220;AI&#8221;) and comply with evolving AI regulations&#59; our ability
        to achieve continued customer renewals and achieve new contract value, backlog
        and deferred revenue growth in light of competitive pressures&#59; our ability
        to grow or sustain revenue from individual customers&#59; our ability to expand
        or retain our customer base&#59; our ability to carry out our strategic initiatives
        and manage associated costs&#59; the timing of conferences and meetings, in
        particular our Gartner Symposium&#47;Xpo series that normally occurs during
        the fourth quarter&#59; our ability to achieve and effectively manage growth,
        including our ability to integrate our acquisitions and consummate and integrate
        future acquisitions&#59; our ability to attract and retain a professional
        staff of analysts and consultants as well as experienced sales personnel upon
        whom we are dependent, especially in light of labor competition&#59; our ability
        to successfully compete with existing competitors and potential new competitors&#59;
        our ability to enforce and protect our intellectual property rights&#59; the
        impact of cybersecurity incidents or other disruptions to our information
        systems&#59; our ability to pay our debt obligations&#59; the impact of global
        economic and geopolitical conditions, including inflation and recession&#59;
        uncertain effects, both direct and indirect, of changes and volatility in
        tariffs and trade policies&#59; risks associated with the creditworthiness,
        budget cuts, priorities and shutdown of governments and agencies&#59; additional
        risks associated with international operations, including foreign currency
        fluctuations&#59; the impact on our business resulting from changes in international
        conditions, including those resulting from the conflict in the Middle East,
        the war in Ukraine and current and future sanctions imposed by governments
        or other authorities&#59; the impact of restructuring and other charges on
        our businesses and operations&#59; our ability to meet sustainability commitments
        and comply with applicable regulatory requirements, as well as potential reactions
        by customers to these commitments&#59; the impact of changes in tax policy
        (including global minimum tax legislation) and heightened scrutiny from various
        taxing authorities globally&#59; changes to laws and regulations&#59; and
        other risks and uncertainties described under &#8220;Risk Factors&#8221; in
        our most recent Annual Report on Form 10-K, Quarterly Reports on Form 10-Q
        and Current Reports on Form 8-K, which can be found on Gartner&#8217;s website
        at https&#58;&#47;&#47;investor.gartner.com and the SEC&#8217;s website at
        www.sec.gov. Forward-looking statements included herein speak only as of the
        date hereof and Gartner disclaims any obligation to revise or update such
        statements to reflect events or circumstances after the date hereof or to
        reflect the occurrence of unanticipated events or circumstances, except as
        required by applicable law.</font></div><div style=\"height:42.75pt;position:relative;width:100%\"><div
