        style=\"margin-top:6pt;text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">NON-GAAP
        FINANCIAL MEASURES</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Certain
        financial measures used in this Press Release are not defined by U.S. generally
        accepted accounting principles (&#8220;GAAP&#8221;) and as such are considered
        non-GAAP financial measures. We provide these measures to enhance the user&#8217;s
        overall understanding of the Company&#8217;s current financial performance
        and the Company&#8217;s prospects for the future. Investors are cautioned
        that these non-GAAP financial measures may not be defined in the same manner
        by other companies and, as a result, may not be comparable to other similarly
        titled measures used by other companies. Also, these non-GAAP financial measures
        should not be construed as alternatives, or superior, to other measures determined
        in accordance with GAAP. The non-GAAP financial measures used in this Press
        Release are defined below. </font></div><div><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Adjusted
        EBITDA and Adjusted EBITDA Margin</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#58;
        Represents GAAP net income (loss) adjusted for&#58; (i) interest expense,
        net&#59; (ii) tax provision (benefit)&#59; (iii) gain on event cancellation
        insurance claims, as applicable&#59; (iv) other (income) expense, net&#59;
        (v) stock-based compensation expense&#59; (vi) depreciation, amortization,
        and accretion&#59; (vii) loss on impairment of lease related assets, as applicable&#59;
        and (viii) acquisition and integration charges and certain other non-recurring
        items. Adjusted EBITDA Margin represents Adjusted EBITDA divided by GAAP Revenue.
        We believe Adjusted EBITDA and Adjusted EBITDA Margin are important measures
        of our recurring operations as they exclude items not representative of our
        core operating results.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:112%\">Adjusted
        Net Income and Adjusted EPS</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">&#58;
        Represents GAAP net income (loss) and diluted net income (loss) per share
        adjusted for the impact of certain items directly related to acquisitions
        and other non-recurring items. These adjustments include (on a per share basis,
        in the case of Adjusted EPS)&#58; (i) the amortization of acquired intangibles*&#59;
        (ii) acquisition and integration charges and other non-recurring items&#59;
        (iii) gain on event cancellation insurance claims, as applicable&#59; (iv)
        loss on impairment of lease related assets, as applicable&#59; (v) the non-cash
        (gain) loss on de-designated interest rate swaps, as applicable&#59; and (vi)
        the related tax effect. We believe Adjusted Net Income and Adjusted EPS are
        important measures of our recurring operations as they exclude items that
        may not be indicative of our core operating results.  </font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"padding-left:18pt;text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">*
        The Company excludes amortization of acquired intangibles because it is generally
        a fixed non-cash expense that can be significantly impacted by the timing
        and&#47;or size of acquisitions and management does not use it to evaluate
        core operating results. Although the Company excludes the amortization of
        acquired intangibles from Adjusted Net Income and Adjusted EPS, management
        believes that it is important for investors to understand that such intangible
        assets were recorded as part of acquisition accounting and contribute to revenue
        generation.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Free
        Cash Flow</font><font style=\"background-color:#ffffff;color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#58;
        </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Represents
        cash provided by operating activities determined in accordance with GAAP less
        payments for capital expenditures. We believe Free Cash Flow is an important
        measure of the recurring cash generated by the Company&#8217;s core operations
        that may be available to be used to repay debt obligations, repurchase our
        stock, invest in future growth through new business development activities,
        or make acquisitions.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Foreign
        Currency Neutral (FX Neutral)</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#58;
        We provide foreign currency neutral dollar amounts and percentages for our
        contract values, revenues, certain expenses, and other metrics. These foreign
        currency neutral dollar amounts and percentages eliminate the effects of exchange
        rate fluctuations and thus provide a more accurate and meaningful trend in
        the underlying data being measured. We calculate foreign currency neutral
        dollar amounts by converting the underlying amounts in local currency for
        different periods into U.S. dollars by applying the same foreign exchange
        rates to all periods presented.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font><br></font></div><div
