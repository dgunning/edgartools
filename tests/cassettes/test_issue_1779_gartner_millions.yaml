        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">STAMFORD,
        Conn., August&#160;5, 2025 &#8212; Gartner, Inc. (NYSE&#58; IT) today reported
        results for the second quarter of 2025 and updated its financial outlook for
        the full year 2025. Additional information regarding the Company&#8217;s results
