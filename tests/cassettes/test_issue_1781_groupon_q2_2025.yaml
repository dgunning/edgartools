        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">
        </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">3%
