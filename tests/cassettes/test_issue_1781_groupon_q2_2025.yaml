        id=\"i52491dd8d5484c54af3808a5d46cadb0_1\"></div><div style=\"min-height:42.75pt;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div></div><div style=\"margin-bottom:12pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:14pt;font-weight:700;line-height:120%\">
        Groupon Reports Second Quarter 2025 Results</font></div><div style=\"margin-bottom:12pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Global
        Revenue up 1% and Billings up 12%</font></div><div style=\"margin-bottom:12pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">North
        America Local Revenue up 3% and Local Billings up 20%</font></div><div style=\"padding-left:18pt;padding-right:18pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Completion
        of $244 million Financing Transaction</font></div><div style=\"text-align:center\"><font><br></font></div><div
        style=\"padding-left:72pt;text-align:justify;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%;padding-left:13.8pt\">Global
        revenue of $125.7 million</font></div><div style=\"padding-left:72pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%;padding-left:13.8pt\">Global
        billings of $416.7 million</font></div><div style=\"padding-left:72pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%;padding-left:13.8pt\">Net
        income from continuing operations of $20.6 million</font></div><div style=\"padding-left:72pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%;padding-left:13.8pt\">Adjusted
        EBITDA of $15.6 million</font></div><div style=\"padding-left:72pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%;padding-left:13.8pt\">Exited
        Q2 with $262.6 million in cash </font></div><div style=\"padding-left:36pt\"><font><br></font></div><div
        style=\"margin-bottom:9pt;text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">CHICAGO
        - August&#160;6, 2025 - </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%;text-decoration:underline\">Groupon,
        Inc.</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        (NASDAQ&#58; GRPN) today announced its financial results for the second quarter
        ended June 30, 2025. The company filed its Form 10-Q with the Securities and
        Exchange Commission and posted updated earning commentary on its investor
        relations website (investor.groupon.com).</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">&#34;Our
        Q2 results demonstrate that Groupon's transformation is gaining real momentum,
        with 20% Billings growth in North America Local and accelerating customer
        acquisition across our core local category,&#34;</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        said Dusan Senkypl, CEO of Groupon. </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">&#34;We're
        building a trusted destination for quality local experiences at unbeatable
        value. While we're still in the early innings of this opportunity, our marketplace
        health and platform velocity have established a clear pathway to sustained
        growth.&#34;</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">Second
        Quarter 2025 Summary</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">All
        comparisons in this press release are year-over-year unless otherwise noted.</font></div><div
        style=\"margin-bottom:9pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%;text-decoration:underline\">Consolidated</font></div><div
        style=\"margin-bottom:6pt;padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%;padding-left:13.8pt\">Revenue
        was $125.7 million in the second quarter 2025, up 1% (down</font><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\"> </font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%\">0.1%
        FX-neutral) compared with the prior year period. Local revenue was $116.7
        million in the second quarter 2025, up 2% (1% FX-neutral) compared with the
        prior year period. </font></div><div style=\"margin-bottom:6pt;padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%;padding-left:13.8pt\">Gross
        billings were $416.7 million in the second quarter 2025, up 12% (10% FX-neutral)
        compared with the prior year period. </font></div><div style=\"margin-bottom:6pt;padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%;padding-left:13.8pt\">Unit
        sales were 9.1 million in the second quarter 2025, up 7% sequentially and
        up 6% compared with the prior year period.</font></div><div style=\"margin-bottom:6pt;padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%;padding-left:13.8pt\">Active
        customers were 15.8 million as of June 30, 2025, up 2% sequentially and consistent
        with the prior year period.</font></div><div style=\"margin-bottom:6pt;padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:112%;padding-left:13.8pt\">Gross
        profit was $114.4 million in the second quarter 2025, up</font><font style=\"color:#000000;font-family:'Times
