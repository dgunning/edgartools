        along with our withdrawal from the Italian market, which had a smaller impact.
        Excluding Giftcloud and Italy, International Local revenue increased 7%.</font></div><div
        style=\"margin-bottom:6pt;padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%;padding-left:13.8pt\">International
