        style=\"page-break-after:always\"><div style=\"min-height:42.75pt;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div></div><div style=\"margin-bottom:12pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">Completion
        of $244 Million Financing Transaction</font></div><div><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">On
        July 2, 2025, the Company issued $244 million aggregate principal amount of
        the 2030 Notes consisting of (i) $20 million aggregate principal amount of
        2030 Notes issued in exchange for $20 million aggregate principal amount of
        the Company&#8217;s outstanding 2026 Notes and (ii) $224 million aggregate
        principal amount of 2030 Notes issued in exchange for $150 million aggregate
        principal amount of the Company&#8217;s outstanding 2027 Notes with a limited
        number of 2030 Notes Offering Participants.</font></div><div><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">The
        2030 Notes are senior, unsecured obligations of the Company and accrue interest
        at a rate of 4.875% per annum, payable semi-annually in arrears on each June
        30 and December 30, commencing December 30, 2025, and will mature on June
        30, 2030, unless earlier converted, redeemed or repurchased. </font></div><div><font><br></font></div><div><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">The
        Company issued a separate press release and filed an 8-K with the Securities
        and Exchange Commission with more details on the terms of the transaction.</font></div><div
        style=\"text-indent:36pt\"><font><br></font></div><div><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">Changes
        to the Groupon Leadership Team</font></div><div><font><br></font></div><div><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Effective
        September 1, 2025, Jiri Ponrt will assume the role of Chief Operating Officer
        (COO), and Rana Kashyap will become the Company&#8217;s next Chief Financial
        Officer (CFO).</font></div><div><font><br></font></div><div><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#34;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Jiri
        and Rana both joined Groupon during a pivotal time for the business in early
        2023. Since then, they&#8217;ve played critical roles in advancing the Company&#8217;s
        transformation and forged a close partnership,</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#34;
        said Dusan Senkypl, CEO of Groupon. &#34;</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Jiri
        has been a key architect of the Company&#8217;s transformation&#8212;restructuring
        our cost base, improving its capital position, and instilling operational
        rigor. Beyond Finance, he leads the Company&#8217;s Legal, HR, and Finance
        Engineering teams, earning broad trust throughout our organization. Rana has
        led high-impact initiatives that created significant shareholder value, improved
        the Company&#8217;s commercial go to market motion, and strengthened our strategic
        positioning in the marketplace. He has a great understanding of our business
        drivers, a strategic lens to capital allocation, and a deep belief in our
        mission. Rana has earned the trust of our board, our investors, and our teams
        and is more than ready to step into the CFO role.</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#34;</font></div><div><font><br></font></div><div><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Jiri
        Ponrt joined Groupon from Pale Fire Capital and has served as the Company&#8217;s
        CFO since April 2023. Rana Kashyap joined Groupon from RPD Fund Management
        and currently serves as SVP, Finance leading FP&#38;A, Treasury, Investor
        Relations, and Corporate Development &#38; Strategy.</font></div><div><font><br></font></div><div
        style=\"height:42.75pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:42.75pt;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div></div><div style=\"margin-bottom:9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">Outlook</font></div><div
        style=\"margin-bottom:9pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">For
        information about our guidance, refer to our earnings commentary that is posted
        on our investor relations website (</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%;text-decoration:underline\">investor.groupon.com</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">).</font></div><div
        style=\"margin-bottom:9pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">Conference
        Call</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">A
        conference call will be webcast Thursday, August&#160;7, 2025 at 7&#58;00
        a.m. CT &#47; 8&#58;00 a.m. ET and will be available on Groupon&#8217;s investor
        relations website at https&#58;&#47;&#47;investor.groupon.com. This call will
        contain forward-looking statements and other material information regarding
        our financial and operating results.</font></div><div style=\"margin-bottom:12pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Groupon
        encourages investors to use its investor relations website as a way of easily
        finding information about the company. Groupon promptly makes available on
        this website, free of charge, the reports that the company files or furnishes
        with the SEC, corporate governance information (including Groupon&#8217;s
        Global Code of Conduct), and select press releases and social media postings.
        Groupon uses its investor relations website (</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%;text-decoration:underline\">investor.groupon.com</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">)
        as a means of disclosing material non-public information and for complying
        with its disclosure obligations under Regulation FD.</font></div><div style=\"margin-bottom:9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">Non-GAAP
        Financial Measures and Operating Metrics</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">In
        addition to financial results reported in accordance with U.S. GAAP, we have
        provided the following non-GAAP financial measures&#58; Foreign currency exchange
        rate neutral operating results, Adjusted EBITDA, and free cash flow. These
        non-GAAP financial measures, which are presented on a continuing operations
        basis, are intended to aid investors in better understanding our current financial
        performance and prospects for the future as seen through the eyes of management.
        We believe that these non-GAAP financial measures facilitate comparisons with
        our historical results and with the results of peer companies who present
        similar measures (although other companies may define non-GAAP measures differently
        than we define them, even when similar terms are used to identify such measures).
        However, these non-GAAP financial measures are not intended to be a substitute
        for those reported in accordance with U.S. GAAP. For reconciliations of these
        measures to the most applicable financial measures under U.S. GAAP, see &#34;Non-GAAP
        Reconciliation Schedules&#34; and &#34;Supplemental Financial and Operating
        Metrics&#34; included in the tables accompanying this release.</font></div><div
        style=\"margin-bottom:9pt;text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">We
        exclude the following items from one or more of our non-GAAP financial measures&#58;</font></div><div
        style=\"margin-bottom:9pt;text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Stock-based
        compensation.</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        We exclude stock-based compensation because it is primarily non-cash in nature
        and we believe that non-GAAP financial measures excluding this item provide
        meaningful supplemental information about our operating performance and liquidity.</font></div><div
        style=\"margin-bottom:9pt;text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Depreciation
        and amortization.</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        We exclude depreciation and amortization expenses because they are non-cash
        in nature and we believe that non-GAAP financial measures excluding these
        items provide meaningful supplemental information about our operating performance
        and liquidity.</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Interest
        and other non-operating items. </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Interest
        and other non-operating items include&#58; foreign currency gains and losses,
        loss on extinguishment of exchanged debt, interest income and interest expense.
        We exclude interest and other non-operating items from certain of our non-GAAP
        financial measures because we believe that excluding these items provides
        meaningful </font></div><div style=\"height:42.75pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:42.75pt;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">supplemental
        information about our core operating performance and facilitates comparisons
        to our historical operating results.</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Special
        charges and credits. </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">We
        exclude special charges and credits included charges related to our Italy
        Restructuring Plan, 2022 Restructuring Plan and 2020 Restructuring Plan, as
        well as gain on sale of assets, gain on sale of business and foreign VAT assessments.
        We exclude special charges and credits from Adjusted EBITDA because we believe
        that excluding those items provides meaningful supplemental information about
        our core operating performance and facilitates comparisons with our historical
        results. For the Foreign VAT assessments, we also considered the fact that
        we ceased operations in Portugal in 2016 and it is not part of our ongoing
        business. We have not engaged in any revenue-generating or payroll-related
        activity in Portugal since ceasing those operations nor do we intend to engage
        in these activities in that jurisdiction in the future.</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Descriptions
        of the non-GAAP financial measures included in this release and the accompanying
        tables are as follows&#58;</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Foreign
        currency exchange rate neutral operating results</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        show current period operating results as if foreign currency exchange rates
        had remained the same as those in effect in the prior year period. Those measures
        are intended to facilitate comparisons to our historical performance. </font></div><div
        style=\"margin-bottom:12pt;text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Contribution
        Profit</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        is financial measure and our measure of segment profitability, defined as
        net revenues less cost of sales and marketing expense.</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Adjusted
        EBITDA</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        is a non-GAAP performance measure that we define as Net income (loss) from
        continuing operations excluding income taxes, interest and other non-operating
        items, depreciation and amortization, stock-based compensation and other special
        charges and credits, including items that are unusual in nature or infrequently
        occurring. Our definition of Adjusted EBITDA may differ from similar measures
        used by other companies, even when similar terms are used to identify such
        measures. Adjusted EBITDA is a key measure used by our management and Board
        to evaluate operating performance, generate future operating plans and make
        strategic decisions. Accordingly, we believe that Adjusted EBITDA provides
        useful information to investors and others in understanding and evaluating
        our operating results in the same manner as our management and Board. However,
        Adjusted EBITDA is not intended to be a substitute for Net income (loss) from
        continuing operations.</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Free
        cash flow</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        is a non-GAAP liquidity measure that comprises net cash provided by operating
        activities from continuing operations less purchases of property and equipment
        and capitalized software. We use free cash flow to conduct and evaluate our
        business because, although it is similar to cash flow from continuing operations,
        we believe that it typically represents a more useful measure of cash flows
        because purchases of fixed assets, software developed for internal use and
        website development costs are necessary components of our ongoing operations.
        Free cash flow is not intended to represent the total increase or decrease
        in our cash balance for the applicable period.</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Descriptions
        of the operating metrics included in this release and the accompanying tables
        are as follows&#58;</font></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Gross
        billings</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        is the total dollar value of customer purchases of goods and services. Gross
        billings is presented net of customer refunds, order discounts and sales and
        related taxes. The substantial majority of our revenue transactions are comprised
        of sales of vouchers and similar transactions in which we collect the transaction
        price from the customer and remit a portion of </font></div><div style=\"height:42.75pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:42.75pt;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div></div><div style=\"margin-bottom:9pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">the
        transaction price to the third-party merchant who will provide the related
        goods or services. For these transactions, gross billings differs from Revenue
        reported in our Condensed Consolidated Statements of Operations, which is
        presented net of the merchant's share of the transaction price. Gross billings
        is an indicator of our growth and business performance as it measures the
        dollar volume of transactions generated through our marketplaces. Tracking
        gross billings also allows us to monitor the percentage of gross billings
        that we are able to retain after payments to merchants. </font></div><div><font><br></font></div><div
        style=\"margin-bottom:9pt;text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Active
        customers</font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        are unique user accounts that have made a purchase during the TTM either through
        one of our online marketplaces or directly with a merchant for which we earned
        a commission. We consider this metric to be an important indicator of our
        business performance as it helps us to understand how the number of customers
        actively purchasing our offerings is trending. Some customers could establish
        and make purchases from more than one account, so it is possible that our
        active customer metric may count certain customers more than once in a given
        period. We do not include consumers who solely make purchases with retailers
        using digital coupons accessed through our websites or mobile applications
        in our active customer metric, nor do we include consumers who solely make
        purchases of our inventory through third-party marketplaces with which we
        partner.</font></div><div style=\"margin-bottom:12pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:120%\">Units
        </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">are
        the number of purchases during the reporting period, before refunds and cancellations,
        made either through one of our online marketplaces, a third-party marketplace,
        or directly with a merchant for which we earn a commission. We do not include
        purchases with retailers using digital coupons accessed through our websites
        or mobile applications in our units metric. We consider units to be an important
        indicator of the total volume of business conducted through our marketplaces.
        </font></div><div style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:12pt;font-style:italic;font-weight:400;line-height:107%\">We
        do not provide a reconciliation for non-GAAP estimates on a forward-looking
        basis where we are unable to provide a meaningful calculation or estimation
        of reconciling items and the information is not available without unreasonable
        effort. This is due to the inherent difficulty of forecasting the timing or
        amount of various items that would impact the most directly comparable forward-looking
        U.S. GAAP financial measure that have not yet occurred, are out of the Company&#8217;s
        control and&#47;or cannot be reasonably predicted. Forward-looking non-GAAP
        financial measures provided without the most directly comparable U.S. GAAP
        financial measures may vary materially from the corresponding U.S. GAAP financial
        measures.</font></div><div><font><br></font></div><div style=\"margin-bottom:9pt\"><font><br></font></div><div
