        X2</txNMSStockATSName>\n      <rbOperatesPursuantToFormATS>Y</rbOperatesPursuantToFormATS>\n
        \     <taStatementAboutAmendment>This Updating Amendment revises the responses
        to (1) Part 1, Item 8, by providing an updated copy of Schedule A to the Form
        BD of Goldman Sachs &amp; Co. LLC (GSCO), the Broker-Dealer Operator of Sigma
        X2, reflecting the addition of a Co-Principal Operations Officer, and (2)
        Part II, Item 7.d (Protection of Confidential Trading Information), to remove
        references to employee roles that had access to confidential trading information
        because such roles no longer exist.  The changes noted in (1), above, apply
        solely to GSCO, the Broker-Dealer Operator of Sigma X2.  The changes noted
        in (2), above, apply to GSCO and all Subscribers.</taStatementAboutAmendment>\n
        \   </cover>\n    <partOne>\n      <rbPart1Item1IsBd>Y</rbPart1Item1IsBd>\n
        \     <txPart1Item2ATSName>GOLDMAN SACHS &amp; CO. LLC</txPart1Item2ATSName>\n
        \     <atsNames>\n        <atsName txPart1Item3ATSName=\"SIGMA X2\"/>\n      </atsNames>\n
        \     <txPart1Item4aBdFileNumber>008-00129</txPart1Item4aBdFileNumber>\n      <txPart1Item4aBdCrdNumber>000000361</txPart1Item4aBdCrdNumber>\n
        \     <txPart1Item5aNsaFullName>FINRA</txPart1Item5aNsaFullName>\n      <part1Item5bEffectiveMembershipDate>10/26/1936</part1Item5bEffectiveMembershipDate>\n
        \     <txtPart1Item5cNmsStockMPID>SGMT</txtPart1Item5cNmsStockMPID>\n      <txtPart1Item6uwebsite>https://www.goldmansachs.com/what-we-do/securities/gset-equities.html</txtPart1Item6uwebsite>\n
        \     <part1Item7PrimarySite>\n        <ats:street1>Equinix NY4 data center</ats:street1>\n
        \       <ats:street2>755 Secaucus Rd</ats:street2>\n        <ats:city>Secaucus</ats:city>\n
        \       <ats:zip>07094</ats:zip>\n        <ats:state>US-NJ</ats:state>\n      </part1Item7PrimarySite>\n
        \     <part1Item7SecondarySiteRecords>\n        <secondarySiteI7>\n          <ats:street1>CH4
        - 350 E. Cermak Rd</ats:street1>\n          <ats:city>Chicago</ats:city>\n
        \         <ats:zip>60616</ats:zip>\n          <ats:state>US-IL</ats:state>\n
        \       </secondarySiteI7>\n      </part1Item7SecondarySiteRecords>\n      <cbPart1Item8Exhibit1atWebsite>false</cbPart1Item8Exhibit1atWebsite>\n
        \     <cbPart1Item9Exhibit2atWebsite>false</cbPart1Item9Exhibit2atWebsite>\n
        \   </partOne>\n    <partTwo>\n      <part2Item1aArePermittedToEnterInterest
        rbPart2Item1aArePermittedToEnterInterest=\"Y\">\n        <taPart2Item1aUnitNamesEnterInterest>Yes.
        GSCO is a leading global investment banking, securities and investment management
        firm that provides a wide range of financial services to a substantial and
        diversified client base that includes corporations, financial institutions,
        governments and individuals. As such, GSCO has a number of business units
        that engage in various securities trading activities that may enter and/or
        direct the entry of orders to Sigma X2 using limit or Peg order types, and
        using GSCO systems that include GSCO order handling algorithms, smart order
        routing, or directed orders. Sigma X2 accepts Firm orders, Conditional orders,
        and Firm Up orders associated with Conditional orders (\"Firm and Conditional
        orders\" unless otherwise specified) as further described in Part III, Item
        7 (Order Types and Attributes) and Item 9 (Conditional Orders and Indications
        of Interest). The system does not accept any other form of trading interest.
        Set forth below are the GSCO business units that are responsible for facilitating
        GSCO's trading activities on Sigma X2 in an agency or principal capacity:\n\nSALES
        TRADING &amp; GSET:  The Goldman Sachs Electronic Trading (\"GSET\") business
        unit and the Sales Trading business unit provide execution services to high-touch
        (Sales Trading) and low-touch (GSET) clients in single stock, derivatives,
        program trades, or synthetics/ETFs. Sales Trading personnel may facilitate
        the routing of orders to internal GS trading desks or to various listed exchanges
        and/or liquidity pools, which can include order routing to Sigma X2 for execution.
        GSET provides clients with access to algorithmic strategies and systems the
        clients can use to route orders to various listed exchanges and/or liquidity
        pools, which can include order routing to Sigma X2 for execution. These business
        units can send orders to Sigma X2 in an agency capacity under the MPIDs GSCO
        and GSCS.\nEQUITIES MACRO ONE DELTA - AMERICAS: This GSCO business unit engages
        in market making-related activities in cash equities and exchange-traded (\"listed\")
        and over-the-counter (\"OTC\") equity derivatives of various forms, and hedges
        the risk associated with this activity. Equity Macro One Delta activities
        include block positioning, exchange market making, creation and redemption
        of ETFs and corresponding equity underlier baskets, and OTC facilitation of
        client, customer, and counterparty transactions in equities products. This
        business unit sends orders to Sigma X2 in agency and principal capacities
        under the MPID GSCO.\nEQUITIES MICRO ONE DELTA - AMERICAS: This GSCO business
        unit engages in market making-related activities in equities single stock
        securities and products and hedges the risks associated with those activities.
        The activities of this business unit include block positioning, effecting
        transactions on exchanges, and OTC facilitation of client, customer, and counterparty
        transactions in single stock equities products. This business unit sends orders
        to Sigma X2 in agency and principal capacities under the MPID GSCO.\nEQUITIES
        MACRO DERIVATIVES - AMERICAS:  This GSCO business unit engages in market making
        and market making-related activities in index based listed/exchange-traded
        and OTC index equity derivatives, and performs hedging of corresponding risk
        associated with those activities. The activities of this business unit include
        agency execution of exchange-traded derivative securities, as well as listed
        and OTC facilitation of client, customer, and counterparty derivatives transactions.
        This business unit sends orders to Sigma X2 in agency and principal capacities
        under the MPID GSCO.\nEQUITIES MICRO DERIVATIVES - AMERICAS: This GSCO business
        unit engages in market making and market making-related activities in single
        stock listed/exchange-traded derivative securities and OTC instruments (e.g.,
        convertibles and derivatives), and hedges the risk associated with those activities.
        Equity Micro Derivatives activities include agency execution of single stock
        exchange traded derivative securities, as well as listed and OTC facilitation
        of client, customer, and counterparty derivatives transactions. This business
        unit sends orders to Sigma X2 in agency  and principal capacities under the
        MPID GSCO.\nEQUITIES - STRUCTURED PRODUCTS AND WORLD EXOTICS: This GSCO business
        unit engages in market-making and related activities that includes activities
        in listed, OTC, securitized derivatives on securities and cross-asset derivatives
        (i.e., a derivative involving a combination of equity, foreign exchange, interest
        rates, credit and/or commodities called \"hybrids\"). This business unit sends
        orders to Sigma X2 in a principal capacity under the MPID GSCO.\nCREDIT -
        US INDEX TRADING:  The GSCO business within Global Credit engages in market
        making-related activities in credit index products, including credit ETFs,
        and hedges the risks associated with these activities. These activities include
        market making, OTC facilitation of client, customer and counterparty transactions,
        and transactions executed on various electronic trading platforms (e.g., Bloomberg,
        MarketAxess, Trade Web) in the United States. This business unit sends orders
        to Sigma X2 in a principal capacity under the MPID GSCO.\nIn addition to the
        above referenced business units, the Equities Delta Hedging Facility (\"EDHF\"),
        is the Firm's automated hedging tool used to manage its equities-related principal
        risk positions. As part of the Firm's process for managing principal risk,
        various above-described business units within GSCO's equities business may
        send principal equities orders to EDHF. EDHF then uses the GSCO algorithms
        and smart order router (SOR) to manage the Firm's risk position. Such orders
        can be routed to Sigma X2 in a principal capacity under the MPID GSCO. The
        profits and losses associated with such hedging are allocated back to the
        above-described equities businesses. The EDHF tool operates within the Equities
        Macro One Delta - Americas business unit.</taPart2Item1aUnitNamesEnterInterest>\n
        \       <rbPart2Item1bAreSevicesSametoAllSubscribers>Y</rbPart2Item1bAreSevicesSametoAllSubscribers>\n
        \       <rbPart2Item1cAreThereArrangements>N</rbPart2Item1cAreThereArrangements>\n
        \     </part2Item1aArePermittedToEnterInterest>\n      <rbPart2Item1dCanOATInterestBeRouted>N</rbPart2Item1dCanOATInterestBeRouted>\n
        \     <affiliatesPermittedToEnterInterest rbPart2Item2aAreAfflPermittedToEnterInterest=\"Y\">\n
        \       <taPart2Item2aAfflThatEnterInterest>GSCO has a number of affiliate
        organizations that are classified as Broker-Dealers and Investment Advisors
        (domestic and foreign) that engage in various securities trading activities.
        Currently however, only Goldman Sachs International (\"GSI\"), a foreign affiliate
        that is not registered in the U.S., is entitled to send Firm and Conditional
        orders to GSCO in a principal or agency capacity, which, where warranted,
        may be entered or directed to Sigma X2 by GSCO using GSCO's algorithms or
        the GSCO SOR. These orders have GSCO's MPID attached to them.\n\nPlease note
        that while GSCO's affiliate Goldman Sachs Asset Management, L.P. (\"GSAM\"),
        a U.S. registered entity, routinely interacts and routes orders to GSCO to
        facilitate trade execution, GSAM is not permitted to enter or direct the entry
        of orders to Sigma X2.</taPart2Item2aAfflThatEnterInterest>\n        <rbPart2Item2bAreSevicestoAfflSametoSubscribers>Y</rbPart2Item2bAreSevicestoAfflSametoSubscribers>\n
        \       <rbPart2Item2cAreThereArrangementsWithAffl>N</rbPart2Item2cAreThereArrangementsWithAffl>\n
        \     </affiliatesPermittedToEnterInterest>\n      <rbPart2Item2dCanOATIBeRoutedByAffl>N</rbPart2Item2dCanOATIBeRoutedByAffl>\n
        \     <part2Item3aCanSubscrOptOutWithOATIOfBD rbPart2Item3aCanSubscrOptOutWithOATIOfBD=\"Y\">\n
        \       <taPart2Item3aExplianOptOut>Direct Subscribers and Indirect Subscribers
        (defined in Part II, Item 5.a.) also are referred to herein collectively as
        \"Participants.\"  Participants can restrict interactions with GSCO Firm and
        Conditional principal orders for any reason (e.g., where required pursuant
        to Section 28(e) of the Exchange Act) by using the \"Agency Only Execution\"
        condition (See Part III, Item 11.c.). This restriction is applied at the Participant-level.
        The manner in which Participants can opt-out of interacting with GSCO principal
        flow is described in Part III, Item 11.c.</taPart2Item3aExplianOptOut>\n      </part2Item3aCanSubscrOptOutWithOATIOfBD>\n
        \     <rbPart2Item3aCanSubscrOptOutWithOATIOfAffl>N</rbPart2Item3aCanSubscrOptOutWithOATIOfAffl>\n
        \     <rbPart2Item3cAreOptOutSametoAllSubscribers>Y</rbPart2Item3cAreOptOutSametoAllSubscribers>\n
        \     <part2Item4aAreThereArrangementsBtwBDAndTC rbPart2Item4aAreThereArrangementsBtwBDAndTC=\"Y\">\n
        \       <taPart2Item4aTDAndATSServices>GSCO has mutual access agreements with
        Barclays; Deutsche Bank; JPMorgan; Liquidnet; Merrill, Lynch, Pierce, Fenner
        &amp; Smith Incorporated; Morgan Stanley; and UBS. These agreements govern
        how such parties can access Sigma X2 to transmit orders, and how GSCO can
        do the same relative to such Trading Centers. The agreements do not provide
        for any compensation, nor do they obligate any party to transmit orders to,
        or accept orders from, another. To the extent that any of these Trading Centers
        determine to route orders to Sigma X2, the terms and conditions to access
        Sigma X2 are the same as the terms and conditions applicable to other Participants
        and there is no difference in treatment with respect to the services.</taPart2Item4aTDAndATSServices>\n
        \       <rbPart2Item4bAreThereArrangementsBtwAfflAndTC>N</rbPart2Item4bAreThereArrangementsBtwAfflAndTC>\n
        \     </part2Item4aAreThereArrangementsBtwBDAndTC>\n      <part2Item5aDoesOfferProductsAndServices
        rbPart2Item5aDoesOfferProductsAndServices=\"Y\">\n        <taPart2Item5aProductsAndServices>Subscribers
        can access Sigma X2 directly (\"Direct Subscribers\") or indirectly (\"Indirect
        Subscribers\"), and all Subscribers can utilize both ATS and non-ATS GSCO
        offered products and services.\n\nDirect Subscribers access Firm and Conditional
        order types at Sigma X2 via a FIX connection. Indirect Subscribers access
        Firm and Conditional order types at Sigma X2 via non-ATS GSCO offered products
        and services, which may include:\n\ni. GSCO algorithms, which accept parent-level
        orders and can send portions of such orders (i.e., child orders) to GSCO's
        SOR. GSCO's SOR may route such orders to Sigma X2 or other market centers,
        as described below;\n\nii. The GSCO SOR (hosted in Carteret and NY4), which
        can route various orders to Sigma X2 or other market centers or may route
        directed orders to Sigma X2; and\n\niii. The GSCO Direct Market Access (\"DMA\")
        System, which GSCO clients may use to direct orders to Sigma X2 or other market
        centers using their own algorithms, i.e., non-GSCO algorithms. Orders routed
        via the GSCO DMA System do not pass through, and are not known by, GSCO's
        SOR.\n\nDirect Subscribers' Firm and Conditional orders experience less latency
        than Indirect Subscribers' orders.\n\nSigma X2 does not display orders to
        Participants, or outside of Sigma X2. However, GSCO's SOR is aware of orders
        it has posted in all venues, including Sigma X2. The GSCO SOR uses knowledge
        of Firm orders to predict venue-level fill rates. This data is not communicated
        outside of the SOR.</taPart2Item5aProductsAndServices>\n        <rbPart2Item5bAreSevicesSametoAllSubscribersAndBD>Y</rbPart2Item5bAreSevicesSametoAllSubscribersAndBD>\n
        \     </part2Item5aDoesOfferProductsAndServices>\n      <part2Item5cDoesAfflOfferProductsAndServices
        rbPart2Item5cDoesAfflOfferProductsAndServices=\"Y\">\n        <taPart2Item5cAfflProvidedProductsAndServices>Neither
        GSI nor its clients can access Sigma X2 directly (i.e., they are not Direct
        Subscribers as defined in Part II, Item 5.a.). GSI offers sales and trading
        services to its clients that include the ability to send orders in NMS Stocks
        to GSCO, which, through the use of a GSCO algorithm or the GSCO SOR, may be
        routed to Sigma X2.</taPart2Item5cAfflProvidedProductsAndServices>\n        <rbPart2Item5dAreTCOfSevicesSametoAll>Y</rbPart2Item5dAreTCOfSevicesSametoAll>\n
        \     </part2Item5cDoesAfflOfferProductsAndServices>\n      <part2Item6aDoesEmployeeAccessConfidentialInfo
        rbPart2Item6aDoesEmployeeAccessConfidentialInfo=\"Y\">\n        <taPart2Item6aUnitAfflEmployeeServices>GSCO
        does not have any employees solely responsible for Sigma X2. Certain GSCO
        employees and certain Affiliate employees have responsibilities with respect
        to GSCO and/or an Affiliate in addition to responsibilities regarding the
        operation of Sigma X2 and, as such, have the ability to access certain Participant
        confidential trading information. Such employees' roles are summarized below
        in response to Part II, Item 7.d.</taPart2Item6aUnitAfflEmployeeServices>\n
        \     </part2Item6aDoesEmployeeAccessConfidentialInfo>\n      <part2Item6bDoesAnyEntitySupportServices
        rbPart2Item6bDoesAnyEntitySupportServices=\"Y\">\n        <taPart2Item6bServiceProvider>GSCO
        has entered into an agreement with Operations and Compliance Network, LLC
        (\"Ocean\"), an affiliate of Nasdaq, pursuant to which Ocean hosts, operates
        and supports the technology platform for Sigma X2 subject to the direction
        and oversight of GSCO as the Broker-Dealer Operator. Pursuant to this agreement,
        Ocean also provides certain support services related to GSCO's compliance,
        surveillance, supervisory, recordkeeping and reporting obligations subject
        to the direction and oversight of GSCO as the Broker-Dealer Operator. Pursuant
        to the agreement with Ocean, certain aspects of the services provided by Ocean
        to Sigma X2 utilize infrastructure and support services shared by Ocean and
        its affiliates. As the Broker-Dealer Operator, GSCO is responsible for the
        operation of Sigma X2 in compliance with the federal securities laws. Ocean
        is responsible for carrying out the operation of Sigma X2 and all aspects
        of Part III of the Form ATS-N with the exception of Items 6 (Co-location and
        Connectivity), 12 (Liquidity Providers), 15 (Display), 16 (Routing), 18 (Trading
        Outside of Regular Trading Hours), 19 (Fees), 22 (Clearance and Settlement),
        24 (Order Display and Execution Access), and 25 (Fair Access). Certain of
        these enumerated functions do not apply to Sigma X2 at all or are handled
        by GSCO personnel.</taPart2Item6bServiceProvider>\n        <rbPart2Item6cDoesServiceProviderUseATSServices>N</rbPart2Item6cDoesServiceProviderUseATSServices>\n
        \     </part2Item6bDoesAnyEntitySupportServices>\n      <taPart2Item7aDescrOfSafeGaurdsAndProcedures>GSCO
        has written policies and procedures designed to safeguard confidential trading
        information. Such policies and procedures are global and, as such, apply to
        The Goldman Sachs Group, Inc. and all of its affiliates (e.g., GSCO, GSI and
        other affiliates). GSCO considers information about Participants' identities,
        orders, transactions, strategies, and activities to be confidential trading
        information subject to protection. GSCO and Affiliate employees' access to
        Participant confidential trading information is dependent upon the level of
        information that is needed to perform their duties and responsibilities related
        to Sigma X2 (\"need to know standard\"). GSCO and Affiliate employees are
        strictly prohibited from using such information in an unauthorized manner
        and from discussing the details of any trades executed in Sigma X2 with persons
        who do not need such information to carry out their designated duties and
        responsibilities. Access to such information is granted as needed to perform
        these duties and responsibilities (i.e., real-time or delayed, isolated, periodic,
        or continuous). The individuals and systems with access to Participant confidential
        trading information, including the basis for such access, are outlined in
        response to Part II, Item 7.d. Set forth below are the policies and procedures
        in place to safeguard and oversee the protection of Sigma X2 Participant confidential
        trading information.\nSEPARATION OF SYSTEMS AND EMPLOYEES:\nThe Sigma X2 matching
        engine is physically separate from other GSCO systems as it is hosted and
        operated by Ocean on a daily basis (i.e., Sigma X2 does not share rack space
        with any other GSCO systems). Similarly, the Sigma X2 matching engine and
        order entry servers are on separate hardware from other systems hosted/operated
        by Ocean. Additionally, the Ocean employees that are responsible for the daily
        operation of Sigma X2 and that have access to the Sigma X2 order book are
        in a separate physical location from GSCO employees.\nGSCO employees with
        access to real-time Participant confidential trading information are in a
        different physical location on the floor, separate from GSCO principal trading
        employees.\nTHIRD PARTY ACCESS PROTECTIONS:\nCertain Ocean and Nasdaq employees
        have access to Participant confidential trading information. Such employees
        include Ocean and Nasdaq staff from Compliance, Operations, Technology Development
        (including trading and surrounding systems), Product Management, and Business
        Management. The confidential trading information consists of information regarding
        individual orders and executions, names of Participants, and volume of orders
        in Sigma X2.\nOcean's policies and procedures employ a three-pronged approach
        to permission access to Sigma X2. First, an employee must complete compliance
        training specific to the Ocean business unit. Second, an Ocean employee must
        request, and Ocean Compliance must approve, access to each specific system
        based on the employee's designated role and responsibilities. Third, once
        approved, the Ocean employee must complete Ocean's annual Compliance training.\nOcean
        employees that have access to confidential trading information are subject
        to Ocean's \"Information Barriers and Conflict Management Policies and Procedures.\"\nAll
        Ocean employees are subject to Nasdaq's Global Trading Policy (\"GTP\"), which
        outlines all requirements and restrictions related to personal trading activity
        including holding periods, annual attestations, IPO restrictions and a prohibited
        list. Ocean employees are required to disclose personal investment and brokerage
        accounts, positions, and transactions. Nasdaq's Global Ethics Team monitors
        personal trade activities against the GTP.\nOcean also conducts electronic
        communications reviews to identify policy violations including non-compliance
        with the above referenced policies and procedures.\nGSCO has the right to
        audit Ocean's operation of Sigma X2, including Ocean's access to and use of
        Participant confidential trading information either through audits conducted
        by GSCO's own audit team or by third-party auditors. Such audits may be conducted
        on-site or off-site.\nOcean also is obligated to notify GSCO of any actual
        or suspected unauthorized access to confidential information, which includes
        Participant confidential trading information, in a timely manner.\n\nGSCO
        ACCESS PROTECTIONS:\nAccess to Sigma X2 is controlled through permission configurations
        that provide application access only to entitled users (i.e., users who require
        access to information to carry out designated duties and responsibilities
        as described in Part II, Item 7.d. below). Access entitlements are approved
        by designated supervisors and documented, tracked and monitored. Designated
        supervisors attest periodically, via an electronic system, that procedures
        designed to safeguard and protect Participant confidential trading information
        were followed. Such procedures include reviews of organizational structure
        including any new or transferred employees as well as reviews of any personal
        account trades and any related firm/divisional policy violations (as described
        below).\n\nGSCO employees with access to the Sigma X2 order book are prohibited
        from writing code (i.e., order handling logic) for the GSCO SOR and GSCO algorithms.\n\nGSCO
        also has detailed written firm-wide and divisional policies and procedures
        designed to monitor and limit employee personal trading globally. As such,
        they are applicable to The Goldman Sachs Group, Inc. and all of its affiliates
        and, accordingly, are applicable to all GSCO employees, including those with
        duties and responsibilities related to Sigma X2. Specifically, GSCO employees
        are prohibited from engaging in personal trading activity that, among other
        things, would conflict with or appear to conflict with client business or
        negatively impact client service or trading outcomes. To address potential
        conflicts of interest GSCO employs personal trading controls including the
        following: (i) requiring disclosure of all covered personal trading accounts
        for activity monitoring purposes; (ii) requiring supervisor pre-approval before
        trading in single name securities; and (iii) restricting or performing enhanced
        reviews of personal trading in certain financial instruments. Goldman Sachs
        FICC and Equities, within which Sigma X2 is operated within GSCO, also has
        a policy that provides general guidelines for limits on personal trading volumes
        in single name securities. The policy is applicable to all employees within
        Goldman Sachs FICC and Equities, including employees that have duties and
        responsibilities related to Sigma X2 (e.g., Supervision (including GSET managers),
        GSET Engineers, and GSCO and GSI Execution Coverage employees described in
        Part II, Item 7.d).  Control-side and other employee groups described in Part
        II, Item 7.d (Compliance, Legal, Internal Audit, Operations) are subject to
        more restrictive policies regarding trading in single name securities (i.e.,
        with limited exceptions, such employees may not transact in single name securities).
        GSCO supervisors must escalate personal trades if there is an appearance of
        impropriety (e.g., potential front-running). Additionally, GSCO employees
        are only allowed to use external brokerage accounts under certain terms and
        conditions and only with approved brokers. Finally, GSCO employee trades in
        certain products (e.g., single name securities) are subject to a 30-day holding
        period.\n\nOn an annual basis, GSCO employees (including those with duties
        and responsibilities related to Sigma X2) participate in compliance training
        that addresses information protection and client confidentiality. Additionally,
        on a firm-wide basis GSCO continuously monitors electronic communications
        to identify potential policy violations.</taPart2Item7aDescrOfSafeGaurdsAndProcedures>\n
        \     <rbPart2Item7bCanSubscriberConsentToDisclosure>N</rbPart2Item7bCanSubscriberConsentToDisclosure>\n
        \     <taPart2Item7dSummaryOfRolesRespOfPersons>Subject to the written safeguards
        and procedures described above, access to Participant confidential trading
        information is limited to those Persons with a \"need to know\" such information,
        as defined in response to Part II, Item 7.a. In particular, with respect to
        GSCO, Ocean and GSI, such access by personnel and systems is permissioned
        when necessary to perform duties and responsibilities for Sigma X2. Persons
        with access to Participant confidential trading information, including the
        basis for such access, are outlined below.\n\nOCEAN PERSONNEL\nTo perform
        operational, compliance, surveillance, recordkeeping, and regulatory reporting
        responsibilities, certain designated Ocean employees (approximately a dozen)
        require access to Sigma X2 trading information. Particular Ocean business
        personnel include:\n\nOcean Operations - Dedicated Operations personnel are
        responsible for the day-to-day technical and market operations of Sigma X2.
        To perform these responsibilities, Operations personnel have access to intraday
        and historical order and execution event data via various system applications,
        including OceanView, and have access to client set up data via the Configuration
        API.\n\nOcean Compliance - Dedicated Compliance personnel are responsible
        for surveillance of Sigma X2 using the SMARTS application and for managing
        access requests and entitlements for Ocean systems. Such Compliance personnel
        also are responsible for Ocean's compliance with the Ocean Information Barriers
        and Conflict Management Policies and Procedures. To perform these responsibilities,
        such Compliance personnel have access to intraday and historical order and
        execution event data.\n\nOcean CORE Technology - Dedicated CORE Technology
        personnel are responsible for development and maintenance of software related
        to the core/matching functionality of Sigma X2. To perform these responsibilities,
        CORE Technology personnel have access to intraday and historical order-event
        data via CORE stream.\n\nOcean Surrounding Technology - Surrounding Technology
        personnel have responsibilities for the development, maintenance, and operation
        of downstream applications that consume data from Sigma X2 for purposes of
        surveillance, regulatory reporting, and recordkeeping. Personnel have access
        to intraday and historical order-event data via various system applications,
        including OceanView. Personnel also have access to client set up data via
        the Configuration API.\n\nOcean Business and Product Management - Dedicated
        Business and Product Management personnel are responsible for overarching
        management and coordination of Ocean teams (Operations/Compliance/CORE/Surrounding).
        For these purposes, such personnel have access to intraday and historical
        order-event data via various systems applications, including OceanView.\n\nGSCO
        EMPLOYEES: OCEANVIEW LIAISONS &amp; DEDICATED GSET ENGINEERS\nDesignated \"OceanView
        Liaisons\": Supervisory, GSET Engineers, Operations and Compliance - A defined
        and limited group of designated GSCO employees who have responsibilities for
        providing supervisory, operational, or compliance support specific to Sigma
        X2 have access to the order book via Ocean's \"OceanView\" GUI. Support responsibilities
        may include liaising with Ocean, performing various technical functions, and
        troubleshooting.\n\nDedicated GSET Engineers - A designated subset of engineers
        dedicated to the Sigma X2 business who perform execution quality and mark-out
        profile analysis requiring information access on a (T+1) delayed basis. For
        these purposes, such personnel have access to Participant identities and execution
        information but do not have real-time access to the Sigma X2 order book.\n\nGSCO
        EMPLOYEES: OTHER SUPPORT\nSupport employees referenced below are not entitled
        to access the Sigma X2 order book.\n\nExecution Coverage - Through an order
        management system, designated sales employees have access to order and execution
        information for the Indirect Subscribers to whom they provide coverage. Access
        to Indirect Subscriber order information is necessary for the purpose of providing
        sales and execution services, and their access to such information is no different
        than their ability to see orders that are routed to other market venues. Designated
        sales employees also have access to delayed (at least T+1) and aggregated
        execution information for the Direct and/or Indirect Subscribers to whom they
        provide coverage.\n\nGSET Engineers - As discussed above, pursuant to an agreement
        with GSCO, Ocean operates and supports the technology platform for Sigma X2
        subject to the oversight of GSCO as the Broker-Dealer Operator (See Part II,
        Item 6.b., above). Certain engineering employees monitor Sigma X2's performance
        for purposes of measuring execution quality, performing mark-out profile analyses
        (as described further in Part III, Item 13), and related analytical functions.
        These employees have development and maintenance responsibilities for GSCO
        trading platforms, execution algorithms, order routing, data stores, and systems
        that feed GSCO middle and back office and have visibility into order routing
        destinations (whether principal and/or client flow), including routing to
        Sigma X2.\n\nOperations - GSCO Operations employees perform various operational
        support functions including regulatory reporting and trade booking. Such employees
        can access Participant trading execution information in order to provide operational
        support, or perform specific responsibilities such as trade booking and regulatory
        reporting.\n\nSupervisory Coverage - Designated employees who perform supervisory
        oversight of GSET business activities and Sigma X2. These designated supervisory
        employees have as needed access to order and execution information to provide
        supervisory oversight responsibilities.\n\nLegal, Compliance, Internal Audit/Compliance
        Testing \"Control Side Employees\" -Designated employees assigned to GSCO's
        various Compliance, Legal, and Internal Audit/Compliance Testing divisions
        and who have control side, audit, and regulatory responsibilities may access
        Participant information to provide regulatory and compliance support, and
        address regulatory examinations and inquiries where warranted.\n\nSegmentation
        Governance Working Group - Certain designated employees from Compliance, Dedicated
        GSET Engineers, Designated OceanView Liaisons, Execution Coverage, and Supervision,
        all described above, meet on a periodic basis to review and discuss Participants'
        Counterparty Classification designations (as described in Part III, Item 13).
        This group reviews and discusses the results of the GSCO objective mark-out
        analysis (as described in Part III, Item 13).\n\nGSI PERSONNEL\nGSI, as an
        Indirect Subscriber to Sigma X2, has access to its own principal and client
        trading information. Similar to the coverage team for GSCO Execution, GSI
        employees have access to order and execution information for the clients on
        whose behalf they provide coverage, including execution services in Sigma
        X2 that are facilitated by GSCO acting as agent for GSI.\n\nGSCO AND GSI SYSTEMS\nGSCO
        has systems, applications and databases that contain Participant confidential
        trading information. Specifically, with regard to systems, GSCO has order
        and execution management systems, algorithms, a SOR and a DMA System that
        have real-time order and execution information to support the transmission
        of orders, executions and related information to and from Sigma X2.\n\nParticipant
        confidential trading information is maintained in GSCO central databases as
        well as the applications used to access those database, e.g., SMARTS and OceanView.
        These databases and applications contain real-time and delayed order and execution
        information. The information in these databases is used to comply with books
        and records requirements, regulatory reporting requirements, and for monitoring
        and surveillance. GSCO also derives information from these databases to satisfy
        Participants' requests for their individual activity in Sigma X2, as described
        in Part III, Item 13.d, as well as to provide Participants with aggregated
        and anonymized information about overall activity in Sigma X2, as described
        in Part III, Item 26. Finally, GSCO Execution Coverage may also receive information
        from these databases regarding the activity of the specific Participants for
        whom they provide coverage.\n\nGSI also has systems, applications and databases
        that contain Participant confidential trading information (real-time and delayed
        order and execution information); namely, the orders in NMS Stocks sent to,
        and executions received from, GSCO, which acts as agent for GSI in connection
        with Sigma X2 activity. GSI uses the information in a manner similar to GSCO,
        i.e., for the same above-described purposes.\n\nBoth GSCO and GSI limit access
        to their systems, applications and databases to persons with a \"need to know\"
        such information to perform their specific duties and responsibilities as
        defined in Part II, Item 7.a. This policy, which is global, is enforced through
        entitlement access procedures.\n\nOCEAN SYSTEMS\nOcean, in its role of hosting,
        operating and supporting the technology platform for Sigma X2, also maintains
        systems, applications and databases that contain Participant confidential
        trading information. For example, Ocean maintains the Sigma X2 order book,
        SMARTS, and OceanView, which include real-time and delayed order and execution
        information. Separately, Ocean also maintains applications and databases that
        contain real-time and delayed order and execution information to assist GSCO
        with other functions including regulatory reporting (e.g., OATS and trade
        reporting) and surveillance.\n\nLike GSCO and GSI, Ocean has a \"need to know\"
        policy and entitlement access procedures.</taPart2Item7dSummaryOfRolesRespOfPersons>\n
        \   </partTwo>\n    <partThree>\n      <taPart3Item1SubscriberType>Investment
        Companies</taPart3Item1SubscriberType>\n      <taPart3Item1SubscriberType>Retail
        Investors</taPart3Item1SubscriberType>\n      <taPart3Item1SubscriberType>Issuers</taPart3Item1SubscriberType>\n
        \     <taPart3Item1SubscriberType>Brokers</taPart3Item1SubscriberType>\n      <taPart3Item1SubscriberType>Asset
        Managers</taPart3Item1SubscriberType>\n      <taPart3Item1SubscriberType>Principal
        Trading Firms</taPart3Item1SubscriberType>\n      <taPart3Item1SubscriberType>Hedge
        Funds</taPart3Item1SubscriberType>\n      <taPart3Item1SubscriberType>Market
        Makers</taPart3Item1SubscriberType>\n      <taPart3Item1SubscriberType>Banks</taPart3Item1SubscriberType>\n
        \     <taPart3Item1SubscriberType>Dealers</taPart3Item1SubscriberType>\n      <taPart3Item1SubscriberType>Other</taPart3Item1SubscriberType>\n
        \     <taPart3Item1OtherSubscrbrDtls>Other types of Participants include:\n-
        Private Investors\n- Pension Funds\n- Insurance Companies\n- Government Entities</taPart3Item1OtherSubscrbrDtls>\n
        \     <rbPart3Item2aRegisteredBD>N</rbPart3Item2aRegisteredBD>\n      <part3Item2bSummaryOfConditions
        rbPart3Item2bIsThereOtherConditions=\"Y\">\n        <taPart3Item2bSummaryOfCndtns>GSCO,
        as a multi-service Broker-Dealer (and except with respect to its affiliated
        entities) requires all Participants (whether Direct or Indirect Subscribers)
        to execute various account documentation relating to sales and execution services
        provided by GSCO. Participants are subject to the GSCO onboarding process
        applicable to all GSCO clients. Once the general GSCO onboarding process is
        complete, GSCO clients have access to a variety of products and services offered
        by GSCO including, but not limited to, Sigma X2. During the GSCO onboarding
        process, a variety of criteria are taken into account for establishing new
        client relationships and providing clients with access. For example, Goldman
        Sachs has onboarding policies, procedures, and internal processes designed
        to prevent and detect money laundering. Other factors in assessing and onboarding
        clients include background checks and financial and credit standing.\n\nIn
        addition, to route Firm and Conditional orders to Sigma X2 via a direct connection
        (i.e., become a Direct Subscriber), a Participant also must sign, as noted
        in Item 2.d. below, a subscriber agreement or a mutual access agreement (discussed
        in more detail in Part II, Item 4.a. above) governing and specifying the nature
        of the relationship between GSCO and the client. Pursuant to the terms of
        the agreements and/or account documentation entered into with GSCO, Participants
        have contractual obligations to abide by all applicable rules and regulations.</taPart3Item2bSummaryOfCndtns>\n
        \       <rbPart3Item2cIsConditionsSameForAll>Y</rbPart3Item2cIsConditionsSameForAll>\n
        \     </part3Item2bSummaryOfConditions>\n      <rbPart3Item2dIsThereWrittenAgreement>Y</rbPart3Item2dIsThereWrittenAgreement>\n
        \     <part3Item3aSumryOfExcludngCondtns rbPart3Item3aIsExcludeSubscriber=\"Y\">\n
        \       <taPart3Item3aExcludngSumryDtls>Conditions for exclusion include:
        intent-based behavior that negatively affects execution quality or operational
        stability of Sigma X2 (e.g., surveilling for inappropriate trading activity);
        and any other conduct or developments (e.g., margin or credit risk issues)
        that would reasonably cause GSCO to end its relationship with a client (e.g.,
        change in financial status and regulatory incidents).\nPlease refer to Part
        III, Item 13.a. regarding the Counterparty Classification Framework and the
        Taker Token Feature because both can result in limitations on the activities
        of Participants on Sigma X2 (i.e., an inability to interact with some order
        flow).\nPursuant to the terms of the agreements and/or account documentation
        entered into with GSCO as noted in Part III, Item 2.b. above, Participants
        have contractual obligations to abide by all applicable securities rules and
        regulations. In addition, GSCO assesses incoming orders and blocks or filters
        out those orders that are missing required elements or otherwise fail the
        GSCO checks. GSCO also uses activity reports to monitor orders sent to Sigma
        X2 and to monitor Participant compliance with their agreements and ATS policies
        and procedures, including applicable securities rules and regulations. A Participant's
        failure to comply with the agreements or meet contractual obligations can
        result in termination as a client of GSCO and/or exclusion from Sigma X2.</taPart3Item3aExcludngSumryDtls>\n
        \       <rbPart3Item3bIsCondtnsSameForAll>Y</rbPart3Item3bIsCondtnsSameForAll>\n
        \     </part3Item3aSumryOfExcludngCondtns>\n      <taPart3Item4aHrsOfOperation>Sigma
        X2 operates Monday through Friday from 8:00 a.m. to 4:00 p.m. Eastern Time
        (\"ET\"). Sigma X2 accepts Firm and Conditional orders beginning at 8:00 a.m.
        ET, but matching only occurs during regular trading hours - 9:30 a.m. to 4:00
        p.m. ET. Sigma X2 will observe the U.S. holidays and early closings as published
        by the national stock exchanges.</taPart3Item4aHrsOfOperation>\n      <rbPart3Item4bIsHrsOfOperationsame>Y</rbPart3Item4bIsHrsOfOperationsame>\n
        \     <part3Item5aProtocolDetails rbPart3Item5aIsPermitOrdrTradng=\"Y\">\n
        \       <taPart3Item5aProtocolused>Direct Subscribers access Sigma X2 directly
        via a standard FIX connection (FIX version 4.2) dedicated to Sigma X2 and
        utilize FIX protocol for Firm and Conditional order submission.</taPart3Item5aProtocolused>\n
        \       <rbPart3Item5bIsProtclsameForAll>Y</rbPart3Item5bIsProtclsameForAll>\n
        \     </part3Item5aProtocolDetails>\n      <part3Item5cOthrDtls rbPart3Item5cIsAnyOtherMeans=\"Y\">\n
        \       <taPart3Item5cOthrMeansDtls>Indirect Subscribers can enter and access
        Firm and Conditional order types at  Sigma X2 via non-ATS GSCO offered products
        and services, which may include:\ni. GSCO algorithms, which accept parent-level
        orders and can send portions of such orders (i.e., child orders) to GSCO's
        SOR. GSCO's SOR may route such orders to Sigma X2 or other market centers,
        as described below;\nii. The GSCO SOR (hosted in Carteret and NY4), which
        can route various orders to Sigma X2 or other market centers or may route
        directed orders to Sigma X2; and\niii. The GSCO DMA System, which GSCO clients
        may use to direct orders to Sigma X2 or other market centers using their own
        algorithms, i.e., non-GSCO algorithms. Orders routed via the GSCO DMA System
        do not pass through, and are not known by, GSCO's SOR.\n\nFirm and Conditional
        orders sent to Sigma X2 by Indirect Subscribers, GSI, and GSCO business units
        via GSCO algorithms and the GSCO SOR are sent directly to Sigma X2 once the
        routing decision is made by the GSCO SOR, and use a FIX connection and the
        same FIX protocol as described in the response to Part III, Item 5.a. above.</taPart3Item5cOthrMeansDtls>\n
        \       <rbPart3Item5dIsTnCSameForAll>Y</rbPart3Item5dIsTnCSameForAll>\n      </part3Item5cOthrDtls>\n
        \     <rbPart3Item6aIsCoLocRltdSrvcsOfrd>N</rbPart3Item6aIsCoLocRltdSrvcsOfrd>\n
        \     <rbPart3Item6cIsAnyOtherMeans>N</rbPart3Item6cIsAnyOtherMeans>\n      <rbPart3Item6eIsAnyRducdSpOfCom>N</rbPart3Item6eIsAnyRducdSpOfCom>\n
        \     <taPart3Item7AOrdrTypExplain>ORDER TYPES AND PARAMETERS\nUpon receipt
        of each order, Sigma X2 will determine and apply an \"Assigned Limit Price.\"
        \ For Firm and Conditional orders, the Assigned Limit Price of an order is
        the highest price for a buy order (lowest for a sell order) at which the order
        may be executed at or within the National Best Bid and Offer (\"NBBO\") after
        applying the constraints selected by the Participant (e.g., limit price or
        peg type). Assigned Limit Prices will be reevaluated and updated as may be
        necessary with each change in the NBBO. Sigma X2 will not apply an Assigned
        Limit Price worse than the Participant's Limit Price. Sigma X2 supports the
        following order types:\n\nLIMIT ORDERS. For Firm and Conditional orders, Limit
        orders, which are determined by the Participant, are posted to the Sigma X2
        order book with an Assigned Limit Price equal to the order's Limit Price with
        the following exception:\n\n-  Firm and Conditional orders with prices outside
        the NBBO (i.e., at prices higher than the NBBO for buy orders and lower than
        the NBBO for sell orders) are given an Assigned Limit Price at the NBBO. For
        example, if the NBBO is $10.00 x $10.02, a buy order with a limit price of
        $10.03 will have an Assigned Limit Price of $10.02.\n\nPursuant to Rule 612
        under Regulation NMS, Firm and Conditional orders with a price not within
        the minimum quotation increment will be rejected. (For orders priced at or
        above $1.00, the minimum increment is $0.01. For orders below $1.00, the minimum
        increment is $0.0001. The Assigned Limit Price will follow these pricing requirements.)\n\nNo
        Firm or Firm Up order will be executed at a price worse than the order's Limit
        Price. If a Participant amends the Limit Price of a Firm or Conditional order,
        Sigma X2 will reevaluate and update the Assigned Limit Price as may be necessary.\n\nPEG
        ORDERS. For Firm and Conditional orders, Sigma X2 supports three peg types:\n-
        Mid Peg - an order pegged to the midpoint of the current NBBO.\n- Market Peg
        - an order pegged to the far side of the NBBO (e.g., best offer for a buy
        order).\n- Primary Peg - an order pegged to the near side of the NBBO (e.g.,
        best bid for a buy order).\nAll Firm and Conditional peg orders require a
        limit price. A Firm or Conditional peg order will have an Assigned Limit Price
        as close to the midpoint of the NBBO as possible given the constraints of
        the order's peg type and limit price. For example, where the NBBO is $10.00
        x $10.02:\n- a Mid Peg sell order with a limit price of $10.00 will have an
        Assigned Limit Price of $10.01; and\n- a Mid Peg sell order with a limit price
        of $10.02 will have an Assigned Limit Price of $10.02.\n\nAttached are examples
        of the Assigned Limit Price logic for buy and sell orders. Note, if a Participant
        amends the peg instruction of a Firm or Conditional order, Sigma X2 will update
        the Assigned Limit Price as appropriate. Sigma X2 also will reevaluate and
        update the Assigned Limit Price of a Firm or Conditional Peg Order, as may
        be necessary, as a result of changes to the NBBO.\n\nSECURITIES PRICED UNDER
        $1.00.\n- For Firm and Conditional orders, where the Assigned Limit Price
        of an order would be the midpoint of the NBBO and the midpoint price extends
        to five decimal places, Sigma X2 will apply conservative rounding to four
        decimal places (i.e., the price of a sell order will be rounded up, and the
        price of a buy order will be rounded down).\n- Accordingly, where the Assigned
        Limit Price of a midpoint peg sell order and a midpoint peg buy order would
        be the midpoint of the NBBO, which for example is $0.60045, the Assigned Limit
        Price of the sell order will be $0.6005, and the Assigned Limit Price of the
        buy order will be $0.6004. Sigma X2 would not match these orders.\n\nTIME
        IN FORCE\nSigma X2 supports Day and IOC time in force designations on orders.
        Any combination of order type, described above, and one of the two time in
        force designations is valid for Firm orders. Conditional orders must be sent
        with a time in force of Day, while Firm Up orders can be sent with a time
        in force of Day or IOC.  Currently, the GSCO algorithms and SOR (described
        in Part II, Item 5.a.) make use of all order types and time in force combinations
        except for primary peg IOC orders.\n\nDay Orders: For Firm orders, the order
        will remain in the Sigma X2 order book until it is cancelled, the full quantity
        is executed, or the market closes. For Conditional orders, the order will
        remain in the Sigma X2 order book until it is cancelled by the Participant,
        cancelled upon issuance of a Firm Up Request, or the market closes. Firm Up
        orders will remain active until executed (partial or full) or the Time Out
        period expires (as explained in Part III, Item 9.a).  Day Firm and Day Conditional
        orders may be modified, replaced or cancelled by a Participant.  A Day Firm
        Up order may only be modified, replaced or cancelled by a Participant if it
        is the first-in-time of two Firm Up orders resulting from a Conditional to
        Conditional match.  Upon entry, Day Firm Up orders will be converted to an
        IOC for execution purposes (as explained in Part III, Item 9.a).\n\nImmediate-or-Cancel
        (\"IOC\") Orders: Firm IOC orders will match immediately with eligible resting
        contra-side orders and Sigma X2 will cancel back the balance. Firm IOC orders
        may not be modified, replaced or cancelled by a Participant.  Firm Up IOC
        orders may remain active in Sigma X2 until cancelled, executed, or the Timeout
        Period expires (as noted in Part III, Item 9.a).  A Firm Up IOC order may
        only be modified, replaced or cancelled by a Participant if it is the first-in-time
        of two Firm Up orders resulting from a Conditional to Conditional match.\n\nFor
        Firm orders, Participants can change a time in force designation on an order
        from Day to IOC, not the converse. At such time, Sigma X2 will: (i) reevaluate
        and update the Assigned Limit Price of the order as may be necessary; (ii)
        scan the book for available contra-side interest, treating the amended IOC
        order as a liquidity-taking order; and (iii) then, execute or cancel the order.\n\nREASONS
        TO REJECT OR CANCEL ORDERS\nFirm and Conditional orders may be rejected or
        cancelled for various reasons, including incomplete order instructions or
        if the order message contains an invalid instruction or parameter (e.g., missing
        side, size exceeding maximum allowable quantity). The Sigma X2 FIX spec, which
        is provided at onboarding, details all cancel and reject reasons.\n\nAdditionally,
        Firm and Firm Up executions will be blocked during locked or crossed market
        conditions.\nROUTING TO OTHER MARKET CENTERS\nSigma X2 does not route Firm
        or Conditional orders to other market centers.</taPart3Item7AOrdrTypExplain>\n
        \     <rbPart3Item7bIsTnCSameForAll>Y</rbPart3Item7bIsTnCSameForAll>\n      <part3Item8aSizeReqrmnts
        rbPart3Item8aIsMinOrMaxSizeReqd=\"Y\">\n        <taPart3Item8aOtiSizeReqrmns>The
        minimum Firm or Conditional order size is 1 share. The current maximum is
        999,999 shares, but GSCO also applies Rule 15c3-5 related size limitations.</taPart3Item8aOtiSizeReqrmns>\n
        \       <rbPart3Item8bIsReqProcSameForAll>Y</rbPart3Item8bIsReqProcSameForAll>\n
        \     </part3Item8aSizeReqrmnts>\n      <part3Item8cOddltOrdrReqs rbPart3Item8cIsOddLotsAcptdExecutd=\"Y\">\n
        \       <taPart3Item8cOddLtOrdrReqsnProcdurs>For both Firm and Conditional
        orders, odd lots are treated the same as round lots.</taPart3Item8cOddLtOrdrReqsnProcdurs>\n
        \       <rbPart3Item8dIsReqsProcdurSameForAll>Y</rbPart3Item8dIsReqsProcdurSameForAll>\n
        \     </part3Item8cOddltOrdrReqs>\n      <part3Item8eMixltOrdrDetails rbPart3Item8eIsMixLotOrdrsAcptdExecutd=\"Y\">\n
        \       <taPart3Item8eMixltOrdrReqsProcDtls>For both Firm and Conditional
        orders, mixed lots are treated the same as round lots.</taPart3Item8eMixltOrdrReqsProcDtls>\n
        \       <rbPart3Item8fIsRecProcSameForAll>Y</rbPart3Item8fIsRecProcSameForAll>\n
        \     </part3Item8eMixltOrdrDetails>\n      <part3Item9aMsgDtls rbPart3Item9aIsAnyMsgToIndicTI=\"Y\">\n
        \       <taPart3Item9aMsgUsgDtls>Sigma X2 accepts \"Conditional orders\" which
        are conditional indications of trading interest.  Direct Subscribers can enter
        Conditional orders via a FIX connection.  Indirect Subscribers may leverage
        Conditional orders through non-ATS GSCO offered products including GSCO algorithms,
        GSCO SOR, and the GSCO Direct Market Access (\"DMA\") System, as outlined
        in Part III Item 5 (Means of Entry).\nA Conditional order is never executed.
        \ Instead, upon entry, a Conditional order will look to match with a contra
        Firm order or Conditional order in Sigma X2.\n\nIf a match is found for a
        Conditional order, an invitation to trade, known as a Firm Up Request, is
        sent to the Participant.\n\nWhen a Firm Up Request is transmitted to a Participant
        via FIX message, the Conditional order to which it relates is cancelled by
        Sigma X2.  A Firm Up Request contains a unique Firm Up ID, the quantity of
        the conditional match, and certain order details of the Conditional order
        to which it relates (e.g., price).  Upon receipt of a Firm Up Request, a Participant
        may send a Firm Up order, but is not obligated to do so.  To be accepted by
        Sigma X2, a Firm Up order must be received by Sigma X2 within 1 second of
        when Sigma X2 sent the Firm Up Request (i.e., Timeout Period).  A Firm Up
        order received after the Timeout Period has elapsed will be rejected by Sigma
        X2.\n\nWhen a Conditional order matches with another Conditional order, if
        a Firm Up order is subsequently sent by each side, the Firm Up orders will
        interact with each other.  However, in the case where the first Firm Up order
        is cancelled by the Participant, cancelled by Sigma X2, or rejected by Sigma
        X2 before the second Firm Up order is received, the second Firm Up order is
        eligible to match with a Firm order(s) on the book.  If both Firm Up orders
        are received by Sigma X2 before the Timeout Period elapses, the orders will
        be partially or fully executed if their respective order attributes still
        allow for a match.  If, for example, the NBBO price moves away from the price
        of the Conditional match, the Firm Up orders will not execute.\n\nAs with
        Firm Orders, both Conditional and Firm Up orders can be entered with the Post-Only
        condition.  If a Conditional or Firm Up order is entered with this order condition,
        it can only match with a liquidity-taking order (as described in Part III,
        Item 11.c).  A Post-Only condition on a Firm Up order does not need to match
        a Post-Only condition on the originating Conditional order.  For example,
        a Conditional order can be entered without a Post-Only condition but the resulting
        Firm Up can contain a Post-Only condition.  In a Conditional to Conditional
        match, if the resulting Firm Up orders are both designated as Post-Only, no
        execution will occur and the orders will be cancelled by Sigma X2 after the
        Timeout Period elapses.\n\nBefore the Timeout Period elapses, a Participant
        may modify, replace, or cancel a Firm Up order if it is first-in-time of two
        Firm Up orders resulting from a Conditional to Conditional match.  A Firm
        Up order that does not receive an execution before the Timeout Period elapses
        is considered expired and will be cancelled by Sigma X2.  Firm Up orders received
        by Sigma X2 after the Timeout Period has elapsed will be rejected.\n\nWhen
        a Conditional order matches with a Firm order, the Firm order could be executed
        or cancelled by the Participant before a Firm Up order is received by Sigma
        X2.  In such instances, the Firm Up order will then match with any eligible
        resting contra-side order(s) and any unmatched portion of the Firm Up order
        will be cancelled.\n\nConditional orders and Firm Up orders are identified
        through values in FIX Tag 23012. See Part III, Item 8.a regarding minimum
        and maximum order sizes.\n\nA Conditional order must have a Time In Force
        of Day or the order will be rejected.  MinQty is supported as a parameter
        for Conditional orders, but is not required.  A Conditional order may be modified,
        replaced or cancelled by a Participant, but attempts to change the order from
        Conditional to Firm or vice-versa will result in a cancel.\n\nOnly the following
        order details of a Firm Up order must match the original Conditional order:
        Symbol, Side, Price, OrderType, ExecInst (Market Peg, Mid Peg, Primary Peg),
        and MinQty. The Firm Up order must also contain the Firm Up ID from the Firm
        Up Request message.  If any of these details are missing or differ from the
        original Conditional order, the Firm Up order will be rejected.  A Firm Up
        order may have a different quantity than the original Conditional order and
        may have a different Time In Force (Day or IOC) than the Conditional order
        (Day only).  Within Sigma X2, a Firm Up order can only be executed as an IOC
        order and, accordingly, a Firm Up order entered as Day will be automatically
        converted to IOC for execution purposes.  A Time In Force value of IOC will
        be reflected on the FIX execution message.  Additionally, a Firm Up order
        with a Time In Force of IOC may remain active in Sigma X2 from entry until
        cancelled, executed or the Timeout Period expires.\n\nFirm Up orders are not
        guaranteed to receive an execution.  If a Firm Up order receives a partial
        execution, any unfilled portion of the order will be cancelled.\n\nFirm orders,
        by default, are eligible to interact with Conditional orders, but Direct Subscribers
        can opt-out of this behavior. This can be done on a per-order basis or at
        the FIX session level by contacting GSCO Coverage. This opt out only applies
        to interactions (i.e., matches) with Conditional orders.  Firm orders that
        are opted-out of interacting/matching with Conditional orders can still match
        and execute with Firm Up orders.  Consider the following example:\n-Order
        A is a Firm order to buy and eligible to match with Conditional orders.\n-Order
        B is a Firm order to buy and not eligible to match with Conditional orders.\n-Order
        A has a higher priority than Order B on the basis of order entry time\n-Order
        C is a Conditional order to sell.\n-Upon receipt by Sigma X2, Order C matches
        with Order A and a Firm Up Request is sent for Order C\n-Before a Firm Up
        order is received for Order C, Order A is cancelled\n-The Firm Up order for
        Order C will match with Order B\n\nFirm orders always have matching priority
        over Conditional orders.  Accordingly, upon receipt by Sigma X2, Conditional
        orders will match with eligible contra-side Firm orders before eligible contra-side
        Conditional orders, including Conditional orders that have a better price
        or earlier entry time than a contra-side Firm order(s).  Conditional to Firm
        order matching (like Firm to Firm order matching) follows price/broker/time
        priority. Consider the following example:\n-The spread of the stock for Orders
        A, B, and C is $10.00 x $10.02\n-Order A is a Conditional order to buy 2,000
        shares at $10.01 that is resting in Sigma X2\n-Order B is a Firm order to
        buy 1,000 shares at $10.00 that is resting in Sigma X2\n-Order B was received
        by Sigma X2 after Order A\n-Order C is a Conditional order to sell 1,000 shares
        at $10.00 and is received by Sigma X2 after Orders A and B\n-As outlined in
        the priority rules, Order C will conditional match with Order B.\nConditional
        to Conditional order matching follows price/broker/size/time priority.\nCounterparty
        Classification, as described in Part III Item 13, does not apply to Conditional
        orders.</taPart3Item9aMsgUsgDtls>\n      </part3Item9aMsgDtls>\n      <rbPart3Item9bIsIndIntrstSameForAll>Y</rbPart3Item9bIsIndIntrstSameForAll>\n
        \     <taPart3Item10aOpenReOpenDtls>Sigma X2 accepts Firm and Conditional
        orders beginning at 8:00 a.m. ET, but matching only occurs during normal market
        hours - 9:30 a.m. to 4:00 p.m. ET. Firm and Conditional  orders will remain
        in an accepted state and no executions will occur until the matching engine
        detects the opening print and limit up limit down (\"LULD\") band from the
        primary listing exchange for each symbol. Once the matching engine begins
        trading, the standard priority logic and matching logic will be applied to
        any open orders. Following a stoppage of trading in a security during regular
        trading hours, Sigma X2 will not execute transactions until the matching engine
        detects a reopening print (for an exchange-initiated stoppage) or pricing
        information (for a Sigma X2-initiated stoppage) and a LULD band from the primary
        exchange. If the primary listing exchange does not reopen (or pricing information
        is unavailable) after a stoppage, Sigma X2 will not match Firm or Conditional
        orders in the security.</taPart3Item10aOpenReOpenDtls>\n      <rbPart3Item10bIsOpnReopnSameForAll>Y</rbPart3Item10bIsOpnReopnSameForAll>\n
        \     <taPart3Item10cUnexeOrdrTIDtls>Firm and Conditional orders accepted
        by Sigma X2 will remain in an accepted state at the start of regular trading
        and Sigma X2 will not execute any orders until the matching engine detects
        the opening print and LULD band from the primary listing exchange for each
        symbol. Once the matching engine begins trading, the standard priority logic
        and matching logic will be applied to any open orders. Following a stoppage
        of trading in a security during regular trading hours, Sigma X2 will not execute
        transactions until the matching engine detects a reopening print (for an exchange-initiated
        stoppage) or pricing information (for a Sigma X2-initiated stoppage) and a
        LULD band from the primary exchange. If the primary listing exchange does
        not reopen (or pricing information is unavailable) after a stoppage, Sigma
        X2 will not match Firm or Conditional orders in the security.</taPart3Item10cUnexeOrdrTIDtls>\n
        \     <rbPart3Item10dIsAnyDifBtwnExeProcTrdHrs>Y</rbPart3Item10dIsAnyDifBtwnExeProcTrdHrs>\n
        \     <rbPart3Item10eIsAnyDifBtwnPreOpExecFlwngStpg>N</rbPart3Item10eIsAnyDifBtwnPreOpExecFlwngStpg>\n
        \     <taPart3Item11aStrucOfNmsStk>Sigma X2 operates a non-displayed limit
        order book and provides anonymous matching of orders in all eligible NMS Stocks.
        Order entry by Direct Subscribers and Indirect Subscribers is effected utilizing
        the FIX protocol for order submission. Firm and Conditional orders are validated
        upon submission to Sigma X2 and any order that does not pass all validation
        is rejected. Once an order is accepted, Firm to Firm order matching in Sigma
        X2 follows price/broker/time matching priority and only matches buyers and
        sellers at prices within the NBBO consistent with the Counterparty Classification
        Framework described below in response to Part III, Items 13 and 14.  As outlined
        in Part III, Item 9.a, Firm orders always have matching priority over Conditional
        orders.  Conditional orders will match with eligible contra-side Firm orders
        ahead of eligible contra-side Conditional orders, including Conditional orders
        that have a better price or earlier entry time than a contra-side Firm order(s).
        \ Conditional to Firm order matching (like Firm to Firm order matching) follows
        price/broker/time priority; Conditional to Conditional order matching follows
        price/broker/size/time priority. The Counterparty Classification Framework
        does not apply to Conditional order matching.\nSigma X2 attempts to match
        orders upon the arrival of a new order or upon a price change (either a change
        to the NBBO or a Participant-initiated price change). Throughout the trading
        session, orders may be modified, replaced, cancelled, or executed. At the
        end of the trading session, all open orders are cancelled.</taPart3Item11aStrucOfNmsStk>\n
        \     <rbPart3Item11bIsMeansFeciltsSameForAll>Y</rbPart3Item11bIsMeansFeciltsSameForAll>\n
        \     <taPart3Item11cRulsProcsOfNmsStk>Rules governing pricing and matching
        priority are described below.\nMATCHING PRIORITY\nFor Firm to Firm order matching,
        Sigma X2's matching logic is based on price/broker/time priority and the Counterparty
        Classification Framework (See Part III, Item 13.a.). At a given price level,
        this logic prioritizes opposite side orders from the same or affiliated broker-dealer
        Direct Subscriber(s) for crossing as long as they are eligible to match within
        the Counterparty Classification Framework. As outlined in Part III, Item 9.a,
        Firm orders always have priority over Conditional orders.  Conditional orders
        will match with eligible contra-side Firm orders ahead of eligible contra-side
        Conditional orders, including Conditional orders that have a better price
        or earlier entry time than a contra-side Firm order(s). Conditional to Firm
        order matching (like Firm to Firm order matching) follows price/broker/time
        priority; Conditional to Conditional order matching follows price/broker/size/time
        priority.   The Counterparty Classification Framework does not apply to Conditional
        order matching.\n\nBy default, matching priority exists at the individual
        broker-dealer Direct Subscriber market participant identifier (\"MPID\") level.
        Alternatively, a broker-dealer Direct Subscriber can modify the default such
        that its \"broker\" status is instead based on all of its affiliated MPIDs.
        Under this approach, order flow routed from customers, businesses or desks
        of a broker-dealer Direct Subscriber under multiple affiliated MPIDs will
        have priority to execute with opposite side orders routed to Sigma X2 by the
        broker-dealer Direct Subscriber using any of the affiliated MPIDs. Direct
        Subscribers can opt-out of the \"broker\" priority element by selecting the
        self-match prevention condition, as further described in the \"Other Order
        Parameters and Conditions\" discussion in this section.\n\nGSCO broker status
        is inclusive of all of its affiliated MPIDs. Non-broker-dealer Direct Subscribers,
        as clients of GSCO, will receive matching priority with GSCO and its affiliated
        MPIDs. Specifically, all Firm and Conditional orders routed to Sigma X2 under
        a GS identifier (\"GSID\"), including GSCO client and/or principal orders,
        shall receive matching priority across all GSCO MPIDs.\n\nOrders in Sigma
        X2 are treated as liquidity-taking or liquidity-providing based on their time
        of order arrival. When Sigma X2 assesses two orders for a potential match,
        the liquidity-providing order is the order that was first-in-time, and the
        liquidity-taking order is the order that was second-in-time. This applies
        to Firm and Firm Up orders.  As described in Part III, Item 9.a, Conditional
        orders do not receive executions and, accordingly, are not designated as liquidity-providing
        or liquidity-taking.  Firm and Firm Up orders subject to the Post-Only condition
        (described below), which are always liquidity-providing orders, are only assessed
        for potential matching with orders that Sigma X2 received later-in-time.\nFor
        example, a common execution (matching scenario) occurs in Sigma X2 when a
        resting Firm Day order executes against an incoming IOC order and Sigma X2
        classifies the resting Day order as liquidity-providing and the IOC order
        as liquidity-taking. Please refer to the attached Matching Scenarios grid
        for examples with respect to Firm and Firm Up orders. If a Conditional order
        is entered with a Post-Only condition, only a contra order entered later-in-time
        can be a match for the Conditional order, generating a Firm Up Request.  Please
        see Part III, Item 9.a. for additional order matching information for Conditional
        orders.\n\nAs noted above, matching priority can be impacted where Participants
        choose to impose certain conditions (e.g., self-match prevention) on their
        Firm and Conditional orders to limit interaction with orders in Sigma X2,
        as further described in the \"Other Order Parameters and Conditions\" discussion
        in this section.\n\nAny change to a Firm or Conditional order by a Participant
        will reset its time priority, with the exception of reduction in the size
        of an order or a short sale change (i.e., short sell order changed to long
        sell order or long sell order changed to a short sell order) as further discussed
        below. System updates to the Assigned Limit Price of an order will not change
        time priority (e.g., Pegged Orders).\n\nOTHER ORDER PARAMETERS AND CONDITIONS\nThe
        execution priority (outlined above) may change in instances where the Participants
        choose to impose certain conditions on their orders, including:\n- Minimum
        Executable Quantity (\"MinQty\") - allows Participants to specify a minimum
        quantity for execution against any single contra order. Participants can select
        this feature on an order-by-order basis.\nSigma X2 does not aggregate contra-side
        orders to meet the MinQty. The MinQty specified on an order can only be filled
        by a single contra-side order. To illustrate, if a Participant's order has
        a MinQty of 300 shares, that order can be filled only against a single contra-side
        order of at least 300 shares, not by multiple contra-side orders totaling
        300 shares.\nWhen multiple contra-side orders are matched in one matching
        cycle against an order with MinQty enabled, each individual contra-side order
        must satisfy the MinQty, but it is possible for a single execution to be less
        than the MinQty. To illustrate, if a Participant has an order for 500 shares
        and a MinQty of 300 shares and there are two contra-side orders of 300 shares
        each, the Participant's 500 share order will execute against each 300-share
        order--first for 300 shares and then for the remaining 200 shares--since both
        contra-side orders meet the Participant's MinQty.\nParticipants may utilize
        Tag 9500 (MinQtyInstruction) to specify the method by which the MinQty instructions
        are to be applied in the event of a leaves quantity that is less than the
        MinQty: A, which specifies that the order becomes All or None if the leaves
        quantity is less than the minimum executable quantity; or M, which specifies
        that the order is canceled back if the leaves quantity is less than the minimum
        executable quantity. Under the default setting, an order will become All or
        None if the leaves quantity is less than the minimum executable quantity.
        \ Firm Up orders only support the M value.\n- Self-Match Prevention - allows
        Participants to block a match with themselves for regulatory reasons (e.g.,
        prevents wash trades). Participants can select this feature at the Participant-level
        (i.e., at the MPID- or GSID-level, as applicable) or on an order-by-order
        basis.\n- Affiliate-Match Prevention - allows Participants to block a match
        with an affiliated Participant. Sigma X2 applies this feature at the Participant-level.\n-
        Agency-Only Execution - allows Participants to block principal executions
        with GSCO (e.g., where required pursuant to Section 28(e) of the Exchange
        Act). Sigma X2 applies this feature at the Participant-level.\n\n- Post-Only
        -  accepted on Firm and Conditional orders, allows Participants to submit
        orders that will only execute when they are first-in-time (i.e., liquidity-providing
        orders). Post-Only orders do not price slide and will be given an Assigned
        Limit Price upon entry (as described in Part III, Item 7.a).  They can be
        entered with any peg type. Participants can select this feature on an order-by-order
        basis.\n\n- Counterparty Classification - for Firm orders only, allows liquidity-providing
        Participants (described above) to designate the category or categories of
        liquidity-taking orders with which their liquidity-providing orders may interact
        (described in Part III, Item 13 a.). Participants can select this feature
        at the Participant-level or on an order-by-order basis.\n\nIn accordance with
        such instructions, Sigma X2 matching logic would bypass matching of Firm and
        Conditional orders as required by the above conditions. Participants can request
        the application of the above conditions through their Coverage teams. GSCO
        Coverage employees implement such requests, which become effective the following
        trading day.\nAdditional non-discretionary rules and procedures of Sigma X2
        include:\nPRICE IMPROVEMENT\nEither the provider or taker of liquidity, or
        both, can receive price improvement. Price improvement is not necessarily
        split equally between a liquidity provider and a liquidity taker; instead,
        the execution price will be the price closest to the midpoint of the NBBO.
        Included as an attachment is a chart that illustrates price improvement in
        Sigma X2.\nPRICE PROTECTION MECHANISMS\nAll Firm and Conditional orders in
        Sigma X2 require a Limit Price and will be given an Assigned Limit Price as
        described in Part III, Item 7.a. No order will be given an execution that
        would violate the order's Limit Price. No executions will take place outside
        the NBBO. Sigma X2 will suspend matching in a symbol that is currently quoted
        in a LULD straddle state.\n\nSHORT SALES AND REGULATION SHO\nParticipants
        may enter short sale orders in compliance with Regulation SHO. This rule applies
        to short sale orders from U.S. registered broker-dealer subscribers and, as
        discussed below, each Firm and Conditional short sale order must specify that
        a locate has been obtained in accordance with Regulation SHO Rule 203(b)(1).
        Sigma X2 will rely on the locate exemption provided in Rule 203(b)(2)(i) when
        accepting short sale orders from its U.S. registered broker-dealer Direct
        Subscribers that are obligated to comply with Rule 203(b)(1). For non-broker-dealer
        Direct Subscribers, Sigma X2 will reject any short sale order that does not
        identify the broker who provided the locate.\nFor short sale orders subject
        to Rule 201 under Regulation SHO that are not permissibly priced for execution
        (i.e., not priced above the Constructed NBB or SIP NBB (as defined in response
        to Part III, Item 23), as the case may be), the Assigned Limit Price will
        be the lowest permissible price in compliance with Rule 201 (including in
        sub-penny increments for orders that may be priced in sub-pennies pursuant
        to Rule 612 under Regulation NMS). Such orders are executed at the Assigned
        Limit Price if there is an available contra-side order or, if not, they are
        held for execution at the new Assigned Limit Price or better. As quoted prices
        change, the Assigned Limit Price is updated to the lowest permissible price
        for execution under Rule 201 down to an order's original limit price. An order
        that is re-priced in this manner under Rule 201 does not have its original
        priority changed. Instead, the priority of such an order is established based
        on its original Assigned Limit Price.\nLOCKED/CROSSED MARKETS\nSigma X2 will
        not execute Firm or Firm Up orders during a locked or crossed market.\nTIME-STAMPING
        OF ORDERS AND EXECUTIONS\nOrders are timestamped in microseconds at the time
        they are accepted by Sigma X2. Executions are timestamped in microseconds
        at the time that orders are matched.\nERRORS\nGSCO handles errors involving
        Sigma X2 in accordance with the Firm's error policy. Bona fide errors are
        booked to the Sigma X2 error account. To remedy an error, using the Sigma
        X2 error account, GSCO will buy or sell shares, as needed, including through
        the use of GSCO algorithms and SOR, which may result in executions at various
        exchanges and market centers, including Sigma X2.</taPart3Item11cRulsProcsOfNmsStk>\n
        \     <rbPart3Item11dIsProcsRulsSameForAll>Y</rbPart3Item11dIsProcsRulsSameForAll>\n
        \     <rbPart3Item12aIsAnyFrmlInfrmlArngmnts>N</rbPart3Item12aIsAnyFrmlInfrmlArngmnts>\n
        \     <part3Item13aSegmntDtls rbPart3Item13aIsOrdrTiSegmntd=\"Y\">\n        <taPart3Item13aSegProcdurDtls>As
        described below, for Firm orders only, on either an order-by-order or Participant-level
        basis (by MPID or assigned GSID, as applicable), through a framework called
        Counterparty Classification, Sigma X2 offers Participants the ability to restrict
        the interaction of their liquidity-providing orders with specified categories
        of liquidity-taking orders. These categories are referred to as Taker Categories
        \"a,\" \"b,\" or \"c.\"  Liquidity-taking order flow is mapped into these
        Taker Categories based upon the results of an objective post-trade mark-out
        analysis (the \"Mark-out Analysis\"). GSCO performs the Mark-out Analysis
        for all liquidity-taking orders on approximately a monthly basis (and for
        new order flow, on an ad-hoc basis). Depending upon whether a Participant
        is a Direct or Indirect Subscriber, and other relevant characteristics and
        facts described below, the Mark-out Analysis may be performed for the entirety
        of a Participant's liquidity-taking order flow or with respect to identified
        subsets (i.e., segments) of such flow.\nMARK-OUT ANALYSIS:\nGSCO maps all
        Direct Subscriber liquidity-taking order flow in Sigma X2 into three Taker
        Categories (i.e., \"a,\" \"b,\" or \"c\") based on the Mark-out Analysis.
        To wit, this analysis and mapping is performed for all liquidity-taking orders
        in Sigma X2 - - i.e., all Direct Subscriber client orders (broker-dealer and
        non-broker-dealer Direct Subscribers) and all orders entering Sigma X2 under
        GSCO's MPID as a Direct Subscriber (GSCO principal orders and, separately,
        all Indirect Subscribers' orders). The GSCO Mark-out Analysis is a standardized
        assessment, across all securities, of the short-term price movement in a security
        that is associated with liquidity-taking executions. Specifically, the Mark-out
        Analysis evaluates short-term price movement in a security (i.e., impact on
        the security's mid-quote) that is measured on a percentage basis within a
        particular time horizon surrounding an execution. GSCO uses the results of
        the Mark-out Analysis to determine whether the executions were: (i) least
        likely to be unfavorable for the liquidity provider (Taker Category \"a\");
        (ii) more likely to be unfavorable for the liquidity provider (Taker Category
        \"b\"); or (iii) most likely to be unfavorable for the liquidity provider
        (Taker Category \"c\"). GSCO uniformly applies the Mark-out Analysis to all
        liquidity-taking order flow--whether at the MPID-level, GSID-level, for individual
        Taker Tokens, or on an aggregated Taker Token basis (as described below).
        See \"Taker Category Assessment - - Use of MPIDS, GSIDs, and Taker Tokens\"
        and \"Taker Tokens and 'Individual' vs. 'Aggregate' Execution Thresholds.\"\nOn
        approximately a monthly-basis, GSCO refreshes the Mark-out Analysis for all
        Direct Subscribers and, accordingly, a Direct Subscriber's assigned Taker
        Category may change, without notice, following each such analysis. After GSCO
        performs a Mark-out Analysis, any new or changed Taker Category(ies) will
        become effective the following trading day. In addition, GSCO will perform
        an ad-hoc Mark-out Analysis to determine and assign a Taker Category for a
        new Direct Subscriber's order flow as well as in response to an existing Direct
        Subscriber's identification of new order flow. Please see \"Taker Category
        Assessment: Use of MPIDs, GSIDs and Taker Tokens.\"  Following GSCO's performance
        of such ad-hoc Mark-out Analysis and determination of any new or changed Taker
        Category assignments, the new or changed Taker Category(ies) will become effective
        within seven business days.\nTo maintain the integrity of the Counterparty
        Classification Framework, GSCO may periodically, as needed, reassess and modify
        the metrics used to determine the three Taker Categories.\nCOUNTERPARTY CLASSIFICATION
        AND ORDER INTERACTION:\nAs noted above, for Firm orders only, on either an
        order-by-order or Participant-level basis, Sigma X2 offers Participants the
        ability to restrict the interaction of their liquidity-providing orders with
        a specified category (or categories) of liquidity-taking orders (i.e., Taker
        Categories \"a,\" \"b,\" or \"c\") through the designation of a \"Contra Category.\"
        \ A Participant's Contra Category selection (\"a,\" \"b,\" or \"c\") for a
        liquidity-providing order determines the Taker Category (or Taker Categories)
        with which the liquidity-providing order may interact.\nThe impact of selecting
        Contra Category \"a,\" \"b,\" or \"c\", is as follows.  When a Participant
        sending a liquidity-providing order selects Contra Category \"a,\" the Participant's
        order will only interact with Taker Category \"a\" orders. If a Participant
        sending a liquidity-providing order selects Contra Category \"b,\" the Participant's
        order may potentially interact with Taker Category \"a\" or \"b\" orders.
        If a Participant sending a liquidity-providing order selects Contra Category
        \"c,\" the Participant's order may potentially interact with Taker Category
        \"a,\" \"b,\" or \"c\" orders. Included as an attachment is a chart illustrating
        the Counterparty Classification Framework and the interaction of liquidity-providing
        and liquidity-taking orders within this framework.\nIf a Direct Subscriber
        sends liquidity-providing orders without selecting a Contra Category, such
        liquidity-providing orders will be defaulted to Contra Category \"c.\"\nFor
        Indirect Subscribers' orders that access Sigma X2 through the Indirect Subscribers'
        use of GSCO's algorithms or SOR, the relevant GSCO algorithm or SOR logic
        will determine the Contra Category for liquidity-providing orders. For example,
        liquidity seeking algorithmic and/or SOR strategies may be willing to provide
        liquidity to all liquidity-taking Taker Categories, while more passive strategies
        may limit the set of liquidity-taking Taker Categories with which they interact.\nIndirect
        Subscribers that access Sigma X2 through GSCO's DMA System may select a Contra
        Category to be applied to all of their liquidity providing orders. If they
        do not select a Contra Category, their liquidity providing orders will be
        defaulted to Contra Category \"c.\"\nTAKER CATEGORY ASSESSMENT--USE OF MPIDS,
        GSIDS, AND TAKER TOKENS:\nFor purposes of GSCO's performance of its Mark-out
        Analysis on liquidity-taking orders, unless a Direct Subscriber chooses to
        further segment its order flow through the use of Taker Tokens (as described
        below), GSCO will analyze broker-dealer Direct Subscriber orders by assigned
        MPID and non-broker-dealer Direct Subscriber orders by assigned GSID. When
        conducting its Mark-out Analysis, GSCO will not aggregate trading activity
        across multiple MPIDs or GSIDs utilized by a particular Direct Subscriber.
        Instead, GSCO will conduct its Mark-out Analysis for each individual MPID
        or GSID. Accordingly, broker-dealer Direct Subscribers sending liquidity-taking
        orders can segment their orders by utilizing multiple MPIDs, and non-broker-dealer
        Direct Subscribers sending liquidity-taking orders can segment their orders
        by utilizing multiple GSIDs.\nIn addition to using multiple MPIDs or GSIDs
        for purposes of GSCO's Mark-out Analysis and Taker Category assignment, a
        Direct Subscriber (whether broker-dealer or non-broker-dealer) sending liquidity-taking
        orders can further segment its order flow by using one or more Taker Tokens.
        A Taker Token is an indicator a Direct Subscriber can attach to an order.
        As described below, GSCO will conduct its Mark-out Analysis on orders with
        the same Taker Token attached to them (i.e., orders with the same Taker Token
        attached to them are analyzed as a group and, accordingly, will be mapped
        to the same Taker Category). A Direct Subscriber can utilize multiple Taker
        Tokens. Specifically, through the use of Taker Tokens, a Direct Subscriber
        can further segment its orders associated with a particular MPID or GSID in
        various manners such as to segment business units, particular underlying customers,
        or child orders associated with particular trading strategies.\nFor example,
        a broker-dealer Direct Subscriber could route orders to Sigma X2 under one
        MPID and have three Taker Tokens associated with that one MPID--one for its
        market making desk, one for its wealth management desk, and one for the remainder
        of its order flow.\nGSCO, as a Direct Subscriber, can elect to segment its
        order flow by attaching a Taker Token to each order it routes to Sigma X2.
        Like other Direct Subscribers, GSCO can apply these Taker Tokens in various
        manners including to segment particular Indirect Subscribers or child orders
        associated with GSCO's or Indirect Subscribers' use of particular GSCO algorithmic
        or SOR routing strategies. With respect to child orders associated with GSCO
        algorithmic or SOR routing strategies, each liquidity-taking order will be
        associated with a Taker Token that is mapped to a Taker Category in accordance
        with the results of the Mark-out Analysis.\nTAKER TOKENS AND \"INDIVIDUAL\"
        VS. \"AGGREGATE\" EXECUTION THRESHOLDS:\nAs described below, where a Direct
        Subscriber utilizes Taker Tokens to further segment its order flow, GSCO will
        conduct a Mark-out Analysis of the Direct Subscriber's Taker Token liquidity-taking
        executions (where it has sufficient data), on an individual Taker Token basis,
        or, on an aggregated basis, to determine the appropriate Taker Category for
        the Taker Token orders.\nAny new Taker Token used by a Direct Subscriber after
        GSCO performs its most recent Mark-out Analysis will be defaulted to a Taker
        Category, as described below, until the individual Taker Token is associated
        with a sufficient number of executions for GSCO to perform a Mark-out Analysis
        for the individual Taker Token.\nA Direct Subscriber must have sufficient
        transaction history associated with an individual Taker Token for GSCO to
        perform a Mark-out Analysis of orders associated with that Taker Token. Specifically,
        to perform the Mark-out Analysis on a particular Taker Token, the number of
        executions effected by a Subscriber under that Taker Token must equal or exceed
        an amount determined by GSCO. When the number of executions for the specific
        Taker Token reach the threshold established by GSCO (\"Individual Execution
        Threshold\"), GSCO will conduct a Mark-out Analysis of that Taker Token and
        will assign orders associated with that Taker Token to the corresponding Taker
        Category (i.e., \"a,\" \"b,\" or \"c\"). GSCO will perform the Mark-out Analysis
        on the individual Taker Token as soon as the Individual Execution Threshold
        is satisfied - - i.e., there is no minimum or maximum number of days over
        which the Individual Execution Threshold must be satisfied.\nIf an individual
        Taker Token does not reach the Individual Execution Threshold and, therefore,
        GSCO cannot conduct a Mark-out Analysis of that Taker Token (\"Insufficient
        Taker Token\"), GSCO will calculate the Direct Subscriber's aggregate number
        of executions. If the aggregate executions, inclusive of all Taker Tokens
        associated with the corresponding MPID or GSID reach the threshold number
        of executions established by GSCO (\"Aggregate Execution Threshold\"), GSCO
        will perform the Mark-out Analysis for the aggregate executions and will default
        the Insufficient Taker Token orders to the appropriate Taker Category based
        on the aggregate analysis. GSCO will perform the Mark-out Analysis in this
        circumstance as long as the Aggregate Execution Threshold is satisfied --
        there is no minimum or maximum number of days over which the Aggregate Execution
        Threshold must be satisfied.\nNote, if and when the executions associated
        with an Insufficient Taker Token reach or exceed the Individual Execution
        Threshold, GSCO will then, at that time, analyze and map the individual Taker
        Token to a Taker Category. Finally, if the Direct Subscriber's trading activity
        for the individual Taker Token does not satisfy the Individual Execution Threshold
        and the Direct Subscriber does not satisfy the Aggregate Execution Threshold
        either, GSCO will assign Taker Category \"b\" to the Insufficient Taker Token
        orders as a default.\nThe Taker Token execution thresholds necessary for a
        Mark-out Analysis to be performed, whether on an individual Taker Token or
        on an aggregated basis, are uniformly applicable to all Direct Subscribers.
        Both the Individual Execution Threshold and the Aggregate Execution Threshold
        are subject to GSCO's discretion and may change from time-to-time.\nThe following
        are examples of the mark-out assessments discussed above. For the purposes
        of the examples, assume an Individual Execution Threshold of 200 executions
        and an Aggregate Execution Threshold of 600 executions.\nExample A:\n- Direct
        Subscriber XYZ utilizes one Taker Token associated with 550 executions. The
        Direct Subscriber's executions exceed the Individual Execution Threshold.\n-
        Therefore, GSCO will conduct a Mark-out Analysis and map the Taker Token orders
        to the appropriate Taker Category.\nExample B:\n- Direct Subscriber XYZ utilizes
        one Taker Token associated with 30 executions. The Direct Subscriber's executions
        fall below the Individual Execution Threshold (i.e., the Taker Token is an
        Insufficient Taker Token).\n- If the Direct Subscriber does not have any additional
        executions that can be aggregated, GSCO will default the Taker Token orders
        to Taker Category \"b.\"\nExample C:\n- Direct Subscriber XYZ utilizes two
        Taker Tokens. Taker Token 1 is associated with 550 executions, which exceed
        the Individual Execution Threshold. GSCO will conduct a Mark-out Analysis
        and map Taker Token 1 orders to the appropriate Taker Category.\n - The Direct
        Subscriber's Taker Token 2 is associated with 30 executions, which fall below
        the Individual Execution Threshold (i.e., Taker Token 2 is an Insufficient
        Taker Token). GSCO will aggregate Taker Token 2 executions with the Direct
        Subscriber's other Taker Token executions (in this example, with Taker Token
        1 executions). Subscriber's total executions fall below the Aggregate Execution
        Threshold (550 + 30 = 580). Therefore, GSCO will default Taker Token 2 orders
        to Taker Category \"b.\"\nExample D:\n- Direct Subscriber XYZ utilizes two
        Taker Tokens. Taker Token 1 is associated with 550 executions, which exceed
        the Individual Execution Threshold. GSCO will conduct a Mark-out Analysis
        and map Taker Token 1 to the appropriate Taker Category.\n- The Direct Subscriber's
        Taker Token 2 is associated with 130 executions, which fall below the Individual
        Execution Threshold (i.e., Taker Token 2 is an Insufficient Taker Token).
        GSCO will aggregate Taker Token 2 executions with the Direct Subscriber's
        other Taker Token executions (in this example, with Taker Token 1 executions).
        Subscriber's total executions exceed the Aggregate Execution Threshold (550
        + 130 = 680). GSCO will conduct a Mark-out Analysis and map Taker Token 2
        orders to the appropriate Taker Category based upon the aggregate analysis.</taPart3Item13aSegProcdurDtls>\n
        \       <rbPart3Item13bIsSegmntatnSameForAll>Y</rbPart3Item13bIsSegmntatnSameForAll>\n
        \       <part3Item13dDsclrContntDtls rbPart3Item13dIsSegCatgDisclosd=\"Y\">\n
        \         <taPart3Item13dDsclosrContntDtls>Whether orally or in a written
        performance summary, upon request, GSCO will inform a Participant of its designated
        segmentation classification(s) (i.e., Taker Category(ies)) for its order flow
        to Sigma X2. A Participant cannot contest its designated Taker Category. Written
        performance summaries provided to requesting Participants include, among other
        things, the Participant's (i) total executed shares in Sigma X2; (ii) percentage
        of liquidity-taking vs. liquidity-providing executions; (iii) order type breakdown
        information; (iv) execution distribution by Contra Category/Taker Category
        for orders providing liquidity; and (v) execution distribution by Taker Category
        for orders taking liquidity. GSCO does not provide counterparty information
        by Taker Category on an order-by-order basis.\nSeparately, certain GSCO employees,
        including Segmentation Governance Working Group employees, whose responsibilities
        may include execution quality and mark-out profile analysis for Sigma X2,
        have access to segmentation categorization (i.e., Taker Category assignments)
        for all Participants.</taPart3Item13dDsclosrContntDtls>\n          <rbPart3Item13eIsDsclosrSameForAll>Y</rbPart3Item13eIsDsclosrSameForAll>\n
        \       </part3Item13dDsclrContntDtls>\n      </part3Item13aSegmntDtls>\n
        \     <rbPart3Item13cIsCustmrOrdr>Y</rbPart3Item13cIsCustmrOrdr>\n      <part3Item14aCntrPrtySelectnDtls
        rbPart3Item14aIsDsgToIntrctOrNot=\"Y\">\n        <taPart3Item14aCntrPrtyDtls>For
        Firm and Conditional orders, Participants can limit the counterparties with
        which their orders interact through the use of certain order parameters and
        conditions (e.g., use of MinQty to specify a minimum quantity for execution
        against any single contra order or use of Affiliate-Match Prevention to block
        a match with an affiliated Participant) (See Part III, Item 11.c.).  For Firm
        orders only, counterparties can be limited by the Counterparty Classification
        Framework (e.g., to allow liquidity-providing Participants to designate the
        category or categories of liquidity-taking orders with which they may interact)
        (See Part III, Item 13.a.).   Additionally, a Direct Subscriber can limit
        the interaction of Firm orders with Conditional orders on an order by order
        basis or opt-out at the FIX session level (See Part III, Item 9.a.).</taPart3Item14aCntrPrtyDtls>\n
        \       <rbPart3Item14bIsSelectnSameForAll>Y</rbPart3Item14bIsSelectnSameForAll>\n
        \     </part3Item14aCntrPrtySelectnDtls>\n      <rbPart3Item15aIsElectrncCommu>N</rbPart3Item15aIsElectrncCommu>\n
        \     <part3Item15bSubSctbDtls rbPart3Item15bIsSubScrbOrdBnd=\"Y\">\n        <taPart3Item15bSubscrBndDtls>GSCO
        does not display Sigma X2 Firm or Conditional orders to Participants or outside
        of Sigma X2. Indirect Subscribers' Firm and Conditional orders can pass through
        GSCO's SOR, either directly, or, indirectly through the use of a GSCO algorithm,
        before accessing Sigma X2. GSCO's SOR is aware of orders it has posted in
        all venues, including Sigma X2. The SOR uses knowledge of Firm orders to predict
        venue-level fill rates. This data is not communicated outside of the SOR.
        Alternatively, Indirect Subscribers' DMA orders directed to Sigma X2 pass
        through the GSCO DMA System. The DMA System does not use knowledge of such
        order information.\n\nSeparately, certain personnel (e.g., Execution Coverage
        for Indirect Subscribers) have access to such Indirect Subscriber orders in
        the same manner that they have access to information about the orders of their
        clients routed to other market centers (See Part II, Item 7.d.).\n\nAs outlined
        in Part III, Item 9.a, if a match is found for a Conditional order, an invitation
        to trade, known as a Firm Up Request, is sent to the Participant.  The Firm
        Up Request will contain a unique Firm Up ID, the quantity of the conditional
        match, and the order details of the Conditional order to which it relates
        (e.g., price).  Other than the quantity of the conditional match, no other
        details of the matching contra-side order are transmitted on the Firm Up Request.</taPart3Item15bSubscrBndDtls>\n
        \       <rbPart3Item15cIsDsplyProcSameForAll>Y</rbPart3Item15cIsDsplyProcSameForAll>\n
        \     </part3Item15bSubSctbDtls>\n      <rbPart3Item16aIsInstRoutd>N</rbPart3Item16aIsInstRoutd>\n
        \     <rbPart3Item17aIsDiffBtwnOrdTITrtmnt>N</rbPart3Item17aIsDiffBtwnOrdTITrtmnt>\n
        \     <rbPart3Item17bIsTrtmntSameForAll>Y</rbPart3Item17bIsTrtmntSameForAll>\n
        \     <rbPart3Item18aIsOutsdeTrdingHrs>N</rbPart3Item18aIsOutsdeTrdingHrs>\n
        \     <taPart3Item19aSrvcUsgFees>Subscribers may access Sigma X2 directly
        (i.e., Direct Subscribers) or indirectly (i.e., Indirect Subscribers, whose
        fees are discussed below in response to Item 19.b.) and can utilize both ATS
        and non-ATS GSCO offered products and services. Direct Subscribers are charged
        commissions for executions in Sigma X2 on a per share basis. These commissions
        are consistent across security and order types. GSCO has the discretion to
        charge Direct Subscribers commissions that range from $.001 per share up to
        $.03 per share. In determining the commission rate, GSCO considers the Direct
        Subscriber's overall relationship with GSCO including the range of GSCO products
        and services the Direct Subscriber utilizes. Note, some GSCO clients are both
        Direct Subscribers and Indirect Subscribers (i.e., they access Sigma X2 both
        directly and indirectly) and may pay commissions specific to each type of
        access to Sigma X2.\nThere are no subscription or connectivity fees for accessing
        Sigma X2.</taPart3Item19aSrvcUsgFees>\n      <taPart3Item19bBundldSrvcUsgFees>Indirect
        Subscribers pay commissions based on the range of services they elect to receive
        (e.g., bundled services, which include, among other things, execution, research,
        market color, corporate access or execution-only services). Commission rates
        ($ per shares executed) for all executions in Sigma X2 are negotiated on a
        client-by-client basis, and the commission rate is consistent across security
        and order types. The commission rate applied to clients receiving bundled
        services is: (i) not specific to executions in Sigma X2, (ii) based on the
        individual client's overall relationship with GSCO, and (iii) is subject to
        change at any time.</taPart3Item19bBundldSrvcUsgFees>\n      <taPart3Item19cRbtDiscOfFees>There
        are no rebates or discounts offered to Participants.</taPart3Item19cRbtDiscOfFees>\n
        \     <taPart3Item20aSuspndProcdur>GSCO has implemented systematic controls
        to suspend or stop trading in a specific NMS Stock or the entire ATS for regulatory
        compliance reasons or due to technology-related circumstances. In the initial,
        daily setup of the system, for example, a Restricted Trading List (\"RTL\")
        is submitted which does not allow specific NMS Stocks to be traded. Intraday
        changes to the RTL are propagated into Sigma X2. Additionally, Sigma X2 has
        system controls designed to ensure that the ATS does not trigger the volume
        threshold for Regulation SCI based upon the average daily dollar volume in
        a single security or the Regulation ATS fair access volume threshold--Sigma
        X2 will halt and/or shut down trading in the relevant symbol(s) prior to triggering
        the threshold(s).\nSigma X2 will suspend matching functionality in specific
        symbols under the following conditions: a symbol is subject to a regulatory
        trading halt or trading pause; a symbol is currently quoted in a LULD straddle
        state; or when Sigma X2's market data is believed to be delayed or incorrect.\nIn
        addition, market data performance (including latency, staleness, and connectivity
        issues) is monitored in real-time. This process includes monitoring of the
        time interval between the time stamps on market data transmitted from the
        respective feeds and the time of receipt by the Sigma X2 matching engine.
        If this process identifies a latency greater than a defined threshold, trading
        in the relevant security will be suspended.\nIf any issues are identified,
        such issues are escalated and addressed by GSCO in real-time, and actions
        taken could be to halt or pause the system. During a pause, open orders remain
        on the book and Participants may amend or cancel such orders, but Sigma X2
        will not act on, i.e., match or execute, the orders. Similarly, during a pause,
        Sigma X2 will accept new orders, but will not act on, i.e., match or execute,
        the orders. During a halt, open orders will be cancelled and new orders will
        be rejected.</taPart3Item20aSuspndProcdur>\n      <rbPart3Item20bIsSuspndProcdurSameFrAll>Y</rbPart3Item20bIsSuspndProcdurSameFrAll>\n
        \     <taPart3Item21aMtrlArngmntDtls>The primary trade reporting facility
        used by Sigma X2 is the Nasdaq TRF. Trades are submitted using the ACT Specifications.
        The back-up trade reporting facility is the NYSE TRF. If the primary TRF is
        not available, Sigma X2 would submit trades to the back-up TRF using the NYSE
        TRF Specifications. Trades are reported using Sigma X2 as an intermediary.
        When a trade occurs between a Buyer and a Seller on Sigma X2, a Buyer vs ATS
        trade and a Seller vs ATS trade will be reported for media and non-media purposes.
        The only exception is when a Principal GSCO order trades on Sigma X2. One
        half of the trade will not be reported to the TRF because GSCO is the owner
        of Sigma X2. Therefore, Principal GSCO vs ATS will not be reported.</taPart3Item21aMtrlArngmntDtls>\n
        \     <rbPart3Item21bIsMtrlArngmtSameFrAll>Y</rbPart3Item21bIsMtrlArngmtSameFrAll>\n
        \     <taPart3Item22aMtrlArngmntDtls>GSCO is a self-clearing broker-dealer
        and a member of the National Securities Clearing Corporation (\"NSCC\") and
        the Depository Trust Company (\"DTC\"). Accordingly, GSCO submits its side
        of all trades for clearing at NSCC and settlement at DTC.\nSigma X2 executions
        are cleared and settled in the same manner as any other over-the-counter transaction
        executed by GSCO. Sigma X2 does not have any unique procedures or material
        arrangements to facilitate the clearance and settlement of transactions. GSCO
        becomes a counterparty to all Sigma X2 transactions by sending executions
        occurring within Sigma X2 to GSCO's order management and trade processing
        systems, inserting GSCO's broker code for Sigma X2 (SGMT) into FIX Tag 30,
        and submitting to NSCC.\nFor broker-dealer Subscribers, GSCO submits its side
        of the trades to NSCC on a trade-for-trade basis. For non-broker-dealer Subscribers,
        GSCO submits trades in aggregate pursuant to customer instructions using the
        DTC ID process.\nBroker-dealer Subscribers may clear their transactions through
        a Qualified Service Representative (\"QSR\") agreement.\nFor non-broker-dealer
        Subscribers, GSCO utilizes the DTC ID process for delivery versus payment
        settlement as instructed.</taPart3Item22aMtrlArngmntDtls>\n      <rbPart3Item22bIsMtrlArngmtSameFrAll>Y</rbPart3Item22bIsMtrlArngmtSameFrAll>\n
        \     <taPart3Item23aMrktDatSrc>Sigma X2 executes orders using an NBBO constructed
        by Ocean, a third-party technology provider for Sigma X2. Ocean constructs
        the NBBO using a combination of full network redundant direct market data
        feeds and market data disseminated by the Securities Information Processors
        (\"SIPs\") (the \"Constructed NBBO\"). Specifically, Sigma X2 uses direct
        market data feeds for all exchanges other than LTSE (which does not offer
        a direct market data feed). Separately, Sigma X2 uses full network redundant
        SIP feeds as a secondary source of the NBBO.\n\nThe Constructed NBBO is used
        to price, prioritize, and execute orders. The ATS will arbitrate between the
        two feeds, direct or SIP, based on the detection of any market data latency.
        If there is an issue with the Constructed NBBO, transactions in Sigma X2 will
        be priced solely using the NBBO disseminated by the SIPs. Accordingly, all
        executions in Sigma X2 are programmed to match at or within the Constructed
        NBBO or the SIP NBBO.</taPart3Item23aMrktDatSrc>\n      <rbPart3Item23bIsSrcSameFrAll>Y</rbPart3Item23bIsSrcSameFrAll>\n
        \     <rbPart3Item24aIsSubScrbrOrdr>N</rbPart3Item24aIsSubScrbrOrdr>\n      <rbPart3Item25aIsAvgDlyTradinVolExcd>N</rbPart3Item25aIsAvgDlyTradinVolExcd>\n
