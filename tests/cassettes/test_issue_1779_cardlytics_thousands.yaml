        style=\"margin-top:6pt\"><font style=\"color:#000000;font-family:'Times New
        Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">Non-GAAP Measures
        and Other Performance Metrics</font></div><div style=\"margin-top:6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">To
        supplement the financial measures presented in our press release and related
        conference call or webcast in accordance with generally accepted accounting
        principles in the United States (&#8220;GAAP&#8221;), we also present the
        following non-GAAP measures of financial performance in this press release&#58;
        Billings, Adjusted Contribution, Adjusted EBITDA, Adjusted Net Loss,  Adjusted
        Net Loss per share and Free Cash Flow, as well as certain other performance
        metrics, such as MQUs and ACPU.</font></div><div style=\"margin-top:6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">A
        &#8220;non-GAAP financial measure&#8221; refers to a numerical measure of
        our historical or future financial performance or financial position that
        is included in (or excluded from) the most directly comparable measure calculated
        and presented in accordance with GAAP in our financial statements. We provide
        certain non-GAAP measures as additional information relating to our operating
        results as a complement to results provided in accordance with GAAP. The non-GAAP
        financial information presented herein should be considered in conjunction
        with, and not as a substitute for or superior to, the financial information
        presented in accordance with GAAP and should not be considered a measure of
        liquidity. There are significant limitations associated with the use of non-GAAP
        financial measures. Further, these measures may differ from the non-GAAP information,
        even where similarly titled, used by other companies and therefore should
        not be used to compare our performance to that of other companies.</font></div><div
        style=\"height:36pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">3</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:36pt;width:100%\"><div><font><br></font></div></div><div
        style=\"margin-top:6pt\"><font style=\"color:#000000;font-family:'Times New
        Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">We have presented
        Billings, Adjusted Contribution, Adjusted EBITDA, Adjusted Net Loss and Adjusted
        Net Loss per share as non-GAAP financial measures in this press release. Billings
        represents the gross amount billed to customers and marketers for services
        in order to generate revenue. Cardlytics platform Billings is recognized gross
        of both Consumer Incentives and Partner Share. Cardlytics platform GAAP Revenue
        is recognized net of Consumer Incentives and gross of Partner Share. Bridg
        platform Billings is the same as Bridg platform GAAP Revenue. Adjusted Contribution
        measures the degree by which Revenue generated from our marketers exceeds
        the cost to obtain the purchase data and the digital advertising space from
        our partners. Adjusted Contribution demonstrates how incremental Revenue on
        our platforms generates incremental amounts to support our sales and marketing,
        research and development, general and administrative and other investments.
        Adjusted Contribution is calculated by taking our total Revenue less our Partner
        Share and other third-party costs. Adjusted Contribution does not take into
        account all costs associated with generating Revenue from advertising campaigns,
        including sales and marketing expenses, research and development expenses,
        general and administrative expenses and other expenses, which we do not take
        into consideration when making decisions on how to manage our advertising
        campaigns. Management views Adjusted Contribution as the most relevant metric
        to measure the financial performance as it reflects the dollars we keep after
        all of our partners are paid. Adjusted EBITDA represents our Net Loss before
        interest expense, net&#59; depreciation and amortization&#59; stock-based
        compensation expense&#59; foreign currency (gain) loss&#59; gain on debt extinguishment&#59;
        acquisition, integration and divestiture costs&#59; loss (gain) on disposal
        or divestiture&#59; change in contingent consideration&#59; reduction in force&#59;
        and, in applicable periods, certain other income and expense items, such as
        impairment of goodwill and intangible assets&#59; income tax benefit&#59;
        and deferred implementation costs. Adjusted Net Loss as our Net Loss before
        stock-based compensation expense&#59; foreign currency (gain) loss&#59; gain
        on debt extinguishment&#59; acquisition, integration and divestiture costs&#59;
        amortization of acquired intangibles&#59; loss (gain) on disposal or divestiture&#59;
        change in contingent consideration&#59; reduction in force&#59; and, in applicable
        periods, certain other income and expense items, such as impairment of goodwill
        and intangible assets and income tax benefit. We define Adjusted Net Loss
        per share as Adjusted Net Loss divided by our weighted-average common shares
        outstanding, diluted. We define Free Cash Flow as net cash provided by (used
        in) operating activities, plus acquisition of property and equipment and capitalized
        software development costs and, in applicable periods, acquisition of patents.
        We believe free cash flow is useful to measure the funds generated in a given
        period that are available for distribution or to sustain the business. We
        believe this supplemental information enhances stockholders' ability to evaluate
        our performance.</font></div><div style=\"margin-top:6pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">We believe
        the use of non-GAAP financial measures, as a supplement to GAAP measures,
        is useful to investors in that they eliminate items that are either not part
        of our core operations or do not require a cash outlay, such as stock-based
        compensation expense. Management uses these non-GAAP financial measures when
        evaluating operating performance and for internal planning and forecasting
        purposes. We believe that these non-GAAP financial measures help indicate
        underlying trends in the business, are important in comparing current results
        with prior period results and are useful to investors and financial analysts
        in assessing operating performance.</font></div><div style=\"margin-bottom:3pt;margin-top:6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">We
        define MQUs as targetable customers that have made a transaction using their
        account with an FI Partner or non-FI Partner in a given month, excluding pilot
        supply during the ramp up period, and whose transaction data was shared with
        Cardlytics. We then calculate a monthly average of these MQUs for the periods
        presented. We believe that the number of MQUs is an indicator of the Cardlytics
        platform's ability to drive engagement and is reflective of the consumer base
        and insights that we offer to marketers. We define ACPU as the Cardlytics
        platform Adjusted Contribution generated in the applicable period, divided
        by Cardlytics average MQUs in the applicable period. We believe that Adjusted
        Contribution is the most relevant metric as it reflects the value Cardlytics
        keeps after subtracting out rewards, Partner Share and other third-party costs.
        We believe that ACPU measures the Cardlytics platform's efficiency in converting
        marketer budgets into the value generated by customer engagement.</font></div><div
