        Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">About Cardlytics</font></div><div
        style=\"margin-top:6pt\"><font style=\"color:#000000;font-family:'Times New
        Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">Cardlytics
        (NASDAQ&#58; CDLX) is a commerce media platform, powered by our publishers&#8217;
        first-party purchase data, that makes commerce smarter and more rewarding
        for everyone. We offer a range of solutions to help advertisers and publishers
        grow and strengthen customer loyalty. With visibility into approximately half
        of all card-based transactions in the U.S. and a quarter in the U.K., Cardlytics
        enables advertisers to engage consumers at scale and drive incremental sales
        through our industry-leading card-linked offer network. Publisher partners
        can enhance their platforms with relevant and personalized offers that improve
        the shopping experience for their customers. Cardlytics also offers identity
        resolution capabilities through Bridg, which helps convert anonymous shoppers
        into known and reachable customers. Headquartered in Atlanta, Cardlytics has
        offices in Menlo Park, Los Angeles, Champaign, New York and London. Learn
        more at </font><font style=\"color:#3051f2;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">www.cardlytics.com</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">
        or follow us on LinkedIn.</font></div><div style=\"margin-top:6pt\"><font
