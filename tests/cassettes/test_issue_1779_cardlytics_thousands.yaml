        id=\"i58455a5f0f9d4f93a1a9a5a0084be737_1\"></div><div style=\"min-height:36pt;width:100%\"><div
        style=\"margin-bottom:9pt;text-align:right\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">Exhibit
        99.1</font></div></div><div style=\"text-align:center\"><font><br></font></div><div
        style=\"text-align:center\"><img alt=\"cdlxfy2017earnrelimg05a.jpg\" src=\"cdlxfy2017earnrelimg05a.jpg\"
        style=\"height:38px;margin-bottom:5pt;vertical-align:text-bottom;width:169px\"></div><div
        style=\"text-align:center\"><font><br></font></div><div style=\"margin-top:9pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">Cardlytics
        Announces Second Quarter 2025 Financial Results</font></div><div style=\"margin-top:6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">Atlanta,
        GA </font><font style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8211;
        August&#160;6, 2025 &#8211; Cardlytics, Inc. (NASDAQ&#58; CDLX), a commerce
        media platform, today announced financial results for the second quarter ended
        June 30, 2025.</font></div><div style=\"margin-top:6pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">&#34;Building
        on the progress we've made over the past year, we are navigating headwinds
        by doubling down on our diversification efforts and reinforcing our unique
        network capabilities,&#34; said Amit Gupta, CEO of Cardlytics. &#34;We believe
        our strategic shifts will position us for long-term profitable growth and
        enable us to deliver on the promise to our stakeholders.&#34;</font></div><div
        style=\"margin-top:6pt\"><font style=\"color:#000000;font-family:'Times New
        Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">Second Quarter
        2025 Financial Results</font></div><div style=\"margin-top:3pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Revenue
        was $63.2 million, a decrease of 9% year-over-year compared to $69.6 million
        in the second quarter of 2024.</font></div><div style=\"margin-top:3pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Billings,
        a non-GAAP metric, was $104.0 million, a decrease of 6% year-over-year compared
        to $110.4 million in the second quarter of 2024.</font></div><div style=\"margin-top:3pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Adjusted
        Contribution, a non-GAAP metric, was $36.1 million, a decrease of 1% year-over-year
        \ compared to $36.4 million in the second quarter of 2024.</font></div><div
        style=\"margin-top:3pt;padding-left:36pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Net
        Loss was $(9.3) million, or $(0.18) per diluted share, based on 52.8 million
        fully diluted weighted-average common shares, compared to a Net Loss of $(4.3)
        million, or $(0.09) per diluted share, based on 49.1 million fully diluted
        weighted-average common shares in the second quarter of 2024.</font></div><div
        style=\"margin-top:3pt;padding-left:36pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Adjusted
        EBITDA, a non-GAAP metric, was $2.7 million compared to $(2.3) million in
        the second quarter of 2024.</font></div><div style=\"margin-top:3pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Adjusted
        Net Loss was $(7.0) million, or $(0.13) per diluted share, based on 52.8 million
        fully diluted weighted-average common shares, compared to Adjusted Net Loss
        of $(7.6) million, or $(0.15) per diluted share, based on 49.1 million fully
        diluted weighted-average common shares in the second quarter of 2024.</font></div><div
        style=\"margin-top:3pt;padding-left:36pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Net
        cash used in operating activities was $1.2 million, compared to $4.4 million
        in the second quarter of 2024.</font></div><div style=\"margin-top:6pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Free
        Cash Flow, a non-GAAP metric, was $(3.4) million, compared to $(0.4) million
        in the second quarter of 2024.</font></div><div style=\"margin-top:9pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:700;line-height:120%\">Key
        Metrics</font></div><div style=\"margin-top:3pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Cardlytics
        monthly qualified users (&#34;MQUs&#34;) were 224.5 million, an increase of
        19% year-over-year, compared to 188.8 million in the second quarter of 2024.</font></div><div
