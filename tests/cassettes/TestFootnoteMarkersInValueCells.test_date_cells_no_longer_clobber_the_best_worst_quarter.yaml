        </tr>\n<tr style=\"height:22pt;\">\n<td style=\"padding-bottom:1.5pt;padding-top:3pt;vertical-align:Top;width:88.5pt;\">
        <div style=\"line-height:11pt;text-align:left;\"> <div style=\"margin-right:4.5pt;text-align:Left;white-space:nowrap;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:0.0pt;\">Developed Rates </font></div>
        <div style=\"margin-right:4.5pt;text-align:Left;white-space:nowrap;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:0.0pt;\">and FX</font></div> </div> </td>\n<td
        style=\"padding-bottom:1.5pt;padding-top:3pt;vertical-align:Top;width:237.5pt;\">
        <div style=\"line-height:11pt;text-align:left;\"> <div style=\"margin-left:4.5pt;margin-right:4.5pt;text-align:Left;white-space:nowrap;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:0.0pt;\">James Donaldson (since 2023)</font></div>
        </div> </td>\n<td style=\"padding-bottom:1.5pt;padding-top:3pt;vertical-align:Top;width:233pt;\">
        <div style=\"line-height:11pt;text-align:left;\"> <div style=\"margin-left:4.5pt;text-align:Left;white-space:nowrap;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:0.0pt;\">Portfolio Manager, Developed
        Rates and FX Team, </font></div> <div style=\"margin-left:4.5pt;text-align:Left;white-space:nowrap;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:0.0pt;\">GMO.</font></div> </div> </td>
        </tr> </table> </div> <div style=\"line-height:12.0pt;margin-top:10pt;text-align:left;\">
        <div style=\"margin-top:10pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;font-weight:bold;\">Purchase and sale of Fund shares</font></div>
        </div> <div style=\"line-height:11.5pt;margin-top:1pt;text-align:justify;\">
        <div style=\"margin-top:1pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">Under ordinary circumstances,
        you may purchase the Fund&#8217;s shares on days when both (i) the New York
        Stock Exchange </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">(&#8220;NYSE&#8221;)
        is open for business and (ii) the U.S. bond markets are also open for business.
        Purchase orders should be submitted directly </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">to GMO Trust (the &#8220;Trust&#8221;) or through
        a broker or agent authorized to accept purchase and redemption orders on the
        Funds&#8217; behalf. </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">Investors who have entered into agreements with
        the Trust may purchase shares of the Fund through the National Securities
        Clearing </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">Corporation
        (&#8220;NSCC&#8221;).</font></div> </div> <div style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\">
        <div style=\"margin-top:6.5pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">Class R6 shares and Class I
        shares are available for purchase by (i) eligible retirement plans (e.g.,
        401(k) plans, 457 plans, </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">employer-sponsored 403(b) plans, profit-sharing
        and money purchase pension plans, defined benefit plans and non-qualified
        deferred </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">compensation
        plans), (ii) section 529 plans, and (iii) other investors whose accounts are
        maintained by the Fund through third-party </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">platforms or intermediaries. Purchases of Class
        R6 shares or Class I shares are not subject to any minimum dollar amount.</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;line-height:11.5pt;\"> </font></div> </div> <div
        style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\"> <div style=\"margin-top:6.5pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">Fund shares are redeemable.
        Under ordinary circumstances, you may redeem the Fund&#8217;s shares on days
        when both (i) the NYSE is </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">open for business and (ii) the U.S. bond markets
        are also open for business. Redemption orders should be submitted directly
        to the Trust </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">unless
        the Fund shares to be redeemed were purchased through a broker or agent, in
        which case the redemption order should be </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">submitted to that broker or agent. Investors who
        have entered into agreements with the Trust may redeem shares of the Fund
        through </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">the
        NSCC. For instructions on redeeming shares directly, call the Trust at 1-617-346-7646
        or send an email to SHS@GMO.com.</font></div> </div> </div> <div style=\"clear:both;\">
        </div>\n<div style=\"float:left;margin-left:18pt;margin-top:8pt;width:559pt;min-height:12pt;\">\n<div
        style=\"line-height:12.0pt;margin-top:5pt;text-align:center;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;line-height:12pt;\">5</font></div> </div> </div>
        </div> <div style=\"float:left;margin-bottom:5.0pt;width:100%;\">\n</div>
        <hr style=\"clear:both;margin-bottom:0.25pt;margin-left:0.25pt;margin-right:0.25pt;margin-top:40.0pt;\">\n</div>
        <div> <div><a name=\"xx_39754e51-4a39-46e0-abde-2f548a968d0d_6\"></A> <div
        style=\"page-break-after:always;position:relative;\"> <div style=\"clear:both;\">
        </div>\n<div style=\"float:left;margin-left:18pt;margin-top:18pt;width:559pt;min-height:18pt;\">
        <div style=\"line-height:14.0pt;text-align:right;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:12pt;font-weight:bold;line-height:14pt;\">GMO\nMULTI-SECTOR
        FIXED INCOME FUND</font></div> </div> <div style=\"clear:both;\"> </div> <div
        style=\"float:left;margin-left:18pt;margin-top:12pt;width:559pt;min-height:690pt;\">
        <div style=\"line-height:12.0pt;text-align:left;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;font-weight:bold;\">U.S. tax information</font></div>
        <div style=\"line-height:11.5pt;margin-top:1pt;text-align:justify;\"> <div
        style=\"margin-top:1pt;\"><font\nstyle=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;margin-left:3.76%;\">The Fund intends to qualify and
        be treated each year, as a regulated investment company (a &#8220;RIC&#8221;)
        under Subchapter M of the </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">Internal Revenue Code of 1986, as amended (the
        &#8220;Code&#8221;) for U.S. federal income tax purposes and to distribute
        net investment income </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">and net realized capital gains, if any, to shareholders.
        These distributions are taxable as ordinary income or capital gain to U.S.
        </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">shareholders
        that are not exempt from U.S. income tax or that are not investing through
        a tax-advantaged account. U.S. shareholders </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">who are investing through a tax-advantaged account
        may be taxed upon withdrawals from that account.</font></div> </div>\n<div
        style=\"line-height:12.0pt;margin-top:10.0pt;text-align:left;\"> <div style=\"margin-top:10pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-weight:bold;\">Financial
        intermediary compensation</font></div> </div>\n<div style=\"line-height:11.5pt;margin-top:1.0pt;text-align:justify;\">
        <div style=\"margin-top:1pt;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">The Fund makes payments out
        of the net assets attributable\nto Class I shares for sub-transfer agency,
        recordkeeping and other </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">administrative services provided by financial
        intermediaries for the benefit of Class I shareholders.\nIn addition, GMO
        pays brokers, </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">agents,
        or other financial intermediaries for transfer agency and related services.
        These payments create a conflict of interest by\ncreating </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">a financial incentive for the broker, agent or
        other financial intermediary and salesperson to recommend the purchase of
        Fund shares </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">over
        another investment. GMO also makes payments to financial intermediaries for
        the purchase of Fund shares, which creates a similar </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">conflict of interest. Ask your salesperson or
        consult your financial intermediary&#8217;s website for more information.</font></div>
        </div> </div> <div style=\"clear:both;\"> </div>\n<div style=\"float:left;margin-left:18pt;margin-top:8pt;width:559pt;min-height:12pt;\">\n<div
        style=\"line-height:12.0pt;margin-top:5pt;text-align:center;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;line-height:12pt;\">6</font></div> </div> </div>
