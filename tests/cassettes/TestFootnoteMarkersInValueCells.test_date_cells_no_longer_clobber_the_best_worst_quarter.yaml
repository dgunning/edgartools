        <div> <div><a name=\"xx_39754e51-4a39-46e0-abde-2f548a968d0d_2\"></A> <div
        style=\"page-break-after:always;position:relative;\"> <div style=\"clear:both;\">
        </div>\n<div style=\"float:left;margin-left:18pt;margin-top:18pt;width:559pt;min-height:18pt;\">
        <div style=\"line-height:14.0pt;text-align:right;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:12pt;font-weight:bold;line-height:14pt;\">GMO\nMULTI-SECTOR
        FIXED INCOME FUND</font></div> </div> <div style=\"clear:both;\"> </div> <div
        style=\"float:left;margin-left:18pt;margin-top:12pt;width:559pt;min-height:690pt;\">
        <div style=\"line-height:12.0pt;text-align:left;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;font-weight:bold;\">Portfolio turnover</font></div>
        <div style=\"line-height:11.5pt;margin-top:1pt;text-align:justify;\"> <div
        style=\"margin-top:1pt;\"><font\nstyle=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;margin-left:3.76%;\">The Fund pays transaction costs,
        such as commissions, when it buys and sells securities. A higher portfolio
        turnover rate may </font><font\nstyle=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;\">result in higher transaction costs and, for holders
        of Fund shares subject to U.S. taxes, higher income taxes. These transaction
        costs, </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">which
        are not reflected in Annual Fund operating expenses or in the Example, affect
        the Fund&#8217;s performance.</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\"> During its fiscal year </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">ended February 28, 2025, the Fund&#8217;s portfolio
        turnover rate (excluding\nshort-term investments) was </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">444</font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">% of the average value of its </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">portfolio securities.</font></div> </div> <div
        style=\"line-height:12.0pt;margin-top:10.0pt;text-align:left;\"> <div style=\"margin-top:10pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;font-weight:bold;\">Principal investment strategies</font></div>
        </div> <div style=\"line-height:11.5pt;margin-top:1.0pt;text-align:justify;\">
        <div style=\"margin-top:1pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">The Fund&#8217;s investment
        program has two principal components. One component seeks to achieve a return
        commensurate with that </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">of the Fund&#8217;s benchmark. The second component
        seeks to add value relative to the Fund&#8217;s benchmark by making investments
        that often </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">will
        not track its benchmark. These investments principally include global interest
        rate and currency derivatives and indirect (through </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">other GMO Funds) and direct investments in asset-backed,
        corporate, government and emerging country debt securities. This second </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">component can cause the Fund&#8217;s performance
        to differ significantly from that of its benchmark.</font></div> </div>\n<div
        style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\"> <div style=\"margin-top:6.5pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;margin-left:3.76%;\">In
        deciding what investments to make in global interest\nrate and currency markets
        and the size of those investments, GMO uses a </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">quantitative approach that considers macroeconomic
        factors (e.g., inflation) as well as\nprice-based factors (e.g., interest
        and exchange </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">rates).
        GMO evaluates the relative attractiveness of particular markets and instruments
        using various fixed income risk\npremium </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">measures, which typically include, for example,
        term structure, foreign exchange, volatility, credit and liquidity. GMO also
        may consider </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">the
        relative attractiveness of yield curve and duration positions in these markets.
        In addition, GMO seeks to identify opportunities </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">arising from unusual market conditions (such as
        markets with heightened volatility, significant market declines, or widespread
        asset </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">price
        dislocations) not otherwise identified by its quantitative models and uses
        various portfolio construction techniques to manage risk.</font></div> </div>\n<div
        style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\"> <div style=\"margin-top:6.5pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;margin-left:3.76%;\">In
        making decisions regarding credit investments, GMO\nseeks to take advantage
        of its proprietary investment models to allocate </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">the Fund&#8217;s assets opportunistically among
        credit sectors (e.g., investment grade and high\nyield) and to systematically
        identify </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">investments
        within those credit sectors with the most attractive risk/return profiles.
        In selecting credit investments, the models\nused by </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">GMO take into account value criteria, quality
        factors (including ESG (environmental, social, and governance) criteria in
        some cases), </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">momentum,
        and liquidity. The factors GMO considers and investment methods GMO uses can
        change over time.</font></div> </div>\n<div style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\">
        <div style=\"margin-top:6.5pt;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">In pursuing its investment program,
        the Fund may make or\nmaintain investments in: (i) bonds denominated in various
        currencies, </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">including
        non-U.S. and U.S. government bonds, agency bonds, and corporate bonds, asset-backed\nsecurities,
        and emerging country debt </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">securities; (ii) shares of Opportunistic Income
        Fund (to provide exposure to asset-backed credit markets); (iii) shares of
        Emerging\n</font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">Country
        Debt Fund (&#8220;ECDF&#8221;) (to provide exposure to emerging country debt
        securities); and (iv) the types of investments typically held </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">by money market funds. The Fund may also engage
        in short sales and invest in derivatives, including without limitation, to-be-announced</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\"> transactions (&#8220;TBAs&#8221;), futures contracts,
        currency and interest rate options, currency forwards, repurchase agreements
        and </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">reverse
        repurchase agreements, and swap contracts, such as swaps on securities and
        securities indices, total return swaps, interest rate </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">swaps, and currency swaps, and other types of
        derivatives.</font></div> </div> <div style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\">
        <div style=\"margin-top:6.5pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">The Fund has and expects to
        continue to have material exposure to U.S. and non-U.S. bonds, U.S. asset-backed
        securities, and </font><font\nstyle=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;\">emerging country debt securities that are below investment
        grade (below investment grade debt investments are commonly referred to as
        </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">&#8220;high
        yield&#8221; or &#8220;junk bonds,&#8221; although these terms are not generally
        used to refer to emerging country debt securities or asset-backed </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">securities).</font></div> </div> <div style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\">
        <div style=\"margin-top:6.5pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">GMO normally seeks to maintain
        an annualized tracking error (standard deviation) relative to the Fund&#8217;s
        benchmark of 1-3% over </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">a complete market cycle and an estimated interest
        rate duration within 2 years of the benchmark&#8217;s duration (approximately
        6 years as of </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">May
        31, 2025). For an additional discussion of duration, see &#8220;Additional
        Information About the Funds&#8217; Investment Strategies, Risks and </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">Expenses &#8212; Bond Funds &#8212; Duration.&#8221;</font></div>
        </div> <div style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\">
        <div style=\"margin-top:6.5pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">Under normal circumstances,
        the Fund invests directly and indirectly (e.g., through other GMO Funds or
        derivatives) at least 80% </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">of its assets in bonds (see &#8220;Name Policies&#8221;).
        The term &#8220;bond&#8221; includes (i) obligations of an issuer to make
        payments on future dates of </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">principal, interest (whether fixed or variable)
        or both and (ii) synthetic debt instruments created by GMO by investing in
        derivatives </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">(e.g.,
        a futures contract, swap contract, currency forward, or option).</font></div>
        </div> <div style=\"line-height:11.5pt;margin-top:6.5pt;text-align:justify;\">\n<div
        style=\"margin-top:6.5pt;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:3.76%;\">The Fund may invest in securities
        of companies of any market capitalization. In addition, the Fund may lend
        its portfolio\n</font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">securities.
        The Fund is not limited in its use of derivatives or in the total notional
        value of its derivative positions. Leverage is not a </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">principal component of the Fund&#8217;s investment
        strategy. However, because of its derivative positions, the Fund may at times
        have gross </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">investment
        exposure in excess of its net assets (i.e., the Fund may be leveraged) and,
        therefore, may be subject to higher risk of loss </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">during those times than if the Fund were not leveraged.
        The Fund&#8217;s performance can depend substantially on the performance of
        assets </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">or
        indices underlying its derivatives even though it does not own those assets
        or indices.</font></div> </div> <div style=\"line-height:12.0pt;margin-top:10.0pt;text-align:left;\">\n<div
        style=\"margin-top:10pt;\"><font style=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;font-weight:bold;\">Principal risks of investing in the
        Fund</font></div> </div> <div style=\"line-height:11.5pt;margin-top:1.0pt;text-align:justify;\">\n<div
        style=\"margin-top:1pt;\"><font style=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;margin-left:3.76%;\">The value of the Fund&#8217;s shares
        changes with the value of the Fund&#8217;s investments. </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">Many factors can affect this value, and you may
        </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">lose
        money by investing in the Fund.</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\"> The Fund is a non-diversified investment company
        under the Investment Company Act of 1940, as </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">amended,\nand therefore a decline in the market
        price of a particular security held by the Fund may affect the Fund&#8217;s
        performance more </font></div> </div> </div> <div style=\"clear:both;\"> </div>\n<div
        style=\"float:left;margin-left:18pt;margin-top:8pt;width:559pt;min-height:12pt;\">\n<div
        style=\"line-height:12.0pt;margin-top:5pt;text-align:center;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;line-height:12pt;\">2</font></div> </div> </div>
        </div> <div style=\"float:left;margin-bottom:5.0pt;width:100%;\">\n</div>
        <hr style=\"clear:both;margin-bottom:0.25pt;margin-left:0.25pt;margin-right:0.25pt;margin-top:40.0pt;\">\n</div>
        <div> <div><a name=\"xx_39754e51-4a39-46e0-abde-2f548a968d0d_3\"></A> <div
        style=\"page-break-after:always;position:relative;\"> <div style=\"clear:both;\">
        </div>\n<div style=\"float:left;margin-left:18pt;margin-top:18pt;width:559pt;min-height:18pt;\">
        <div style=\"line-height:14.0pt;text-align:right;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:12pt;font-weight:bold;line-height:14pt;\">GMO\nMULTI-SECTOR
        FIXED INCOME FUND</font></div> </div> <div style=\"clear:both;\"> </div> <div
        style=\"float:left;margin-left:18pt;margin-top:12pt;width:559pt;min-height:690pt;\">
        <div style=\"line-height:11.5pt;text-align:justify;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;margin-left:0%;\">than if the Fund were a diversified
        investment company. The principal risks of investing in the Fund are summarized
        below. For a more </font><font\nstyle=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;margin-left:0%;\">complete discussion of these risks,
        see &#8220;Additional Information about the Funds&#8217; Investment Strategies,
        Risks, and Expenses&#8221; and </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">&#8220;Description of Principal Risks.&#8221;</font></div>
        <div> <div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">\n<div
        style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Market
        Risk &#8211; Fixed Income</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\"> &#8211; The market price of a fixed income investment
        can decline due to market-related factors, including </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">rising interest or inflation rates and widening
        credit spreads, or decreased liquidity due, for example, to market uncertainty
        about the </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">value
        of a fixed income investment (or class of fixed income investments).</font><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;line-height:11.5pt;\">\n</font></div>
        </div> <div style=\"clear:both;position:relative;\"> </div> </div> <div> <div
        style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\"> <div
        style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:8pt;\">&#9679;</font></div> <div style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;font-style:italic;\">Credit Risk</font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\"> &#8211; The Fund runs the risk that the issuer
        or guarantor of a fixed\nincome investment (including a sovereign or quasi-</font><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">sovereign
        debt issuer) or the obligor of an obligation underlying an asset-backed security
        will be unable or unwilling\nto satisfy its </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">obligation to pay principal and interest or otherwise
        to honor its obligations in a timely manner or at all. The market price of
        a fixed </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">income
        investment will normally decline as a result of the failure of an issuer,
        guarantor, or obligor to meet its payment obligations </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">or in anticipation of such a failure. Below investment
        grade investments (commonly referred to as high yield or &#8220;junk&#8221;
        bonds) have </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">speculative
        characteristics and are subject to greater credit risk than other fixed income
        investments. Negative changes in economic </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">conditions or other circumstances are more likely
        to impair the ability of issuers of below investment grade investments to
        make </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">principal
        and interest payments than issuers of investment grade investments.</font><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\"> In addition,
        investments\nin emerging country sovereign </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">or quasi-sovereign debt are subject to a heightened
        risk that the issuer responsible for repayment of the debt may be unable or
        </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">unwilling
        to pay interest and repay principal when due, and the Fund may lack recourse
        against the issuer in the event of a default. </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">Investments in quasi-sovereign debt also are subject
        to the risk that the issuer will default independently of its sovereign.</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;line-height:11.5pt;\"> </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">Investments in distressed or defaulted or other
        low quality debt investments\ngenerally are considered speculative and are
        subject to </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">substantial
        risks not normally associated with investments in higher quality securities,
        including adverse\nbusiness, financial or </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">economic conditions that lead to their issuers&#8217;
        payment defaults and insolvency proceedings. In particular, distressed or
        defaulted </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">obligations
        might be repaid, if at all, only after lengthy workout or bankruptcy proceedings
        during which the issuer might not make </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">any interest or other payments, and the Fund may
        incur additional expenses in its effort to be repaid. If GMO&#8217;s assessment
        of the </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">eventual
        recovery value of a distressed or defaulted debt investment proves incorrect,
        the Fund may lose a substantial portion or all </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">of its original investment or may be required
        to accept cash or instruments worth less than its original investment.</font></div>
        </div> <div style=\"clear:both;position:relative;\">\n</div> </div> <div>
        <div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">\n<div
        style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Management
        and Operational Risk</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\"> &#8211; The Fund runs the risk that GMO&#8217;s
        investment techniques will fail to produce intended results.</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;line-height:11.5pt;\"> </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">GMO uses quantitative models as part of its investment
        process. GMO&#8217;s models\nmay not accurately predict future market </font><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">movements.
        In addition, GMO&#8217;s models rely on assumptions and data that are subject
        to limitations (e.g., inaccuracies,\nstaleness) </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">that could adversely affect their predictive value.</font><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\"> The Fund
        also runs the risk\nthat GMO&#8217;s assessment of an investment, including
        a </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">security&#8217;s
        fundamental fair (or intrinsic) value, is wrong or that deficiencies in GMO&#8217;s
        or another\nservice provider&#8217;s internal systems </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">or controls will cause losses for the Fund or
        impair Fund operations.</font></div> </div>\n<div style=\"clear:both;position:relative;\">
        </div> </div> <div> <div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">
        <div style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:8pt;\">&#9679;</font></div> <div style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;font-style:italic;\">Derivatives and Short Sales
        Risk</font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">
        &#8211; The use of derivatives involves the risk that\ntheir value may not
        change as expected relative to </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">changes in the value of the underlying assets,
        pools of assets, rates, currencies or indices. Derivatives also present\nother
        risks, </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">including
        market risk, illiquidity risk, currency risk, credit risk, leveraging risk,
        commodities risk and counterparty risk. The market </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">price of an option is affected by many factors,
        including changes in the market prices or dividend rates of underlying securities
        (or </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">in
        the case of indices, the securities in such indices); the time remaining before
        expiration; changes in interest rates or exchange </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">rates; and changes in the actual or perceived
        volatility of the relevant index or underlying securities. The Fund typically
        creates short </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">investment
        exposure by selling securities short or by taking a derivative position in
        which the value of the derivative moves in the </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">opposite direction from the price of an underlying
        asset, pool of assets, rate, currency or index. Specifically, the net asset
        value of </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">the
        Fund&#8217;s shares will be adversely affected if the equities or other assets
        that are the subject of the Fund&#8217;s short exposures </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">appreciate in value. The risk of loss associated
        with derivatives that provide short investment exposure and short sales of
        securities </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">is
        theoretically unlimited. The purchaser of TBA securities generally is subject
        to higher market risk and interest rate risk, because </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">the delivered securities&nbsp;may be less favorable
        than anticipated by the purchaser.</font></div> </div> <div style=\"clear:both;position:relative;\">
        </div> </div> <div>\n<div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">
        <div style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Currency
        Risk</font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">
        &#8211; Fluctuations in exchange rates can adversely affect the market value
        of the Fund&#8217;s foreign currency holdings and </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">investments denominated in foreign currencies.</font></div>
        </div> <div style=\"clear:both;position:relative;\"> </div> </div> <div>\n<div
        style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\"> <div
        style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Market
        Risk &#8211; Asset-Backed Securities</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\"> &#8211; The market price of asset-backed securities,
        like that of other fixed income investments, </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">can\ndecline for a variety of reasons, including
        increases in interest rates. In addition, the market price can decrease due
        to a </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">reduction
        in or decrease in the reliability\nof their payment streams. Payment streams
        associated with asset-backed securities held by </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">the Fund depend on many factors (e.g., the cash
        flow generated by the assets\nbacking the securities, deal structure, and
        </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">creditworthiness
        of any credit-support provider), and a problem in any of these factors can
        lead to a reduction in the payment\nstream </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">GMO expected the Fund to receive when the Fund
        purchased the asset-backed security. The liquidity of asset-backed securities
        </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">(particularly
        below investment grade asset-backed securities) may change over time. During
        periods of deteriorating economic </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">conditions, such as recessions, or periods of
        rising unemployment, delinquencies and losses generally increase, sometimes
        </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">dramatically,
        for asset-backed securities whose underlying assets consist of loans, sales
        contracts, receivables and other obligations.</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;line-height:11.5pt;\"> </font></div> </div> <div
        style=\"clear:both;position:relative;\"> </div> </div> <div> <div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">\n<div
        style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Illiquidity
        Risk</font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">
        &#8211; Low trading volume, lack of a market maker, large position size, or
        legal restrictions increase the risk that the Fund </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">or an underlying fund is limited or prevented
        from selling particular securities or closing derivative positions at desirable
        prices at a </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">particular
        time or at all.</font></div> </div> <div style=\"clear:both;position:relative;\">
        </div> </div> </div> <div style=\"clear:both;\"> </div>\n<div style=\"float:left;margin-left:18pt;margin-top:8pt;width:559pt;min-height:12pt;\">\n<div
        style=\"line-height:12.0pt;margin-top:5pt;text-align:center;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;line-height:12pt;\">3</font></div> </div> </div>
        </div> <div style=\"float:left;margin-bottom:5.0pt;width:100%;\">\n</div>
        <hr style=\"clear:both;margin-bottom:0.25pt;margin-left:0.25pt;margin-right:0.25pt;margin-top:40.0pt;\">\n</div>
        <div> <div><a name=\"xx_39754e51-4a39-46e0-abde-2f548a968d0d_4\"></A> <div
        style=\"page-break-after:always;position:relative;\"> <div style=\"clear:both;\">
        </div>\n<div style=\"float:left;margin-left:18pt;margin-top:18pt;width:559pt;min-height:18pt;\">
        <div style=\"line-height:14.0pt;text-align:right;\"><font style=\"color:#000000;font-family:Times
        New Roman;font-size:12pt;font-weight:bold;line-height:14pt;\">GMO\nMULTI-SECTOR
        FIXED INCOME FUND</font></div> </div> <div style=\"clear:both;\"> </div> <div
        style=\"float:left;margin-left:18pt;margin-top:12pt;width:559pt;min-height:690pt;\">
        <div> <div style=\"clear:both;position:relative;width:100%;\">\n<div style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Futures
        Contracts Risk</font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">
        &#8211; The loss to the Fund resulting from its use of futures contracts is
        potentially unlimited. Futures markets are </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">highly volatile, and the use of futures contracts
        increases the volatility of the Fund&#8217;s net asset value. A liquid market
        may not exist </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">for
        any particular futures contract at any particular time, and the Fund may be
        unable when it wishes to terminate its exposure under </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">that contract. When the Fund uses futures contracts
        for hedging purposes, it runs the risk that changes in the prices of the contracts
        </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">will
        not correlate perfectly with changes in the securities, index, or other asset
        underlying the contracts or movements in the prices </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">of the Fund&#8217;s investments that are subject
        to the hedge. In addition, the Fund may be unable to recover or may be delayed
        in </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">recovering
        margin or other amounts deposited with a futures commission merchant or futures
        clearinghouse. Foreign futures </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">contracts are often less liquid and more volatile
        than U.S. futures contracts.</font></div> </div> <div style=\"clear:both;position:relative;\">
        </div> </div> <div>\n<div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">
        <div style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Non-U.S.
        Investment Risk</font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">
        &#8211; The market prices of many non-U.S. securities fluctuate more than
        those of U.S. securities. Many non-</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">U.S. securities markets are less stable, smaller,
        less liquid, and less regulated than U.S. securities markets, and the cost
        of trading in </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">those
        markets often is higher than in U.S. securities markets. In addition, non-U.S.
        securities issuers often are not subject to as much </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">regulation as U.S. issuers, and the reporting,
        recordkeeping, accounting, custody, and auditing standards to which those
        issuers are </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">subject
        often are not as rigorous as U.S. standards. In addition, the Fund is subject
        to taxation by countries other than the </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">United States, including potentially on a retroactive
        basis, on (i) capital gains it realizes or dividends, interest, or other amounts
        it </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">realizes
        or accrues in respect of non-U.S. investments; (ii) transactions in those
        investments; and (iii) repatriation of proceeds </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">generated from the sale or other disposition of
        those investments.</font><font style=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;\"> Also, the Fund needs a license to\ninvest directly
        in securities </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">traded
        in many non-U.S. securities markets, and the Fund is subject to the risk that
        its license is terminated or suspended. In some </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">non-U.S. securities markets, prevailing custody
        and trade settlement practices (e.g., the requirement to pay for securities
        prior to </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">receipt)
        expose the Fund to credit and other risks. Further, adverse changes in investment
        regulations, capital requirements or </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">exchange controls could adversely affect the value
        of the Fund&#8217;s investments. The risks above (such as substantial price
        fluctuations </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">and
        market instability, illiquidity and lack of regulation) and other risks (e.g.,
        nationalization, expropriation or other confiscation of </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">assets of non-U.S. issuers, difficulties enforcing
        legal judgments or contractual rights and geopolitical risks) tend to be higher
        for </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">investments
        in the securities of issuers tied economically to emerging countries. The
        economies of emerging countries often depend </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">predominantly on only a few industries or commodities
        and often are more volatile than the economies of developed countries.</font></div>
        </div>\n<div style=\"clear:both;position:relative;\"> </div> </div> <div>
        <div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">
        <div style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:8pt;\">&#9679;</font></div> <div style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;font-style:italic;\">Counterparty Risk</font><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\"> &#8211;
        The Fund runs the risk that the counterparty to a\nderivatives contract or
        a clearing member used by the Fund to </font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">hold a cleared derivatives contract is unable
        or unwilling to make timely settlement payments, return the\nFund&#8217;s
        collateral or </font><font style=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">otherwise
        honor its obligations.</font></div> </div> <div style=\"clear:both;position:relative;\">
        </div> </div> <div>\n<div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">
        <div style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Focused
        Investment Risk</font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">
        &#8211; Investments in countries, regions, asset classes, sectors, industries,
        currencies, or issuers that are subject </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">to the same or similar risk factors and investments
        whose market prices are closely correlated, such as the Fund&#8217;s investments
        in </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">non-U.S.
        government bonds and asset-backed securities secured by different types of
        consumer debt (e.g., credit-card receivables, </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">automobile loans, and home equity loans), are
        subject to higher overall risk than investments that are more diversified
        or whose </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">market
        prices are not as closely correlated.</font></div> </div> <div style=\"clear:both;position:relative;\">
        </div> </div> <div>\n<div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">
        <div style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Leveraging
        Risk</font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">
        &#8211; The use of derivatives, short sales and securities lending can create
        leverage. Leverage increases the Fund&#8217;s losses </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">when the value of its investments (including derivatives)
        declines. In addition, the Fund&#8217;s portfolio will be leveraged if it
        exercises </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">its
        right to delay payment on a redemption and the value of the Fund&#8217;s assets
        declines between the time a redemption request is </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">treated as being received by the Fund and the
        time the Fund liquidates assets to fund that redemption.</font></div> </div>
        <div style=\"clear:both;position:relative;\"> </div> </div>\n<div> <div style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\">
        <div style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Large
        Transactions Risk</font><font\nstyle=\"color:#000000;font-family:Times New
        Roman;font-size:10pt;\"> &#8211; To the extent that a large number of shares
        of the Fund is held by a single shareholder (e.g., an\n</font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">institutional investor or another GMO Fund) or
        a group of shareholders with a common investment strategy (e.g., GMO asset
        </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">allocation
        accounts), the Fund is subject to the risk that a redemption by that shareholder
        or group will require the Fund to sell </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">investments at disadvantageous prices, disrupt
        the Fund&#8217;s operations, lead to temporary overexposure to the Fund&#8217;s
        intended </font><font\nstyle=\"color:#000000;font-family:Times New Roman;font-size:10pt;\">investment
        program or force the Fund&#8217;s liquidation. The Fund also may be subject
        to these effects when a number of shareholders </font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">collectively redeem a large amount of Fund shares.</font></div>
        </div> <div style=\"clear:both;position:relative;\"> </div> </div> <div>\n<div
        style=\"clear:both;margin-top:6.5pt;position:relative;width:100%;\"> <div
        style=\"float:left;line-height:9.5pt;text-align:left;width:3.68pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:8pt;\">&#9679;</font></div>\n<div
        style=\"float:left;line-height:11.5pt;margin-left:11.32pt;text-align:justify;width:539.00pt;\"><font
        style=\"color:#000000;font-family:Times New Roman;font-size:10pt;font-style:italic;\">Market
        Disruption and Geopolitical Risk</font><font\nstyle=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\"> &#8211; Geopolitical and other events (e.g.,
        wars, pandemics, sanctions, terrorism, diplomatic\n</font><font style=\"color:#000000;font-family:Times
        New Roman;font-size:10pt;\">tensions, dramatic changes in regulatory and/or
