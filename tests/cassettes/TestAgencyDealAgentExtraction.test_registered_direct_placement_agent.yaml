        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">our
        intellectual property position.</font></div><div><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Because
        forward-looking statements relate to the future, they are subject to inherent
        uncertainties, risks and changes in circumstances that are difficult to predict.
        Our actual results could differ materially from those anticipated in these
        forward-looking statements as a result of various factors. We therefore caution
        you against relying on any of these forward-looking statements. These forward-looking
        statements are only predictions and are subject to risks, uncertainties and
        assumptions that are referenced in the section of any accompanying prospectus
        supplement entitled &#8220;Risk Factors.&#8221; You should also carefully
        review the risk factors, risk factor summary and cautionary statements described
        in the other documents we file from time to time with the SEC, specifically
        our most recent Annual Report on Form 10-K, our Quarterly Reports on Form
        10-Q and our Current Reports on Form 8-K. If one or more of these factors
        materialize, or if any underlying assumptions prove incorrect, our actual
        results, performance or achievements may vary materially from any future results,
        performance or achievements expressed or implied by these forward-looking
        statements.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">3</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">You
        should consider these factors and the other cautionary statements made in
        this prospectus, any prospectus supplement and the documents we incorporate
        by reference herein and therein as being applicable to all related forward-looking
        statements wherever they appear in this prospectus, any prospectus supplement
        or the documents incorporated by reference. While we may elect to update forward-looking
        statements wherever they appear in this prospectus, any prospectus supplement
        or the documents incorporated by reference herein and therein, we do not assume,
        and specifically disclaim, any obligation to do so, whether as a result of
        new information, future events or otherwise, except as required by law.</font></div><div
        style=\"text-indent:36pt\"><font><br></font></div><div style=\"margin-bottom:6pt;text-indent:36pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">This
        prospectus, any prospectus supplement and the documents incorporated by reference
        herein and therein include statistical and other industry and market data
        that we obtained from industry publications and research, surveys, and studies
        conducted by third parties as well as our own estimates. All of the market
        data used in this prospectus, any prospectus supplement and the documents
        incorporated by reference herein and therein involve a number of assumptions
        and limitations, and you are cautioned not to give undue weight to such data.
        Industry publications and third-party research, surveys, and studies generally
        indicate that their information has been obtained from sources believed to
        be reliable, although they do not guarantee the accuracy or completeness of
        such information. Our estimates of the potential market opportunities for
        our drug candidates include several key assumptions based on our industry
        knowledge, industry publications, third-party research, and other surveys,
        which may be based on a small sample size and may fail to accurately reflect
        market opportunities. While we believe that our internal assumptions are reasonable,
        no independent source has verified such assumptions.</font></div><div><font><br></font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">4</font></div></div></div><div
        id=\"i266e9e99ed494798b2d0e136dc697093_649\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">CURIS,
        INC.</font></div><div style=\"text-align:center\"><font><br></font></div><div
        style=\"text-indent:18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">We
        are a biotechnology company focused on the clinical development of emavusertib,
        an orally available, small molecule IRAK4 inhibitor. Through our 2015 collaboration
        with Aurigene, we have the exclusive license to emavusertib (CA-4948). We
        licensed our rights to Erivedge&#174; to Genentech, a member of the Roche
        Group, under which they are commercializing Erivedge&#174; for the treatment
        of advanced basal cell carcinoma.</font></div><div style=\"text-indent:18pt\"><font><br></font></div><div
        style=\"margin-bottom:6pt;text-indent:18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Our
        principal executive offices are located at 128 Spring Street, Building C-Suite
        500, Lexington, Massachusetts 02421, and our telephone number is (617) 503-6500.
        </font></div><div><font><br></font></div><div style=\"height:84.24pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">5</font></div></div></div><div
        id=\"i266e9e99ed494798b2d0e136dc697093_673\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-align:center;text-indent:18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">RISK
        FACTORS</font></div><div style=\"text-align:center;text-indent:18pt\"><font><br></font></div><div
        style=\"margin-bottom:6pt;text-indent:18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Investing
        in our common stock involves a high degree of risk. You should carefully review
        the risks and uncertainties described under the heading &#8220;Risk Factors&#8221;
        contained in the applicable prospectus supplement and any related free writing
        prospectus, and under similar headings in our Annual Report on Form 10-K for
        the year ended December 31, 2023, as updated by our subsequent filings, which
        are incorporated by reference into this prospectus, before deciding whether
        to purchase any of the common stock being registered pursuant to the registration
        statement of which this prospectus is a part. Each of the risk factors could
        adversely affect our business, results of operations, financial condition
        and cash flows, as well as adversely affect the value of an investment in
        our common stock, and the occurrence of any of these risks might cause you
        to lose all or part of your investment. Additional risks not presently known
        to us or that we currently believe are immaterial may also significantly impair
        our business operations.</font></div><div><font><br></font></div><div style=\"height:84.24pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">6</font></div></div></div><div
        id=\"i266e9e99ed494798b2d0e136dc697093_697\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">USE
        OF PROCEEDS</font></div><div style=\"text-align:center\"><font><br></font></div><div
        style=\"margin-bottom:6pt;text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">We
        intend to use the net proceeds from the sale of any common stock offered under
        this prospectus for general corporate purposes unless otherwise indicated
        in the applicable prospectus supplement. General corporate purposes may include
        the conducting of further clinical studies and preclinical testing of our
        product candidates, the funding of other research and development expenses,
        the in-licensing of individual drug candidates or drug programs, the acquisition
        of companies or businesses that complement our business, the repayment and
        refinancing of debt, working capital and capital expenditures. We have not
        determined the amount of net proceeds to be used specifically for such purposes.
        As a result, management will retain broad discretion over the allocation of
        the net proceeds of any offering.</font></div><div><font><br></font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">7</font></div></div></div><div
        id=\"i266e9e99ed494798b2d0e136dc697093_721\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">DESCRIPTION
        OF COMMON STOCK </font></div><div style=\"text-align:center\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">The
        following description of our common stock is intended as a summary only and
        therefore is not a complete description of our common stock. This description
        is based upon, and is qualified by reference to, our certificate of incorporation,
        our by-laws and applicable provisions of Delaware corporate law. You should
        read our certificate of incorporation and by-laws, which are filed as exhibits
        to the registration statement of which this prospectus forms a part, for the
        provisions that are important to you.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Pursuant
        to our certificate of incorporation, as amended, and as of the date of effectiveness
        of the registration statement of which this prospectus forms a part, our authorized
        capital stock consists of 22,781,250 shares of common stock, par value $0.01
        per share, and 5,000,000 shares of preferred stock, par value $0.01 per share.
        </font></div><div style=\"text-indent:36pt\"><font><br></font></div><div><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Common
        Stock</font></div><div><font><br></font></div><div style=\"text-indent:25.2pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Annual
        Meeting. </font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Annual
        meetings of our stockholders are held on the date designated in accordance
        with our by-laws. Written notice must be mailed to each stockholder entitled
        to vote not less than ten nor more than 60 days before the date of the meeting.
        The presence in person, by means of remote communication in a manner, if any,
        authorized by our board of directors in its sole discretion, or by proxy of
        the holders of record of a majority of our issued and outstanding shares entitled
        to vote at such meeting constitutes a quorum for the transaction of business
        at meetings of the stockholders. Special meetings of the stockholders may
        be called for any purpose or purposes by the chair of the board of directors</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">,
        </font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">chief
        executive officer (or if there is no chief executive officer, the president)
        or the board of directors. Except as may be otherwise provided by applicable
        law, our certificate of incorporation or our by-laws, all elections shall
        be decided by a plurality, and all other questions shall be decided by a majority,
        of the votes cast by stockholders entitled to vote thereon at a duly held
        meeting of stockholders at which a quorum is present.</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Voting
        Rights</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">.
        For all matters submitted to a vote of stockholders, each holder of common
        stock is entitled to one vote for each share registered in his or her name
        on our books. Our common stock does not have cumulative voting rights. </font></div><div
        style=\"text-indent:25.2pt\"><font><br></font></div><div style=\"text-indent:25.2pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Dividends</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">.
        If our board of directors declares a dividend, holders of common stock will
        receive payments from our funds that are legally available to pay dividends.
        However, this dividend right is subject to any preferential dividend rights
        we may grant to the holders of preferred stock, if any is outstanding.</font></div><div
        style=\"text-indent:25.2pt\"><font><br></font></div><div style=\"text-indent:25.2pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Liquidation
        and Dissolution</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">.
        If we are liquidated or dissolved, the holders of our common stock will be
        entitled to share ratably in all the assets that remain after we pay our liabilities
        and any amounts we may owe to the holders of preferred stock, if any is outstanding.
        </font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Other
        Rights.</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">
        Holders of the common stock have no right to&#58; </font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">convert
        the stock into any other security&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">have
        the stock redeemed&#59; </font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">purchase
        additional stock&#59; or</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">maintain
        their proportionate ownership interest and there are no sinking fund provisions
        applicable to our common stock.</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">The
        rights, preferences and privileges of the holders of common stock are subject
        to, and may be adversely affected by, the rights of the holders of shares
        of any series of preferred stock that the Company may designate and issue.</font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">8</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-indent:25.2pt\"><font><br></font></div><div style=\"text-indent:25.2pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Transfer
        Agent and Registrar</font><font style=\"color:#000000;font-family:'Times New
        Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">. Computershare
        Trust Company, N.A. is transfer agent and registrar for the common stock.</font></div><div
        style=\"text-indent:25.2pt\"><font><br></font></div><div style=\"text-indent:25.2pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Listing
        on the Nasdaq Capital Market. </font><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Our
        common stock is listed on the Nasdaq Capital Market under the trading symbol
        &#8220;CRIS.&#8221;</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Provisions
        of Our Certificate of Incorporation and By-laws and Delaware Law That May
        Have Anti-Takeover Effects</font></div><div><font><br></font></div><div style=\"text-indent:25.2pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Certain
        provisions of our certificate of incorporation and by-laws may have the effect
        of making it more difficult for a third party to acquire, or of discouraging
        a third party from attempting to acquire, control of us. Such provisions could
        limit the price that certain investors might be willing to pay in the future
        for shares of our common stock and may limit the ability of stockholders to
        remove current management or directors or approve transactions that stockholders
        may deem to be in their best interest and, therefore, could adversely affect
        the price of our common stock.</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">No
        Cumulative Voting.</font><font style=\"color:#000000;font-family:'Times New
        Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:700;line-height:120%\">&#160;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">The
        Delaware General Corporation Law, or the DGCL, provides that stockholders
        are not entitled to the right to accumulate votes in the election of directors
        unless our certificate of incorporation provides otherwise. Our certificate
        of incorporation does not provide for cumulative voting.</font></div><div
        style=\"text-indent:25.2pt\"><font><br></font></div><div style=\"text-indent:25.2pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Board
        of Directors</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">.
        Our by-laws provide for a board of directors divided as nearly equally as
        possible into three classes. Each class is elected to a term expiring at the
        annual meeting of stockholders held in the third year following the year of
        such election. The number of directors comprising our board of directors is
        fixed from time to time by the board of directors.</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Removal
        of Directors by Stockholders</font><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">.
        Our by-laws provide that directors may be removed only for cause by the affirmative
        vote of the holders of 75% of the shares of our capital stock issued, outstanding
        and entitled to vote. </font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Advance
        Notice Provisions. </font><font style=\"color:#000000;font-family:'Times New
        Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Our by-laws
        provide that a stockholder must notify us in writing, within timeframes specified
        in the by-laws, of any stockholder nomination of a director and of any other
        business that the stockholder intends to bring at a meeting of stockholders.</font></div><div
        style=\"text-indent:25.2pt\"><font><br></font></div><div style=\"text-indent:25.2pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">No
        Action by Written Consent</font><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">.
        Our certificate of incorporation provides that our stockholders may not act
        by written consent and may only act at duly called meetings of stockholders&#59;
        and that the affirmative vote of the holders of at least 75% of the shares
        of capital stock issued and outstanding and entitled to vote shall be required
        to amend or repeal, or to adopt any provision inconsistent with, the provision
        of our certificate of incorporation prohibiting stockholders from acting by
        written consent.</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Amendment
        to By-laws</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">.
        Our by-laws may be altered, amended or repealed, or new by-laws may be adopted,
        by a majority vote of our board of directors or by the affirmative vote of
        the holders of a majority of our capital stock issued and outstanding and
        entitled to vote. In addition, the affirmative vote of the holders of at least
        75% of the shares of our capital stock issued and outstanding and entitled
        to vote shall be required to amend or repeal, or to adopt any provision inconsistent
        with the provisions of our by-laws related to the powers, number, term, classification,
        committees, the conduct of business at meetings, action by written consent,
        removal and filling of vacancies with respect to our board of directors&#59;
        the calling of special meetings of stockholders&#59; the nomination of directors&#59;
        notice of business at an annual meeting and any provision relating to the
        amendment of the by-laws.</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Undesignated
        Preferred Stock.</font><font style=\"color:#000000;font-family:'Times New
        Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\"> Our board
        of directors has the ability to issue preferred stock with voting or other
        rights or preferences that could impede the success of any attempt to change
        control of our company. These </font></div><div style=\"height:84.24pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">9</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">and
        other provisions may have the effect of deferring hostile takeovers or delaying
        changes in control or management of us.</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">These
        provisions of Delaware law, our certificate of incorporation and our by-laws
        may have the effect of deterring hostile takeovers or delaying changes in
        our control or in our management. These provisions are intended to enhance
        the likelihood of continued stability in the composition of our board of directors
        and in the policies they implement, and to discourage certain types of transactions
        that may involve an actual or threatened change of our control. These provisions
        are designed to reduce our vulnerability to an unsolicited acquisition proposal.
        The provisions also are intended to discourage certain tactics that may be
        used in proxy fights. However, such provisions could have the effect of discouraging
        others from making tender offers for our shares and, as a consequence, they
        also may inhibit fluctuations in the market price of our shares that could
        result from actual or rumored takeover attempts.</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Exclusive
        Forum Selection</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">.
        Our certificate of incorporation provides that, unless we consent in writing
        to the selection of an alternative forum, the Court of Chancery of the State
        of Delaware (or if the Court of Chancery does not have jurisdiction, the federal
        district court for the District of Delaware) shall be the sole and exclusive
        forum for (1) any derivative action or proceeding brought on behalf of our
        company, (2) any action asserting a claim of breach of a fiduciary duty owed
        by any of our current or former directors, officers, other employees or stockholders
        of our company to our company or to our stockholders, (3) any action asserting
        a claim against our company arising pursuant to any provision of the DGCL
        or as to which the DGCL confers jurisdiction on the Court of Chancery, or
        (4) any action asserting a claim against our company pursuant to any provision
        of our certificate of incorporation or by-laws or governed by the internal
        affairs doctrine. This exclusive forum provision would not apply to suits
        brought to enforce any liability or duty created by the Securities Act or
        the Exchange Act or any other claim for which the federal courts have exclusive
        jurisdiction. </font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-style:italic;font-weight:400;line-height:120%\">Delaware
        Business Combination Statute.</font><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\"> We
        are subject to Section 203 of the DGCL, or Section 203, which prohibits a
        Delaware corporation from engaging in business combinations with an interested
        stockholder. An interested stockholder is generally defined as an entity or
        person beneficially owning 15% or more of the outstanding voting stock of
        the corporation or any entity or person affiliated with or controlling or
        controlled by such entity or person. Section 203 provides that an interested
        stockholder may not engage in business combinations with the corporation for
        a period of three years after the date that such stockholder became an interested
        stockholder, with the following exceptions&#58;</font></div><div style=\"text-indent:25.2pt\"><font><br></font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">before
        such date, the board of directors of the corporation approved either the business
        combination or the transaction that resulted in the stockholder becoming an
        interested stockholder&#59; </font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">upon
        completion of the transaction that resulted in the stockholder becoming an
        interested stockholder, the interested stockholder owned at least 85% of the
        voting stock of the corporation outstanding at the time the transaction began,
        excluding for purposes of determining the voting stock outstanding (but not
        the outstanding voting stock owned by the interested stockholder) those shares
        owned (i) by persons who are directors and also officers and (ii) employee
        stock plans in which employee participants do not have the right to determine
        confidentially whether shares held subject to the plan will be tendered in
        a tender or exchange offer&#59; or</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">on
        or after such date, the business combination is approved by the board of directors
        and authorized at an annual or special meeting of the stockholders, and not
        by written consent, by the affirmative vote of at least 66 2&#47;3% of the
        outstanding voting stock that is not owned by the interested stockholder.</font></div><div><font><br></font></div><div
        style=\"text-indent:25.2pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">In
        general, Section 203 defines business combinations to include the following&#58;</font></div><div
        style=\"text-indent:25.2pt\"><font><br></font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">any
        merger or consolidation involving the corporation and the interested stockholder&#59;</font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">10</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">any
        sale, lease, exchange, mortgage, pledge, transfer or other disposition of
        10% or more of the assets of the corporation to or with the interested stockholder&#59;</font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">subject
        to certain exceptions, any transaction that results in the issuance or transfer
        by the corporation of any stock of the corporation to the interested stockholder&#59;
        </font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">any
        transaction involving the corporation that has the effect of increasing the
        proportionate share of the stock of any class or series of the corporation
        beneficially owned by the interested stockholder&#59; or</font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:14.5pt\">the
        receipt by the interested stockholder of the benefit of any loans, advances,
        guarantees, pledges or other financial benefits by or through the corporation.</font></div><div><font><br></font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">11</font></div></div></div><div
        id=\"i266e9e99ed494798b2d0e136dc697093_745\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">PLAN
        OF DISTRIBUTION </font></div><div style=\"text-align:center\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">We
        may sell our common stock&#58;</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">through
        underwriters&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">through
        dealers&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">through
        agents&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">directly
        to purchasers&#59; or</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">through
        a combination of any of these methods of sale.</font></div><div style=\"padding-left:18pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">In
        addition, we may issue our common stock as a dividend or distribution to our
        existing security holders. This prospectus may be used in connection with
        any offering of our common stock through any of these methods or other methods
        described in the applicable prospectus supplement.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">We
        may directly solicit offers to purchase our common stock, or agents may be
        designated to solicit such offers. We will, in the prospectus supplement relating
        to such offering, name any agent that could be viewed as an underwriter under
        the Securities Act, and describe any commissions that we must pay. Any such
        agent will be acting on a best efforts basis for the period of its appointment
        or, if indicated in the applicable prospectus supplement, on a firm commitment
        basis.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">The
        distribution of our common stock may be effected from time to time in one
        or more transactions&#58;</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">at
        a fixed price, or prices, which may be changed from time to time&#59;</font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">at
        market prices prevailing at the time of sale&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">at
        prices related to such prevailing market prices&#59; or</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">at
        negotiated prices.</font></div><div style=\"padding-left:18pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Each
        prospectus supplement will describe the method of distribution of our common
        stock and any applicable restrictions.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">The
        prospectus supplement will describe the terms of the offering of our common
        stock, including the following&#58;</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">the
        name of the agent or any underwriters&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">the
        public offering or purchase price and the proceeds we will receive from the
        sale of the common stock&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">any
        discounts and commissions to be allowed or re-allowed or paid to the agent
        or underwriters&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">all
        other items constituting underwriting compensation&#59;</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">any
        discounts and commissions to be allowed or re-allowed or paid to dealers&#59;
        and</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">the
        exchange on which the common stock will be listed.</font></div><div style=\"padding-left:18pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">If
        any underwriters or agents are utilized in the sale of the common stock in
        respect of which this prospectus is delivered, we will enter into an underwriting
        agreement or other agreement with them at the time of sale to them, and we
        will set forth in the prospectus supplement relating to such offering the
        names of the underwriters or agents and the terms of the related agreement
        with them.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">If
        a dealer is utilized in the sale of the common stock in respect of which this
        prospectus is delivered, we will sell such common stock to the dealer, as
        principal. The dealer may then resell such common stock to the public at varying
        prices to be determined by such dealer at the time of resale.</font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">12</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-indent:36pt\"><font><br></font></div><div style=\"text-indent:36pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Remarketing
        firms, agents, underwriters, dealers and other persons may be entitled under
        agreements which they may enter into with us to indemnification by us against
        certain civil liabilities, including liabilities under the Securities Act,
        and may be customers of, engage in transactions with or perform services for
        us in the ordinary course of business.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">If
        we offer common stock in a subscription rights offering to our existing security
        holders, we may enter into a standby underwriting agreement with dealers,
        acting as standby underwriters. We may pay the standby underwriters a commitment
        fee for the common stock they commit to purchase on a standby basis. If we
        do not enter into a standby underwriting arrangement, we may retain a dealer
        manager to manage a subscription rights offering for us.</font></div><div
        style=\"text-indent:36pt\"><font><br></font></div><div style=\"text-indent:36pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">If
        so indicated in the applicable prospectus supplement, we will authorize underwriters
        or other persons acting as our agents to solicit offers by certain institutions
        to purchase common stock from us pursuant to delayed delivery contracts providing
        for payment and delivery on the date stated in the prospectus supplement.
        Each contract will be for an amount not less than, and the aggregate amount
        of common stock sold pursuant to such contracts shall not be less nor more
        than, the respective amounts stated in the prospectus supplement. Institutions
        with whom the contracts, when authorized, may be made include commercial and
        savings banks, insurance companies, pension funds, investment companies, educational
        and charitable institutions and other institutions, but shall in all cases
        be subject to our approval. Delayed delivery contracts will not be subject
        to any conditions except that&#58;</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"padding-left:18pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">the
        purchase by an institution of the common stock covered under that contract
        shall not at the time of delivery be prohibited under the laws of the jurisdiction
        to which that institution is subject&#59; and</font></div><div style=\"padding-left:18pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:13.8pt\">if
        the common stock is also being sold to underwriters acting as principals for
        their own account, the underwriters shall have purchased such common stock
        not sold for delayed delivery. The underwriters and other persons acting as
        our agents will not have any responsibility in respect of the validity or
        performance of delayed delivery contracts.</font></div><div style=\"padding-left:18pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Certain
        agents, underwriters and dealers, and their associates and affiliates may
        be customers of, have borrowing relationships with, engage in other transactions
        with, and&#47;or perform services, including investment banking services,
        for us or one or more of our respective affiliates in the ordinary course
        of business.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
        style=\"text-indent:36pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">In
        order to facilitate the offering of our common stock, any underwriters may
        engage in transactions that stabilize, maintain or otherwise affect the price
        of our common stock. Specifically, any underwriters may overallot in connection
        with the offering, creating a short position for their own accounts. In addition,
        to cover overallotments or to stabilize the price of our common stock, the
        underwriters may bid for, and purchase our common stock in the open market.
        Finally, in any offering of our common stock through a syndicate of underwriters,
        the underwriting syndicate may reclaim selling concessions allowed to an underwriter
        or a dealer for distributing the common stock in the offering if the syndicate
        repurchases previously distributed common stock in transactions to cover syndicate
        short positions, in stabilization transactions or otherwise. Any of these
        activities may stabilize or maintain the market price of the common stock
        above independent market levels. Any such underwriters are not required to
        engage in these activities and may end any of these activities at any time.</font></div><div
        style=\"text-indent:36pt\"><font><br></font></div><div style=\"text-indent:36pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">As
        of the date of this prospectus, under Rule 15c6-1 of the Exchange Act, trades
        in the secondary market generally are required to settle in two business days,
        unless the parties to any such trade expressly agree otherwise or the securities
        are sold by us to an underwriter in a firm commitment underwritten offering.
        The applicable prospectus supplement may provide that the original issue date
        for your common stock may be more than two scheduled business days after the
        trade date for your common stock. Accordingly, in such a case, if you wish
        to trade common stock on any date prior to the second business day before
        the original issue date for your common stock, you will be required, by virtue
        of the fact that your common stock initially is expected to settle in more
        than </font></div><div style=\"height:84.24pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:center\"><font><br></font></div><div><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:9pt;font-weight:400;line-height:120%\">13</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:72pt;width:100%\"><div><font><br></font></div></div><div><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">two
        scheduled business days after the trade date for your common stock, to make
        alternative settlement arrangements to prevent a failed settlement. In February
        2023, Rule 15c6-1 of the Exchange Act was amended to require, effective May
        28, 2024, trades in the secondary market to settle in one business day, unless
        the parties to any such trade expressly agree otherwise or the securities
        are sold by us to an underwriter in a firm commitment underwritten offering.
        Therefore, for any securities offered under this prospectus on or after May
        28, 2024, the same process described in this paragraph will apply, except
        that purchasers who wish to trade such securities on any date prior to the
        first business day before the original issue date will be required, by virtue
        of the fact that their securities initially are expected to settle in more
        than one scheduled business day after the trade date for their securities,
        to make alternative settlement arrangements to prevent a failed settlement
        as described in this paragraph.</font></div><div style=\"text-indent:36pt\"><font><br></font></div><div
