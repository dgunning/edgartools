        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;padding-left:16.85pt\">enter
        into any swap, hedge or similar agreement or arrangement that transfers to
        another, in whole or in part, the economic consequences of ownership of common
        stock securities currently or hereafter owned either of record or beneficially&#894;
        or</font></div><div style=\"margin-top:6.05pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">engage
        in any short selling of common stock securities.</font></div><div style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt;text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">The
        restriction terminates, with respect to us and our executive officers and
        directors, after the close of trading of the common stock on and including
        the 90</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:5.2pt;font-weight:400;line-height:124%;position:relative;top:-2.8pt;vertical-align:baseline\">th</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">
        day after the date of this prospectus supplement. </font></div><div style=\"height:84.24pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:center\"><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">S-17</font></div><div><font><br></font></div><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"margin-top:5.4pt;padding-right:8pt\"><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt;text-align:justify\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Other
        Activities and Relationships</font></div><div style=\"margin-top:5.5pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">The
        placement agent and financial advisors and certain of their affiliates are
        full service financial institutions engaged in various activities, which may
        include securities trading, commercial and investment banking, financial advisory,
        investment management, investment research, principal investment, hedging,
        financing and brokerage activities. The placement agent and financial advisors
        and certain of their affiliates have, from time to time, performed, and may
        in the future perform, various commercial and investment banking and financial
        advisory services for us and our affiliates, for which they received or will
        receive customary fees and expenses. In addition, we entered into an at-the-market
        offering program amended and restated sales agreement with one of the financial
        advisors on February 8, 2024, pursuant to which we may offer and sell, from
        time to time at our discretion, shares of our common stock having an aggregate
        offering price of up to $100 million through one of the financial advisors
        as our sales agent, for which such financial advisor has received customary
        fees and expenses. The placement agent and financial advisors are also acting
        as the placement agent and financial advisors, respectively, in the Warrant
        Private Placement. However, except as disclosed in this prospectus supplement,
        we have no present arrangements with the placement agent or financial advisors
        for any further services.</font></div><div style=\"margin-top:0.4pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">In
        the ordinary course of their various business activities, the placement agent
        and financial advisors and certain of their affiliates may make or hold a
        broad array of investments and actively trade debt and equity securities (or
        related derivative securities) and financial instruments (including bank loans)
        for their own account and for the accounts of their customers, and such investment
        and securities activities may involve securities and&#47;or instruments issued
        by us and our affiliates. If the placement agent or financial advisors or
        their affiliates have a lending relationship with us, they routinely hedge
        their credit exposure to us consistent with their customary risk management
        policies. The placement agent and financial advisors and their affiliates
        may hedge such exposure by entering into transactions that consist of either
        the purchase of credit default swaps or the creation of short positions in
        our securities or the securities of our affiliates, including potentially
        the common stock offered hereby. Any such short positions could adversely
        affect future trading prices of the common stock offered hereby. The placement
        agent and financial advisors and certain of their affiliates may also communicate
        independent investment recommendations, market color or trading ideas and&#47;or
        publish or express independent research views in respect of such securities
        or instruments and may at any time hold, or recommend to clients that they
        acquire, long and&#47;or short positions in such securities and instruments.</font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div style=\"text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">S-18</font></div><div><font><br></font></div><div><font><br></font></div></div></div><div
        id=\"i266e9e99ed494798b2d0e136dc697093_28\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"margin-top:0.05pt;padding-left:4pt;padding-right:4pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">MATERIAL
        U.S. FEDERAL TAX CONSIDERATIONS FOR NON-U.S. HOLDERS OF OUR COMMON STOCK</font></div><div
        style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">The
        following is a discussion of material U.S. federal income and estate tax considerations
        relating to the ownership and disposition of our common stock by a non-U.S.
        holder. For purposes of this discussion, the term &#8220;non-U.S. holder&#8221;
        means a beneficial owner (other than a partnership or other pass- through
        entity) of our common stock that is not, for U.S. federal income tax purposes&#58;</font></div><div
        style=\"margin-top:6pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">an
        individual who is a citizen or resident of the United States&#894;</font></div><div
        style=\"margin-top:6.75pt;padding-left:50pt;padding-right:8pt;text-indent:-19.65pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;padding-left:16.85pt\">a
        corporation, or other entity treated as a corporation for U.S. federal income
        tax purposes, created or organized in or under the laws of the United States,
        any state thereof or the District of Columbia&#894;</font></div><div style=\"margin-top:6.05pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">an
        estate the income of which is subject to U.S. federal income taxation regardless
        of its source&#894; or</font></div><div style=\"margin-top:6.75pt;padding-left:50pt;padding-right:8pt;text-indent:-19.65pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;padding-left:16.85pt\">a
        trust, if a U.S. court is able to exercise primary supervision over the administration
        of the trust and one or more U.S. persons has authority to control all substantial
        decisions of the trust or if the trust has a valid election in effect to be
        treated as a U.S. person under applicable U.S. Treasury Regulations.</font></div><div
        style=\"margin-top:0.45pt;padding-right:8pt\"><font><br></font></div><div
        style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">This
        discussion is based on current provisions of the U.S. Internal Revenue Code
        of 1986, as amended, which we refer to as the Code, existing and proposed
        U.S. Treasury Regulations promulgated thereunder, current administrative rulings
        and judicial decisions, all as in effect as of the date of this prospectus
        supplement and all of which are subject to change or to differing interpretation,
        possibly with retroactive effect. Any change or differing interpretation could
        alter the tax consequences to non-U.S. holders described in this prospectus
        supplement. In addition, there can be no assurances that the Internal Revenue
        Service, or the IRS, will not challenge one or more of the tax consequences
        described in this prospectus supplement.</font></div><div style=\"margin-top:0.4pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">This
        discussion addresses only non-U.S. holders that hold shares of our common
        stock as a capital asset (generally, property held for investment). This discussion
        does not address all aspects of U.S. federal income and estate taxation that
        may be relevant to a particular non-U.S. holder in light of that non-</font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">U.S.
        holder&#8217;s individual circumstances nor does it address the alternative
        minimum tax, the Medicare tax on net investment income, or any aspects of
        U.S. state, local or non-U.S. taxes. This discussion also does not consider
        any specific facts or circumstances that may apply to a non-U.S. holder and
        does not address the special tax rules applicable to particular non-U.S. holders,
        such as&#58;</font></div><div style=\"margin-top:5.95pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">insurance
        companies&#894;</font></div><div style=\"margin-top:6.75pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">tax-exempt
        organizations and governmental organizations&#894;</font></div><div style=\"margin-top:6.7pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">financial
        institutions&#894;</font></div><div style=\"margin-top:6.75pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">brokers
        or dealers in securities&#894;</font></div><div style=\"margin-top:6.75pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">pension
        plans&#894;</font></div><div style=\"margin-top:6.7pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">controlled
        foreign corporations&#894;</font></div><div style=\"margin-top:6.75pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">passive
        foreign investment companies&#894;</font></div><div style=\"margin-top:6.75pt;padding-left:50pt;padding-right:8pt;text-indent:-19.65pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;padding-left:16.85pt\">owners
        that hold our common stock as part of a straddle, hedge, conversion transaction,
        synthetic security or other integrated investment&#894; and</font></div><div
        style=\"margin-top:6.05pt;padding-left:50pt;padding-right:8pt;text-indent:-19.6pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:16.8pt\">certain
        U.S. expatriates.</font></div><div style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">In
        addition, this discussion does not address the tax treatment of partnerships
        or persons who hold their common stock through partnerships or other entities
        or arrangements that are pass-through entities for U.S. federal income tax
        purposes. A partner in a partnership or other pass-through entity that will
        hold our common stock should consult his, her or its own tax advisor regarding
        the tax consequences of the purchase, ownership and disposition of our common
        stock through a partnership or other pass-through entity, as applicable.</font></div><div
        style=\"margin-top:0.5pt;padding-right:8pt\"><font><br></font></div><div style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:124%\">Prospective
        investors should consult their own tax advisors regarding the U.S. federal,
        state, local and non-U.S. income and other tax considerations of acquiring,
        holding and disposing of our common stock.</font></div><div style=\"margin-top:5.4pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Distributions</font></div><div
        style=\"margin-top:5.5pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        do not expect to make cash distributions to holders of common stock in the
        foreseeable future. If we pay distributions on our common stock, those distributions
        generally will constitute dividends for U.S. federal income tax purposes to
        the extent paid from our current or accumulated earnings and profits, as determined
        under U.S. federal income tax principles. If a distribution exceeds our current
        and accumulated earnings and profits, the excess will be treated as a tax-free
        return of the non-U.S. holder&#8217;s investment, up to such holder&#8217;s
        tax basis in the common stock. Any remaining excess will be treated as capital
        gain, subject to the tax treatment described below under the heading &#8220;Gain
        on Disposition of Common Stock.&#8221;</font></div><div style=\"margin-top:0.45pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Dividends
        paid to a non-U.S. holder generally will be subject to withholding of U.S.
        federal income tax at a 30% rate or such lower rate as may be specified by
        an applicable income tax treaty between the United States and such holder&#8217;s
        country of residence. A non-U.S. holder of our common stock who claims the
        benefit of an applicable income tax treaty between the United States and such
        holder&#8217;s country of residence generally will be required to provide
        a properly executed IRS Form W-8BEN or W-8BEN-E (or successor form) and satisfy
        applicable certification and other requirements. A non-U.S. holder that is
        eligible for a reduced rate of U.S. withholding tax under an income tax treaty
        may obtain a refund or credit of any excess amounts withheld by timely filing
        an appropriate claim with the IRS. Non-U.S. holders are urged to consult their
        own tax advisors regarding their entitlement to benefits under an applicable
        income tax treaty.</font></div><div style=\"margin-top:0.35pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Dividends
        that are treated as effectively connected with a trade or business conducted
        by a non-U.S. holder within the United States, and, if an applicable income
        tax treaty so provides, that are attributable to a permanent establishment
        or a fixed base maintained by the non-U.S. holder within the United States,
        are generally exempt from the 30% withholding tax if the non-U.S. holder satisfies
        applicable certification and disclosure requirements. However, </font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div style=\"text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">S-19</font></div><div><font><br></font></div><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">such
        U.S. effectively connected income is taxed on a net income basis at the same
        U.S. federal income tax rates applicable to United States persons (as defined
        in the Code). Any U.S. effectively connected income received by a non-U.S.
        holder that is a corporation may also, under certain circumstances, be subject
        to an additional &#8220;branch profits tax&#8221; at a 30% rate or such lower
        rate as may be specified by an applicable income tax treaty between the United
        States and such holder&#8217;s country of residence.</font></div><div style=\"margin-top:5.25pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Gain
        on Disposition of Common Stock</font></div><div style=\"margin-top:5.5pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">A
        non-U.S. holder generally will not be subject to U.S. federal income tax on
        gain recognized on a disposition of our common stock unless&#58;</font></div><div
        style=\"margin-bottom:6pt;margin-top:6.75pt;padding-left:49.7pt;padding-right:8pt;text-indent:-19.45pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;padding-left:16.65pt\">the
        gain is effectively connected with the non-U.S. holder&#8217;s conduct of
        a trade or business in the United States, and if an applicable income tax
        treaty so provides, the gain is attributable to a permanent establishment
        or fixed base maintained by the non-U.S. holder in the United States&#894;
        in these cases, the non-U.S. holder will be taxed on a net income basis at
        the same U.S. federal income tax rates applicable to United States persons
        (as defined in the Code), and if the non-U.S. holder is a foreign corporation,
        an additional branch profits tax at a 30% rate, or such lower rates as may
        be specified by an applicable income tax treaty, may also apply&#894;</font></div><div
        style=\"margin-bottom:6pt;margin-top:5.9pt;padding-left:49.7pt;padding-right:8pt;text-indent:-19.45pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;padding-left:16.65pt\">the
        non-U.S. holder is a nonresident alien present in the United States for 183
        days or more in the taxable year of the disposition and certain other requirements
        are met, in which case the non-U.S. holder will be subject to a 30% tax (or
        such lower rate as may be specified by an applicable income tax treaty) on
        the net gain derived from the disposition, which may be offset by U.S. source
        capital losses of the non-U.S. holder, if any&#894; or</font></div><div style=\"margin-top:0.05pt;padding-left:50pt;padding-right:8pt;text-indent:-19.65pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;padding-left:16.85pt\">we
        are or have been, at any time during the five-year period preceding such disposition
        (or the non-U.S. holder&#8217;s holding period, if shorter) a &#8220;U.S.
        real property holding corporation&#8221; unless our common stock is regularly
        traded on an established securities market and the non-U.S. holder held no
        more than 5% of our outstanding common stock, directly or indirectly, during
        the shorter of the five year period ending on the date of the disposition
        or the period that the non-U.S. holder held our common stock. If we are determined
        to be a U.S. real property holding corporation and the non-U.S. holder held
        more than 5% of our outstanding common stock during the relevant period, then
        the non-</font></div><div style=\"padding-left:50pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">U.S.
        holder generally will be taxed on its net gain derived from the disposition
        at the U.S. federal income tax rates applicable to United States persons (as
        defined in the Code). Generally, a corporation is a &#8220;U.S. real property
        holding corporation&#8221; if the fair market value of its &#8220;U.S. real
        property interests&#8221; equals or exceeds 50% of the sum of the fair market
        value of its worldwide real property interests plus its other assets used
        or held for use in a trade or business. Although there can be no assurance,
        we believe that we are not currently, and we do not anticipate becoming, a
        &#8220;U.S. real property holding corporation&#8221; for U.S. federal income
        tax purposes. No assurance can be provided that our common stock will be regularly
        traded on an established securities market for purposes of the rule described
        above.</font></div><div style=\"margin-top:5.05pt;padding-right:8pt\"><font><br></font></div><div
        style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Information
        Reporting and Backup Withholding</font></div><div style=\"margin-top:5.5pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        must report annually to the IRS and to each non-U.S. holder the gross amount
        of the distributions on our common stock paid to such holder and the tax withheld,
        if any, with respect to such distributions. Non-U.S. holders may have to comply
        with specific certification procedures to establish that the holder is not
        a United States person (as defined in the Code) in order to avoid backup withholding
        at the applicable rate with respect to dividends on our common stock. Generally,
        a non-U.S. holder will comply with such procedures if it provides a properly
        executed IRS Form W-8BEN or W-8BEN-E (or other applicable Form W-8) or otherwise
        meets documentary evidence requirements for establishing that it is a non-U.S.
        holder, or otherwise establishes an exemption. Dividends paid to non-U.S.
        holders subject to withholding of U.S. federal income tax, as described above
        under the heading &#8220;</font><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:124%\">Distributions,</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">&#8221;
        will generally be exempt from U.S. backup withholding.</font></div><div style=\"margin-top:0.35pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Information
        reporting and backup withholding generally will apply to the proceeds of a
        disposition of our common stock by a non-U.S. holder effected by or through
        the U.S. office of any broker, U.S. or foreign, unless the holder certifies
        its status as a non-U.S. holder and satisfies certain other requirements,
        or otherwise establishes an exemption. Generally, information reporting and
        backup withholding will not apply to a payment of disposition proceeds to
        a non-U.S. holder where the transaction is effected outside the United States
        through a non-U.S. office of a broker. However, for information reporting
        purposes, dispositions effected through a non-U.S. office of a broker with
        substantial U.S. ownership or operations generally will be treated in a manner
        similar to dispositions effected through a U.S. office of a broker. Non-U.S.
        holders should consult their own tax advisors regarding the application of
        the information reporting and backup withholding rules to them.</font></div><div
        style=\"margin-top:0.3pt;padding-right:8pt\"><font><br></font></div><div style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Copies
        of information returns may be made available to the tax authorities of the
        country in which the non-U.S. holder resides or is incorporated under the
        provisions of a specific treaty or agreement.</font></div><div style=\"margin-top:0.5pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Backup
        withholding is not an additional tax. Rather, any amounts withheld under the
        backup withholding rules from a payment to a non-U.S. holder can be refunded
        or credited against the non-U.S. holder&#8217;s U.S. federal income tax liability,
        if any, provided that an appropriate claim is timely filed with the IRS.</font></div><div
        style=\"margin-top:5.45pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">FATCA</font></div><div
        style=\"margin-top:5.5pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Provisions
        of the Code commonly referred to as the Foreign Account Tax Compliance Act,
        or FATCA, generally impose a 30% withholding tax on dividends on, and gross
        proceeds from the sale or other disposition of, our common stock if paid to
        a foreign entity unless (i) if the foreign entity is a &#8220;foreign financial
        institution,&#8221; the foreign entity undertakes certain due diligence, reporting,
        withholding, and certification obligations, (ii) if the foreign entity is
        not a &#8220;foreign financial institution,&#8221; the foreign entity identifies
        certain of its U.S. investors, or (iii) the foreign entity is otherwise excepted
        under FATCA.</font></div><div style=\"margin-top:0.5pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Withholding
        under FATCA generally applies to payments of dividends on our common stock.
        While withholding under FATCA may apply to payments of gross proceeds from
        a sale or other disposition of our common stock, under proposed U.S. Treasury
        Regulations, withholding on payments of gross proceeds is not required. Although
        such regulations are not final, applicable withholding agents may rely on
        the proposed regulations until final regulations are issued.</font></div><div
        style=\"margin-top:0.45pt;padding-right:8pt\"><font><br></font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div style=\"text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">S-20</font></div><div><font><br></font></div><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">If
        withholding under FATCA is required on any payment related to our common stock,
        investors not otherwise subject to withholding (or that otherwise would be
        entitled to a reduced rate of withholding) on such payment may be required
        to seek a refund or credit from the IRS. An intergovernmental agreement between
        the United States and an applicable foreign country may modify the requirements
        described in this section. Non-U.S. holders should consult their own tax advisors
        regarding the possible implications of FATCA on their investment in our common
        stock and the entities through which they hold our common stock.</font></div><div
        style=\"margin-top:5.35pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">U.S.
        Federal Estate Tax</font></div><div style=\"margin-top:5.5pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Common
        stock owned or treated as owned by an individual who is a non-U.S. holder
        (as specially defined for U.S. federal estate tax purposes) at the time of
        death will be included in the individual&#8217;s gross estate for U.S. federal
        estate tax purposes and, therefore, may be subject to U.S. federal estate
        tax, unless an applicable estate tax or other treaty provides otherwise.</font></div><div
        style=\"margin-top:5.4pt;padding-right:8pt\"><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:124%\">The
        preceding discussion of material U.S. federal tax considerations is for prospective
        investors&#8217; information only. It is not tax advice. Prospective investors
        should consult their own tax advisors regarding the particular U.S. federal,
        state, local and non-U.S. tax consequences of purchasing, holding and disposing
        of our common stock, including the consequences of any proposed changes in
        applicable laws.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
