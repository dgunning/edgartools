        style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"margin-top:0.05pt;padding-left:4pt;padding-right:4pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">DESCRIPTION
        OF COMMON STOCK</font></div><div style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">The
        following description of the material terms of our common stock is intended
        as a summary only and therefore is not a complete description of our common
        stock. This description is based upon, and is qualified by reference to, our
        restated certificate of incorporation, as amended, or our certificate of incorporation,
        our amended and restated by-laws, as amended, or our by-laws, and applicable
        provisions of Delaware corporate law. You should read our certificate of incorporation
        and by-laws, which are filed as exhibits to our Annual Report on Form 10-K
        for the fiscal year ended December 31, 2023 for the provisions that may be
        important to you.</font></div><div style=\"margin-top:0.4pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:120%\">Authorized
        Capital Stock</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">.
        As of December 31, 2024, our authorized capital stock consists of 34,171,875
        shares of common stock and 5,000,000 shares of preferred stock.</font></div><div
        style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:124%\">Annual
        Meeting</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">.
        Annual meetings of our stockholders are held on the date designated in accordance
        with our by-laws. Written notice must be mailed to each stockholder entitled
        to vote not less than ten nor more than 60 days before the date of the meeting.
        The presence in person, by means of remote communication in a manner, if any,
        authorized by our board of directors in its sole discretion, or by proxy of
        the holders of record of a majority of our issued and outstanding shares entitled
        to vote at such meeting constitutes a quorum for the transaction of business
        at meetings of the stockholders. Special meetings of the stockholders may
        be called for any purpose or purposes by the chair of the board of directors,
        chief executive officer (or if there is no chief executive officer, the president)
        or the board of directors. Except as may be otherwise provided by applicable
        law, our certificate of incorporation or our by-laws, all elections shall
        be decided by a plurality, and all other questions shall be decided by a majority,
        of the votes cast by stockholders entitled to vote thereon at a duly held
        meeting of stockholders at which a quorum is present.</font></div><div style=\"margin-top:0.3pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:124%\">Voting
        Rights</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">.
        For all matters submitted to a vote of stockholders, each holder of common
        stock is entitled to one vote for each share registered in his or her name
        on our books. Our common stock does not have cumulative voting rights.</font></div><div
        style=\"margin-top:0.4pt;padding-right:8pt\"><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:124%\">Dividends</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">.
        If our board of directors declares a dividend, holders of common stock will
        receive payments from our funds that are legally available to pay dividends.
        However, this dividend right is subject to any preferential dividend rights
        we may grant to the holders of preferred stock, if any is outstanding.</font></div><div
        style=\"margin-top:0.5pt;padding-right:8pt\"><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:124%\">Liquidation
        and Dissolution</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">.
        If we are liquidated or dissolved, the holders of our common stock will be
        entitled to share ratably in all the assets that remain after we pay our liabilities
        and any amounts we may owe to the holders of preferred stock, if any is outstanding.</font></div><div
        style=\"margin-top:0.5pt;padding-right:8pt\"><font><br></font></div><div style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:120%\">Other
        Rights</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">.
        Holders of the common stock have no right to&#58;</font></div><div style=\"margin-top:6.7pt;padding-left:25.5pt;padding-right:8pt;text-indent:-14.7pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:11.9pt\">convert
        the stock into any other security&#894;</font></div><div style=\"margin-top:6.75pt;padding-left:25.5pt;padding-right:8pt;text-indent:-14.7pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:11.9pt\">have
        the stock redeemed&#894;</font></div><div style=\"margin-top:6.75pt;padding-left:25.5pt;padding-right:8pt;text-indent:-14.7pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:11.9pt\">purchase
        additional stock&#894; or</font></div><div style=\"margin-top:6.7pt;padding-left:25.5pt;padding-right:8pt;text-indent:-14.7pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:11.9pt\">maintain
        their proportionate ownership interest and there are no sinking fund provisions
        applicable to our common stock.</font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">The
        rights, preferences and privileges of the holders of common stock are subject
        to, and may be adversely affected by, the rights of the holders of shares
        of any series of preferred stock that the Company may designate and issue.</font></div><div
        style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:120%\">Transfer
        Agent and Registrar</font><font style=\"color:#000000;font-family:'Times New
        Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">. Computershare
        Trust Company, N.A. is transfer agent and registrar for the common stock.</font></div><div
        style=\"padding-right:8pt\"><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font
