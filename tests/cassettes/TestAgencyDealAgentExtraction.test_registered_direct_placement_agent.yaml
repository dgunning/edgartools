        style=\"margin-top:5.15pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Company
        Overview</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Emavusertib</font></div><div
        style=\"padding-right:8pt\"><font><br></font></div><div style=\"padding-right:8pt\"><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        are a biotechnology company focused on the development of emavusertib (CA-4948),
        an orally available, small molecule inhibitor of Interleukin-1 receptor associated
        kinase, or IRAK4. IRAK4 plays an essential role in the toll-like receptor,
        or TLR, and interleukin-1 receptor, or IL-1R, signaling pathways, which are
        frequently dysregulated in patients with cancer. TLRs and the IL-1R family
        signal through the adaptor protein Myeloid Differentiation Primary Response
        Protein 88, which results in the assembly and activation of IRAK4, initiating
        a signaling cascade that induces cytokine and survival factor expression mediated
        by the NF-&#954;B protein complex. Many B cell leukemias and lymphomas are
        associated with constitutive activation of the NF-&#954;B protein complex
        which contributes to these cancers&#8217; proliferation and survival.  The
        B-cell receptor, or BCR, and TLR pathways drive NF-&#954;B activation. Preclinical
        studies have demonstrated that targeting both the BCR and TLR pathways is
        more synergistic than targeting either pathway alone. Similarly, preclinical
        studies targeting IRAKi in combination with FMS&#8208;like tyrosine kinase
        3, or FLT3, have demonstrated the ability to overcome the adaptive resistance
        incurred when targeting FLT3 alone. In acute myeloid leukemia, or AML, patient
        derived xenografts, emavusertib has shown monotherapy anti-tumor activity
        as well as synergy with both azacitidine and venetoclax. &#160;In the clinic,
        emavusertib has shown anti-tumor activity across a broad range of hematologic
        malignancies including monotherapy activity in AML, particularly those with
        a FLT3 mutation. In non-Hodgkin&#8217;s lymphoma patients, particularly in
        primary central nervous system lymphoma, or PCNSL, emavusertib has shown anti-tumor
        activity in combination with a Bruton Tyrosine Kinase, or BTK, inhibitor.</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">
        \ </font></div><div style=\"padding-right:8pt;text-indent:24.75pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:120%\">
        TakeAim Lymphoma</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">Emavusertib
        is currently undergoing testing in combination with ibrutinib, a BTK inhibitor,
        in a Phase 1&#47;2 open-label, single arm expansion trial in patients with
        relapsed or refractory, or R&#47;R, PCNSL(CA-4948-101, NCT03328078), also
        known as the TakeAim Lymphoma Phase 1&#47;2 study. In June 2022 and December
        2023, we provided preliminary clinical data for patients with various hematological
        malignancies in the combination portion of the ongoing TakeAim Lymphoma Phase
        1&#47;2 study. In December 2023, we provided clinical and safety data of emavusertib
        in combination with ibrutinib in several non-Hodgkin's lymphoma subtypes including
        PCNSL patients. In July and December 2024, emavusertib was granted Orphan
        Drug Designation by the European Commission and the U.S. Food and Drug Administration,
        or FDA, respectively, for the treatment of patients with PCNSL. In September
        2024 and March 2025, we provided additional clinical data of emavusertib in
        combination with ibrutinib in R&#47;R PCNSL. We expect additional data from
        this study in the fourth quarter of 2025.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">In
        March 2025, we announced that we had completed productive meetings with both
        the European Committee for Medicinal Products for Human Use, or CHMP, and
        the FDA on the suitability of using the ongoing TakeAim Lymphoma Phase 1&#47;2
        study to support a potential accelerated regulatory path for a Conditional
        Marketing Authorization, or CMA, submission in Europe and a New Drug Application,
        or NDA, submission in the U.S. &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">For
        submission in Europe, we engaged CHMP for scientific advice on the potential
        for CMA submission, with the following feedback&#58;</font></div><div style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Current,
        single-arm, study could support a CMA&#59;</font></div><div style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Primary
        endpoint of Overall Response Rate, or ORR, for a single-arm study is supported&#59;
        </font></div><div style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">45
        patients may be sufficient to support a CMA, assuming compelling and consistent
        results&#59; </font></div><div style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Due
        to the rarity of disease the proposed size of the safety database may be acceptable
        and will be a review issue for CMA&#59; and</font></div><div style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Contribution
        of effect of each of emavusertib and ibrutinib as well as the emavusertib&#47;ibrutinib
        combination in a BTKi-na&#239;ve population is required for CMA.</font></div><div
        style=\"padding-right:8pt\"><font><br></font></div><div style=\"padding-right:8pt\"><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">For
        submission in the U.S., we discussed with FDA the potential for an NDA submission
        for Accelerated Approval based on the lack of approved treatments, with the
        following feedback&#58;</font></div><div style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">Current,
        single-arm, study could support a submission for Accelerated Approval&#59;</font></div><div
        style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">ORR,
        supported by adequate duration of response, could be acceptable for Accelerated
        Approval&#59; </font></div><div style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">The
        number of patients needed to support safety and efficacy is a review issue,
        which is part of the NDA submission process&#59; and</font></div><div style=\"padding-left:36pt;padding-right:8pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:14.5pt\">An
        analysis of 100 mg vs 200 mg emavusertib dosing and contribution of effect
        of emavusertib, ibrutinib, and the emavusertib&#47;ibrutinib combination in
        a BTKi-na&#239;ve population is required prior to NDA submission.</font></div><div
        style=\"padding-right:8pt\"><font><br></font></div><div style=\"padding-right:8pt\"><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">Both
        the CHMP and FDA encouraged us to continue discussions to align on the confirmatory
        study design, which is required prior to the CMA or NDA submission.</font></div><div
        style=\"padding-right:8pt;text-indent:24.75pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:120%\">TakeAim
        Leukemia</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">In
        addition to the TakeAim Lymphoma Phase 1&#47;2 study, emavusertib is currently
        undergoing testing in a Phase 1&#47;2 open-label, single arm expansion trial
        in patients with R&#47;R AML and high-risk myelodysplastic syndromes (CA-4948-102,
        NCT04278768), also known as the TakeAim Leukemia Phase 1&#47;2 study. </font></div></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div style=\"text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">S-7</font></div><div><font><br></font></div><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"border-color:#000000;border-style:solid;border-width:1.00pt;padding:45.12pt
        14.88pt 60.24pt 19.92pt\"><div style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">In
        January and December 2022, July and December 2023, and May and December 2024,
        we presented clinical data for patients from the ongoing TakeAim Leukemia
        Phase 1&#47;2 study. Enrollment in the TakeAim Leukemia study is substantially
        complete.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:120%\">AML
        Triplet Study</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        have initiated a Phase 1 clinical study of emavusertib as an add-on agent
        to the combination of azacitidine and venetoclax in AML (CA-4948-104, 2023-505828-58),
        which we refer to as the AML Triplet study. The AML Triplet study is currently
        being conducted in Spain, Germany, and Italy. The study is assessing the safety
        and tolerability of different dosing regimens of emavusertib in the triple
        combination in patients who achieved a complete remission on venetoclax and
        azacitidine, while remaining positive for minimal residual disease. To date,
        the trial has enrolled the first dosing cohort of emavusertib in combination
        with azacitidine and venetoclax. All patients in this cohort tolerated the
        triple regimen well, with no unexpected adverse events. As a result, the external
        Clinical Safety Review Committee recommended to escalate to the next dosing
        cohort, and enrollment for this cohort is currently ongoing.</font></div><div
        style=\"padding-right:8pt;text-indent:24.75pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:120%\">Our
        Collaborations and License Agreements</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        are party to a collaboration agreement with Genentech Inc., or Genentech,
        a member of the Roche Group, under which Genentech and F. Hoffmann-La Roche
        Ltd, or Roche, are commercializing Erivedge&#174; (vismodegib), a first-in-class
        orally administered small molecule Hedgehog signaling pathway antagonist.
        Erivedge is approved for the treatment of advanced basal cell carcinoma.</font></div><div
        style=\"padding-right:8pt;text-indent:24.75pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">In
        January 2015, we entered into an exclusive collaboration agreement with Aurigene
        Discovery Technologies Limited, or Aurigene, which was amended in September
        2016, February 2020, and September 2024, for the discovery, development and
        commercialization of small molecule compounds in the areas of immuno-oncology
        and precision oncology worldwide, except for India and Russia, which are territories
        retained by Aurigene. We currently have licensed the IRAK4 (including emavusertib),
        PD1&#47;TIM3, and the immuno-oncology programs under the Aurigene collaboration.</font></div><div
        style=\"margin-bottom:12pt;margin-top:12pt;padding-right:7.9pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Liquidity
        and Events that Raise Substantial Doubt About Our Ability to Continue as a
        Going Concern</font></div><div style=\"margin-top:6.1pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        will require substantial funds to maintain our research and development program
        and support operations in the near term. As of December 31, 2024, we estimate
        that we had $20.0 million in cash and cash equivalents. The estimated cash
        and cash equivalents amount is preliminary, represents management&#8217;s
        estimate as of the date of this prospectus supplement, is subject to completion
        of our financial closing procedures for the year ended December 31, 2024,
        and does not present all necessary information for a complete understanding
        of our financial condition as of December 31, 2024, or our results of operations
        for the year ended December 31, 2024. The actual financial results may differ
        materially from the preliminary estimated financial information. The preliminary
        financial data included in this&#160;prospectus supplement has been prepared
        by, and is the responsibility of,&#160;Curis Inc.&#8217;s management. PricewaterhouseCoopers
        LLP has not audited, reviewed, examined, compiled, nor applied agreed-upon
        procedures with respect to the preliminary financial data. Accordingly, PricewaterhouseCoopers
        LLP does not express an opinion or any other form of assurance with respect
        thereto.</font></div><div style=\"margin-top:6.1pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">Without
        taking into account the anticipated net proceeds from this offering and the
        Warrant Private Placement, we expect these available cash resources to fund
        our existing operations into mid-2025. We have based this assessment on assumptions
        that may prove to be wrong, and we could exhaust our available capital resources
        sooner than we expect. Based on our current cash and cash equivalents, recurring
        losses and cash outflows from operations since inception, an expectation of
        continuing losses and cash outflows from operations for the foreseeable future
        and the need to raise additional capital to finance our future operations,
        we have concluded that we do not have sufficient cash on hand to support current
        operations beyond the next 12 months and, therefore, we have substantial doubt
        about our ability to continue as a going concern beyond the next 12 months.
        \ The proceeds of this offering and the sale of Pre-Funded Warrants in the
        Warrant Private Placement will not be sufficient to alleviate our substantial
        doubt about our ability to continue as a going concern beyond the next 12
        months.  We anticipate that the report from our independent registered public
        accounting firm issued in connection with our Annual Report on Form 10-K for
        the year ended December 31, 2024 will contain, and future reports may contain,
        statements expressing substantial doubt about our ability to continue as a
        going concern.</font></div><div style=\"margin-top:6.1pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        will require substantial additional funding in the immediate term to fund
        the development of emavusertib through regulatory approval and commercialization,
        and to support our continued operations. We will need to seek additional funding
        through a number of potential avenues, including private or public equity
        financings, collaborations, or other strategic transactions. We have faced
        and expect to continue to face substantial difficulty in raising capital.
        If sufficient funds are not available, we will have to delay, reduce the scope
        of, or eliminate our research and development program for emavusertib, including
        related clinical trials and operating expenses, potentially delaying the time
        to market for or preventing the marketing of emavusertib, which would adversely
        affect our business prospects and our ability to continue our operations,
        and would have a negative impact on our financial condition and ability to
        pursue our business strategies. In addition, we may seek to engage in one
        or more strategic alternatives, such as a strategic partnership with one or
        more parties, the licensing, sale or divestiture of some of our assets or
        proprietary technologies or the sale of our company, but there can be no assurance
        that we would be able to enter into such a transaction or transactions on
        a timely basis or on terms favorable to us, or at all. If we are unable to
        obtain sufficient capital, we would be unable to fund our operations and may
        be required to evaluate alternatives, which could include dissolving and liquidating
        our assets or seeking protection under the bankruptcy laws, and a determination
        to file for bankruptcy could occur at a time that is earlier than when we
        would otherwise exhaust our cash resources. If we decide to dissolve and liquidate
        our assets or to seek protection under the bankruptcy laws, it is unclear
        to what extent we would be able to pay our obligations, and, accordingly,
        it is further unclear whether and to what extent any resources would be available
        for distributions to stockholders.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Company
        Information</font></div><div style=\"margin-top:5.5pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        were organized as a Delaware corporation in February 2000. Our principal executive
        offices are located at 128 Spring Street, Building C &#8211; Suite 500, Lexington,
        Massachusetts 02421, and our telephone number is (617) 503-6500. Our website
        is located at www.curis.com. The information contained in, or that can be
        accessed through, our website is not incorporated by reference into this prospectus
        supplement or the accompanying prospectus and should not be considered to
        be a part of this prospectus supplement or the accompanying prospectus. Our
        website address is included as an inactive textual reference only.</font></div><div
        style=\"margin-top:5.35pt;padding-right:8pt\"><font><br></font></div><div
