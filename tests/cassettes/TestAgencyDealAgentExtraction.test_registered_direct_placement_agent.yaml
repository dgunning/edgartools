        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">In
        the Warrant Private Placement closing concurrently with the offering, we are
        selling Pre-Funded Warrants to purchase up to 2,184,009 shares of our common
        stock and Common Warrants to purchase up to 8,316,882 shares of our common
        stock. For each share of our common stock sold in this offering and for each
        Pre-Funded Warrant Share, an accompanying Common Warrant to purchase two shares
        of common stock will be issued to the investor thereof. Each Common Warrant
        will be exercisable for one share of our common stock at an exercise price
        of $2.41 per share, will be exercisable beginning on the Requisite Stockholder
        Approval Date, and will have a term of exercise equal to five years from the
        date of issuance. Each Pre-Funded Warrant will be exercisable for one share
        of our common stock at an exercise price of $0.01 per share, will be immediately
        exercisable and will be exercisable until the Pre-Funded Warrant is exercised
        in full.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">The
        Unregistered Warrants and Unregistered Warrant Shares issuable upon the exercise
        of the Unregistered Warrants are not being registered under the Securities
        Act, nor are they being offered pursuant to this prospectus supplement and
        accompanying prospectus. The Unregistered Warrants and Unregistered Warrant
        Shares are being offered pursuant to the exemption provided in Section 4(a)(2)
        of the Securities Act and&#47;or Regulation D promulgated thereunder.</font></div><div
        style=\"padding-right:8pt\"><font><br></font></div><div style=\"padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">Accordingly,
        the investors in the Warrant Private Placement may exercise the Unregistered
        Warrants and sell the Unregistered Warrant Shares issuable upon the exercise
        of such security only pursuant to an effective registration statement under
        the Securities Act covering the resale of those shares, an exemption under
        Rule 144 under the Securities Act or another applicable exemption under the
        Securities Act or, if and only if there is no effective registration statement
        registering the resale of the Unregistered Warrant Shares, or no current prospectus
        available for such shares, the investors may exercise the Unregistered Warrants
        by means of a &#8220;cashless exercise.&#8221; </font></div><div style=\"padding-right:8pt;text-indent:36pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">If,
        at the time a holder exercises its Unregistered Warrants, a registration statement
        registering the Unregistered Warrant Shares under the Securities Act is not
        then effective or available for the resale of such shares, then in lieu of
        making the cash payment otherwise contemplated to be made to us upon such
        exercise in payment of the aggregate exercise price, the holder may elect
        instead to receive upon such exercise (either in whole or in part) the net
        number of shares of common stock determined according to a formula set forth
        in the Unregistered Warrants.  No fractional shares will be issued upon the
        exercise of the Unregistered Warrants. We will, at our election, either pay
        a cash adjustment in respect of any such final fraction in an amount equal
        to such fraction multiplied by the exercise price or round up to the next
        whole share.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        may not effect the exercise of any Unregistered Warrant, and a holder will
        not have the right to exercise any portion of any Unregistered Warrant if,
        upon giving effect to such exercise, the aggregate number of shares of our
        common stock beneficially owned by the holder (together with its affiliates)
        would exceed 4.99% or 9.99%, as elected by the holder, of the number of shares
        of our common stock outstanding immediately after giving effect to the exercise,
        as such percentage ownership is determined in accordance with the terms of
        such warrant, which percentage may be increased at the holder&#8217;s election
        upon 61 days&#8217; notice to us subject to the terms of such warrants, provided
        that such percentage may in no event exceed 9.99% or 19.99%, as elected by
        the holder.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">In
        certain circumstances, upon a fundamental transaction (as described in the
        Unregistered Warrants, and generally including any reclassification, reorganization
        or recapitalization of our common stock&#59; the sale, lease, license, assignment,
        conveyance, transfer or other disposition of all or substantially all of our
        assets&#59; our consolidation or merger with or into another person in which
        we are not the surviving entity, the acquisition of more than 50% of our outstanding
        common stock&#59; or any person or group becoming the beneficial owner of
        50% of the voting power of our outstanding common stock and in connection
        with such transaction our common stock is converted into or exchanged for
        other securities, cash or property), the holders of Unregistered Warrants
        will be entitled to receive upon exercise of the Unregistered Warrants the
        kind and amount of securities, cash or other property that the holders would
        have received had they exercised the Unregistered Warrants immediately prior
        to such fundamental transaction.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">Notwithstanding
        anything to contrary, in certain circumstances, upon certain fundamental transactions,
        the holders of Unregistered Warrants will have the right to require us or
        a successor entity to repurchase such warrants at their fair value using a
        Black Scholes option pricing formula&#59; provided that in the event that
        (i) the fundamental transaction is not approved by the Board of Directors,
        and therefore not within our control, and (ii)  the alternate consideration
        payable to holders of common stock in such fundamental transaction consists
        of equity securities of the successor or acquirer that are quoted or listed
        on a nationally recognized securities exchange, then the holder of the warrants
        shall only be entitled to receive the same type or form of consideration (and
        in the same proportion), determined in accordance with the Black Scholes option
        pricing formula.</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">Except
        as otherwise provided in the Unregistered Warrants or by virtue of such holder&#8217;s
        ownership of shares of our common stock, the holders of the Unregistered Warrants
        do not have the rights or privileges of holders of our common stock, including
        any voting rights, until they exercise their Unregistered Warrants, as applicable.</font></div><div
        style=\"padding-right:8pt\"><font><br></font></div><div style=\"padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">The
        Unregistered Warrants are not and will not be listed for trading on any national
        securities exchange or any other nationally recognized trading system. </font></div><div
        style=\"height:84.24pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div><div style=\"text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">S-16</font></div><div><font><br></font></div><div><font><br></font></div></div></div><div
        id=\"i266e9e99ed494798b2d0e136dc697093_487\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"margin-top:0.05pt;padding-left:4pt;padding-right:4pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">PLAN
        OF DISTRIBUTION</font></div><div style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        have engaged Laidlaw &#38; Company (UK) Ltd., which we refer to as the placement
        agent, to act as our placement agent to solicit offers to purchase the securities
        offered by this prospectus supplement and the accompanying prospectus. Under
        the terms of an engagement letter between us and the placement agent, the
        placement agent is not purchasing or selling any securities, nor are they
        required to arrange for the purchase and sale of any specific number or dollar
        amount of securities, but only to use their best efforts to arrange for the
        sale of the securities by us. Therefore, we may not sell all of the securities
        being offered hereby. The terms of this offering were subject to market conditions
        and negotiations between us and the prospective investors. We have entered
        into a securities purchase agreement directly with the investors who have
        agreed to purchase our securities in this offering. We will only sell securities
        in this offering to such investors.</font></div><div style=\"margin-top:0.35pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">Delivery
        of the securities offered hereby is expected to occur on or about March 31,
        2025, subject to the satisfaction of customary closing conditions.</font></div><div
        style=\"margin-top:6.1pt;padding-right:8pt\"><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Fees
