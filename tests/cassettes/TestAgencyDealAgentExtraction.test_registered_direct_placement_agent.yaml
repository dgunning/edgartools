        style=\"margin-top:0.05pt;padding-left:4pt;padding-right:4pt;text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">RISK
        FACTORS</font></div><div style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:400;line-height:124%\">An
        investment in our securities involves a high degree of risk. Before deciding
        whether to invest in our securities, you should consider carefully the risks
        described below and discussed in the &#8220;Risk Factors&#8221; sections of
        our Annual Report on Form 10-K for the fiscal year ended December 31, 2023
        incorporated by reference herein, together with other information in this
        prospectus supplement and the accompanying prospectus, and the information
        and documents incorporated by reference in this prospectus supplement and
        the accompanying prospectus, and in any free writing prospectus that we have
        authorized for use in connection with this offering. If any of these risks
        actually occurs, our business, financial condition, results of operations
        or cash flow could be seriously harmed. This could cause the trading price
        of our securities to decline, resulting in a loss of all or part of your investment.</font></div><div
        style=\"margin-top:5.25pt;padding-right:8pt\"><font><br></font></div><div
        style=\"margin-bottom:6pt;padding-left:5.75pt;padding-right:7.9pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">Risks
        Related to This Offering</font></div><div style=\"margin-bottom:6pt;padding-left:4.3pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:120%\">We
        have identified conditions and events that raise substantial doubt about our
        ability to continue as a going concern.</font></div><div style=\"margin-bottom:6pt;padding-left:4.5pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        will require substantial funds to maintain our research and development program
        and support operations in the near term. We have incurred losses and negative
        cash flows from operations since our inception. As of December 31, 2024, we
        estimate that we had $20.0 million in cash and cash equivalents. Without taking
        into account the anticipated net proceeds from this offering and the Warrant
        Private Placement,</font><font style=\"color:#000000;font-family:'Times New
        Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\"> </font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">we
        expect these available cash resources to fund our existing operations into
        mid-2025. We have based this assessment on assumptions that may prove to be
        wrong, and we could exhaust our available capital resources sooner than we
        expect. Based on our current cash and cash equivalents, recurring losses and
        cash outflows from operations since inception, an expectation of continuing
        losses and cash outflows from operations for the foreseeable future and the
        need to raise additional capital to finance our future operations, we do not
        have sufficient cash on hand to support current operations beyond the next
        12 months.</font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">
        </font><font style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">The
        preliminary financial data included in this&#160;prospectus supplement has
        been prepared by, and is the responsibility of,&#160;Curis Inc.&#8217;s management.
        PricewaterhouseCoopers LLP has not audited, reviewed, examined, compiled,
        nor applied agreed-upon procedures with respect to the preliminary financial
        data. Accordingly, PricewaterhouseCoopers LLP does not express an opinion
        or any other form of assurance with respect thereto.</font></div><div style=\"margin-bottom:6pt;padding-left:4.5pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        will require substantial additional funding in the immediate term to fund
        the development of emavusertib through regulatory approval and commercialization,
        and to support our continued operations. We will need to seek additional funding
        through a number of potential avenues, including private or public equity
        financings, collaborations, or other strategic transactions. We have faced
        and expect to continue to face substantial difficulty in raising capital.
        If sufficient funds are not available, we will have to delay, reduce the scope
        of, or eliminate our research and development program for emavusertib, including
        related clinical trials and operating expenses, potentially delaying the time
        to market for or preventing the marketing of emavusertib, which would adversely
        affect our business prospects and our ability to continue our operations,
        and would have a negative impact on our financial condition and ability to
        pursue our business strategies. In addition, we may seek to engage in one
        or more strategic alternatives, such as a strategic partnership with one or
        more parties, the licensing, sale or divestiture of some of our assets or
        proprietary technologies or the sale of our company, but there can be no assurance
        that we would be able to enter into such a transaction or transactions on
        a timely basis or on terms favorable to us, or at all. If we are unable to
        obtain sufficient capital, we would be unable to fund our operations and may
        be required to evaluate alternatives, which could include dissolving and liquidating
        our assets or seeking protection under the bankruptcy laws, and a determination
        to file for bankruptcy could occur at a time that is earlier than when we
        would otherwise exhaust our cash resources. If we decide to dissolve and liquidate
        our assets or to seek protection under the bankruptcy laws, it is unclear
        to what extent we would be able to pay our obligations, and, accordingly,
        it is further unclear whether and to what extent any resources would be available
        for distributions to stockholders.</font></div><div style=\"padding-left:4.5pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">If
        we are unable to continue as a going concern, we may have to liquidate our
        assets and may receive less than the value at which those assets are carried
        on our audited financial statements, and it is likely that investors will
        lose all or a part of their investment. We expect that the report from our
        independent registered public accounting firm issued in connection with our
        Annual Report on Form 10-K for the year ended December 31, 2024 will contain,
        and future reports may contain, statements expressing substantial doubt about
        our ability to continue as a going concern. If we seek additional financing
        to fund our business activities in the future and there remains substantial
        doubt about our ability to continue as a going concern, investors or other
        financing sources may be unwilling to provide funding to us on commercially
        reasonable terms, if at all.</font></div><div style=\"margin-top:5.5pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:131%\">We
        have broad discretion in how we use the net proceeds of this offering, and
        we may not use these proceeds effectively or in ways with which you agree.</font></div><div
        style=\"margin-top:4.95pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Our
        management will have broad discretion as to the application of the net proceeds
        of this offering, including for any of the purposes described in the section
        of this prospectus supplement entitled &#8220;Use of Proceeds.&#8221; You
        will be relying on the judgment of our management regarding the application
        of the proceeds of this offering. The results and effectiveness of the use
        of proceeds are uncertain, and we could spend the proceeds in ways that you
        do not agree with or that do not improve our results of operations or enhance
        the value of our common stock. Our failure to apply these funds effectively
        could have a material adverse effect on our business, delay the development
        of our drug candidates and cause the price of our common stock to decline.</font></div><div
        style=\"margin-top:5.3pt;padding-right:8pt\"><font><br></font></div><div style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:120%\">Investors
        in this offering will pay a much higher price than the book value of our stock.</font></div><div
        style=\"margin-top:6.1pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">The
        offering price of our common stock is substantially higher than the net tangible
        book value per share of our common stock. Therefore, if you purchase shares
        of common stock in this offering, you will pay a price per share of common
        stock that substantially exceeds our net tangible book value per share after
        giving effect to this offering. Based on an offering price of $2.41 per share
        of common stock, if you purchase shares of common stock in this offering,
        you will experience immediate dilution of $3.27 per share, representing the
        difference between the offering price of the common stock and our as adjusted
        net tangible book value per share after giving effect to this offering. For
        a further description of the dilution that you will experience immediately
        after this offering, see &#8220;Dilution.&#8221;</font></div><div style=\"margin-top:5.25pt;padding-right:8pt\"><font><br></font></div><div
        style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:120%\">You
        may experience future dilution as a result of future equity offerings or other
        issuances.</font></div><div style=\"margin-top:6.1pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        will need additional capital to fund our research and development programs
        and to fulfill our planned operating goals. We may seek additional capital
        through a combination of private and public equity offerings, debt financings,
        strategic partnerships and alliances and licensing arrangements, which may
        cause your ownership interest to be diluted. We are currently party to the
        sales agreement with Cantor Fitzgerald &#38; Co. and JonesTrading Institutional
        Services LLC, pursuant to which, from time to time, we may offer and sell
        through such agents up to $100.0 million of our common stock pursuant to one
        or more &#8220;at the market&#8221; offerings. To date, we have sold $1.2
        million of common stock pursuant to the sales agreement. In addition, we have
        a significant </font></div><div style=\"height:84.24pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:center\"><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">S-11</font></div><div><font><br></font></div><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"margin-top:6.1pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">number
        of options and warrants to purchase shares of our common stock outstanding.
        If these securities are exercised, you may incur further dilution. Moreover,
        to the extent that we issue additional options to purchase, or securities
        convertible into or exchangeable for, shares of our common stock in the future
        and those options or other securities are exercised, converted or exchanged,
        stockholders may experience further dilution.</font></div><div style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font><br></font></div><div
        style=\"margin-top:0.05pt;padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:131%\">A
        substantial number of shares may be sold in the market following this offering,
        which may depress the market price for our common stock or cause it to be
        highly volatile.</font></div><div style=\"margin-top:4.95pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Sales
        of a substantial number of shares of our common stock in the public market
        following this offering, or the perception that such sales could occur, could
        cause the market price of our common stock to decline or cause it to be highly
        volatile. A substantial majority of the outstanding shares of our common stock
        are, and all of the shares sold in this offering will be, freely tradable
        without restriction or further registration under the Securities Act, unless
        these shares are owned or purchased by &#8220;affiliates&#8221; as that term
        is defined in Rule 144 under the Securities Act. In addition, we have also
        registered the shares of common stock that we may issue under our equity incentive
        plans. As a result, these shares can be freely sold in the public market upon
        issuance, subject to restrictions under securities laws.</font></div><div
        style=\"margin-top:5.25pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-style:italic;font-weight:700;line-height:131%\">Because
        we do not anticipate paying any cash dividends on our capital stock in the
        foreseeable future, capital appreciation, if any, will be your sole source
        of gain.</font></div><div style=\"margin-top:4.95pt;padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        have never declared nor paid cash dividends on our common stock. We currently
        plan to retain all of our future earnings, if any, to finance the operation,
        development and growth of our business. In addition, the terms of any future
        debt or credit agreements may preclude us from paying dividends. As a result,
        capital appreciation, if any, of our common stock will be your sole source
        of gain for the foreseeable future.</font></div><div style=\"height:84.24pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:center\"><font><br></font></div><div
        style=\"text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:11pt;font-weight:400;line-height:120%\">S-12</font></div><div><font><br></font></div><div><font><br></font></div></div></div><div
        id=\"i266e9e99ed494798b2d0e136dc697093_405\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:69.12pt;width:100%\"><div><font><br></font></div></div><div
        style=\"padding-left:4pt;padding-right:4pt;text-align:center\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:700;line-height:120%\">USE
        OF PROCEEDS</font></div><div style=\"margin-top:1.2pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        estimate that the net proceeds we will receive from this offering will be
        approximately $4.3 million, and together with the net proceeds we will receive
        from the sale of Pre-Funded Warrants in the Warrant Private Placement of approximately
        $4.7 million, we expect to receive aggregate net proceeds of approximately
        $9.0 million, after deducting the estimated placement agent fees, advisory
        fees and estimated offering expenses payable by us. This estimate excludes
        the proceeds, if any, from the exercise of Unregistered Warrants being issued
        in the Warrant Private Placement.</font></div><div style=\"margin-top:0.55pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        intend to use the net proceeds from this offering, together with our existing
        cash and cash equivalents on research, development, working capital and other
        general corporate purposes.</font></div><div style=\"margin-top:0.5pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        may temporarily invest the net proceeds from this offering in investment-grade,
        interest-bearing securities until they are used for their stated purpose.
        We have no current commitments or agreements with respect to any material
        acquisitions and may not make any material acquisitions. We have not determined
        the amounts we plan to spend on any of the areas listed above or the timing
        of these expenditures. The occurrence of unforeseen events or changed business
        conditions, however, could result in the application of the net proceeds from
        this offering in a manner other than as described in this prospectus supplement.
        As a result, our management will retain broad discretion over the allocation
        of the net proceeds from this offering.</font></div><div style=\"margin-top:0.45pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Based
        on our research and development plans and our timing expectations related
        to the progress of our programs, we expect that the net proceeds from this
        offering and the sale of Pre-Funded Warrants in the Warrant Private Placement,
        together with our existing cash and cash equivalents, will enable us to fund
        our operations into the fourth quarter of 2025. We have based this estimate
        on assumptions that may prove to be wrong, and it is possible that we will
        not achieve the progress that we expect with these funds because the actual
        costs and timing of preclinical and clinical development, regulatory and commercial
        activities are difficult to predict and are subject to substantial risks and
        delays, and that we will use our capital resources sooner than we currently
        expect. This estimate does not reflect any additional expenditures that may
        result from any further strategic transactions to expand and diversify our
        product pipeline, including acquisitions of assets, businesses, rights to
        products, product candidates or technologies or strategic alliances or collaborations
        that we may pursue. The proceeds of this offering and the sale of Pre-Funded
        Warrants in the Warrant Private Placement will not be sufficient to alleviate
        our substantial doubt about our ability to continue as a going concern beyond
        the next 12 months.</font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font><br></font></div><div
        style=\"padding-left:5.9pt;padding-right:8pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">We
        will require additional funding to fund the development of emavusertib through
        regulatory approval and commercialization, and to support our continued operations.
        We expect to finance our operations through the proceeds of this offering,
        our sales agreement with Cantor Fitzgerald &#38; Co. and JonesTrading Institutional
        Services LLC or other potential equity financings, debt financings, strategic
        transactions or other capital sources. However, we may not be successful in
        securing additional financing on acceptable terms, or at all. If we are unable
        to obtain sufficient funding, we will be forced to delay, reduce in scope
        or eliminate our research and development program for emavusertib, including
        related clinical trials and operating expenses, potentially delaying the time
        to market for, or preventing the marketing of, emavusertib, which could adversely
        affect our business prospects and our ability to continue operations, and
        would have a negative impact on our financial condition and our ability to
        pursue our business strategies. See &#8220;Risk Factors&#8212;We have identified
        conditions and events that raise substantial doubt about our ability to continue
        as a going concern&#8221; on page </font><font style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;text-decoration:underline\">S-<a
        href=\"#i266e9e99ed494798b2d0e136dc697093_25\" style=\"color:#000000;font-family:'Times
        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;text-decoration:underline\">11</a></font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">
        of this prospectus supplement. </font></div><div style=\"height:84.24pt;position:relative;width:100%\"><div
