        New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">If
        you purchase our securities in this offering, your ownership interest will
        be diluted immediately to the extent of the difference between the offering
        price per share of common stock in this offering and Pre-Funded Warrants issued
        in the Warrant Private Placement and the net tangible book value per share
        of our common stock after this offering and the Warrant Private Placement.</font></div><div
