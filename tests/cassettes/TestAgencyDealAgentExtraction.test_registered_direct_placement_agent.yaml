        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">Our
        net tangible book value on September 30, 2024 was approximately ($17.7 million),
        or ($2.94) per share. &#8220;Net tangible book value&#8221; is total assets
        minus the sum of liabilities and goodwill. &#8220;Net tangible book value
        per share&#8221; is net tangible book value divided by the total number of
        shares outstanding.</font></div><div><font><br></font></div><div style=\"padding-left:5.9pt;padding-right:8pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">After
