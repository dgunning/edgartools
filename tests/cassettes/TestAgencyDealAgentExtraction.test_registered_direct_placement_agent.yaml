        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:120%\">We
        and our executive officers and directors have agreed, subject to specified
        exceptions, not to directly or indirectly&#58;</font></div><div style=\"margin-top:6.75pt;padding-left:50pt;padding-right:8pt;text-indent:-19.65pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',sans-serif;font-size:8pt;font-weight:400;line-height:124%;padding-left:16.85pt\">offer,
        sell, assign, transfer, pledge, contract to sell, or otherwise dispose of
        (or announce the intention to otherwise dispose of) any shares of common stock,
        options or warrants to acquire shares of common stock, or securities exchangeable
        for or exercisable for or convertible into shares of common stock, which we
        refer to as common stock securities&#894;</font></div><div style=\"padding-right:8pt\"><font><br></font></div><div
        style=\"margin-top:0.05pt;padding-left:50pt;padding-right:8pt;text-indent:-19.65pt\"><font
