        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">Consolidated
        revenues for the quarter were $1.01 billion, compared with $1.03 billion in
        the third quarter of 2024. Commercial Segment revenues (70 percent of total
        revenues) totaled $711.3 million, compared with $718.8 million in the third
        quarter of 2024. Commercial Segment revenues are categorized into five industries&#58;
        (i) Consumer and Industrial, (ii) Financial Services, (iii) Technology, Media
        and Telecom (&#34;TMT&#34;), (iv) Healthcare, and (v) Business Services. Consumer
        and Industrial was up mid-teens, Healthcare was up high single digits, and
        the remaining three industries declined. Federal Government Segment revenues
        (30 percent of total revenues) totaled $300.1 million, compared with $312.2
        million in the prior-year period. Federal Segment revenues are categorized
        into four customer types&#58; (i) Defense and Intelligence, (ii) National
        Security, (iii) Civilian, and (iv) other clients. Federal Civilian and Defense
        and Intelligence both declined year-over-year, while National Security was
        up.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">Total
        IT consulting revenues were $635.0 million (63 percent of total revenues),
        compared with $597.2 million (58 percent of total revenues) in the third quarter
        of 2024. Commercial Segment</font><font style=\"color:#ee2724;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">
        </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">consulting
        revenues were $334.9 million, up 17.5 percent year-over-year. Federal Government
        Segment revenues, which are all IT consulting revenues, were $300.1 million,
        as stated above. Assignment revenues totaled $376.4 million (37 percent of
        total revenues), compared with $433.8 million (42 percent of total revenues)
        in the prior-year period, and reflected continued softness in the portions
        of the Commercial Segment business that are more sensitive to changes in macroeconomic
        cycles. </font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">Gross
        margin for the third quarter of 2025 was 29.4 percent, an expansion of 30
        basis points from the third quarter of 2024. Gross margin for the Commercial
        Segment was up 40 basis points,</font><font style=\"color:#ee2724;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">
        </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">reflecting
        a higher mix of consulting revenues. Gross margin for the Federal Government
        Segment was down 40 basis points, due to the loss of certain higher margin
        contracts as a result of initiatives associated with the U.S. Department of
        Government Efficiency. </font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">Selling,
        general, and administrative (&#8220;SG&#38;A&#8221;) expenses were $212.2&#160;million,
        compared with $207.5 million in the third quarter of 2024. SG&#38;A expenses
        included $4.2&#160;million in acquisition, integration, and strategic planning
        expenses, which were not included in the Company's previously-announced guidance
        estimates.</font></div><div><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">Net
        income was $38.1 million ($0.87 per diluted share), compared with $47.5 million
        ($1.06 per diluted share) in the third quarter of 2024.</font></div><div style=\"height:36pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:right\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">2</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:45pt;width:100%\"><div
        style=\"text-indent:36pt\"><font><br></font></div></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">Adjusted
        EBITDA (a non-GAAP measure) was $112.6&#160;million, or 11.1 percent of revenues
        (&#34;Adjusted EBITDA margin,&#34; a non-GAAP measure), compared with $116.9&#160;million
        or 11.3 percent of revenues in the third quarter of 2024.</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:115%\">Capital
        Resources and Allocation</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">At
        September&#160;30, 2025, the Company had&#58;</font></div><div style=\"padding-left:18pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%;padding-left:5.5pt\">Cash
        and cash equivalents of $126.5 million</font></div><div style=\"padding-left:18pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%;padding-left:5.5pt\">Availability
        of approximately $460.0&#160;million under the Company's $500.0 million Senior
        Secured Revolving Credit Facility (due 2028)</font></div><div style=\"padding-left:18pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%;padding-left:5.5pt\">Senior
        Secured Debt, consisting of a Term Loan A facility with outstanding balance
        of $99.4 million (due 2028) and a Term Loan B facility with outstanding balance
        of $490.0 million (due 2030)</font></div><div style=\"padding-left:18pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%;padding-left:5.5pt\">Senior
        unsecured notes totaling $550.0 million at 4.625 percent (due 2028)</font></div><div
        style=\"text-align:justify;text-indent:9pt\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">In
        the third quarter of 2025, the Company repurchased 0.9 million shares of its
        common stock for $46 million at an average price of $51.46 per share. Approximately
        $423 million remained available at quarter end for repurchases under the Company's
        stock repurchase plan.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:115%\">Fourth
        Quarter 2025 Financial Estimates</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">The
        Company's financial estimates for the fourth quarter of 2025, which are set
        forth below, are based on current market conditions and assume no deterioration
        in the markets ASGN serves. These estimates do not include any acquisition,
        integration, or strategic planning expenses. Reconciliations of estimated
        net income to the estimated non-GAAP financial measures are included in the
        tables that accompany this release.  </font></div><div style=\"text-align:justify\"><font><br></font></div><div
