        style=\"padding-left:13.5pt;padding-right:27pt;text-align:justify;text-indent:-13.5pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:5.2pt;font-weight:400;line-height:120%;position:relative;top:-2.8pt;vertical-align:baseline\">(1)</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:7.15pt\">Does
        not include acquisition, integration, and strategic planning expenses, or
        excess tax benefits or shortfall related to stock-based compensation.</font></div><div
        style=\"padding-left:13.5pt;padding-right:27pt;text-align:justify;text-indent:-13.5pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:5.2pt;font-weight:400;line-height:120%;position:relative;top:-2.8pt;vertical-align:baseline\">(2)</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:7.15pt\">Comprised
        of (i) $9.4 million of depreciation included in SG&#38;A expenses, (ii) $3.2
        million of amortization related to capitalized cloud-based application implementation
        costs included in SG&#38;A expenses, and (iii) $0.3 million of depreciation
        included in costs of services.</font></div><div style=\"padding-left:13.5pt;padding-right:27pt;text-align:justify;text-indent:-13.5pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:5.2pt;font-weight:400;line-height:120%;position:relative;top:-2.8pt;vertical-align:baseline\">(3)</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:8pt;font-weight:400;line-height:120%;padding-left:7.15pt\">Does
        not include the cash tax savings benefit of the tax deduction that ASGN receives
        from the amortization of goodwill and trademarks, approximately $9.6&#160;million
        per quarter ($0.22 per diluted share).</font></div><div style=\"margin-bottom:3pt;padding-left:18pt;padding-right:27pt;text-align:justify;text-indent:-18pt\"><font><br></font></div><div
        style=\"height:49.5pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div
        style=\"text-align:right\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">8</font></div></div></div><div
        id=\"iae393faaf0ee43b6acb7d88124044d86_25\"></div><hr style=\"page-break-after:always\"><div
        style=\"min-height:49.5pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Non-GAAP
        Financial Measures</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">Statements
        in this release include financial information presented in accordance with
        accounting principles generally accepted in the United States (&#34;GAAP&#34;)
        and also include non-GAAP financial measures that are provided as additional
        information to enhance the overall understanding of the Company's current
        financial performance and not as an alternative to the consolidated interim
        financial statements presented in accordance with GAAP. Management uses these
        non-GAAP measures (earnings before interest, taxes, depreciation, and amortization
        (&#34;EBITDA&#34;), Adjusted EBITDA, Adjusted EBITDA margin, Adjusted Net
        Income, Adjusted Net Income per diluted share, Free Cash Flow, and Revenues
        on a same Billable Days basis) to evaluate the Company's financial performance.
        These terms might not be calculated in the same manner as, and thus might
        not be comparable to, similarly titled measures reported by other companies.
        The financial information tables that accompany this press release include
        reconciliations of net income to non-GAAP financial measures. </font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">EBITDA,
        Adjusted EBITDA, and Adjusted EBITDA margin provide a measure of the Company's
        operating results in a manner that is focused on the performance of the Company's
        core business on an ongoing basis, by removing the effects of non-operating
        and certain non-cash expenses. These non-operating and non-cash items are
        specifically identified in the reconciliations of GAAP measures to Non-GAAP
        measures that accompany this release.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">Adjusted
        Net Income provides a method for assessing the Company's operating results
        in a manner that is focused on the performance of the Company's core business
        on an ongoing basis by removing the effects of non-operating and certain non-cash
        expenses on a net of tax basis. The metric is not adjusted by the benefit
        of the tax deduction associated with the amortization of acquired definite-lived
        intangible assets as these cash tax savings appropriately reflect the performance
        of the Company's acquisitions. </font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">Free
        Cash Flow provides useful information to investors about the amount of cash
        generated by the business that can be used for strategic opportunities and
        is computed as presented in the tables that accompany this release. </font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">Commercial
        consulting bookings are defined as the value of new contracts entered into
        during a specified period, including adjustments for the effects of changes
        in contract scope and contract terminations. The book-to-bill ratio for the
        Commercial consulting business is the ratio of bookings to revenues for a
        specified period.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:107%\">Federal
        Government Segment new contract awards are defined as the estimated amount
        of future revenues to be recognized under contracts awarded during a specified
        period, including adjustments to estimates for contracts awarded in previous
        periods. The book-to-bill ratio for the Federal Government Segment is the
        ratio of New Contract Awards to revenues for a specified period. There is
        no assurance our new contract awards will result in future revenues.</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%\">Revenues
        calculated on a Same Billable Days basis provide more comparable information
        by removing the effect of differences in the number of billable days on a
        year-over-year basis. Revenues on a Same Billable Days basis are adjusted
        for the following items&#58; differences in billable days during the period
        by taking the current-period average revenue per billable day, multiplied
        by the number of billable days from the same period in the prior year&#59;
        Billable Days are business days (calendar days for the period less weekends
        and holidays) adjusted for other factors, such as the day of the week a holiday
        occurs, additional time taken off around holidays, year-end client furloughs,
        and inclement weather.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:115%\">Contact&#58;</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Kimberly
        Esterkin</font></div><div style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">Vice
