        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:11pt;font-weight:700;line-height:112%\">Revenues,
        Net Income, and Adjusted EBITDA were at the high end of Guidance estimates</font></div><div><font><br></font></div><div><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">October&#160;22,
        2025</font></div><div><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">RICHMOND,
        VA.&#8212; (BUSINESS WIRE) -- ASGN Incorporated (NYSE&#58; ASGN), a leading
        provider of IT services and solutions to the commercial and government sectors,
        reported financial results for the quarter ended</font><font style=\"color:#ee2724;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">
        </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">September&#160;30,
        2025.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Highlights</font></div><div
        style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:5.5pt\">Revenues
        were $1.01&#160;billion</font></div><div style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:5.5pt\">Net
        income was $38.1 million</font></div><div style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:5.5pt\">Adjusted
        EBITDA (a non-GAAP measure) was $112.6&#160;million (11.1 percent of revenues)</font></div><div
        style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:5.5pt\">Operating
        cash flows were $83.9&#160;million and Free Cash Flow (a non-GAAP measure)
        was $72.0&#160;million</font></div><div style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:5.5pt\">Repurchased
        approximately 0.9 million shares of the Company's common stock for $46.0 million</font></div><div
        style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:5.5pt\">New
        $100.0 million Term Loan A proceeds were used to pay down the revolving credit
        facility&#59; the Term Loan A is due in 2028</font></div><div style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">IT
        Consulting Revenues </font><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">-
        Approximately 63 percent of total revenues</font></div><div style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:115%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:115%;padding-left:5.5pt\">Commercial
        Segment - New bookings for the trailing-twelve-month period (&#34;TTM&#34;)
        were $1.4 billion&#59; book-to-bill ratio was 1.2 to 1</font></div><div style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:120%;padding-left:5.5pt\">Federal
        Government Segment - New contract awards for the TTM were $1.2 billion&#59;
        book-to-bill ratio was 1.0 to 1</font></div><div style=\"padding-left:9pt;text-align:justify;text-indent:-9pt\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:700;line-height:120%\">Management
        Commentary</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">&#8220;ASGN
        delivered a solid performance in the third quarter, with revenues, Adjusted
        EBITDA, and Adjusted EBITDA margin all at the high end of our guidance ranges,&#8221;
        said ASGN&#8217;s Chief Executive Officer, Ted Hanson. &#8220;Our IT consulting
        business continued to grow, accounting for approximately 63 percent of our
        total revenues, up from 58 percent in the year-ago period.&#8221;</font></div><div><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Arial',sans-serif;font-size:10pt;font-weight:400;line-height:112%\">Mr.
        Hanson continued, &#8220;Although IT spending levels remained steady quarter-to-quarter,
        our commercial and government clients continue to acknowledge the importance
        of executing their key initiatives despite macroeconomic conditions. Strong
        quarterly bookings reflect substantial demand across our client base, and
        ongoing investment in artificial intelligence highlights a significant commitment
        to digital advancement. ASGN remains dedicated to providing industry-specific
        solutions that enable our clients to advance, particularly as AI adoption
        continues.&#8221;</font></div><div style=\"text-align:justify\"><font><br></font></div><div
