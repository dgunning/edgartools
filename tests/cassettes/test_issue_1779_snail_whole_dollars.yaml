        New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B>EBITDA</B>\nfor the six months ended June 30, 2025, was $(5.8) million
        compared to $1.2 million in the same period last year. The decrease was primarily\ndue
        to an increase in net loss of $19.0 million, a decrease in interest expense
        of $0.3 million, partially offset by an increase in the\nprovision for income
        taxes of $12.3 million.</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B>Use\nof
        Non-GAAP Financial Measures</B></FONT></P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\"><B>&nbsp;</B></FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">In\naddition to the financial results determined in accordance with
        U.S. generally accepted accounting principles, or GAAP, Snail believes\nBookings
        and EBITDA, as non-GAAP measures, are useful in evaluating its operating performance.
        Bookings and EBITDA are non-GAAP financial\nmeasures that are presented as
        supplemental disclosures and should not be construed as alternatives to net
        income (loss) or revenue as\nindicators of operating performance, nor as alternatives
        to cash flow provided by operating activities as measures of liquidity, both\nas
        determined in accordance with GAAP. Snail supplementally presents Bookings
        and EBITDA because they are key operating measures used\nby management to
        assess financial performance. Bookings adjusts for the impact of deferrals
        and, Snail believes, provides a useful indicator\nof sales in a given period.
        EBITDA adjusts for items that Snail believes do not reflect the ongoing operating
        performance of its business,\nsuch as certain non-cash items, unusual or infrequent
        items or items that change from period to period without any material relevance\nto
        its operating performance. Management believes Bookings and EBITDA are useful
        to investors and analysts in highlighting trends in\nSnail&rsquo;s operating
        performance, while other measures can differ significantly depending on long-term
        strategic decisions regarding\ncapital structure, the tax jurisdictions in
        which Snail operates and capital investments.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
