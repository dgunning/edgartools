        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\"><B>&nbsp;</B></FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">Company\nco-Chief Executive
        Officer Hai Shi commented: &ldquo;The second quarter marked a pivotal and
        transformative period for Snail, highlighted\nby our official announcement
        to develop and launch our own proprietary stablecoin. This strategic initiative
        represents a significant\nevolution in our business model, aligning with both
        our long-term vision and broader momentum in digital financial innovation.
        Our decision\nto enter the stablecoin space was both timely and intentional,
        catalyzed by the recent passage of the GENIUS Act. This legislation has\nbegun
        to establish a formal regulatory foundation for stablecoins, offering a clearer
        framework that supports innovation while fostering\ntrust and transparency,
        creating an ideal environment to develop a fully compliant digital asset.
        Beyond its role in the broader financial\necosystem, we envision our stablecoin
        unlocking a wide range of external use cases - delivering secure, compliant,
        and scalable solutions\nthat address key gaps in today&rsquo;s digital asset
        payment landscape. Importantly, we see strong potential to integrate stablecoin\nfunctionality
        within our core gaming business, offering long-term opportunities to enhance
        game economies and facilitate seamless transactions.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align:
        justify\"><FONT STYLE=\"font-family: Times New Roman, Times, Serif; font-size:
        10pt\">&ldquo;To\nthat end, we&rsquo;ve taken deliberate steps to set this
        initiative up for success, beginning with the retainment of strategic consultant\npartners
        and legal advisors. We are actively building the technological infrastructure
        and compliance architecture required to support\na robust, scalable, and secure
        stablecoin ecosystem. We also recently entered into an at-the-market offering
        agreement, marking the beginning\nof our capital formation strategy to build
        the reserve backing needed for our stablecoin initiative. We remain committed
        to providing\nconsistent market updates to foster transparent communications
        with our shareholders as we work toward the successful long-term launch\nof
        our stablecoin.&rdquo;</FONT></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT STYLE=\"font-family:
        Times New Roman, Times, Serif; font-size: 10pt\">&nbsp;</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
        STYLE=\"font-family: Times New Roman, Times, Serif; font-size: 10pt\">Company\nco-Chief
        Executive Officer Tony Tian commented: &ldquo;Beyond our stablecoin initiative,
        our core gaming business continues to demonstrate\nstrong momentum, with notable
        performance in the month of June driven by our annual Steam Publisher Sale
        event. This event drove significant\nengagement across our game portfolio,
        especially within the ARK franchise, which remains a key pillar of our content
        ecosystem. June\nalso marked the 10-year anniversary of the ARK franchise,
        an achievement that could not be accomplished without the support of the ARK\ncommunity.
        Tied to the anniversary, there were many new content drops and updates to
        celebrate this milestone, further driving engagement.\nWe remain committed
        to delivering consistent value through regular content updates and expansions
        for ARK, while also strategically pursuing\nopportunities to develop, acquire,
        and launch titles within our indie portfolio. Looking ahead to the remainder
        of the year, our teams\nare focused on preparing for the launch of <I>ARK:
        Lost Colony</I>, while simultaneously advancing a slate of indie titles currently\nin
        the pipeline. These efforts underscore our dedication to growing across all
        facets of our business and continuing to serve our global\nplayer base with
        compelling and original content.&rdquo;</FONT></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0pt 0pt 0; text-align: justify\"><FONT
