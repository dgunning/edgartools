        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\"></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        center\"><A NAME=\"b_002\"></A><B>PLAN OF DISTRIBUTION</B></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The
        selling stockholder of the securities and\nany of their pledgees, assignees
        and successors-in-interest may, from time to time, sell any or all of their
        securities covered hereby\non The Nasdaq Capital Market or any other stock
        exchange, market or trading facility on which the securities are traded or
        in private\ntransactions. These sales may be at fixed or negotiated prices.
        The selling stockholder may use any one or more of the following methods\nwhen
        selling securities:</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"font:
        10pt Times New Roman, Times, Serif; width: 100%\">\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD STYLE=\"width: 48px; text-align: justify\">&nbsp;</TD>\n    <TD
        STYLE=\"width: 24px\">&bull;</TD>\n    <TD STYLE=\"text-align: justify\">ordinary
        brokerage transactions and transactions in which the broker-dealer solicits
        purchasers;</TD></TR>\n  </TABLE>\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\"
        STYLE=\"font: 10pt Times New Roman, Times, Serif; width: 100%\">\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD STYLE=\"width: 48px; text-align: justify\">&nbsp;</TD>\n    <TD
        STYLE=\"width: 24px\">&bull;</TD>\n    <TD>block trades in which the broker-dealer
        will attempt to sell the securities as agent but may position and resell a
        portion of the block as principal to facilitate the transaction;</TD></TR>\n
        \ </TABLE>\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt
