        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\"><B>ITEM 14. Indemnification of Directors and Officers.</B></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">The Delaware General Corporation Law and certain\nprovisions of our
        certificate of incorporation and bylaws under certain circumstances provide
        for indemnification of our officers, directors\nand controlling persons against
        liabilities which they may incur in such capacities. A summary of the circumstances
        in which such indemnification\nis provided for is contained herein, but this
        description is qualified in its entirety by reference to our certificate of
        incorporation,\nbylaws and to the statutory provisions.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">In
        general, any officer, director, employee or\nagent may be indemnified against
        expenses, fines, settlements or judgments arising in connection with a legal
        proceeding to which such\nperson is a party, if that person&rsquo;s actions
        were in good faith, were believed to be in our best interest, and with respect
        to any\ncriminal action or proceeding, such person had no reasonable cause
        to believe their actions were unlawful. Unless such person is successful\nupon
        the merits in such an action, indemnification may be awarded only after a
        determination by independent decision of the board of directors,\nby legal
        counsel, or by a vote of the stockholders, that the applicable standard of
        conduct was met by the person to be indemnified.</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The
        circumstances under which indemnification\nis granted in connection with an
        action brought on our behalf is generally the same as those set forth above;
        however, with respect to\nsuch actions, indemnification is granted only with
        respect to expenses actually incurred in connection with the defense or settlement\nof
        the action. In such actions, unless the court determines otherwise, the person
        to be indemnified must have acted in good faith and\nin a manner believed
        to have been in our best interest, and have not been adjudged liable to the
        corporation.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-indent: 0.25in\">Indemnification may also be granted pursuant
        to\nthe terms of agreements which we are currently party to with each of our
        directors and executive officers, agreements which we may enter\ninto in the
        future or pursuant to a vote of stockholders or directors. Delaware law and
        our certificate of incorporation also grant the\npower to us to purchase and
        maintain insurance which protects our officers and directors against any liabilities
        incurred in connection\nwith their service in such a position, and such a
        policy may be obtained by us.</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">A stockholder&rsquo;s
        investment may be adversely\naffected to the extent we pay the costs of settlement
        and damage awards against directors and officers as required by these indemnification\nprovisions.
        There is no pending litigation or proceeding involving any of our directors,
        officers or employees regarding which indemnification\nby us is sought, nor
        are we aware of any threatened litigation that may result in claims for indemnification.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
