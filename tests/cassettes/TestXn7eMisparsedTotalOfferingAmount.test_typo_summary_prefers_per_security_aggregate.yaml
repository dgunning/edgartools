        issuable upon exercise of series C warrants (the &ldquo;series C warrants&rdquo;)
        acquired by the selling stockholder under\nthe Purchase Agreement (defined
        below) and (ii)&nbsp;up to 1,333,333 shares of our common stock issuable upon
        exercise of series D warrants\n(the &ldquo;series D warrants&rdquo; and, together
        with the series C warrants, the &ldquo;warrants&rdquo;) acquired by the selling
        stockholder\nunder the Purchase Agreement. The selling stockholder acquired
        the warrants from us pursuant to a securities purchase agreement (the &ldquo;Purchase\nAgreement&rdquo;),
        dated May&nbsp;16, 2023, by and between the Company and the purchaser named
        therein.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-indent: 0.25in\">We are registering the resale of the
        shares of\ncommon stock covered by this prospectus as required by the Purchase
        Agreement. The selling stockholder will receive all of the proceeds\nfrom
        any sales of the shares of common stock offered hereby. We will not receive
        any of the proceeds, but we will incur expenses in connection\nwith the offering.
        To the extent the warrants are exercised for cash, if at all, we will receive
        the exercise price of the warrants.</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The selling
        stockholder may sell these shares\nthrough public or private transactions
        at market prices prevailing at the time of sale or at negotiated prices. The
        timing and amount\nof any sale are within the sole discretion of the selling
        stockholder. Our registration of the shares of common Stock covered by this\nprospectus
        does not mean that the selling stockholder will offer or sell any of the shares.
        For further information regarding the possible\nmethods by which the shares
        may be distributed, see &ldquo;Plan of Distribution&rdquo; beginning on page&nbsp;15
        of this prospectus.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0; text-indent: 0.25in\">Our common stock is listed on
        The Nasdaq Capital\nMarket under the symbol &ldquo;ACXP.&rdquo; The last reported
        sale price of our common stock on June&nbsp;28, 2023 was $2.56 per share.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">We are an &ldquo;emerging growth company&rdquo;\nunder applicable
