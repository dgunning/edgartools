        Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\">June&nbsp;29, 2023</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">Acurx Pharmaceuticals,&nbsp;Inc.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">259 Liberty
        Avenue</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\">Staten Island, New York 10305</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\">Ladies and Gentlemen:</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align: left; text-indent:
        0.5in\">We have acted as legal counsel\nto Acurx Pharmaceuticals,&nbsp;Inc.,
        a Delaware corporation (the &ldquo;Company&rdquo;), in connection with the
        preparation and filing\nwith the Securities and Exchange Commission (the &ldquo;Commission&rdquo;)
        of a Registration Statement on&nbsp;Form&nbsp;S-1 (the &ldquo;Registration\nStatement&rdquo;)
        under the Securities Act of 1933, as amended (the &ldquo;Securities Act&rdquo;).
        The Registration Statement relates\nto the registration for resale by the
        selling stockholders named in the Registration Statement of up to an aggregate
        of 2,666,666 shares\nof the Company&rsquo;s common stock, par value $0.001
        per share (the &ldquo;Common Stock&rdquo;), which includes (i)&nbsp;up to
        1,333,333\nshares of outstanding Common Stock issuable upon exercise of series
        C warrants to purchase shares of Common Stock and (ii)&nbsp;up to\n1,333,333
        shares of outstanding Common Stock issuable upon exercise of series D warrants
        to purchase shares of Common Stock. The shares\nof Common Stock issued and
        issuable upon exercise of the series C warrants and the series D warrants
        are referred to herein as the &ldquo;Shares.&rdquo;\nAll capitalized terms
        used herein and not otherwise defined shall have the respective meanings given
        to them in the Registration Statement.</P>\n\n<P STYLE=\"text-align: left;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        left; text-indent: 0.5in\">In connection with this opinion,\nwe have examined
        the Company&rsquo;s Certificate of Incorporation and Bylaws, each as currently
        in effect; such other records of the corporate\nproceedings of the Company
        and certificates of the Company&rsquo;s officers as we have deemed relevant;
        and the Registration Statement\nand the exhibits thereto.</P>\n\n<P STYLE=\"text-align:
        left; font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        left; text-indent: 0.5in\">In our examination, we have\nassumed the genuineness
        of all signatures, the legal capacity of natural persons, the authenticity
        of all documents submitted to us as\noriginals, the conformity to original
        documents of all documents submitted to us as certified or photostatic copies
        and the authenticity\nof the originals of such copies.</P>\n\n<P STYLE=\"text-align:
        left; font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        left; text-indent: 0.5in\">Our opinion is limited to\nthe United States federal
        laws and the state laws of Delaware, and we express no opinion with respect
        to the laws of any other jurisdiction.\nNo opinion is expressed herein with
        respect to the qualification of the Shares under the securities or blue sky
        laws of any state or any\nforeign jurisdiction.</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0; text-align: justify; text-indent:
        0.5in\">&nbsp;</P>\n\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\"></P>\n\n<!-- Field: Page; Sequence: 1 -->\n    <DIV STYLE=\"margin-top:
        12pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align: center; border-top:
        Black 0.5pt solid\"><FONT STYLE=\"text-transform: uppercase\">Boston&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Los
        Angeles&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;New York&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;San
        Diego&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;San Francisco&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;toronto&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        Washington</FONT></P><P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-align: center\">MINTZ, LEVIN, COHN, FERRIS, GLOVSKY AND
        POPEO, P.C.</P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top: 6pt;
        margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
