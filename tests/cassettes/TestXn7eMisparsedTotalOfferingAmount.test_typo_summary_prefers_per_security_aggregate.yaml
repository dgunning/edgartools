        STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">Insofar
        as indemnification for liabilities arising\nunder the Securities Act may be
        permitted to directors, officers or persons controlling us pursuant to the
        foregoing provisions, we have\nbeen informed that, in the opinion of the SEC,
        this indemnification is against public policy as expressed in the Securities
        Act and is\ntherefore unenforceable.</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\"><B>ITEM 15. Recent Sales of Unregistered
        Securities.</B></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0; text-indent: 0.25in\">In the three years preceding the
        filing of this\nregistration statement, we have issued the following securities
        that were not registered under the Securities Act:</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\"><B>Private Placement Issuances</B></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">On May&nbsp;18, 2023, we issued to an investor\nin a private placement
        series C warrants to purchase 1,333,333 shares of common stock and series
        D warrants to purchase 1,333,333 shares\nof common stock, each with an exercise
        price of $3.26 per share.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-indent: 0.25in\">On July&nbsp;27, 2022,
        we issued to investors\nin a private placement series A warrants to purchase
        1,289,980 shares of common stock and series B warrants to purchase 1,289,980
        shares\nof common stock. An aggregate of 59,211 series A warrants and an aggregate
        of 59,211 series B warrants were issued to certain affiliates\nwith <FONT
        STYLE=\"background-color: white\">an exercise price of $3.</FONT>80 per share
        and an aggregate of 1,230,769 series A warrants\nand an aggregate of 1,230,769
        series B warrants were issued to an investor with <FONT STYLE=\"background-color:
        white\">an exercise price\nof</FONT> $3.25 per share.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">On
        July&nbsp;27, 2022, we issued to the Placement\nAgents placement agent warrants
        to purchase 63,018 shares of common stock with an exercise price of $3.60.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">On October&nbsp;16, 2020, we issued and sold to\ninvestors in a private
        placement an aggregate of 705,727 Class&nbsp;A membership interests at a purchase
        price of $3.25 per Class&nbsp;A\nmembership interest, for aggregate consideration
        of $2,293,613.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0; text-indent: 0.25in\">On July&nbsp;20, 2020, we issued
        and sold to investors\nin a private placement an aggregate of 533,900 Class&nbsp;A
        membership interests at a purchase price of $3.25 per Class&nbsp;A membership\ninterest,
        for aggregate consideration of $1,735,175.</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">None of
        the foregoing transactions involved any\nunderwriters, underwriting discounts
        or commissions, or any public offering. We believe the offers, sales and issuances
        of the above securities\nwere exempt from registration under the Securities
        Act (or Regulation D or Regulation S promulgated thereunder) by virtue of
        Section&nbsp;4(a)(2)&nbsp;of\nthe Securities Act because the issuance of securities
        to the recipients did not involve a public offering. The recipients of the
        securities\nin each of these transactions represented their intentions to
        acquire the securities for investment only and not with a view to or for\nsale
        in connection with any distribution thereof, and appropriate legends were
        placed upon the stock certificates issued in these transactions.\nAll recipients
        had adequate access, through their relationships with us, to information about
        us. The sales of these securities were made\nwithout any general solicitation
        or advertising.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\"><B>Service-Related Issuances</B></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The
        Company granted shares of common stock to\ncertain vendors in the ordinary
        course of business in exchange for consulting services. The Company granted
        114,889 and 13,889 shares\nof common stock for the years ended December&nbsp;31,
        2022, and 2021, respectively, and 44,186 shares of common stock and warrants
        to\npurchase 2,729 shares of common stock in the quarter ended March&nbsp;31,
        2023.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-indent: 0.25in\">Prior to the Company&rsquo;s initial
        public offering,\nthe Company granted Class&nbsp;A Membership Interests to
        certain vendors in the ordinary course of business in exchange for consulting\nservices
        relating to research and development activities and investor relations. The
        Company granted 30,145 and 147,413 Class&nbsp;A Membership\nInterests for
        the years ended December&nbsp;31, 2021 and 2020, respectively. During 2020,
        the Company also issued 10,077 warrants to purchase\nClass&nbsp;A Membership
        Interests to an investment banker for services relating to the October&nbsp;2020
        private placement.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\"></P>\n\n<!-- Field: Page; Sequence: 26; Value: 1 -->\n
        \   <DIV STYLE=\"margin-top: 12pt; margin-bottom: 6pt; border-bottom: Black
        1pt solid\"><P STYLE=\"font-size: 10pt; text-align: center; margin-top: 0pt;
        margin-bottom: 0pt\">II-<!-- Field: Sequence; Type: Arabic; Name: PageNo -->2<!--
        Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top:
        6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n    <!--
        Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-indent: 0.25in\">In January&nbsp;2021, the Company issued
        57,430\nClass&nbsp;A Membership Interests to two of its executives to settle
        unpaid year-end bonus award and deferred compensation, which was\napproved
        by the board of directors.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-indent: 0.25in\">On January&nbsp;12, 2021,
        we issued 700,000 Class&nbsp;B\nmembership interests to each of Messrs.&nbsp;Luci
        and DeLuccia in accordance with their respective employment agreements as
        amended and\nthen in effect for services rendered in accordance with their
        respective employment agreements, as amended. The issuance of our securities\nin
        settlement of these accounts was made pursuant to Section&nbsp;4(a)(2)&nbsp;and
        Rule&nbsp;506(b)&nbsp;of the Securities Act. Such Class&nbsp;B\nmembership
        interests were subsequently cancelled in March&nbsp;2021.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The
        above mentioned issuances of unregistered\nsecurities do not reflect the conversion
        ratio of one-half of one share of common stock of Acurx Pharmaceuticals,&nbsp;Inc.
        for each Class&nbsp;A\nmembership interest or Class&nbsp;B membership interest
        of Acurx Pharmaceuticals, LLC which shall occur as part of our corporate conversion\nto
        take place prior to the effectiveness of this registration statement.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">No underwriters were used in the foregoing transactions,\nand no
        discounts or commissions were paid. All sales of securities described above
        were exempt from the registration requirements of the\nSecurities Act in reliance
        on Section&nbsp;4(a)(2)&nbsp;of the Securities Act, Rule&nbsp;701 promulgated
        under the Securities Act or Regulation\nD promulgated under the Securities
        Act, relating to transactions by an issuer not involving a public offering.
        All of the foregoing securities\nare deemed restricted securities for purposes
        of the Securities Act.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\"></P>\n\n<!-- Field: Page; Sequence: 27; Value:
        1 -->\n    <DIV STYLE=\"margin-top: 12pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"font-size: 10pt; text-align: center; margin-top:
        0pt; margin-bottom: 0pt\">II-<!-- Field: Sequence; Type: Arabic; Name: PageNo
        -->3<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page;
        margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
