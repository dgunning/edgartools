        STYLE=\"break-before: page; margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin:
        0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align: center\"><B>ABOUT
        THIS PROSPECTUS</B></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0; text-indent: 0.25in\">The registration statement we
        filed with the Securities\nand Exchange Commission (the &ldquo;SEC&rdquo;)
        includes exhibits that provide more detail of the matters discussed in this
        prospectus.\nYou should read this prospectus, the related exhibits filed with
        the SEC, and the documents incorporated by reference herein before making\nyour
        investment decision. You should rely only on the information provided in this
        prospectus and the documents incorporated by reference\nherein or any amendment
        thereto. In addition, this prospectus contains summaries of certain provisions
        contained in some of the documents\ndescribed herein, but reference is made
        to the actual documents for complete information. All of the summaries are
        qualified in their\nentirety by the actual documents. Copies of some of the
        documents referred to herein have been filed, will be filed or will be incorporated\nby
        reference as exhibits to the registration statement of which this prospectus
        is a part, and you may obtain copies of those documents\nas described below
        under the heading &ldquo;Where You Can Find More Information.&rdquo;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\"><FONT STYLE=\"background-color: white\">The selling\nstockholder
        named in this prospectus may sell up to</FONT> 2,666,666 <FONT STYLE=\"background-color:
        white\">shares of our common stock\npreviously issued and issuable upon exercise
        of warrants to purchase shares of our common stock from time to time. </FONT>This
        prospectus\nalso covers any shares of common stock that may become issuable
        as a result of share splits, share dividends, or similar transactions.\nWe
        have agreed to pay the expenses incurred in registering these shares, including
        legal and accounting fees.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-indent: 0.25in\">We have not, and the selling
        stockholder has not,\nauthorized anyone to provide any information or to make
        any representations other than those contained in this prospectus, the documents\nincorporated
        by reference herein or in any free writing prospectuses prepared by or on
        behalf of us or to which we have referred you.\nWe take no responsibility
        for, and can provide no assurance as to the reliability of, any other information
        that others may give you.\nThe information contained in this prospectus, the
        documents incorporated by reference herein or in any applicable free writing
        prospectus\nis current only as of its date, regardless of its time of delivery
        or any sale of our securities. Our business, financial condition, results\nof
        operations and prospects may have changed since that date.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The
        selling stockholder is offering to sell, and\nseeking offers to buy, shares
        of our common stock only under circumstances and in jurisdictions where it
        is lawful to do so. The selling\nstockholder is not making an offer to sell
        these securities in any state or jurisdiction where the offer or sale is not
        permitted.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-indent: 0.25in\">Unless the context otherwise requires,
        &ldquo;Acurx,&rdquo;\n &ldquo;ACXP,&rdquo; &ldquo;the Company,&rdquo; &ldquo;we,&rdquo;
        &ldquo;us,&rdquo; &ldquo;our&rdquo; and similar terms refer to Acurx\nPharmaceuticals,&nbsp;Inc.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        center\"><B>Industry and Market Data</B></P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">This prospectus
        <FONT STYLE=\"background-color: white\">or\nthe documents incorporated by
        reference herein </FONT>includes statistical and other industry and market
        data that we obtained from industry\npublications and research, surveys and
        studies conducted by third parties. Industry publications and third-party
        research, surveys and\nstudies generally indicate that their information has
        been obtained from sources believed to be reliable, although they do not guarantee\nthe
        accuracy or completeness of such information.</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\"></P>\n\n<!-- Field: Page;
        Sequence: 4; Options: NewSection; Value: 1 -->\n    <DIV STYLE=\"margin-top:
        12pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\"><!-- Field: Sequence; Type:
        Arabic; Name: PageNo -->1<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\"></P>\n\n<DIV STYLE=\"padding: 5pt; border: Black 1pt
        solid; clear: both; width: 98%\">\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-align: center\"><A NAME=\"a_001\"></A><B>PROSPECTUS
        SUMMARY</B></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-indent: 0.25in\"><I>The following is a\nsummary of what
        we believe to be the most important aspects of our business and the offering
        of our securities under this prospectus.\nWe urge you to read this entire
        prospectus, including the more detailed audited and unaudited financial statements,
        notes to the financial\nstatements and other information incorporated by reference
        from our other filings with the SEC or included in any applicable prospectus\nsupplement.
        Investing in our securities involves risks. Therefore, carefully consider
        the risk factors set forth in any prospectus supplements\nand in our most
        recent annual and quarterly filings with the SEC, as well as other information
        in this prospectus and any prospectus supplements\nand the documents incorporated
        by reference herein or therein, before purchasing our securities. Each of
        the risk factors could adversely\naffect our business, operating results and
        financial condition, as well as adversely affect the value of an investment
        in our securities.</I></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\"><B>Overview</B></P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">We
        are a clinical stage\nbiopharmaceutical company developing a new class of
        antibiotics for infections caused by bacteria listed as priority pathogens
        by the\nWorld Health Organization (&ldquo;WHO&rdquo;), the U.S. Centers for
        Disease Control and Prevention (&ldquo;CDC&rdquo;) and the U.S. Food\nand
        Drug Administration (&ldquo;FDA&rdquo;). Priority pathogens are those which
        require new antibiotics to address the worldwide crisis\nof antimicrobial
        resistance (&ldquo;AMR&rdquo;) as identified by the WHO, CDC and FDA. The
        CDC estimates that, in the U.S., antibiotic-resistant\npathogens infect one
        individual every 11 seconds and result in one death every 15 minutes. The
        WHO recently stated that growing antimicrobial\nresistance is equally as dangerous
        as the ongoing COVID-19 pandemic, threatens to unwind a century of medical
        progress and may leave us\ndefenseless against infections that today can be
        treated easily. According to the WHO, the current clinical development pipeline
        remains\ninsufficient to tackle the challenge of the increasing emergence
        and spread of antimicrobial resistance.</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">Our approach
        is to develop\na new class of antibiotic candidates that block the DNA polymerase
        IIIC (&ldquo;Pol IIIC&rdquo;). We believe we are developing the first\nPol
        IIIC inhibitor to enter clinical trials and have clinically validated the
        bacterial target by demonstrating the efficacy of our lead\nantibiotic candidate
        in a Phase 2a clinical trial. Pol IIIC is the primary catalyst for DNA replication
        of several Gram-positive bacterial\ncells. Our research and development pipeline
        includes clinical stage and early stage antibiotic candidates that target
        Gram-positive bacteria\nfor oral and/or parenteral treatment of infections
        caused by Clostridium difficile (&ldquo;C. difficile&rdquo;), Enterococcus
        (including\nvancomycin-resistant strains (&ldquo;VRE&rdquo;)), Staphylococcus
        (including methicillin-resistant strains (&ldquo;MRSA&rdquo;)), and\nStreptococcus
        (including antibiotic resistant strains).</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">Pol IIIC
        is required\nfor the replication of DNA in certain Gram-positive bacterial
        species. By blocking this enzyme, our antibiotic candidates are believed\nto
        be bactericidal and inhibit proliferation of several common Gram-positive
        bacterial pathogens, including both sensitive and resistant\nC. difficile,
        MRSA, vancomycin-resistant Enterococcus, penicillin-resistant Streptococcus
        pneumonia (&ldquo;PRSP&rdquo;) and other resistant\nbacteria.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">We
        intend to &ldquo;de-risk&rdquo;\nthis new class of antibiotics through our
        drug development activities and potentially partner with a fully-integrated
        pharmaceutical company\nfor late-stage clinical trials and commercialization.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">Our lead antibiotic candidate,\nibezapolstat (formerly named ACX-362E),
        has a novel mechanism of action that targets the Pol IIIC enzyme, a previously
        unexploited scientific\ntarget. Phase 2a clinical efficacy of our lead antibiotic
        candidate validate the Pol IIIC bacterial target. On December&nbsp;3, 2021,\nwe
        commenced enrollment in a Phase 2b 64-patient, randomized (1-to-1), non-inferiority,
        double-blind trial of oral ibezapolstat compared\nto oral vancomycin, a standard
        of care to treat C. difficile infections (&ldquo;CDI&rdquo;).</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">Prior
        to that, we completed\nour Phase 2a clinical trial of ibezapolstat to treat
        patients with CDI and reported the top-line data in November&nbsp;2020. The
        Phase\n2a clinical trial was terminated early based upon the recommendation
        of our Scientific Advisory Board (the &ldquo;SAB&rdquo;). The SAB\nreviewed
        the study data presented by management, including adverse events and efficacy
        outcomes, and discussed its clinical impressions.\nThe SAB unanimously supported
        the early termination of the Phase 2a trial after 10 patients were enrolled
        in the trial instead of 20 patients\nas originally planned. The early termination
        was further based on the evidence of meeting the treatment goals of eliminating
        the infection\nwith an acceptable adverse event profile.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n</DIV>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\"></P>\n\n<!--
        Field: Page; Sequence: 5; Value: 1 -->\n    <DIV STYLE=\"margin-top: 12pt;
        margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\"><!-- Field: Sequence; Type:
        Arabic; Name: PageNo -->2<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<DIV STYLE=\"padding: 5pt; border: Black 1pt
        solid; clear: both; width: 98%\">\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The SAB noted that
        10\nout of 10 patients enrolled in the Phase 2a trial reached the Clinical
        Cure primary endpoint, defined in the study protocol as the resolution\nof
        diarrhea in the 24-hour period immediately before the end-of-treatment that
        is maintained for 48 hours after end of treatment. Such\ncure was sustained,
        meaning that the patients showed no sign of infection recurrence, for 30 days
        thereafter. This was the secondary endpoint.\nThis outcome constitutes a 100%
        response rate for the primary and secondary endpoints of the trial. All 10
        patients enrolled in the Phase\n2a trial met the study&rsquo;s primary and
        secondary efficacy endpoints, namely, Clinical Cure at end of treatment and
        Sustained Clinical\nCure of no recurrence of CDI at the 28-day follow-up visit.
        No treatment-related serious adverse events (&ldquo;SAEs&rdquo;) were reported\nby
        the investigators who enrolled patients in the trial. We believe these results
        represent the first-ever clinical data showing Pol IIIC\nhas potential as
        a therapeutically-relevant antibacterial target. Our Phase 2b clinical trial
        commenced enrollment on December&nbsp;3,\n2021 and we continue to enroll patients</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">Currently available antibiotics\nused to treat CDI infections utilize
        other mechanisms of action. We believe ibezapolstat is the first antibiotic
        candidate to work by\nblocking the DNA Pol IIIC enzyme in C. difficile. This
        enzyme is necessary for replication of the DNA of certain Gram-positive bacteria,\nlike
        C. difficile.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0; text-indent: 0.25in\">We also have an early-stage\npipeline
        of antibiotic product candidates with the same previously unexploited mechanism
        of action which has established proof of concept\nin animal studies. This
        pipeline includes ACX-375C, a potential oral and parenteral treatment targeting
        Gram-positive bacteria, including\nMRSA, VRE and PRSP. Additionally, we continue
        to apply for non-dilutive grants to fund our research and development pipeline
        and anticipate\nreceiving a potential decision on at least one grant in the
        second half of 2023.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\"><B>Recent Developments</B></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">In
        April&nbsp;2023, we\nprovided two presentations at the 33rd Annual European
        Congress of Clinical Microbiology and Infectious Disease (&ldquo;ECCMID&rdquo;)\nin
        Copenhagen. First, a scientific poster entitled &ldquo;Novel Pharmacology
        and Susceptibility of Ibezapolstat Against C. difficile Isolates\nwith Reduced
        Susceptibility to C. difficile-directed Antibiotics&rdquo; was co-presented
        by Dr.&nbsp;Kevin Garey, Professor and Chair,\nUniversity of Houston College
        of Pharmacy, and the Principal Investigator for microbiome aspects of our
        ibezapolstat clinical trial program,\nand by Dr.&nbsp;Eug&eacute;nie Bass&egrave;res,
        Research Scientist Faculty at the University of Houston. Second, Executive
        Chairman, Robert\nJ. DeLuccia, presented an update on our preclinical, systemic
        oral and IV program for treatment of other gram-positive infections caused\nby
        MRSA, VRE and PRSP at the &ldquo;Pipeline Corner&rdquo; featured session at
        ECCMID, organized by Dr.&nbsp;Ursula Theuretzbacher, a\nworld-renowned microbiology
        expert involved in antibacterial drug research, discovery and development
        strategies and policies for clinical\nand public health needs.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">On
        March&nbsp;16, 2023,\nwe announced that based on the blinded observed data
        from the ongoing Phase 2b clinical trial to date, in January&nbsp;2023, we
        filed\na protocol amendment to our Investigational New Drug Application with
        the FDA to allow for an Independent Data Monitoring Committee (&ldquo;IDMC&rdquo;)\nto
        review interim clinical data. The FDA accepted our protocol amendment in March&nbsp;2023
        which will allow the IDMC to review the clinical\ndata upon enrollment of
        36 patients in the Phase 2b clinical trial. We currently have enrolled 26
        patients in the Phase 2b clinical trial.\nThe IDMC will determine and recommend
        to us whether the most appropriate course of action forward is to early terminate
        the Phase 2b clinical\ntrial (as we had done with the Phase 2a clinical trial)
        or to continue patient enrollment. We intend to report available data promptly\nafter
        the IDMC conducts this interim review. We assembled our IDMC during this first
        quarter of 2023 for this purpose.</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">On May&nbsp;16,
        2023,\nwe entered into a securities purchase agreement (the &ldquo;Purchase
        Agreement&rdquo;) with a single healthcare-focused U.S. institutional\ninvestor
        (the &ldquo;Investor&rdquo;) pursuant to which we issued and sold in a registered
        direct offering an aggregate of 601,851 shares\nof our common stock and pre-funded
        warrants to purchase an aggregate of 731,482 shares of our common stock (the
        &ldquo;Registered Direct\nOffering&rdquo;). The pre-funded warrants sold to
        the Investor have an exercise price of $0.0001, were immediately exercisable
        and may\nbe exercised at any time until fully exercised. These securities
        were offered pursuant to an effective shelf registration statement on\nForm&nbsp;S-3
        (File No.&nbsp;333-265956) previously filed with the SEC on July&nbsp;1, 2022,
        and which was declared effective by the SEC\non July&nbsp;11, 2022.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n</DIV>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\"></P>\n\n<!--
        Field: Page; Sequence: 6; Value: 1 -->\n    <DIV STYLE=\"margin-top: 12pt;
        margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\"><!-- Field: Sequence; Type:
        Arabic; Name: PageNo -->3<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\"></P>\n\n<DIV STYLE=\"padding: 5pt; border: Black 1pt
        solid; clear: both; width: 98%\">\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"text-indent: 0.25in;
        font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">In a concurrent
        private\nplacement (the &ldquo;Private Placement&rdquo; and, together with
        the Registered Direct Offering, the &ldquo;Offerings&rdquo;), we issued\nto
        the Investor <FONT STYLE=\"background-color: white\">(i)&nbsp;series C warrants
        exercisable for an aggregate of 1,333,333 shares of common\nstock at an exercise
        price of $3.26 per share and (ii)&nbsp;series D warrants exercisable for an
        aggregate of 1,333,333 shares of common\nstock at an exercise price of $3.26
        per share. These securities were offered pursuant to the exemption provided
        in Section&nbsp;4(a)(2)&nbsp;under\nthe </FONT>Securities Act of 1933, as
        amended (the &ldquo;Securities Act&rdquo;)<FONT STYLE=\"background-color:
        white\">, and Rule&nbsp;506(b)&nbsp;promulgated\nthereunder.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">In connection with the\nOfferings, we entered into a Placement Agent
        Agreement with Maxim Group LLC (the &ldquo;Placement Agent&rdquo;), pursuant
        to which the\nPlacement Agent acted as the exclusive placement agent in connection
        with the Offerings. Pursuant to the Placement Agent Agreement, we\nagreed
        to pay the Placement Agent a fee equal to 5.75% of the aggregate gross proceeds
        from the Offerings.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0; text-indent: 0.25in\">In connection with the\nOfferings,
        we also entered into a warrant amendment agreement (the &ldquo;Warrant Amendment
        Agreement&rdquo;) with the Investor. Under\nthe Warrant Amendment Agreement,
        we agreed to amend our existing Series&nbsp;A warrants to purchase up to an
        aggregate of 1,230,769 shares\nof our common stock and Series&nbsp;B warrants
        to purchase up to an aggregate of 1,230,769 shares of our common stock (collectively,
        the\n &ldquo;Existing Warrants&rdquo;) that were previously issued in July&nbsp;2022,
        such that effective upon the closing of the offering,\nthe amended Existing
        Warrants will have a termination date of May&nbsp;18, 2029.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The
        gross proceeds to\nus from the Offerings were approximately $4.0 million and
        net proceeds after deducting the placement agent&rsquo;s fees and other offering\nexpenses
        payable by us were approximately $3.5 million.</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\"><B>Implication of Being
        an Emerging Growth\nCompany</B></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">We are an &ldquo;emerging\ngrowth
        company&rdquo; as defined in the Jumpstart Our Business Startups Act of 2012,
        as amended (the &ldquo;JOBS Act&rdquo;). We will\nremain an emerging growth
        company until the earlier of (1)&nbsp;the last day of the fiscal year following
        the fifth anniversary of the\ncompletion of our initial public offering, (2)&nbsp;the
        last day of the fiscal year in which we have total annual gross revenues of
        at\nleast $1.07 billion, (3)&nbsp;the date on which we are deemed to be a
        &ldquo;large accelerated filer&rdquo; as defined in Rule&nbsp;12b-2\nunder
        the Securities Exchange Act of 1934, as amended (the &ldquo;Exchange Act&rdquo;),
        which would occur if the market value of our common\nstock held by non-affiliates
        exceeded $700.0 million as of the last business day of our most recently completed
        second fiscal quarter\nor (4)&nbsp;the date on which we have issued more than
        $1.0 billion in non-convertible debt securities during the prior three-year
        period.\nAn emerging growth company may take advantage of specified reduced
        reporting requirements and is relieved of certain other significant\nrequirements
        that are otherwise generally applicable to public companies. As an emerging
        growth company,</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0; text-indent: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT>&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;we
        may\nreduce our executive compensation disclosure;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\"><FONT
        STYLE=\"font-family: Symbol\">&middot;</FONT>&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;we
        may\npresent only two years of audited financial statements, plus unaudited
        condensed financial statements for any interim period, and related\nManagement&rsquo;s
        Discussion and Analysis of Financial Condition and Results of Operations in
        this Prospectus;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-indent: 0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT>&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;we
        may\navail ourselves of the exemption from the requirement to obtain an attestation
        and report from our auditors on the assessment of our\ninternal control over
        financial reporting pursuant to the Sarbanes-Oxley Act of 2002; and</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\"><FONT STYLE=\"font-family: Symbol\">&middot;</FONT>&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;&#8239;we\nmay
        not require stockholder non-binding advisory votes on executive compensation
        or golden parachute arrangements.</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">We have availed
        ourselves\nin this Prospectus of the reduced reporting requirements described
        above with respect to compensation disclosure requirements and selected\nfinancial
        data. As a result, the information that we provide stockholders may be less
        comprehensive than what you might receive from other\npublic companies. When
        we are no longer deemed to be an emerging growth company, we will not be entitled
        to the exemptions provided in\nthe JOBS Act discussed above. We have not elected
        to avail ourselves of the exemption that allows emerging growth companies
        to extend\nthe transition period for complying with new or revised financial
        accounting standards. This election is irrevocable.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n</DIV>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        center\"></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\"></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\"></P>\n\n<!-- Field: Page; Sequence: 7; Value: 1 -->\n    <DIV STYLE=\"margin-top:
        12pt; margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\"><!-- Field: Sequence; Type:
        Arabic; Name: PageNo -->4<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\"></P>\n\n<DIV STYLE=\"padding: 5pt; border: Black 1pt
        solid; clear: both; width: 98%\">\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">As a company with
        less\nthan $1.0 billion in revenue during our last fiscal year, we qualify
        as an &ldquo;emerging growth company.&rdquo;</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\"><B>Smaller Reporting Company</B></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">We are also currently\na &ldquo;smaller reporting company,&rdquo;
        meaning that we are not an investment company, an asset-backed issuer, or
        a majority-owned\nsubsidiary of a parent company that is not a smaller reporting
        company, and have a public float of less than $250 million or annual revenues\nof
        less than $100 million during the most recently completed fiscal year. In
        the event that we are still considered a &ldquo;smaller reporting\ncompany,&rdquo;
        at such time as we cease being an &ldquo;emerging growth company,&rdquo; the
        disclosure we will be required to provide\nin our SEC filings will increase,
        but will still be less than it would be if we were not considered either an
        &ldquo;emerging growth company&rdquo;\nor a &ldquo;smaller reporting company.&rdquo;
        Specifically, similar to &ldquo;emerging growth companies,&rdquo; &ldquo;smaller
        reporting\ncompanies&rdquo; are able to provide simplified executive compensation
        disclosures in their filings; are exempt from the provisions of\nSection&nbsp;404(b)&nbsp;of
        the Sarbanes-Oxley Act requiring that independent registered public accounting
        firms provide an attestation\nreport on the effectiveness of internal control
        over financial reporting; and have certain other decreased disclosure obligations
        in their\nSEC filings, including, among other things, only being required
        to provide two years of audited financial statements in annual reports.\nDecreased
        disclosures in our SEC filings due to our status as an &ldquo;emerging growth
        company&rdquo; or &ldquo;smaller reporting company&rdquo;\nmay make it harder
        for investors to analyze our results of operations and financial prospects.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\"><B>Risks
        Associated with Our Business</B></P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">Our business and
        our\nability to implement our business strategy are subject to numerous risks,
        as more fully described in the section entitled &ldquo;Risk\nFactors&rdquo;
        in this prospectus and in our <A HREF=\"https://www.sec.gov/ix?doc=/Archives/edgar/data/1736243/000155837023003929/acxp-20221231x10k.htm\"
        STYLE=\"-sec-extract: exhibit\">Annual Report on Form&nbsp;10-K for the fiscal
        year ended December&nbsp;31, 2022</A>, incorporated\nherein by reference.
        You should read these risks before you invest in our securities. We may be
        unable, for many reasons, including those\nthat are beyond our control, to
        implement our business strategy.</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0\"><B>Corporate Information and History</B></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">We were organized as a limited liability company\nin the State of
        Delaware in July&nbsp;2017 and we commenced operations in February&nbsp;2018
        upon acquiring the rights to our lead antibiotic\nproduct candidate from GLSynthesis,&nbsp;Inc.
        Our principal executive offices are located at 259 Liberty Avenue, Staten
        Island, NY 10305\nand our telephone number is (917) 533-1469. Our website
        address is www.acurxpharma.com. The information contained on, or that can
        be\naccessed through, our website is not a part of this prospectus. We have
        included our website address in this prospectus solely as an\ninactive textual
        reference. On June&nbsp;23, 2021, we converted from a Delaware limited liability
        company into a Delaware corporation\npursuant to a statutory conversion, and
        changed our name to Acurx Pharmaceuticals,&nbsp;Inc.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">&nbsp;</P>\n\n</DIV>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        center\"></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0; text-align: center\"></P>\n\n<!-- Field: Page; Sequence: 8; Value:
        1 -->\n    <DIV STYLE=\"margin-top: 12pt; margin-bottom: 6pt; border-bottom:
        Black 1pt solid\"><P STYLE=\"text-align: center; margin-top: 0pt; margin-bottom:
        0pt\"><!-- Field: Sequence; Type: Arabic; Name: PageNo -->5<!-- Field: /Sequence
        --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom:
        12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        center\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-align: center\"><A NAME=\"a_002\"></A><B>THE OFFERING</B></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE
        CELLSPACING=\"0\" CELLPADDING=\"0\" STYLE=\"font: 10pt Times New Roman, Times,
        Serif; width: 100%\">\n  <TR STYLE=\"vertical-align: top\">\n    <TD STYLE=\"width:
        35%\"><B>Shares of Common Stock that May&nbsp;be Offered by the Selling Stockholder
        </B></TD>\n    <TD STYLE=\"width: 1%\">&nbsp;</TD>\n    <TD STYLE=\"width:
        64%\">Up to 2,666,666 shares of common stock.</TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD>&nbsp;</TD>\n    <TD>&nbsp;</TD>\n    <TD>&nbsp;</TD></TR>\n
        \ <TR STYLE=\"vertical-align: top\">\n    <TD><B>Use of Proceeds</B></TD>\n
        \   <TD>&nbsp;</TD>\n    <TD>We will not receive any proceeds from the sale
        of the common stock by the selling stockholder. However, if all of the warrants
        were exercised for cash, we would receive gross proceeds of approximately
        $8.7 million. See the section entitled &ldquo;Use of Proceeds&rdquo; in this
        prospectus.</TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n    <TD>&nbsp;</TD>\n
        \   <TD>&nbsp;</TD>\n    <TD>&nbsp;</TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD><B>Offering Price</B></TD>\n    <TD>&nbsp;</TD>\n    <TD>The
        selling stockholder may sell all or a portion of their shares through public
        or private transactions at prevailing market prices or at privately negotiated
        prices.</TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n    <TD>&nbsp;</TD>\n
        \   <TD>&nbsp;</TD>\n    <TD>&nbsp;</TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD><B>Nasdaq Capital Market Symbol</B></TD>\n    <TD>&nbsp;</TD>\n
        \   <TD>ACXP</TD></TR>\n  <TR STYLE=\"vertical-align: top\">\n    <TD>&nbsp;</TD>\n
        \   <TD>&nbsp;</TD>\n    <TD>&nbsp;</TD></TR>\n  <TR STYLE=\"vertical-align:
        top\">\n    <TD><B>Risk Factors</B></TD>\n    <TD>&nbsp;</TD>\n    <TD>Investing
        in our common stock involves a high degree of risk. See &ldquo;Risk Factors&rdquo;
        beginning on page&nbsp;7 of this prospectus, and any other risk factors described
        in the documents incorporated by reference herein, for a discussion of certain
        factors to consider carefully before deciding to invest in our common stock.</TD></TR>\n
        \ </TABLE>\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt
        0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0; text-indent: 0.25in\">Throughout this prospectus, when we refer to
        the\nshares of our common stock being registered on behalf of the selling
        stockholder for offer and sale, we are referring to the shares of\ncommon
        stock issuable upon exercise of the warrants, each as described under &ldquo;The
        Private Placement&rdquo; and &ldquo;Selling Stockholder.&rdquo;\nWhen we refer
        to the selling stockholder in this prospectus, we are referring to the selling
        stockholder identified in this prospectus\nand, as applicable, its donees,
        pledgees, transferees or other successors-in-interest selling shares of common
        stock or interests in shares\nof common stock received after the date of this
        prospectus from the selling stockholder as a gift, pledge, partnership distribution
        or\nother transfer.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\"></P>\n\n<!-- Field: Page; Sequence: 9; Value: 1 -->\n
        \   <DIV STYLE=\"margin-top: 12pt; margin-bottom: 6pt; border-bottom: Black
        1pt solid\"><P STYLE=\"text-align: center; margin-top: 0pt; margin-bottom:
        0pt\"><!-- Field: Sequence; Type: Arabic; Name: PageNo -->6<!-- Field: /Sequence
        --></P></DIV>\n    <DIV STYLE=\"break-before: page; margin-top: 6pt; margin-bottom:
        12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        center\"><A NAME=\"a_003\"></A><B>RISK FACTORS</B></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">Investing
        in our securities involves a high degree\nof risk. You should carefully consider
        and evaluate all of the information contained in this prospectus and in the
        documents we incorporate\nby reference into this prospectus before you decide
        to purchase our securities. In particular, you should carefully consider and
        evaluate\nthe risks and uncertainties described under the heading &ldquo;Risk
        Factors&rdquo; in our <A HREF=\"https://www.sec.gov/ix?doc=/Archives/edgar/data/1736243/000155837023003929/acxp-20221231x10k.htm\"
        STYLE=\"-sec-extract: exhibit\">Annual Report on Form&nbsp;10-K for the year
        ended December&nbsp;31, 2022</A>. Any of the risks and uncertainties set forth
        below and in the Annual Report, as updated by annual, quarterly\nand other
        reports and documents that we file with the SEC and incorporate by reference
        into this prospectus, or any prospectus, could\nmaterially and adversely affect
        our business, results of operations and financial condition, which in turn
        could materially and adversely\naffect the value of any securities offered
        by this prospectus. As a result, you could lose all or part of your investment.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\"></P>\n\n<!--
        Field: Page; Sequence: 10; Value: 1 -->\n    <DIV STYLE=\"margin-top: 12pt;
        margin-bottom: 6pt; border-bottom: Black 1pt solid\"><P STYLE=\"text-align:
        center; margin-top: 0pt; margin-bottom: 0pt\"><!-- Field: Sequence; Type:
        Arabic; Name: PageNo -->7<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before:
        page; margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-align: center\"><A NAME=\"a_004\"></A><B>THE
        PRIVATE PLACEMENT</B></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-indent: 0.25in\">On May&nbsp;16, 2023, we
        entered into the Purchase\nAgreement <FONT STYLE=\"background-color: white\">with
        a single healthcare-focused U.S. institutional investor named therein (the
        &ldquo;Investor&rdquo;),\n</FONT>pursuant to which we issued and sold, in
        a private placement (the &ldquo;Private Placement&rdquo;), <FONT STYLE=\"background-color:
        white\">(i)&nbsp;series\nC warrants exercisable for an aggregate of 1,333,333
        shares of Common Stock at an exercise price of $3.26 per share and (ii)&nbsp;series\nD
        warrants exercisable for an aggregate of 1,333,333 shares of common stock
        at an exercise price of $3.26 per share. Each series C warrant\nwill be exercisable
        commencing on November&nbsp;18, 2023 and will expire two years from the initial
        exercise date. Each series D warrant\nwill be exercisable commencing on November&nbsp;18,
        2023 and will expire six years from the initial exercise date.</FONT></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">In connection with the Offerings, we entered into\na Placement Agent
        Agreement with the Placement Agent, pursuant to which the Placement Agent
        acted as the exclusive placement agent in\nconnection with the Offerings.
        Pursuant to the Placement Agent Agreement, we agreed to pay the Placement
        Agent a fee equal to 5.75% of\nthe aggregate gross proceeds from the Offerings.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\"><FONT STYLE=\"background-color: white\">Pursuant\nto the terms of
        the Purchase Agreement, we agreed to use commercially reasonable efforts to
        cause a registration statement on Form&nbsp;S-1\nproviding for the resale
        by holders of shares of our common stock issuable upon the exercise of the
        warrants, to become effective by November&nbsp;14,\n2023 and to keep such
        registration statement effective at all times.</FONT></P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The
        foregoing descriptions of the form of Purchase\nAgreement, the Placement Agent
        Agreement, the form of series C warrant and the form of series D warrant are
        not complete and are subject\nto and qualified in their entirety by reference
        to the form of Purchase Agreement, the form of Placement Agent Agreement,
        the form of\nseries C warrant and the form of series D warrant, respectively,
        copies of which are attached as Exhibits 10.1, 1.1, 4.1 and 4.2, respectively,\nto
        the <A HREF=\"https://www.sec.gov/ix?doc=/Archives/edgar/data/1736243/000110465923061848/tm2315976d1_8k.htm\"
