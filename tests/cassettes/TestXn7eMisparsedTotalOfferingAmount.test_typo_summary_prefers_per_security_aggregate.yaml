        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        left; text-indent: 0.5in\">Please note that we are opining\nonly as to the
        matters expressly set forth herein, and no opinion should be inferred as to
        any other matters. This opinion is based upon\ncurrently existing statutes,
        rules, regulations and judicial decisions, and we disclaim any obligation
        to advise you of any change in\nany of these sources of law or subsequent
        legal or factual developments which might affect any matters or opinions set
        forth herein.</P>\n\n<P STYLE=\"text-align: left; font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0; text-align: left; text-indent: 0.5in\">Based
        upon the foregoing,\nas subject to the limitations set forth herein, we are
        of the opinion that the Shares have been duly authorized and reserved for
        issuance,\nand when issued and sold in accordance with the terms and conditions
        of the series C warrants and the series D warrants, as applicable,\nwill be
        validly issued, fully paid and non-assessable.</P>\n\n<P STYLE=\"text-align:
        left; font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        left; text-indent: 0.5in\">We understand that you wish\nto file this opinion
        with the Commission as an exhibit to the Registration Statement in accordance
        with the requirements of Item 601(b)(5)&nbsp;of&nbsp;Regulation&nbsp;S-K&nbsp;promulgated\nunder
        the Securities Act and to reference the firm&rsquo;s name under the caption
        &ldquo;Legal Matters&rdquo; in the prospectus which\nforms part of the Registration
        Statement, and we hereby consent thereto. In giving this consent, we do not
        admit that we are within the\ncategory of persons whose consent is required
        under Section&nbsp;7 of the Securities Act or the rules&nbsp;and regulations
        of the Commission\npromulgated thereunder.</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0\">Very truly yours,</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<TABLE
        CELLPADDING=\"0\" CELLSPACING=\"0\" STYLE=\"border-collapse: collapse; width:
