        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">We will receive the exercise price upon any exercise\nof the warrants,
        to the extent exercised on a cash basis. If all the warrants were exercised
        for cash, we would receive gross proceeds\nof approximately $8.7 million.
        However, the holders of the warrants are not obligated to exercise the warrants,
        and we cannot predict\nwhether or when, if ever, the holders of the warrants
        will choose to exercise the warrants, in whole or in part. Accordingly, any
        proceeds\nfrom such exercise will be used for general corporate purposes and
        working capital.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
