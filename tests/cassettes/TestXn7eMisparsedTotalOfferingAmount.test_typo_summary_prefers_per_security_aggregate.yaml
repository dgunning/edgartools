        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-align: center\">CONSENT OF INDEPENDENT REGISTERED
        PUBLIC ACCOUNTING\nFIRM</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-align: left\">We consent to the incorporation
        by reference in\nthis Registration Statement on Form&nbsp;S-1 and related
        Prospectus, of our report dated March&nbsp;15, 2023, with respect to the financial\nstatements
        of Acurx Pharmaceuticals,&nbsp;Inc. as of December&nbsp;31, 2022 and 2021,
        and for the years then ended, which report is included\nin the Annual Report
        of Form&nbsp;10-K of Acurx Pharmaceuticals,&nbsp;Inc. for the year ended December&nbsp;31,
        2022, filed with the Securities\nand Exchange Commission. Our audit report
        includes an explanatory paragraph relating to the Acurx Pharmaceuticals,&nbsp;Inc.&rsquo;s
        ability\nto continue as a going concern.</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt
        Times New Roman, Times, Serif; margin: 0pt 0; text-align: justify\">We also
        consent to the reference to our firm under\nthe caption &ldquo;Experts.&rdquo;</P>\n\n<P
