        12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n    <!-- Field: /Page -->\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-align:
        center\"><A NAME=\"a_007\"></A><B>MARKET FOR COMMON STOCK AND DIVIDEND POLICY</B></P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">Our common stock is traded on the Nasdaq Capital\nMarket under the
        symbol &ldquo;ACXP.&rdquo; The last reported sale price of our common stock
        on June&nbsp;28, 2023 on the Nasdaq Capital\nMarket was $2.56 per share. As
        of June&nbsp;28, 2023, there were 211 stockholders of record of our common
        stock.</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif; margin:
        0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0; text-indent: 0.25in\">We have never declared or paid any cash
        dividend\non our common stock. We intend to retain any future earnings and
        do not expect to pay dividends in the foreseeable future.</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font:
        10pt Times New Roman, Times, Serif; margin: 0pt 0\"></P>\n\n<!-- Field: Page;
        Sequence: 15; Value: 1 -->\n    <DIV STYLE=\"margin-top: 12pt; margin-bottom:
        6pt; border-bottom: Black 1pt solid\"><P STYLE=\"text-align: center; margin-top:
        0pt; margin-bottom: 0pt\"><!-- Field: Sequence; Type: Arabic; Name: PageNo
        -->12<!-- Field: /Sequence --></P></DIV>\n    <DIV STYLE=\"break-before: page;
        margin-top: 6pt; margin-bottom: 12pt\"><P STYLE=\"margin: 0pt\">&nbsp;</P></DIV>\n
        \   <!-- Field: /Page -->\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-align: center\"><A NAME=\"a_008\"></A><B>SELLING
        STOCKHOLDER</B></P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times, Serif;
        margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman, Times,
        Serif; margin: 0pt 0; text-indent: 0.25in\">The common stock being offered
        by the selling\nstockholder are those issuable to the selling stockholder
        upon exercise of the warrants. For additional information regarding the issuance\nof
        the warrants, see &ldquo;The Private Placement&rdquo; above. We are registering
        the shares of common stock in order to permit the selling\nstockholder to
        offer the shares for resale from time to time. Except as described below,
        to our knowledge, the selling stockholder has\nnot been an officer or director
        of ours or of our affiliates within the past three years or has any material
        relationship with us or our\naffiliates within the past three years. Our knowledge
        is based on information provided by the selling stockholder in connection
        with the\nfiling of this prospectus.</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The table below
        lists the selling stockholder\nand other information regarding the beneficial
        ownership of the shares of common stock by the selling stockholder. The second
        column lists\nthe number of shares of common stock beneficially owned by the
        selling stockholder, based on its ownership of the shares of common stock,\noptions
        to purchase common stock, and warrants, as of June&nbsp;1, 2023, assuming
        exercise of the warrants held by the selling stockholder\non that date, without
        regard to any limitations on exercises. The third column lists the maximum
        number of shares of common stock that\nmay be sold or otherwise disposed of
        by the selling stockholder pursuant to the registration statement of which
        this prospectus forms\na part. The selling stockholder may sell or otherwise
        dispose of some, all or none of its shares. Pursuant to Rules&nbsp;13d-3 and
        13d-5\nof the Exchange Act, beneficial ownership includes any shares of our
        common stock as to which a stockholder has sole or shared voting\npower or
        investment power, and also any shares of our common stock which the stockholder
        has the right to acquire within 60 days of June&nbsp;1,\n2023. The percentage
        of beneficial ownership for the selling stockholder is based on 12,939,128
        shares of our common stock outstanding\nas of June&nbsp;1, 2023 and the number
        of shares of our common stock issuable upon exercise or conversion of convertible
        securities that\nare currently exercisable or convertible or are exercisable
        or convertible within 60 days of June&nbsp;1, 2023 beneficially owned by the\nselling
        stockholder. The fourth column assumes the sale of all of the shares of common
        stock offered by the selling stockholder pursuant\nto this prospectus.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0; text-indent:
        0.25in\">Under the terms of the warrants, the selling stockholder\nmay not
        exercise the warrants to the extent such exercise would cause such selling
        stockholder, together with its affiliates and attribution\nparties, to beneficially
        own a number of shares of common stock which would exceed 4.99% (or for certain
        holders, 9.99%) of our then outstanding\ncommon stock following such exercise,
        excluding for purposes of such determination shares of common stock issuable
        upon exercise of the\nwarrants which have not been exercised. The number of
        shares in the second column does not reflect this limitation. The selling
        stockholder\nmay sell all, some or none of its shares in this offering. See
        &ldquo;Plan of Distribution.&rdquo;</P>\n\n<P STYLE=\"font: 10pt Times New
        Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times
        New Roman, Times, Serif; margin: 0pt 0; text-indent: 0.25in\">Information
        about the selling stockholder may\nchange over time. Any changed information
        will be set forth in an amendment to the registration statement or supplement
        to this prospectus,\nto the extent required by law. Unless otherwise noted
        below, the address of the selling stockholder listed on the table is c/o Acurx
        Pharmaceuticals,&nbsp;Inc.,\n259 Liberty Avenue, Staten Island, NY 10305.</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P
        STYLE=\"font: 10pt Times New Roman, Times, Serif; margin: 0pt 0\"></P>\n\n<!--
