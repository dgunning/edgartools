        Serif; margin: 0pt 0\">&nbsp;</P>\n\n<P STYLE=\"font: 10pt Times New Roman,
        Times, Serif; margin: 0pt 0; text-indent: 0.25in\">The selling stockholder
        of Acurx Pharmaceuticals,&nbsp;Inc.\n(&ldquo;Acurx,&rdquo; &ldquo;we,&rdquo;
