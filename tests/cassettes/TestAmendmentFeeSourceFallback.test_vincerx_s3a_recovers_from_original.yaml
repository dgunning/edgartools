        font-size:10pt; font-family:Times New Roman\"><B>Item 17. Undertakings. </B></P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The undersigned Registrant hereby undertakes:
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">(1) To file, during any period in which offers
        or sales are being made, a post-effective amendment to this registration statement:
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(i) To include any prospectus
        required by section&nbsp;10(a)(3) of the Securities Act of 1933; </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(ii) To reflect in the prospectus
        any facts or events arising after the effective date of the registration statement
        (or the\nmost recent post-effective amendment thereof) which, individually
        or in the aggregate, represent a fundamental change in the information set
        forth in the registration statement. Notwithstanding the foregoing, any increase
        or decrease in volume of\nsecurities offered (if the total dollar value of
        securities offered would not exceed that which was registered) and any deviation
        from the low or high end of the estimated maximum offering range may be reflected
        in the form of prospectus filed with\nthe Securities and Exchange Commission
        pursuant to Rule 424(b) if, in the aggregate, the changes in volume and price
        represent no more than a 20% change in the maximum aggregate offering price
        set forth in the &#147;Calculation of Filing Fee\nTables&#148; or &#147;Calculation
        of Registration Fee&#148; table, as applicable, in the effective registration
        statement; and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(iii) To include
        any material information with respect to the plan of distribution not previously
        disclosed in the registration\nstatement or any material change to such information
        in the registration statement; </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><I>provided, however</I>, that
        paragraphs (i), (ii) and\n(iii)&nbsp;above do not apply if the information
        required to be included in a post-effective amendment by those paragraphs
        is contained in reports filed with or furnished to the Securities and Exchange
        Commission by the Registrant pursuant to\nsection 13 or section 15(d) of the
        Securities Exchange Act of 1934 that are incorporated by reference in the
        registration statement, or is contained in a form of prospectus filed pursuant
        to Rule&nbsp;424(b) that is part of the registration\nstatement. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(2)
        That, for the purpose of determining any liability under the Securities Act
        of 1933, each such post-effective amendment\nshall be deemed to be a new registration
        statement relating to the securities offered therein, and the offering of
        such securities at that time shall be deemed to be the initial bona fide offering
        thereof. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">II-2 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
