        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\">\ndiscounts, concessions or
        commissions that underwriters allow to dealers. Underwriters, dealers and
        agents participating in the securities distribution may be deemed to be underwriters,
        and any\ndiscounts, commissions or concessions they receive and any profit
        they realize on the resale of the securities may be deemed to be underwriting
        discounts and commissions under the Securities Act. Underwriters and their
        controlling persons, dealers\nand agents may be entitled, under agreements
        entered into with us, to indemnification against and contribution toward specific
        civil liabilities, including liabilities under the Securities Act. Some of
        the underwriters, dealers or agents who\nparticipate in the securities distribution
        may engage in other transactions with, and perform other services for, us
        or our subsidiaries in the ordinary course of business. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        common stock is currently listed on the Nasdaq Capital Market, but any other
        securities may or may not be listed on a national securities\nexchange. To
        facilitate the offering of securities, certain persons participating in the
        offering may engage in transactions that stabilize, maintain or otherwise
        affect the price of the securities. This may include over-allotments or short
        sales of\nthe securities, which involve the sale by persons participating
        in the offering of more securities than were sold to them. In these circumstances,
        these persons would cover such over-allotments or short positions by making
        purchases in the open\nmarket or by exercising their over-allotment option,
        if any. In addition, these persons may stabilize or maintain the price of
        the securities by bidding for or purchasing securities in the open market
        or by imposing penalty bids, whereby selling\nconcessions allowed to dealers
        participating in the offering may be reclaimed if securities sold by them
        are repurchased in connection with stabilization transactions. The effect
        of these transactions may be to stabilize or maintain the market price\nof
        the securities at a level above that which might otherwise prevail in the
        open market. These transactions may be discontinued at any time. </P>\n <p
        STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt;
