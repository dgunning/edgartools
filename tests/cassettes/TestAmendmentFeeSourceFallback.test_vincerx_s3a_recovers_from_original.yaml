        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">provisions
        affecting conversion or exchange in the event of our redemption of the debt
        securities.\n</P></TD></TR></TABLE> <P STYLE=\"margin-top:18pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B>Consolidation, Merger or
        Sale </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">We cannot consolidate with or
        merge with or into, or transfer or lease all or substantially all of our assets
        to, any person, unless we are the\nsurviving corporation or the successor
        person is a corporation organized under the laws of the United States, any
        state of the United States or the District of Columbia and expressly assumes
        our obligations under the debt securities and the\nindenture. In addition,
        we cannot complete such a transaction unless immediately after completing
        the transaction, no event of default under the indenture, and no event that,
        after notice or lapse of time or both, would become an event of default\nunder
        the indenture, has occurred and is continuing. When the successor person has
        assumed our obligations under the debt securities and the indenture, we will
        be discharged from all our obligations under the debt securities and the indenture
        except\nin limited circumstances. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">This covenant
        would not apply to any recapitalization transaction, a change of control affecting
        us or a highly\nleveraged transaction, unless the transaction or change of
        control were structured to include a merger or consolidation or transfer or
        lease of all or substantially all of our assets. </P>\n<P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Events
        of Default </B></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">The indenture provides\nthat
        the following will be &#147;events of default&#148; with respect to any series
