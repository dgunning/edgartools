        occurrence of any of these risks might cause you to lose all or part of your
        investment in the offered securities. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">2 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
        style=\"font-size:10pt;font-weight:bold\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B><A NAME=\"toc921557_3\"></A>VINCERX
        PHARMA, INC. </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">We are a clinical-stage biopharmaceutical
        company focused on leveraging our extensive development and oncology expertise
        to advance new\ntherapies intended to address unmet medical needs for the
        treatment of cancer. Our current pipeline is entirely derived from that certain
        License Agreement, dated October&nbsp;7, 2020, by and among us, Bayer Aktiengesellschaft
        and Bayer Intellectual\nProperty GmbH (the &#147;Bayer License Agreement&#148;),
        pursuant to which we have been granted an exclusive, royalty-bearing, worldwide
        license under certain Bayer patents and <FONT STYLE=\"white-space:nowrap\">know-how</FONT>
        to develop, use,\nmanufacture, commercialize, sublicense, and distribute a
        bioconjugation platform, which includes next-generation antibody-drug conjugates
        and small molecule-drug conjugates, and a small molecule drug program, including
        a <FONT\nSTYLE=\"white-space:nowrap\">P-TEFb</FONT> inhibitor compound. We
        intend to use these product candidates to treat various cancers in a patient-specific,
        targeted approach. We believe that these product candidates are differentiated
        from current\nprograms targeting similar cancer biology and, if approved,
        may improve clinical outcomes of patients with cancer. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        company was\noriginally known as LifeSci Acquisition Corp. On December&nbsp;23,
        2020, LSAC consummated a business combination with Vincera Pharma, Inc. LSAC
        was incorporated in the State of Delaware in December 2018 as a special purpose
        acquisition company. In\nconnection with the closing of the business combination,
        LSAC changed its name to Vincera Pharma, Inc. and subsequently to Vincerx
        Pharma, Inc. In December 2020, its wholly-owned subsidiary merged with and
        into Vincera Pharma, with Vincera Pharma\nsurviving the merger as a wholly-owned
        subsidiary of LSAC. In connection with the business combination, we changed
        our name to Vincera Pharma, Inc., and subsequently to Vincerx Pharma, Inc.
        Our principal executive offices are located at 1825 S.\nGrant Street, San
        Mateo, California 94402, and our telephone number is (650) <FONT STYLE=\"white-space:nowrap\">800-6676.</FONT>
        Our website address is www.vincerx.com. The information contained on, or that
        can be accessed through, our website is not\npart of, or incorporated by reference
        in, this prospectus or any prospectus supplement. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">3 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
