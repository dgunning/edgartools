        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">We will be required to file annually with the
        trustee a\ncertificate, signed by one of our officers, stating whether or
        not the officer knows of any default by us in the performance, observance
        or fulfillment of any condition or covenant of the indenture. </P>\n<P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Discharge,
        Defeasance and Covenant Defeasance </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">We can discharge
        or decrease our obligations under the indenture as stated below. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">We may discharge obligations to holders of any
        series of debt securities that have not already been delivered to the trustee
        for cancellation\nand that have either become due and payable or are by their
        terms to become due and payable, or are scheduled for redemption, within one
        year. We may effect a discharge by irrevocably depositing with the trustee
        cash or government obligations\ndenominated in the currency of the debt securities,
        as trust funds, in an amount certified to be enough to pay when due, whether
        at maturity, upon redemption or otherwise, the principal of, and any premium
        and interest on, the debt securities and\nany mandatory sinking fund payments.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Unless otherwise provided in the applicable
        prospectus supplement, we may also discharge any and all\nof our obligations
        to holders of any series of debt securities at any time, which we refer to
        as defeasance. We may also be released from the obligations imposed by any
        covenants of any outstanding series of debt securities and provisions of the\nindenture,
        and we may omit to comply with those covenants without creating an event of
        default under the trust declaration, which we refer to as covenant defeasance.
        We may effect defeasance and covenant defeasance only if, among other things:
        </P>\n<P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">we irrevocably
        deposit with the trustee cash or government obligations denominated in the
        currency of the debt\nsecurities, as trust funds, in an amount certified to
        be enough to pay at maturity, or upon redemption, the principal (including
        any mandatory sinking fund payments) of, and any premium and interest on,
        all outstanding debt securities of the series;\nand </P></TD></TR></TABLE>\n
        <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P
        STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
