        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B><A NAME=\"toc921557_6\"></A>DESCRIPTION
        OF DEBT SECURITIES </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The following
        is a summary of the general terms of the debt securities that we may issue
        under this prospectus. We will file a prospectus\nsupplement that may contain
        additional terms when we issue debt securities. The terms presented here,
        together with the terms in a related prospectus supplement, together with
        any pricing supplement or term sheet, will be a description of the\nmaterial
        terms of the debt securities. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">We may issue
        debt securities either separately, or together with, or upon the conversion
        or\nexercise of or in exchange for, other securities described in this prospectus.
        Debt securities may be our senior, senior subordinated or subordinated obligations
        and, unless otherwise specified in a supplement to this prospectus, the debt
        securities\nwill be our direct, unsecured obligations and may be issued in
        one or more series. Any debt securities that are issued may be exchangeable
        for or convertible into common stock or any of the other securities that may
        be issued under this prospectus.\n</P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The debt securities
        we offer will be issued under an indenture between us and the trustee named
        in the indenture. The following is a\nsummary of the material provisions of
        the form of indenture filed as an exhibit to the registration statement of
        which this prospectus is a part. All capitalized terms have the meanings specified
        in the indenture. For each series of debt securities,\nthe applicable prospectus
        supplement for the series may change and supplement the summary below. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">As used in this section only,\n&#147;we,&#148;
        &#147;us&#148; and &#147;our&#148; refer to Vincerx Pharma, Inc. excluding
        our subsidiaries, unless expressly stated or the context otherwise requires.
        </P>\n<P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>General Terms of the Indenture </B></P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">The\nindenture
        does not limit the amount of debt securities that we may issue. It provides
        that we may issue debt securities for any series of debt securities up to
