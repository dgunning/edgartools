        be issued at indeterminate prices, with an aggregate initial offering price
        not to exceed $100,000,000.\nSubject to the preceding sentence, this registration
        statement also registers an indeterminate principal amount or number of shares
        of debt securities, preferred stock or common stock that may be issued upon
        conversion of, or in exchange for, debt\nsecurities or preferred stock registered
        hereunder or upon exercise of warrants registered hereunder, as the case may
        be, and an indeterminate number of depositary shares to be evidenced by depositary
        receipts issued pursuant to a deposit agreement.\nIf the Registrant elects
        to offer to the public fractional or aggregated share interests in shares
        of preferred stock registered hereunder, depositary receipts will be distributed
        to those persons purchasing such fractional interests, and the shares\nof
        preferred stock will be issued to the depositary under the deposit agreement.
        In addition, pursuant to Rule 416 under the Securities Act of 1933, as amended
        (the &#147;Securities Act&#148;), the shares the Registrant is registering
        under this\nregistration statement include such indeterminate number of common
        shares and preferred shares as may be issuable with respect to the shares
        the Registrant is registering as a result of shares splits, shares dividends
        or similar transactions.\n</P></TD></TR></TABLE>\n<TABLE STYLE=\"BORDER-COLLAPSE:COLLAPSE;
