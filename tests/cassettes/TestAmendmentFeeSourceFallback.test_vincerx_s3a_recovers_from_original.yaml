        terminated or wound up our business and the depositary has distributed the
        preferred stock of\nthe relevant series to the holders of the related depositary
        shares. </P></TD></TR></TABLE> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B>Payment of Fees and Expenses
        </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">We will pay all fees, charges and expenses of
        the depositary, including the initial deposit of the preferred stock and any
        redemption of the\npreferred stock. Holders of depositary shares will pay
        transfer and other taxes and governmental charges and any other charges as
        are stated in the deposit agreement for their accounts. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Resignation
        and Removal of Depositary </B></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">At\nany time,
        the depositary may resign by delivering notice to us, and we may remove the
        depositary. Resignations or removals will take effect upon the appointment
        of a successor depositary and its acceptance of the appointment. The successor\ndepositary
        must be appointed within 60&nbsp;days after delivery of the notice of resignation
        or removal and must be a bank or trust company having its principal office
        in the United States and having a combined capital and surplus of at least\n$50&nbsp;million.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>Reports </B></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The\ndepositary
        will forward to the holders of depositary shares all reports and communications
        from us that are delivered to the depositary and that we are required by law,
        the rules of an applicable securities exchange or our Certificate of\nIncorporation
        to furnish to the holders of the preferred stock. Neither we nor the depositary
        will be liable if the depositary is prevented or delayed by law or any circumstances
        beyond its control in performing its obligations under the deposit\nagreement.
        The deposit agreement limits our obligations and the depositary&#146;s obligations
        to performance in good faith of the duties stated in the deposit agreement.
        Neither we nor the depositary will be obligated to prosecute or defend any\nlegal
        proceeding connected with any depositary shares or preferred stock unless
        the holders of depositary shares requesting us to do so furnish us with satisfactory
        indemnity. In performing our obligations, we and the depositary may rely upon
        the\nwritten advice of our counsel or accountants, on any information that
        competent people provide to us and on documents that we believe are genuine.
