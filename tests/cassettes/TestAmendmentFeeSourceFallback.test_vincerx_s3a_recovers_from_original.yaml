        New Roman\" ALIGN=\"center\"><B>DEREGISTRATION OF UNSOLD SECURITIES </B></P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">This Post-Effective Amendment (this &#147;Post-Effective
        Amendment&#148;), filed by Vincerx Pharma, Inc., a Delaware corporation (the\n&#147;Registrant&#148;),
        relates to the Registration Statement on Form <FONT STYLE=\"white-space:nowrap\">S-3</FONT>
        (File <FONT STYLE=\"white-space:nowrap\">No.&nbsp;333-284478)</FONT> filed
        by the Registrant with the Securities and Exchange Commission\n(the &#147;SEC&#148;)
        on January&nbsp;24, 2025, as amended by Amendment No.&nbsp;1 filed with the
        SEC on March&nbsp;31, 2025 and declared effective on April&nbsp;2, 2025 (the
        &#147;Registration Statement&#148;). The Registration Statement was filed\nwith
        respect to the offer, issuance and sale by the Company of up to $100,000,000
        in aggregate offering price of the securities described therein from time
        to time in one or more offerings. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">On April&nbsp;28,
        2025, the Registrant filed a Notification of Removal From Listing and/or Registration
        on Form 25 with the SEC to delist its\ncommon stock from The Nasdaq Stock
        Market LLC and to deregister the common stock under Section&nbsp;12(b) of
        the Securities Exchange Act of 1934. As previously disclosed in a Current
        Report on Form <FONT STYLE=\"white-space:nowrap\">8-K</FONT> filed\nwith the
        SEC on April&nbsp;17, 2025, the board of directors of the Registrant approved
        the dissolution and liquidation of the Registrant pursuant to a plan of dissolution,
        subject to the approval of the Registrant&#146;s stockholders. Accordingly,\nthe
        Registrant is terminating all offerings of its securities pursuant to existing
        registration statements under the Securities Act of 1933, including the Registration
        Statement. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Pursuant to the undertaking
        made by the Registrant in the Registration Statement to remove from registration
        by means of a post-effective\namendment any of the securities that had been
        registered for issuance that remain unsold at the termination of the offering,
        the Registrant is filing this Post-Effective Amendment to terminate the effectiveness
        of such Registration Statement and to\nderegister, as of the effectiveness
        of this Post-Effective Amendment, any and all shares of common stock registered
        thereunder that remain unsold as of the effectiveness date. As a result of
        this deregistration and upon the effectiveness of this\nPost-Effective Amendment,
        no securities will remain registered pursuant to the Registration Statement.
