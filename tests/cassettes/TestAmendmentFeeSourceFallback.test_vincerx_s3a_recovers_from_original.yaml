        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\" style=\"font-size:10pt;font-weight:bold\"><a
        href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\"
        align=\"left\">\n\n<TABLE STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times
        New Roman; font-size:10pt\" BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\"
        WIDTH=\"100%\">\n<TR style = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD
        WIDTH=\"3%\" VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">we deliver
        to the trustee an opinion of counsel from a nationally recognized law firm
        to the effect that the\nholders of the series of debt securities will not
        recognize income, gain or loss for U.S. federal income tax purposes as a result
        of the defeasance or covenant defeasance and that defeasance or covenant defeasance
        will not otherwise alter the\nholders&#146; U.S. federal income tax treatment
        of principal, and any premium and interest payments on, the series of debt
        securities. </P></TD></TR></TABLE>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">In the case
        of a defeasance by us, the opinion we deliver must be based on a ruling of
        the Internal Revenue Service issued, or a change in\nU.S. federal income tax
        law occurring, after the date of the indenture, since such a result would
        not occur under the U.S. federal income tax laws in effect on that date. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Although we may discharge or decrease our obligations
        under the indenture as described in the two preceding paragraphs, we may not
        avoid,\namong other things, our duty to register the transfer or exchange
        of any series of debt securities, to replace any temporary, mutilated, destroyed,
        lost or stolen series of debt securities or to maintain an office or agency
        in respect of any series\nof debt securities. </P> <P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Modification
        of the Indenture </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">The indenture provides that
        we and the trustee may enter into supplemental indentures without the consent
