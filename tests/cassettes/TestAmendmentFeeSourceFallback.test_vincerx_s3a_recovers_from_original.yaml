        font-size:10pt; font-family:Times New Roman\"><B>Item&#8201;15. Indemnification
        of Directors and Officers. </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">Section&nbsp;145
        of the General Corporation Law of the State of Delaware (the &#147;DGCL&#148;)
        provides for the indemnification of officers,\ndirectors, and other corporate
        agents in terms sufficiently broad to indemnify such persons under certain
        circumstances for liabilities (including reimbursement for expenses incurred)
        arising under the Securities Act of 1933. Article VIII of the\nRegistrant&#146;s
        Second Amended and Restated Certificate of Incorporation, Exhibit 3.1 to the
        Registrant&#146;s Registration Statement on <FONT STYLE=\"white-space:nowrap\">Form&nbsp;S-1</FONT>
        (File No. 333-252589), and Article 6 of the\nRegistrant&#146;s Amended and
        Restated Bylaws, Exhibit 3.1 to the Registrant&#146;s Current Report on Form
        <FONT STYLE=\"white-space:nowrap\">8-K</FONT> filed on May&nbsp;28, 2024,
        provide for indemnification of the Registrant&#146;s directors,\nofficers,
        employees and other agents to the extent and under the circumstances permitted
        by the DGCL. The Registrant has also entered into agreements with its directors
        and officers that will require the Registrant, among other things, to indemnify\nthem
        against certain liabilities that may arise by reason of their status or service
        as directors or officers to the fullest extent not prohibited by law. The
        Registrant also maintains a general liability insurance policy, which will
        cover certain\nliabilities of directors and officers of the Registrant arising
        out of claims based on acts or omissions in their capacities as directors
        or officers. </P>\n<P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
