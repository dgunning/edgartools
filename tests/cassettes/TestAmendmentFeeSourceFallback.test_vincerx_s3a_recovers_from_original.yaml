        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
        style=\"font-size:10pt;font-weight:bold\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B><A NAME=\"toc921557_11\"></A>FORMS
        OF SECURITIES </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Each debt security, depositary
        share, warrant and right will be represented either by a certificate issued
        in definitive form to a particular\ninvestor or by one or more global securities
        representing the entire issuance of securities. Unless the applicable prospectus
        supplement provides otherwise, certificated securities will be issued in definitive
        form and global securities will be\nissued in registered form. Definitive
        securities name you or your nominee as the owner of the security, and in order
        to transfer or exchange these securities or to receive payments other than
        interest or other interim payments, you or your nominee\nmust physically deliver
        the securities to the trustee, registrar, paying agent or other agent, as
        applicable. Global securities name a depositary or its nominee as the owner
        of the debt securities, depositary shares, warrants or rights represented\nby
        these global securities. The depositary maintains a computerized system that
        will reflect each investor&#146;s beneficial ownership of the securities through
        an account maintained by the investor with its broker/dealer, bank, trust
        company or\nother representative, as we explain more fully below. </P> <P
        STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>Registered Global Securities </B></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">We
        may issue the registered debt securities, depositary shares, warrants and
        rights in the form of one or more fully registered global\nsecurities that
        will be deposited with a depositary or its nominee identified in the applicable
        prospectus supplement and registered in the name of that depositary or nominee.
        In those cases, one or more registered global securities will be issued\nin
        a denomination or aggregate denominations equal to the portion of the aggregate
        principal or face amount of the securities to be represented by registered
        global securities. Unless and until it is exchanged in whole for securities
        in definitive\nregistered form, a registered global security may not be transferred
        except as a whole by and among the depositary for the registered global security,
        the nominees of the depositary or any successors of the depositary or those
        nominees. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">If not described below, any
        specific terms of the depositary arrangement with respect to any securities
        to be represented by a registered\nglobal security will be described in the
        prospectus supplement relating to those securities. We anticipate that the
        following provisions will apply to all depositary arrangements. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Ownership
        of beneficial interests in a registered global security will be limited to
        persons, called participants, that have accounts with the\ndepositary or persons
        that may hold interests through participants. Upon the issuance of a registered
        global security, the depositary will credit, on its book-entry registration
        and transfer system, the participants&#146; accounts with the\nrespective
        principal or face amounts of the securities beneficially owned by the participants.
        Any underwriters, dealers or agents participating in the distribution of the
        securities will designate the accounts to be credited. Ownership of\nbeneficial
        interests in a registered global security will be shown on, and the transfer
        of ownership interests will be effected only through, records maintained by
        the depositary, with respect to interests of participants, and on the records
        of\nparticipants, with respect to interests of persons holding through participants.
        The laws of some states may require that some purchasers of securities take
        physical delivery of these securities in definitive form. These laws may impair
        your ability\nto own, transfer or pledge beneficial interests in registered
        global securities. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">So long as the depositary, or
        its nominee, is the\nregistered owner of a registered global security, that
        depositary or its nominee, as the case may be, will be considered the sole
        owner or holder of the securities represented by the registered global security
        for all purposes under the applicable\nindenture, deposit agreement, warrant
        agreement or rights agreement. Except as described below, owners of beneficial
        interests in a registered global security: </P> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
