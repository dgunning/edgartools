        href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\"
        align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B><A NAME=\"toc921557_5\"></A>USE
        OF PROCEEDS </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Unless we state otherwise in
        the applicable prospectus supplement, we intend to use the net proceeds from
        the sale of the securities offered\nby this prospectus for general corporate
        purposes. General corporate purposes may include additions to working capital,
        financing of capital expenditures, repayment or redemption of existing indebtedness,
