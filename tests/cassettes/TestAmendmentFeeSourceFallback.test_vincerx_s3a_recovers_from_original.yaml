        WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\" style=\"font-size:10pt;font-weight:bold\"><a
        href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\"
        align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(3) To remove from registration
        by means of a post-effective amendment any of the securities\nbeing registered
        which remain unsold at the termination of the offering. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(4)
        That, for the purpose of determining liability under the\nSecurities Act of
        1933 to any purchaser: </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(A)
        Each prospectus filed by the registrant pursuant to Rule 424(b)(3) shall be\ndeemed
        to be part of the registration statement as of the date the filed prospectus
        was deemed part of and included in the registration statement; and </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(B) Each prospectus required
        to be filed pursuant to Rule 424(b)(2), (b)(5), or (b)(7) as part of a registration
        statement in\nreliance on Rule 430B relating to an offering made pursuant
        to Rule 415(a)(1)(i), (vii), or (x)&nbsp;for the purpose of providing the
        information required by section 10(a) of the Securities Act of 1933 shall
        be deemed to be part of and included in\nthe registration statement as of
        the earlier of the date such form of prospectus is first used after effectiveness
        or the date of the first contract of sale of securities in the offering described
        in the prospectus. As provided in Rule 430B, for\nliability purposes of the
        issuer and any person that is at that date an underwriter, such date shall
        be deemed to be a new effective date of the registration statement relating
        to the securities in the registration statement to which that prospectus\nrelates,
        and the offering of such securities at that time shall be deemed to be the
        initial bona fide offering thereof. <I>Provided, however</I>, that no statement
        made in a registration statement or prospectus that is part of the registration\nstatement
