        connection with the\nsecurities offered in the prospectus supplement. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The distribution of the securities may be effected
        from time to time in one or more\ntransactions at a fixed price or prices,
        which may be changed, or at prices determined as the applicable prospectus
        supplement specifies. The securities may be sold through an at the market
        offering, a rights offering, forward contracts or similar\narrangements. In
        addition, we may enter into derivative transactions with third parties, or
        sell securities not covered by this prospectus to third parties in privately
        negotiated transactions. If the applicable prospectus supplement so indicates,\nin
        connection with those derivatives, the third parties may sell securities covered
        by this prospectus and the applicable prospectus supplement, including in
        short sale transactions. If so, the third party may use securities pledged
        by us or\nborrowed from us or others to settle those sales or to close out
        any related open borrowings of stock, and may use securities received from
        us in settlement of those derivatives to close out any related open borrowings
        of stock. The third party in\nsuch sale transactions will be an underwriter
        and, if not identified in this prospectus, will be named in the applicable
        prospectus supplement (or a post-effective amendment). In addition, we may
        otherwise loan or pledge securities to a financial\ninstitution or other third
        party that in turn may sell the securities short using this prospectus and
        an applicable prospectus supplement. Such financial institution or other third
        party may transfer its economic short position to investors in our\nsecurities
        or in connection with a concurrent offering of other securities. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">In
        connection with the sale of the securities, underwriters,\ndealers or agents
        may be deemed to have received compensation from us in the form of underwriting
        discounts or commissions and also may receive commissions from securities
        purchasers for whom they may act as agent. Underwriters may sell the\nsecurities
        to or through dealers, and the dealers may receive compensation in the form
        of discounts, concessions or commissions from the underwriters or commissions
        from the purchasers for whom they may act as agent. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">We
        will provide in the applicable prospectus supplement information regarding
        any underwriting discounts or other compensation that we pay to\nunderwriters
        or agents in connection with the securities offering, and any </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">23 </P>\n\n</DIV></Center>\n\n\n<p
