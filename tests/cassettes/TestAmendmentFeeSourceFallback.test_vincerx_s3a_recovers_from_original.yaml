        align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Accordingly, each person owning
        a beneficial interest in a registered global security must\nrely on the procedures
        of the depositary for that registered global security and, if that person
        is not a participant, on the procedures of the participant through which the
        person owns its interest, to exercise any rights of a holder under the\napplicable
        indenture, deposit agreement, warrant agreement or rights agreement. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">We understand that under existing industry practices,
        if\nwe request any action of holders or if an owner of a beneficial interest
        in a registered global security desires to give or take any action that a
        holder is entitled to give or take under the applicable indenture, deposit
        agreement, warrant\nagreement or rights agreement, the depositary for the
        registered global security would authorize the participants holding the relevant
        beneficial interests to give or take that action, and the participants would
        authorize beneficial owners owning\nthrough them to give or take that action
        or would otherwise act upon the instructions of beneficial owners holding
        through them. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">We will\nmake payments of principal,
        premium, if any, and interest, if any, on debt securities, and any payments
        to holders with respect to depositary shares, warrants or rights, represented
        by a registered global security registered in the name of a\ndepositary or
        its nominee to the depositary or its nominee, as the case may be, as the registered
        owner of the registered global security. None of us, the trustees, the depositaries
        for depositary shares, the warrant agents, the rights agents or any\nother
        agent of ours, agent of the trustees, agent of such depositaries, agent of
        the warrant agents or agent of the rights agents will have any responsibility
        or liability for any aspect of the records relating to, or payments made on
        account of,\nbeneficial ownership interests in the registered global security
        or for maintaining, supervising or reviewing any records relating to those
        beneficial ownership interests. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">We expect that
        the depositary for any of the securities represented by a registered global
        security, upon receipt of any payment of principal,\npremium, interest or
        other distribution of underlying securities or other property to holders on
        that registered global security, will immediately credit participants&#146;
        accounts in amounts proportionate to their respective beneficial interests\nin
        that registered global security as shown on the records of the depositary.
        We also expect that standing customer instructions and customary practices
        will govern payments by participants to owners of beneficial interests in
        a registered global\nsecurity held through the participants, as is now the
        case with the securities held for the accounts of customers registered in
        &#147;street name.&#148; We also expect that any of these payments will be
        the responsibility of those participants. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">If
        the depositary for any of the securities represented by a registered global
        security is at any time unwilling or unable to continue as\ndepositary or
        ceases to be a clearing agency registered under the Exchange Act and a successor
        depositary registered as a clearing agency under the Exchange Act is not appointed
        by us within 90 days, we will issue securities in definitive form in\nexchange
        for the registered global security that had been held by the depositary. Any
        securities issued in definitive form in exchange for a registered global security
        will be registered in the name or names that the depositary gives to the relevant\ntrustee,
        warrant agent, unit agent or other relevant agent of ours or theirs. It is
        expected that the depositary&#146;s instructions will be based upon directions
        received by the depositary from participants with respect to ownership of
        beneficial\ninterests in the registered global security that had been held
        by the depositary. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
