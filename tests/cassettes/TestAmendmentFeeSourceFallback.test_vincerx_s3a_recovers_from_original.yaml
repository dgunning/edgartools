        in respect of a covenant or provision of the indenture that cannot be modified
        or amended without the\nconsent of the holder of each outstanding debt security
        of each series affected. </P></TD></TR></TABLE> <P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Concerning
        the Trustee </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">The indenture provides that
        there may be more than one trustee under the indenture, each for one or more
        series of debt securities. If there\nare different trustees for different
        series of debt securities, each trustee will be a trustee of a trust under
        the indenture separate and apart from the trust administered by any other
        trustee under that indenture. Except as otherwise indicated in\nthis prospectus
        or any prospectus supplement, any action permitted to be taken by a trustee
        may be taken by such trustee only on the one or more series of debt securities
        for which it is the trustee under the indenture. Any trustee under the\nindenture
        may resign or be removed from one or more series of debt securities. All payments
        of principal of, and any premium and interest on, and all registration, transfer,
        exchange, authentication and delivery of, the debt securities of a series\nwill
        be effected by the trustee for that series at an office designated by the
        trustee in New York, New York. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The indenture
        provides\nthat, except during the continuance of an event of default, the
        trustee will perform&nbsp;only such duties as are specifically set forth in
        the indenture. During the existence of an event of default, the trustee will
        exercise those rights and powers\nvested in it under the indenture and use
        the same degree of care and skill in its exercise as a prudent person would
        exercise under the circumstances in the conduct of such person&#146;s own
        affairs. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">If the trustee becomes a creditor
        of ours, the indenture places limitations on the right of the trustee to obtain
        payment of claims or to\nrealize on property received in respect of any such
        claim as security or otherwise. The trustee may engage in other transactions.
        If it acquires any conflicting interest relating to any duties concerning
        the debt securities, however, it must\neliminate the conflict or resign as
        trustee. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><B>No Individual Liability of Incorporators,
        Stockholders, Officers or Directors </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The indenture
        provides that no past, present or future director, officer, stockholder or
        employee of ours, any of our affiliates, or any\nsuccessor corporation, in
        their capacity as such, shall have any individual liability for any of our
        obligations, covenants or agreements under the debt securities or the indenture.
        </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">11 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\" style=\"font-size:10pt;font-weight:bold\"><a
        href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\"
        align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><B>Governing Law </B></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">The
        indenture and the debt securities will be governed by, and construed in accordance
        with, the laws of the State of New York. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">12 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
        style=\"font-size:10pt;font-weight:bold\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B><A NAME=\"toc921557_7\"></A>DESCRIPTION
        OF CAPITAL STOCK </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">This section
        describes the general terms and provisions of the shares of our common stock,
        $0.0001 par value per share, and preferred stock,\n$0.0001 par value per share.
        This description is only a summary. Our second amended and restated certificate
        of incorporation, or Certificate of Incorporation, and our amended and restated
        bylaws, or Bylaws, have been filed as exhibits to our\nperiodic reports filed
        with the SEC, which are incorporated by reference in this prospectus. You
        should read our Certificate of Incorporation and our Bylaws for additional
        information before you buy any of our common stock, preferred stock or other\nsecurities.
        See &#147;Where You Can Find More Information.&#148; </P> <P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Authorized
        and Outstanding Stock </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our Certificate
        of Incorporation authorizes the issuance of 120,000,000 shares of common stock,
        $0.0001 par value per share, and 30,000,000\nshares of undesignated preferred
        stock, $0.0001 par value per share. As of December&nbsp;31, 2024, there were
        44,791,609 shares of common stock and no shares of preferred stock outstanding.
        The outstanding shares of common stock are duly authorized,\nvalidly issued,
        fully paid and <FONT STYLE=\"white-space:nowrap\">non-assessable.</FONT></P>
        <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>Common Stock </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B><I>Voting Power </I></B></P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Except as otherwise\nrequired by law or as otherwise
        provided in any certificate of designation for any series of preferred stock,
        the holders of common stock possess all voting power for the election of our
        directors and all other matters requiring stockholder action.\nHolders of
        common stock are entitled to one vote per share on matters to be voted on
        by stockholders. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><B><I>Dividends </I></B></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Holders
        of common stock will be entitled to receive such dividends, if any, as may
        be declared from time to time by our board of directors in\nits discretion
        out of funds legally available therefor. </P> <P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B><I>Liquidation,
        Dissolution and Winding Up </I></B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">In the event
        of our voluntary or involuntary liquidation, dissolution, distribution of
        assets or\n<FONT STYLE=\"white-space:nowrap\">winding-up,</FONT> the holders
        of the common stock will be entitled to receive an equal amount per share
        of all of our assets of whatever kind available for distribution to stockholders,
        after the rights of the\nholders of any preferred stock have been satisfied.
        </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B><I>Preemptive or Other Rights </I></B></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        stockholders have no preemptive or other subscription rights and there are
        no sinking fund or redemption provisions applicable to common\nstock. </P>
        <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B><I>Election of Directors </I></B></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        board of directors is divided into three classes, each of which will generally
        serve for a term of three years with only one class of\ndirectors being elected
        in each year. There is no cumulative voting with respect to the election of
        directors, with the result that the holders of more than 50% of the shares
        voted for the election of directors can elect all of the directors. </P>\n<P
        STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>Preferred Stock </B></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our Certificate
        of\nIncorporation provides that shares of preferred stock may be issued from
        time to time in one or more series. Our board of directors is authorized to
        fix the voting rights, if any, designations, powers and\n</P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">13 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
        style=\"font-size:10pt;font-weight:bold\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\">\npreferences, the relative,
        participating, optional or other special rights, and any qualifications, limitations
        and restrictions thereof, applicable to the shares of each series of preferred\nstock.
        Our board of directors is able to, without stockholder approval, issue preferred
        stock with voting and other rights that could adversely affect the voting
        power and other rights of the holders of the common stock and could have anti-takeover\neffects.
        The ability of our board of directors to issue preferred stock without stockholder
        approval could have the effect of delaying, deferring or preventing a change
        of control of Vincerx or the removal of existing management. </P>\n<P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Certain
        Anti-Takeover Provisions of Delaware Law and Our Certificate of Incorporation
        and Bylaws </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">These provisions, which are
        summarized below, are expected to discourage certain types of coercive takeover
        practices and inadequate takeover\nbids. These provisions are also designed,
        in part, to encourage persons seeking to acquire control of us to first negotiate
        with our board of directors. We believe that the benefits of increased protection
        of our potential ability to negotiate with\nan unfriendly or unsolicited acquirer
        outweigh the disadvantages of discouraging such proposals, including proposals
        that are priced above the then-current market value of our common stock, because,
        among other reasons, the negotiation of such\nproposals could result in an
        improvement of their terms. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B><I>Special Meetings of Stockholders
        </I></B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">Our Bylaws provide that special
        meetings of our stockholders may be called only by a majority vote of our
        board of directors or our Secretary,\nat the request of our Chairman or the
        Chief Executive Officer. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B><I>Advance Notice Requirements
        for Stockholder Proposals and Director Nominations\n</I></B></P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Pursuant
        to Rule <FONT STYLE=\"white-space:nowrap\">14a-8</FONT> of the Exchange Act,
        proposals seeking inclusion in our annual\nproxy statement must comply with
        the notice periods contained therein. To be timely under our Bylaws, a stockholder&#146;s
        notice will need to be received by the Company secretary at our principal
        executive offices not later than the close of\nbusiness on the 90th day nor
        earlier than the open of business on the 120th day prior the anniversary of
        the date of our proxy statement provided in connection with the previous year&#146;s
        annual meeting of stockholders. Our Bylaws specify certain\nrequirements as
        to the form and content of a stockholders&#146; meeting. These provisions
        may preclude our stockholders from bringing matters before our annual meeting
        of stockholders or from making nominations for directors at our annual meeting
        of\nstockholders. </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><B><I>Authorized but Unissued Shares </I></B></P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Our authorized but unissued common stock and
        preferred stock are available for future issuances without stockholder approval
        and could be\nutilized for a variety of corporate purposes, including future
        offerings to raise additional capital, acquisitions and employee benefit plans.
        Our board of directors is authorized to issue, without stockholder approval,
        blank-check preferred stock\nthat, if issued, could operate as a &#147;poison
        pill&#148; to dilute the stock ownership of a potential hostile acquirer to
        prevent an acquisition that is not approved by the board of directors. The
        existence of authorized but unissued and\nunreserved common stock and preferred
        stock could render more difficult or discourage an attempt to obtain control
        of us by means of a proxy contest, tender offer, merger or otherwise. </P>\n<P
        STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B><I>Exclusive Forum Selection </I></B></P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our\nCertificate
        of Incorporation requires, to the fullest extent permitted by law, that derivative
        actions brought in our name, actions against directors, officers and employees
        for breach of fiduciary duty and other similar actions may be brought in\nthe
        Court of Chancery in the State of Delaware or, if that court lacks subject
        matter jurisdiction, another federal or state court situated in the State
        of Delaware. Any person or entity purchasing or otherwise acquiring any interest
        in shares of\nour capital stock shall be deemed to have notice of and consented
        to the forum provisions in our Certificate of Incorporation. Our Certificate
        of Incorporation also </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ;
        font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\">14 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
        style=\"font-size:10pt;font-weight:bold\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\">\nrequires the federal district
        courts of the United States shall be the exclusive forum for the resolution
        of any complaint asserting a cause of action under the Securities Act of 1933,
        or\nSecurities Act, and the Exchange Act of 1934, or Exchange Act, and the
        stockholder bringing the suit will be deemed to have to service of process
        on such stockholder&#146;s counsel. Although we believe these provisions benefit
        us by providing\nincreased consistency in the application of Delaware law
        in the types of lawsuits to which it applies, a court may determine that these
        provisions are unenforceable, and to the extent they are enforceable, the
        provisions may have the effect of\ndiscouraging lawsuits against our directors
        and officers, although our stockholders will not be deemed to have waived
        our compliance with federal securities laws and the rules and regulations
        thereunder. </P>\n<P STYLE=\"margin-top:18pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><B>Section&nbsp;203 of the Delaware General
        Corporation Law </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">We are subject to the provisions
        of Section&nbsp;203 of the General Corporation Law of the State of Delaware
        regulating corporate takeovers. In\ngeneral, those provisions prohibit a publicly-held
        Delaware corporation from engaging in any business combination with any interested
        stockholder for a period of three years following the date that the stockholder
        became an interested stockholder,\nunless: </P> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">prior to
        the date of the transaction, the board of directors of the corporation approved
        either the business\ncombination or the transaction that resulted in the stockholder
        becoming an interested stockholder; </P></TD></TR></TABLE> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">upon completion
        of the transaction that resulted in the stockholder becoming an interested
        stockholder, the\ninterested stockholder owned at least 85% of the voting
        stock of the corporation outstanding at the time the transaction commenced,
        excluding for purposes of determining the voting stock outstanding (1)&nbsp;shares
        owned by persons who are directors\nand also officers and (2)&nbsp;shares
        owned by employee stock plans in which employee participants do not have the
        right to determine confidentially whether shares held subject to the plan
        will be tendered in a tender or exchange offer; or\n</P></TD></TR></TABLE>
        <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">on or after
        the date the business combination is approved by the board of directors of
        the corporation and\nauthorized at a meeting of stockholders by at least <FONT
        STYLE=\"white-space:nowrap\">two-thirds</FONT> of the outstanding voting stock
        that is not owned by the interested stockholder. </P></TD></TR></TABLE>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Generally, a &#145;&#145;business combination&#146;&#146;
        includes a merger, asset or stock sale, or other transaction resulting in
        a\nfinancial benefit to the &#145;&#145;interested stockholder&#146;&#146;
        and an &#145;&#145;interested stockholder&#146;&#146; is a person who, together
        with affiliates and associates, owns or, within three years prior to the determination
        of\ninterested stockholder status, did own 15% or more of a corporation&#146;s
        outstanding voting stock. We expect the existence of this provision to have
        an anti-takeover effect with respect to transactions our board of directors
        does not approve in\nadvance. We also anticipate that Section&nbsp;203 may
        discourage business combinations or other attempts that might result in a
        premium over the market price for the shares of common stock held by our stockholders.
        A Delaware corporation may opt out\nof these provisions either with an express
        provision in its original certificate of incorporation or in an amendment
        to its certificate of incorporation or bylaws approved by its stockholders.
        However, we have not opted out, and do not currently\nintend to opt out of,
        these provisions. Certain provisions of the DGCL, our Certificate of Incorporation
        and our Bylaws could have the effect of discouraging others from attempting
        hostile takeovers and, as a consequence, they may also inhibit\ntemporary
        fluctuations in the market price of our common stock that often result from
        actual or rumored hostile takeover attempts. These provisions may also have
        the effect of preventing changes in our management. It is possible that these\nprovisions
        could make it more difficult to accomplish transactions that stockholders
        may otherwise deem to be in their best interests. </P> <P STYLE=\"margin-top:18pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>Limitation
        on\nLiability and Indemnification of Directors and Officers </B></P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Our
        Certificate of Incorporation limits our directors&#146; liability to the\nfullest
        extent permitted under the DGCL. The DGCL provides that directors of a corporation
        will not be personally liable for monetary damages for breach of their fiduciary
        duties as directors, except for liability: </P>\n<P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">for any transaction
        from which the director derives an improper personal benefit; </P></TD></TR></TABLE>\n
        <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P
        STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">15 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\" style=\"font-size:10pt;font-weight:bold\"><a
        href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\"
        align=\"left\">\n\n<TABLE STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times
        New Roman; font-size:10pt\" BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\"
        WIDTH=\"100%\">\n<TR style = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD
        WIDTH=\"3%\" VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">for any act
        or omission not in good faith or that involves intentional misconduct or a
        knowing violation of law;\n</P></TD></TR></TABLE> <P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">for any unlawful
        payment of dividends or redemption of shares; or </P></TD></TR></TABLE>\n<P
        STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
        = \"page-break-inside:avoid\">\n<TD WIDTH=\"5%\">&nbsp;</TD>\n<TD WIDTH=\"3%\"
        VALIGN=\"top\" ALIGN=\"left\">&#149;</TD>\n<TD WIDTH=\"1%\" VALIGN=\"top\">&nbsp;</TD>\n<TD
        ALIGN=\"left\" VALIGN=\"top\"> <P ALIGN=\"left\" STYLE=\" margin-top:0pt ;
        margin-bottom:0pt; font-family:Times New Roman; font-size:10pt\">for any breach
        of a director&#146;s duty of loyalty to the corporation or its stockholders.
        Our Certificate of\nIncorporation provides that we will, in certain situations,
        indemnify our directors and officers and may indemnify other employees and
        other agents, to the fullest extent permitted by law. Any indemnified person
        is also entitled, subject to certain\nlimitations, to advancement, direct
        payment, or reimbursement of reasonable expenses (including attorneys&#146;
        fees and disbursements) in advance of the final disposition of the proceeding.
        </P></TD></TR></TABLE>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">In addition, we have entered
        into separate indemnification agreements with our directors and officers.
        These agreements, among other things,\nrequire us to indemnify our directors
        and officers for certain expenses, including attorneys&#146; fees, judgments,
        fines, and settlement amounts incurred by a director or officer in any action
        or proceeding arising out of their services as one of\nour directors or officers
        or any other company or enterprise to which the person provides services at
        our request. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">We maintain a\ndirectors&#146;
        and officers&#146; insurance policy pursuant to which our directors and officers
        are insured against liability for actions taken in their capacities as directors
        and officers. We believe these provisions in our Certificate of\nIncorporation
        and our Bylaws and these indemnification agreements are necessary to attract
        and retain qualified persons as directors and officers. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">Insofar
        as indemnification for liabilities arising under the Securities Act may be
        permitted to directors, officers, or control persons, in\nthe opinion of the
        SEC, such indemnification is against public policy as expressed in the Securities
        Act and is therefore unenforceable </P> <P STYLE=\"margin-top:18pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B>Transfer Agent\nand Registrar
        </B></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The transfer agent and registrar for our common
        stock is Continental Stock Transfer&nbsp;&amp; Trust Company. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">16 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
        style=\"font-size:10pt;font-weight:bold\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B><A NAME=\"toc921557_8\"></A>DESCRIPTION
        OF DEPOSITARY SHARES </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The following
        description of the depositary shares does not purport to be complete and is
        subject to and qualified in its entirety by the\nrelevant deposit agreement
        and the depositary receipts with respect to the depositary shares relating
        to any particular series of preferred stock. You should read these documents
        as they, and not this description, will define your rights as a holder\nof
        depositary shares. Forms of these documents will be filed with the SEC in
        connection with the offering of depositary shares. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><B>General
        </B></P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">If we elect to offer fractional interests in
        shares of preferred stock, we will provide for the issuance by a depositary
        to the public of\nreceipts for depositary shares. Each depositary share will
        represent fractional interests of preferred stock. We will deposit the shares
        of preferred stock underlying the depositary shares under a deposit agreement
        between us and a bank or trust\ncompany selected by us. The bank or trust
        company must have its principal office in the United States and a combined
        capital and surplus of at least $50&nbsp;million. The depositary receipts
        will evidence the depositary shares issued under the\ndeposit agreement. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The deposit agreement will contain terms applicable
        to the holders of depositary shares in addition to the terms\nstated in the
        depositary receipts. Each owner of depositary shares will be entitled to all
        the rights and preferences of the preferred stock underlying the depositary
        shares in proportion to the applicable fractional interest in the underlying\nshares
        of preferred stock. The depositary will issue the depositary receipts to individuals
        purchasing the fractional interests in shares of the related preferred stock
        according to the terms of the offering described in a prospectus supplement.\n</P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\"><B>Dividends and Other Distributions </B></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">The
        depositary will distribute all cash dividends or other cash distributions
        received for the preferred stock to the entitled record holders\nof depositary
        shares in proportion to the number of depositary shares that the holder owns
        on the relevant record date. The depositary will distribute only an amount
        that can be distributed without attributing to any holder of depositary shares
        a\nfraction of one cent. The depositary will add the undistributed balance
        to and treat it as part of the next sum received by the depositary for distribution
        to holders of depositary shares. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">If there is
        a <FONT STYLE=\"white-space:nowrap\">non-cash</FONT> distribution, the depositary
        will distribute property received by it to the\nentitled record holders of
        depositary shares, in proportion, insofar as possible, to the number of depositary
        shares owned by the holders, unless the depositary determines, after consultation
        with us, that it is not feasible to make such\ndistribution. If this occurs,
        the depositary may, with our approval, sell such property and distribute the
        net proceeds from the sale to the holders. The deposit agreement also will
        contain provisions relating to how any subscription or similar\nrights that
        we may offer to holders of the preferred stock will be available to the holders
        of the depositary shares. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B>Conversion, Exchange, Redemption\nand
        Liquidation </B></P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">If any series of preferred stock
        underlying the depositary shares may be converted or exchanged, each record
        holder of\ndepositary receipts will have the right or obligation to convert
        or exchange the depositary shares represented by the depositary receipts.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The terms on which the depositary shares relating
        to the preferred stock of any series may be redeemed, and any amounts distributable
        upon our\nliquidation, dissolution or winding up, will be described in the
        relevant prospectus supplement. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><B>Voting </B></P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">When
        the depositary receives notice of a meeting at which the holders of the preferred
        stock are entitled to vote, the depositary will mail the\nparticulars of the
        meeting to the record holders of the depositary shares. Each </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">17 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
        style=\"font-size:10pt;font-weight:bold\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\">\nrecord holder of depositary
        shares on the record date may instruct the depositary on how to vote the shares
        of preferred stock underlying the holder&#146;s depositary shares. The depositary
        will\ntry, if practical, to vote the number of shares of preferred stock underlying
        the depositary shares according to the instructions. We will agree to take
        all reasonable action requested by the depositary to enable it to vote as
        instructed. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><B>Amendments </B></P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">We
        and the depositary may\nagree to amend the deposit agreement and the depositary
        receipt evidencing the depositary shares. Any amendment that (a)&nbsp;imposes
        or increases certain fees, taxes or other charges payable by the holders of
        the depositary shares as described in\nthe deposit agreement or that (b)&nbsp;otherwise
        prejudices any substantial existing right of holders of depositary shares,
        will not take effect until 30&nbsp;days after the depositary has mailed notice
        of the amendment to the record holders of\ndepositary shares. Any holder of
        depositary shares that continues to hold its shares at the end of the <FONT
        STYLE=\"white-space:nowrap\">30-day</FONT> period will be deemed to have agreed
        to the amendment. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\"><B>Termination </B></P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">We
        may direct the depositary\nto terminate the deposit agreement by mailing a
        notice of termination to holders of depositary shares at least 30&nbsp;days
        prior to termination. In addition, a deposit agreement will automatically
        terminate if: </P>\n<P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
