        page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\"
        ALIGN=\"CENTER\">\n<h5 align=\"left\" style=\"font-size:10pt;font-weight:bold\"><a
        href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV STYLE=\"width:8.5in\"
        align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B><A NAME=\"toc921557_1\"></A>ABOUT
        THIS PROSPECTUS </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">This prospectus is part of a
        registration statement that we filed with the Securities and Exchange Commission,
        or SEC, using a\n&#147;shelf&#148; registration, or continuous offering, process.
        Under this shelf registration process, we may, from time to time, offer and
        sell separately or together in any combination the securities described in
        this prospectus in one or more\nofferings up to a maximum aggregate offering
        price of $100,000,000. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">This prospectus
        provides you with a general description of the\nsecurities we may offer. Each
        time we sell securities, we will provide a prospectus supplement that will
        contain specific information about the terms of that offering and the offered
        securities. We may also authorize one or more free writing\nprospectuses to
        be provided to you that may contain material information relating to these
        offerings. Any prospectus supplement or free writing prospectus, or information
        incorporated by reference in this prospectus or any prospectus supplement,
        may\nalso add to, update or change information contained in this prospectus.
        Any statement that we make in this prospectus will be modified or superseded
        by any inconsistent statement made by us in a prospectus supplement or free
        writing prospectus. The\nregistration statement we filed with the SEC includes
        exhibits that provide more detail of the matters discussed in this prospectus.
        You should read carefully this prospectus and the related exhibits filed with
        the SEC and any prospectus supplement,\ntogether with additional information
        described under the heading &#147;Where You Can Find More Information&#148;
        and any related free writing prospectus, before making your investment decision.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Unless the context otherwise requires, references
        in this prospectus to the &#147;Company,&#148; &#147;Vincerx Pharma,&#148;\n&#147;Vincerx,&#148;
        &#147;we,&#148; &#147;us&#148; and &#147;our&#148; refer to Vincerx Pharma,
        Inc. (f/k/a Vincera Pharma, Inc. f/k/a LifeSci Acquisition Corp.) and its
        consolidated subsidiaries. References to &#147;LSAC&#148; refer to our\npredecessor
        company prior to the consummation of the business combination with VNRX Corp.
        (f/k/a Vincera Pharma, Inc.), a Delaware corporation, prior to the closing
        of the business combination, or Vincera Pharma. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">1 </P>\n\n</DIV></Center>\n\n\n<p
