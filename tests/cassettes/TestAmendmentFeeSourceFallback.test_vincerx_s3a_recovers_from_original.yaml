        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">8 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n<h5 align=\"left\"
        style=\"font-size:10pt;font-weight:bold\"><a href=\"#toc\">Table of Contents</a></h5>\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The indenture
        provides that if an event of default specified in the first, second, third,\nfourth
        or sixth bullets above occurs and is continuing, either the trustee or the
        holders of at least 25% in aggregate principal amount of the outstanding debt
        securities of that series&nbsp;may&nbsp;declare the principal amount of all
        those debt\nsecurities (or, in the case of discount securities or indexed
        securities, that portion of the principal amount as may&nbsp;be specified
        in the terms of that series) to be due and payable immediately. If an event
        of default specified in the fifth\nbullet above occurs and is continuing,
        then the principal amount of all those debt securities (or, in the case of
        discount securities or indexed securities, that portion of the principal amount
        as may&nbsp;be specified in the terms of that series)\nwill be due and payable
        immediately, without any declaration or other act on the part&nbsp;of the
        trustee or any holder. In certain cases, holders of a majority in principal
        amount of the outstanding debt securities of any series&nbsp;may, on behalf\nof
        holders of all those debt securities, rescind and annul a declaration of acceleration.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The indenture imposes limitations on suits\nbrought
        by holders of debt securities against us. Except for actions for payment of
        overdue principal or interest, no holder of debt securities of any series
        may institute any action against us under the indenture unless: </P>\n<P STYLE=\"font-size:6pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P>\n<TABLE
        STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman; font-size:10pt\"
        BORDER=\"0\" CELLPADDING=\"0\" CELLSPACING=\"0\" WIDTH=\"100%\">\n<TR style
