        STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">iv </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">INDENTURE, dated as of&#8195;&#8195;&#8195;&#8195;,
        20 , between Vincerx Pharma, Inc., a\nDelaware corporation (the &#147;<B><I>Company</I></B>&#148;),
        and [TRUSTEE] (the &#147;<B><I>Trustee</I></B>&#148;). </P>\n<P STYLE=\"margin-top:24pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">R<SMALL>ECITALS</SMALL>
        O<SMALL>F</SMALL> T<SMALL>HE</SMALL> C<SMALL>OMPANY</SMALL> </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">The
        Company has duly authorized the execution and delivery of this Indenture to
        provide for the issuance from time to time of its debt\nsecurities (each,
        a &#147;<B><I>Security</I></B>&#148; or, collectively, the &#147;<B><I>Securities</I></B>&#148;),
        in an unlimited aggregate principal amount to be issued in one or more series
        as in this Indenture provided. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">All things necessary
        to make this Indenture a valid agreement of the Company, in accordance with
        its terms, have been done. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">NOW, THEREFORE,
        THIS INDENTURE WITNESSETH: </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">For and in consideration
        of the premises and the purchase of the Securities by the Holders thereof,
        it is mutually covenanted and agreed, for\nthe equal and proportionate benefit
        of all Holders of the Securities or of any series thereof, as follows: </P>
        <P STYLE=\"margin-top:24pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\"><B>ARTICLE ONE </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>DEFINITIONS
        AND OTHER PROVISIONS OF GENERAL APPLICATION </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        101. <I>Definitions</I>. For all purposes of this Indenture, except as otherwise
        expressly provided or unless the context otherwise\nrequires; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(1)
        the terms defined in this Article have the meanings assigned to them in this
        Article and include the plural as well as the\nsingular; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(2)
        all other terms used herein that are defined in the Trust Indenture Act, either
        directly or by reference therein, have the\nmeanings assigned to them therein;
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(3) all accounting terms not otherwise defined
        herein have the meanings assigned to them in accordance\nwith GAAP; </P> <P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(4) the word &#147;or&#148; is not exclusive;
        and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(5) the words &#147;herein&#148;, &#147;hereof&#148;
        and &#147;hereunder&#148; and other words of similar import refer to this
        Indenture as a\nwhole and not to any particular Article, Section or other
        subdivision. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">Certain terms, used principally
        in Article Six, are defined in\nthat Article. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Act</I></B>&#148;,
        when used with respect to any Holder, has the meaning specified in Section&nbsp;104.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Affiliate</I></B>&#148; means, with
        respect to any specified Person, any other Person directly or indirectly controlling
        or\ncontrolled by or under direct or indirect common control with such specified
        Person. For the purposes of this definition, &#147;control&#148; when used
        with respect to any specified Person means the power to direct the management
        and policies of\nsuch Person, directly or indirectly, whether through the
        ownership of voting securities, by contract or otherwise; and the terms &#147;controlling&#148;
        and &#147;controlled&#148; have meanings correlative to the foregoing. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Applicable Procedures</I></B>&#148;
        means, with respect to a Depositary, as to any matter at any time, the policies
        and procedures\nof such Depositary, if any, that are applicable to such matter
        at such time. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Authenticating Agent</I></B>&#148;
        means any\nPerson authorized by the Trustee pursuant to Section&nbsp;614 to
        act on behalf of the Trustee to authenticate Securities of one or more series.
        </P>\n</DIV></Center>\n\n\n<p style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\">
        </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Bankruptcy
        Law</I></B>&#148; means Title 11, U.S. Code, or any similar federal\nor<I>
        </I>state law for the relief of debtors. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Board
        of Directors</I></B>&#148; means, with respect to any Person, either the\nboard
        of directors (or similar governing body) of such Person or any duly authorized
        committee thereof. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Board\nResolution</I></B>&#148;
        means, with respect to any Person, a copy of a resolution certified by the
        Secretary or an Assistant Secretary of such Person to have been duly adopted
        by the Board of Directors of such Person and to be in full force and\neffect
        on the date of such certification, and delivered to the Trustee. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Business
        Day</I></B>&#148;, when used with respect to\nany Place of Payment or any
        other particular location specified in the Securities or this Indenture, means
        each Monday, Tuesday, Wednesday, Thursday and Friday that is not a day on
        which banking institutions in that Place of Payment, such other\nlocation
        or the city in which the Corporate Trust Office of the Trustee is located,
        are authorized or obligated by law or executive order to close, except as
        may be otherwise specified as contemplated by Section&nbsp;301(b). </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Commission</I></B>&#148; means the
        United States Securities and Exchange Commission, as from time to time constituted,
        created\nunder the Exchange Act, or, if at any time after the execution of
        this Indenture such Commission is not existing and performing the duties now
        assigned to it under the Trust Indenture Act, then the body performing such
        duties at such time. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Company</I></B>&#148;
        means the Person named as the &#147;Company&#148; in the first paragraph of
        this instrument until a\nsuccessor Person has become such pursuant to the
        applicable provisions of this Indenture, and thereafter &#147;Company&#148;
        shall mean such successor Person. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Company
        Request</I></B>&#148; or &#147;<B><I>Company Order</I></B>&#148; means a written
        request or order signed in the name of\nthe Company by an Officer and delivered
        to the Trustee. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Corporate Trust
        Office</I></B>&#148; means the office of the Trustee\nat which at any particular
        time its corporate trust business related to this Indenture shall be principally
        administered and which at the date hereof is located at [&#9679;]. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Custodian</I></B>&#148; means any
        receiver, trustee, assignee, liquidator or similar official under any Bankruptcy
        Law. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Defaulted Interest</I></B>&#148;
        has the meaning specified in Section&nbsp;307. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Depositary</I></B>&#148;
        means, with respect to the Securities of any series issuable or issued in
        the form of a Global Security,\nthe Person designated as Depositary by the
        Company in Section&nbsp;301(b) until a successor Depositary shall have become
        such pursuant to the applicable provisions of this Indenture, and thereafter
        &#147;Depositary&#148; shall mean or include each\nPerson who is then a Depositary
        hereunder, and if at any time there is more than one such Person, &#147;Depositary&#148;
        as used with respect to the Securities of any such series shall mean the Depositary
        with respect to the Securities of that\nseries. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Dollar</I></B>&#148;
        or &#147;<B><I>$</I></B>&#148; means a dollar or other equivalent unit in
        such coin or currency\nof the United States of America that is legal tender
        for the payment of public and private debts at the time of payment. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Eligible Obligations</I></B>&#148;
        means U.S. Government Obligations<I>.</I> </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Event
        of Default</I></B>&#148; has the meaning specified in Section&nbsp;501. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Exchange Act</I></B>&#148; means
        the United States Securities Exchange Act of 1934 and any statute successor
        thereto, in each case\nas amended from time to time. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">2 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>GAAP</I></B>&#148;
        means generally accepted accounting principles in the United\nStates at the
        date of any computation required or permitted hereunder or, at the election
        of the Company with respect to Securities of a series, at the date of the
        execution and delivery of this Indenture </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Global
        Security</I></B>&#148; means a Security, if any, evidencing all or a part
        of a series of Securities established in\naccordance with Section&nbsp;301.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Hedging Obligations</I></B>&#148;
        means, with respect to any Person, the obligations of\nsuch Person under (i)&nbsp;interest
        rate swap agreements, interest rate cap agreements and interest rate collar
        agreements and (ii)&nbsp;other agreements or arrangements designed to protect
        such Person against fluctuations in interest rates. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Holder</I></B>&#148;
        means, with respect to a Security, a Person in whose name such Security is
        registered in the Security\nRegister.<I> </I> </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Indenture</I></B>&#148;
        means this instrument as originally executed and as it may from time to time
        be\nsupplemented or amended by one or more indentures supplemental hereto
        entered into pursuant to the applicable provisions hereof and shall include
        the form and terms of particular series of Securities established as contemplated
        by Section&nbsp;301.\n</P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Indexed
        Security</I></B>&#148; means a Security the terms of which provide that the
        principal amount thereof payable at\nStated Maturity may be more or less than
        the principal face amount thereof at original issuance. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>interest</I></B>&#148;\nmeans,
        when used with respect to an Original Issue Discount Security that by its
        terms bears interest only after Maturity, interest payable after Maturity.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Interest Payment Date</I></B>&#148;
        means, when used with respect to any Security, the Stated Maturity of an installment
        of\ninterest on such Security. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Maturity</I></B>&#148;
        means, when used with respect to any Security, the date on which the\nprincipal
        of such Security or an installment of principal becomes due and payable as
        therein or herein provided, whether at the Stated Maturity or by declaration
        of acceleration, call for redemption or otherwise. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Officer</I></B>&#148;
        means the Chief Executive Officer, the President, any Vice President (whether
        or not designated by a number\nor numbers or word or words added before or
        after the title &#147;Vice President&#148;), the Chief Financial Officer,
        the Treasurer, the Secretary, any Assistant Treasurer or any Assistant Secretary
        of the Company. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Officer&#146;s Certificate</I></B>&#148;
        means a certificate signed by an Officer and delivered to the Trustee. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Opinion of Counsel</I></B>&#148;
        means a written opinion of counsel, who may be an employee of, or counsel
        for, the Company or an\nAffiliate of the Company, and who shall be reasonably
        acceptable to the Trustee. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Original
        Issue Discount\nSecurity</I></B>&#148; means any Security that provides for
        an amount less than the principal amount thereof to be due and payable upon
        a declaration of acceleration of the Maturity thereof pursuant to Section&nbsp;502.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Outstanding</I></B>&#148; means,
        when used with respect to Securities of any series, as of the date of determination,
        all\nSecurities theretofore authenticated and delivered under this Indenture,
        <I>except</I>: </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(a) Securities
        theretofore\ncancelled by the Trustee or delivered to the Trustee for cancellation;
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(b) Securities or portions thereof
        for whose\npayment or redemption money or Eligible Obligations (or any combination
        of money and Eligible Obligations) in the necessary amount has been theretofore
        deposited with the Trustee or any Paying Agent (other than the Company or
        any other obligor on\nsuch Security) in trust or set aside and segregated
        in trust by the Company or any other obligor on such </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">3 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        margin-left:4%; font-size:10pt; font-family:Times New Roman\">\nSecurity (if
        the Company or any other obligor on such Security acts as its own Paying Agent)
        for the Holders of such Securities; <I>provided, however, </I>that if such
        Securities, or portions\nthereof, are to be redeemed prior to the Stated Maturity
        thereof, notice of such redemption has been duly given pursuant to this Indenture
        or provision therefor satisfactory to the Trustee has been made; </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(c) Securities as to which the
        Company has effected defeasance as provided in Section&nbsp;402; </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(d) Securities that have been
        paid pursuant to Section&nbsp;306 or in exchange for or in lieu of which other
        Securities have\nbeen authenticated and delivered pursuant to this Indenture,
        other than any such Securities in respect of which there have been presented
        to the Trustee proof satisfactory to it and the Company that such Securities
        are held by a bona fide purchaser\nin whose hands such Securities are valid
        obligations of the Company; </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\"><I>provided</I>,<U> </U><I>however</I>,
        that in determining whether the Holders of\nthe requisite principal amount
        of the Outstanding Securities have given, made or taken any request, demand,
        authorization, direction, notice, consent, waiver or other action hereunder
        as of any date, </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(i) Securities
        owned by the Company or any other obligor upon the Securities or any Affiliate
        of the Company or of such other\nobligor (unless the Company, such Affiliate
        or such obligor owns (x)&nbsp;all Securities Outstanding under this Indenture
        or (y)&nbsp;except for the purposes of actions to be taken by Holders of more
        than one series or Tranche voting as a class, all\nOutstanding Securities
        of each such series and each such Tranche, as the case may be, determined
        without regard to this clause) shall be disregarded and deemed not to be Outstanding,
        except that, in determining whether the Trustee shall be protected\nin relying
        upon any such request, demand, authorization, direction, notice, consent or
        waiver, only Securities that the Trustee knows to be so owned shall be so
        disregarded. Securities so owned that have been pledged in good faith may
        be regarded as\nOutstanding if the pledgee establishes to the satisfaction
        of the Trustee the pledgee&#146;s right so to act with respect to such Securities
        and that the pledgee is not the Company or any other obligor upon the Securities
        or any Affiliate of the\nCompany or of such other obligor; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(ii) in determining whether the Holders of the requisite principal
        amount of Securities\nof any series or Tranche have concurred in any direction,
        waiver or consent, the principal amount of Original Issue Discount Securities
        that shall be deemed to be outstanding shall be the amount of the principal
        thereof that would be due and payable\nas of the date of such determination
        upon acceleration of the maturity thereof pursuant to Section&nbsp;502; and
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(iii) in\nthe case of any Security
        the principal of that is payable from time to time without presentment or
        surrender, the principal amount of such Security that shall be deemed to be
        Outstanding at any time for all purposes of this Indenture shall be the\noriginal
        principal amount thereof less the aggregate amount of principal thereof theretofore
        paid. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Paying Agent</I></B>&#148;\nmeans
        any Person, including the Company, authorized by the Company to pay the principal
        of (and premium, if any) or interest on any Securities on behalf of the Company.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Periodic Offering</I></B>&#148;
        means an offering of Securities of a series from time to time any or all of
        the specific terms of\nwhich Securities, including without limitation the
        rate or rates of interest, if any, thereon, the Stated Maturity or Maturities
        thereof and the redemption provisions, if any, with respect thereto, are to
        be determined by the Company or its agents\nfrom time to time subsequent to
        the initial request for the authentication and delivery of such Securities
        by the Trustee, all as contemplated in Sections 301 and 303. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Person</I></B>&#148;
        means any individual, corporation, partnership, joint venture, association,
        limited liability company, joint\nstock company, trust, unincorporated organization
        or government or any agency or political subdivision thereof. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">4 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Place
        of Payment</I></B>&#148; means, when used with respect to the Securities\nof
        any series, or any Tranche thereof, the place or places where the principal
        of (and premium, if any) and interest, if any, on the Securities of that series
        or Tranche are payable as specified as contemplated by Section&nbsp;301(b).
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Predecessor Security</I></B>&#148;
        means, with respect to any particular Security, every previous Security evidencing
        all or a\nportion of the same debt as that evidenced by such particular Security,
        and, for the purposes of this definition, any Security authenticated and delivered
        under Section&nbsp;306 in exchange for or in lieu of a mutilated, destroyed,
        lost or stolen\nSecurity shall be deemed to evidence the same debt as the
        mutilated, destroyed, lost or stolen Security. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Redemption\nDate</I></B>&#148;
        means, when used with respect to any Security to be redeemed, the date fixed
        for such redemption by or pursuant to this Indenture. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Redemption
        Price</I></B>&#148; means, when used with respect to any Security to be redeemed,
        the price at which it is to be\nredeemed pursuant to this Indenture, exclusive
        of accrued and unpaid interest, if any. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Regular
        Record Date</I></B>&#148;\nmeans, for the interest payable on any Interest
        Payment Date on the Securities of any series, the date specified for that
        purpose as contemplated by Section&nbsp;301(b). </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Repayment
        Date</I></B>&#148; means, when used with respect to any Security of any series
        to be repaid or repurchased, the date, if\nany, fixed for such repayment or
        for such repurchase (whether at the option of the Holders or otherwise) pursuant
        to this Indenture. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Repayment Price</I></B>&#148;
        means, when used with respect to any Security of any series to be repaid,
        the price, if any, at\nwhich it is to be repaid pursuant to Section&nbsp;301(b).
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Responsible Officer</I></B>&#148;
        means, when used with respect to\nthe Trustee, any officer within the corporate
        trust department of the Trustee having responsibility for administration of
        this Indenture, including any vice president, assistant vice president, assistant
        secretary or any other officer of the Trustee\ncustomarily performing functions
        similar to those performed by any of the above designated officers and also
        means, with respect to a particular corporate trust matter, any other officer
        of the Trustee to whom such matter is referred because of his\nor her knowledge
        of and familiarity with the particular subject. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Securities
        Act</I></B>&#148; means the United States\nSecurities Act of 1933 and any
        statute successor thereto, in each case as amended from time to time. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Security</I></B>&#148;\nor &#147;<B><I>Securities</I></B>&#148;
        has the meaning stated in the first recital of this Indenture and, more particularly,
        means any Security or Securities authenticated and delivered under this Indenture.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Security Register</I></B>&#148;
        and &#147;<B><I>Security Registrar</I></B>&#148; have the respective meanings
        specified in\nSection&nbsp;305. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>series</I></B>&#148;
        or &#147;<B><I>series of Securities</I></B>&#148; means a series of Securities
        issued\nunder this Indenture as determined by Board Resolution or as otherwise
        determined under this Indenture. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Special
        Record\nDate</I></B>&#148; means, for the payment of any Defaulted Interest,
        a date fixed by the Company pursuant to Section&nbsp;307. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Stated
        Maturity</I></B>&#148; means, when used with respect to a Security of a particular
        series or any installment of principal\nthereof or interest thereon, the date
        specified in such Security or in a Board Resolution or in an indenture supplemental
        hereto with respect to such series as the fixed date on which the principal
        of such Security or such installment of principal\nor interest is due and
        payable. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">5 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">&#147;<B><I>Subsidiary</I></B>&#148; means,
        with respect to any Person, (a)&nbsp;any\ncorporation, association or other
        business entity of which more than 50% of the outstanding total voting power
        ordinarily entitled (without regard to the occurrence of any contingency)
        to vote in the election of directors, managers, trustees or\nother voting
        members of the governing body thereof is at the time owned or controlled,
        directly or indirectly, by the Company or by one or more other Subsidiaries,
        or by the Company and one or more other Subsidiaries or (b)&nbsp;any partnership
        the\nsole general partner or the managing general partner of which is the
        Company or a Subsidiary of the Company or the only general partners of which
        are the Company or of one or more Subsidiaries of the Company (or any combination
        thereof). </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Tranche</I></B>&#148;
        means a group of Securities which (a)&nbsp;are of the same series and (b)&nbsp;have
        identical terms to other\nTranches of such series except as to principal amount,
        date of issuance or first interest payment date, each of which may vary among
        Tranches of any one series. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Trustee</I></B>&#148;
        means the Person named as the &#147;Trustee&#148; in the first paragraph of
        this instrument until a\nsuccessor Trustee shall have been appointed with
        respect to one or more series of Securities pursuant to the applicable provisions
        of this Indenture, and thereafter &#147;Trustee&#148; shall mean or include
        each Person who is then a Trustee\nhereunder, and if at any time there is
        more than one such Person, &#147;Trustee&#148; as used with respect to the
        Securities of any series shall mean the Trustee with respect to Securities
        of that series. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Trust Indenture
        Act</I></B>&#148; means the United States Trust Indenture Act of 1939 as in
        force at the date as of which this\ninstrument was executed, except as provided
        in Section&nbsp;905. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">&#147;<B><I>U.S. Government
        Obligations</I></B>&#148; means (x)&nbsp;any\nsecurity that is (i)&nbsp;a
        direct obligation of the United States of America for the payment of which
        the full faith and credit of the United States of America are pledged or (ii)&nbsp;an
        obligation of a Person controlled or supervised by and\nacting as an agency
        or instrumentality of the United States of America the payment of which is
        unconditionally guaranteed as a full faith and credit obligation by the United
        States of America, and in either case is not callable or redeemable at the\noption
        of the issuer thereof at any time prior to the stated maturity of the applicable
        series of Securities, and (y)&nbsp;any depositary receipt issued by a bank
        (as defined in Section&nbsp;3(a)(2) of the Securities Act) as custodian with
        respect\nto any U.S. Government Obligation that is specified in clause&nbsp;(x)
        above and held by such bank for the account of the holder of such depositary
        receipt, or with respect to any specific payment of principal of or interest
        on any U.S. Government\nObligation which is so specified and held, <I>provided</I>
        that (except as required by law) such custodian is not authorized to make
        any deduction from the amount payable to the holder of such depositary receipt
        from any amount received by the\ncustodian in respect of the U.S.&nbsp;Government
        Obligation or the specific payment of principal of or interest on the U.S.
        Government Obligation evidenced by such depositary receipt. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">&#147;<B><I>Vice
        President</I></B>&#148; means, when used with respect to the Company or the
        Trustee, any vice president, whether or not\ndesignated by a number or a word
        or words added before or after the title &#147;vice president&#148;. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 102. <I>Compliance\nCertificates and
        Opinions</I>. (a) Except as otherwise expressly provided in this Indenture,
        upon any application or request by the Company to the Trustee to take any
        action under any provision of this Indenture, the Company shall, if requested
        by\nthe Trustee, furnish to the Trustee an Officer&#146;s Certificate stating
        that all conditions precedent, if any, provided for in this Indenture relating
        to the proposed action have been complied with and an Opinion of Counsel stating
        that in the\nopinion of such counsel all such conditions precedent, if any,
        have been complied with, except that in the case of any such application or
        request as to which the furnishing of such documents is specifically required
        by any provision of this\nIndenture relating to such particular application
        or request, no additional certificate or opinion need be furnished. </P> <P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(b) Every\ncertificate or opinion with respect
        to compliance with a condition or covenant provided for in this Indenture
        (except for certificates provided for in Section&nbsp;1004) shall include:
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(1) a statement that each individual
        signing such certificate or opinion has read such covenant or condition and
        the\ndefinitions herein relating thereto; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(2) a brief statement as to the nature and scope of the examination
        or investigation\nupon which the statements or opinions contained in such
        certificate or opinion are based; </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">6 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(3)
        a statement that, in the opinion of each such individual, such\nindividual
        has made such examination or investigation as is necessary to enable such
        individual to express an informed opinion as to whether or not such covenant
        or condition has been complied with; and </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(4) a statement as to whether, in the opinion of each such individual,
        such condition or covenant has been complied with. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        103. <I>Form of Documents Delivered to Trustee</I>. (a) In any case where
        several matters are required to be certified by, or covered\nby an opinion
        of, any specified Person, it is not necessary that all such matters be certified
        by, or covered by the opinion of, only one such Person, or that they be so
        certified or covered by only one document, but one such Person may certify
        or\ngive an opinion with respect to some matters and one or more other such
        Persons as to other matters, and any such Person may certify or give an opinion
        as to such matters in one or several documents. </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b)
        Any certificate, statement or opinion of an Officer may be based, insofar
        as it relates to legal matters, upon a certificate or an Opinion\nof Counsel,
        or representations by counsel. Any such certificate, statement or Opinion
        of Counsel may be based, insofar as it relates to factual matters, upon a
        certificate, statement or opinion of, or representations by, an Officer or
        Officers\nstating that the information with respect to such factual matters
        is in the possession of the Company. Any certificate, statement or opinion
        of an Officer or of counsel may be based, insofar as it relates to accounting
        matters, upon a certificate,\nstatement or opinion of, or representations
        by, an accountant or firm of accountants in the employ of the Company. Any
        certificate, statement or opinion of, or representations by, any independent
        firm of public accountants filed with the Trustee\nshall contain a statement
        that such firm is independent. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) Where any
        Person is required to make, give or execute two or more\napplications, requests,
        consents, certificates, statements, opinions or other instruments under this
        Indenture, they may, but need not, be consolidated and form one instrument.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 104. <I>Acts of Holders</I>. (a) Any
        request, demand, authorization, direction, notice, consent, waiver or other
        action provided or\npermitted by this Indenture to be made, given or taken
        by Holders may be embodied in and evidenced by one or more instruments of
        substantially similar tenor signed by such Holders in person or by an agent
        duly appointed in writing; and, except as\nherein otherwise expressly provided,
        such action shall become effective when such instrument or instruments are
        delivered to the Trustee and, where it is hereby expressly required, to the
        Company. Such instrument or instruments (and the action\nembodied therein
        and evidenced thereby) are herein sometimes referred to as the &#147;Act&#148;
        of the Holders signing such instrument or instruments. Proof of execution
        of any such instrument or of a writing appointing any such agent shall be\nsufficient
        for any purpose of this Indenture and (subject to Section&nbsp;601) conclusive
        in favor of the Trustee and the Company, if made in the manner provided in
        this Section. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(b) The fact and date of the
        execution by any Person of any such instrument or writing may be proved by
        the affidavit of a witness of such\nexecution or by a certificate of a notary
        public or other officer authorized by law to take acknowledgments of deeds,
        certifying that the individual signing such instrument or writing acknowledged
        to him the execution thereof. Where such execution\nis by a signer acting
        in a capacity other than his individual capacity, such certificate or affidavit
        shall also constitute sufficient proof of his authority. The fact and date
        of the execution of any such instrument or writing, or the authority of\nthe
        Person executing the same, may also be proved in any other manner acceptable
        to the Trustee. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(c) The principal amount (except
        as\notherwise contemplated in clause (ii)&nbsp;of the proviso to the definition
        of &#147;Outstanding&#148;) and serial numbers of Securities held by any Person,
        and the date of holding the same, shall be proved by the Security Register.
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(d) Any request, demand, authorization, direction,
        notice, consent, election, waiver or other Act of the Holder of any Security
        shall bind\nevery future Holder of the same Security and the Holder of every
        Security issued upon the registration of transfer thereof or in exchange therefor
        or in lieu thereof in respect of anything done, omitted or suffered to be
        done by the Trustee or the\nCompany in reliance thereon, whether or not notation
        of such action is made upon such Security. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">7 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(e) The Company
        may set a record date for purposes of determining the identity of Holders
        of\nany Outstanding Securities of any series entitled to vote or consent to
        any action by vote or consent authorized or permitted by Section&nbsp;512
        or 513. Such record date shall be not less than 10 nor more than 60 days prior
        to the first\nsolicitation of such consent or the date of the most recent
        list of Holders of such Securities furnished to the Trustee pursuant to Section&nbsp;701
        prior to such solicitation. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(f) If the Company
        solicits from Holders any request, demand, authorization, direction, notice,
        consent, election, waiver or other Act, the\nCompany may, at its option, fix
        in advance a record date for the determination of Holders entitled to give
        such request, demand, authorization, direction, notice, consent, election,
        waiver or other Act, but the Company shall have no obligation to do\nso. If
        such a record date is fixed, such request, demand, authorization, direction,
        notice, consent, election, waiver or other Act may be given before or after
        such record date, but only the Holders of record at the close of business
        on the record\ndate shall be deemed to be Holders for the purposes of determining
        whether Holders of the requisite proportion of the Outstanding Securities
        have authorized or agreed or consented to such request, demand, authorization,
        direction, notice, consent,\nelection, waiver or other Act, and for that purpose
        the Outstanding Securities shall be computed as of the record date. </P> <P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 105.\n<I>Notices, Etc. to Trustee and
        Company</I>. Except as otherwise provided herein, any request, demand, authorization,
        direction, notice, consent, election, waiver or Act of Holders or other document
        provided or permitted by this Indenture to be made\nupon, given or furnished
        to, or filed with, </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(a) the Trustee
        by any Holder or by the Company shall be sufficient for every\npurpose hereunder
        if made, given, furnished or filed in writing (which may be by delivery in
        person, first class mail (registered or certified, return receipt requested),
        facsimile transmission or electronic delivery with receipt confirmed, or\novernight
        courier guaranteeing next day delivery) to or with the Trustee at its Corporate
        Trust Office at the location specified in Section&nbsp;101, or </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(b) the Company by the Trustee or by any Holder shall be sufficient
        for every purpose hereunder (unless otherwise herein\nexpressly provided)
        if given in writing (which may be by delivery in person, first class mail
        (registered or certified, return receipt requested), facsimile transmission
        or electronic delivery with receipt confirmed, or overnight courier\nguaranteeing
        next day delivery) to the Company addressed to it at 1825 S. Grant Street,
        San Mateo, California 94402 , Attention: General Counsel and Chief Legal Officer
        or at such other address furnished in writing to the Trustee by the Company\nprior
        to such mailing. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 106. <I>Notice to Holders;
        Waiver</I>. (a) Except as otherwise expressly provided herein, where this\nIndenture
        provides for notice of any event or reports to Holders, such notice or report
        shall be sufficiently given if in writing and mailed, first-class postage
        prepaid or electronically in accordance with the procedures of the Depositary
        in the\ncase of Global Securities, to each Holder of Securities affected by
        such event, at the address of such Holder as it appears in the Security Register
        and to addresses filed with the Trustee or preserved on the Trustee&#146;s
        list pursuant to\nSection&nbsp;702(a) for other Holders (and to such other
        addressees as may be required in the case of such notice or report under Section&nbsp;313(c)
        of the Trust Indenture Act), not later than the latest date, and not earlier
        than the earliest\ndate, prescribed for the giving of such notice or report.
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(b) In any case where notice to Holders is given
        by mail, neither the failure to\nmail such notice, nor any defect in any notice
        so mailed, to any particular Holder shall affect the sufficiency of such notice
        with respect to other Holders. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) Where this
        Indenture provides for notice in any manner, such notice may be waived in
        writing by the Person entitled to receive such notice,\neither before or after
        the event, and such waiver shall be the equivalent of such notice. Waivers
        of notice by Holders shall be filed with the Trustee, but such filing shall
        not be a condition precedent to the validity of any action taken in\nreliance
        upon such waiver. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(d) Notwithstanding any other
        provision of this Indenture or any Security, where this Indenture or any Security\nprovides
        for notice of any event (including any notice of redemption) to a holder of
        a Global Security (whether by mail or otherwise), such notice shall be sufficiently
        given if given to the Depositary for such Security (or its designee) pursuant
        to\nthe Applicable Procedures of the Depositary. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">8 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 107.
        <I>Conflict With Trust Indenture Act</I>. If any provision hereof limits,\nqualifies
        or conflicts with a provision of the Trust Indenture Act that is required
        under the Trust Indenture Act to be a part of and govern this Indenture, the
        latter provision shall control. If any provision of this Indenture modifies
        or excludes\nany provision of the Trust Indenture Act that may be so modified
        or excluded, the latter provision shall be deemed to apply to this Indenture
        as so modified or to be excluded, as the case may be. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        108. <I>Effect of Headings and Table of Contents</I>. The Article and Section
        headings herein and the Table of Contents are for\nconvenience only and shall
        not affect the construction hereof. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 109.
        <I>Successors and Assigns</I>. All covenants and agreements\nin this Indenture
        by the Company shall bind its successors and assigns, whether so expressed
        or not. All agreements of the Trustee in this Indenture shall bind its successors
        and assigns, whether so expressed or not. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        110. <I>Separability Clause</I>. In case any provision in this Indenture or
        in the Securities is invalid, illegal or unenforceable,\nthe validity, legality
        and enforceability of the remaining provisions shall not in any way be affected
        or impaired thereby. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 111.\n<I>Benefits of
        Indenture</I>. Nothing in this Indenture or in the Securities, express or
        implied, shall give to any Person, other than the parties hereto (including
        any Paying Agent appointed pursuant to Section&nbsp;1002 and Authenticating
        Agent\nappointed pursuant to Section&nbsp;614 to the extent provided herein)
        and their successors hereunder and the Holders, any benefit or any legal or
        equitable right, remedy or claim under this Indenture. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        112. <I>Governing Law</I>. This Indenture and the Securities shall be governed
        by and construed in accordance with the laws of the\nState of New York in
        the United States, but without giving effect to the conflicts of laws principles
        thereof. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 113. <I>Legal\nHolidays</I>.
        In any case where any Interest Payment Date, Redemption Date, Repayment Date
        or Stated Maturity of any Security is not a Business Day at any Place of Payment
        or the city in which the Corporate Trust Office of the Trustee is located,\nthen
        (notwithstanding any other provision of this Indenture or of the Securities,
        other than a provision in Securities of any series, or in the Board Resolution,
        Supplemental Indenture or Officer&#146;s Certificate that establishes the
        terms of such\nSecurities, that specifically states that such provision shall
        apply in lieu of this Section) payment of interest or principal (and premium,
        if any) need not be made at such Place of Payment on such date, but may be
        made on the next succeeding\nBusiness Day at such Place of Payment with the
        same force and effect as if made on the Interest Payment Date or Redemption
        Date, Repayment Date, or at the Stated Maturity, and such extension of time
        shall in such case be (1)&nbsp;excluded in the\ncomputation of interest, if
        any, accruing on such Security at a fixed rate and (2)&nbsp;included in the
        computation of interest, if any, accruing on such Security at a floating rate;
        <I>provided</I>, <I>however</I>, that if such extension would\ncause payment
        of interest at a floating rate to be made in the next following calendar month,
        such payment shall be made on the next preceding Business Day. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        114. <I>Rules by Trustee and Agents</I>. The Trustee may make reasonable rules
        for action by or at a meeting of Holders of one or more\nseries. The Paying
        Agent or Security Registrar may make reasonable rules and set reasonable requirements
        for its functions. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 115.\n<I>No Recourse
        Against Others</I>. No past, present or future director, officer, stockholder
        or employee, as such, of the Company or any of its Affiliates or any successor
        entity shall have any liability for any obligation, covenant or agreement
        of\nthe Company under this Indenture or any indenture supplemental hereto,
        or in the Securities, or for any claim based on, in respect of or by reason
        of such obligations, covenants or agreements or their creation. Each Holder
        by accepting a Security\nwaives and releases all such liability. The waiver
        and release are part of the consideration for the execution and delivery of
        this Indenture and the issue of the Securities. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">9 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 116.
        <I>Counterparts</I>. This Indenture may be executed in any number of\ncounterparts,
        each of which so executed shall be deemed to be an original, but all such
        counterparts shall together constitute but one and the same instrument. The
        exchange of copies of this Indenture and of signature pages by facsimile or
        PDF\ntransmission shall constitute effective execution and delivery of this
        Indenture as to the parties hereto and may be used in lieu of the original
        Indenture for all purposes. Signatures of the parties hereto transmitted by
        facsimile or PDF shall be\ndeemed to be their original signatures for all
        purposes. </P> <P STYLE=\"margin-top:24pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>ARTICLE TWO </B></P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\"><B>SECURITY FORMS </B></P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION\n201.
        <I>Forms Generally</I>. (a) The Securities of each series shall be in substantially
        such form or forms as shall be established by or pursuant to a Board Resolution
        and set forth in an Officer&#146;s Certificate or established in one or more\nindentures
        supplemental hereto, in each case with such appropriate insertions, omissions,
        substitutions and other variations as are required or permitted by this Indenture,
        and may have such letters, numbers or other marks of identification and such\nlegends
        or endorsements placed thereon as may be required to comply with law or with
        any rules or regulations pursuant thereto, or with any rules of any securities
        exchange or Depositary therefor or to conform with general usage, all as may,\nconsistently
        herewith, be determined by the Officer or Officers executing such Securities,
        as evidenced by their execution of such Securities. If the form of Securities
        of any series is established by action taken pursuant to a Board Resolution,
        a\ncopy of an appropriate record of such action shall be delivered to the
        Trustee at or prior to the delivery of the Company Order contemplated by Section&nbsp;303
        for the authentication and delivery of such Securities. If all of the Securities
        of any\nseries established by action taken pursuant to a Board Resolution
        are not to </P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\">be issued at one time, it shall not be necessary
        to deliver a record of such\naction at the time of issuance of each Security
        of such series, but an appropriate record of such action shall be delivered
        at or before the time of issuance of the first Security of such series. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(b) The definitive Securities shall be produced
        in such manner or combination of manners, all as determined by the Officer
        or Officers\nexecuting such Securities, as evidenced by their execution of
        such Securities. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 202. <I>Form of Trustee</I><I>&#146;</I><I>s\nCertificate
        of Authentication</I>. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">The Trustee&#146;s
        certificate of authentication shall be in substantially the following form:
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">This is one of the Securities of the series
        designated herein, referred to in the within-mentioned Indenture. </P>\n<P
        STYLE=\"font-size:12pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P><DIV ALIGN=\"right\">\n<TABLE
        CELLSPACING=\"0\" CELLPADDING=\"0\" WIDTH=\"40%\" BORDER=\"0\" STYLE=\"BORDER-COLLAPSE:COLLAPSE;
        font-family:Times New Roman; font-size:10pt\">\n\n\n<TR>\n\n<TD WIDTH=\"5%\"></TD>\n\n<TD
        VALIGN=\"bottom\" WIDTH=\"1%\"></TD>\n<TD WIDTH=\"94%\"></TD></TR>\n\n\n<TR
        STYLE=\"page-break-inside:avoid ; font-family:Times New Roman; font-size:10pt\">\n<TD
        VALIGN=\"top\" COLSPAN=\"3\">[&#8195;&#8195;&#8195;&#8195; ]</TD></TR>\n<TR
        STYLE=\"page-break-inside:avoid ; font-family:Times New Roman; font-size:10pt\">\n<TD
        VALIGN=\"top\" COLSPAN=\"3\">&#8194;as Trustee</TD></TR>\n<TR STYLE=\"font-size:1pt\">\n<TD
        HEIGHT=\"16\"></TD>\n<TD HEIGHT=\"16\" COLSPAN=\"2\"></TD></TR>\n<TR STYLE=\"page-break-inside:avoid
        ; font-family:Times New Roman; font-size:10pt\">\n<TD VALIGN=\"top\">By</TD>\n<TD
        VALIGN=\"bottom\">&nbsp;</TD>\n<TD VALIGN=\"top\"> <P STYLE=\"margin-top:0pt;
        margin-bottom:1pt; border-bottom:1px solid #000000; font-size:10pt; font-family:Times
        New Roman\">&nbsp;</P></TD></TR>\n<TR STYLE=\"page-break-inside:avoid ; font-family:Times
        New Roman; font-size:10pt\">\n<TD VALIGN=\"top\"></TD>\n<TD VALIGN=\"bottom\">&nbsp;</TD>\n<TD
        VALIGN=\"top\" ALIGN=\"center\">Authorized Officer</TD></TR>\n</TABLE></DIV>
        <P STYLE=\"margin-top:24pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\"><B>ARTICLE THREE </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>THE
        SECURITIES </B></P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION\n301. <I>Amount Unlimited;
        Issuable in Series</I>. (a) The aggregate principal amount of Securities that
        may be authenticated and delivered under this Indenture is unlimited. </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(b) The Securities may be issued in one or more
        series. There shall be established in or pursuant to a Board Resolution, and
        set forth in an\nOfficer&#146;s Certificate, or established in one or more
        indentures supplemental hereto, prior to the issuance of Securities of any
        series, </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">10 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(1) the title of the Securities
        of such series (which shall distinguish the\nSecurities of the series from
        the Securities of any other series); </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(2)
        any limit upon the aggregate principal amount of\nthe Securities of such series
        that may be authenticated and delivered under this Indenture (except for Securities
        authenticated and delivered upon registration of transfer of, or in exchange
        for, or in lieu of, other Securities of such series\npursuant to Section&nbsp;304,
        305, 306, 906, 1107 or 1204 and except for any Securities that, pursuant to
        Section&nbsp;303, are deemed never to have been authenticated and delivered
        hereunder); </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(3) the date
        or dates on which the principal and premium, if any, of the Securities of
        such series, or any Tranche thereof, is\npayable or any formula or other method
        or other means by which such date or dates shall be determined, by reference
        to an index or other fact or event ascertainable outside of this Indenture
        or otherwise (without regard to any provisions for\nredemption, prepayment,
        acceleration, purchase or extension); </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(4)
        the rate or rates at which the Securities of such\nseries, or any Tranche
        thereof, shall bear interest, if any (including the rate or rates at which
        overdue principal shall bear interest, if different from the rate or rates
        at which such Securities shall bear interest prior to Maturity, and, if\napplicable,
        the rate or rates at which overdue premium or interest shall bear interest,
        if any), or any formula or other method or other means by which such rate
        or rates shall be determined, by reference to an index or other fact or event\nascertainable
        outside of this Indenture or otherwise; the date or dates from which such
        interest shall accrue; the Interest Payment Dates on which such interest shall
        be payable and the Regular Record Date, if any, for the interest payable on
        such\nSecurities on any Interest Payment Date; the right of the Company, if
        any, to extend or defer the interest payment periods and the duration of any
        such extension or deferral as contemplated by Section&nbsp;312; and the basis
        of computation of\ninterest, if other than as provided in Section&nbsp;310;
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(5) the place or places where
        the principal of and premium, if\nany, and interest, if any, on Securities
        of such series, or any Tranche thereof, shall be payable, where the Securities
        of such series, or any Tranche thereof, may be surrendered for registration
        of transferor for exchange, and where notices and\ndemands to or upon the
        Company in respect of the Securities of such series, or any Tranche thereof,
        and this Indenture may be served and notices to Holders pursuant to Section&nbsp;106
        will be published; the Security Registrar and any Paying Agent\nor Agents
        for such series or Tranche; and if such is the case, that the principal of
        such Securities shall be payable without presentment or surrender thereof;
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(6) if applicable, the period
        or periods within which, the price or prices at which and the terms and conditions
        upon which\nSecurities of such series, or any Tranche thereof, may be redeemed,
        in whole or in part, at the option of the Company and, if other than by a
        Board Resolution, the manner in which any election by the Company to redeem
        such Securities shall be\nevidenced; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(7)
        the obligation or the right, if any, of the Company to redeem or purchase
        Securities of such series, or any\nTranche thereof, pursuant to any sinking
        fund or analogous provisions or at the option of the Holder thereof and the
        period or periods within which, the price or prices at which and the terms
        and conditions upon which Securities of such series, or\nany Tranche thereof,
        shall be redeemed or purchased, in whole or in part, pursuant to such obligation;
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(8) the terms, if\nany, on which
        the Securities of such series will be subordinate in right and priority of
        payment to other debt of the Company; </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(9)
        the denominations in which any Securities of such series shall be issuable,
        if other than denominations of $1,000 and any\nintegral multiple thereof;
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(10) if other than the principal
        amount thereof, the portion of the principal amount of\nSecurities of such
        series that shall be payable upon declaration of acceleration of the Maturity
        thereof pursuant to Section&nbsp;502; </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">11 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(11)
        if the principal of or any premium or interest on the Securities of\nsuch
        series is to be payable, or is to be payable at the election of the Company
        or a Holder thereof, in securities or other property, the type and amount
        of such securities or other property, or the manner of determining such amount
        shall be\ndetermined, and the period or periods within which, and the terms
        and conditions upon which, any such election may be made; </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(12) the Person to whom any interest on any Security of such series
        shall be payable, if other than the Person in whose name\nthat Security is
        registered at the close of business on the Regular Record Date for such interest,
        and the extent to which, or the manner in which, any interest payable on a
        temporary or permanent Global Security on an interest payment date will be\npaid;
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(13) any addition to or change
        in the Events of Default, with respect to the Securities of such series, and
        any\naddition to or change in the covenants of the Company for the benefit
        of the Holders of the Securities of such series in addition to those set forth
        in Article Ten; </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(14) the terms
        and conditions, if any, pursuant to which the Securities of such series may
        be converted into or exchanged for\nsecurities or other property of the Company
        or any other Person; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(15) the terms
        and conditions, if any, pursuant to which\nthe Company&#146;s obligations
        under this Indenture may be terminated through the deposit of money or Eligible
        Instruments as provided in Article Four; </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(16) any exceptions to Section&nbsp;113, or variation in the definition
        of Business Day, with respect to the Securities of such\nseries; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(17) any collateral security, assurance or guaranty for the Securities
        of such series; </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(18) the <FONT
        STYLE=\"white-space:nowrap\">non-applicability</FONT> of Section&nbsp;608
        to the Securities of such series or any\nexceptions or modifications of Section&nbsp;608
        with respect to the Securities of such series; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(19) any rights or duties\nof another Person to assume the obligations
        of the Company with respect to the Securities of such series (whether as joint
        obligor, primary obligor, secondary obligor or substitute obligor) and any
        rights or duties to discharge and release any\nobligor with respect to the
        Securities of such series or this Indenture to the extent related to such
        series; and </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(20) any\nother
        terms, conditions and rights of such series (which terms, conditions and rights
        shall not be inconsistent with the provisions of this Indenture, except as
        permitted by Section&nbsp;901(a)(4)). </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) All Securities
        of any one series (other than Securities offered in a Periodic Offering) shall
        be substantially identical except as to\ndenomination and except as may otherwise
        be provided in or pursuant to such Board Resolution and set forth in such
        Officer&#146;s Certificate or in any such indenture supplemental hereto and
        as reasonably acceptable to the Trustee. Securities of\ndifferent series may
        differ in any respect. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(d) If the terms
        and form or forms of any series of Securities are established by or pursuant\nto
        a Board Resolution, the Company shall deliver a copy of such Board Resolution
        to the Trustee at or prior to the issuance of such series with (1)&nbsp;the
        form or forms of Security that have been approved attached thereto, or (2)&nbsp;if
        such\nBoard Resolution authorizes a specific officer or officers to approve
        the terms and form or forms of the Securities, a certificate of such officer
        or officers approving the terms and form or forms of Security with such form
        or forms of Securities\nattached thereto. Such Board Resolution or certificate
        may provide general terms or parameters for Securities of any series and may
        provide that the specific terms of particular Securities of a series may be
        determined in accordance with or pursuant\nto the Company Order referred to
        in Section&nbsp;303. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(e) With respect to Securities
        of a series subject to a Periodic Offering, the\nindenture supplemental hereto
        or the Board Resolution that establishes such series, or the Officer&#146;s
        Certificate pursuant to such supplemental indenture or Board Resolution, as
        the case may be, may provide general terms or parameters for\nSecurities of
        such series and provide either that the specific terms of Securities of such
        series shall be specified in a Company Order or that such terms shall be determined
        by the Company or its agents in accordance with procedures specified in a\nCompany
        Order as contemplated by Section&nbsp;303(c). </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">12 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(f) Unless otherwise
        specified with respect to a series of Securities pursuant to paragraph\n(2)&nbsp;of
        Section&nbsp;301(b), such series of Securities may be issued in one or more
        Tranches with various principal amounts without the consent of any Holders
        and additional Tranches of such series may be authenticated and delivered
        pursuant to\nSection&nbsp;303. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 302.
        <I>Denominations</I>. The Securities of each series shall be issuable in registered
        form in such\ndenominations as shall be specified as contemplated by Section&nbsp;301(b).
        In the absence of any such provisions with respect to the Securities of any
        series, the Securities of such series shall be issuable in denominations of
        $1,000 and any\nintegral multiple thereof. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        303. <I>Execution, Authentication, Delivery and Dating</I>. (a) The Securities
        shall be signed on\nbehalf of the Company by an Officer by manual or facsimile
        signature. Typographical and other minor errors or defects in any such signature
        shall not affect the validity or enforceability of any Security that has been
        duly authenticated and\ndelivered by the Trustee. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b)
        Securities bearing the manual or facsimile signatures of individuals who were
        at any time the proper\nofficers of the Company shall bind the Company notwithstanding
        that such individuals or any of them have ceased to hold such offices prior
        to the authentication and delivery of such Securities or did not hold such
        offices at the date of such\nSecurities. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) At any time
        and from time to time after the execution and delivery of this Indenture,
        the Company may deliver Securities\nof any series (or any Tranche thereof)
        executed by the Company to the Trustee for authentication, together with a
        Company Order for the authentication and delivery of such Securities (or such
        Tranche), and the Trustee in accordance with the Company\nOrder shall authenticate
        and deliver such Securities (or such Tranche); <I>provided, however,</I> that
        with respect to Securities of a series subject to a Periodic Offering, (i)&nbsp;such
        Company Order may be delivered by the Company to the Trustee\nprior to the
        delivery to the Trustee of such Securities for authentication and delivery,
        (ii)&nbsp;the Trustee shall authenticate and deliver Securities of such series
        for original issue from time to time, in an aggregate principal amount not\nexceeding
        the aggregate principal amount established for such series, all pursuant to
        a Company Order or pursuant to such procedures acceptable to the Trustee as
        may be specified from time to time by a Company Order, (iii)&nbsp;the maturity
        date or\ndates, original issue date or dates, interest rate or rates and any
        other terms of Securities of such series shall be determined by Company Order
        or pursuant to such procedures and (iv)&nbsp;if provided for in such procedures,
        such Company Order may\nauthorize authentication and delivery pursuant to
        oral or electronic instructions from the Company or its duly authorized agent
        or agents, which oral instructions shall be promptly confirmed in writing.
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(d) In authenticating such Securities and accepting
        the additional responsibilities under this Indenture in relation to such Securities,
        the\nTrustee shall be entitled to receive, and (subject to Section&nbsp;601)
        shall be fully protected in relying upon, an Opinion of Counsel stating: </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:5%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(i) that such form of Securities
        has been established in conformity with the provisions of this Indenture;
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:5%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(ii) that the terms of such
        Securities have been established in conformity with the provisions of this
        Indenture; and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:5%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(iii) that such
        Securities, when authenticated and delivered by the Trustee and issued by
        the Company in the manner and subject\nto any conditions specified in such
        Opinion of Counsel, will constitute valid and legally binding obligations
        of the Company, enforceable in accordance with their terms, subject to customary
        exceptions and qualifications. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">13 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(e) Notwithstanding
        the provisions of Section&nbsp;301 and of the preceding paragraphs of\nSections
        303(c) and 303(d) in connection with a Periodic Offering, if all Securities
        of a series are not to be originally issued at one time, it shall not be necessary
        to deliver an Officer&#146;s Certificate or execute a supplemental indenture\notherwise
        required pursuant to Section&nbsp;301(b) or the Company Order and Opinion
        of Counsel otherwise required pursuant to such preceding paragraphs at or
        prior to the time of authentication of each Security of such series if such
        documents are\ndelivered at or prior to the authentication upon original issuance
        of the first Security of such series to be issued. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(f)
        If such form or\nterms have been so established, the Trustee shall not be
        required to authenticate such Securities if the issuance of such Securities
        pursuant to this Indenture will affect the Trustee&#146;s own rights, duties
        or immunities under the Securities and\nthis Indenture or otherwise in a manner
        that is not reasonably acceptable to the Trustee. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(g)
        No Security shall be entitled to any benefit\nunder this Indenture or be valid
        or obligatory for any purpose unless there appears on such Security a certificate
        of authentication substantially in the form provided for herein executed by
        the Trustee by manual or facsimile signature, and such\ncertificate upon any
        Security shall be conclusive evidence, and the only evidence, that such Security
        has been duly authenticated and delivered hereunder and is entitled to the
        benefits of this Indenture. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 304.
        <I>Temporary Securities</I>. (a) Until definitive Securities of any series
        (including Global Securities) are ready for delivery,\nthe Company may execute,
        and upon Company Order the Trustee shall authenticate and deliver one or more
        temporary Securities that are produced in any authorized denomination, substantially
        of the tenor of the definitive Securities in lieu of which\nthey are issued
        and with such appropriate insertions, omissions, substitutions and other variations
        as the officers executing such Securities may determine, as evidenced by their
        execution of such Securities. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b) If temporary
        Securities of any series are issued, the Company will cause definitive Securities
        of that series to be prepared without\nunreasonable delay. After the preparation
        of definitive Securities of such series, the temporary Securities of such
        series shall be exchangeable for definitive Securities of such series upon
        surrender of the temporary Securities of such series at\nthe office or agency
        of the Company in a Place of Payment for that series, without charge to the
        Holder. Upon surrender for cancellation of any one or more temporary Securities
        of any series the Company shall execute and the Trustee shall\nauthenticate
        and deliver in exchange therefor a like principal amount of definitive Securities
        of the same series of authorized denominations. Until so exchanged the temporary
        Securities of any series shall in all respects be entitled to the same\nbenefits
        under this Indenture as definitive Securities of such series. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        305. <I>Registration, Registration of Transfer and\nExchange</I>. (a) The
        Company shall cause to be kept at the Corporate Trust Office of the Trustee
        a register (the register maintained in such office and in any other office
        or agency of the Company in a Place of Payment being herein sometimes\ncollectively
        referred to as the &#147;<B><I>Security Register</I></B>&#148;) in which,
        subject to such reasonable regulations as it may prescribe, the Company shall
        provide for the registration of Securities and of transfers of Securities.
        The\nTrustee is hereby appointed &#147;<B><I>Security Registrar</I></B>&#148;
        for the purpose of registering Securities and transfers of Securities as herein
        provided. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(b) Except in the case of Securities
        issued in the form of a Global Security, upon surrender for registration of
        transfer of any Security of\nany series at the office or agency of the Company
        in a Place of Payment for that series, the Company shall execute, and the
        Trustee shall authenticate and deliver, in the name of the designated transferee
        or transferees, one or more new Securities\nof the same series, of any authorized
        denominations and of a like aggregate principal amount. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c)
        All Securities issued upon any\nregistration of transfer or exchange of Securities
        shall be the valid obligations of the Company, evidencing the same debt, and
        entitled to the same benefits under this Indenture, as the Securities surrendered
        upon such registration of transfer or\nexchange. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">14 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(d) Every Security
        presented or surrendered for registration of transfer or for exchange\nshall
        (if so required by the Company or the Trustee) be duly endorsed, or be accompanied
        by a written instrument of transfer in form satisfactory to the Company and
        the Security Registrar duly executed by the Holder thereof or such Holder&#146;s\nattorney
        duly authorized in writing. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(e) Unless otherwise
        provided in a Board Resolution or an Officer&#146;s Certificate pursuant to
        a\nBoard Resolution, or in an indenture supplemental hereto, with respect
        to Securities of any series, no service charge shall be made to the Holder
        for any registration of transfer or exchange of Securities, but the Company
        may require payment of a\nsum sufficient to cover any tax or other governmental
        charge that may be imposed in connection with any registration of transfer
        or exchange of Securities, other than exchanges pursuant to Section&nbsp;304,
        906, 1106 or 1204 not involving any\ntransfer. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(f)
        The Company shall not be required (i)&nbsp;to issue, register the transfer
        of or exchange Securities of any series during a\nperiod beginning at the
        opening of business 15 days before the day of the mailing of a notice of redemption
        of Securities of that series selected for redemption under Section&nbsp;1103
        and ending at the close of business on the day of such mailing,\nor (ii)&nbsp;to
        register the transfer of or exchange any Security so selected for redemption
        in whole or in part, except the unredeemed portion of any Security being redeemed
        in part. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 306. <I>Mutilated, Destroyed,
        Lost and Stolen Securities</I>. (a) If any mutilated Security is surrendered
        to the Trustee, the Company\nshall execute and the Trustee shall authenticate
        and deliver in exchange therefor a replacement Security of the same series
        and of like tenor and principal amount and bearing a number not contemporaneously
        outstanding. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(b) If there has been delivered
        to the Company and the Trustee (i)&nbsp;evidence to their satisfaction of
        the destruction, loss or theft of any\nSecurity and (ii)&nbsp;such bond, security
        or indemnity as may be required by them to save each of them and any agent
        of either of them harmless, then, in the absence of actual notice to the Company
        or the Trustee that such Security has been\nacquired by a bona fide purchaser,
        the Company shall execute and upon its request the Trustee shall authenticate
        and deliver, a replacement Security of the same series (and Tranche, if applicable)
        and of like tenor and principal amount and bearing a\nnumber not contemporaneously
        outstanding. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(c) In case any such mutilated,
        destroyed, lost or stolen Security has become or is about to\nbecome due and
        payable, the Company in its discretion may, instead of issuing a new Security,
        pay such Security. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(d) Upon the issuance of\nany
        new Security under this Section, the Company may require the payment of a
        sum sufficient to cover any tax or other governmental charge that may be imposed
        in relation thereto and any other expenses (including the fees and expenses
        of the\nTrustee) connected therewith. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(e) Every new
        Security of any series issued pursuant to this Section in lieu of any destroyed,
        lost or\nstolen Security shall constitute an original additional contractual
        obligation of the Company, whether or not the destroyed, lost or stolen Security
        is at any time enforceable by anyone, and shall be entitled to all the benefits
        of this Indenture\nequally and proportionately with any and all other Securities
        of that series duly issued hereunder. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(f) The provisions
        of this Section are\nexclusive and shall preclude (to the extent lawful) all
        other rights and remedies with respect to the replacement or payment of mutilated,
        destroyed, lost or stolen Securities. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 307.
        <I>Payment of Interest; Interest Rights Preserved</I>. (a) Unless otherwise
        provided as contemplated by Section&nbsp;301(b) with\nrespect to the Securities
        of any series, interest on any Security that is payable, and is punctually
        paid or duly provided for, on any Interest Payment Date shall be paid to the
        Person in whose name that Security (or one or more Predecessor\nSecurities)
        is registered at the close of business on the Regular Record Date for such
        interest; <I>provided</I>, <I>however</I>, that interest payable at Maturity
        will be paid to the Person to whom principal is payable. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">15 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b) Any interest
        on any Security of any series that is payable, but is not punctually paid\nor
        duly provided for, on any Interest Payment Date (herein called &#147;<B><I>Defaulted
        Interest</I></B>&#148;) shall forthwith cease to be payable to the Holder
        on the relevant Regular Record Date by virtue of having been such Holder,
        and such\nDefaulted Interest may be paid by the Company, at its election in
        each case, as provided in clause (i)&nbsp;or (ii) below: </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:5%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(i) The Company may elect to make payment of any Defaulted Interest
        to the Persons in whose names the Securities of such series\n(or their respective
        Predecessor Securities) are registered at the close of business on a Special
        Record Date for the payment of such Defaulted Interest, which shall be fixed
        in the following manner. The Company shall notify the Trustee in writing\nof
        the amount of Defaulted Interest proposed to be paid on each Security of such
        series and the date of the proposed payment, and at the same time the Company
        shall deposit with the Trustee an amount of money equal to the aggregate amount
        proposed\nto be paid in respect of such Defaulted Interest or shall make arrangements
        satisfactory to the Trustee for such deposit prior to the date of the proposed
        payment, such money when deposited to be held in trust for the benefit of
        the Persons entitled\nto such Defaulted Interest as in this clause provided.
        Thereupon the Company shall fix a Special Record Date for the payment of such
        Defaulted Interest which shall be not more than 15 days and not less than
        10 days prior to the date of the proposed\npayment and not less than 10 days
        after the receipt by the Trustee of the notice of the proposed payment. The
        Company shall promptly notify the Trustee of such Special Record Date and,
        in the name and at the expense of the Company, shall cause\nnotice of the
        proposed payment of such Defaulted Interest and the Special Record Date therefor
        to be given to each Holder of Securities of such series in the manner set
        forth in Section&nbsp;106, not less than 10 days prior to such Special Record\nDate.
        Notice of the proposed payment of such Defaulted Interest and the Special
        Record Date therefor having been so mailed, such Defaulted Interest shall
        be paid to the Persons in whose names the Securities of such series (or their
        respective\nPredecessor Securities) are registered at the close of business
        on such Special Record Date and shall no longer be payable pursuant to the
        following clause (ii). </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:5%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(ii)
        The Company may make payment of any Defaulted Interest on the Securities of
        any series in any other lawful manner not\ninconsistent with the requirements
        of any securities exchange on which such Securities may be listed, and upon
        such notice as may be required by such exchange, if, after notice given by
        the Company to the Trustee of the proposed payment pursuant to\nthis clause
        (ii), such manner of payment shall be deemed practicable by the Trustee. </P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(c) Subject to the foregoing provisions of this\nSection,
        each Security delivered under this Indenture upon registration of transfer
        of or in exchange for or in lieu of any other Security shall carry the rights
        to interest accrued and unpaid, and to accrue, which were carried by such
        other\nSecurity. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 308. <I>Persons Deemed
        Owners</I>. Prior to due presentment of a Security for registration of transfer,
        the Company,\nthe Trustee and any agent of the Company or the Trustee may
        treat the Person in whose name such Security is registered as the owner of
        such Security for the purpose of receiving payment of principal of (and any
        premium) and (subject to\nSection&nbsp;301 and Section&nbsp;307) any interest
        on such Security and for all other purposes whatsoever, whether or not such
        Security be overdue, and neither the Company, the Trustee nor any agent of
        the Company or the Trustee shall be affected\nby notice to the contrary. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">Ownership of Securities of a series shall be
        proved by the computerized book-entry system of the Depositary in\nthe case
        of Securities issued in the form of a Global Security. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">None
        of the Company, the Trustee, any Paying Agent or the Security\nRegistrar shall
        have any responsibility or liability for any aspect of the records relating
        to or payments made on account of beneficial ownership interests of a Global
        Security or for maintaining, supervising or reviewing any records relating
        to\nsuch beneficial ownership interests. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        309. <I>Cancellation</I>. Except as otherwise specified as contemplated by\nSection&nbsp;301(b)
        for Securities of any series, all Securities surrendered for payment, redemption,
        registration of transfer or exchange or for credit against any sinking fund
        payment shall, if surrendered to any Person other than the Trustee, be\ndelivered
        to the Trustee and, if not theretofore cancelled, shall be promptly cancelled
        by it. Except as otherwise specified as contemplated by Section&nbsp;301(b)
        for Securities of any series, the Company may at any time deliver to the Trustee
        for\ncancellation any Securities previously authenticated and delivered hereunder
        that the Company may have acquired in any manner whatsoever or that the Company
        has not issued and sold, and all Securities so delivered shall be promptly
        cancelled by the\nTrustee. No Securities shall be authenticated in lieu of
        or in exchange for any Securities cancelled as provided in this Section, except
        as expressly permitted by this Indenture. Upon request of the Company, the
        Trustee shall provide it with a\ncertificate of cancellation. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">16 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 310.
        <I>Computation of Interest</I>. Except as otherwise specified as contemplated\nby
        Section&nbsp;301(b) for Securities of any series, interest on the Securities
        of each series shall be computed on the basis of a <FONT STYLE=\"white-space:nowrap\">360-day</FONT>
        year of twelve <FONT STYLE=\"white-space:nowrap\">30-day</FONT> months.\n</P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 311. <I>Global Securities; Exchanges;
        Registration and Registration of Transfer</I>. If specified as contemplated
        by\nSection&nbsp;301(b) for Securities of any series, the Securities of such
        series may be issued in the form of one or more Global Securities, which shall
        be deposited with the Depositary, and, unless otherwise specified in the form
        of Global Security\nadopted pursuant to Section&nbsp;301, be registered in
        the name of the Depository&#146;s nominee. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">Except
        as otherwise specified as\ncontemplated by Section&nbsp;301(b) for Securities
        of any series, any permanent Global Security shall be exchangeable only as
        provided in this paragraph. If the beneficial owners of interests in a permanent
        Global Security are entitled to exchange\nsuch interests for Securities of
        such series of like tenor and principal amount of another authorized form,
        as specified as contemplated by Section&nbsp;301(b), then without unnecessary
        delay but in any event not later than the earliest date on\nwhich such interests
        may be so exchanged, the Company shall deliver to the Trustee definitive Securities
        of that series in aggregate principal amount equal to the principal amount
        of such permanent Global Security, executed by the Company. On or\nafter the
        earliest date on which such interests may be so exchanged, such permanent
        Global Security shall be surrendered from time to time in accordance with
        instructions given to the Trustee and the Depositary (which instructions shall
        be in\nwriting but need not comply with Section&nbsp;102<B> </B>or be accompanied
        by an Opinion of Counsel) by the Depositary or such other depositary as shall
        be specified in the Company Order with respect thereto to the Trustee, as
        the Company&#146;s\nagent for such purpose, to be exchanged, in whole or in
        part, for definitive Securities of the same series without charge and the
        Trustee shall authenticate and deliver, in exchange for each portion of such
        permanent Global Security, a like\naggregate principal amount of definitive
        Securities of the same series of authorized denominations and of like tenor
        as the portion of such permanent Global Security to be exchanged, as shall
        be specified by the Depositary; <I>provided</I>,<I>\nhowever</I>, that no
        such exchanges may occur during the periods specified by Section&nbsp;305.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">The Global Security may be transferred to\nanother
        nominee of the Depositary, or to a successor Depositary selected by the Company,
        and upon surrender for registration of transfer of the Global Security to
        the Trustee, the Company shall execute, and the Trustee shall authenticate
        and\ndeliver, in the name of the designated transferee, a new Global Security
        in the same aggregate principal amount. If at any time the Depositary notifies
        the Company that it is unwilling or unable to continue as Depositary and a
        successor Depositary\nsatisfactory to the Company is not appointed within
        90 days after the Company receives such notice, the Company will execute,
        and the Trustee will authenticate and deliver, Securities in definitive form
        to the Depositary in exchange for the Global\nSecurity. In addition, if at
        any time the Company determines that it is not in the best interest of the
        Company or the beneficial owners of Securities to continue to have a Global
        Security representing all of the Securities held by a Depositary, the\nCompany
        may, at its option, execute, and the Trustee will authenticate and deliver,
        Securities in definitive form to the Depositary in exchange for all or a portion
        of the Global Security. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 312.
        <I>Extension of Interest Payment</I>. The Company shall have the right at
        any time, so long as the Company is not in default in\nthe payment of interest
        on the Securities of any series hereunder, to extend or defer interest payment
        periods on all Securities of one or more series, if so specified as contemplated
        by Section&nbsp;301(b) with respect to such Securities and upon\nsuch terms
        as may be specified as contemplated by Section&nbsp;301(b) with respect to
        such Securities. If the Company ever so extends or defers any such interest
        payment period, the Company shall promptly notify the Trustee. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">17 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>ARTICLE
        FOUR </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>SATISFACTION AND DISCHARGE;
        DEFEASANCE </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 401. <I>Termination
        of Company</I><I>&#146;</I><I>s Obligations</I>. (a) This Indenture shall
        upon Company Request cease to be of\nfurther effect with respect to the Securities
        of any series (except as to any surviving rights of registration of transfer
        or exchange of Securities herein expressly provided for), and the Trustee,
        at the expense of the Company, shall execute\ninstruments in form and substance
        satisfactory to the Trustee and the Company acknowledging termination of the
        Company&#146;s obligations under the Securities of such series and this Indenture,
        when </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(1) either </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(A)\nall
        Securities of such series previously authenticated and delivered (other than
        (i)&nbsp;Securities of such series that have been destroyed, lost or stolen
        and that have been replaced or paid as provided in Section&nbsp;306 and (ii)&nbsp;Securities\nof
        such series that are deemed paid and discharged pursuant to Section&nbsp;402)
        have been delivered to the Trustee for cancellation; or </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times
        New Roman\">(B) all such Securities of such series not previously delivered
        to the Trustee for cancellation </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:13%; font-size:10pt; font-family:Times New Roman\">(i)
        have become due and payable (whether at Stated Maturity, early redemption
        or otherwise), or </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:13%; font-size:10pt; font-family:Times New Roman\">(ii) will become
        due and payable at their Stated Maturity within one year, or </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:13%; font-size:10pt; font-family:Times
        New Roman\">(iii) are to be called for redemption within one year under arrangements
        satisfactory to the Trustee for the giving of notice\nof redemption by the
        Trustee in the name, and at the expense, of the Company, </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; font-size:10pt; font-family:Times New Roman\">and
        the Company in the case of (i), (ii) or (iii)&nbsp;above\nhas irrevocably
        deposited or caused to be deposited with the Trustee as funds in trust solely
        for the benefit of the Holders of the Securities of such series an amount
        in cash in Dollars, Eligible Obligations or any combination thereof, together
        (if\nnecessary in the case of a series of Securities not bearing interest
        at a fixed rate) with any Hedging Obligation, so that such funds in each case
        are sufficient to pay principal of, and any premium and interest on, all Outstanding
        Securities of\nsuch series; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(2)
        the Company has paid or caused to be paid all other sums payable hereunder
        by the Company; and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(3) the Company
        has delivered to the Trustee an Officer&#146;s Certificate and an Opinion
        of Counsel, each stating that all\nconditions precedent herein provided for
        relating to the satisfaction and discharge of this Indenture as to such series
        have been complied with. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b) Notwithstanding
        the satisfaction and discharge of this Indenture, the obligations of the Company
        to the Trustee under Section&nbsp;607, the\nobligations of the Trustee to
        any Authenticating Agent under Section&nbsp;614 and, if money has been deposited
        with the Trustee pursuant to subclause (B)&nbsp;of clause (1)&nbsp;of this
        Section, the obligations of the Trustee under Section&nbsp;405\nand Section&nbsp;1003(e)<B>
        </B>shall survive. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(c) Upon satisfaction and discharge
        of this Indenture as provided in this Section&nbsp;401,\nthe Trustee shall
        assign, transfer and turn over to the Company, subject to the claim provided
        by Section&nbsp;607, any and all money, securities and other property then
        held by the Trustee for the benefit of the Holders of the Securities. </P>\n
        <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P
        STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">18 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">The Company may elect, at its option at any
        time, to have Section&nbsp;402 or\nSection&nbsp;403 applied to the Outstanding
        Securities of any series in accordance with any applicable requirements provided
        pursuant to Section&nbsp;301 and upon compliance with the conditions set forth
        below in this Article. Any such election\nshall be evidenced by a Board Resolution
        or in another manner specified as contemplated by Section&nbsp;301(b) for
        such Securities. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 402. <I>Defeasance and
        Discharge of Indenture</I>. Upon the Company&#146;s exercise of its option
        (if any) to have this Section\napplied to all the Outstanding Securities of
        any series or Tranche, or any portion of the principal amount thereof, and
        subject to the conditions set forth in Section&nbsp;404 being satisfied, the
        Company shall be deemed to have paid and discharged\nthe entire indebtedness
        on such Outstanding Securities of such series or Tranche, and the provisions
        of this Indenture, as it relates to such Outstanding Securities of such series
        or Tranche, shall be satisfied and discharged and shall no longer be\nin effect
        (and the Trustee, at the expense of the Company, shall at Company Request
        execute proper instruments acknowledging the same), except as to: </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(a) the rights of Holders of
        Securities of such series to receive, solely from the trust funds described
        in Section&nbsp;405,\n(x) payment of the principal of (and premium, if any)
        and each installment of principal of (and premium, if any) or interest, if
        any, on the Outstanding Securities of such series, or portions thereof, on
        the Stated Maturity of such principal or\ninstallment of principal or interest
        to but excluding the Redemption Date designated by the Company pursuant to
        subparagraph (viii)&nbsp;of Section&nbsp;404 and (y)&nbsp;the benefit of any
        mandatory sinking fund payments applicable to the Securities\nof such series
        or Tranche on the day on which such payments are due and payable in accordance
        with the terms of this Indenture and the Securities of such series or Tranche;
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(b) the obligations of the Company
        and the Trustee with respect to such Securities of such series or Tranche
        under Sections\n304, 305, 306, 614, 1002 and 1003<B> </B>and, if the Company
        shall have designated a Redemption Date pursuant to subparagraph (x)&nbsp;of
        Section&nbsp;404, Sections 1104 and 1106; and </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(c) the Company&#146;s obligations with respect to the Trustee
        under Section&nbsp;607. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 403.
        <I>Defeasance of Certain Obligations</I>. The Company may omit to comply with
        its obligations under the covenants contained in\nSections 801, 1006 and 1007
        with respect to any Security or Securities of any series (and in respect of
        any term, provision or condition set forth in the covenants or restrictions
        specified for such Securities pursuant to Section&nbsp;301(b), in any\nsupplemental
        indenture, Board Resolution or Officer&#146;s Certificate establishing such
        Security), and the failure to comply with any such provisions shall not constitute
        a Default or Event of Default under Section&nbsp;501(4), <I>provided</I> that\nthe
        conditions set forth in Section&nbsp;404 have been satisfied. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        404. <I>Conditions to Defeasance</I>. The following conditions\nshall be the
        conditions to the application of Section&nbsp;402 and Section&nbsp;403: </P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(i) the Company has deposited
        or\ncaused to be deposited irrevocably with the Trustee as trust funds in
        trust, specifically pledged as security for, and dedicated solely to, the
        benefit of the Holders of the Securities of such series, (x)&nbsp;cash in
        Dollars in an amount\nsufficient, or (y)&nbsp;Eligible Obligations which through
        the payment of interest and principal in respect thereof in accordance with
        their terms will provide on or before the due date of any payment referred
        to in clause (1)&nbsp;or (2) of this\nsubparagraph (i)&nbsp;money in an amount
        sufficient or (z)&nbsp;a combination of such cash and Eligible Obligations,
        together (if necessary in the case of a series of Securities not bearing interest
        at a fixed rate) with any Hedging Obligation so\nthat such funds are sufficient,
        in the opinion of a nationally recognized firm of independent certified public
        accountants expressed in a written certification thereof delivered to the
        Trustee, to pay and discharge (1)&nbsp;the principal of (and\npremium, if
        any) and each installment of principal (and premium, if any) and interest,
        if any, on such Securities on the Stated Maturity of such principal or installment
        of principal or interest or to but excluding the Redemption Date designated
        by\nthe Company in accordance with Section&nbsp;404(a)(1)(B)(iii) and (2)&nbsp;any
        mandatory sinking fund payments applicable to the Securities of such series
        on the day on which such payments are due and payable in accordance with the
        terms of this\nIndenture and of the Securities of such series; </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">19 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(ii)
        in the event of an election to have Section&nbsp;402 apply, the Company\nhas
        delivered to the Trustee an Officer&#146;s Certificate and an Opinion of Counsel
        to the effect that (x)&nbsp;the Company has received from, or there has been
        published by, the Internal Revenue Service a ruling or (y)&nbsp;there has
        been a change\nin law or regulation occurring after the date hereof, to the
        effect that Holders of the Securities of such series will not recognize income,
        gain or loss for federal income tax purposes as a result of such deposit,
        defeasance and discharge and will\nbe subject to federal income tax on the
        same amount and in the same manner and at the same times, as would have been
        the case if such deposit, defeasance and discharge had not occurred; </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(iii) in the event of an election
        to have Section&nbsp;403 apply, the Company has delivered to the Trustee an
        Officer&#146;s\nCertificate and an Opinion of Counsel to the effect that Holders
        of the Securities of such series will not recognize income, gain or loss for
        federal income tax purposes as a result of such deposit and defeasance and
        will be subject to federal\nincome tax on the same amount and in the same
        manner and at the same times, as would have been the case if such deposit
        and defeasance had not occurred; </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(iv)
        such deposit will not result in a breach or violation of, or constitute a
        default under, this Indenture or any other\nagreement or instrument to which
        the Company is a party or by which it is bound; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(v) such provision would not cause any\nOutstanding Securities
        of such series then listed on a securities exchange to be delisted as a result
        thereof; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(vi) no\nEvent
        of Default or event that with notice or lapse of time would become an Event
        of Default with respect to the Securities of such series has occurred and
        is continuing on the date of such deposit; </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(vii) the Company has delivered to the Trustee an Officer&#146;s
        Certificate stating that the deposit was not made by the\nCompany with the
        intent of preferring the holders of the Securities of such series over any
        other creditors of the Company or with the intent of defeating, hindering,
        delaying or defrauding any other creditors of the Company; </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(viii) such deposit shall not, as specified in an Opinion of Counsel,
        cause the Trustee with respect to the Securities of such\nseries to have a
        conflicting interest as defined in Section&nbsp;608 and for purposes of the
        Trust Indenture Act with respect to the Securities of such series; </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(ix) the Company has delivered
        to the Trustee an Officer&#146;s Certificate and an Opinion of Counsel, each
        stating that all\nconditions precedent provided for relating to the defeasance
        contemplated by this Section have been complied with; and </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(x)\nif the Company has deposited or caused to be deposited money
        or Eligible Obligations to pay or discharge the principal of (and premium,
        if any) and interest on the Outstanding Securities of a series to but excluding
        a Redemption Date pursuant to\nclause (i)&nbsp;of this Section&nbsp;404, such
        Redemption Date shall be irrevocably designated by a Board Resolution delivered
        to the Trustee on or prior to the date of deposit of such money or Eligible
        Obligations, and such Board Resolution shall\nbe accompanied by an irrevocable
        Company Request that the Trustee give notice of such redemption in the name
        and at the expense of the Company not less than 30 nor more than 60 days prior
        to such Redemption Date in accordance with Section&nbsp;1104.\n</P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        405. <I>Application of Trust Money</I>. (a) Neither the Eligible Obligations
        nor the funds deposited with the Trustee pursuant to\nSections 401, 402 or
        403, nor the principal or interest payments on any such Eligible Obligations,
        shall be withdrawn or used for any purpose other than, and shall be held in
        trust for, the payment of the principal of and premium, if any, and\ninterest,
        if any, on the Securities or portions of principal amount thereof in respect
        of which such deposit was made, all subject, however, to the provisions of
        Section&nbsp;606; <I>provided, however</I>, that, so long as no Event of Default
        has\noccurred and is continuing, any cash received from such principal or
        interest payments on such Eligible Obligations deposited with the Trustee,
        if not then needed for such </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">20 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\">\npurpose, shall, to the extent
        practicable, be invested in Eligible Obligations of the type described in
        Sections 401 and 402(d)(2)(A) maturing at such times and in such amounts as
        shall be\nsufficient to pay when due the principal of and any premium and
        interest due and to become due on such Securities or portions thereof on and
        prior to the Maturity thereof, and interest earned from such reinvestment
        shall be paid over to the Company\nas received by the Trustee, free and clear
        of any trust, lien or pledge under this Indenture except the claim provided
        by Section&nbsp;607; and <I>provided, further</I>, that, so long as there
        shall not have occurred and be continuing an Event of\nDefault, any moneys
        held by the Trustee in accordance with this Section on the Maturity of all
        such Securities in excess of the amount required to pay the principal of and
        premium, if any, and interest, if any, then due on such Securities shall be\npaid
        over to the Company free and clear of any trust, lien or pledge under this
        Indenture except the claim provided by Section&nbsp;607. </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b)
        The Company shall pay and shall indemnify the Trustee against any tax, fee
        or other charge imposed on or assessed against Eligible\nObligations deposited
        pursuant to Section&nbsp;401, 402 or 403 or the principal and any premium
        and interest received in respect of such obligations other than any payable
        by or on behalf of Holders. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) The Trustee
        shall deliver or pay to the Company from time to time upon Company Request
        any Eligible Obligations or money held by it as\nprovided in Section&nbsp;401,
        402 or 403 that, in the opinion of a nationally recognized firm of independent
        certified public accountants expressed in a written certification thereof
        delivered to the Trustee, are then in excess of the amount thereof\nthat then
        would have been required to be deposited for the purpose for which such Eligible
        Obligations or money was deposited or received. This provision shall not authorize
        the sale by the Trustee of any Eligible Obligations held under this\nIndenture.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 406. <I>Reinstatement</I>. If the Trustee
        or the Paying Agent is unable to apply any money in accordance with this\nArticle
        with respect to any Securities by reason of any order or judgment of any court
        or governmental authority enjoining, restraining or otherwise prohibiting
        such application, then the obligations under this Indenture and such Securities
        from\nwhich the Company has been discharged or released pursuant to Section&nbsp;402
        or Section&nbsp;403 shall be revived and reinstated as though no deposit had
        occurred pursuant to this Article with respect to such Securities, until such
        time as the\nTrustee or Paying Agent is permitted to apply all money held
        in trust pursuant to Section&nbsp;405 with respect to such Securities in accordance
        with this Article; <I>provided, however,</I> that if the Company makes any
        payment of principal of or\nany premium or interest on any such Security following
        such reinstatement of its obligations, the Company shall be subrogated to
        the rights (if any) of the Holders of such Securities to receive such payment
        from the money so held in trust. </P>\n<P STYLE=\"margin-top:24pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>ARTICLE
        FIVE </B></P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>REMEDIES\n</B></P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        501. <I>Events of Default</I>. &#147;<B><I>Event of Default</I></B>&#148;,
        wherever used herein with respect to Securities of\nany series, means any
        one of the following events, unless such event is either inapplicable to a
        particular series or it is specifically deleted or modified in the applicable
        Board Resolution or supplemental indenture under which such series of\nSecurities
        is issued, as the case may be, as contemplated by Section&nbsp;301: </P> <P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(1) default in the payment of
        any interest\nupon any Security of that series when it becomes due and payable,
        and continuance of such default for a period of 30 days; <I>provided, however</I>,
        that a valid extension of the interest payment period by the Company as contemplated
        in\nSection&nbsp;312 shall not constitute a failure to pay interest for this
        purpose; or </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(2) default
        in the payment of the\nprincipal of (or premium, if any, on) any Security
        of that series at its Maturity and, in the case of technical or administrative
        difficulties, only if such default persists for a period of more than three
        Business Days; or </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">21 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(3) default in the performance,
        or breach, of any covenant or warranty of\nthe Company in this Indenture (other
        than a covenant or warranty a default in whose performance or whose breach
        is elsewhere in this Section specifically dealt with or which has expressly
        been included in this Indenture solely for the benefit of one\nor more series
        of Securities other than that series), and continuance of such default or
        breach for a period of 60 days after there has been given, by registered or
        certified mail, to the Company by the Trustee or to the Company and the Trustee
        by\nthe Holders of at least 25% in aggregate principal amount of the Outstanding
        Securities of such series a written notice specifying such default or breach
        and requiring it to be remedied and stating that such notice is a &#147;<B><I>Notice
        of\nDefault</I></B>&#148; hereunder; or </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(4)
        the Company pursuant to or within the meaning of any Bankruptcy Law\n(i)&nbsp;commences
        a voluntary case, (ii)&nbsp;consents to the entry of an order for relief against
        it in an involuntary case, (iii)&nbsp;consents to the appointment of a Custodian
        of it or for all or substantially all of its property or\n(iv)&nbsp;makes
        a general assignment for the benefit of its creditors; or </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(5) a court of competent jurisdiction enters an\norder or decree
        under any Bankruptcy Law that (i)&nbsp;is for relief against the Company in
        an involuntary case, or adjudicates the Company insolvent or bankrupt, (ii)&nbsp;appoints
        a Custodian of the Company or for all or substantially all of the\nproperty
        of the Company, (iii)&nbsp;orders the liquidation of the Company, and such
        order or decree remains unstayed and in effect for 90 days; or </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(6) any other Event of Default provided with respect to Securities
        of such series pursuant to Section&nbsp;301(b). </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        502. <I>Acceleration of Maturity; Rescission and Annulment</I>. If an Event
        of Default with respect to Securities of any series at the\ntime Outstanding
        (other than an Event of Default specified in Section&nbsp;501(4) or (5)&nbsp;with
        respect to the Company) occurs and is continuing, then in every such case
        the Trustee or the Holders of not less than 25% in aggregate principal\namount
        of the Outstanding Securities of such series, by a notice in writing to the
        Company (and to the Trustee if given by such Holders), may declare the principal
        amount (or, if the Securities of such series are Original Issue Discount Securities\nor
        Indexed Securities, such portion of the principal amount of such Securities
        as may be specified in the terms thereof) to be due and payable immediately
        and upon any such declaration such principal amount (or specified amount)
        shall become\nimmediately due and payable. If an Event of Default specified
        in Section&nbsp;501(4) or (5)&nbsp;occurs, the principal of all the Securities
        then Outstanding (or if any such Securities are Original Issue Discount Securities
        or Indexed Securities,\nsuch portion of the principal amount of such Securities
        as may be specified in the terms thereof), together with any accrued and unpaid
        interest thereon, shall automatically become and be immediately due and payable
        without any declaration or other\nact or notice on the part of the Trustee
        or any Holders of the Securities. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">Except as may
        otherwise be provided pursuant to\nSection&nbsp;301 for all or any specific
        Securities of any series, at any time after such a declaration of acceleration
        with respect to the Securities of one or more series has been made and before
        a judgment or decree for payment of the money due\nhas been obtained by the
        Trustee as hereinafter in this Article provided, the Event or Events of Default
        giving rise to such declaration of acceleration shall, without further act,
        be deemed to have been waived, and such declaration and its\nconsequences
        shall, without further act, be deemed to have been rescinded and annulled,
        if </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(1) the Company has paid or\ndeposited
        irrevocably with the Trustee a sum sufficient to pay </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times
        New Roman\">(A) all overdue interest on all Securities of any such\nseries,
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(B) the principal of (and premium,
        if any, on) any Securities of such series that have become due otherwise than\nby
        such declaration of acceleration and interest thereon at the rate or rates
        prescribed therefor in such Securities, </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(C)\nto
        the extent that payment of such interest is lawful, interest upon overdue
        interest at the rate or rates borne by such Securities, unless another rate
        is provided in such Securities, and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(D)
        all amounts due to the Trustee under Section&nbsp;607; </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">and
        </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">22 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(2) all Events of Default with
        respect to Securities of that series, other\nthan the <FONT STYLE=\"white-space:nowrap\">non-payment</FONT>
        of the principal of Securities of that series that have become due solely
        by such declaration of acceleration, have been cured or waived as provided
        in Section&nbsp;513. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">No such rescission
        shall affect any subsequent Event of Default or impair any right consequent
        thereon. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 503. <I>Collection of
        Indebtedness and Suits for Enforcement by Trustee</I>. If an Event of Default
        described in clause (1)&nbsp;or\n(2) of Section&nbsp;501 has occurred and
        is continuing, the Company shall, upon demand of the Trustee, pay to the Trustee,
        for the benefit of the Holders of the Securities of the series with respect
        to which such Event of Default has occurred, the\nwhole amount then due and
        payable on such Securities for principal and any premium or interest and,
        to the extent that payment of such interest shall be legally enforceable,
        interest on any overdue principal and premium and on any overdue interest,\nat
        the rate or rates borne by such Securities, unless another rate is provided
        in such Securities, and, in addition thereto, such further amount as shall
        be sufficient to cover any amounts due to the Trustee under Section&nbsp;607.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">If an Event of Default with respect to Securities
        of any series occurs and is continuing, the Trustee may in its discretion
        proceed to protect\nand enforce its rights and the rights of the Holders of
        Securities of such series by such appropriate judicial proceedings as the
        Trustee deems most effectual to protect and enforce any such rights, whether
        for the specific enforcement of any\ncovenant or agreement in this Indenture
        or in aid of the exercise of any power granted herein, or to enforce any other
        proper remedy. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 504. <I>Trustee May
        File Proofs of Claim</I>. In case of the pendency of any receivership, insolvency,
        liquidation, bankruptcy,\nreorganization, arrangement, adjustment, composition
        or other judicial proceeding relative to the Company or any other obligor
        upon the Securities or the property of the Company or of such other obligor
        or their creditors, the Trustee (irrespective\nof whether the principal of
        the Securities shall then be due and payable as therein expressed or by declaration
        or otherwise and irrespective of whether the Trustee shall have made any demand
        on the Company for the payment of overdue principal or\ninterest) shall be
        entitled and empowered, by intervention in such proceeding or otherwise, </P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(i) to file and prove a claim\nfor
        the whole amount of principal and premium or interest owing and unpaid in
        respect of the Securities and to file such other papers or documents as may
        be necessary or advisable in order to have the claims of the Trustee (including
        any claim for\namounts due to the Trustee under Section&nbsp;607) and of the
        Holders allowed in such judicial proceeding, and </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(ii) to\ncollect and receive any moneys or other property payable
        or deliverable on any such claims and to distribute the same; </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\">and any custodian,
        receiver,\nassignee, trustee, liquidator, sequestrator or other similar official
        in any such judicial proceeding is hereby authorized by each Holder to make
        such payments to the Trustee and, if the Trustee consents to the making of
        such payments directly to\nthe Holders, to pay to the Trustee any amount due
        it under Section&nbsp;607. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">Nothing herein
        contained shall be deemed to authorize the\nTrustee to authorize or consent
        to or accept or adopt on behalf of any Holder any plan of reorganization,
        arrangement, adjustment or composition affecting the Securities or the rights
        of any Holder thereof or to authorize the Trustee to vote in\nrespect of the
        claim of any Holder in any such proceeding. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        505. <I>Trustee May Enforce Claims Without Possession of\nSecurities</I>.
        All rights of action and claims under this Indenture or the Securities may
        be prosecuted and enforced by the Trustee without the possession of any of
        the Securities or the production thereof in any proceeding relating thereto,
        and\nany such proceeding instituted by the Trustee shall be brought in its
        own name as trustee of an express trust, and any recovery of judgment shall,
        after provision for the payment of the amounts due to the Trustee under Section&nbsp;607,
        be for the\nratable benefit of the Holders of the Securities in respect of
        which such judgment has been recovered. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">23 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 506.
        <I>Application of Money Collected</I>. Any money collected by the Trustee\npursuant
        to this Article shall be applied in the following order, at the date or dates
        fixed by the Trustee, and, in case of the distribution of such money on account
        of principal and any premium and interest, upon presentation of the Securities
        in\nrespect of which or for the benefit of which such money shall have been
        collected and the notation thereon of the payment if only partially paid and
        upon surrender thereof if fully paid: </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">FIRST: To the
        payment of all amounts due the Trustee under Section&nbsp;607; </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECOND:
        To the payment of the amounts then due and unpaid for principal of and any
        premium and interest on the Securities in respect of which\nor for the benefit
        of which such money has been collected, ratably, without preference or priority
        of any kind, according to the amounts due and payable on such Securities for
        principal and any premium and interest, respectively; and </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">THIRD:
        The balance, if any, to the Company. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">The Trustee
        may fix a record date and payment date for any such payment to Holders of
        Securities. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 507. <I>Limitation on
        Suits</I>. No Holder of any Security of any series shall have any right to
        institute any proceeding, judicial or\notherwise, with respect to this Indenture
        or such Security, or for the appointment of a receiver or trustee, or for
        any other remedy hereunder, unless </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(1)
        such Holder has previously given written notice to the Trustee of a continuing
        Event of Default with respect to the\nSecurities of that series; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(2) the Holders of not less than 25% in aggregate principal amount
        of the Outstanding\nSecurities of that series shall have made written request
        to the Trustee to institute proceedings in respect of such Event of Default
        in its own name as Trustee hereunder; </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(3)
        such Holder or Holders have offered to the Trustee indemnity against the reasonable
        costs, expenses and liabilities to be\nincurred in compliance with such request;
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(4) the Trustee for 60 days
        after its receipt of such notice, request and offer\nof indemnity has failed
        to institute any such proceeding; and </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(5)
        no direction inconsistent with such written request has\nbeen given to the
        Trustee during such <FONT STYLE=\"white-space:nowrap\">60-day</FONT> period
        by the Holders of a majority in aggregate principal amount of the Outstanding
        Securities of that series; </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\">it being understood and intended
        that no one or more of such Holders shall have any right in any manner whatever
        by virtue of, or by availing of, any\nprovision of this Indenture to affect,
        disturb or prejudice the rights of any other of such Holders, or to obtain
        or to seek to obtain priority or preference over any other of such Holders
        or to enforce any right under this Indenture, except in the\nmanner herein
        provided and for the equal and ratable benefit of all of such Holders. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 508. <I>Unconditional Right of Holders
        to\nReceive Principal, Premium and Interest</I>. Notwithstanding any other
        provision in this Indenture, the Holder of any Security shall have the right,
        which is absolute and unconditional, to receive payment of the principal of
        and premium and (subject\nto Section&nbsp;307) interest on such Security on
        the Stated Maturity or Maturities expressed in such Security (or, in the case
        of redemption, on the Redemption Date, or, in the case of repayment at the
        option of the Holder, on the Repayment Date)\nand to institute suit for the
        enforcement of any such payment, and such rights shall not be impaired without
        the consent of such Holder. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 509.
        <I>Restoration of Rights and Remedies</I>. If the Trustee or any Holder has
        instituted any proceeding to enforce any right or\nremedy under this Indenture
        and such proceeding has been discontinued or abandoned for any reason, or
        has been determined adversely to the Trustee or to such Holder, then and in
        every such case, subject to any determination in such proceeding, the\nCompany,
        the Trustee and such Holder shall be restored severally and respectively to
        their former positions hereunder and thereafter all rights and remedies of
        the Trustee and such Holder shall continue as though no such proceeding had
        been\ninstituted. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">24 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 510. <I>Rights and Remedies Cumulative</I>.
        Except as otherwise provided with\nrespect to the replacement or payment of
        mutilated, destroyed, lost or stolen Securities in the last paragraph of Section&nbsp;306,
        no right or remedy herein conferred upon or reserved to the Trustee or to
        the Holders is intended to be exclusive of\nany other right or remedy, and
        every right and remedy shall, to the extent permitted by law, be cumulative
        and in addition to every other right and remedy given hereunder or now or
        hereafter existing at law or in equity or otherwise. The assertion\nor employment
        of any right or remedy hereunder, or otherwise, shall not prevent the concurrent
        assertion or employment of any other appropriate right or remedy. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 511. <I>Delay or Omission Not Waiver</I>.
        No delay or omission of the Trustee or of any Holder of any Securities to
        exercise any right\nor remedy accruing upon any Event of Default shall impair
        any such right or remedy or constitute a waiver of any such Event of Default
        or an acquiescence therein. Every right and remedy given by this Article or
        by law to the Trustee or to the\nHolders may be exercised from time to time,
        and as often as may be deemed expedient, by the Trustee or by the Holders,
        as the case may be. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 512. <I>Control by Holders</I>.
        If an Event of Default shall have occurred and be continuing in respect of
        a series of Securities, the\nHolders of a majority in aggregate principal
        amount of the Outstanding Securities of that series shall have the right to
        direct the time, method and place of conducting any proceeding for any remedy
        available to the Trustee, or exercising any trust\nor power conferred on the
        Trustee, with respect to the Securities of such series or Tranche; <I>provided,
        however,</I> that if an Event of Default has occurred and is continuing with
        respect to more than one series of Securities of equal ranking,\nthe Holders
        of a majority in aggregate principal amount of the Outstanding Securities
        of all such series of equal ranking, considered as one class, shall have the
        right to make such direction, and not the Holders of the Securities of any
        one of such\nseries of equal ranking; <I>provided, further</I> that </P> <P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(1) such direction shall not
        be in conflict with any rule of law or\nwith this Indenture, and </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(2) the Trustee may take any other action deemed proper by the
        Trustee which is not inconsistent\nwith such direction. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        513. <I>Waiver of Past Defaults</I>. The Holders of not less than a majority
        in aggregate principal amount\nof the Outstanding Securities of any series
        may on behalf of the Holders of all the Securities of such series waive any
        past default hereunder with respect to such series and its consequences; <I>provided</I>
        that if any such past default has\noccurred with respect to more than one
        series of Securities of equal ranking, the Holders of a majority in aggregate
        principal amount of the Outstanding Securities of all such series of equal
        ranking, considered as one class, may make such waiver,\nand not the Holders
        of the Securities of any one of such series of equal ranking, in each case,
        except a default </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(1) in\nthe
        payment of the principal of or premium or interest on any Security of such
        series, or </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(2) in respect
        of a covenant or\nprovision hereof that under Section&nbsp;902 cannot be modified
        or amended without the consent of the Holder of each Outstanding Security
        of such series affected. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">Upon any such
        waiver, such default shall cease to exist, and any Event of Default arising
        therefrom shall be deemed to have been cured, for\nevery purpose of this Indenture,
        but no such waiver shall extend to any subsequent or other default or impair
        any right consequent thereon. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 514.
        <I>Undertaking for Costs</I>. All parties to this Indenture agree, and each
        Holder of any Security by such Holder&#146;s\nacceptance thereof shall be
        deemed to have agreed, that any court may in its discretion require, in any
        suit for the enforcement of any right or remedy under this Indenture, or in
        any suit against the Trustee for any action taken, suffered or\nomitted by
        it as Trustee, the filing by any party litigant in such suit of an undertaking
        to pay the costs of such suit, and that such court may in its discretion assess
        reasonable costs, including </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">25 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\">\nreasonable attorneys&#146;
        fees, against any party litigant in such suit, having due regard to the merits
        and good faith of the claims or defenses made by such party litigant; but
        the provisions\nof this Section shall not apply to any suit instituted by
        the Company, to any suit instituted by the Trustee, to any suit instituted
        by any Holder, or group of Holders, holding in the aggregate more than 10%
        in aggregate principal amount of the\nOutstanding Securities of all series
        in respect of which such suit may be brought, considered as one class, or
        to any suit instituted by any Holder for the enforcement of the payment of
        the principal of or any premium or interest on any Security on\nor after the
        Stated Maturity or Maturities expressed in such Security (or, in the case
        of redemption, on or after the Redemption Date, or, in the case of repayment
        at the option of the Holder, on or after the Repayment Date). </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        515. <I>Waiver of Stay or Extension Laws</I>. The Company covenants (to the
        extent that it may lawfully do so) that it will not at any\ntime insist upon,
        or plead, or in any manner whatsoever claim or take the benefit or advantage
        of, any stay or extension law wherever enacted, now or at any time hereafter
        in force, which may affect the covenants or the performance of this\nIndenture;
        and the Company (to the extent that it may lawfully do so) hereby expressly
        waives all benefit or advantage of any such law and covenants that it will
        not hinder, delay or impede the execution of any power herein granted to the
        Trustee,\nbut will suffer and permit the execution of every such power as
        though no such law had been enacted. </P> <P STYLE=\"margin-top:24pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>ARTICLE
        SIX </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>THE TRUSTEE </B></P> <P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 601.\n<I>Certain Duties and Responsibilities</I>.
        (a) Except during the continuance of an Event of Default with respect to Securities
        of any series, </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(1) the Trustee
        undertakes to perform, with respect to Securities of such series, such duties
        and only such duties as are\nspecifically set forth in this Indenture, and
        no implied covenants or obligations shall be read into this Indenture against
        the Trustee; and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(2) in the absence
        of bad faith on its part, the Trustee may, with respect to Securities of such
        series, conclusively rely, as\nto the truth of the statements and the correctness
        of the opinions expressed therein, upon certificates or opinions furnished
        to the Trustee and conforming to the requirements of this Indenture; but in
        the case of any such certificates or opinions\nwhich by any provision hereof
        are specifically required to be furnished to the Trustee, the Trustee shall
        be under a duty to examine the same to determine whether or not they conform
        to the requirements of this Indenture. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b) If an Event
        of Default with respect to Securities of any series has occurred and is continuing,
        the Trustee shall exercise, with respect to\nSecurities of such series, such
        of the rights and powers vested in it by this Indenture, and use the same
        degree of care and skill in their exercise, as a prudent man would exercise
        or use under the circumstances in the conduct of his own affairs.\n</P> <P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(c) No provision of this Indenture shall be
        construed to relieve the Trustee from liability for its own negligent action,
        its own\nnegligent failure to act, or its own willful misconduct, <I>except</I>
        that </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(1) this subsection shall not
        be construed to\nlimit the effect of <FONT STYLE=\"white-space:nowrap\">sub-section</FONT>
        (a)&nbsp;of this Section; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(2)
        the Trustee shall\nnot be liable for any error of judgment made in good faith
        by a Responsible Officer, unless it shall be proved that the Trustee was negligent
        in ascertaining the pertinent facts; </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(3)
        the Trustee shall not be liable with respect to any action taken or omitted
        to be taken by it in good faith in accordance\nwith the direction of the Holders
        of a majority in aggregate principal amount of the Outstanding Securities
        of any one or more series, as provided herein, relating to the time, method
        and place of conducting any proceeding for any remedy available\nto the Trustee,
        or exercising any trust or power conferred upon the Trustee, under this Indenture
        with respect to the Securities of such series; and </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">26 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(4)
        no provision of this Indenture shall require the Trustee to expend or\nrisk
        its own funds or otherwise incur any financial liability in the performance
        of any of its duties hereunder, or in the exercise of any of its rights or
        powers, if it has reasonable grounds for believing that repayment of such
        funds or adequate\nindemnity against such risk or liability is not reasonably
        assured to it. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(d) Whether or not therein expressly
        so provided, every\nprovision of this Indenture relating to the conduct or
        affecting the liability of or affording protection to the Trustee shall be
        subject to the provisions of this Section. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        602. <I>Notice of Defaults</I>. Within 90 days after the occurrence of any
        default hereunder with respect to the Securities of any\nseries, the Trustee
        shall transmit by mail to all Holders of Securities of such series entitled
        to receive reports pursuant to Section&nbsp;704(3) notice of such default
        hereunder known to the Trustee, unless such default shall have been cured
        or\nwaived; <I>provided</I>, <I>however</I>, that, except in the case of a
        default in the payment of the principal of or any premium or interest on any
        Security of such series or in the payment of any sinking fund installment
        with respect to Securities\nof such series, the Trustee shall be protected
        in withholding such notice if and so long as the board of directors, the executive
        committee or a trust committee of directors or Responsible Officers of the
        Trustee in good faith determine that the\nwithholding of such notice is in
        the interest of the Holders of Securities of such series; and <I>provided,
        further,</I> that in the case of any default of the character specified in
        Section&nbsp;501(4) with respect to Securities of such series, no\nsuch notice
        to Holders shall be given until at least 75 days after the occurrence thereof.
        For the purpose of this Section, the term &#147;<B><I>default</I></B>&#148;
        means any event that is, or after notice or lapse of time or both would become,
        an\nEvent of Default with respect to Securities of such series. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        603. <I>Certain Rights of Trustee</I>. Subject to the provisions of\nSection&nbsp;601
        and to the applicable provisions of the Trust Indenture Act: </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(a) the Trustee may rely and shall be\nprotected in acting or
        refraining from acting upon any resolution, certificate, statement, instrument,
        opinion, report, notice, request, direction, consent, order, bond, debenture,
        note, other evidence of indebtedness or other paper or document\nreasonably
        believed by it to be genuine and to have been signed or presented by the proper
        party or parties; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(b) any\nrequest
        or direction of the Company mentioned herein shall be sufficiently evidenced
        by a Company Request or Company Order, or as otherwise expressly provided
        herein, and any resolution of the Board of Directors may be sufficiently evidenced
        by a\nBoard Resolution; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(c)
        whenever in the administration of this Indenture the Trustee shall deem it
        desirable that a matter\nbe proved or established prior to taking, suffering
        or omitting any action hereunder, the Trustee (unless other evidence be herein
        specifically prescribed) may, in the absence of bad faith on its part, rely
        upon an Officer&#146;s Certificate and\nsuch Officer&#146;s Certificate, in
        the absence of negligence or bad faith on the part of the Trustee, shall be
        full warrant to the Trustee for any action taken, suffered or omitted by it
        under the provisions of this Indenture upon the faith\nthereof; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(d) the Trustee may consult with counsel and the written advice
        of such counsel or any Opinion of Counsel shall\nbe full and complete authorization
        and protection in respect of any action taken, suffered or omitted by it hereunder
        in good faith and in reliance thereon; </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(e)
        the Trustee shall be under no obligation to exercise any of the rights or
        powers vested in it by this Indenture at the\nrequest or direction of any
        of the Holders pursuant to this Indenture, unless such Holders shall have
        offered to the Trustee reasonable security or indemnity against the costs,
        expenses and liabilities that might be incurred by it in compliance with\nsuch
        request or direction; </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ;
        font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\">27 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(f)
        the Trustee shall not be bound to make any investigation into the facts\nor
        matters stated in any resolution, certificate, statement, instrument, opinion,
        report, notice, request, direction, consent, order, bond, debenture, note,
        other evidence of indebtedness or other paper or document, but the Trustee,
        in its\ndiscretion, may make such further inquiry or investigation into such
        facts or matters as it may see fit; and </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(g)
        the\nTrustee may execute any of the trusts or powers hereunder or perform
        any duties hereunder either directly or by or through agents or attorneys
        and the Trustee shall not be responsible for any misconduct or negligence
        on the part of any agent or\nattorney appointed with due care by it hereunder.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 604. <I>Not Responsible for Recitals
        or Issuance of Securities</I>. The\nrecitals contained herein and in the Securities,
        except the Trustee&#146;s certificate of authentication, shall be taken as
        the statements of the Company, and the Trustee or any Authenticating Agent
        assumes no responsibility for their correctness.\nThe Trustee makes no representations
        as to the validity or sufficiency of this Indenture or of the Securities of
        any series. The Trustee or any Authenticating Agent shall not be accountable
        for the use or application by the Company of Securities or\nthe proceeds thereof.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 605. <I>May Hold Securities</I>. The
        Trustee, any Authenticating Agent, any Paying Agent, any Security\nRegistrar
        or any other agent of the Company or the Trustee, in its individual or any
        other capacity, may become the owner or pledgee of Securities and, subject
        to Sections 608 and 613, may otherwise deal with the Company with the same
        rights it\nwould have if it were not Trustee, Authenticating Agent, Paying
        Agent, Security Registrar or such other agent. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        606. <I>Money Held\nin Trust</I>. Money held by the Trustee or by any Paying
        Agent (other than the Company if the Company shall act as Paying Agent) in
        trust hereunder need not be segregated from other funds except to the extent
        required by law. Neither the Trustee nor\nany Paying Agent shall be liable
        for interest on any money received by it hereunder except as expressly provided
        herein or otherwise agreed with the Company. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        607. <I>Compensation and Reimbursement</I>. The Company agrees </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(1) to pay to the Trustee from time to time reasonable compensation
        for all services rendered by it hereunder (which\ncompensation shall not be
        limited by any provision of law in regard to the compensation of a trustee
        of an express trust); </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(2)
        except as otherwise expressly provided herein, to reimburse the Trustee upon
        its request for all reasonable expenses,\ndisbursements and advances incurred
        or made by the Trustee in accordance with any provision of this Indenture
        (including the reasonable compensation and the expenses and disbursements
        of its agents and counsel), except any such expense, disbursement\nor advance
        as may be attributable to its negligence, willful misconduct or bad faith;
        and </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(3) to indemnify the Trustee\nfor,
        and to hold it harmless against, any loss, liability or expense reasonably
        incurred without negligence, willful misconduct or bad faith on its part,
        arising out of or in connection with the acceptance or administration of the
        trust or trusts\nhereunder or performance of its duties hereunder, including
        the costs and expenses of defending itself against any claim or liability
        in connection with the exercise or performance of any of its powers or duties
        hereunder. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">As security for the performance
        of the obligations of the Company under this Section, the Trustee shall have
        a claim prior to the Securities\nupon all property and funds held or collected
        by the Trustee as such, except property and funds held in trust for the payment
        of principal of and any premium and interest on particular Securities. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 608. <I>Disqualification; Conflicting
        Interests</I>. If the Trustee has or acquires any conflicting interest within
        the meaning of the\nTrust Indenture Act with respect to the Securities of
        any series, it shall either eliminate such conflicting interest or resign
        to the extent, in the manner and with the effect, and subject to the conditions,
        provided in the Trust Indenture Act and\nthis Indenture. For purposes of Section&nbsp;310(b)(1)
        of the Trust Indenture Act and to the extent permitted thereby, the Trustee,
        in its capacity as trustee in respect of the equally ranked and unsecured
        Securities of any series, shall not be\ndeemed to have a conflicting interest
        arising from its capacity as trustee in respect of the equally ranked and
        unsecured Securities of any other series under this Indenture. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">28 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 609.
        <I>Corporate Trustee Required; Eligibility</I>. There shall at all times be
        a\nTrustee hereunder that shall be a Person that is eligible pursuant to the
        Trust Indenture Act to act as such, having a combined capital and surplus
        of at least $50,000,000, subject to supervision or examination by federal
        or state authority and\nqualified and eligible under this Article, <I>provided</I>
        that, neither the Company nor any Affiliate of the Company or any obligor
        on the Securities may serve as Trustee of any Securities. If any such Person
        publishes reports of condition at least\nannually, pursuant to law or to the
        requirements of said supervising or examining authority, then for the purposes
        of this Section and to the extent permitted by the Trust Indenture Act, the
        combined capital and surplus of such Person shall be\ndeemed to be its combined
        capital and surplus as set forth in its most recent report of condition so
        published. If at any time the Trustee ceases to be eligible in accordance
        with the provisions of this Section, it shall resign immediately in the\nmanner
        and with the effect hereinafter specified in this Article. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        610. <I>Resignation and Removal; Appointment of Successor</I>.\n(a) No resignation
        or removal of the Trustee and no appointment of a successor Trustee pursuant
        to this Article shall become effective until the acceptance of appointment
        by the successor Trustee in accordance with the applicable requirements of\nSection&nbsp;611.
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(b) The Trustee may resign at any time with
        respect to the Securities of one or more series by giving written notice\nthereof
        to the Company. If the instrument of acceptance by a successor Trustee required
        by Section&nbsp;611 has not been delivered to the Trustee within 30 days after
        the giving of such notice of resignation, the resigning Trustee may petition
        any\ncourt of competent jurisdiction for the appointment of a successor Trustee
        with respect to the Securities of such series. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c)
        The Company\nmay at any time by a Board Resolution remove the Trustee with
        respect to the Securities of any or all series. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(d)
        The Trustee may be\nremoved at any time with respect to the Securities of
        any series by Act of the Holders of a majority in aggregate principal amount
        of the Outstanding Securities of such series, delivered to the Trustee and
        to the Company. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(e) If at any time: </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(1) the Trustee fails to comply
        with Section&nbsp;608 with respect to the Securities of any series, after
        written request\ntherefor by the Company or by any Holder who has been a bona
        fide Holder of a Security of such series for at least six months, or </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(2) the Trustee ceases to be
        eligible under Section&nbsp;609 and fails to resign after written request
        therefor by the Company\nor by any such Holder, or </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times
        New Roman\">(3) the Trustee becomes incapable of acting or becomes adjudged
        a bankrupt or insolvent or a\nreceiver of the Trustee or of its property is
        appointed or any public officer takes charge or control of the Trustee or
        of its property or affairs for the purpose of rehabilitation, conservation
        or liquidation, </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\">then, in any such case, subject to Section&nbsp;514,
        any Holder who has been a bona fide Holder of a Security for at least six
        months may, on behalf of\nhimself and all others similarly situated, petition
        any court of competent jurisdiction for the removal of the Trustee with respect
        to all Securities and the appointment of a successor Trustee or Trustees.
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(f) If the Trustee resigns, is removed or becomes
        incapable of acting, or if a vacancy shall occur in the office of Trustee
        for any cause, with\nrespect to the Securities of one or more series, the
        Company, by a Board Resolution, shall promptly appoint a successor Trustee
        or Trustees with respect to the Securities of that or those series (it being
        understood that any such successor Trustee\nmay be appointed with respect
        to the Securities of one or more or all of such series and that at any time
        there shall be only one Trustee with respect to the Securities of </P>\n <p
        STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">29
        </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em; margin-bottom:0em;
        page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\"
        ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\">\nany particular series) and shall comply with the applicable
        requirements of Section&nbsp;611. If, within one year after such resignation,
        removal or incapability, or the occurrence of such\nvacancy, a successor Trustee
        with respect to the Securities of any series is appointed by Act of the Holders
        of a majority in aggregate principal amount of the Outstanding Securities
        of such series delivered to the Company and the retiring Trustee,\nthe successor
        Trustee so appointed shall, forthwith upon its acceptance of such appointment
        in accordance with the applicable requirements of Section&nbsp;611, become
        the successor Trustee with respect to the Securities of such series and to
        that\nextent supersede the successor Trustee appointed by the Company. If
        no successor Trustee with respect to the Securities of any series has been
        so appointed by the Company or the Holders and accepted appointment in the
        manner required by\nSection&nbsp;611, any Holder who has been a bona fide
        Holder of a Security of such series for at least six months may, subject to
        Section&nbsp;514, on behalf of himself and all others similarly situated,
        petition any court of competent jurisdiction\nfor the appointment of a successor
        Trustee with respect to the Securities of such series. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(g)
        The Company shall give notice of each\nresignation and each removal of the
        Trustee with respect to the Securities of any series and each appointment
        of a successor Trustee with respect to the Securities of any series by mailing
        written notice of such event by first-class mail, postage\nprepaid, to all
        Holders of Securities of such series entitled to receive reports pursuant
        to Section&nbsp;704(3). Each notice shall include the name of the successor
        Trustee with respect to the Securities of such series and the address of its\nCorporate
        Trust Office. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(h) All provisions of this Section
        except subparagraph (d)&nbsp;and Section&nbsp;611(b) (except for the last\nclause,
        after omitting the words &#147;after deducting all amounts owed to the retiring
        Trustee pursuant to Section&nbsp;607,&#148; which shall apply) shall apply
        also to any Paying Agent located outside the United States and its possessions.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 611. <I>Acceptance of Appointment by
        Successor</I>. (a) In case of the appointment hereunder of a successor Trustee
        with respect to\nthe Securities of all series, every such successor Trustee
        so appointed shall execute, acknowledge and deliver to the Company and to
        the retiring Trustee an instrument accepting such appointment, and thereupon
        the resignation or removal of the\nretiring Trustee shall become effective
        and such successor Trustee, without any further act, deed or conveyance, shall
        become vested with all the rights, powers, trusts and duties of the retiring
        Trustee; but, on the request of the Company or the\nsuccessor Trustee, such
        retiring Trustee shall, upon payment of its charges, execute and deliver an
        instrument transferring to such successor Trustee all the rights, powers and
        trusts of the retiring Trustee and shall duly assign, transfer and\ndeliver
        to such successor Trustee all property and money held by such retiring Trustee
        hereunder. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(b) In case of the appointment
        hereunder\nof a successor Trustee with respect to the Securities of one or
        more (but not all) series, the Company, the retiring Trustee and each successor
        Trustee with respect to the Securities of one or more series shall execute
        and deliver an indenture\nsupplemental hereto wherein each successor Trustee
        shall accept such appointment and which (1)&nbsp;shall contain such provisions
        as shall be necessary or desirable to transfer and confirm to, and to vest
        in, each successor Trustee all the rights,\npowers, trusts and duties of the
        retiring Trustee with respect to the Securities of that or those series to
        which the appointment of such successor Trustee relates, (2)&nbsp;if the retiring
        Trustee is not retiring with respect to all Securities,\nshall contain such
        provisions as shall be deemed necessary or desirable to confirm that all the
        rights, powers, trusts and duties of the retiring Trustee with respect to
        the Securities of that or those series as to which the retiring Trustee is
        not\nretiring shall continue to be vested in the retiring Trustee, and (3)&nbsp;shall
        add to or change any of the provisions of this Indenture as shall be necessary
        to provide for or facilitate the administration of the trusts hereunder by
        more than one\nTrustee, it being understood that nothing herein or in such
        supplemental indenture shall constitute such Trustees <FONT STYLE=\"white-space:nowrap\">co-trustees</FONT>
        of the same trust and that each such Trustee shall be trustee of a trust or
        trusts\nhereunder separate and apart from any trust or trusts hereunder administered
        by any other such Trustee; and upon the execution and delivery of such supplemental
        indenture the resignation or removal of the retiring Trustee shall become
        effective to\nthe extent provided therein and each such successor Trustee,
        without any further act, deed or conveyance, shall become vested with all
        the rights, powers, trusts and duties of the retiring Trustee with respect
        to the Securities of that or those\nseries to which the appointment of such
        successor Trustee relates; but, on request of the Company or any successor
        Trustee, such retiring Trustee shall duly assign, transfer and deliver to
        such successor Trustee, all property and money held by such\nretiring Trustee
        hereunder with respect to the Securities of that or those series to which
        the appointment of such successor Trustee relates. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">30 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) Upon request
        of any such successor Trustee, the Company shall execute any and all\ninstruments
        for more fully and certainly vesting in and confirming to such successor Trustee
        all such rights, powers and trusts referred to in paragraph (a)&nbsp;or (b)
        of this Section, as the case may be. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(d) No successor
        Trustee shall accept its appointment unless at the time of such acceptance
        such successor Trustee shall be qualified and\neligible under this Article.
        </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 612. <I>Merger, Conversion, Consolidation
        or Succession to Business</I>. Any corporation into which\nthe Trustee may
        be merged or converted or with which it may be consolidated, or any corporation
        resulting from any merger, conversion or consolidation to which the Trustee
        shall be a party, or any corporation succeeding to all or substantially all\nthe
        corporate trust business of the Trustee, shall be the successor of the Trustee
        hereunder, <I>provided</I> such corporation shall be otherwise qualified and
        eligible under this Article, without the execution or filing of any paper
        or any further\nact on the part of any of the parties hereto. In case any
        Securities shall have been authenticated, but not delivered, by the Trustee
        then in office, any successor by merger, conversion or consolidation to such
        authenticating Trustee may adopt such\nauthentication and deliver the Securities
        so authenticated with the same effect as if such successor Trustee had itself
        authenticated such Securities. In case any Securities shall not have been
        authenticated by such predecessor Trustee, any such\nsuccessor Trustee may
        authenticate and deliver such Securities, in either its own name or that of
        its predecessor Trustee, with the full force and effect which this Indenture
        provides for the certificate of authentication of the Trustee. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        613. <I>Preferential Collection of Claims Against Company</I>. The Trustee
        shall comply with Trust Indenture Act &#167;&nbsp;311(a),\nexcluding any creditor
        relationship listed in Trust Indenture Act &#167;&nbsp;311(b). A Trustee who
        has resigned or been removed shall be subject to Trust Indenture Act &#167;&nbsp;311(a)
        to the extent indicated therein. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 614.
        <I>Appointment of Authenticating Agent</I>. (a) At any time when any of the
        Securities remain Outstanding the Trustee may appoint\nan Authenticating Agent
        or Agents (which may include any Person that owns, directly or indirectly,
        all of the capital stock of the Trustee or a corporation that is a wholly-owned
        subsidiary of the Trustee or of such other Person) with respect to one\nor
        more series of Securities, or any Tranche thereof, that shall be authorized
        to act on behalf of the Trustee to authenticate Securities of such series
        or Tranche issued upon original issuance, exchange, registration of transfer
        or partial\nredemption thereof or pursuant to Section&nbsp;306, and Securities
        so authenticated shall be entitled to the benefits of this Indenture and shall
        be valid and obligatory for all purposes as if authenticated by the Trustee
        hereunder. Wherever\nreference is made in this Indenture to the authentication
        and delivery of Securities by the Trustee or the Trustee&#146;s certificate
        of authentication, such reference shall be deemed to include authentication
        and delivery on behalf of the Trustee\nby an Authenticating Agent and a certificate
        of authentication executed on behalf of the Trustee by an Authenticating Agent.
        Each Authenticating Agent shall be acceptable to the Company and shall at
        all times be a corporation organized and doing\nbusiness under the laws of
        the United States of America, any state thereof or the District of Columbia,
        authorized under such laws to act as Authenticating Agent, having a combined
        capital and surplus of not less than $50,000,000 and subject to\nsupervision
        or examination by federal or state authority in the United States. If such
        Authenticating Agent publishes reports of condition at least annually, pursuant
        to law or to the requirements of said supervising or examining authority,
        then for\nthe purposes of this Section, the combined capital and surplus of
        such Authenticating Agent shall be deemed to be its combined capital and surplus
        as set forth in its most recent report of condition so published. If at any
        time an Authenticating\nAgent ceases to be eligible in accordance with the
        provisions of this Section, such Authenticating Agent shall resign immediately
        in the manner and with the effect specified in this Section. </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b)
        Any corporation into which an Authenticating Agent may be merged or converted
        or with which it may be consolidated, or any corporation\nresulting from any
        merger, conversion or consolidation to which such Authenticating Agent shall
        be a party, or any corporation succeeding to the corporate agency or corporate
        trust business of an Authenticating Agent, shall continue to be an\nAuthenticating
        Agent, <I>provided</I> such corporation shall be otherwise eligible under
        this Section, without the execution or filing of any paper or any further
        act on the part of the Trustee or the Authenticating Agent. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">31 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) An Authenticating
        Agent may resign with respect to one or more series of Securities at\nany
        time by giving written notice thereof to the Trustee and to the Company. The
        Trustee may at any time terminate the agency of an Authenticating Agent with
        respect to one or more series of Securities by giving written notice thereof
        to such\nAuthenticating Agent and to the Company. Upon receiving such a notice
        of resignation or upon such a termination, or in case at any time such Authenticating
        Agent ceases to be eligible in accordance with the provisions of this Section,
        the Trustee\nmay appoint a successor Authenticating Agent that is acceptable
        to the Company and shall provide notice of such appointment to all Holders
        of Securities of the series or Tranche with respect to which such Authenticating
        Agent will serve, as provided\nin paragraph (a)&nbsp;of this Section. Any
        successor Authenticating Agent upon acceptance of its appointment hereunder
        shall become vested with all the rights, powers and duties of its predecessor
        hereunder, with like effect as if originally named\nas an Authenticating Agent.
        No successor Authenticating Agent shall be appointed unless eligible under
        the provisions of this Section. An Authenticating Agent appointed pursuant
        to this Section shall be entitled to rely on Sections 111, 308, 604 and\n605
        hereunder. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(d) The Trustee agrees to pay
        to each Authenticating Agent from time to time reasonable compensation for
        its services under\nthis Section, and the Trustee shall be entitled to be
        reimbursed for such payments, subject to the provisions of Section&nbsp;607.
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(e) If\nan appointment with respect to the Securities
        of one or more series, or any Tranche thereof, is made pursuant to this Section,
        the Securities of such series or Tranche may have endorsed thereon, in addition
        to the Trustee&#146;s certificate of\nauthentication, an alternate certificate
        of authentication in the following form: </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">This
        is one of the Securities of the series designated\npursuant to and issued
        under the within-mentioned Indenture. </P> <P STYLE=\"font-size:12pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P><DIV
        ALIGN=\"right\">\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" WIDTH=\"40%\"
        BORDER=\"0\" STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman;
        font-size:10pt\">\n\n\n<TR>\n\n<TD WIDTH=\"5%\"></TD>\n\n<TD VALIGN=\"bottom\"
        WIDTH=\"1%\"></TD>\n<TD WIDTH=\"94%\"></TD></TR>\n\n\n<TR STYLE=\"page-break-inside:avoid
        ; font-family:Times New Roman; font-size:10pt\">\n<TD VALIGN=\"top\" COLSPAN=\"3\">[&#8195;&#8195;&#8195;&#8195;
        ]</TD></TR>\n<TR STYLE=\"page-break-inside:avoid ; font-family:Times New Roman;
        font-size:10pt\">\n<TD VALIGN=\"top\" COLSPAN=\"3\">As Trustee</TD></TR>\n<TR
        STYLE=\"font-size:1pt\">\n<TD HEIGHT=\"16\"></TD>\n<TD HEIGHT=\"16\" COLSPAN=\"2\"></TD></TR>\n<TR
        STYLE=\"page-break-inside:avoid ; font-family:Times New Roman; font-size:10pt\">\n<TD
        VALIGN=\"top\">By</TD>\n<TD VALIGN=\"bottom\">&nbsp;</TD>\n<TD VALIGN=\"top\">
        <P STYLE=\"margin-top:0pt; margin-bottom:1pt; border-bottom:1px solid #000000;
        font-size:10pt; font-family:Times New Roman\">&nbsp;</P></TD></TR>\n<TR STYLE=\"page-break-inside:avoid
        ; font-family:Times New Roman; font-size:10pt\">\n<TD VALIGN=\"top\"></TD>\n<TD
        VALIGN=\"bottom\">&nbsp;</TD>\n<TD VALIGN=\"top\" ALIGN=\"center\">As Authenticating
        Agent on behalf of the Trustee</TD></TR>\n<TR STYLE=\"font-size:1pt\">\n<TD
        HEIGHT=\"16\"></TD>\n<TD HEIGHT=\"16\" COLSPAN=\"2\"></TD></TR>\n<TR STYLE=\"page-break-inside:avoid
        ; font-family:Times New Roman; font-size:10pt\">\n<TD VALIGN=\"top\">By</TD>\n<TD
        VALIGN=\"bottom\">&nbsp;</TD>\n<TD VALIGN=\"top\"> <P STYLE=\"margin-top:0pt;
        margin-bottom:1pt; border-bottom:1px solid #000000; font-size:10pt; font-family:Times
        New Roman\">&nbsp;</P></TD></TR>\n<TR STYLE=\"page-break-inside:avoid ; font-family:Times
        New Roman; font-size:10pt\">\n<TD VALIGN=\"top\"></TD>\n<TD VALIGN=\"bottom\">&nbsp;</TD>\n<TD
        VALIGN=\"top\" ALIGN=\"center\">Authorized Officer of Authenticating Agent</TD></TR>\n</TABLE></DIV>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\">Dated: <U></U><U>&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;&#8195;</U>
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(f) If all of the Securities of a series may
        not be originally issued at one time, and if the Trustee does not have an
        office capable of\nauthenticating Securities upon original issuance located
        in a Place of Payment where the Company wishes to have Securities of such
        series authenticated upon original issuance, the Trustee, if so requested
        by the Company in writing (which writing\nneed not comply with Section&nbsp;102
        and need not be accompanied by an Opinion of Counsel), shall appoint, in accordance
        with this Section and in accordance with such procedures as shall be acceptable
        to the Trustee, an Authenticating Agent (which,\nif so requested by the Company,
        may be an Affiliate of the Company) having an office in a Place of Payment
        designated by the Company with respect to such series of Securities. </P>\n
        <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P
        STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">32 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\"><B>ARTICLE SEVEN </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>HOLDERS&#146;
        LISTS AND REPORTS BY TRUSTEE AND COMPANY </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        701. <I>Company to Furnish Trustee Names and Addresses of Holders</I>. The
        Company will furnish or cause to be furnished to the\nTrustee </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(a) semi-annually, not later than the 5th day after each Regular
        Record Date for each series of Securities at the\ntime Outstanding or on June&nbsp;30
        and December&nbsp;31 of each year with respect to each series of Securities
        for which there are no Regular Record Dates, a list, in such form as the Trustee
        may reasonably require, containing all the information\nin the possession
        or control of the Company, or any of its Paying Agents other than the Trustee,
        of the names and addresses of the Holders of Securities of such series, including
        Holders of interests in Global Securities, as of such preceding\nRegular Record
        Date or on June&nbsp;15 or December&nbsp;15, as the case may be, or, in the
        case of a series of <FONT STYLE=\"white-space:nowrap\">non-interest</FONT>
        bearing Securities, on a date to be determined as contemplated pursuant to\nSection&nbsp;301(b),
        and </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(b) at such other times as the
        Trustee may request in writing, within 30 days after the receipt\nby the Company
        of any such request, a list of similar form and content as of a date not more
        than 15 days prior to the time such list is furnished; </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\"><I>excluding</I>
        from any such list names and addresses received by the Trustee in its capacity
        as Security Registrar. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 702.
        <I>Preservation of Information; Communications to Holders</I>. (a) The Trustee
        shall preserve, in as current a form as is\nreasonably practicable, the names
        and addresses of Holders of Securities contained in the most recent list furnished
        to the Trustee as provided in Section&nbsp;701 and the names and addresses
        of Holders of Securities received by the Trustee in its\ncapacity as Security
        Registrar or Paying Agent. The Trustee may destroy any list furnished to it
        as provided in Section&nbsp;701 upon receipt of a new list so furnished. </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(b) If three or more Holders (herein referred
        to as &#147;applicants&#148;) apply in writing to the Trustee, and furnish
        to the Trustee\nreasonable proof that each such applicant has owned a Security
        for a period of at least six months preceding the date of such application,
        and such application states that the applicants desire to communicate with
        other Holders with respect to their\nrights under this Indenture or under
        the Securities and is accompanied by a copy of the form of proxy or other
        communication that such applicants propose to transmit, then the Trustee shall,
        within five business days after the receipt of such\napplication, at its election,
        either </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(i) afford such
        applicants access to the information preserved at the time by the\nTrustee
        in accordance with Section&nbsp;702(a), or </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:9%; font-size:10pt; font-family:Times
        New Roman\">(ii) inform such applicants as to the approximate number of Holders\nwhose
        names and addresses appear in the information preserved at the time by the
        Trustee in accordance with Section&nbsp;702(a), and as to the approximate
        cost of mailing to such Holders the form of proxy or other communication,
        if any, specified in\nsuch application. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">If the Trustee
        elects not to afford such applicants access to such information, the Trustee
        shall, upon the written\nrequest of such applicants, mail to each Holder whose
        name and address appear in the information preserved at the time by the Trustee
        in accordance with Section&nbsp;702(a) a copy of the form of proxy or other
        communication that is specified in such\nrequest, with reasonable promptness
        after a tender to the Trustee by the applicants of the material to be mailed
        and of payment, or provision for the payment, of the reasonable expenses of
        mailing, unless within five days after such tender the\nTrustee shall mail
        to such applicants and file with the Commission, together with a copy of the
        material to be mailed, a written statement to the effect that, in the opinion
        of the Trustee, such mailing would be contrary to the best interest of the\nHolders
        or would be in violation of applicable law. Such written statement shall specify
        the basis of such opinion. If the Commission, after opportunity for a hearing
        upon the objections specified in the written statement so filed, enters an
        order\nrefusing to sustain any of such objections or if, after the entry of
        an order sustaining one or more of such objections, the Commission finds,
        after notice and opportunity for hearing, that all the objections so sustained
        have been met and enters an\norder so declaring, the Trustee shall mail copies
        of such material to all such Holders with reasonable promptness after the
        entry of such order and the renewal of such tender by such applicants; otherwise
        the Trustee shall be relieved of any\nobligation or duty to such applicants
        respecting their application. </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) Every Holder
        of Securities, by receiving and holding the same,\nagrees with the Company
        and the Trustee that neither the Company nor the Trustee nor any agent of
        either of them shall be held accountable by reason of the disclosure of any
        such information as to the names and addresses of the Holders in accordance\nwith
        Section&nbsp;702(b), regardless of the source from which such information
        was derived, and that the Trustee shall not be held accountable by reason
        of mailing any material pursuant to a request made under Section&nbsp;702(b).
        </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">33 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 703. <I>Reports by Trustee</I>. (a)
        The Trustee shall transmit to Holders such\nreports concerning the Trustee
        the Trustee and its actions under this Indenture as may be required pursuant
        to the Trust Indenture Act at the times and in the manner provided pursuant
        thereto. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(b) Reports so required to be
        transmitted at stated intervals of not more than 12 months shall be transmitted
        no later than July&nbsp;1 in each\ncalendar year, commencing with the first
        July&nbsp;1 after the first issuance of Securities pursuant to this Indenture.
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(c) A copy of each\nsuch report shall, at the
        time of such transmission to Holders, be filed by the Trustee with each securities
        exchange upon which any Securities are listed, with the Commission and with
        the Company. The Company will notify the Trustee in writing when\nany Securities
        are listed on any securities exchange. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 704.
        <I>Reports by Company</I>. The Company shall: </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(1) file with the Trustee, within 15 days after the Company files
        the same with the Commission, copies of the annual reports\nand of the information,
        documents and other reports (or copies of such portions of any of the foregoing
        as the Commission may from time to time by rules and regulations prescribe)
        that the Company may be required to file with the Commission pursuant\nto
        Section&nbsp;13 or Section&nbsp;15(d) of the U.S. Securities Exchange Act
        of 1934; or, if the Company is not required to file information, documents
        or reports pursuant to either of said Sections, then it shall file with the
        Trustee and the\nCommission, in accordance with rules and regulations prescribed
        from time to time by the Commission, such of the supplementary and periodic
        information, documents and reports that may be required pursuant to Section&nbsp;13
        of the U.S. Securities\nExchange Act of 1934 in respect of a security listed
        and registered on a national securities exchange as may be prescribed from
        time to time in such rules and regulations; and provided, however, that so
        long as such filings by the Company are\navailable on the Commission&#146;s
        Electronic Data Gathering, Analysis and Retrieval System (EDGAR) or any successor
        system, such filings shall be deemed to have been filed with the Trustee for
        purposes hereof without any further action required by\nthe Company; </P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(2) file with the Trustee and
        the Commission, in accordance with rules and regulations prescribed by the\nCommission,
        such additional information, documents and reports with respect to compliance
        by the Company with the conditions and covenants of this Indenture as may
        be required from time to time by such rules and regulations; and </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(3) transmit by mail to all
        Holders of Securities, as their names and addresses appear in the Security
        Register, and to each\nHolder whose name and address is then preserved on
        the Trustee&#146;s list pursuant to the first sentence of Section&nbsp;702(a),
        within 30 days after the filing thereof with the Trustee, such summaries of
        any information, documents and reports\nrequired to be filed by the Company
        pursuant to paragraphs (1)&nbsp;and (2) of this Section as may be required
        by rules and regulations prescribed from time to time by the Commission. </P>\n<P
        STYLE=\"margin-top:24pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\"><B>ARTICLE EIGHT </B></P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>CONSOLIDATION,
        MERGER, CONVEYANCE OR TRANSFER </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 801.
        <I>Company May Consolidate, Etc. Only on Certain Terms</I>. The Company shall
        not consolidate with or merge with or into, or\nconvey, transfer or lease
        all or substantially all of its properties and assets to, any other Person,
        unless: </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">34 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(1) either (x)&nbsp;the Company
        shall be the continuing entity or the\nsuccessor Person (if other than the
        Company) or (y)&nbsp;the Person formed by such consolidation or into which
        the Company is merged or the Person that acquires by conveyance, transfer
        or lease all or substantially all of the properties and assets\nof the Company
        shall be a Person organized and existing under the laws of the United States
        of America, any State thereof or the District of Columbia and shall expressly
        assume, by an indenture supplemental hereto, executed and delivered to the\nTrustee,
        in form reasonably satisfactory to the Trustee, the due and punctual payment
        of the principal of and any premium and interest on all the Outstanding Securities
        and the performance of every covenant of this Indenture on the part of the\nCompany
        to be performed or observed; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(2)
        immediately after giving effect to such transaction, no Event of Default and
        no\nevent that, after notice or lapse of time or both, would become an Event
        of Default, shall have occurred and be continuing; and </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(3) the Company has delivered to the Trustee an Officer&#146;s
        Certificate and an Opinion of Counsel, each stating that such\ntransaction
        and such supplemental indenture, if any, complies with this Indenture (except
        that such Opinion of Counsel need not opine as to clause (2)&nbsp;above).
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">Notwithstanding the above, any Subsidiary of
        the Company may consolidate with, merge into or transfer all or part of its
        properties to the\nCompany and neither an Officer&#146;s Certificate nor an
        Opinion of Counsel shall be required to be delivered in connection therewith.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 802. <I>Successor Substituted for the
        Company</I>. Upon any consolidation or merger or any conveyance, transfer
        or lease of all or\nsubstantially all the properties and assets of the Company
        in accordance with Section&nbsp;801, the successor Person formed by such consolidation
        or into which the Company is merged or to which such conveyance, transfer
        or lease is made shall\nsucceed to, and be substituted for, and may exercise
        every right and power of, the Company under this Indenture with the same effect
        as if such successor Person had been named as the Company herein and thereafter,
        in the case of a conveyance,\ntransfer or lease of properties and assets of
        the Company substantially as an entirety, such conveyance, transfer or lease
        shall have the effect of releasing the Person named as the &#147;Company&#148;
        in the first paragraph of this instrument or\nany successor Person that shall
        theretofore have become such in the manner prescribed in this Article from
        its liability as obligor and maker on any of the Securities. </P>\n<P STYLE=\"margin-top:24pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>ARTICLE
        NINE </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>SUPPLEMENTAL INDENTURES
        </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 901. <I>Supplemental Indentures Without
        Consent of Holders</I>. Without the consent of any Holders, the Company and
        the Trustee, at\nany time and from time to time, may enter into one or more
        indentures supplemental hereto, in form satisfactory to the Trustee, for any
        of the following purposes: </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(1)
        to evidence the succession of another Person to the Company and the assumption
        by any such successor of the covenants of\nthe Company herein and in the Securities;
        or </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(2) to add to the covenants
        of the Company for the benefit of the Holders of\nall or any series of Securities
        (and if such covenants are to be for the benefit of less than all series of
        Securities, stating that such covenants are expressly being included solely
        for the benefit of such series), or to surrender any right or\npower herein
        conferred upon the Company; or </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(3)
        to add any additional Events of Default with respect to all or any series\nof
        Securities Outstanding hereunder; or </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(4)
        to change or eliminate any of the provisions of this Indenture, or to add
        any\nnew provision to this Indenture, in respect of one or more series of
        Securities; <I>provided</I>, <I>however</I>, that any such change, elimination
        or addition (A)&nbsp;shall neither (i)&nbsp;apply to any Security Outstanding
        on the date of such\nindenture supplemental hereto nor (ii)&nbsp;modify the
        rights of the Holder of any such Security Outstanding with respect to such
        provision in effect prior to the date of such indenture supplemental hereto
        or (B)&nbsp;shall become effective only\nwhen no Security of such series remains
        Outstanding; or </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P>
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; font-size:10pt; font-family:Times
        New Roman\" ALIGN=\"center\">35 </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em;
        margin-bottom:0em; page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\"
        WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(5) to add guarantees or collateral
        security with respect to the Securities\nof any series; or </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(6) to establish for the issuance of and establish the form or
        terms and conditions of Securities of any\nseries or Tranche thereof as permitted
        by Section&nbsp;301(b), and to establish the form of any certificates required
        to be furnished pursuant to the terms of this Indenture or any series of Securities;
        or </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(7) to provide for uncertificated
        Securities in addition to or in place of all, or any series or Tranche of,
        certificated\nSecurities; or </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(8)
        to evidence and provide for the acceptance of appointment hereunder by a separate
        or successor Trustee\nor <FONT STYLE=\"white-space:nowrap\">co-trustee</FONT>
        with respect to the Securities of one or more series and to add to or change
        any of the provisions of this Indenture as shall be necessary to provide for
        or facilitate the administration of the\ntrusts hereunder by more than one
        Trustee, pursuant to the requirements of Section&nbsp;611(b); or </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(9) to change any place\nor places where (a)&nbsp;the principal
        of or premium, if any, or interest, if any, on all or any series of Securities,
        or any Tranche thereof, shall be payable, (b)&nbsp;all or any series of Securities,
        or any Tranche thereof, may be surrendered for\nregistration or transfer,
        (c)&nbsp;all or any series of Securities, or any Tranche thereof, may be surrendered
        for exchange and (d)&nbsp;notices and demands to or upon the Company in respect
        of all or any series of Securities, or any Tranche\nthereof, and this Indenture
        may be served; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(10) to supplement
        any of the provisions of this Indenture to such extent as\nshall be necessary
        to permit or facilitate the defeasance and discharge of any series of Securities,
        or any Tranche thereof, pursuant to Article Four, provided that any such action
        shall not adversely affect the interests of the Holders of\nSecurities of
        such series or Tranche or any other series of Securities in any material respect;
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:4%;
        font-size:10pt; font-family:Times New Roman\">(11) to comply with the\nApplicable
        Procedures of any applicable Depositary; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(12)
        to comply with the rules or regulations of any applicable\nsecurities exchange
        or automated quotation system on which any of the Securities may be listed
        or traded; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(13) subject
        to\nany limitations established pursuant to Section&nbsp;301, to provide for
        the issuance of additional Securities of any series; </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(14) (i) to cure any ambiguity or to correct or supplement any
        provision contained herein or in any supplemental indenture that\nmay be defective
        or inconsistent with any other provision contained herein or in any supplemental
        indenture or (ii)&nbsp;to conform the terms of any series of Securities, or
        Tranche thereof, to the description thereof in the prospectus and\nprospectus
        supplement (or similar offering document) offering such series of Securities,
        or Tranche thereof; or </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(15)
        to\nmake any other provisions with respect to matters or questions arising
        under this Indenture, <I>provided</I> such action shall not adversely affect
        the interests of the Holders of any Securities of any series or Tranche Outstanding
        on the date of\nsuch indenture supplemental hereto. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">Without
        limiting the generality of the foregoing, if the Trust Indenture Act as in
        effect at the date\nof the execution and delivery of this Indenture or at
        any time thereafter becomes amended and </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(x) if any such
        amendment requires one or\nmore changes to any provisions hereof or the inclusion
        herein of any additional provisions, or by operation of law is deemed to effect
        such changes or incorporate such provisions by reference or otherwise, this
        Indenture shall be deemed to have been\namended so as to conform to such amendment
        to the Trust Indenture Act, and the Company and the Trustee may, without the
        consent of any Holders, enter into an indenture supplemental hereto to effect
        or evidence such changes or additional provisions;\nor </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">36 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(y) if any such
        amendment permits one or more changes to, or the elimination of, any\nprovisions
        hereof that, at the date hereof or at any time thereafter, are required by
        the Trust Indenture Act to be contained herein (or if it is no longer required
        by the Trust Indenture Act for the Indenture to contain one or more provisions),\nthis
        Indenture shall be deemed to have been amended to effect such changes or elimination,
        and the Company and the Trustee may, without the consent of any Holders, enter
        into an indenture supplemental hereto to evidence such amendment hereof; or\n</P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(z) if, by reason of any such amendment, it
        shall be no longer necessary for this Indenture to contain one or more provisions
        that, at the\ndate of the execution and delivery hereof, are required by the
        Trust Indenture Act to be contained herein, the Company and the Trustee may,
        without the consent of any Holders, enter into an indenture supplemental hereto
        to effect the elimination of\nsuch provisions. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        902. <I>Supplemental Indentures With Consent of Holders</I>. (a) Except as
        set forth in paragraph\n(b)&nbsp;below, with the consent of the Holders of
        not less than a majority in aggregate principal amount of the Outstanding
        Securities of each series affected (voting as one class) by such supplemental
        indenture (including consents obtained in\nconnection with a tender offer
        or exchange offer for the Securities of such series), by Act of said Holders
        delivered to the Company and the Trustee, the Company and the Trustee may
        enter into an indenture or indentures supplemental hereto for the\npurpose
        of adding any provisions to or changing in any manner or eliminating any of
        the provisions of this Indenture or of any supplemental indenture or of modifying
        in any manner the rights of the Holders of the Securities of each such series
        or of\nmodifying in any manner the rights of the Holders of Securities of
        such series under this Indenture; <I>provided, however,</I> that if there
        are Securities of more than one series of equal ranking Outstanding hereunder
        and if a proposed supplemental\nindenture shall directly affect the rights
        of the Holders of Securities of one or more, but less than all, of such series,
        then the consent only of the Holders of not less than a majority in aggregate
        principal amount of the Outstanding Securities\nof all series so directly
        affected, considered as one class, shall be required. </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b)
        No such supplemental indenture shall, without the\nconsent of the Holder of
        each Outstanding Security of the series affected thereby, </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(1) change the Stated Maturity of the\nprincipal of, or any installment
        of principal of or interest on, any Security, or reduce the principal amount
        or premium, if any, thereof or the rate of interest thereon (or the amount
        of any installment of interest thereon) or any premium payable\nupon the redemption
        thereof, or change the method of calculating the rate of interest thereon,
        or reduce the amount of the principal of an Original Issue Discount Security
        that would be due and payable upon a declaration of acceleration of the\nMaturity
        thereof pursuant to Section&nbsp;502, or change the coin or currency (or other
        property) in which, any Security or any premium or the interest thereon is
        payable, or impair the right to institute suit for the enforcement of any
        such payment\non or after the Stated Maturity thereof (or, in the case of
        redemption, on or after the Redemption Date, or, in the case of repayment
        at the option of the Holders, on or after the Repayment Date), or modify any
        provisions of this Indenture with\nrespect to the conversion or exchange of
        the Securities into Securities of another series or into any other debt or
        equity securities in a manner adverse to the Holders, or </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(2) reduce the percentage in principal amount of the Outstanding
        Securities of any series, the consent of whose Holders is\nrequired for any
        such supplemental indenture, or the consent of whose Holders is required for
        any waiver of compliance with certain provisions of this Indenture or certain
        defaults hereunder and their consequences provided for in this Indenture,
        or\n</P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(3) modify any of the provisions
        of this Section, Section&nbsp;513 or Section&nbsp;1008, except to increase
        any such\npercentage or to provide that certain other provisions of this Indenture
        cannot be modified or waived without the consent of the Holder of each Outstanding
        Security affected thereby, <I>provided</I>, <I>however</I>, that this clause
        shall not be\ndeemed to require the consent of any Holder with respect to
        changes in the references to &#147;the Trustee&#148; and concomitant changes
        in this Section and Section&nbsp;1008, or the deletion of this proviso, in
        accordance with the requirements of\nSections 611(b) and 901(8). </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">A
        supplemental indenture that changes or eliminates any covenant or other provision
        of this Indenture that\nhas expressly been included solely for the benefit
        of one or more particular series of Securities, or that modifies the rights
        of the Holders of Securities of such series with respect to such covenant
        or other provision, shall be deemed not to\naffect the rights under this Indenture
        of the Holders of Securities of any other series. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">37 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">It shall not
        be necessary for any Act of Holders under this Section to approve the\nparticular
        form of any proposed supplemental indenture, but it shall be sufficient if
        such Act shall approve the substance thereof. A waiver by a Holder of such
        Holder&#146;s rights to consent under this Section shall be deemed to be a
        consent of\nsuch Holder. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 903.
        <I>Execution of Supplemental Indentures</I>. In executing, or accepting the
        additional trusts created by, any\nsupplemental indenture permitted by this
        Article or the modifications thereby of the trusts created by this Indenture,
        the Trustee shall be entitled to receive, and (subject to Section&nbsp;601)
        shall be fully protected in relying upon, an Opinion\nof Counsel stating that
        the execution of such supplemental indenture is authorized or permitted by
        this Indenture. The Trustee may, but shall not be obligated to, enter into
        any such supplemental indenture that affects the Trustee&#146;s own rights,\nduties
        or immunities under this Indenture or otherwise. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        904. <I>Effect of Supplemental Indentures</I>. Upon the execution of any\nsupplemental
        indenture under this Article, this Indenture shall be modified in accordance
        therewith, and such supplemental indenture shall form a part of this Indenture
        for all purposes; and every Holder of Securities theretofore or thereafter\nauthenticated
        and delivered hereunder shall be bound thereby. Any supplemental indenture
        permitted by this Article may restate this Indenture in its entirety, and,
        upon the execution and delivery thereof, any such restatement shall supersede
        this\nIndenture as theretofore in effect for all purposes. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        905. <I>Conformity With Trust Indenture Act</I>. Every supplemental\nindenture
        executed pursuant to this Article shall conform to the requirements of the
        Trust Indenture Act as then in effect. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 906.\n<I>Reference
        in Securities to Supplemental Indentures</I>. Securities of any series, or
        any Tranche thereof, authenticated and delivered after the execution of any
        supplemental indenture pursuant to this Article may, and shall if required
        by the\nTrustee, bear a notation in form approved by the Trustee as to any
        matter provided for in such supplemental indenture. If the Company so determines,
        new Securities of any series, or any Tranche thereof, so modified as to conform,
        in the opinion of\nthe Trustee and the Company, to any such supplemental indenture
        may be prepared and executed by the Company and authenticated and delivered
        by the Trustee in exchange for Outstanding Securities of such series or Tranche.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 907. <I>Revocation and Effect of Consents</I>.
        Until an amendment or waiver becomes effective, a consent to it by a Holder
        of a\nSecurity is a continuing consent by the Holder and every subsequent
        Holder of a Security or portion of a Security that evidences the same debt
        as the consenting Holder&#146;s Security, even if notation of the consent
        is not made on any Security.\nHowever, any such Holder or subsequent Holder
        may revoke the consent as to his Security or portion of a Security if the
        Trustee receives the notice of revocation before the date on which the Trustee
        receives an Officer&#146;s Certificate certifying\nthat the Holders of the
        requisite principal amount of Securities have consented to the amendment or
        waiver. After an amendment or waiver becomes effective, it shall bind every
        Holder of each series of Securities affected by such amendment or waiver.\n</P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">The Company may, but shall not be obligated
        to, fix a record date for the purpose of determining the Holders entitled
        to consent to any\namendment or waiver. If a record date is fixed, then notwithstanding
        the provisions of the immediately preceding paragraph, those persons who were
        Holders at such record date (or their duly designated proxies), and only those
        persons, shall be\nentitled to consent to such amendment or waiver or to revoke
        any consent previously given, whether or not such persons continue to be Holders
        after such record date. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">After an amendment
        or waiver becomes effective it shall bind every Holder, unless it is of the
        type described in any of clauses\n(1)&nbsp;through (3) of Section&nbsp;902(c).
        In such case, the amendment or waiver shall bind each Holder of a Security
        who has consented to it and every subsequent Holder of a Security that evidences
        the same debt as the consenting Holder&#146;s\nSecurity. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        908. <I>Modification Without Supplemental Indenture</I>. If the terms of any
        particular series of Securities have been\nestablished in a Board Resolution
        or an Officer&#146;s Certificate as contemplated by Section&nbsp;301, and
        not in an indenture supplemental hereto, additions to, changes in or the elimination
        of any of such terms may be effected by means of a\nsupplemental Board Resolution
        or Officer&#146;s Certificate, as the case may be, delivered to, and accepted
        by, the Trustee; <I>provided, however</I>, that such supplemental Board Resolution
        or Officer&#146;s Certificate shall not be accepted by the\nTrustee or otherwise
        be effective unless all conditions set forth in this Indenture that would
        be required to be satisfied if such additions, changes or elimination were
        contained in a supplemental indenture shall have been appropriately satisfied.\nUpon
        the acceptance thereof by the Trustee, any such supplemental Board Resolution
        or Officer&#146;s Certificate shall be deemed to be a &#147;supplemental indenture&#148;
        for purposes of Sections 904 and 906. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">38 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>ARTICLE
        TEN </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>COVENANTS </B></P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        1001.\n<I>Payment of Principal, Premium and Interest</I>. (a) Subject to the
        following provisions, the Company will pay to the Trustee the amounts, in
        such coin or currency as is at the time legal tender for the payment of public
        or private debt, in the\nmanner, at the times and for the purposes set forth
        herein and in the text of the Securities for each series, and the Company
        hereby authorizes and directs the Trustee from funds so paid to it to make
        or cause to be made payment of the principal of\nand any premium and interest
        on the Securities of each series as set forth herein and in the text of such
        Securities. Unless otherwise provided in the Securities of a series, the Trustee
        will arrange directly with any Paying Agents for the payment,\nor the Trustee
        will make payment, from funds furnished by the Company, of the principal of
        and any premium and interest, on the Securities of each series by check or
        draft. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(b) Unless otherwise provided
        in the Securities of a series, interest, if any, on Securities of a series
        shall be paid by check or draft on\neach Interest Payment Date for such series
        to the Holder thereof at the close of business on the Regular Record Date
        specified in the Securities of such series; <I>provided</I>, <I>however</I>,
        that interest payable at Maturity will be paid to the\nPerson to whom principal
        is payable. The Company may pay such interest by check or draft mailed to
        such Holder&#146;s address as it appears on the register for Securities of
        such series. Unless otherwise provided in the Securities of a series,\nprincipal
        of Securities shall be payable by check or draft and only against presentation
        and surrender of such Securities at the office of the Paying Agent, unless
        the Company shall have otherwise instructed the Trustee in writing. </P>\n<P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(c) At the election of the Company, any payments
        by the Company provided for in this Indenture or in any of the Securities
        may be made by\nelectronic funds transfer. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        1002. <I>Maintenance of Office or Agency</I>. (a) The Company will maintain
        in each Place of Payment\nfor any series of Securities, or any Tranche thereof,
        an office or agency where Securities, or any Tranche thereof, of that series
        may be surrendered for registration of transfer or exchange and a Place of
        Payment where (subject to Sections 305 and\n307) Securities may be presented
        for payment or exchange and where notices and demands to or upon the Company
        in respect of the Securities of that series and this Indenture may be served.
        The Security Registrar shall keep a register with respect to\neach series
        of Securities and to their transfer and exchange. The Company may appoint
        one or more <FONT STYLE=\"white-space:nowrap\">co-Security</FONT> Registrars
        acceptable to the Trustee and one or more additional Paying Agents for each
        series of\nSecurities, and the Company may terminate the appointment of any
        <FONT STYLE=\"white-space:nowrap\">co-Security</FONT> Registrar or Paying
        Agent at any time upon written notice. The term &#147;Security Registrar&#148;
        includes any <FONT\nSTYLE=\"white-space:nowrap\">co-Security</FONT> Registrar.
        The term &#147;Paying Agent&#148; includes any additional Paying Agent. The
        Company shall notify the Trustee of the name and address of any Agent not
        a party to this Indenture. Subject to\nSection&nbsp;305, if the Company fails
        to maintain a Security Registrar or Paying Agent, the Trustee shall act as
        such. The Company will give prompt written notice to the Trustee of the location,
        and any change in the location, of such office or\nagency. If at any time
        the Company fails to maintain any such required office or agency or fails
        to furnish the Trustee with the address thereof, such presentations, surrenders,
        notices and demands may be made or served at the Corporate Trust Office\nof
        the Trustee, and the Company hereby appoints the Trustee as its agent to receive
        all such presentations, surrenders, notices and demands. </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b)
        The Company may also from time to time designate one or more other offices
        or agencies where the Securities of one or more series may be\npresented or
        surrendered for any or all such purposes and may from time to time rescind
        such designations; <I>provided</I>, <I>however</I>, that no such designation
        or rescission shall in any manner relieve the Company of its obligation to
        maintain\nan office or agency in each Place of Payment for Securities of any
        series for such purposes. The Company will give prompt written notice to the
        Trustee of any such designation or rescission and of any change in the location
        of any such other office\nor agency. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">39 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(c) Anything
        herein to the contrary notwithstanding, any office or agency required by this\nSection
        may be maintained at any office of the Company in which event the Company
        shall perform all functions to be performed at such office or agency. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 1003. <I>Money for Securities Payments
        to Be Held in Trust</I>. (a) If the Company at any time acts as its own Paying
        Agent with\nrespect to any series of Securities, or any Tranche thereof, it
        will, on or before each due date of the principal of or any premium or interest
        on any of such Securities, segregate and hold in trust for the benefit of
        the Persons entitled thereto a\nsum sufficient to pay the principal (and premium,
        if any) or interest so becoming due until such sums are paid to such Persons
        or otherwise disposed of as herein provided and will promptly notify the Trustee
        of its action or failure so to act. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">(b) Whenever
        the Company has one or more Paying Agents for any series of Securities, it
        will, on or prior to (and if on, then before 11:00 a.m.\n(New York City time))
        each due date of the principal of and any premium or interest on such Securities,
        deposit with a Paying Agent a sum sufficient (in immediately available funds,
        if payment is made on the due date) to pay the principal and any\npremium
        and interest so becoming due, such sum to be held in trust for the benefit
        of the Persons entitled to such principal, premium or interest as provided
        in the Trust Indenture Act and (unless such Paying Agent is the Trustee) the
        Company will\npromptly notify the Trustee of its action or failure so to act.
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">(c) The Company will cause each Paying Agent
        for any series of Securities,\nor any Tranche thereof, other than the Trustee,
        to execute and deliver to the Trustee an instrument in which such Paying Agent
        shall agree with the Trustee, subject to the provisions of this Section, that
        such Paying Agent will: </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(i)
        comply with the provisions of the Trust Indenture Act applicable to it as
        a Paying Agent and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(ii) during
        the continuance of any default by the Company (or any other obligor upon the
        Securities of that series) in the\nmaking of any payment in respect of the
        Securities of that series, upon the written request of the Trustee, forthwith
        pay to the Trustee all sums held in trust by such Paying Agent for payment
        in respect of the Securities of that series </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">(d)
        The Company may at any time, for the purpose of obtaining the satisfaction
        and discharge of this Indenture or for any other purpose, pay,\nor by Company
        Order direct any Paying Agent to pay, to the Trustee all sums held in trust
        by the Company or such Paying Agent, such sums to be held by the Trustee upon
        the same trusts as those upon which such sums were held by the Company or
        such\nPaying Agent; and, upon such payment by any Paying Agent to the Trustee,
        such Paying Agent shall be released from all further liability with respect
        to such money. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(e) Any money deposited with
        the Trustee or any Paying Agent, or received by the Trustee in respect of
        Eligible Obligations deposited with the\nTrustee pursuant to Section&nbsp;401
        or 404, or then held by the Company, in trust for the payment of the principal
        of and any premium or interest on any Security of any series and remaining
        unclaimed for two years (or such shorter period for the\nreturn of such funds
        to the Company under applicable abandoned property laws) after such principal,
        premium or interest has become due and payable shall be paid to the Company
        on Company Request, or (if then held by the Company) shall be discharged\nfrom
        such trust; and the Holder of such Security shall thereafter, as an unsecured
        general creditor, look only to the Company for payment thereof, and all liability
        of the Trustee or such Paying Agent with respect to such trust money, and
        all\nliability of the Company as trustee thereof, shall thereupon cease. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 1004. <I>Statement as to Compliance</I>.
        The Company will\ndeliver to the Trustee, within 120 days after the end of
        each fiscal year of the Company ending after the date hereof, a written statement,
        which need not comply with Section&nbsp;102, signed by the principal executive
        officer, the principal\nfinancial officer or the principal accounting officer
        of the Company stating, as to each signer thereof stating whether or not to
        the knowledge of the signers thereof the Company is in default in the performance
        and observance of any of the terms,\nprovisions, and conditions of this Indenture
        (without regard to any period of grace or requirement of notice provided hereunder)
        and, if the Company shall be in default, specifying all such defaults and
        the nature and status thereof of which they\nmay have knowledge. </P>\n <p
        STYLE=\"margin-top:0pt;margin-bottom:0pt ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt;
        margin-bottom:0pt; font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">40
        </P>\n\n</DIV></Center>\n\n\n<p style=\"margin-top:1em; margin-bottom:0em;
        page-break-before:always\"> </p>\n<HR SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\"
        ALIGN=\"CENTER\">\n\n\n<Center><DIV STYLE=\"width:8.5in\" align=\"left\">\n
        <P STYLE=\"margin-top:0pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 1005. <I>Waiver of Certain Covenants</I>.
        Except as otherwise specified as\ncontemplated by Section&nbsp;301 for Securities
        of such series, the Company may, with respect to the Securities of any series,
        omit in any particular instance to comply with any term, provision or condition
        set forth in (i)&nbsp;any additional\ncovenants or restrictions specified
        with respect to the Securities of any series as contemplated by Section&nbsp;301
        if before the time for such compliance the Holders of not less than a majority
        in aggregate principal amount (or such larger\nproportion as may be required
        in respect of waiving a past default of any such additional covenant or restriction)
        of the Outstanding Securities of all series of equal ranking with respect
        to which such covenant or restriction was so specified,\nconsidered as one
        class, by Act of such Holders, either waive such compliance in such instance
        or generally waive compliance with such term, provision or condition and (ii)&nbsp;Sections
        1002 and 1004 and Article Eight if before the time for such\ncompliance the
        Holders of at least a majority in principal amount of Securities of all series
        of equal ranking Outstanding under this Indenture by Act of such Holders,
        either waive such compliance in such instance or generally waive compliance
        with\nsuch term, provision or condition; but, in the case of clause (i)&nbsp;or
        (ii) of this Section, no such waiver shall extend to or affect such term,
        provision or condition except to the extent so expressly waived,<B> </B>and,
        until such waiver\nbecomes effective, the obligations of the Company and the
        duties of the Trustee in respect of any such term, provision or condition
        shall remain in full force and effect. </P>\n<P STYLE=\"margin-top:24pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>ARTICLE
        ELEVEN </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>REDEMPTION OF SECURITIES
        </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 1101. <I>Applicability of Article</I>.
        Securities of any series that are redeemable before their Stated Maturity
        (or, if the principal\nof the Securities of any series is payable in installments,
        the Stated Maturity of the final installment of the principal thereof) shall
        be redeemable in accordance with their terms and (except as otherwise specified
        as contemplated by\nSection&nbsp;301 for Securities of any series) in accordance
        with this Article. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 1102. <I>Election to
        Redeem; Notice to\nTrustee</I>. The election of the Company to redeem any
        Securities shall be evidenced by a Board Resolution or an Officer&#146;s Certificate
        or in another manner specified as contemplated by Section&nbsp;301 for such
        Securities. In case of any\nredemption at the election of the Company of less
        than all the Securities of any series, the Company shall, at least 45 days
        prior to the Redemption Date fixed by the Company (unless a shorter notice
        is satisfactory to the Trustee), notify the\nTrustee of such Redemption Date
        and of the principal amount of Securities of such series to be redeemed. In
        the case of any redemption of Securities (a)&nbsp;prior to the expiration
        of any restriction on such redemption provided in the terms of such\nSecurities
        or elsewhere in this Indenture, or (b)&nbsp;pursuant to an election of the
        Company that is subject to a condition specified in the terms of such Securities
        or elsewhere in this Indenture, the Company shall furnish the Trustee with
        an\nOfficer&#146;s Certificate evidencing compliance with such restriction
        or condition. </P> <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 1103. <I>Selection by
        Trustee of Securities\nto Be Redeemed</I>. If less than all the Securities
        of any series are to be redeemed, unless the procedures of the Depositary
        provide otherwise, the particular Securities to be redeemed shall be selected
        by the Trustee, from the Outstanding\nSecurities of such series not previously
        called for redemption, by such method as is provided for any particular series,
        or, in the absence of any such provision, pro rata, by lot, or by such method
        as the Trustee deems fair and appropriate and\nwhich may provide for the selection
        for redemption of portions (equal to the minimum authorized denomination for
        Securities of that series or any integral multiple thereof) of the principal
        amount of Securities of such series of a denomination\nlarger than the minimum
        authorized denomination for Securities of that series. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">The
        Trustee shall promptly notify the Company and the\nSecurity Registrar in writing
        of the Securities selected for redemption and, in the case of any Securities
        selected for partial redemption, the principal amount thereof to be redeemed
        and the method it has chosen for the selection of such\nSecurities. </P> <P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">For all purposes of this Indenture, unless the
        context otherwise requires, all provisions relating to the redemption of\nSecurities
        shall relate, in the case of any Securities redeemed or to be redeemed only
        in part, to the portion of the principal amount of such Securities that has
        been or is to be redeemed. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 1104.
        <I>Notice of Redemption</I>. Unless otherwise specified as contemplated by
        Section&nbsp;301 with respect to any series of\nSecurities, notice of redemption
        shall be given by electronic transmission or first-class mail, postage prepaid,
        mailed not less than 30 nor more than 60 days prior to the Redemption Date,
        to each Holder of Securities to be redeemed, at such\nHolder&#146;s address
        appearing in the Security Register. </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">41 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">All notices
        of redemption shall state: </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(1)
        the Redemption Date, </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(2) the Redemption
        Price, or the formula pursuant to which the Redemption Price is to be determined
        if the Redemption Price\ncannot be determined at the time notice is given,
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(3) if less than all the Outstanding
        Securities of any series are to be\nredeemed, the identification (and, in
        the case of partial redemption, the principal amounts) of the particular Securities
        to be redeemed, and the portion of the principal amount of any Security to
        be redeemed in part and, in the case of any such\nSecurity of such series
        to be redeemed in part, that, on and after the Redemption Date, upon surrender
        of such Security, a new Security or Securities of such series in principal
        amount equal to the remaining unpaid principal amount thereof will be\nissued
        as provided in Section&nbsp;1106, </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(4)
        that on the Redemption Date the Redemption Price will become due and payable\nupon
        each such Security to be redeemed and, if applicable, that interest thereon
        will cease to accrue on and after said date, </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(5) the place or places where such Securities are to be surrendered
        for payment of the Redemption Price and accrued interest,\nif any, </P> <P
        STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(6) that the redemption is for
        a sinking fund, if such is the case, </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(7)
        the CUSIP, &#147;ISIN&#148; or similar number(s), if any, assigned to such
        Securities; <I>provided however</I>, that such\nnotice may state that no representation
        is made as to the correctness of CUSIP, &#147;ISIN&#148; or similar number(s),
        and the redemption of such Securities shall not be affected by any defect
        in or omission of such number(s), and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(8)
        such other matters as the Company shall deem desirable or appropriate. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">Unless otherwise specified with respect to any
        Securities in accordance with Section&nbsp;301, with respect to any notice
        of redemption of\nSecurities at the election of the Company, unless, upon
        the giving of such notice, such Securities are deemed to have been paid in
        accordance with Section&nbsp;401, such notice may state that such redemption
        shall be conditional upon the receipt by\nthe Paying Agent or Agents for such
        Securities, on or prior to the date fixed for such redemption, of money sufficient
        to pay the principal of and premium, if any, and interest, if any, on such
        Securities and that if such money has not been so\nreceived such notice shall
        be of no force or effect and the Company shall not be required to redeem such
        Securities. In the event that such notice of redemption contains such a condition
        and such money is not so received, the redemption shall not be\nmade and within
        a reasonable time thereafter notice shall be given, in the manner in which
        the notice of redemption was given, that such money was not so received and
        such redemption was not required to be made, and the Paying Agent or Agents
        for\nthe Securities otherwise to have been redeemed shall promptly return
        to the Holders thereof any of such Securities that had been surrendered for
        payment upon such redemption. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">Notice of redemption
        of Securities to be redeemed at the election of the Company, and any notice
        of\n<FONT STYLE=\"white-space:nowrap\">non-satisfaction</FONT> of a condition
        for redemption as aforesaid, shall be given by the Company or, at the Company&#146;s
        request, by the Security Registrar in the name and at the expense of the Company.
        Notice of\nmandatory redemption of Securities shall be given by the Security
        Registrar in the name and at the expense of the Company. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        1105.\n<I>Securities Payable on Redemption Date</I>. (a) Notice of redemption
        having been given as aforesaid, and the conditions, if any, set forth in such
        notice having been satisfied, the Securities or portions thereof so to be
        redeemed shall, on the\nRedemption Date, become due and payable at the Redemption
        Price therein specified, and from and after such date (unless the Company
        defaults in the payment of the Redemption Price and </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">42 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\">\naccrued interest, if any)
        such Securities, or portions thereof, if interest-bearing, shall cease to
        bear interest. Upon surrender of any such Security for redemption in accordance
        with said\nnotice, such Security or portion thereof, if any, shall be paid
        by the Company at the Redemption Price, together with accrued interest, if
        any, to, but excluding, the Redemption Date; <I>provided, however</I>, that
        unless otherwise specified as\ncontemplated by Section&nbsp;301, installments
        of interest whose Stated Maturity is on or prior to the Redemption Date shall
        be payable to the Holders of such Securities, or one or more Predecessor Securities,
        registered as such at the close of\nbusiness on the relevant Regular Record
        Dates according to their terms and the provisions of Section&nbsp;307; <I>provided,
        further, </I>that, unless otherwise specified as contemplated by Section&nbsp;301,
        if the Redemption Date is after a Regular\nRecord Date and on or prior to
        the related Interest Payment Date, the accrued and unpaid interest shall be
        payable to the Holder of the redeemed Securities registered on the relevant
        Regular Record Date. </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">(b) If any Security called for
        redemption shall not be so paid upon surrender thereof for redemption, the
        principal and any premium shall,\nuntil paid, bear interest from the Redemption
        Date at the rate prescribed therefor in the Security. </P> <P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION
        1106. <I>Securities Redeemed\nin Part</I>. Any physical Security that is to
        be redeemed only in part shall be surrendered at a Place of Payment therefor
        (with, if the Company or the Trustee so requires, due endorsement by, or a
        written instrument of transfer in form satisfactory\nto the Company and the
        Trustee duly executed by, the Holder thereof or his or her attorney duly authorized
        in writing), and the Company shall execute, and the Trustee shall authenticate
        and deliver to the Holder of such Security without service\ncharge, a new
        Security or Securities of the same series, of any authorized denomination
        as requested by such Holder, and of like tenor and in aggregate principal
        amount equal to and in exchange for the unredeemed portion of the principal
        of the\nSecurity so surrendered. </P> <P STYLE=\"margin-top:24pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\"><B>ARTICLE
        TWELVE </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; font-size:10pt;
        font-family:Times New Roman\" ALIGN=\"center\"><B>REPAYMENT OF SECURITIES
        AT OPTION OF HOLDERS </B></P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">SECTION 1201.
        <I>Applicability of Article</I>. Securities of any series that are repayable
        before their Stated Maturity at the option of the\nHolders shall be repayable
        in accordance with their terms and (except as otherwise specified as contemplated
        by Section&nbsp;301 for Securities of any series) in accordance with this
        Article. </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%;
        font-size:10pt; font-family:Times New Roman\">SECTION 1202. <I>Notice of Repayment
        Date</I>. Notice of any Repayment Date with respect to Securities of any series
        shall be given by the\nCompany not less than 30 nor more than 45 days prior
        to such Repayment Date (or at such other times as may be specified for such
        repayment or repurchase pursuant to Section&nbsp;301) to each Holder of Securities
        of such series in accordance with\nSection&nbsp;106 (except as otherwise specified
        as contemplated by Section&nbsp;301 for Securities of any series). </P> <P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">The notice as to the\nRepayment Date shall state
        (unless otherwise specified for such repayment or repurchase pursuant to Section&nbsp;301):
        </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(1)\nthe Repayment Date; </P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(2) the principal amount of
        the Securities required to be repaid or repurchased and the Repayment\nPrice
        (or the formula pursuant to which the Repayment Price is to be determined
        if the Repayment Price cannot be determined at the time the notice is given);
        </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(3) the place or places where
        such Securities are to be surrendered for payment of the Repayment Price,
        and accrued interest,\nif any, and the date by which Securities must be so
        surrendered in order to be repaid or repurchased; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(4) that any\nSecurity not tendered or accepted for payment shall
        continue to accrue interest; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(5)
        that, unless the Company defaults in\nmaking such payment or the Paying Agent
        is prohibited from paying such money to the Holders on that date pursuant
        to the terms of this Indenture, Securities accepted for payment pursuant to
        any such offer of repayment or repurchase shall cease to\naccrue interest
        after the Repayment Date; </P>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">43 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(6)
        that Holders electing to have a Security repaid or purchased pursuant to\nsuch
        offer may elect to have all or any portion of such Security purchased; </P>
        <P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(7) that Holders electing to
        have a Security\nrepaid or repurchased pursuant to any such offer shall be
        required to surrender the Security, with such customary documents of surrender
        and transfer as the Company may reasonably request, duly completed, or transfer
        by book-entry transfer, to the\nCompany or the Paying Agent at the address
        specified in the notice at least two Business Days prior to the Repayment
        Date; </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:5%; font-size:10pt; font-family:Times New Roman\">(8) that Holders
        shall be entitled to withdraw their election if the Company or the Paying
        Agent, as the case may be, receives,\nnot later than the expiration of the
        offer to repay or repurchase, a telegram, facsimile transmission or letter
        setting forth the name of the Holder, the principal amount of the Security
        the Holder delivered for purchase and a statement that such\nHolder is withdrawing
        its election to have such Security purchased; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times
        New Roman\">(9) that, in the case of a repayment or repurchase of\nless than
        all Outstanding Securities of a series, the method of selection of Securities
        to be repaid or repurchased to be applied by the Trustee if the principal
        amount of properly tendered Securities exceeds the principal amount of the
        Securities\nto be repaid or repurchased; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:5%; font-size:10pt; font-family:Times New Roman\">(10)
        that Holders whose Securities are purchased only in part shall be issued new
        Securities\nof the same series equal in principal amount to the unpurchased
        portion of the Securities surrendered (or transferred by book-entry transfer);
        and </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%; text-indent:5%;
        font-size:10pt; font-family:Times New Roman\">(11) the CUSIP or other identification
        number, if any, printed on the Securities being repurchased and that no representation\nis
        made as to the correctness or accuracy of the CUSIP or other identification
        number, if any, listed in such notice or printed on the Securities. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 1203. <I>Securities Payable on Repayment
        Date</I>. The form of option to elect repurchase or repayment having been
        delivered as\nspecified in the form of Security for such series, the Securities
        of such series so to be repaid (after application of the method of selection
        described pursuant to clause (9)&nbsp;of Section&nbsp;1202, if the principal
        amount of properly tendered\nSecurities exceeds the principal amount of the
        Securities to be repaid or repurchased) shall, on the Repayment Date, become
        due and payable at the Repayment Price applicable thereto and from and after
        such date (unless the Company defaults in the\npayment of the Repayment Price
        and accrued interest) such Securities shall cease to bear interest. Upon surrender
        of any such Security for repayment in accordance with said notice, such Security
        shall be paid by the Company at the Repayment Price\ntogether with accrued
        interest, if any, to but excluding the Repayment Date; <I>provided, however</I>,
        that if a Security is repaid or repurchased on or after a Regular Record Date
        but on or prior to the Stated Maturity of any installments of\ninterest, then
        any accrued and unpaid interest due on such Stated Maturity shall be payable
        to the Holders of such Securities, or one or more Predecessor Securities,
        registered as such at the close of business on the relevant Regular Record
        Dates\naccording to their terms and the provisions of Section&nbsp;307. </P>
        <P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">If any Security is not paid upon surrender thereof
        for repayment, the\nprincipal (and premium, if any) shall, until paid, bear
        interest from the Repayment Date at the rate prescribed therefor in such Security.
        </P>\n<P STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:9%; font-size:10pt;
        font-family:Times New Roman\">SECTION 1204. <I>Securities Repaid in Part</I>.
        Any Security that by its terms may be repaid in part at the option of the
        Holder and that is\nto be repaid only in part shall be surrendered at any
        office or agency of the Company designated for that purpose pursuant to Section&nbsp;1002
        (with, if the Company or the Trustee so requires, due endorsement by, or a
        written instrument of transfer\nin form satisfactory to the Company and the
        Trustee duly executed by, the Holder thereof or his or her attorney duly authorized
        in writing), and the Company shall execute, and the Trustee shall authenticate
        and deliver to the Holder of such Security\nwithout service charge, a new
        Security or Securities of the same series, as provided in Section&nbsp;305<B>,</B>
        of any authorized denomination as requested by such Holder, in aggregate principal
        amount equal to and in exchange for the unrepaid\nportion of the principal
        of the Security so surrendered.<B> </B> </P> <P STYLE=\"font-size:12pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P><center>\n<P
        STYLE=\"line-height:6.0pt;margin-top:0pt;margin-bottom:2pt;border-bottom:1.00pt
        solid #000000;width:21%\">&nbsp;</P></center>\n <p STYLE=\"margin-top:0pt;margin-bottom:0pt
        ; font-size:8pt\">&nbsp;</P> <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        font-size:10pt; font-family:Times New Roman\" ALIGN=\"center\">44 </P>\n\n</DIV></Center>\n\n\n<p
        style=\"margin-top:1em; margin-bottom:0em; page-break-before:always\"> </p>\n<HR
        SIZE=\"3\" style=\"COLOR:#999999\" WIDTH=\"100%\" ALIGN=\"CENTER\">\n\n\n<Center><DIV
        STYLE=\"width:8.5in\" align=\"left\">\n <P STYLE=\"margin-top:0pt; margin-bottom:0pt;
        text-indent:9%; font-size:10pt; font-family:Times New Roman\">IN WITNESS WHEREOF,
        the parties hereto have caused this Indenture to be duly executed as of\nthe
        date first above written. </P> <P STYLE=\"font-size:12pt;margin-top:0pt;margin-bottom:0pt\">&nbsp;</P><DIV
        ALIGN=\"right\">\n<TABLE CELLSPACING=\"0\" CELLPADDING=\"0\" WIDTH=\"40%\"
        BORDER=\"0\" STYLE=\"BORDER-COLLAPSE:COLLAPSE; font-family:Times New Roman;
