        the registration statement or prospectus that is part of the registration
        statement will, as to a purchaser with a time of contract of sale prior to
        such effective\ndate, supersede or modify any statement that was made in the
        registration statement or prospectus that was part of the registration statement
        or made in any such document immediately prior to such effective date. </P>\n<P
        STYLE=\"margin-top:12pt; margin-bottom:0pt; text-indent:4%; font-size:10pt;
        font-family:Times New Roman\">(5) That, for the purpose of determining liability
        of the registrant under the Securities Act of 1933 to any purchaser in the
        initial\ndistribution of the securities: </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">The
        undersigned Registrant undertakes that in a primary offering of securities
        of the\nundersigned Registrant pursuant to this registration statement, regardless
        of the underwriting method used to sell the securities to the purchaser, if
        the securities are offered or sold to such purchaser by means of any of the
        following\ncommunications, the undersigned Registrant will be a seller to
        the purchaser and will be considered to offer or sell such securities to such
        purchaser: </P>\n<P STYLE=\"margin-top:6pt; margin-bottom:0pt; margin-left:4%;
        text-indent:4%; font-size:10pt; font-family:Times New Roman\">(i) Any preliminary
        prospectus or prospectus of the undersigned Registrant relating to the offering
        required to be filed\npursuant to Rule 424; </P> <P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(ii) Any free writing prospectus relating to the offering prepared
        by or on behalf of the\nundersigned Registrant or used or referred to by the
        undersigned Registrant; </P> <P STYLE=\"margin-top:6pt; margin-bottom:0pt;
        margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(iii)
        The portion of any other free writing\nprospectus relating to the offering
        containing material information about the undersigned Registrant or its securities
        provided by or on behalf of the undersigned Registrant; and </P>\n<P STYLE=\"margin-top:6pt;
        margin-bottom:0pt; margin-left:4%; text-indent:4%; font-size:10pt; font-family:Times
        New Roman\">(iv) Any other communication that is an offer in the offering
        made by the undersigned Registrant to the purchaser. </P>\n<P STYLE=\"margin-top:12pt;
        margin-bottom:0pt; text-indent:4%; font-size:10pt; font-family:Times New Roman\">(6)
