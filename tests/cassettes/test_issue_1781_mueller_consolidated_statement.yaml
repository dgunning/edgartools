        style=\"text-align:center\"><font><br></font></div></div><div style=\"margin-bottom:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Medium',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">Fiscal
        2026 Outlook</font></div><div style=\"margin-bottom:9pt;margin-top:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">The
        Company is introducing its fiscal 2026 consolidated net sales guidance to
        be between $1,450 million and $1,470 million, or an increase of 1.4% to 2.8%
        compared with the prior year.  Consolidated net sales seasonality is anticipated
        to be normalized with quarterly consolidated net sales highest in the third
        quarter and lowest in the first quarter, with a sequential increase in consolidated
        net sales in the second quarter as the construction season begins to ramp
        up for the Spring. </font></div><div style=\"margin-bottom:9pt;margin-top:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">The
        Company anticipates its fiscal 2026 adjusted EBITDA to be between $345 million
        and $350 million, or an increase of 5.8% to 7.3% compared to the prior year.
        \ The Company anticipates the second half fiscal 2026 adjusted EBITDA margin
        will be higher than the first half of the fiscal year, primarily driven by
        the seasonality of net sales.  At the midpoint of our guidance range, we expect
        to achieve an adjusted EBITDA margin of 23.8% margin for the year, reflecting
        a 100 basis point year-over-year improvement.  The Company expects free cash
        flow as a percentage of adjusted net income to be more than 85% in fiscal
        2026.  </font></div><div style=\"margin-bottom:9pt\"><font style=\"color:#000000;font-family:'Franklin
        Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">The
