        the decrease in cash provided by operating activities.</font></div><div style=\"margin-bottom:9pt;margin-top:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">As
