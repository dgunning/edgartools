        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8220;Fiscal
        2025 was another year of record annual results including strong net sales
        growth and more than a 100 basis points increase in our adjusted EBITDA margin.
        \ Our achievements in transforming our business over the past two years have
        expanded our gross margin by more than 600 basis points.  We are energized
        by the progress we&#8217;ve made and the opportunities ahead as we continue
        to invest across all aspects of our business.  Our performance over the past
        few years reinforces our team&#8217;s commitment to driving further improvements
        and leveraging favorable market trends in infrastructure spending.&#8221;</font></div><div><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8220;Looking
        ahead, we are well-positioned for continued net sales growth as we leverage
        our strong market position and benefit from the investments needed to address
        the aging North American infrastructure.  Additionally, our collective focus
        on enhancing commercial execution, driving operational and supply chain efficiencies
        and investing in our facilities will support further margin expansion in fiscal
        2026 and beyond.  I am confident in our team&#8217;s ability to adapt, execute
        and deliver results, even with the heightened level of uncertainty in the
        external operating environment.  Their unwavering commitment to our customers
        and operational discipline will continue to propel Mueller Water Products
        forward,&#8221; Ms. Zakas concluded.</font></div><div style=\"margin-bottom:9pt;margin-top:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Medium',sans-serif;font-size:12pt;font-weight:700;line-height:120%\">Consolidated
