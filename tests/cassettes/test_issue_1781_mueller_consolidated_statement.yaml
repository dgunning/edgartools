        due to increased volumes of </font></div><div style=\"height:36pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div><font><br></font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:36pt;width:100%\"><div
        style=\"text-align:center\"><font><br></font></div></div><div style=\"margin-bottom:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">hydrants
        and repair products and higher pricing across most product lines, partially
        offset by lower volumes of natural gas products.</font></div><div style=\"margin-bottom:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Operating
