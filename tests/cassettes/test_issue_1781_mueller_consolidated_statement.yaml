        the 2024 fourth quarter and fiscal year were 35.4% and 26.4%, respectively.
        \ The lower effective tax rates for the 2025 fourth quarter and fiscal year
        compared with the prior year periods, excluding the non-cash goodwill impairment
        in the prior year, were primarily a result of change in valuation allowance
        of certain state tax credits and foreign operating losses, tax benefits related
        to stock compensation and higher foreign tax rate benefits.</font></div><div
