        decreases in other current liabilities, partially offset by higher net income
        compared with the prior year.</font></div><div style=\"margin-bottom:9pt;margin-top:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">During
