        in a debt leverage ratio of 1.4x and net debt leverage ratio of 0.1x.  We
        did not have any borrowings under our ABL Agreement at the end of the fourth
        quarter, nor did we borrow any amounts under our ABL during the year. There
        are no maturities on the Company&#8217;s debt financings until June 2029 and
        its 4.0% Senior Notes have no financial maintenance covenants.</font></div><div
        style=\"height:36pt;position:relative;width:100%\"><div style=\"bottom:0;position:absolute;width:100%\"><div><font><br></font></div></div></div><hr
