        style=\"height:5pt\"><td colspan=\"3\" style=\"border-bottom:2pt solid #000000;padding:0
        1pt\"></td></tr></table></div><div style=\"margin-bottom:9pt;margin-top:9pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">ATLANTA,
        November&#160;6, 2025 - Mueller Water Products, Inc. (NYSE&#58; MWA), a leading
        manufacturer and marketer of products and solutions used in the transmission,
        distribution and measurement of water in North America, announced financial
        results for its fourth quarter and fiscal year ended September&#160;30, 2025.</font></div><div
        style=\"margin-bottom:6pt\"><font style=\"color:#000000;font-family:'Franklin
        Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">In
        the fourth quarter of 2025, the Company&#58;</font></div><div style=\"margin-bottom:6pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%;padding-left:10.8pt\">Increased
        net sales 9.4% to $380.8 million as compared with $348.2 million in the prior
        year quarter</font></div><div style=\"margin-bottom:6pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%;padding-left:10.8pt\">Reported
        operating income of $69.6 million as compared with $28.4 million in the prior
        year quarter, and increased adjusted operating income 39.6% to $78.9 million
        as compared with $56.5 million in the prior year quarter</font></div><div
        style=\"margin-bottom:6pt;padding-left:36pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Franklin
        Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%;padding-left:10.8pt\">Reported
        operating margin of 18.3% as compared with 8.2% in the prior year quarter,
        and increased adjusted operating margin to 20.7% as compared with 16.2% in
        the prior year quarter</font></div><div style=\"margin-bottom:6pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%;padding-left:10.8pt\">Generated
        net income of $52.6 million as compared with $10.0 million in the prior year
        quarter, with net income margin of 13.8% as compared with 2.9% in the prior
        year quarter, and increased adjusted net income 76.1%</font><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\"> </font><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">to
        $59.7 million as compared with $33.9 million in the prior year quarter</font></div><div
        style=\"margin-bottom:6pt;padding-left:36pt;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Franklin
        Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%;padding-left:10.8pt\">Reported
        net income per diluted share of $0.33 as compared with $0.06 in the prior
        year quarter, and increased adjusted net income per diluted share 72.7% to
        $0.38 as compared with $0.22 in the prior year quarter</font></div><div style=\"margin-bottom:6pt;padding-left:36pt;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%;padding-left:10.8pt\">Increased
        adjusted EBITDA 26.6% to $91.8 million as compared with $72.5 million in the
        prior year quarter, and expanded adjusted EBITDA margin to 24.1% as compared
        with 20.8% in the prior year quarter</font></div><div style=\"margin-bottom:6pt\"><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">In
