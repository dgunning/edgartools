        style=\"margin-bottom:9pt;margin-top:9pt\"><font style=\"color:#000000;font-family:'Franklin
        Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Selling,
        general and administrative expenses for the fourth quarter increased $3.6
        million, or 5.7%, to $66.7 million as compared with $63.1 million in the prior
        year quarter, primarily due to higher personnel costs, inflationary pressures
        and unfavorable foreign currency, partially offset by lower amortization expense.</font></div><div
        style=\"margin-bottom:9pt\"><font style=\"color:#000000;font-family:'Franklin
        Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Operating
