        New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">,</font><font
        style=\"color:#000000;font-family:'Franklin Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">
        to $59.7 million as compared with $33.9 million in the prior year quarter.</font></div><div
        style=\"margin-bottom:9pt\"><font style=\"color:#000000;font-family:'Franklin
        Gothic Book',sans-serif;font-size:12pt;font-weight:400;line-height:120%\">Adjusted
