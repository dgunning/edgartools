        Document created using Wdesk -->\n<!-- Copyright 2025 Workiva -->\n<title>Document</title></head><body><div
        id=\"i350c7f11787245cebd93830c4b88d18b_1\"></div><div style=\"min-height:42.75pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-align:center\"><font style=\"background-color:#ffffff;color:#000000;font-family:'Times
        New Roman',serif;font-size:12pt;font-weight:700;line-height:112%\"> Graphic
        Packaging Holding Company Reports Second Quarter 2025 Financial Results</font></div><div
        style=\"margin-top:6pt;text-align:center\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"background-color:#ffffff;color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:700;line-height:100%;text-decoration:underline\">Second
        Quarter Highlights</font></div><div style=\"padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:100%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:100%;padding-left:14.5pt\">Waco,
        Texas recycled paperboard investment on track for Q4 2025 startup</font></div><div
        style=\"padding-left:36pt;text-align:justify;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:100%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:100%;padding-left:14.5pt\">Packaging
        volumes +1% </font></div><div style=\"padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:100%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:100%;padding-left:14.5pt\">Innovation
        Sales Growth of $61&#160;million</font></div><div style=\"padding-left:36pt;text-align:justify;text-indent:-18pt\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:100%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:100%;padding-left:14.5pt\">Recycled
        Materials Association adds paper cups to recycling specifications</font></div><div
        style=\"padding-left:36pt;text-align:justify;text-indent:-18pt\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:100%\">&#8226;</font><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:100%;padding-left:14.5pt\">$111
        million share repurchase reduced outstanding shares by 1.6%</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">ATLANTA,
        July 29, 2025 - Graphic Packaging Holding Company (NYSE&#58; GPK) (&#34;Graphic
        Packaging&#34; or the &#34;Company&#8221;), a global leader in sustainable
        consumer packaging, today reported second quarter 2025 results.</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">Net
        Income in second quarter 2025 was $104 million, or $0.34 per diluted share,
        versus $190 million, or $0.62 per diluted share in second quarter 2024. Second
        quarter 2025 and 2024 Net Income was impacted by special items and amortization
        of purchased intangibles of $24 million net charge and $7 million net gain,
        respectively. Excluding special items and amortization of purchased intangibles,
        Adjusted Net Income for the second quarter of 2025 was $128 million, or $0.42
        per diluted share, and $183 million, or $0.60 per diluted share in second
        quarter 2024.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:115%\">Michael
        Doss, the Company&#8217;s President and CEO said, &#8220;Promotional activity
        drove modestly better than expected volumes in the second quarter. Conversations
        with our customers suggest potential for increased emphasis on volume growth
        and protecting share in the year ahead. As these customers refine their strategies,
        we are working closely with them to support their plans.</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:115%\">With
        our Waco, Texas recycled paperboard investment nearing completion, our capital
        spending will decline sharply in 2026, and we expect to generate cash well
        in excess of our internal needs for years to come. We expect to return substantial
        cash to stockholders through dividends and share repurchase, and reach investment
        grade over time. Investments like Waco and Kalamazoo, and our world-class
        innovation platform have positioned Graphic Packaging as the supplier of choice
        for many of the world's largest consumer staples companies, quick service
        restaurants, and retailers.&#34;</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:700;line-height:112%;text-decoration:underline\">Operating
        Results</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:700;line-height:112%\">Net Sales</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">Second
        quarter 2025 Net Sales decreased 1% to $2,204 million, versus $2,237 million
        in the same quarter last year. The $33 million decline was driven by a $40
        million impact from the divestiture of the Augusta, GA bleached paperboard
        manufacturing facility and reduced open market sales participation, partially
        offset by a $20 million favorable foreign exchange impact, while modest price
        pressure was partially offset by a modest volume increase.</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:700;line-height:112%\">EBITDA</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">Second
        quarter 2025 EBITDA decreased 29% to $323 million. Excluding the impact of
        business combinations and other special items, Adjusted EBITDA was $336 million
        versus $402 million in the same quarter last year. The decline in Adjusted
        EBITDA was driven by a $23 million decrease in price&#59; $26 million of labor
        and benefits inflation&#59; $10 million of input cost inflation&#59; and a
        $5 million decrease relating to the divestiture of the Augusta, GA bleached
        paperboard manufacturing facility and reduced open market sales participation.
        Net Performance was negative, as actions taken to reduce inventory and related
        production inefficiencies more than offset the positive impact from modestly
        better packaging volumes (together a net negative $13 million). Foreign exchange
        had a favorable impact of $11 million. Second quarter Adjusted EBITDA Margin
        was 15.3% in 2025, and 18.0% in 2024.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:700;line-height:112%;text-decoration:underline\">Other
        Results</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">Total Debt
        (Long-Term, Short-Term and Current Portion) was $5,859 million in second quarter
        2025 compared to $5,209 million in fourth quarter 2024. Net Debt (Total Debt
        less Cash and Cash Equivalents) was $5,739 million in second quarter 2025
        compared to $5,052 million in fourth quarter 2024. The Company's second quarter
        2025 Net Leverage Ratio was 3.7x compared to 3.0x in fourth quarter 2024.
        </font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:115%\">Capital
        expenditures in second quarter 2025 were $228 million, versus $249 million
        in the same quarter last year. </font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">The Company
        returned approximately $177&#160;million to stockholders during the first
        six months of 2025 through regular dividends and share repurchase activity.
        During the second quarter, the Company repurchased approximately 1.6%, or
        </font></div><div style=\"height:42.75pt;position:relative;width:100%\"><div
        style=\"bottom:0;position:absolute;width:100%\"><div style=\"text-align:center\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:120%\">1</font></div></div></div><hr
        style=\"page-break-after:always\"><div style=\"min-height:42.75pt;width:100%\"><div><font><br></font></div></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">approximately
        5.0 million shares of its common stock outstanding, for $111 million. Regular
        dividends of approximately $33 million and $33 million were paid in the first
        and second quarter, respectively.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:700;line-height:112%;text-decoration:underline\">2025
        Annual Guidance and Commentary</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">The Company
        currently expects full-year 2025 Net Sales, Adjusted EBITDA, and Adjusted
        EPS, including foreign exchange impact, of $8.4 billion to $8.6 billion, $1.45
        billion to $1.55 billion, and $1.90 to $2.20, respectively. The changes from
        prior guidance reflect actual first half performance and a narrowing of and
        modest increase in second half revenue expectations. Volume and market uncertainty
        remain higher than normal.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">Full-year
        2025 capital spending is currently expected to be approximately $850 million.
        The increase in expected capital spending reflects higher final design and
        construction costs at the Company's Waco, Texas recycled paperboard facility.
        These higher costs are not expected to materially affect total project returns.
        The Company expects the increased spending to be offset by lower cash taxes
        and reduced working capital, leaving expected 2025 free cash flow unchanged.</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:700;line-height:112%;text-decoration:underline\">Innovation
        Sales Growth, Net Performance, and Non-GAAP Reconciliations</font></div><div
        style=\"text-align:justify\"><font><br></font></div><div style=\"text-align:justify\"><font
        style=\"color:#000000;font-family:'Times New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">We
        define Innovation Sales Growth as incremental sales of a product that delivers
        a significant change in materials used, package functionality, or design to
        a new or existing customer. We define Net Performance as the impact of cost
        and productivity initiatives, production efficiencies and&#47;or disruptions,
        and other operating impacts. A tabular reconciliation of EBITDA, Adjusted
        EBITDA, Adjusted EBITDA margin, Adjusted Net Income, Adjusted EPS, Adjusted
        Net Cash Provided by Operating Activities, Adjusted Cash Flow, Net Debt and
        Net Leverage is attached to this release.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:700;line-height:112%;text-decoration:underline\">Earnings
        Call</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">The Company
        will host a conference call at 10&#58;00 a.m. ET today (July 29, 2025) to
        discuss the results of second quarter 2025. The conference call will be webcast
        and can be accessed from the Investors website at </font><font style=\"color:#0563c1;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:112%\">https&#58;&#47;&#47;investors.graphicpkg.com</font><font
