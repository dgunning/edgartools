        style=\"margin-bottom:3pt;text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:100%\">The tables
        below set forth the calculation of the Company's earnings before interest
        expense, income tax expense, depreciation and amortization, including pension
        amortization (&#8220;EBITDA&#8221;), Adjusted EBITDA, Adjusted EBITDA Margin,
        Adjusted Net Income, Adjusted Earnings Per Share, Adjusted Net Cash Provided
        by Operating Activities, Adjusted Cash Flow, Net Leverage Ratio, and Total
        Net Debt. Adjusted EBITDA and Adjusted Net Income exclude gains or charges
        associated with&#58; the Company's business combinations, facility shutdowns,
        and other special items. The Company's management believes that the presentation
        of EBITDA, Adjusted EBITDA, Adjusted Net Income, Adjusted Earnings Per Share,
        Adjusted Net Cash Provided by Operating Activities, Adjusted Cash Flow, and
        Net Leverage Ratio provides useful information to investors because these
        measures are regularly used by management in assessing the Company's performance.
        EBITDA, Adjusted EBITDA, Adjusted Net Income, Adjusted Earnings Per Share,
        Adjusted Net Cash Provided by Operating Activities, Adjusted Cash Flow, and
        Net Leverage Ratio are financial measures not calculated in accordance with
        generally accepted accounting principles in the United States (&#8220;GAAP&#8221;),
        and are not measures of net income, operating income, operating performance,
        or liquidity presented in accordance with GAAP.</font></div><div style=\"text-align:justify\"><font><br></font></div><div
        style=\"text-align:justify\"><font style=\"color:#000000;font-family:'Times
        New Roman',serif;font-size:10pt;font-weight:400;line-height:100%\">EBITDA,
        Adjusted EBITDA, Adjusted Net Income, Adjusted Earnings Per Share, Adjusted
        Net Cash Provided by Operating Activities, Adjusted Cash Flow, and Net Leverage
        Ratio should be considered in addition to results prepared in accordance with
        GAAP, but should not be considered substitutes for or superior to GAAP results.
        In addition, our EBITDA, Adjusted EBITDA, Adjusted Net Income, Adjusted Earnings
        Per Share, Adjusted Net Cash Provided by Operating Activities, Adjusted Cash
        Flow, and Net Leverage Ratio may not be comparable to Adjusted EBITDA or similarly
        titled measures utilized by other companies since such other companies may
        not calculate such measures in the same manner as we do.</font></div><div
