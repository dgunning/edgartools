# This workflow installs Python dependencies and runs tests across versions.
#
# Cost design (to stay within GitHub Actions included minutes):
#   - Pull requests:  fast tests only, single Python version  (cheap, quick gate)
#   - Push to main:   fast (full matrix) + network + slow      (real integration gate)
#   - Nightly (cron): full suite                               (freshness vs SEC API)
#   - concurrency:    cancel superseded PR runs; main runs always complete
#   - pip cache:      avoid reinstalling deps from scratch in every job
#
# There is deliberately NO paths-ignore. A docs-only change would then report no
# checks at all, and a required status check that never reports blocks the pull
# request forever. Since these checks are meant to become required, every PR has
# to produce them — the few CI minutes a markdown-only run costs are cheaper than
# a merge queue that deadlocks on documentation.
#
# REQUIRED CHECKS ARE PINNED TO JOB NAMES. `main` requires exactly four contexts,
# two from this file, one from agent-config-guard.yml and one from
# regression-tests.yml:
#
#     Cassette safety gate
#     test-fast (3.13)
#     Agent config guard     (agent-config-guard.yml: a security gate, never remove)
#     Regression gate        (regression-tests.yml: reports on every pull request,
#                             passing when the regression suite does not apply)
#
# The second name is generated from the matrix below, which is event-dependent —
# a pull request builds only 3.13, so the context is literally "test-fast (3.13)".
# Renaming a job, or changing the pull-request leg of that matrix, retires the
# context that branch protection is waiting for; it never reports, and every pull
# request blocks forever with enforce_admins on. If you touch either, update the
# protection contexts in the same commit:
#
#     gh api repos/dgunning/edgartools/branches/main/protection \
#        --jq .required_status_checks.contexts
#
# test-network, test-slow and Combine Coverage are
# deliberately NOT required: they carry `if: github.event_name != 'pull_request'`
# and so report as skipped on every pull request. They run on push to main,
# which is the integration gate.
#
# Because they cannot gate, they are REPORTED instead — see the `report` job at
# the end of this file. Combine Coverage is where the 65% floor is enforced
# (`coverage report --fail-under=65`), and until 2026-08-10 a failure there, or
# in test-network or test-slow, appeared in the Actions tab and nowhere else.
# That is the same hole #999 closed for the regression workflow after a red main
# survived three merges unnoticed (bead edgartools-hwdp); this workflow was left
# out of that fix even though it carries more.

name: Build and Test Edgartools

# 5.*.x: the short-lived maintenance branch cut from the last 5.x tag during the
# 6.0 freeze window (bead edgartools-07lk.22). Without it a backport PR into that
# branch would report no checks at all. Branch protection is not configured on it,
# so these checks inform but do not block.
#
# Editing THIS copy does not change what such a branch runs. A push runs the
# workflow file at the pushed commit, and a pull request runs it from the merge
# commit of head into base, so a branch cut from a 5.x tag runs the copy in that
# tag, which still tests Python 3.10. In main's copy the 5.*.x entries are
# therefore inert; they stay because removing them buys nothing.
on:
  push:
    branches: [ "main", "5.*.x" ]
  pull_request:
    branches: [ "main", "5.*.x" ]
  schedule:
    # Nightly full suite at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

# Read-only by default. Jobs that write (the red-main `report` job) grant
# their own job-level permissions; nothing else inherits the token's write scope.
permissions:
  contents: read
  pull-requests: read
  issues: read

# Only pull-request runs are ever cancelled, by a newer commit on the same PR.
# Every other run (a push to main, the nightly, a manual dispatch) gets a group
# of its own, keyed by commit, so nothing can supersede it.
#
# `cancel-in-progress: false` was not enough. It protects a RUNNING run, but
# GitHub keeps at most one PENDING run per group and cancels the older pending
# one when a newer run queues. With one group for all of main, every merge
# that arrived while a run was in progress cancelled the merge waiting before
# it, and that commit got no run at all: 43 of the 100 push runs of
# python-hatch-workflow.yml from 2026-11-11 to 2026-11-23 were cancelled
# before any job started (6 of 100 here), among them the merges of #2028 and
# #2029. PRs merge without being up to date with main, so the post-merge run
# is the only check that the combination works.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Must pass before any job that runs pytest. vcrpy loads cassettes with
  # PyYAML's unsafe loader, so a cassette carrying a python/ tag executes code
  # in the runner the moment a test touches it — gating after the suite has
  # started would be no gate at all. Cheap (~10s) and needs only PyYAML.
  cassette-gate:
    name: Cassette safety gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install PyYAML
      run: python -m pip install --upgrade pip PyYAML
    - name: Scan cassettes for unsafe YAML tags
      run: python scripts/check_cassettes.py

  test-fast:
    # PRs to main: single version for a quick gate. Push/schedule: the declared
    # floor (requires-python >=3.11), 3.13, and the newest release (3.15), so both
    # ends of the supported range are exercised rather than merely asserted. A
    # 5.*.x maintenance branch tests 3.10 from its own copy of this file (see the
    # note above `on:`), not from this one.
    # The main-PR leg must stay exactly ["3.13"]: branch protection requires the
    # context "test-fast (3.13)" (see the header of this file).
    needs: cassette-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') && fromJSON('["3.13"]') || fromJSON('["3.11", "3.13", "3.15"]') }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      if: matrix.python-version != '3.15'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # setup-python's 3.15 builds (3.15.0 to 3.15.2) ship without the C `_decimal`
    # extension: CPython 3.15 no longer bundles libmpdec, and those builds were
    # made without it. `decimal` then falls back to `_pydecimal`, which goes
    # through int<->str and hits the 4300-digit limit, so the 10,000-digit
    # fraction cases in test_issue_1766.py fail there and nowhere else. uv's
    # Python builds include `_decimal`. The venv is seeded with pip so every
    # later step runs the same `python -m pip` commands on all three legs.
    - name: Set up Python 3.15 (uv build, with _decimal)
      if: matrix.python-version == '3.15'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Create the 3.15 venv
      if: matrix.python-version == '3.15'
      run: |
        uv venv --seed --managed-python --python 3.15 "$RUNNER_TEMP/py315"
        echo "$RUNNER_TEMP/py315/bin" >> "$GITHUB_PATH"

    # Fails loudly instead of letting a build without the C decimal module turn
    # into four "needs the SEC" findings in the offline audit below.
    - name: Check the interpreter has the C decimal module
      run: python -c "import sys, _decimal; print(sys.version)"

    # The 3.13 leg (the one pull requests run) also installs the `cloud` and
    # `data` extras, so the tests that importorskip fsspec, duckdb and zstandard
    # run instead of skipping: 4 of the 9 skips on 2026-11-22. The 3.11 floor
    # leg keeps the bare `.[ai]` install, so the library is still tested
    # without them. 3.15 does too: zstandard has no 3.15 wheel yet (0.25.0), and
    # building it from source there is not what that leg is for.
    - name: Install dependencies
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        python -m pip install --upgrade pip
        if [ "$PYTHON_VERSION" = "3.13" ]; then
          python -m pip install -e ".[ai,cloud,data]"
        else
          python -m pip install -e ".[ai]"
        fi
        python -m pip install pytest pytest-cov pytest-env pytest-xdist pytest-asyncio pytest-retry pytest-mock pytest-vcr "vcrpy>=8.3.0,<9" freezegun==1.5.1 filelock tqdm responses

    # The floor leg installs the declared pandas floor itself, so both majors
    # stay under test and the floor in pyproject.toml is a tested version, not
    # a claim: the 3.13 leg resolves to pandas 3.x. Keep this pin equal to the
    # pandas floor in pyproject.toml.
    - name: Pin the pandas floor on the floor leg
      if: matrix.python-version == '3.11'
      run: python -m pip install "pandas==2.2.2"

    # A source scan, so it runs here rather than as its own job: this is the
    # only context pull requests are required to report, and adding a second
    # required one means updating branch protection in lockstep (see the header
    # of this file). It is also why the check reads source instead of hooking
    # pytest — half the regression tree is network-marked and runs post-merge,
    # so a runtime hook would not see those tests on a pull request at all.
    - name: Check no regression test skips itself
      run: python scripts/check_regression_skips.py

    # Same reasoning, different property: a regression test has to name the bug
    # it guards, or nobody can answer "is this still reachable?" and the tree can
    # never be pruned. Static like the check above, and for the same reason — it
    # has to see the post-merge half of the tree on a pull request.
    - name: Check every regression test names its bug
      run: python scripts/check_regression_provenance.py

    # The one check here that has to RUN the tests rather than read them: no
    # source scan can tell whether a test reaches the SEC, because the answer
    # depends on what the restored HTTP cache happens to be holding. Sockets
    # are blocked instead, which gives the same answer twice.
    #
    # Scoped to the branch's own test files on a pull request (seconds) and run
    # over the whole lane on push (~7 min), because a test can only become
    # network-dependent in a file the branch touched, and main is where a
    # source-side cause — a deleted cassette, say — gets caught. Not its own
    # job, for the branch-protection reason above.
    - name: Check no new test needs the SEC while marked fast
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          # The API, not `git diff`: this checkout is shallow, so no merge base
          # with the target branch exists to diff against. Only test modules
          # (pytest's test_*.py / *_test.py): a helper under tests/ collects
          # nothing, and the audit reads an empty run as a broken one (#1527).
          CHANGED=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^tests/(.*/)?(test_[^/]*|[^/]*_test)\.py$' | tr '\n' ' ' || true)
          if [ -z "$CHANGED" ]; then
            echo "No test files changed; nothing to audit."
            exit 0
          fi
          echo "Auditing changed test files: $CHANGED"
          python scripts/check_offline_audit.py $CHANGED
        else
          python scripts/check_offline_audit.py
        fi

    # A pull request that stages a 6.0 change (a deprecation, a will-raise
    # warning, "removed in 6.0") has to touch the current upgrade guide (docs/upgrade/6.1.md) in the same PR.
    # #1200/#1201 shipped 5.55.0 deprecations with no guide entry, and nothing
    # mechanical noticed (bead edgartools-07lk.14). Pull requests only: the check
    # reads the PR's diff, and main has no PR to read. Labels are read live
    # rather than from the event payload, so after adding `no-upgrade-guide`,
    # re-run this job instead of pushing an empty commit.
    - name: Check a staged 6.0 change updates the upgrade guide
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        set -euo pipefail
        gh api --paginate \
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
          --jq '.[] | {filename, status, patch} | tojson' > "$RUNNER_TEMP/pr_files.jsonl"
        PR_LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
          --jq '[.[].name] | join(",")') \
          python scripts/check_upgrade_guide.py "$RUNNER_TEMP/pr_files.jsonl"

    - name: Run fast tests
      run: |
        # Parallelize fast tests - safe, no SEC API calls.
        #
        # No `and not regression` here, unlike the network and slow jobs. The
        # regression tree is 1,746 tests and every one of them used to be
        # deselected on pull requests, so a PR could break any of them and merge
        # green (bead edgartools-07lk.21). conftest.py now classifies each as
        # fast or network by measurement, and the 934 offline ones gate here.
        # The network half still runs only in the Regression Tests workflow —
        # PRs must not hammer the SEC endpoint.
        #
        # Coverage only where it is read. A pull request never uploads it (the
        # upload below and the Combine Coverage job with its 65% floor run on
        # push), and --cov with branch coverage doubles this step: 273 s vs 577 s
        # locally at 4 workers (edgartools-07lk.26 step B).
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          pytest -rs -n auto -m 'fast'
        else
          pytest -rs -n auto --cov --cov-report=xml -m 'fast'
        fi

    # Section-boundary accuracy, gated on the pull requests that can move it
    # (bead edgartools-bdfuy.1). The two ratchets below pin how well section
    # extraction finds where each 10-K/10-Q item starts and ends: start/end rates
    # against the hand-labelled truth set (GH #1514), and the per-fixture set of
    # items whose slice swallows a later item's heading (#1511). Both are marked
    # slow, and test-slow skips pull requests, so until this step a change to
    # edgar/documents merged without either being measured and a regression
    # first showed up on main.
    #
    # Offline: they parse tracked fixtures only (html/, parity_gate/,
    # heldout_retired/); the gitignored era corpus is absent on CI and those
    # entries count as unmeasured, never as passing. --dist loadfile because each
    # file builds one module-scoped scoring fixture; -n auto made every worker
    # re-score the whole corpus (5:30 wall, 1,534 s CPU) where two workers, one
    # per file, take ~5:00 locally.
    #
    # Scoped by the PR's file list (the API, for the shallow-checkout reason
    # given above), and a step rather than its own job so it rides on the
    # required "test-fast (3.13)" context — a separate job would need branch
    # protection updated in lockstep (see the header of this file). The
    # workflow file itself is in the trigger list so that editing this step
    # exercises it.
    - name: Check section boundaries have not regressed
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        set -euo pipefail
        TRIGGERS=$(gh api --paginate \
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
          --jq '.[].filename' \
          | grep -E '^(edgar/documents/|tests/fixtures/(parser_corpus|html|parity_gate|heldout_retired)/|tests/meta/test_(boundary_truth|section_self_consistency_ratchet)\.py$|\.github/workflows/python-hatch-workflow\.yml$)' || true)
        if [ -z "$TRIGGERS" ]; then
          echo "No section-extraction code or corpus changed; boundary ratchets not needed."
          exit 0
        fi
        echo "Section-extraction inputs changed:"
        echo "$TRIGGERS"
        pytest -rs -m slow -n 2 --dist loadfile \
          tests/meta/test_boundary_truth.py \
          tests/meta/test_section_self_consistency_ratchet.py

    - name: Upload coverage data
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.python-version == '3.13' && github.event_name != 'pull_request'
      with:
        name: coverage-fast
        path: |
          .coverage
          coverage.xml
        include-hidden-files: true
        retention-days: 1

  test-network:
    # Network tests skip PRs — SEC API behavior doesn't change per-commit.
    # Runs on push to main, nightly schedule, and manual dispatch.
    if: github.event_name != 'pull_request'
    needs: cassette-gate
    runs-on: ubuntu-latest
    env:
      # Relocate the EDGAR data/cache dir into the workspace so it can be cached.
      # This only moves where the HTTP cache (_tcache) lives; it does NOT enable
      # local storage (that needs EDGAR_USE_LOCAL_DATA, which tests disable).
      EDGAR_LOCAL_DATA_DIR: ${{ github.workspace }}/.edgar-data

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: 'pip'

    # Persist the SEC HTTP cache across runs. Filing documents and XBRL under
    # /Archives/edgar/data are cached forever (see CACHE_RULES), so a warm cache
    # serves the bulk of the suite from disk instead of re-downloading from SEC.
    # run_id-suffixed key always writes a fresh entry; restore-keys warm-starts
    # from the most recent prior cache (monotonic, GH evicts LRU at the 10GB cap).
    - name: Restore SEC HTTP cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.edgar-data/_tcache
        key: edgar-tcache-network-${{ github.run_id }}
        restore-keys: |
          edgar-tcache-network-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[ai]"
        python -m pip install pytest pytest-cov pytest-env pytest-xdist pytest-asyncio pytest-retry pytest-mock pytest-vcr "vcrpy>=8.3.0,<9" freezegun==1.5.1 filelock tqdm responses

    - name: Run network tests
      run: |
        # Sequential - respects SEC rate limits. --enable-cache persists HTTP
        # responses to _tcache (immutable /Archives data cached forever).
        pytest -rs --cov --cov-report=xml -m 'network and not slow and not regression' --enable-cache

    - name: Upload coverage data
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-network
        path: |
          .coverage
          coverage.xml
        include-hidden-files: true
        retention-days: 1

  test-slow:
    # Slow tests skip PRs (often network-heavy). Push/schedule/dispatch only.
    if: github.event_name != 'pull_request'
    needs: cassette-gate
    runs-on: ubuntu-latest
    env:
      EDGAR_LOCAL_DATA_DIR: ${{ github.workspace }}/.edgar-data

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: 'pip'

    # Persist the SEC HTTP cache (see test-network for rationale).
    - name: Restore SEC HTTP cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.edgar-data/_tcache
        key: edgar-tcache-slow-${{ github.run_id }}
        restore-keys: |
          edgar-tcache-slow-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[ai]"
        python -m pip install pytest pytest-cov pytest-env pytest-xdist pytest-asyncio pytest-retry pytest-mock pytest-vcr "vcrpy>=8.3.0,<9" freezegun==1.5.1 filelock tqdm responses

    - name: Run slow tests
      run: |
        # Sequential - often network-heavy. --enable-cache persists HTTP responses.
        pytest -rs --cov --cov-report=xml -m 'slow and not regression' --enable-cache

    - name: Upload coverage data
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-slow
        path: |
          .coverage
          coverage.xml
        include-hidden-files: true
        retention-days: 1

  coverage:
    name: Combine Coverage
    # Only meaningful when the full suite ran (not on PRs).
    if: github.event_name != 'pull_request'
    needs: [test-fast, test-network, test-slow]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install coverage
      run: pip install coverage[toml]

    - name: Download coverage data (fast)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-fast
        path: coverage-fast/

    - name: Download coverage data (network)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-network
        path: coverage-network/

    - name: Download coverage data (slow)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-slow
        path: coverage-slow/

    - name: Combine coverage
      run: |
        # Move .coverage files with unique names
        mv coverage-fast/.coverage .coverage.fast
        mv coverage-network/.coverage .coverage.network
        mv coverage-slow/.coverage .coverage.slow

        # Combine all coverage data
        coverage combine

        # Generate report and check threshold
        coverage report --fail-under=65
        coverage xml -o combined-coverage.xml

    - name: Upload combined coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: combined-coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # A red `main` has to arrive somewhere a person looks.
  #
  # Ported from regression-tests.yml, which got this treatment in #999 after the
  # post-merge regression lane went red on 2026-08-08 and three more pull
  # requests merged through it before anyone noticed. THIS workflow never got
  # one, and it is the lane that carries more: the 65% coverage floor
  # (`coverage report --fail-under=65`), plus test-network, test-slow and
  # (test-strict-errors ran here too until 6.0 made its flag the only behaviour). All of them are post-merge only, none is a required check, and until now none of
  # them could tell anybody they had failed.
  #
  # Note what this deliberately does NOT do: make Combine Coverage required.
  # It cannot be. It `needs` test-network and test-slow, which are skipped on
  # pull requests, so a required Combine Coverage would never report and would
  # block every pull request forever — the deadlock described at the top of this
  # file. Reporting is the right mechanism for a check that cannot gate.
  #
  # `needs` names every post-merge job on purpose. A failure in test-network
  # SKIPS Combine Coverage rather than failing it, so keying on the coverage
  # result alone would stay silent for the failure that stops the threshold
  # being evaluated at all.
  #
  # Its own label and title, separate from regression-tests.yml's `red-main`.
  # Sharing one issue would have the two lanes fight over it — whichever went
  # green last would close an issue the other still needed open.
  report:
    name: Report red main (build)
    needs: [cassette-gate, test-fast, test-network, test-slow, coverage]
    # main only. A push to a 5.*.x maintenance branch also runs this workflow, and
    # a green one would otherwise CLOSE main's open red-main issue.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      LABEL: red-main-build
      TITLE: "Build and Test Edgartools is failing on main"
      R_GATE: ${{ needs.cassette-gate.result }}
      R_FAST: ${{ needs.test-fast.result }}
      R_NETWORK: ${{ needs.test-network.result }}
      R_SLOW: ${{ needs.test-slow.result }}
      R_COVERAGE: ${{ needs.coverage.result }}
    steps:
    - name: Ensure the tracking label exists
      run: |
        gh label create "$LABEL" --repo "$REPO" --color b60205 \
          --description "Post-merge build/coverage lane is red" 2>/dev/null || true

    - name: Decide whether the lane is red
      id: verdict
      run: |
        red=0
        for r in "$R_GATE" "$R_FAST" "$R_NETWORK" "$R_SLOW" "$R_COVERAGE"; do
          [ "$r" = "failure" ] && red=1
        done
        echo "red=$red" >> "$GITHUB_OUTPUT"

    - name: Open or update the tracking issue
      if: steps.verdict.outputs.red == '1'
      run: |
        number=$(gh issue list --repo "$REPO" --label "$LABEL" --state all \
                   --limit 1 --json number --jq '.[0].number // empty')
        # Name the job that failed. This lane has five, and "the build is red"
        # without saying which one sends the reader to the Actions tab to find
        # out — which is the step nobody takes.
        body=$(printf '%s\n\n- commit: %s\n- run: %s\n\n| job | result |\n| --- | --- |\n| Cassette safety gate | %s |\n| test-fast | %s |\n| test-network | %s |\n| test-slow | %s |\n| Combine Coverage (65%% floor) | %s |\n' \
                 "The post-merge build lane failed on \`main\`." "$SHA" "$RUN_URL" \
                 "$R_GATE" "$R_FAST" "$R_NETWORK" "$R_SLOW" "$R_COVERAGE")
        if [ -z "$number" ]; then
          gh issue create --repo "$REPO" --label "$LABEL" \
            --title "$TITLE" --body "$body"
        else
          gh issue reopen --repo "$REPO" "$number" 2>/dev/null || true
          gh issue comment --repo "$REPO" "$number" --body "$body"
        fi

    - name: Close the tracking issue when main is green again
      if: steps.verdict.outputs.red == '0'
      run: |
        number=$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
                   --limit 1 --json number --jq '.[0].number // empty')
        if [ -n "$number" ]; then
          gh issue close --repo "$REPO" "$number" \
            --comment "Green again at $SHA — $RUN_URL"
        fi
