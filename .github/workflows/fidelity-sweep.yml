# Weekly as-filed fidelity sweep over last week's 10-K, 10-Q, 20-F and 40-F filings.
#
# Runs scripts/fidelity_scorecard.py, which compares the library's facts and statements with
# the SEC's own rendering of each filing (the R*.htm pages), on a seeded sample of the last
# 7 days. The scorecard is a comment on one rolling `sweep:fidelity` issue; each new failure
# signature among filings whose check raised becomes its own issue. Value mismatches are in
# the scorecard's worst-filings table. See scripts/fidelity_sweep.py.

name: Fidelity sweep

on:
  schedule:
    - cron: '0 9 * * 3'   # Wednesdays 09:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Filing window in days, ending yesterday"
        default: "7"
      size:
        description: "Filings in the random draw (an industry top-up adds to it)"
        default: "60"
      dry_run:
        description: "Print what would be filed instead of filing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fidelity-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
    - name: Install edgartools
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
    - name: Sweep and file issues
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EDGAR_IDENTITY: "S Robinson Robinson@edgar.tools"
        DAYS: ${{ github.event.inputs.days || '7' }}
        SIZE: ${{ github.event.inputs.size || '60' }}
        DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      run: |
        python scripts/fidelity_sweep.py --days "$DAYS" --size "$SIZE" --out fidelity-run \
          --repo "${{ github.repository }}" $DRY_RUN
    - name: Keep the run's results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fidelity-sweep-${{ github.run_id }}
        path: fidelity-run/
        retention-days: 90
